[[release]]
title = "The chat-assistant skill"
version = "1.0.5"
date = "2026-09-15"
items = [
  "AIQT 1.0.5 ships the chat assistant: the AIQT governance core packaged for a chat assistant, as a Skill you upload to Claude or a portable instruction file for other assistants (ChatGPT, Copilot, Gemini). It guides the assistant toward the AIQT standard: claims matched to their sources, checks kept at full strength, and \"finished\" verified before it is said. The evidence page shows what has been tested on each platform.",
  "Includes the portable AIQT governance core and a curated security-rule subset for chat use.",
  "AIQT is open source under the Apache License 2.0: you may use, modify, and redistribute it freely, including commercially, and you keep your changes. If you redistribute it, you keep the licence, copyright, and NOTICE intact and state any significant changes you made, as the licence requires (Apache License 2.0, section 4). See LICENSE and NOTICE. Sharing an improvement back is Rule 5's voluntary Guardrail-Seed give-back, separate from the software licence.",
  "The standards crosswalk reproduces only third-party framework identifiers and short titles as uncopyrightable factual pointers, with attribution, and reproduces no framework specification prose. For a ShareAlike-licensed source such as OWASP, reproducing only these facts triggers no ShareAlike obligation, the same basis already used for CSA and ISO. Notices that a publisher's own terms require are retained in NOTICE (for example MITRE ATLAS under Apache-2.0, and the CWE Terms of Use). The pack's own Apache License 2.0 does not depend on any framework's terms.",
]
