# The registry of every run: step in .github/workflows/quality.yml, one [[check]] per step, judged by
# tools/check_ci_selection.py. Nothing selects or skips a step from it yet.
#
# job and step name the step (its job id and exact step name). categories and scope come from the
# closed lists in that gate. triggers are segment globs over tracked paths (`**` spans segments, `*`
# stays in one) whose change would select the step. weekly-only = true needs a
# weekly-only-authorization reference to the recorded maintainer authorization; no entry sets it.
#
# DRAFTS. Every entry below was generated from a static scan of the workflow and of the scripts each
# step runs (import closure, path literals and file walks), not from reading each check by hand, so
# every one carries reviewed = false. The scan does not follow a script launched as a subprocess or
# a path built at run time from data, so a trigger list can miss a real input. The scope decision
# step (it reads the whole diff) is declared whole-repo, and the one undetermined step carries `**`
# so it runs on every change until its inputs are declared by hand.

format-version = 1

[[check]]
job = "scope"
step = "Site fast-lane scope decision"
categories = ["ci"]
scope = "whole-repo"
triggers = ["**"]
reviewed = false

[[check]]
job = "scope"
step = "Child exit status observable (after the scope decision)"
categories = ["probe"]
scope = "probe"
triggers = ["opf/tools/_child_status.py"]
reviewed = false

