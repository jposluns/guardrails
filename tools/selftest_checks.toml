# Authoritative expectation manifest for registered self-test suites: the check ids that MUST execute on
# every run, reconciled as an exact set by tools/check_selftest_execution.py (and by the suite's own
# in-run self-guard) against the ids the instrumented check() choke point actually records.
#
# HAND-AUTHORED FROM SOURCE REVIEW. This file is NEVER regenerated from a runtime capture, and there is
# deliberately NO accept, update, or baseline command: a manifest generated from what a run emitted would
# drop an accidentally-unreachable check from BOTH sides of the comparison and stay green, which is the
# exact failure the gate exists to catch. When a check is added, removed, or renamed, this file is edited
# BY HAND in the same change, from the source; a mismatch on the corroborating run is resolved by
# re-reading the source, never by copying the run's output here.
format-version = 1

