<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}
  .card{position:relative;width:1200px;height:630px;background:radial-gradient(900px 620px at 1040px 560px,rgba(126,224,200,.3),rgba(126,224,200,0) 60%),radial-gradient(700px 500px at 120px 60px,rgba(29,111,208,.45),rgba(29,111,208,0) 60%),#08111f}
  .safe{position:absolute;left:120px;top:75px;width:960px;height:480px;display:flex;flex-direction:column;justify-content:center;gap:14px}
  .top{display:flex;justify-content:space-between;align-items:center;flex:0 0 auto}
  .text{display:flex;flex-direction:column;justify-content:center;gap:16px;width:592px}
  .artbox{width:340px;height:430px;display:flex;justify-content:flex-end;align-items:center;flex:none}
  .art{height:430px;max-width:340px;filter:drop-shadow(0 18px 28px rgba(0,0,0,.45))}
  .brand{margin:0;font-weight:800;line-height:1;letter-spacing:-.03em;text-shadow:0 4px 14px rgba(0,0,0,.4);white-space:nowrap;width:max-content}
  .brand .word{color:#5eb0ef}
  .brand b{color:#fbbf24;font-weight:800}
  .rule{height:6px;border-radius:3px;background:#fbbf24;margin:2px 0}
  .line{margin:0;font-weight:700;line-height:1.1;letter-spacing:-.015em;white-space:nowrap;width:max-content;text-shadow:0 2px 8px rgba(0,0,0,.35)}
  .lines{display:flex;flex-direction:column;gap:8px}
  .sub{margin:4px 0 0;font-size:27px;line-height:1.35;font-weight:400;color:rgba(255,255,255,.88);text-wrap:balance}
  .formula{margin:0;line-height:1;font-weight:800;letter-spacing:-.01em;white-space:nowrap;width:max-content;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6)}
  .formula .f{color:#fbbf24}.formula .g{color:#5eb0ef}
</style></head><body><div class="card"><div class="safe">
  <div class="top">
    <div class="text">
      <h1 class="brand" id="b"><span class="word">AIQT</span><b>.ai</b></h1>
      <div class="rule" id="r"></div>
      <div class="lines"><p class="line" id="l1">Rules your AI follows.</p><p class="line" id="l2">Controls that catch what slips.</p></div>
      <p class="sub" id="s">Rules for your chat assistant, enforcement controls for your codebase.</p>
    </div>
    <div class="artbox"><img class="art" src="illustration.svg" alt=""></div>
  </div>
  <p class="formula" id="f">(<span class="f">Accuracy</span> = <span class="f">Integrity</span> = <span class="f">Quality</span> = <span class="f">Trust</span>) <span class="g">&gt;</span> Progress <span class="g">&gt;</span> Speed <span class="g">&gt;</span> Cost</p>
</div></div>
<script>
  const width=el=>el.getBoundingClientRect().width;
  const fit=(el,target,cap,floor)=>{let s=cap; el.style.fontSize=s+'px'; while(width(el)>target && s>floor){s-=1; el.style.fontSize=s+'px'} return s};
  const b=document.getElementById('b'); const bs=fit(b,592,112,60); const W=width(b); document.getElementById('r').style.width=W+'px';
  const l1=document.getElementById('l1'), l2=document.getElementById('l2'); const ls=Math.min(fit(l1,592,48,20),fit(l2,592,48,20)); l1.style.fontSize=ls+'px'; l2.style.fontSize=ls+'px';
  const f=document.getElementById('f'); const fsz=f?fit(f,960,40,20):null; const sub=document.getElementById('s'); if(sub.getAttribute('style')) fit(sub,592,30,18);
  window.__m={brand:bs,brandW:Math.round(W),line:ls,formula:fsz};
</script></body></html>
