# Declared inputs of every gate in tools/run_all_checks.sh, read by tools/affected_gates.py.
#
# HAND-REVIEWED FROM SOURCE. Every runner gate has exactly one [gate.<name>] entry and every entry
# names a runner gate; the selector refuses (exit 2) any difference. An entry declares inputs (globs),
# whole-tree = true (any changed path selects it) and/or always = true (selected whatever changed),
# with its reason. Narrowed inputs list the gate's scripts, their literal local import closure (the
# selector's self-test holds that closure covered) and the data the gate reads, as established by a
# static review of each gate and held against observation: the affected-gates-observed gate
# (affected_gates.py --observe-inputs) runs every narrowed gate once, in a copy built from the index,
# under a Python audit hook and wrapped metadata functions, and fails on any read, metadata-only
# probe (existence, type, mode, size, timestamps), directory listing or launch of a repository path
# an entry does not cover. A gate whose boundary was not established, whose reads follow its input,
# or that launches a non-Python child in or on the repository (whose reads the hook cannot see) is
# whole-tree or always.
# Globs are repository-relative and case-sensitive: * and ? stay in one component, ** spans
# components. A gate with new reads needs its entry updated in the same change.
format-version = 1

# A change to any of these selects the entire roster: the runner, the selector, these declarations
# and the roster loader.
full-roster = [
  "tools/run_all_checks.sh",
  "tools/affected_gates.py",
  "tools/affected_gates.toml",
  "tools/check_ci_parity.py",
]

# Reviewed path domains: a changed path outside every domain has no declaration to show any gate
# unaffected, so it selects the entire roster (every gate and, through them, every registered suite).
[[domain]]
path = ".aiqt/"
owner = "the rule corpus, standards, registers and release records (corpus, generator and release gates)"

[[domain]]
path = ".baseline/"
owner = "the site baseline pins and palette check (baseline-pin, palette gates)"

