reason = "whole-tree: the gate enumerates the working tree or the tracked surface (or reads paths its data names)"

[gate.git-option-table-selftest]
inputs = [
  ".aiqt/core/hooks/scripts/aiqt_hooks.py",
  "tools/check_git_option_table.py",
]
reason = "inputs: the gate's scripts, their local import closure and the data the gate reads"

[gate.git-option-table]
always = true
reason = "always: depends on an installed tool or the host (versions, toolchain), which no changed path represents; it reads the installed git's option tables"

[gate.dangerous-api-selftest]
whole-tree = true
reason = "whole-tree: the self-test also judges the live tree, or its dependency boundary is not established"

[gate.dangerous-api]
whole-tree = true
reason = "whole-tree: the gate enumerates the working tree or the tracked surface (or reads paths its data names)"

[gate.qa-adapter-selftest]
whole-tree = true
reason = "whole-tree: it launches a non-Python child (git, bash, sh or another binary) in or on the repository, whose reads the audit hook cannot see"

[gate.audit-reference-selftest]
inputs = [
  ".aiqt/assurance.toml",
  "tools/_entry_restore_selftest.py",
  "tools/_git_fixture_env.py",
  "tools/_qa_adapter.py",
  "tools/audit_reference.py",
]
reason = "inputs: the gate's scripts, their local import closure and the data the gate reads"

[gate.internal-names-selftest]
whole-tree = true
reason = "whole-tree: the self-test also judges the live tree, or its dependency boundary is not established"

[gate.internal-names]
whole-tree = true
reason = "whole-tree: the gate enumerates the working tree or the tracked surface (or reads paths its data names)"

[gate.review-labels-selftest]
whole-tree = true
reason = "whole-tree: the self-test also judges the live tree, or its dependency boundary is not established"

[gate.review-labels]
always = true
whole-tree = true
reason = "always and whole-tree: judges every line added since the merge base with origin/main, in any file"

[gate.affected-gates-selftest]
whole-tree = true
reason = "whole-tree: the self-test holds every tracked path to a reviewed domain"

[gate.affected-gates-observed]
whole-tree = true
reason = "whole-tree: it runs every narrowed gate, so it reads whatever those gates read, and copies the whole tree"

[gate.qa-advisory-digest]
always = true
reason = "always: reads refs and the surfaces .aiqt/assurance.toml declares"
