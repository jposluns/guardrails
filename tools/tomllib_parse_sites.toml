# The tomllib parse-site table read by the tomllib leg of tools/check_python_floor.py (see its docstring).
# A tomllib.load or tomllib.loads call that is not HANDLED in its own function (per class, for each of
# RecursionError, MemoryError and ValueError, the FIRST handler that would catch it must be readable and
# must dispose of it without a possible re-raise) must have one row here: class CALLER names the function
# in the same file whose handler covers the call (the callee is matched by its full qualified name), and
# class EXEMPT gives a reason from the closed vocabulary test-code, self-emitted-bytes, already-validated
# or valueerror-passthrough (call forms only; the scan verifies that the deciding handler's only re-raise
# is the single statement of `if isinstance(<bound name>, ValueError): raise`, so nothing but the
# ValueError family can escape to the callers the site's docstring binds). A form the scan cannot resolve
# (form alias) is EXEMPT only. count is the number of unhandled calls or forms in that function; a row
# whose function no longer holds one, or holds another number, fails the gate.

