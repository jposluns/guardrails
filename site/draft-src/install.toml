# The aiqt.ai draft install page: the prompt for a development assistant first, then the skill download in
# 1 line with a link to the step-by-step page (install/details/, not in the nav), then OPF.
path = "install/index.html"
title = "Install"
kind = "document"
label = "Install"
heading = "Add AIQT to your AI development assistant"
meta = "Give your development assistant 1 prompt and it installs AIQT and walks you through adoption, with OPFiles for your project's records. Using a chat assistant? Download the skill."

[[body]]
component = "label"
text = "Copy this prompt"

[[body]]
component = "code"
id = "install-prompt"
variant = "prompt-block"
text = "Install AIQT Guardrails in this project and walk me through adopting it. Read https://aiqt.ai/llms.txt and the repository https://github.com/jposluns/guardrails first. Propose an adoption plan: the AIQT rules, hooks, and checks that fit this project's languages and tools, and OPFiles (https://opfiles.ai/llms.txt) for the project's operational records unless I opt out. Before building any new guardrail, check whether jposluns/guardrails already has one that fits. Name every file you would create or change, and why. Change nothing until I approve the plan."
note = "Paste it into Claude Code, Codex, Gemini CLI, Cursor, Copilot, or any other development assistant."

[[body]]
component = "section"
lbl = "Chat assistants"
heading = "Or add the skill"
id = "skill"

[[body]]
component = "prose"
html = '''<p><a href="/downloads/aiqt-skill-1.0.6.zip">Download the AIQT skill</a> (zip, 28 KB) and install it the way your AI assistant installs any skill. <a href="$BASE/install/details/">Step-by-step instructions for each assistant</a>, and the instruction file for assistants without skills.</p>'''

[[body]]
component = "section"
lbl = "Included"
heading = "OPFiles keeps your project's records straight"
id = "opf"

[[body]]
component = "prose"
html = '''<p>OPFiles (OPF) is part of AIQT Guardrails, with its own site at <a href="https://opfiles.ai" target="_blank" rel="noopener noreferrer">opfiles.ai<span class="vh"> (opens in a new tab)</span></a>. It keeps your backlog, findings, decisions, and handoffs in one machine-written source, generates the readable versions from it, and fails the build when the 2 disagree. Your assistant always knows what was decided and what is still open, and it significantly cuts errors.</p><p>An AIQT adoption sets up OPF by default. It is optional: say so in your plan review and the adoption skips it, and you can add it later.</p>'''

[[body]]
component = "section"
lbl = "Requirements"
heading = "What it needs"
id = "code"

[[body]]
component = "prose"
html = '''<p>The pack's tools and hooks require Python 3.14 or newer; <a href="/development">the development assistant page</a> has the detail. The chat skill needs no Python.</p>'''

[[body]]
component = "prose"
html = '''<p>Planning for a team? See <a href="$BASE/future/">what is coming for teams and enterprises</a>.</p>'''

[[body]]
component = "section"
lbl = "Claude Code"
heading = "Install the hooks without the plugin"
id = "hooks"

[[body]]
component = "prose"
html = '''<p>The 30 Claude Code hooks ship inside the repository as an opt-in plugin under <code>plugin/aiqt-guardrails-hooks/</code>. The shipped surface is <code>hooks/hooks.json</code> (the hook registrations), <code>hooks/scripts/aiqt_hooks.py</code> (the dispatcher, standard library only, offline), and <code>.claude-plugin/plugin.json</code> (the plugin manifest). Each registration runs <code>python3 -I ${CLAUDE_PLUGIN_ROOT}/hooks/scripts/aiqt_hooks.py</code> with 1 control name as its argument and <code>"timeout": 10</code>, and the hook reads its JSON payload on stdin. You can register the same hooks by hand, without the plugin:</p>'''

[[body]]
component = "steps"
items = [
    '''<strong>Copy the plugin directory into your project.</strong> Copy <code>plugin/aiqt-guardrails-hooks/</code> from <a href="https://github.com/jposluns/guardrails" target="_blank" rel="noopener noreferrer">jposluns/guardrails<span class="vh"> (opens in a new tab)</span></a> into your project tree.''',
    '''<strong>Read the registrations.</strong> <code>hooks/hooks.json</code> lists each hook under its event (<code>PreToolUse</code>, <code>PostToolUse</code>, <code>UserPromptSubmit</code>, <code>Stop</code>, <code>SessionStart</code>, or <code>TeammateIdle</code>) with its <code>matcher</code>, its control name, and <code>"timeout": 10</code>.''',
    '''<strong>Register each hook in your project's <code>.claude/settings.json</code></strong> under the same event and matcher, replacing <code>${CLAUDE_PLUGIN_ROOT}</code> with the path you copied the plugin to. This repository wires 1 of its own hooks exactly that way: its <code>.claude/settings.json</code> runs <code>python3 -I "$CLAUDE_PROJECT_DIR"/plugin/aiqt-guardrails-hooks/hooks/scripts/aiqt_hooks.py gensrc_guard</code> on the matcher <code>Write|Edit|MultiEdit|Bash</code> with <code>"timeout": 10</code>.''',
    '''<strong>Meet the Python floor.</strong> <a href="#code">What it needs</a> above states the Python the pack's tools and hooks require. On an older Python a hook does not run its check, so install a supported Python first.''',
]

[[body]]
component = "section"
lbl = "Support"
heading = "Help, problem reports, and new releases"
id = "support"

[[body]]
component = "prose"
html = '''<p>Questions and problem reports go through <a href="https://github.com/jposluns/guardrails/issues" target="_blank" rel="noopener noreferrer">the GitHub issues page of jposluns/guardrails<span class="vh"> (opens in a new tab)</span></a>. New releases and their notes appear on <a href="https://github.com/jposluns/guardrails/releases" target="_blank" rel="noopener noreferrer">the GitHub releases page<span class="vh"> (opens in a new tab)</span></a>. Those 2 pages are the existing channels; the project runs no separate support service.</p>'''

[[body]]
component = "next"
html = "What AIQT holds your assistant to."
text = "The standard"
href = "standard/"
