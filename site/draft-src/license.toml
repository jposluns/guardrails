text = "The licence"

[[body]]
component = "prose"
html = '''<p>The licence covers the pack's own content and code, including its crosswalk mappings. Read <a href="https://github.com/jposluns/guardrails/blob/main/LICENSE" target="_blank" rel="noopener noreferrer">the licence file<span class="vh"> (opens in a new tab)</span></a> in the repository, or <a href="https://www.apache.org/licenses/LICENSE-2.0" target="_blank" rel="noopener noreferrer">the canonical licence text<span class="vh"> (opens in a new tab)</span></a>.</p>'''

[[body]]
component = "section"
