heading = "Parts under a different licence"

[[body]]
component = "prose"
html = '''<ul><li>CommonMark specification examples 0.31.2, a test fixture vendored unchanged: CC BY-SA 4.0 (<a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener noreferrer">licence text<span class="vh"> (opens in a new tab)</span></a>).</li><li>Marko 2.2.4, a CommonMark parser vendored unchanged: MIT (<a href="https://github.com/jposluns/guardrails/blob/main/opf/tools/_vendor/licenses/marko-MIT.txt" target="_blank" rel="noopener noreferrer">licence text<span class="vh"> (opens in a new tab)</span></a>).</li><li>Shared site template (baseline package) 1.11.1, a pinned copy of the site template's runtime and licence files: CC0 1.0 Universal, except the fonts and marks named below (<a href="https://creativecommons.org/publicdomain/zero/1.0/" target="_blank" rel="noopener noreferrer">licence text<span class="vh"> (opens in a new tab)</span></a>).<ul><li>The 4 fonts (Newsreader, Public Sans, JetBrains Mono, Dancing Script) are licensed by their authors under the SIL Open Font License 1.1; each family's licence file is copied beside the fonts.</li><li>The card builder's 3 Inter fonts (Regular, Bold and ExtraBold, in .baseline/card-fonts/, Copyright (c) 2016 The Inter Project Authors), used only to build the link-preview cards and never served, are licensed by their authors under the SIL Open Font License 1.1; their licence file is copied beside them.</li><li>The GitHub Invertocat, LinkedIn [in] bug and ORCID iD marks are trademarks of their owners, used under their owners' terms as recorded in marks/NOTICE.md, and are not part of the CC0 grant.</li></ul></li><li>Framework identifiers and titles in the crosswalk mappings stay under each publisher's terms. CSA uses a proprietary reference licence, and ISO/IEC a proprietary one. MITRE ATLAS is under the Apache License 2.0, and CWE under the CWE Terms of Use. NIST's works are in the public domain. OWASP uses CC BY-SA 4.0, with the MCP Top 10 under CC BY-NC-SA 4.0 (<a href="https://github.com/jposluns/guardrails/blob/main/NOTICE" target="_blank" rel="noopener noreferrer">NOTICE<span class="vh"> (opens in a new tab)</span></a>).</li></ul>'''

