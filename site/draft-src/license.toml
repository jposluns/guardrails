# The aiqt.ai draft licence page (template specification section 7.16): the h1 is the licence's name, the
# parts are named from NOTICE and the summary reads its clause numbers from LICENSE.
path = "license/index.html"
title = "Licence"
kind = "document"
label = "Licence"
heading = "Apache License 2.0"
meta = "AIQT Guardrails is published under the Apache License 2.0, except vendored third-party material, which remains under its own terms. The licence text is the authority; this page summarizes it."

[[body]]
