[[body]]
component = "prose"
html = '''<p>Each contributor grants you a perpetual, worldwide, non-exclusive, no-charge, royalty-free, irrevocable copyright licence to reproduce, prepare derivative works of, publicly display, publicly perform, sublicense, and distribute the work, in source or object form (section 2).</p><p>Each contributor also grants you a patent licence to make, use, sell, import, and otherwise transfer the work (section 3). It covers only the patent claims of that contributor that their contribution, alone or combined with the work, necessarily infringes.</p><p>You may reproduce and distribute copies, with or without changes, under the conditions of section 4:</p><ul><li>give every recipient a copy of the licence (4(a));</li><li>make modified files carry prominent notices stating that you changed them (4(b));</li><li>keep all copyright, patent, trademark, and attribution notices from the source form, other than notices that do not pertain to your derivative work (4(c));</li><li>where the work includes a NOTICE file, include a readable copy of its attribution notices, other than those that do not pertain to your derivative work, in a NOTICE file, in the source or documentation, or in a display where third-party notices normally appear (4(d)).</li></ul><p>You may add your own copyright statement and different licence terms for your own changes, provided that your use of the work otherwise meets the licence (section 4).</p><p>A contribution you submit for inclusion is under the same licence, unless you explicitly state otherwise (section 5).</p><p>Key limits: the patent licence ends for you on the date you file patent litigation claiming that the work infringes a patent (section 3). The licence grants no trademark rights beyond reasonable and customary use in describing the work's origin and reproducing the NOTICE file (section 6).</p><p>Unless applicable law requires otherwise or it is agreed in writing, the work is provided as is, without warranties or conditions of any kind (section 7). With the same exceptions, contributors are not liable for damages arising from its use (section 8).</p><p>You may offer support, a warranty or other liability to others, and charge a fee for it (section 9). If you do, you act on your own behalf and must indemnify each contributor for it.</p><p>AIQT and AIQT Guardrails are trademarks of Jeff Posluns (registration pending), as the NOTICE file states.</p><p>The licence text governs; this is a summary, not legal advice.</p>'''

