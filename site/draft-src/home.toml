[[body]]
component = "hero"
kicker = "Rules for your chat assistant, enforcement controls for your codebase."
statement = "Rules your AI follows. <em>Controls that catch what slips.</em>"
two = true
intro = "An assistant sounds just as confident when it guesses as when it knows, and \"done\" often means the happy path ran once. AIQT holds it to 1 standard, Accuracy, Integrity, Quality, and Trust, above progress, speed, and cost: claims are checked or labelled, shortcuts are surfaced, and done means the stated bar was met. In Claude Code, an opt-in plugin of 30 hooks blocks or warns on the actions it is built to catch.<span class=\"ordering\"><span class=\"tier\">(Accuracy = Integrity = Quality = Trust)</span> &gt; <span class=\"p\">Progress</span> &gt; <span class=\"s\">Speed</span> &gt; <span class=\"c\">Cost</span></span>"
start_text = "Set up in chat"
start_href = "install/"

[[body]]
