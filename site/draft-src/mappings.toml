[[body]]
component = "prose"
html = "<p>The register lists every rule and the shipped mechanical controls linked to it. A link records that a control exists, not how much of the rule it covers, so none of the statuses means a rule is enforced.</p>\n<p>Of 133 rules, 17 are gate-linked, 25 are hook-linked or preview only, and 91 have no control.</p>\n<p><a href=\"/enforcement\">Read the enforcement register</a></p>"

