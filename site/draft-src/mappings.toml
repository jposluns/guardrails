html = "<p>Every mapped identifier is validated against a pinned-edition manifest before it can ship.</p>"

[[body]]
component = "section"
lbl = "Methodology and limits"
id = "methodology"
heading = "How the crosswalk is built"
rail = "Methodology and limits"

[[body]]
component = "prose"
html = "<p>The mappings are part of the rules themselves. Each mapped rule records the framework identifiers it maps to, and continuous integration checks every one against a pinned-edition manifest of that framework's identifiers.</p><ul><li><strong>5 relation kinds.</strong> A rule supports a control, aligns with guidance, addresses a risk, mitigates a technique, or mitigates a weakness.</li><li><strong>Each mapping carries its fit.</strong> A tight mapping is a direct, 1-to-1 correspondence; a broad mapping is a looser, thematic relation.</li><li><strong>Identifiers and published titles only.</strong> No further specification prose, requirement text, control or clause bodies, figures, or tables from any framework are reproduced.</li><li><strong>What absence means.</strong> The absence of a mapping means no mapping has been asserted yet. A pinned edition may lag a framework's most recent release.</li></ul>"

[[body]]
component = "scope"
html = "A mapping asserts a relationship of ideas, not certification against a standard. No framework publisher endorses, sponsors, or is affiliated with this pack."

[[body]]
component = "section"
lbl = "Registry"
id = "registry"
heading = "Framework registry"
rail = "Framework registry"

[[body]]
component = "prose"
html = "<p>Each framework is pinned to a single edition.</p>"

