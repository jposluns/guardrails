<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIQT Guardrails</title>
<style>
  :root,:root[data-theme="dark"]{--bg:#0b1220;--ink:#e6edf3;--muted:#9fb0c3;--accent:#5eb0ef;--accent-2:#7ee0c8;--on-accent:#08111f;--line:#1e2c44;--panel:#111b2e}
  :root[data-theme="light"]{--bg:#f7f9fc;--ink:#101828;--muted:#41506a;--accent:#1d6fd0;--accent-2:#0d9488;--on-accent:#ffffff;--line:#e2e8f2;--panel:#ffffff}
  @media (prefers-color-scheme:light){:root:not([data-theme]){--bg:#f7f9fc;--ink:#101828;--muted:#41506a;--accent:#1d6fd0;--accent-2:#0d9488;--on-accent:#ffffff;--line:#e2e8f2;--panel:#ffffff}}
  *{box-sizing:border-box}
  body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex;min-height:100vh;margin:0;align-items:center;justify-content:center;
    background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
  main{text-align:center;padding:2rem;max-width:640px}
  .eyebrow{color:var(--accent-2);font-weight:800;letter-spacing:.14em;text-transform:uppercase;
    font-size:1.12rem;margin:0 0 1rem}
  h1{font-weight:750;letter-spacing:-.02em;font-size:clamp(2.6rem,7vw,4rem);margin:0 0 1.2rem}
  p{color:var(--muted);font-size:1.28rem;margin:0 0 1rem}
  .draft{margin-top:2rem}
  .draft a{display:inline-block;padding:.75rem 1.5rem;border-radius:10px;font-weight:650;
    background:var(--accent);color:var(--on-accent);text-decoration:none}
  .draft a:hover{filter:brightness(1.08)}
  .note{font-size:1.07rem;color:var(--muted);margin-top:1.8rem}
  a{color:var(--accent)}
  .themetoggle{position:fixed;top:1rem;right:1rem;font:inherit;cursor:pointer;color:var(--muted);
    background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:.42rem .9rem;font-size:1rem;font-weight:650}
  .themetoggle:hover{border-color:var(--accent);color:var(--accent)}
</style>
<script>(function(){var t;try{t=localStorage.getItem("aiqt-theme");}catch(e){}if(t!=="light"&&t!=="dark"){t=(window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark";}document.documentElement.setAttribute("data-theme",t);})();</script>
<script src="/theme.js"></script>
</head>
<body>
<button id="themebtn" class="themetoggle" type="button" onclick="toggleTheme()">Theme</button>
<main>
  <p class="eyebrow">Accuracy &middot; Integrity &middot; Quality &middot; Trust</p>
  <h1>AIQT Guardrails</h1>
  <p>A standard that holds your AI assistant to its word. Launching soon.</p>
  <div class="draft"><a href="/draft">You may view the DRAFT site for now</a></div>
  <p class="note">The GitHub repository goes public at launch.</p>
</main>
</body>
</html>
