<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AIQT Guardrails card</title>
<style>
  /* AIQT Guardrails link-preview card, 1200x630.
     Palette from site/styles.css: bg #0b1220, ink #e6edf3, muted #9fb0c3,
     accent blue #5eb0ef, accent teal #7ee0c8, line #1e2c44. */
  html,body{margin:0;padding:0}
  body{
    width:1200px;height:630px;overflow:hidden;position:relative;
    background:#0b1220;
    font-family:Inter,ui-sans-serif,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  /* soft light in the mark's colours: blue glow behind the text block,
     teal counter-glow low right, like the site hero's two-colour atmosphere */
  .glow{position:absolute;inset:0;background:
    radial-gradient(820px 460px at 32% 40%, rgba(94,176,239,.18), transparent 70%),
    radial-gradient(700px 420px at 88% 92%, rgba(126,224,200,.13), transparent 70%),
    radial-gradient(560px 320px at 12% -10%, rgba(94,176,239,.10), transparent 70%);}
  /* fine graph-paper grid, same 72px rhythm as the site hero, very low opacity */
  .grid{position:absolute;inset:0;background:
    repeating-linear-gradient(90deg, rgba(159,176,195,.045) 0 1px, transparent 1px 72px),
    repeating-linear-gradient(0deg,  rgba(159,176,195,.045) 0 1px, transparent 1px 72px);}
  /* gentle vignette so the edges fall away and the centre carries the light */
  .vignette{position:absolute;inset:0;background:
    radial-gradient(1500px 820px at 50% 42%, transparent 52%, rgba(0,0,0,.40) 100%);}
  /* large faint AIQT mark, cropped by the right edge, for depth */
  .markbg{position:absolute;right:-200px;top:-110px;width:860px;height:860px}
  header{position:absolute;left:120px;top:75px;display:flex;align-items:center;gap:24px}
  /* glass tile so the mark stands out from the navy */
  #tile{width:84px;height:84px;box-sizing:border-box;border-radius:19px;flex:0 0 auto;
    display:grid;place-items:center;
    background:linear-gradient(160deg, rgba(230,237,243,.13), rgba(230,237,243,.05));
    border:1px solid rgba(230,237,243,.22);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10), 0 10px 30px rgba(0,0,0,.35);}
  #tile svg{display:block;width:80px;height:80px}
  #name{font-weight:700;font-size:32px;color:#e6edf3;letter-spacing:.015em}
  #headline{position:absolute;left:120px;top:228px;width:960px;
    font-weight:800;color:#e6edf3;letter-spacing:-.022em;line-height:1.1;
    text-wrap:balance;
    text-shadow:0 2px 24px rgba(11,18,32,.55);}
  #subline{position:absolute;left:120px;top:478px;width:960px;
    font-weight:400;font-size:34px;color:#9fb0c3;letter-spacing:.002em;line-height:1.3;}
</style>
</head>
<body>
<div class="glow"></div>
<div class="grid"></div>
<div class="markbg" aria-hidden="true">
  <svg viewBox="0 0 100 100" width="860" height="860" xmlns="http://www.w3.org/2000/svg">
    <g font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-weight="800" font-size="38" text-anchor="middle">
      <text x="35" y="47" fill="#5eb0ef" opacity=".09">A</text>
      <text x="67" y="47" fill="#7ee0c8" opacity=".09">I</text>
      <text x="35" y="88" fill="#5eb0ef" opacity=".09">Q</text>
      <text x="67" y="88" fill="#7ee0c8" opacity=".09">T</text>
    </g>
  </svg>
</div>
<div class="vignette"></div>
<header>
  <div id="tile">
    <svg viewBox="0 0 100 100" width="84" height="84" xmlns="http://www.w3.org/2000/svg">
      <g font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-weight="800" font-size="38" text-anchor="middle">
        <text x="35" y="47" fill="#5eb0ef">A</text>
        <text x="67" y="47" fill="#7ee0c8">I</text>
        <text x="35" y="88" fill="#5eb0ef">Q</text>
        <text x="67" y="88" fill="#7ee0c8">T</text>
      </g>
    </svg>
  </div>
  <div id="name">AIQT Guardrails</div>
</header>
<div id="headline">One standard your AI follows, enforced.</div>
<div id="subline">Open-source rules and controls for coding assistants.</div>
<script>
/* Fit the headline programmatically: largest font size (never below 64px) whose
   widest rendered line stays within 960px at no more than 2 lines, then centre
   the headline + subline group vertically between header and safe-area bottom. */
(function(){
  var h=document.getElementById('headline');
  function widest(){
    var r=document.createRange(); r.selectNodeContents(h);
    var w=0, cr=r.getClientRects();
    for(var i=0;i<cr.length;i++){ if(cr[i].width>w) w=cr[i].width; }
    return w;
  }
  function lineCount(){
    var r=document.createRange(); r.selectNodeContents(h);
    return r.getClientRects().length;
  }
  function fits(s){
    h.style.fontSize=s+'px';
    return widest()<=960 && lineCount()<=2;
  }
  var lo=64, hi=180, best=64;
  if(fits(64)){
    for(var i=0;i<22;i++){
      var mid=(lo+hi)/2;
      if(fits(mid)){ best=mid; lo=mid; } else { hi=mid; }
    }
  }
  h.style.fontSize=Math.floor(best)+'px'; fits(Math.floor(best));
  var sub=document.getElementById('subline');
  var top=159+24, bottom=555;
  var hh=h.getBoundingClientRect().height, sh=sub.getBoundingClientRect().height;
  var gap=34, block=hh+gap+sh;
  var y=Math.round(top+(bottom-top-block)/2);
  h.style.top=y+'px';
  sub.style.top=Math.round(y+hh+gap)+'px';
})();
</script>
</body>
</html>
