# .aiqt/license-qualification.toml: the licence-qualification gate configuration read by
# tools/check_license_qualification.py (class 3, licence-waiver contradiction).
#
# licence: the project's declared licence identity, an identity from the gate's closed
# LICENCE_IDENTITIES table. The gate VERIFIES the declaration against the licence file (exactly one of
# LICENSE, LICENSE.md, LICENSE.txt, COPYING may be present; one leading U+FEFF byte-order mark is
# dropped before it is read): that identity's canonical opening must be the file's LEADING non-blank
# text, ending on a complete token boundary, and no other identity's opening may appear anywhere in
# the file (markdown emphasis, heading, list, and blockquote markers are read as spaces). A declared
# rights-waiving identity (CC0-1.0, Unlicense) must further be the WHOLE canonical text of that
# licence, token for token and case-insensitively, with only whitespace tolerated. An absent
# key falls back to inference only for a rights-RESERVING identity whose opening leads the file; a
# rights-waiving identity is NEVER inferred and must be declared here; anything else is
# cannot-evaluate (exit 2).
#
# Each [[exception]] row excuses EXACTLY ONE waiver-phrase occurrence on ONE scanned surface and MUST
# carry these keys:
#   path        the repo-relative POSIX path of the scanned surface the occurrence sits on
#   phrase      the excused phrase, a member of the closed WAIVER_PHRASES list in the gate
#   reason      a nonempty explanation of why this occurrence is not a rights-waiver claim
# and exactly ONE binder:
#   line        the exact text of the line the occurrence starts on (trailing CR/LF excluded)
#   occurrence  the 1-based index of that phrase's match within that file, in position order
# A row that matches no present occurrence is STALE and the gate is cannot-evaluate (exit 2), under a
# rights-waiving licence too (rows are validated whether or not class 3 scans); a second
# occurrence beside an excused one still flags. An absent file means no declaration and no exceptions
# (adopters own their configuration, like .aiqt/newtab.toml); a present but malformed file is
# cannot-evaluate (exit 2), never a clean pass. This repository declares the licence identity and
# excuses only the draft licence pages' statements of the vendored site template's own licence.
# On each page both cc0 occurrences sit on one line, and two rows with the same line binder are a
# duplicate (exit 2), so the first row binds that whole line and the second binds by occurrence: any
# edit to that line leaves the first row stale.

licence = "Apache-2.0"

[[exception]]
path = "site/draft/license/index.html"
phrase = "cc0"
line = "<ul><li>CommonMark specification examples 0.31.2, a test fixture vendored unchanged: CC BY-SA 4.0 (<a href=\"https://creativecommons.org/licenses/by-sa/4.0/\" target=\"_blank\" rel=\"noopener noreferrer\">licence text<span class=\"vh\"> (opens in a new tab)</span></a>).</li><li>Marko 2.2.4, a CommonMark parser vendored unchanged: MIT (<a href=\"https://github.com/jposluns/guardrails/blob/main/opf/tools/_vendor/licenses/marko-MIT.txt\" target=\"_blank\" rel=\"noopener noreferrer\">licence text<span class=\"vh\"> (opens in a new tab)</span></a>).</li><li>Shared site template (baseline package) 1.7.0, a pinned copy of the site template's runtime and licence files: CC0 1.0 Universal, except the fonts and marks named below (<a href=\"https://creativecommons.org/publicdomain/zero/1.0/\" target=\"_blank\" rel=\"noopener noreferrer\">licence text<span class=\"vh\"> (opens in a new tab)</span></a>).<ul><li>The 4 fonts (Newsreader, Public Sans, JetBrains Mono, Dancing Script) are licensed by their authors under the SIL Open Font License 1.1; each family's licence file is copied beside the fonts.</li><li>The GitHub Invertocat, LinkedIn [in] bug and ORCID iD marks are trademarks of their owners, used under their owners' terms as recorded in marks/NOTICE.md, and are not part of the CC0 grant.</li></ul></li><li>Framework identifiers and titles in the crosswalk mappings stay under each publisher's terms. CSA uses a proprietary reference licence, and ISO/IEC a proprietary one. MITRE ATLAS is under the Apache License 2.0, and CWE under the CWE Terms of Use. NIST's works are in the public domain. OWASP uses CC BY-SA 4.0, with the MCP Top 10 under CC BY-NC-SA 4.0 (<a href=\"https://github.com/jposluns/guardrails/blob/main/NOTICE\" target=\"_blank\" rel=\"noopener noreferrer\">NOTICE<span class=\"vh\"> (opens in a new tab)</span></a>).</li></ul>"
reason = "names the licence of the vendored site template's runtime files (third-party material under its own terms), not a waiver of this project's rights"

[[exception]]
path = "site/draft/license/index.html"
phrase = "cc0"
occurrence = 2
reason = "states that the third-party marks (the GitHub, LinkedIn and ORCID marks, trademarks of their owners) are not part of the vendored template's CC0 grant, not a waiver of this project's rights"

[[exception]]
path = "opf/site/draft/license/index.html"
phrase = "cc0"
line = "<ul><li>Marko 2.2.4, the CommonMark parser vendored under opf/tools/_vendor/marko/: MIT (<a href=\"https://github.com/jposluns/guardrails/blob/main/opf/tools/_vendor/licenses/marko-MIT.txt\" target=\"_blank\" rel=\"noopener noreferrer\">licence text<span class=\"vh\"> (opens in a new tab)</span></a>).</li><li>The CommonMark 0.31.2 specification examples, a test fixture vendored at opf/tools/_vendor/commonmark-spec-0.31.2/: CC BY-SA 4.0 (<a href=\"https://creativecommons.org/licenses/by-sa/4.0/\" target=\"_blank\" rel=\"noopener noreferrer\">licence text<span class=\"vh\"> (opens in a new tab)</span></a>).</li><li>Shared site template (baseline package) 1.7.0, a pinned copy of the site template's runtime and licence files: CC0 1.0 Universal, except the fonts and marks named below (<a href=\"https://creativecommons.org/publicdomain/zero/1.0/\" target=\"_blank\" rel=\"noopener noreferrer\">licence text<span class=\"vh\"> (opens in a new tab)</span></a>).<ul><li>The 4 fonts (Newsreader, Public Sans, JetBrains Mono, Dancing Script) are licensed by their authors under the SIL Open Font License 1.1; each family's licence file is copied beside the fonts.</li><li>The GitHub Invertocat, LinkedIn [in] bug and ORCID iD marks are trademarks of their owners, used under their owners' terms as recorded in marks/NOTICE.md, and are not part of the CC0 grant.</li></ul></li></ul>"
reason = "names the licence of the vendored site template's runtime files (third-party material under its own terms), not a waiver of this project's rights"

[[exception]]
path = "opf/site/draft/license/index.html"
phrase = "cc0"
occurrence = 2
reason = "states that the third-party marks (the GitHub, LinkedIn and ORCID marks, trademarks of their owners) are not part of the vendored template's CC0 grant, not a waiver of this project's rights"
