start-line = 16
end-line = 18
canonical-text = "A delivery that lacks that agreed evidence, or\nthat is truncated, empty, or errored, is treated as no verdict, never as a pass, a vote, or a finding-free\nresult."
source-digest = "04097787f7e6f38fc359ac8fcdce292e5d81be92947187d650d884b17f7d4fe3"

[[clause]]
clause-id = "vrfdlv.3"
