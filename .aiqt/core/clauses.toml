source-digest = "e472b7766cb37f523dd6c36bc19134a8267a6e965de76a3c04c894e531b0bd1d"

[[clause]]
clause-id = "secpin.5"
corpus-id = "secpin"
source-path = ".aiqt/core/rules/security-seci-pin-referenced-instructions.md"
start-line = 19
end-line = 21
