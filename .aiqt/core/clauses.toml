start-line = 13
end-line = 15
canonical-text = "At natural checkpoints, such as a phase boundary or before a material redirection, it\nre-reads that governing goal, the original intent together with any explicit human amendment, from the\ndurable record and checks its current plan against it."
source-digest = "57eba929d16870f286470300a85da43683b5d14d71e7335cecda4d10daebc092"

[[clause]]
clause-id = "goalfd.3"
corpus-id = "goalfd"
source-path = ".aiqt/core/rules/quali-goal-fidelity-across-trajectory.md"
start-line = 13
end-line = 15
canonical-text = "At natural checkpoints, such as a phase boundary or before a material redirection, it\nre-reads that governing goal, the original intent together with any explicit human amendment, from the\ndurable record and checks its current plan against it."
source-digest = "57eba929d16870f286470300a85da43683b5d14d71e7335cecda4d10daebc092"

[[clause]]
clause-id = "goalfd.4"
corpus-id = "goalfd"
source-path = ".aiqt/core/rules/quali-goal-fidelity-across-trajectory.md"
start-line = 15
end-line = 16
canonical-text = "Re-anchoring is routine and silent, and the run\ncontinues by default."
source-digest = "57eba929d16870f286470300a85da43683b5d14d71e7335cecda4d10daebc092"

[[clause]]
clause-id = "goalfd.5"
corpus-id = "goalfd"
source-path = ".aiqt/core/rules/quali-goal-fidelity-across-trajectory.md"
start-line = 15
end-line = 16
