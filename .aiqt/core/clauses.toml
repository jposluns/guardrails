source-path = ".aiqt/core/rules/accur-read-before-characterizing.md"
start-line = 14
end-line = 15
canonical-text = "Never assert what a file, interface, or system contains, lacks, or requires without reading it first.\nCharacterize a thing only after examining it."
source-digest = "0bc2aa52717e6ce8ab222b6009b650484484e7b658d99dc197a381611d518698"

[[clause]]
