[[clause]]
clause-id = "rtsafe.1"
corpus-id = "rtsafe"
source-path = ".aiqt/core/rules/integ-safe-retries.md"
start-line = 13
end-line = 15
canonical-text = "Before a state-changing operation is retried after a timeout, interruption, or unknown outcome,\nauthoritative state is reconciled or a stable idempotency mechanism is used, so the side effect cannot be\napplied twice."
source-digest = "edfecac461bab41a3514c596b291c453fe01f49bd8f5613b95cb2aac98829549"

[[clause]]
