[[clause]]
clause-id = "recncl.1"
corpus-id = "recncl"
source-path = ".aiqt/core/rules/trust-reconcile-record-against-reality.md"
start-line = 15
end-line = 15
canonical-text = "A durable record is authoritative only while it still matches what is actually in use or in effect."
source-digest = "bffe77e19fcd63baccbc40d5f8abd92d518ac571f5e337f2c57b4f8d9dd9bbe7"

[[clause]]
clause-id = "recncl.2"
corpus-id = "recncl"
source-path = ".aiqt/core/rules/trust-reconcile-record-against-reality.md"
start-line = 16
end-line = 18
canonical-text = "Periodically, and at defined checkpoints (such\nas resume and close), reconcile what is recorded or approved against the real state, and treat any\ndivergence as a finding to resolve rather than a discrepancy to leave standing."
source-digest = "bffe77e19fcd63baccbc40d5f8abd92d518ac571f5e337f2c57b4f8d9dd9bbe7"

[[clause]]
clause-id = "recncl.3"
corpus-id = "recncl"
source-path = ".aiqt/core/rules/trust-reconcile-record-against-reality.md"
start-line = 16
end-line = 18
canonical-text = "Periodically, and at defined checkpoints (such\nas resume and close), reconcile what is recorded or approved against the real state, and treat any\ndivergence as a finding to resolve rather than a discrepancy to leave standing."
source-digest = "bffe77e19fcd63baccbc40d5f8abd92d518ac571f5e337f2c57b4f8d9dd9bbe7"

[[clause]]
clause-id = "recncl.4"
corpus-id = "recncl"
source-path = ".aiqt/core/rules/trust-reconcile-record-against-reality.md"
start-line = 18
end-line = 20
canonical-text = "The reconciliation runs\nagainst observed reality, not the record's own last-known value, so a record can never certify itself\ncurrent merely because nothing has updated it."
source-digest = "bffe77e19fcd63baccbc40d5f8abd92d518ac571f5e337f2c57b4f8d9dd9bbe7"

[[clause]]
clause-id = "recncl.5"
corpus-id = "recncl"
source-path = ".aiqt/core/rules/trust-reconcile-record-against-reality.md"
start-line = 20
end-line = 21
canonical-text = "A reconciliation preserves every committed record section\nor explicitly marks a supersession."
source-digest = "bffe77e19fcd63baccbc40d5f8abd92d518ac571f5e337f2c57b4f8d9dd9bbe7"

