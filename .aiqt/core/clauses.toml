source-path = ".aiqt/core/rules/quali-confirm-execution-target.md"
start-line = 23
end-line = 25
canonical-text = "A reusable command that carries a context-specific identifier, path, remote, account, or endpoint is\nconfirmed against the concrete checkout and target before it runs, never trusted because it was correct in\nthe repository or template it came from."
source-digest = "d5c77943670abf446d40b528e75b2e4226c1ff231c1347ea959dd1d782240f8f"

[[clause]]
clause-id = "dfdpth.1"
corpus-id = "dfdpth"
source-path = ".aiqt/core/rules/quali-defence-in-depth-default.md"
start-line = 15
end-line = 16
canonical-text = "When an overlapping control that guards against the same failure is available at low marginal cost, it is the\ndefault recommendation, and its marginal cost is stated alongside it."
source-digest = "869083e9ef683c85b8eb380961c656ce727214fa20b1d599c559559904c4e0d6"

[[clause]]
clause-id = "dfdpth.2"
