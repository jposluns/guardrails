canonical-text = "The same holds for a status a document,\ntest, or record asserts about the live system: bind a machine-checkable status to a probe that exercises the\nsystem, or generate it from an observation, and refresh it before relying on it as current; hand-written\nprose asserting such a status, free to diverge from what the system now does, is not recorded as settled fact."
source-digest = "f18d33c14b8c55437d4f58ba6f0480fd0ca948686b81ba3474e49d22c3868edf"

[[clause]]
clause-id = "obsbeh.9"
corpus-id = "obsbeh"
source-path = ".aiqt/core/rules/accur-observe-before-asserting-behaviour.md"
start-line = 21
end-line = 24
canonical-text = "The same holds for a status a document,\ntest, or record asserts about the live system: bind a machine-checkable status to a probe that exercises the\nsystem, or generate it from an observation, and refresh it before relying on it as current; hand-written\nprose asserting such a status, free to diverge from what the system now does, is not recorded as settled fact."
source-digest = "f18d33c14b8c55437d4f58ba6f0480fd0ca948686b81ba3474e49d22c3868edf"

[[clause]]
clause-id = "rdbchr.1"
