corpus-id = "goalfd"
source-path = ".aiqt/core/rules/quali-goal-fidelity-across-trajectory.md"
start-line = 12
end-line = 13
canonical-text = "Across a long autonomous run of many steps, the assistant keeps its work anchored to the goal the human\nactually set."
source-digest = "57eba929d16870f286470300a85da43683b5d14d71e7335cecda4d10daebc092"

[[clause]]
