[[clause]]
clause-id = "secrot.1"
corpus-id = "secrot"
source-path = ".aiqt/core/rules/security-secc-rotate-leaked-secret.md"
start-line = 23
end-line = 24
canonical-text = "A secret that reaches a remote or an external service is treated as compromised and rotated, whatever any\nscanner said."
source-digest = "49c9030bb835ac27bac61350f8093ea4737ee69205b1dc17171efe2ff723393f"

[[clause]]
clause-id = "secrot.2"
corpus-id = "secrot"
source-path = ".aiqt/core/rules/security-secc-rotate-leaked-secret.md"
start-line = 24
end-line = 25
canonical-text = "Rotation happens regardless of whether the exposure was intentional, brief, or already deleted\nfrom the destination."
source-digest = "49c9030bb835ac27bac61350f8093ea4737ee69205b1dc17171efe2ff723393f"

[[clause]]
clause-id = "secrst.1"
corpus-id = "secrst"
source-path = ".aiqt/core/rules/security-seca-verified-restore-path.md"
start-line = 16
end-line = 18
canonical-text = "An operation that destroys or overwrites state proceeds only when the state it will destroy is\nrestorable through a backup, snapshot, or versioned copy whose restorability has been confirmed\nagainst the actual target, or when the maintainer has explicitly accepted the loss."
source-digest = "efb7cc448342f497f3a73d7a9480976b546d0e596f032ae154cf36de5e9160e0"

[[clause]]
clause-id = "secrst.2"
corpus-id = "secrst"
source-path = ".aiqt/core/rules/security-seca-verified-restore-path.md"
start-line = 18
end-line = 20
canonical-text = "An untested\nrollback idea is not evidence of reversibility: the restore path is verified before the destruction,\nnot designed after it."
source-digest = "efb7cc448342f497f3a73d7a9480976b546d0e596f032ae154cf36de5e9160e0"

[[clause]]
clause-id = "secrst.3"
corpus-id = "secrst"
source-path = ".aiqt/core/rules/security-seca-verified-restore-path.md"
start-line = 20
end-line = 22
canonical-text = "General authorization to perform a destructive action is not evidence of recoverability; unless the\nmaintainer separately and explicitly accepts irreversible loss, authorization and a verified restore\npath are both required."
source-digest = "efb7cc448342f497f3a73d7a9480976b546d0e596f032ae154cf36de5e9160e0"

[[clause]]
clause-id = "secvde.1"
corpus-id = "secvde"
source-path = ".aiqt/core/rules/security-seci-verify-dependency-exists.md"
start-line = 22
end-line = 23
canonical-text = "A dependency the assistant proposes is verified to exist in an approved registry before it is added, so an\ninvented or typosquatted package name is never introduced."
source-digest = "7a93b710f859a06b83f920266b6cd080afda5c38a1bdc881891dbadb062cad7b"

[[clause]]
clause-id = "secvde.2"
corpus-id = "secvde"
source-path = ".aiqt/core/rules/security-seci-verify-dependency-exists.md"
start-line = 23
end-line = 24
canonical-text = "Existence and identity are confirmed against the\nregistry itself, not assumed from a plausible-looking name in generated text."
source-digest = "7a93b710f859a06b83f920266b6cd080afda5c38a1bdc881891dbadb062cad7b"

[[clause]]
