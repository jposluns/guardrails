start-line = 28
end-line = 30
canonical-text = "Verification happens at the object, function, and property\nlevel on each request: a write binds only to an explicit allow-list of fields, so a caller can never reach\ndata or actions, nor set a protected field through mass assignment, beyond what its own rights permit."
source-digest = "2e94a14bda0d0dd7293761463aa92ee1c2f9c22348e647f556d1d44c4b09f02c"

