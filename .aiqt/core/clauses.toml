start-line = 15
end-line = 16
canonical-text = "When an overlapping control that guards against the same failure is available at low marginal cost, it is the\ndefault recommendation, and its marginal cost is stated alongside it."
source-digest = "869083e9ef683c85b8eb380961c656ce727214fa20b1d599c559559904c4e0d6"

[[clause]]
clause-id = "dfdpth.3"
corpus-id = "dfdpth"
source-path = ".aiqt/core/rules/quali-defence-in-depth-default.md"
start-line = 16
end-line = 18
canonical-text = "The overlap is the value rather than\nredundancy to trim: a further layer earns its place by catching what an earlier one misses, so a layer is\nnot declined on the grounds that a sibling control should already catch the case."
source-digest = "869083e9ef683c85b8eb380961c656ce727214fa20b1d599c559559904c4e0d6"

[[clause]]
clause-id = "dfdpth.4"
corpus-id = "dfdpth"
