source-digest = "7318a8f5900c32ac72f956831f2aa38fdd207daa9436547852f845263ff0e0a6"

[[clause]]
clause-id = "secprv.1"
corpus-id = "secprv"
source-path = ".aiqt/core/rules/security-seci-preview-has-no-side-effects.md"
start-line = 12
end-line = 14
canonical-text = "An operation the assistant presents as a preview, dry run, plan, diff, or read-only inspection makes no\nstate-changing or outbound side effect on the subject it describes: it does not write, delete, deploy,\nsend, purchase, grant, or otherwise act on that subject or a downstream system."
source-digest = "6c7af5ac18f022e4f32f51bc23cda6f1f5deaa9c64461b15384cb012edc88a77"

[[clause]]
clause-id = "secprv.2"
corpus-id = "secprv"
source-path = ".aiqt/core/rules/security-seci-preview-has-no-side-effects.md"
start-line = 14
end-line = 16
canonical-text = "An effectful action is a\nseparate operation that carries its own explicit confirmation, and approval of a preview is never carried\nforward as approval of the change it previews."
source-digest = "6c7af5ac18f022e4f32f51bc23cda6f1f5deaa9c64461b15384cb012edc88a77"

[[clause]]
