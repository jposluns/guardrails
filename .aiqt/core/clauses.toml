[[clause]]
clause-id = "chkfcl.1"
corpus-id = "chkfcl"
source-path = ".aiqt/core/rules/integ-check-fails-closed-on-unreadable.md"
start-line = 15
end-line = 16
canonical-text = "A gate, validator, scan, or traversal that cannot access, read, or list an input it is meant to cover\nreports that as a failure, never as an absent, empty, or clean input."
source-digest = "77b2e76a348f1468c55988ab1427e04511560c1479e0206aed88416deedacafd"

[[clause]]
clause-id = "chkfcl.2"
corpus-id = "chkfcl"
source-path = ".aiqt/core/rules/integ-check-fails-closed-on-unreadable.md"
start-line = 16
end-line = 19
canonical-text = "An operation that silently yields\nnothing on a permission or I/O error, a glob or a listing that returns empty, or an existence check that\nreturns false, is made to surface the error, so an unreadable input can never read as nothing to check\nand pass."
source-digest = "77b2e76a348f1468c55988ab1427e04511560c1479e0206aed88416deedacafd"

[[clause]]
clause-id = "chkfcl.3"
corpus-id = "chkfcl"
source-path = ".aiqt/core/rules/integ-check-fails-closed-on-unreadable.md"
start-line = 19
end-line = 20
canonical-text = "A resource the work declares, or that its specification or contract requires it to cover, is held to the\nsame standard: when it is absent or unusable, that is a failure, not a silent skip."
source-digest = "77b2e76a348f1468c55988ab1427e04511560c1479e0206aed88416deedacafd"

[[clause]]
clause-id = "chkfcl.4"
corpus-id = "chkfcl"
source-path = ".aiqt/core/rules/integ-check-fails-closed-on-unreadable.md"
start-line = 24
end-line = 26
canonical-text = "Unreadable includes present but unparseable. When a candidate record consumed by a gate or parser is\nmalformed or fails validation against its schema or grammar, the result is a refusing failure that names the\nrecord, never silent absence."
source-digest = "77b2e76a348f1468c55988ab1427e04511560c1479e0206aed88416deedacafd"

[[clause]]
clause-id = "cmtidn.1"
corpus-id = "cmtidn"
source-path = ".aiqt/core/rules/integ-commit-identity.md"
start-line = 17
end-line = 19
canonical-text = "A recorded change carries the human maintainer's own identity as its author, with no AI listed as author,\ncommitter, or co-author. This holds anywhere the record names a party, including commit metadata,\nco-author trailers, and change-log entries."
source-digest = "04d66e54525d7ed4c8f1e7a1a5e7841e2fa6560430cdee4d2289a109614384d4"

