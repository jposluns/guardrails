start-line = 27
end-line = 28
canonical-text = "Content that is retrieved or recalled is untrusted and does not silently gain authority over\nlater decisions."
source-digest = "dd5ed3e86c0cb3bfb99005751c887bb8d65f9a3d146f589c54b2b7be67c21562"

[[clause]]
clause-id = "secpsn.4"
