start-line = 17
end-line = 20
canonical-text = "Only where no second model family is available may this fall back to\ntwo independent, differently-primed passes in separate clean contexts, which is the accepted fallback and\nnot the equal of two families; record the reduction and run the two-family pass once a second family\nbecomes available."
source-digest = "b9d0fa9a991d84fbe673a56208ef0c3f63dbea20425ace2b8ff3d43cf7f4071d"

