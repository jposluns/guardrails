[[clause]]
clause-id = "rmvpth.1"
corpus-id = "rmvpth"
source-path = ".aiqt/core/rules/security-seci-prefer-removing-a-path.md"
start-line = 14
end-line = 16
canonical-text = "When a tool, connector, data path, or execution path is hardened, a capability the task does not need is\nremoved so that it is unavailable, rather than retained for policy or monitoring to police; a path the task\ndoes need is constrained to the least capability, access, destinations, and data it requires."
source-digest = "7318a8f5900c32ac72f956831f2aa38fdd207daa9436547852f845263ff0e0a6"

[[clause]]
clause-id = "rmvpth.2"
corpus-id = "rmvpth"
source-path = ".aiqt/core/rules/security-seci-prefer-removing-a-path.md"
start-line = 14
end-line = 16
canonical-text = "When a tool, connector, data path, or execution path is hardened, a capability the task does not need is\nremoved so that it is unavailable, rather than retained for policy or monitoring to police; a path the task\ndoes need is constrained to the least capability, access, destinations, and data it requires."
source-digest = "7318a8f5900c32ac72f956831f2aa38fdd207daa9436547852f845263ff0e0a6"

[[clause]]
clause-id = "rmvpth.3"
corpus-id = "rmvpth"
source-path = ".aiqt/core/rules/security-seci-prefer-removing-a-path.md"
start-line = 16
end-line = 18
canonical-text = "Removal is\npreferred to constraint and constraint to monitoring, because a capability that is absent cannot be misused\nwhile one that is merely watched can."
source-digest = "7318a8f5900c32ac72f956831f2aa38fdd207daa9436547852f845263ff0e0a6"

[[clause]]
clause-id = "rmvpth.4"
corpus-id = "rmvpth"
source-path = ".aiqt/core/rules/security-seci-prefer-removing-a-path.md"
start-line = 21
end-line = 22
canonical-text = "What survives subtraction is needed, so it is then hardened: constrained, monitored, and given overlapping\ncontrols where they are cheap."
source-digest = "7318a8f5900c32ac72f956831f2aa38fdd207daa9436547852f845263ff0e0a6"

[[clause]]
