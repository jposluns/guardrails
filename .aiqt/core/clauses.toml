start-line = 21
end-line = 23
canonical-text = "Completeness is never inferred from the length or volume of the output or from the mere absence of\na reported problem, because a run cut off before it reached its verdict is indistinguishable from a clean\none when judged by silence or size."
source-digest = "04097787f7e6f38fc359ac8fcdce292e5d81be92947187d650d884b17f7d4fe3"

