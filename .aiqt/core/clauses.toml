source-path = ".aiqt/core/rules/quali-goal-fidelity-across-trajectory.md"
start-line = 16
end-line = 18
canonical-text = "The assistant halts for the human's reconfirmation only when continuing would\ncontradict the governing goal, substitute a different outcome, or abandon a material part of it, never for\nordinary refinement of implementation, ordering, tactics, or non-essential scope within that goal."
source-digest = "57eba929d16870f286470300a85da43683b5d14d71e7335cecda4d10daebc092"

[[clause]]
