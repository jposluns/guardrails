source-path = ".aiqt/core/rules/quali-compatibility-or-migration.md"
start-line = 13
end-line = 14
canonical-text = "An authorized break is versioned and ships with a tested migration path, so\nconsumers receive an actionable upgrade route rather than surprise breakage."
source-digest = "172d1c6ae6f644bdcdad7a1a9d5a912cc94951ce2c63128a95b71ae5dd9ff9d1"

[[clause]]
