corpus-id = "cnstpr"
source-path = ".aiqt/core/rules/trust-standing-constraints-persist.md"
start-line = 13
end-line = 16
canonical-text = "A constraint the operator or a governing rule has set stays in force across context loss. When the working\ncontext is summarized, compacted, truncated, or handed to a new session, a previously established\nconstraint, such as an instruction to propose but not act without approval or to never touch a named\nresource, does not lapse merely because it is no longer visible in the immediate context."
source-digest = "29b79900c405646552937f27b434f2d4998e4b14158ddb82fdc43bd454b9c218"

[[clause]]
clause-id = "cnstpr.2"
