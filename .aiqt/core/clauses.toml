corpus-id = "rtsafe"
source-path = ".aiqt/core/rules/integ-safe-retries.md"
start-line = 15
end-line = 15
canonical-text = "A lost response is never taken as proof the operation did not happen."
source-digest = "edfecac461bab41a3514c596b291c453fe01f49bd8f5613b95cb2aac98829549"

[[clause]]
clause-id = "stgprm.1"
corpus-id = "stgprm"
source-path = ".aiqt/core/rules/integ-stage-then-promote-on-green.md"
start-line = 13
end-line = 14
canonical-text = "An artefact is never installed, published, or promoted to a live or otherwise consumer-accessible\ndestination before the verification it must pass has passed."
source-digest = "63e9d9d79d38c31e27f5720b85ab47c5222cf9f6428da67a3d699c31a42bd20e"

[[clause]]
