start-line = 27
end-line = 28
canonical-text = "Code the assistant writes and operations it performs enforce least-privilege authorization, checked at every\naccess rather than inferred from an earlier step."
source-digest = "2e94a14bda0d0dd7293761463aa92ee1c2f9c22348e647f556d1d44c4b09f02c"

[[clause]]
