source-path = ".aiqt/core/rules/integ-anything-wrong-fixed-first.md"
start-line = 16
end-line = 17
canonical-text = "The moment anything wrong is found, however small and whoever found it, finish the unit of work in hand,\nthen fix it; nothing that is not the fix proceeds ahead of it."
source-digest = "7eae45965612b05da9802f2b211a4a58dba305f10b6e80e1514d09508b1d176c"

[[clause]]
clause-id = "actbef.3"
