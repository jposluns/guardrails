source-path = ".aiqt/core/rules/quali-defence-in-depth-default.md"
start-line = 23
end-line = 25
canonical-text = "Where a layer's marginal cost is considerable, it is weighed\nrather than assumed, and omitting an expensive layer on a weighed, recorded judgement is sound, not a\nviolation."
source-digest = "869083e9ef683c85b8eb380961c656ce727214fa20b1d599c559559904c4e0d6"

[[clause]]
clause-id = "dfdpth.7"
