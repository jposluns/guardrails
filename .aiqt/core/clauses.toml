corpus-id = "exetgt"
source-path = ".aiqt/core/rules/quali-confirm-execution-target.md"
start-line = 13
end-line = 15
canonical-text = "Before an operation with side effects runs, the assistant confirms by observation which concrete\nsystem the ambient context points at: the active account, profile, cluster, database, remote, or\nenvironment tier."
source-digest = "d5c77943670abf446d40b528e75b2e4226c1ff231c1347ea959dd1d782240f8f"

[[clause]]
clause-id = "exetgt.2"
corpus-id = "exetgt"
source-path = ".aiqt/core/rules/quali-confirm-execution-target.md"
start-line = 15
end-line = 16
canonical-text = "A production-class target is selected explicitly, never inherited silently from\nambient state, and when the target cannot be confirmed the operation holds until it can be."
source-digest = "d5c77943670abf446d40b528e75b2e4226c1ff231c1347ea959dd1d782240f8f"

[[clause]]
clause-id = "exetgt.3"
corpus-id = "exetgt"
source-path = ".aiqt/core/rules/quali-confirm-execution-target.md"
start-line = 15
end-line = 16
canonical-text = "A production-class target is selected explicitly, never inherited silently from\nambient state, and when the target cannot be confirmed the operation holds until it can be."
source-digest = "d5c77943670abf446d40b528e75b2e4226c1ff231c1347ea959dd1d782240f8f"

[[clause]]
clause-id = "exetgt.4"
corpus-id = "exetgt"
source-path = ".aiqt/core/rules/quali-confirm-execution-target.md"
start-line = 18
end-line = 21
canonical-text = "Configuration copied or templated from another context, another host, repository,\naccount, or environment tier, is re-read and re-verified against the intended target before first use:\nevery path, remote, account, and endpoint it carries is confirmed to point at the target, never trusted\non the strength of having worked at its origin."
source-digest = "d5c77943670abf446d40b528e75b2e4226c1ff231c1347ea959dd1d782240f8f"

[[clause]]
clause-id = "exetgt.5"
corpus-id = "exetgt"
source-path = ".aiqt/core/rules/quali-confirm-execution-target.md"
start-line = 18
end-line = 21
canonical-text = "Configuration copied or templated from another context, another host, repository,\naccount, or environment tier, is re-read and re-verified against the intended target before first use:\nevery path, remote, account, and endpoint it carries is confirmed to point at the target, never trusted\non the strength of having worked at its origin."
source-digest = "d5c77943670abf446d40b528e75b2e4226c1ff231c1347ea959dd1d782240f8f"

[[clause]]
clause-id = "exetgt.6"
