[[clause]]
clause-id = "chgchk.2"
corpus-id = "chgchk"
source-path = ".aiqt/core/rules/quali-change-carries-check.md"
start-line = 17
end-line = 18
canonical-text = "Verification leaves a durable artefact that keeps guarding the behaviour after the one-time\nverification pass has moved on."
source-digest = "09c63b73d0ea6a4d1e49a8a648158921efe34cc7003780060f9e093d8d65406d"

[[clause]]
clause-id = "chgchk.3"
corpus-id = "chgchk"
source-path = ".aiqt/core/rules/quali-change-carries-check.md"
start-line = 20
end-line = 26
canonical-text = "The check is confirmed to run, not merely to exist. A test or gate that is present but never reached,\nmisplaced in its file, wrongly indented, or never registered with the runner, provides no coverage, and a\npassing suite is not evidence that it holds: a check that never executed and one that executed and passed are\nindistinguishable from the suite's green alone. Before that green is trusted for the new behaviour, confirm\nthe check executed, by observing it run or by a deliberate flip that shows it failing without the change, and\nprefer a runner that reports the count or identity of the checks it actually ran over a hand-maintained\nassertion that they are all present."
source-digest = "09c63b73d0ea6a4d1e49a8a648158921efe34cc7003780060f9e093d8d65406d"

[[clause]]
clause-id = "cmpmig.1"
corpus-id = "cmpmig"
source-path = ".aiqt/core/rules/quali-compatibility-or-migration.md"
start-line = 12
end-line = 13
canonical-text = "Externally observable interfaces, persisted formats, and defaults are preserved unless a breaking change is\nexplicitly authorized."
source-digest = "172d1c6ae6f644bdcdad7a1a9d5a912cc94951ce2c63128a95b71ae5dd9ff9d1"

[[clause]]
clause-id = "cmpmig.2"
