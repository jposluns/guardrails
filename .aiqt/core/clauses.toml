corpus-id = "reqstp"
source-path = ".aiqt/core/rules/integ-required-step-remains-required.md"
start-line = 22
end-line = 23
canonical-text = "If the step genuinely no longer applies, the\nassistant records why."
source-digest = "ef4e9c629f937cc69b33eecafe0d1fb53c5ee0b6bc397b5bc16e231f1b27e478"

[[clause]]
clause-id = "reqstp.7"
corpus-id = "reqstp"
source-path = ".aiqt/core/rules/integ-required-step-remains-required.md"
start-line = 23
end-line = 25
