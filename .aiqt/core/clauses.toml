corpus-id = "vrfdiv"
source-path = ".aiqt/core/rules/quali-verifier-diversity.md"
start-line = 16
end-line = 17
canonical-text = "Diversify the verification so it surfaces different failure classes: run it across two model families, and\na second family from any vendor counts."
source-digest = "b9d0fa9a991d84fbe673a56208ef0c3f63dbea20425ace2b8ff3d43cf7f4071d"

