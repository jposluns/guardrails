source-digest = "935c1ee116427f64752e4343ba8172b1e9a5e8c591966bdf7ee1883f32411860"

[[clause]]
clause-id = "secdsz.1"
corpus-id = "secdsz"
source-path = ".aiqt/core/rules/security-seci-safe-deserialization.md"
start-line = 18
end-line = 20
canonical-text = "Data from an untrusted source is never passed to a deserializer that can instantiate arbitrary types or\nrun code during parsing, such as pickle, Java native serialization, PHP unserialize, or unsafe YAML. A\ndata-only format or a schema-bound parser is used instead, so parsing cannot become execution."
