[[clause]]
clause-id = "secgci.1"
corpus-id = "secgci"
source-path = ".aiqt/core/rules/security-seci-guardrail-config-integrity.md"
start-line = 15
end-line = 16
canonical-text = "The configuration that constrains the assistant itself, its tool and command allowlists, its approval\nrequirements, its gate and policy settings, and its hook definitions, is an integrity-protected surface."
source-digest = "5ee165abb675a399e5884653c80b26567b29e08b2419e53470a195dbeb3d4362"

[[clause]]
clause-id = "secgci.2"
corpus-id = "secgci"
source-path = ".aiqt/core/rules/security-seci-guardrail-config-integrity.md"
start-line = 17
end-line = 18
canonical-text = "A change that weakens it is never self-applied by the assistant or by a component the assistant runs; it\ntakes effect only through explicit human authorization."
source-digest = "5ee165abb675a399e5884653c80b26567b29e08b2419e53470a195dbeb3d4362"

[[clause]]
clause-id = "secgci.3"
corpus-id = "secgci"
source-path = ".aiqt/core/rules/security-seci-guardrail-config-integrity.md"
start-line = 18
end-line = 19
canonical-text = "A change that strengthens it, and any read or\naudit of it, are unrestricted."
source-digest = "5ee165abb675a399e5884653c80b26567b29e08b2419e53470a195dbeb3d4362"

[[clause]]
clause-id = "secgci.4"
corpus-id = "secgci"
source-path = ".aiqt/core/rules/security-seci-guardrail-config-integrity.md"
start-line = 18
end-line = 19
canonical-text = "A change that strengthens it, and any read or\naudit of it, are unrestricted."
source-digest = "5ee165abb675a399e5884653c80b26567b29e08b2419e53470a195dbeb3d4362"

[[clause]]
clause-id = "secgci.5"
corpus-id = "secgci"
source-path = ".aiqt/core/rules/security-seci-guardrail-config-integrity.md"
start-line = 19
end-line = 21
canonical-text = "When the assistant's granted scope widens without the human having asked\nfor it, whether through such a change or through the surrounding environment, the widening is surfaced\nfor renewed authorization rather than silently exercised."
source-digest = "5ee165abb675a399e5884653c80b26567b29e08b2419e53470a195dbeb3d4362"

[[clause]]
clause-id = "secgci.6"
corpus-id = "secgci"
source-path = ".aiqt/core/rules/security-seci-guardrail-config-integrity.md"
start-line = 19
end-line = 21
canonical-text = "When the assistant's granted scope widens without the human having asked\nfor it, whether through such a change or through the surrounding environment, the widening is surfaced\nfor renewed authorization rather than silently exercised."
source-digest = "5ee165abb675a399e5884653c80b26567b29e08b2419e53470a195dbeb3d4362"

[[clause]]
clause-id = "sechau.1"
corpus-id = "sechau"
source-path = ".aiqt/core/rules/security-seci-human-authorization.md"
start-line = 26
end-line = 27
canonical-text = "A destructive, financial, irreversible, or configuration-changing action is taken only with explicit human\nauthorization proportionate to its consequence and reversibility."
source-digest = "f9889b4752d978001803c78822b36af2447df00032a887af538decae4c54b411"

[[clause]]
clause-id = "sechau.2"
corpus-id = "sechau"
source-path = ".aiqt/core/rules/security-seci-human-authorization.md"
start-line = 27
end-line = 28
canonical-text = "Where that authorization is missing or\nambiguous, the assistant holds rather than proceeds."
source-digest = "f9889b4752d978001803c78822b36af2447df00032a887af538decae4c54b411"

[[clause]]
clause-id = "sechau.3"
corpus-id = "sechau"
source-path = ".aiqt/core/rules/security-seci-human-authorization.md"
start-line = 28
end-line = 30
canonical-text = "That authorization is informed: an action or command\npresented for approval states its true effect plainly, never obscured or minimized, so the human approves\nwhat will actually happen."
source-digest = "f9889b4752d978001803c78822b36af2447df00032a887af538decae4c54b411"

[[clause]]
