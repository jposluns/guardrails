start-line = 14
end-line = 16
canonical-text = "It is placed first in a staging area that is\nnot that destination, verified there, and only then is that same verified artefact promoted to the live\ndestination, on a recorded pass."
source-digest = "63e9d9d79d38c31e27f5720b85ab47c5222cf9f6428da67a3d699c31a42bd20e"

