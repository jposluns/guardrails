canonical-text = "A sub-agent receives only the least tools its task needs and cannot grant privileges to itself or\nto another agent."
source-digest = "d0f3ec20a83fe33f723eb0d33356b1f9214a63c7933da78b2b079a82c57fcacb"

[[clause]]
