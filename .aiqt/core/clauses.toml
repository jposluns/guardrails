[[clause]]
clause-id = "secfid.9"
corpus-id = "secfid"
source-path = ".aiqt/core/rules/security-seci-federated-identity-flow.md"
start-line = 18
end-line = 21
canonical-text = "Code the assistant writes that implements OAuth, OIDC, or JWT-based authentication validates the full\nprotocol flow before granting access: the token issuer, audience, signature, and expiry; the state and\nnonce; the redirect binding and PKCE where applicable; and that the granted scopes match what the exact\nrelying party requested."
source-digest = "e1c0dae14b1204be462169b81743f010708c40e6277a396783d23154ab2e1855"

[[clause]]
clause-id = "secfid.10"
corpus-id = "secfid"
source-path = ".aiqt/core/rules/security-seci-federated-identity-flow.md"
start-line = 21
end-line = 21
canonical-text = "A token is trusted only after every one of these checks passes."
source-digest = "e1c0dae14b1204be462169b81743f010708c40e6277a396783d23154ab2e1855"

[[clause]]
clause-id = "tsthrm.1"
corpus-id = "tsthrm"
source-path = ".aiqt/core/rules/quali-test-hermeticity.md"
start-line = 17
end-line = 18
canonical-text = "A test is built so its pass or fail is caused by the behaviour under test, not by ambient state the test\ndoes not control."
source-digest = "15269ab01ade8d07f86a043fd9cc7bc918913fc2b038de09acd096c2f6c642be"

[[clause]]
clause-id = "tsthrm.2"
corpus-id = "tsthrm"
source-path = ".aiqt/core/rules/quali-test-hermeticity.md"
start-line = 18
end-line = 22
canonical-text = "State that varies between machines, runs, users, or working directories, the process\numask and inherited filesystem default permissions, the locale, timezone, and clock, environment variables\nand the executable search path, and the order in which other tests run, is pinned to a known value,\nneutralized, or kept out of what the assertion depends on, so the same code yields the same verdict\neverywhere."
source-digest = "15269ab01ade8d07f86a043fd9cc7bc918913fc2b038de09acd096c2f6c642be"

[[clause]]
clause-id = "tsthrm.3"
corpus-id = "tsthrm"
source-path = ".aiqt/core/rules/quali-test-hermeticity.md"
start-line = 22
end-line = 23
canonical-text = "An assertion narrows to the property the code itself establishes rather than a composite the\nenvironment can perturb;"
source-digest = "15269ab01ade8d07f86a043fd9cc7bc918913fc2b038de09acd096c2f6c642be"

[[clause]]
clause-id = "tsthrm.4"
corpus-id = "tsthrm"
source-path = ".aiqt/core/rules/quali-test-hermeticity.md"
start-line = 23
end-line = 25
canonical-text = "but where a system-created property can carry more than the code sets, the\nassertion covers the whole of it rather than only the convenient part, so an unintended widening is caught\nrather than concealed."
source-digest = "15269ab01ade8d07f86a043fd9cc7bc918913fc2b038de09acd096c2f6c642be"

[[clause]]
clause-id = "tsthrm.5"
corpus-id = "tsthrm"
source-path = ".aiqt/core/rules/quali-test-hermeticity.md"
start-line = 25
end-line = 26
canonical-text = "A failure that traces to such uncontrolled state is a defect in the test, fixed at\nthe test, not a finding against the code;"
source-digest = "15269ab01ade8d07f86a043fd9cc7bc918913fc2b038de09acd096c2f6c642be"

[[clause]]
clause-id = "tsthrm.6"
corpus-id = "tsthrm"
source-path = ".aiqt/core/rules/quali-test-hermeticity.md"
start-line = 26
end-line = 27
canonical-text = "a pass that rests on a convenient local default is not evidence\nthe code is correct."
source-digest = "15269ab01ade8d07f86a043fd9cc7bc918913fc2b038de09acd096c2f6c642be"

[[clause]]
clause-id = "tsthrm.7"
corpus-id = "tsthrm"
source-path = ".aiqt/core/rules/quali-test-hermeticity.md"
start-line = 29
end-line = 29
canonical-text = "A test also leaves the host as it found it."
source-digest = "15269ab01ade8d07f86a043fd9cc7bc918913fc2b038de09acd096c2f6c642be"

[[clause]]
clause-id = "tsthrm.8"
corpus-id = "tsthrm"
source-path = ".aiqt/core/rules/quali-test-hermeticity.md"
start-line = 29
end-line = 31
canonical-text = "It creates, moves, deletes, or changes the permissions or\nownership of only paths within a temporary location it made for itself and removes afterwards, and it never\nmutates state outside that location."
source-digest = "15269ab01ade8d07f86a043fd9cc7bc918913fc2b038de09acd096c2f6c642be"

[[clause]]
clause-id = "tsthrm.9"
corpus-id = "tsthrm"
source-path = ".aiqt/core/rules/quali-test-hermeticity.md"
start-line = 31
end-line = 33
canonical-text = "Where a test must walk real parent directories, it bounds the walk by\nthat fixture root, never by a host property such as ownership, which can reach far past the fixture and\ndisturb unrelated state."
source-digest = "15269ab01ade8d07f86a043fd9cc7bc918913fc2b038de09acd096c2f6c642be"

[[clause]]
clause-id = "trkasy.1"
corpus-id = "trkasy"
source-path = ".aiqt/core/rules/integ-track-launched-work.md"
start-line = 16
end-line = 17
canonical-text = "A unit of work whose result or completion the caller depends on is launched so its outcome stays observable,\nnever discarded at the moment it starts."
source-digest = "1a6ce97b0599e10e961d0c99689fbaa583b37ea208386216e9cdf46e1ea5ab74"

[[clause]]
clause-id = "trkasy.2"
corpus-id = "trkasy"
source-path = ".aiqt/core/rules/integ-track-launched-work.md"
start-line = 20
end-line = 21
canonical-text = "Such work is launched through a mechanism that tracks it to completion and surfaces both its\nresult and its failures;"
source-digest = "1a6ce97b0599e10e961d0c99689fbaa583b37ea208386216e9cdf46e1ea5ab74"

[[clause]]
clause-id = "trkasy.3"
corpus-id = "trkasy"
source-path = ".aiqt/core/rules/integ-track-launched-work.md"
start-line = 21
end-line = 22
canonical-text = "a launch that drops the completion signal is not a safe way to start work the caller\nrelies on."
source-digest = "1a6ce97b0599e10e961d0c99689fbaa583b37ea208386216e9cdf46e1ea5ab74"

[[clause]]
clause-id = "trkasy.4"
corpus-id = "trkasy"
source-path = ".aiqt/core/rules/integ-track-launched-work.md"
start-line = 22
end-line = 23
canonical-text = "Where neither its result nor its completion is genuinely needed, running the task without tracking\nit is a deliberate, recorded choice, not the default."
source-digest = "1a6ce97b0599e10e961d0c99689fbaa583b37ea208386216e9cdf46e1ea5ab74"

[[clause]]
clause-id = "setcmp.7"
corpus-id = "setcmp"
source-path = ".aiqt/core/rules/accur-completeness-claim-enumerates-set.md"
start-line = 38
end-line = 39
canonical-text = "Ending a turn, scheduling an idle wake, or declaring a work queue drained or all blocked is such a\ncompletion-class claim over the backlog, and it carries the same enumeration burden."
source-digest = "ba3f21d9d3ff2b7af7be3f93d1c6bc99d681da51dbd6be069fc7c12ae577c329"

[[clause]]
clause-id = "trkasy.5"
corpus-id = "trkasy"
source-path = ".aiqt/core/rules/integ-track-launched-work.md"
start-line = 25
end-line = 26
canonical-text = "A tracked deliverable whose output is captured only through a truncating filter is not observable\ncompletion: the completion signal must carry the full result, never a truncated view of it."
source-digest = "1a6ce97b0599e10e961d0c99689fbaa583b37ea208386216e9cdf46e1ea5ab74"

[[clause]]
clause-id = "trkasy.6"
corpus-id = "trkasy"
source-path = ".aiqt/core/rules/integ-track-launched-work.md"
start-line = 30
end-line = 32
canonical-text = "Such work is launched through a tracked\nbackground mechanism that keeps its completion observable; where its result and completion are genuinely\nnot needed, detaching it is a deliberate, recorded choice, not a reflex."
source-digest = "1a6ce97b0599e10e961d0c99689fbaa583b37ea208386216e9cdf46e1ea5ab74"

[[clause]]
clause-id = "mstreg.1"
corpus-id = "mstreg"
source-path = ".aiqt/core/rules/trust-orchestrator-mistakes-register.md"
start-line = 13
end-line = 14
canonical-text = "A durable, append-only register records every confirmed orchestrator error and near-miss: each row names\nthe mistake, the evidence reference, the rule it violated, and the guardrail it motivates."
source-digest = "e65e499ccfb80d2d95aea11ec28e196043f109c66e3a4c9c7881de69f9514b0f"

[[clause]]
clause-id = "mstreg.2"
corpus-id = "mstreg"
source-path = ".aiqt/core/rules/trust-orchestrator-mistakes-register.md"
start-line = 14
end-line = 16
canonical-text = "Row identifiers\nare permanent and never reused, and a row leaves the register only by a recorded status change, never by\ndeletion or edit."
source-digest = "e65e499ccfb80d2d95aea11ec28e196043f109c66e3a4c9c7881de69f9514b0f"

[[clause]]
clause-id = "mstreg.3"
corpus-id = "mstreg"
source-path = ".aiqt/core/rules/trust-orchestrator-mistakes-register.md"
start-line = 16
end-line = 17
canonical-text = "A register row whose motivated guardrail is accepted becomes an open obligation, tracked\nto closure like any other backlog item."
source-digest = "e65e499ccfb80d2d95aea11ec28e196043f109c66e3a4c9c7881de69f9514b0f"

[[clause]]
clause-id = "prtwhl.1"
corpus-id = "prtwhl"
source-path = ".aiqt/core/rules/accur-partial-read-is-not-the-whole.md"
start-line = 13
end-line = 15
canonical-text = "A read that returns only a bounded slice of a file or of a command's output, a head, a tail, a line or\nbyte range, a viewer's default window, or a filtered, grepped, or paginated subset, is evidence only about\nthe portion it exposes and establishes nothing about what lies outside it."
source-digest = "1c8eba842cf43ab8c8f2b8a6e691b967115f6f922cd264209644d3daa055ed1f"

[[clause]]
clause-id = "prtwhl.2"
corpus-id = "prtwhl"
source-path = ".aiqt/core/rules/accur-partial-read-is-not-the-whole.md"
start-line = 15
end-line = 19
canonical-text = "The assistant does not treat\nsuch a slice as the complete artefact when a claim or action depends on the whole: it does not conclude\nthat a term, setting, error, or definition is absent because the slice did not contain it, nor take the\nslice as representative of the rest, when the read was bounded by a line count, a size limit, a match\nfilter, or a tool default rather than by the artefact's own end."
source-digest = "1c8eba842cf43ab8c8f2b8a6e691b967115f6f922cd264209644d3daa055ed1f"

[[clause]]
clause-id = "prtwhl.3"
corpus-id = "prtwhl"
source-path = ".aiqt/core/rules/accur-partial-read-is-not-the-whole.md"
start-line = 19
end-line = 22
canonical-text = "Before relying on the whole, it confirms\nit has observed the whole, by reading through to an observed end-of-source, by a search scoped to the\nentire artefact, or by a count reconciled against the artefact's true size, and where only a slice was\nseen it scopes its claim to that slice or widens the read."
source-digest = "1c8eba842cf43ab8c8f2b8a6e691b967115f6f922cd264209644d3daa055ed1f"

[[clause]]
clause-id = "brnrot.1"
corpus-id = "brnrot"
source-path = ".aiqt/core/rules/integ-branch-rooted-on-live-main.md"
start-line = 18
end-line = 19
canonical-text = "A working branch is cut from the current tip of the protected line of development, so its ancestry\nalways resolves to the live protected line."
source-digest = "f3197be5d8d73e4ea53880a44c227d390a9b4c08d99f4cc0d00bed8a29026024"

[[clause]]
clause-id = "brnrot.2"
corpus-id = "brnrot"
source-path = ".aiqt/core/rules/integ-branch-rooted-on-live-main.md"
start-line = 19
end-line = 22
canonical-text = "A branch whose common ancestor with the protected line no\nlonger resolves, because a history rewrite, a re-initialization, or a squash-merge retired the root it\nwas cut from, is orphaned: no work is dispatched onto it and nothing integrates from it until it is\nre-homed onto the live line by a recut or a replay of its unique commits."
source-digest = "f3197be5d8d73e4ea53880a44c227d390a9b4c08d99f4cc0d00bed8a29026024"

[[clause]]
clause-id = "brnrot.3"
corpus-id = "brnrot"
source-path = ".aiqt/core/rules/integ-branch-rooted-on-live-main.md"
start-line = 22
end-line = 24
canonical-text = "A branch whose ancestry still\nresolves but whose fork point has fallen behind the line's configured freshness horizon is stale and is\nre-homed on the same terms."
source-digest = "f3197be5d8d73e4ea53880a44c227d390a9b4c08d99f4cc0d00bed8a29026024"

[[clause]]
clause-id = "brnrot.4"
corpus-id = "brnrot"
source-path = ".aiqt/core/rules/integ-branch-rooted-on-live-main.md"
start-line = 26
end-line = 27
canonical-text = "The check that asserts this derives the protected ref from the repository it runs in and\nfails closed when that ref, or the revision under check, cannot be resolved."
source-digest = "f3197be5d8d73e4ea53880a44c227d390a9b4c08d99f4cc0d00bed8a29026024"

[[clause]]
clause-id = "brnrot.5"
corpus-id = "brnrot"
source-path = ".aiqt/core/rules/integ-branch-rooted-on-live-main.md"
start-line = 24
end-line = 26
canonical-text = "On git the signal is the merge base between the protected ref and the\nbranch: where it resolves to a commit the branch is rooted, and where it resolves to nothing the branch\nis orphaned."
source-digest = "f3197be5d8d73e4ea53880a44c227d390a9b4c08d99f4cc0d00bed8a29026024"


[[clause]]
clause-id = "cntdef.1"
corpus-id = "cntdef"
source-path = ".aiqt/core/rules/trust-continue-by-default.md"
start-line = 14
end-line = 19
canonical-text = "The default at every point is to continue the work: the assistant carries out the next queued or\nplanned item rather than ending its turn to seek permission for work it is already authorized to do.\nStanding authorization is not re-sought each turn; an authorized next step is executed, not\nre-offered, and a turn does not end by proposing a course and waiting for a go on work already\ncovered by that authorization. A question raised for a genuine decision does not halt other queued\nwork that can proceed independently of its answer."
source-digest = "941d45d78f150476c54e775eb72a9ad59335d81496517558bf1d40377fb6d00d"

[[clause]]
clause-id = "cntdef.2"
corpus-id = "cntdef"
source-path = ".aiqt/core/rules/trust-continue-by-default.md"
start-line = 21
end-line = 26
canonical-text = "The failure this guards against is the manufactured stop: with authorized work still open and every\ngate green, the assistant does not talk itself into winding down on a reason that only sounds like\nprudence, a long or heavy session, having done a lot, being deep into the run, a milestone reached,\nwork that feels best done fresh later, or a large series, migration, or audit lying ahead. None of\nthese is a signal; each is the assistant's own felt state or the mere shape of the work, dressed as\na considered call, and acting on it stops productive work that no observable problem asked to stop."
source-digest = "941d45d78f150476c54e775eb72a9ad59335d81496517558bf1d40377fb6d00d"

[[clause]]
clause-id = "cntdef.3"
corpus-id = "cntdef"
source-path = ".aiqt/core/rules/trust-continue-by-default.md"
start-line = 28
end-line = 37
canonical-text = "A wind-down, or a turn handed back to the human, happens only on a named, externally-observable\ntrigger: the task is complete; a human has explicitly stopped, paused, or changed the mode; a hard\nexternal block leaves no other queued work able to proceed, which is tool-verified whole-set\nexhaustion, the backlog enumerated item by item with each remaining item shown to carry the observed,\nterminal condition that blocks it; the next action meets the human-oversight threshold and lacks the\nauthorization that threshold requires, or that authorization is in doubt; a decision reserved to a\nhuman, not covered by standing authorization and determining the next action, must be answered\nfirst; or a validation finding reveals a process-integrity or systemic lapse, of which a concrete,\nquotable self-inconsistency is one instance. These triggers are not mutually exclusive; a single\nsituation may satisfy more than one, and any one of them suffices."
source-digest = "941d45d78f150476c54e775eb72a9ad59335d81496517558bf1d40377fb6d00d"

[[clause]]
clause-id = "cntdef.4"
corpus-id = "cntdef"
source-path = ".aiqt/core/rules/trust-continue-by-default.md"
start-line = 43
end-line = 49
canonical-text = "This rule never narrows the oversight threshold; it defers to it. The distinction is what a finding\nreveals, not the instrument that surfaced it: a failing check, gate, or audit whose finding is an\nordinary defect is fixed in place while the run continues and is not a wind-down signal, while the\nsame check, gate, or audit is a wind-down trigger when its finding reveals a process-integrity or\nsystemic lapse. A self-reported claim that the actionable items are exhausted is a set-completeness\nclaim that licenses less work, so it is enumerated from the authoritative backlog rather than\nasserted, and the default under partial evidence is to continue on the highest-priority open item."
source-digest = "941d45d78f150476c54e775eb72a9ad59335d81496517558bf1d40377fb6d00d"

[[clause]]
clause-id = "cntdef.5"
corpus-id = "cntdef"
source-path = ".aiqt/core/rules/trust-continue-by-default.md"
start-line = 81
end-line = 90
canonical-text = "Elapsed run length, session depth, the number of compaction events, accumulated progress or a\nreached milestone, and the anticipated size of the work still ahead, whether observed, measured, or\nestimated, are not members of that set, so none of them, alone or combined, is a wind-down trigger;\nlarge work is done unit by unit with independent verification sustaining quality, and its size is a\nreason to keep going. Felt degradation or context-heaviness is not a trigger either, being\nun-observable. Where a harness exposes a measured context or token budget, imminent truncation is an\nexternally-observable boundary, but it is not one of the triggers above and licenses no\nassistant-initiated wind-down: it is handled as non-completion, the assistant continuing until the\nharness acts and never reporting a truncated turn as completion, rather than a felt state read as\nfatigue."
source-digest = "941d45d78f150476c54e775eb72a9ad59335d81496517558bf1d40377fb6d00d"

[[clause]]
clause-id = "cntdef.6"
corpus-id = "cntdef"
source-path = ".aiqt/core/rules/trust-continue-by-default.md"
start-line = 91
end-line = 97
canonical-text = "A project may set a minimum-effort floor below which a discretionary wind-down is not even proposed,\nbut such a floor is a minimum, never a ceiling that authorizes a stop, and a caught-and-fixed issue\nis normal operation, not a stop: the unit in hand is finished, the issue fixed, and the run\ncontinues. A need for fresh or uncluttered context is a continuation mechanism, not a trigger: where\nan isolated-context worker or sub-agent is available and its use is authorized, the assistant\ndelegates that work, stays live to collect and integrate the result, and continues rather than\nending the run; where no such authorized mechanism exists, it continues within its own context."
source-digest = "941d45d78f150476c54e775eb72a9ad59335d81496517558bf1d40377fb6d00d"

[[clause]]
clause-id = "cntdef.7"
corpus-id = "cntdef"
source-path = ".aiqt/core/rules/trust-continue-by-default.md"
start-line = 38
end-line = 42
canonical-text = "A systemic-lapse trigger licenses only a recorded wind-down: the lapse is recorded as a fact the\nmoment it is confirmed, the work is parked behind the human decision it now awaits or exits through\nthe project's bounded, recorded exit, and the maintainer's later confirmation or refutation settles\nit. A lapse the assistant itself asserts never converts into a self-granted clean close of open\nwork; a clean close past open work belongs to the operator alone."
source-digest = "941d45d78f150476c54e775eb72a9ad59335d81496517558bf1d40377fb6d00d"

[[clause]]
clause-id = "cntdef.8"
corpus-id = "cntdef"
source-path = ".aiqt/core/rules/trust-continue-by-default.md"
start-line = 51
end-line = 79
canonical-text = "A blocking condition that licenses a wind-down is granted, externally observable, and terminal,\nnever self-authored. A hard external block, or a reserved decision that must be answered first,\ncounts only when the condition that blocks the item is granted by an authority other than the\nassistant and is observable in the authoritative record: a granted status, a failing check, an\nunavailable source, or an operator decision genuinely still pending in the decision record.\nObservability is necessary, not sufficient: a condition is terminal for an item only when, while\nthe condition holds, the item can proceed by no sanctioned path, not by a reduced floor on the\nterms the governing verification discipline sets, not by advancing the build and holding only the\nstep that needs the affected resource, and not by an alternative sanctioned route for that step. A\nrecoverable degradation of a resource the work would draw on, such as a tool, worker pool,\nverifier family, model, or service that is temporarily unavailable, limited, empty, or\nrate-limited, is externally observable yet not terminal while any such path keeps the item\nactionable: it gates only the downstream verification, integration, or promotion step that\nconsumes the resource, and the current build proceeds and holds for that step; the hold is never a\nlicence to take the gated step on the reduced or missing signal beyond what the governing\ndisciplines sanction. Such a degradation counts toward exhaustion only for an item with no step\nleft that can proceed while the condition holds, every sanctioned path completed or observed\nclosed, and the enumeration records that state for the item. A \"blocked\", \"held\", or \"needs a go\"\nthat the assistant authored about its own work is a proposal, not a grant, and does not gate a\nstop; nor does reclassifying work the operating mode already authorizes, such as already-decided\nqueued backlog, as newly needing a fresh authorization. A self-authored demotion of decided work\nto \"proposed\" or \"not granted\" is likewise a proposal, not a grant, and licenses no wind-down. The\nrequirement for express authorization gates a plan-initiating new unit of work; it is never\nrepurposed as a blocker to manufacture a stop over work already decided. The check that reads\nexhaustion reads that authoritative grant source, not the assistant's narration of it or a bare\nstatus marker, and it validates its own input, so a blocker it cannot confirm to be real, granted,\nand terminal resolves to continue, never to a stop; a stop whose claimed exhaustion rests on any\nnon-terminal condition is denied as a manufactured stop, however observable that condition is.\nIgnorance refuses the wind-down."
source-digest = "941d45d78f150476c54e775eb72a9ad59335d81496517558bf1d40377fb6d00d"
[[clause]]
clause-id = "setcmp.8"
corpus-id = "setcmp"
source-path = ".aiqt/core/rules/accur-completeness-claim-enumerates-set.md"
start-line = 27
end-line = 30
canonical-text = "The recorded condition blocks the\nitem only when it leaves the item no step that can proceed while the condition holds, every sanctioned\npath completed or observed closed; a condition that gates only a later step of the item, or that degrades\na resource only that later step consumes, shows that step held, not the item blocked."
source-digest = "ba3f21d9d3ff2b7af7be3f93d1c6bc99d681da51dbd6be069fc7c12ae577c329"
