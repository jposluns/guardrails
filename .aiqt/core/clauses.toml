[[clause]]
clause-id = "secspr.1"
corpus-id = "secspr"
source-path = ".aiqt/core/rules/security-seci-symlink-resolution.md"
start-line = 14
end-line = 15
canonical-text = "Code the assistant writes that opens, reads, or writes a filesystem path with elevated privilege resolves\nthat path safely against a symbolic-link race rather than trusting the name it was given."
source-digest = "93ffb833cd7b48f217e84853cbce4a49ec748b8696e25fed9d38933b3b2c1ccc"

[[clause]]
clause-id = "secspr.2"
corpus-id = "secspr"
source-path = ".aiqt/core/rules/security-seci-symlink-resolution.md"
start-line = 15
end-line = 19
canonical-text = "It resolves each\npath component beneath a pre-opened directory handle, using the platform's containment primitive where one\nexists, refusing to follow a symbolic link or to escape above the anchoring directory, so an attacker who\nswaps a component for a link between the check and the use cannot redirect the operation onto a target\noutside the intended tree."
source-digest = "93ffb833cd7b48f217e84853cbce4a49ec748b8696e25fed9d38933b3b2c1ccc"

