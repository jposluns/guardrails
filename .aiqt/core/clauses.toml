corpus-id = "refcap"
source-path = ".aiqt/core/rules/accur-reference-capture.md"
start-line = 14
end-line = 16
canonical-text = "When a claim rests on an external source, or an artefact is derived from one, the specific reference, a\nfile path and line, a URL, or a document and section, is captured and attached to it at the moment it is\nproduced, not reconstructed later from memory."
source-digest = "16771120832a089c77aa198360d27b1e1cd5e287fdb322ee0ffae42ddae0a3f2"

[[clause]]
clause-id = "refcap.2"
