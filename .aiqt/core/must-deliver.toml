# .aiqt/core/must-deliver.toml: rules whose whole core layer must lie inside the first
# check_release_build.CAP_BYTES bytes of AGENTS.md; read by tools/check_must_deliver.py
# through tools/_must_deliver.py, the one reader it shares with tools/gen_agents.py,
# tools/gen_first_pin_demo.py and tools/conformance.py.
# The list also drives the AGENTS.md order: the apex first, then the rules listed here,
# then every other rule, each group in AIQT priority order (gen_agents.agents_key), so a
# listed rule's core never sits behind an unlisted rule's core (the detail layers follow
# every core, in that same order). GEMINI.md and the Copilot instructions keep AIQT
# priority order. An id listed here that is not a corpus-id stops gen_agents (exit 2,
# nothing written).
# A rule with no `## Detail` split is all core, so its whole text must fit. A split rule's
# detail layer is rendered after every rule's core and is never measured. A reader capped
# at CAP_BYTES receives no detail layer only while the first detail section starts at
# or past the cap, which holds for this corpus because its core layers alone run past the
# cap; the gate does not check that. The gate also fails when a listed rule's core text at
# the comparison base moves into any rule's detail layer, as a whole sentence or as a piece
# of one sentence of at least MIN_PIECE_BYTES bytes (tools/check_must_deliver.py) moved
# word for word, or when a listed rule's core layer is empty beside a detail layer. What it does not
# see is named in its manifest residue.
# Hand-edited policy, like instruction-budget.toml: additions may be proposed in any PR.
# A removal must be declared: a rule listed at the comparison base (--base, by default
# the merge base with origin/main) and dropped from [[rule]] fails the gate unless a
# [[removal]] row (exactly id and reason) names it; review still judges the removal.
# reserve-bytes: enforced. The gate fails (exit 1) when any listed rule's core layer ends
# fewer than this many bytes inside the cap (a margin equal to it passes), so the margin is
# held, not only reported. It protects listed rules only, never an unlisted one. It must be
# an integer of at least 0 and at most warn-margin-bytes; anything else is exit 2. It may
# be kept or raised, never lowered: a reserve-bytes lower than the one listed at the
# comparison base fails the gate (exit 1; a format-version 1 base counts as 0).
# warn-margin-bytes: the gate prints a WARNING (still exit 0) when the tightest listed
# margin is at least reserve-bytes but under this figure. Both are 512 today, so the
# warning band is empty: a margin either passes cleanly or fails, and the WARNING gives no
# early notice; only the margins the gate prints do. Run tools/check_must_deliver.py for
# the live margins. format-version 2 is the only version this file may carry; a comparison
# base still written in format-version 1 (no reserve-bytes) is read as such by the gate's
# base parser, and tools/conformance.py reads an installed format-version 1 list for its
# order and reports it as an older version, with the migration step.
format-version = 2
warn-margin-bytes = 512
reserve-bytes = 512

[[rule]]
id = "prjint1"
reason = "The apex (highest precedence); the floor profile requires it and the span layout places it first."

[[rule]]
id = "citint"
reason = "Cite only from a file opened at the reviewed commit."

[[rule]]
id = "clmobs"
reason = "Claims about the work rest on observation."

[[rule]]
id = "setcmp"
reason = "A completeness claim enumerates its set."

[[rule]]
id = "corrob"
reason = "Corroborate external claims."

[[rule]]
id = "cntprd"
reason = "A count carries its predicate."

[[rule]]
id = "dscres"
reason = "Disclose a guard's residual coverage."

[[rule]]
id = "evgcmp"
reason = "Evidence-grounded completion."

[[rule]]
id = "grdinp"
reason = "A guard is only as good as its input."

[[rule]]
id = "estsep"
reason = "Measured and estimated figures stay separate."

[[rule]]
id = "nofabr"
reason = "No fabrication."

[[rule]]
id = "obsbeh"
reason = "Observe before asserting behaviour."

[[rule]]
id = "prtwhl"
reason = "A partial read is not the whole."

[[rule]]
id = "rdbchr"
reason = "Read before characterizing."

[[rule]]
id = "refcap"
reason = "Capture the reference when the claim is made."

[[rule]]
id = "reprod"
reason = "Reproduce a defect before fixing it."

[[rule]]
id = "tstamp"
reason = "A current timestamp is read from the clock."

[[rule]]
id = "valinf"
reason = "Validate an inferred premise before acting."

[[rule]]
id = "actbef"
reason = "Anything wrong is fixed first."

[[rule]]
id = "attint"
reason = "Attestation lines are harness-owned."

[[rule]]
id = "artbr1"
reason = "Branch and merge only on green."

[[rule]]
id = "brnrot"
reason = "Branches are cut from the live protected line."

[[rule]]
id = "chkfcl"
reason = "A check fails closed on input it cannot read; restored to the delivered prefix after it straddled the cap."

[[rule]]
id = "cmtidn"
reason = "Commit identity (no AI listed as author); restored to the delivered prefix after it fell past the cap."

[[removal]]
id = "vfxcmt"
reason = "Taken off the list to give every listed rule, cmtidn included, a margin of at least 512 bytes. It was still delivered whole when removed, as the first rule after the listed ones, but is no longer guaranteed: growth in the header, the blocks before the rules, any rule ahead of it or its own text can push its end past the cap, and the gate only reports that."
