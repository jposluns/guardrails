[[hook]]
id = "gate-weakening-guard"
rules = ["gatdis"]  # integ / gate-discipline
platform = "claude-code"
event = "PreToolUse"
matcher = "Bash"
handler = "gate_weakening"
default = "block"
class = "b"
residue = 'A best-effort QUOTE-AWARE LEXICAL check over the Bash command string (the shared quote/redirect-aware tokenizer, which REMOVES shell redirection from the token stream, closing the F1/F2 redirect-pollution slips) with a THREE-PART posture (NO-ASK: this guard never returns an ask): the unambiguous git hook bypass DENIES; a narrow VERIFICATION RUN whose output reaches a truncating sink DENIES-and-educates (the deny tier, below); and the two broad gate-shaped heuristics ALLOW-WITH-NOTE (A REVIEW FINDING: a benign optional probe is common and is not a gate bypass), so read every ASK/ASKS/over-ASK below as that allow-with-note outcome unless it names the deny tier. The DENY core: on a git segment whose subcommand accepts --no-verify (commit, merge, push, pull, rebase, am; the roster and the short-flag semantics verified against the git 2.53.0 man pages, 2026-08-19), a --no-verify spelling denies, matched exact or by CONSERVATIVE LONG PREFIX (an ambiguous abbreviation git itself would reject, such as --no-ver, is treated as the bypass anyway, and a separated option VALUE that itself spells --no-verify is scanned too - both safe-direction over-matches that only deny, never allow), and the SHORT -n denies ONLY on the two verbs where -n IS --no-verify (commit and am), clustered or bare, with the value-taking short and long options skipped so an option value carrying the letter n (an attached -m value, a separated --message value, a post -- pathspec) is never read as the flag, and the option region ends at the FIRST real "--"/"--end-of-options" terminator with a value-aware boundary, so a "--" consumed as a value-taking option value (git commit -m -- -n and git commit --message -- -n: the "--" is the message) does not end the region and the following -n is still read as the bypass; on push -n is --dry-run and on merge and pull it is --no-stat, so -n there is deliberately NOT flagged (flagging it would block safe dry runs), and --no-verify-signatures merely re-asserts a default and is not flagged. On a git naming whose subcommand is on that roster, the scan holds the segment to a CLOSED LITERAL ALLOWLIST GRAMMAR judged directly on the RAW command string (the same fail-closed shape as the git-discard positive grammar): an accepted segment can hold only bare literal words, one standalone single-quoted literal per word, one standalone double-quoted literal per word whose interior stays on one line and holds no dollar sign, backquote, backslash or exclamation mark (bash reads such a word as exactly the literal between the quotes, so its decoded interior is judged like a bare word; an exclamation mark is refused because bash history expansion can rewrite it before git parses its options), literal global-option values, a literal subcommand and the >/dev/null, 2>/dev/null and 2>&1 redirections (which bash removes from the argument list and which write no file); EVERYTHING ELSE DENIES BY CONSTRUCTION with a re-issue-plainly reason - an expansion, substitution or backquote (a dash-free value such as git commit -m "$msg" or --author="$a" included, inside double quotes too), a process substitution, a backslash (a line continuation included, inside double quotes too), a double-quoted word that is glued, unterminated or spans a newline, a glob or brace character, a word-leading "#" comment or "~" tilde, an ANSI-C dollar-quoted word, a here-document, here-string or any other redirection, and a glued or unterminated quote. One here-document shape is accepted, and only on a command the shared lexer parses: the git commit message form, the value of a separated -m on git commit written as a double-quoted command substitution that holds nothing but cat reading one here-document whose delimiter is single-quoted (so bash reads the body as literal text) and whose body holds no dollar sign or backquote; the body is read as that -m value, a git named in the body is re-judged, and every other here-document shape (an unquoted or double-quoted delimiter, the tab-stripping <<- form, another command inside the substitution, a body holding a further substitution or expansion, a second such message on the segment, the --message or a clustered -am spelling) still denies, as does the same form on a command the lexer cannot parse. A git naming whose subcommand CANNOT be resolved, because a global option, a global-option value or the subcommand word itself is outside the grammar (git $g commit, git -C $d), also DENIES: the verb bash would run cannot be known. The accepted literal words are then checked for the bypass spellings themselves (so a single-quoted or double-quoted -n or --no-verify still denies while a value-taking option consumes its value, under the same value-aware "--" boundary as the parsed path), and EVERY raw git word is scanned wherever it sits - bash runs git wherever the word reaches a command position, and the gate deliberately does not model which positions those are - except inside a region an earlier accepted scan consumed, where it is data or an operand (a single-quoted -m value naming a git command stays allowed) - UNLESS that region is a quoted interior holding a shell operator, a newline or the other quote character, whose pairing the scan cannot resolve because it starts at a git word, not at the command start: such a span is NOT treated as consumed data, so a git inside it is re-judged as its own segment, catching a bypass hidden in the live command text that sits between a closing quote bash opened earlier and the next opening quote, while the enclosing word is still read for its own bypass spelling so a real flag after the quote is not missed. DISCLOSED OVER-DENIAL (the deliberate cost of the closed grammar): outside the one accepted here-document message form above, a roster-verb git command carrying ANY live expansion now denies even where it is a safe operand or value (git commit -m "$msg", git push origin "$branch", git merge "release-$v"), and so does one carrying a comment, a file redi