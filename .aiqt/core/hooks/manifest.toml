es no shell bodies, so only the one plain git segment earns the read-only pass, and any other text carrying a git word, however read-only or data-only (a message or path operand that merely names git included), fails closed until the hold ends. The closed grammar over-refuses the same way on a held or uncertain target: a read with ANY leading assignment (X=1 git -C <held> status), with any global option other than a literal -C (git -P, git --no-pager, git --literal-pathspecs), or with a read option the verb's closed set does not name (an unmodelled flag, an attached-value short such as -U5 or -n5, a pickaxe -S/-G spelling) is withheld while the hold is live, as is every mutation whose target sits anywhere under a tree that encloses a held worktree (a scoped git clean in a subdirectory beside the nested hold included) and every certain-target command whose repository top level cannot be read (a bare repository), and a command whose raw text names a held worktree its resolved target does not account for (a held path carried in a program-running option value such as --upload-pack, grep -O, rebase -x, submodule foreach or difftool -x, or in a -C chain step that is not the resolved target), since the one-plain-git-on-a-certain-target reasoning cannot show that held worktree is left untouched; each is a safe over-refusal taken instead of under-blocking, and none fires with no live hold. ALLOW RESIDUAL, the shapes this BEST-EFFORT guard is known not to catch from a session outside every held repository whose command text names no held path (those found so far, not a proof that no other shape escapes); judge the hook against this claim, since no further widening rounds are planned against these: with no host-wide view of holds, a program-running form whose program reaches a held worktree only through a path the hold set does not resolve (a symlinked -C into a subdirectory, a submodule foreach program, two relative steps in a row) is ALLOWED from a session outside every held