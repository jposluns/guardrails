# .aiqt/core/hooks/manifest.toml: the mechanical-enforcement manifest (GD-24).
#
# One [[hook]] per shipped control. `id` is a stable, unique control identifier (a kebab-case slug);
# `rules` names the corpus-id(s) the control enforces, and every `rules` element must resolve to a real
# corpus-id in .aiqt/core/rules/ (validated by tools/gen_hooks.py against gen_rules.load_corpus, the
# same no-orphan pattern check_mappings uses for standards ids). A rule may back more than one control
# (cnsdif has both a Stop layer and a PreToolUse diff-source layer), so the control key is `id`, not the
# corpus-id, and `rules` carries the corpus linkage. tools/gen_hooks.py renders this manifest into the
# shipped Claude Code plugin surface under plugin/aiqt-guardrails-hooks/ (hooks/hooks.json,
# hooks/scripts/aiqt_hooks.py, .claude-plugin/plugin.json) and drift-gates it in CI; this file and the
# scripts/ tree beside it are the single edit point, the generated surface is never hand-edited.
#
# Fields per [[hook]]:
#   id       a stable, unique control identifier (kebab-case slug)
#   rules    the corpus-id(s) this control enforces (a list: a control may enforce more than one rule,
#            and a rule may back more than one control)
#   platform "claude-code" (the only renderer so far; a neutrality dimension, not an abstraction)
#   event    a known Claude Code hook event (Stop, PreToolUse, ...); whitelisted by the generator
#   matcher  the tool-name pattern for tool events; OMITTED for non-tool events such as Stop
#   handler  the function in scripts/aiqt_hooks.py that implements the control (unique per control)
#   default  "block" (hard deny / exit 2) or "warn" (a non-blocking surfacing warn, exit 0,
#            legal on a WARN_EVENTS event: PostToolUse, UserPromptSubmit, Stop, SubagentStop,
#            SessionStart, or under an explicit bake stage); "ask" is no longer an accepted default
#            (the generator rejects it); most slice-1 controls are lexical and
#            zero-intent, so they ship at block
#   timeout  OPTIONAL: this hook's platform timeout in seconds, an integer from 1 to 600. Rendered into
#            hooks.json only while the [plugin] on-failure-render switch is true; while it is false
#            (today's setting) every hook renders the generator's default timeout and no onFailure key,
#            byte-identical to the pre-switch surface. With the switch on, the generator refuses (exit
#            2, naming the hook and the minimum) an authored timeout, on a hook of any event, default
#            or stage, at or below the dispatcher's PreToolUse budget plus the margin its deadline line
#            reserves (both read from scripts/aiqt_hooks.py; together 10 seconds today, so the minimum
#            is 11), so a rendered AUTHORED timeout always leaves the dispatcher more time past its
#            budget than that margin. A hook that authors no timeout is the exception: it renders the
#            default 10, exactly the budget plus the margin. Refusing 9 and 10 is a chosen stricter
#            policy, not a mechanical need: the 8-second budget is still below those timeouts, so a
#            PreToolUse hook can still fail closed at the dispatcher's own deadline.
#            onFailure itself is never authored: with the switch on, the generator derives
#            "onFailure": "block" for an enforce-stage PreToolUse hook whose default is "block", never
#            for a warn hook, and never on Stop or TeammateIdle, whose events the documented onFailure
#            behaviour does not cover.
#   class    the EN-5 enforceability letter (a deterministic-gate, b hook-detectable, c partial,
#            d judgement), carried through so the surface traces to its enforceability claim
#   residue  REQUIRED, never empty: what this control does NOT catch, so the shipped surface stays
#            honest about heuristic coverage
#
# STANDING POSTURE. A residue is never edited for display, rendering, or lint reasons; it changes only to
# become more accurate. The enforcement register renders each residue VERBATIM on both its Markdown and site
# views, and the overclaim gate machine-verifies the site quotation against this manifest's own residue, so
# any residue change re-runs the register generation and that quotation verification.

[plugin]
name = "aiqt-guardrails-hooks"
version = "0.4.0"
description = "Mechanical enforcement of AIQT Guardrails rules for Claude Code, generated from the rule corpus."
author-name = "Jeff Posluns"
author-email = "jeff@posluns.ca"
homepage = "https://aiqt.ai"
# Fail-closed onFailure handling is AUTHORED but NOT RENDERED: on-failure-render stays false because how
# a client older than 2.1.295 treats the unknown onFailure key in hooks.json is unverified (it could
# ignore the key, warn, reject that entry, or reject the whole hooks.json; the last would silently
# disable every hook on that client, a fail-open regression). Until the switch is turned on, the
# rendered hooks.json is byte-identical to the pre-switch surface: a hook that times out, crashes or
# exits badly still lets a PreToolUse tool call proceed on EVERY client. The 2.1.295 floor comes from
# the platform hooks documentation: "an onFailure: block setting (client 2.1.295 and later) turns a
# timeout, crash, bad exit or invalid JSON into a block"; without it, a timed-out PreToolUse command
# hook does not block the tool call.
claude-code-min-version = "2.1.295"
on-failure-render = false

[[hook]]
id = "diff-wall-stop"
rules = ["cnsdif"]  # trust / no-console-diff-dumps
platform = "claude-code"
event = "Stop"
handler = "diff_wall_stop"
default = "warn"
class = "b"
residue = "This Stop layer is a NON-BLOCKING surfacing WARN (systemMessage, exit 0), not a hard block: by Stop time the wall has already rendered, and because this layer keeps no loop bound of its own and does not read the stop_hook_active field of the Stop input, a hard block could wedge the session, so hard prevention lives in the PreToolUse diff-source layer instead. It catches only a unified-diff wall in the final assistant message of a turn: diff --git headers, paired @@ hunk headers, fenced diff/patch/udiff blocks (backtick or tilde) of 10 or more lines, and mixed +/- runs of 8 or more lines. It does not catch a diff dumped mid-turn between tool calls, side-by-side or word-diff renderings, or raw log or patch walls that carry none of those markers; a mixed +/- Markdown checklist can rarely trip the +/- run detector (accepted residual)."

[[hook]]
id = "diff-source"
rules = ["cnsdif"]  # trust / no-console-diff-dumps (PreToolUse layer A)
platform = "claude-code"
event = "PreToolUse"
matcher = "Bash"
handler = "diff_source_pretool"
default = "block"
class = "b"
residue = 'AIRTIGHT-NARROW (L11 redesign: the GD-112 philosophy applied to diff-dumps). NO-ASK posture: this guard never returns an ask; read every ASK/ASKS/OVER-ASK below as its no-ask resolution, an ALLOW with an informational note for an unproven producer-capable form (a console-readability convention, not a hazard), while a CONFIRMED console patch that fits no proof DENIES-and-educates (use --stat or a redirect/pager). A best-effort QUOTE/REDIRECT-AWARE LEXICAL check over the Bash command via the shared raw-command tokenizer (_lex_command), which decides quoting and REDIRECTION from raw character positions BEFORE tokenizing, so a redirection ANYWHERE in a command (leading, interspersed, or trailing) is recorded as metadata and REMOVED from the argv, closing the redirect-pollution class shared across the lexical Bash hooks. An unquoted # opens a COMMENT only in a CERTAIN context: at the start of the command, or right after an unquoted blank, a newline, or one of ; & | < >, while no parenthesis, ${...} parameter expansion or backquote substitution is open (the rest of the line is ignored, so a redirect or pipe that is commented out earns no proof); a mid-word # such as ticket#123 or ${#x} stays literal; ANY OTHER unquoted # is UNCERTAIN, because bash reads it as a comment or as word text depending on context the lexer does not parse (x=$(true)# is word text but (true)# a comment; a # after a blank is text inside ${x:- #} or a [[ =~ ]] regex group but a comment inside ${ cmd; }): a # right after a (, a ) or a backquote that may open a substitution, or at a word start while one of those is open, is judged under both readings, and where the lexer cannot judge it that way it raises and each guard takes its fallback, which can decide more strictly than reading the command would (both below); an escaped backquote is plain text to bash outside a backquote substitution, so a # right after it is word text; a backslash-newline is a LINE CONTINUATION that joins (comment handling is RE-APPLIED at the word boundary a continuation exposes, so git diff <backslash-newline># > out.txt still comments out the redirect, while a continuation that lands MID-word keeps a following # literal) and never injects a synthetic empty argv element (which would have mis-set the subcommand and defeated the sibling guards); and a redirect target is classified CONSERVATIVELY on BOTH its raw and its LEXICALLY-normalized form (os.path.normpath, never touching the filesystem): a target whose RAW form begins with /dev or /proc is treated as a device and DENIED even if a .. in it would normalize elsewhere (git diff > /dev/../tmp/out.txt DENIES, an over-block in the SAFE direction), an ABSOLUTE target that NORMALIZES to under /dev or /proc is an unambiguous console/device target and DENIES (git diff > /tmp/../dev/stdout), a RELATIVE target whose normalized FIRST component is dev or proc (git diff > dev/stdout, > ./dev/stdout, > proc/self/fd/1) is CWD-DEPENDENT - from cwd / or via a dev/proc symlink it IS that device, but from an ordinary working tree it is a plain relative file - so it cannot be proven a plain file and ASKS (opaque), never a silent ALLOW and never a hard DENY of a legitimate write into a dev/ or proc/ subdirectory of the working tree itself, a .. in a target NOT under /dev or /proc yields an OPAQUE target that cannot be proven a plain file and ASKS (git diff > /tmp/../out.txt), and a plain static non-/dev,/proc file target ALLOWS (git diff > /tmp/out.txt); a relative .. escape that normpath cannot resolve (../../../dev/stdout) is likewise opaque rather than a proven real file. Rather than ENUMERATE every dumping form of git (an unbounded shell + git-option grammar, GD-34/F-119), the ALLOW path PROVES the safe form: a git diff-PRODUCER is ALLOWED only when the WHOLE command matches one of SIX closed proofs. (A) EXACT help: a metacharacter-free git <producer> --help or -h (and the exact git stash show --help/-h). (B) EXACT summary-only: a metacharacter-free single simple command (a conservative character set of letters, digits, space, tab, and _ - . / = : @ , + % and no shell reserved word), whose first resolved words are literally git and a summary-capable producer (diff/show/range-diff/log/diff-tree/diff-index/diff-files, plus the explicit git stash show), carrying at least one EXACT summary selector (--stat/--shortstat/--numstat/--name-only/--name-status) before a --/--end-of-options boundary and no other option-like word before the boundary except an exact --no-patch (bare operands allowed). (C) DIRECT static real-file diversion: a SINGLE simple command whose command word is literally git, a possible producer, with no opaque shell feature, whose FINAL stdout redirect (last-redirect-wins over the raw redirect metadata) is proven to land on a static non-/dev,/proc file - supporting leading, interspersed, and trailing redirects, but never a dynamic target (a variable, command substitution, or tilde), a descriptor duplication (1>&2, or a 3>out 1>&3 fd-graph, classified opaque), or a /dev,/proc target. (D) EXACT terminal pager pipeline: a plain literal unwrapped git producer, an exact | (not |&), then exactly one bare pager word (less/more/most/pager) with no options, operands, or redirection and no later pipe. (E) BENIGN git log listing: a metacharacter-free single simple command whose first words are literally git and log, every option before a --/--end-of-options boundary drawn from an EXACT allowlist of VALUE-FREE, provably-diff-free display/traversal flags (--oneline, --graph, --decorate, --no-decorate, --abbrev-commit, --reverse, --all) with bare revision/pathspec operands allowed - a plain commit listing that provably emits no diff (git log renders a patch ONLY with a patch flag, and a summary --stat form is already proof B). A git log carrying ANY other flag - a patch flag, a pickaxe -G/-S (whose diff output depends on a co-present -p), a summary/file-list flag (--numstat/--shortstat/--name-only/--name-status, which are the proof-B summary escape, allowed there like git diff --name-only), a value-taking option such as --format/-n <count>/--author=/--since=/--grep=, or any unknown flag - is NOT admitted by proof E and routes to the default (ASK, or DENY on a confirmed patch). (F) EXACT git show BLOB READ: a metacharacter-free single simple command whose first resolved words are literally git and show and whose FIRST non-option argument after show is a BLOB SELECTOR (a non-option token containing a colon, the <ref>:<path> or :<path> form). In that form git show prints ONE file contents at a revision - no diff, no @@ hunk headers, no +/- lines - so it is cat against a revision (the normal way to read a file on an un-checked-out branch) and renders no console diff. A bare git show <commit> (no colon-bearing first operand) is NOT this proof and stays covered (ASK, or DENY on a confirmed patch); a compound or redirected form is outside the single-simple-command proof and ASKS. This is a best-effort lexical heuristic (a separated option value containing a colon is a disclosed residual, erring toward reading a file, never toward a false diff-dump deny). The ALLOW path DELIBERATELY does NOT parse the full git/shell option grammar. Every OTHER possible producer is ASK or DENY: a producer CONFIRMED to emit a console patch (a default diff/range-diff, a default git show that is NOT the blob-read form, a patch-flagged listing, a summary token in a NON-option position such as git diff -- --stat, a producer piped into a known console/truncating sink cat/tee/head/tail, or a stdout redirect to /dev,/proc) and fitting no proof DENIES; any other producer-capable-but-unproven form ASKS. A producer that diverts its output with --output/-o writes the diff to THAT target, not stdout, so a shell redirect or a pager is a DECOY: proofs C and D do not apply, a --output to a /dev,/proc console DENIES, and a --output to a file or a dynamic target ASKS. A command word this guard cannot resolve to a literal git (an ANSI-C dollar-single-quote form or a $VAR expansion) beside a producer surface is never proven benign and never a CONFIRMED console dump: it ASKS. Across a compound or multiple producers, DENY outranks ASK, and a multi-command form is NEVER allowed merely because one segment is safe. The possible-producer scope is BROAD (a git word followed by a producer surface in the cleaned argv, robust to quote fragmentation, OR a raw-text probe that over-matches quoted prose), so it OVER-ASKS by design; on a tokenizer parse failure (an unbalanced quote or an unsupported construct such as a heredoc or process substitution) an apparent producer ASKS - never a silent allow, and no summary or redirect regex can earn an ALLOW from an unparseable command; a # whose comment reading depends on context (the shared lexer comment rule) is judged under both readings, a comment to the end of its line and word text, every reading judged (at most four such #, so at most sixteen readings), which is stricter for some commands; where the lexer cannot judge it that way (more than four, one in or right after a backquote substitution, or a reading that does not lex) an apparent producer in its text, also read with its backslash-newlines and then its quote characters and backslashes removed, DENIES, since the lexer read nothing past that # (an over-deny of such a command that dumps no patch); that removal is no decoder, so such a command whose text holds an ANSI-C or locale quote (a dollar sign right before a quote character) or a quote character or backslash next to a letter is read as cannot-evaluate and DENIES whatever its words, since a producer spelled in that quoting cannot be ruled out (an over-deny of every such command that dumps no patch, such as one that only echoes a quoted word). DELIBERATE OVER-ASKS, disclosed: a wrapper (env/sudo/command git diff), a pathed git (/usr/bin/git show), a leading assignment, any quote in a would-be summary command, a git log carrying any extra or unknown flag OUTSIDE the proof-E benign set (git log -5, git log -G/-S, git log --format, git log --author=), git grep diff, an extra summary modifier (git diff -M --stat, git diff -S --stat, git diff --stat=80), a compound, and quoted prose (an echo of the literal text git diff) all ASK rather than risk a false ALLOW. HONEST non-catches (best-effort, not chased): a git alias, a shell function, or a PATH-shadow name that omits a detectable git word; an expansion, eval, base64, or nested-script text that defeats both the cleaned-token scan and the raw fallback marker; a producer subcommand outside the declared roster; a diff produced by a NON-git tool or assembled across commands, or emitted outside the Bash tool; runtime or config behaviour that writes directly to a tty (a pager or GIT_PAGER/config set in a PRIOR turn); a static path target that is itself a symlink, FIFO, or device node, or that resolves to one through a symlinked ANCESTOR directory (a relative first-component dev/proc NAME is now caught lexically and ASKS, but the check never resolves symlinks, so a device reached through ANY symlinked ancestor, whether or not that ancestor is named dev/proc, is not distinguished), or that races after the check; and pager or PATH resolution at runtime. It is BEST-EFFORT: it targets the common/accidental case, not an adversary determined to evade it. DEADLINE: main() gives this check 8 seconds (the 10-second hook timeout less 2), counted from before its payload read, and fails closed with exit 2 when it has not decided by then; on the worst shapes the hooks self-test times, up to 1 MB, its slowest call took about 2.87 s in-process on a 24-core host with Python 3.14.4 (one run on 2026-10-18, including the shapes whose comment reading depends on context). Interpreter start-up and a wait the interpreter cannot interrupt (a read from a hung mount, a long call into C code) fall outside that deadline, and whether the platform blocks a call whose hook it stops at its own timeout is unverified. Where SIGALRM, setitimer or the main thread is unavailable, or SIGALRM is blocked, the check runs with no deadline; cleanup that runs while the deadline unwinds is outside it.'

[[hook]]
id = "commit-identity"
rules = ["cmtidn"]  # integ / commit-identity
platform = "claude-code"
event = "PreToolUse"
matcher = "Bash"
handler = "commit_identity"
default = "block"
class = "b"
residue = 'A best-effort QUOTE-AWARE LEXICAL check over the Bash command string: tokenized with the shared quote/redirect-aware tokenizer (_lex_command), which respects quotes and REMOVES shell redirection from the token stream (so a redirect before or around the subcommand no longer hides a Co-Authored-By trailer, an --author value, or an identity assignment), reading bash locale quoting ($"...") as the double-quoted text bash reads when no message catalogue translates it, so a name that $"" splits inside a word is read joined (Cl$""aude is Claude) in the command and in each run line it reads, and grouped into segments on the unquoted shell operators ; | || && & ( ) and newlines, so a subshell-grouped commit (( git commit --author=... )) is judged too, and a trailer hiding inside a quoted -m message (-m "fix; Co-authored-by: Claude", which the old whitespace split broke at the ;) now lives intact in the single message token and is caught by a substring scan on that token. Each command and each run line is judged under two readings, the one above and one that keeps the $ of a locale quote as a literal character, as the tokenizer reads it for every other guard, and an AI identity that either reading finds denies: a name followed directly by a locale quote (Claude$"bot", which bash reads as Claudebot, a word that names no AI identity) still denies as it did before locale quoting was read, because a change toward allow is held until the maintainer decides it. A command or run line that only one reading can parse (a {$"x"}> word, which the locale reading takes for an fd-variable redirect) is judged under that reading. The run lines that each reading alone builds are read within a length bound kept for that reading, and those that only a mix of the two readings builds within a third (each the length bound below), so the lines that one reading does not build cannot spend the bound of the lines it reads alone, and a line past the bound of one reading is left unread even when the other reading reads it; the cost is up to three bounds of run lines rather than one, and a line holding $" is tokenized under both readings. On a git commit-family segment (commit, merge, cherry-pick, am, rebase, revert, commit-tree) it flags a Co-Authored-By trailer inside a token (every trailer name in the token is read, each with its own value of up to 160 characters to the end of its line, so a second trailer on the same line inside the value of the first, or one on a later line of the message, is judged too) or an --author value (--author=X or --author X) naming an AI; in ANY segment it flags a git-identity env var (GIT_AUTHOR_NAME/GIT_COMMITTER_NAME) or a user.name/user.email value (a -c user.name=X inline or a config user.name X pair) naming an AI, so setting the identity in a prior segment then committing is caught. The commit-family contexts are read on a segment whose git command has a commit-family subcommand, and the git command is found after leading shell reserved words (!, if, then, do, a { group and the rest), the NAME after function or coproc when a compound command follows it (function f { git commit ...; }, coproc C { git commit ...; }; coproc C env git ... runs C) and VAR=value words: the command word itself when it is git (a path to git included), and, when the command word is one of the wrappers env, timeout, command, exec, nohup, xargs, sudo, nice, setsid, stdbuf or time, a later word that is git (a path to git included, a VAR=value word excluded) starts a candidate git command, whatever options and operands the wrapper carries (env git commit, sudo -u ci git commit, sudo -u git git commit, timeout -s KILL 60 git commit, nested wrappers too), until a held candidate, whose git word does not stand right after a word that may be an option taking it as a value (a word starting with - other than -, -- or an option carrying =), has a subcommand that is a git command name (a git 2.55 built-in or listed command): that candidate is taken to be the git command the segment runs and a later git word is its operand, so a wrapped read-side command with a git-named operand allows (env git log --grep git commit --author=...), while a held candidate whose subcommand is not a git command name, such as a git-named operand of a program off the wrapper list, leaves later git words read (sudo flock /var/lock/git env git commit, sudo chroot /srv/git /usr/bin/env git commit); all of this in one pass over the words of the segment; command -v and command -V (a command whose options carry v or V) only look a name up and run no git command. A command that git runs from its own operands is read as a command line of its own, bare or wrapped: the operands of git submodule foreach and of git submodule--helper foreach, to which git submodule foreach hands them (its first operand, after an optional --, is shell text and the rest are its arguments, so foreach git commit ... and foreach "git commit ..." both run git commit), and of git bisect run (the words of one command), and the value of git rebase --exec or -x in any spelling git accepts (-x CMD, -xCMD, -ix CMD, --exec=CMD, --ex CMD), a shell command line; such lines are read nested up to 8 deep and up to 8 times the length of the command plus 4096 characters in all, and each git rebase reads its options only up to the next rebase subcommand of its segment, from where that rebase finds the same lines, so a segment of many wrapped rebase commands costs time linear in its length. A line past either bound is left unread, and so is a run line at any depth that the shared tokenizer cannot parse (an unbalanced quote in a foreach operand or an exec value), but every other segment of the command and of each line being read, and every other run line within the bounds, is still judged, so an AI identity there denies. Only when none sets one does the fallback judge the whole command. It first denies when an AI identity appears anywhere in the command once every backslash-newline, backslash and quote is removed, so quoting or escaping in the unread line that splits or builds an option name or value (--"auth"=..., --author=C"laude ...", a backslash-newline before the value) does not hide it, or once the $ before each double quote is removed as well, so locale quoting in the unread line (--author=Cl$""aude ...) does not hide it either, and otherwise the raw-string scan below still judges it; the cost is a safe-direction over-deny of such a command (a nest past a bound, or a run line that cannot be parsed) whose text merely names an AI product (-m "fix claude adapter", a read-side git log --author=..., a word in a quoted heredoc body). An identity the shell builds at run time in the unread line (an expansion, a command substitution, or ANSI-C quoting) is not seen, and on any line neither is the text that a message catalogue substitutes for a locale quote at run time. The cost of that one bounded wrapper rule is a safe-direction over-deny when a wrapped command that is not git carries git, a commit verb and an AI identity as its own operands (xargs echo git commit --author=...), when a wrapped read-side git word stands right after a wrapper option (sudo -E git log --grep git commit --author=...), when a wrapped read-side git command has an alias as its subcommand (env git lg --grep git commit --author=...), or when a command -v lookup stands behind another wrapper (sudo command -v git commit --author=...). Each word is read as a git commit option the way git 2.55 parses its options, so the value of a value-taking option is read as that value, never as an --author option (git commit -m --author=X and git commit -am --author=X record a message, not an author). One exception is kept: a next-word value of any value-taking option, in any spelling read below (-m, -F, -C, -c, -t, -U, --trailer, --date, --fixup, --squash, --template, --cleanup, --pathspec-from-file, --reuse-message, --reedit-message, --unified, --inter-hunk-context and --author itself), that has the form --author=VALUE naming an AI identity still denies as an --author value, and so does the word after a next-word value that is --author or a prefix git reads as --author (git commit -m --author X, git commit -m --auth X) when that word names an AI identity, bare, behind a wrapper word or in a run line; git takes the value word as that option value and records no author from it, so this is a safe-direction over-deny over every value-taking option, which the maintainer chose to keep (the wrapped and run-line forms, and the word after a prefix such as --auth, were allowed before wrapped commands, run lines and abbreviations were read, so denying them is stricter still). A value that shares its option word (-m--author=X, --message=--author=X) and a next-word value of the form --auth=X (a prefix shorter than --author, with =) are not so judged. A short option cluster is read letter by letter up to its first value-taking letter (m, F, C, c, t, U), whose value is the rest of the word or else the next word and only that word (git commit -am -m --author=X records the message -m and the author X), -S and -u take a value only from the rest of their own word, and a long option is matched by its exact name or by a prefix that only one git commit option starts with (--auth is --author, --mess is --message; a prefix that several options share takes no value, and git refuses it). A message value (-m, --message, --trailer) is still scanned for a co-author trailer, and the value of a file, commit, template, date, mode or number option (-F or --file, -C or --reuse-message, -c or --reedit-message, -t or --template, -U or --unified, --fixup, --squash, --date, --cleanup, --pathspec-from-file, --inter-hunk-context) is passed over. The other commit-family verbs are read with the same git commit option table, not their own. git global options in _GIT_ARG_OPTS are skipped together with the word after them, so an option value is not misread as the subcommand: -C, -c, --git-dir, --work-tree, --namespace, --config-env, --attr-source and --shallow-file take that word as their value, and --exec-path and --super-prefix take none (the word skipped after them is harmless, since git runs no subcommand there); an --opt=value word is skipped alone. A git command that defines a git alias for itself (a -c or --config-env key in the alias, include or includeIf section, or a GIT_CONFIG_PARAMETERS or GIT_CONFIG_KEY_n assignment naming one) runs a subcommand the check cannot see, so it is read as a commit-family command, and so is every git command (found as above) of a command line whose text names GIT_CONFIG_PARAMETERS, GIT_CONFIG_COUNT or GIT_CONFIG_KEY_ anywhere (sought once every quote character, backslash, dollar sign and newline is removed, so a quoted, escaped or continued spelling counts, in any word, a here-string, a comment or an echo), whatever form sets the variable and whatever its value, since a shell sets one in more ways than a reading of forms can list (on git 2.53.0 with bash 5.3 an export, declare -x, typeset -x or local -x word, a bare assignment or a readonly word to a variable already exported, and under set -a also a bare assignment, read, printf -v, a for loop variable, a default-value expansion or a nameref each defined an alias), so a mention that defines no alias (an echo, a comment, an unset, an unrelated value) counts too, a disclosed over-refusal, or that runs under a GIT_CONFIG_PARAMETERS or GIT_CONFIG_KEY_n naming one in the session environment the hook inherits, which counts as such a text does, git wherever it stands (not read: a variable name built at run time, such as an expansion after GIT_CONFIG_, a brace expansion or an escape decoded inside an ANSI-C quote, and a variable set outside the command text, in the startup files of the Bash tool shell or in a sourced file or a script the command runs), together with each command line such a git command runs from its operands. The BARE message body is deliberately NOT matched against the identity set: a legitimate message that merely mentions an AI product name (-m "fix claude adapter") records no AI identity, and denying it would be a false positive; only a trailer or an --author value records identity. On a shell parse error (unbalanced quotes) in the command itself, with a run line left unread (one that cannot be parsed or one past the run-line bounds) and nothing read setting an AI identity, or with a command too long to read (below) that names an AI and holds no word that can record an identity, it fails SAFE: a conservative raw-string scan denies an apparent AI trailer/--author/env/config assignment whatever the git subcommand (so a git command running under a git alias the command defines is judged as a commit-family one), never a silent-allow; its --author context is every prefix git reads as --author (--au, --aut, --auth, --autho, --author) with = or whitespace before the value, and its co-author context reads every trailer name, as the reader does, and takes each whitespace run whole, so a long run of newlines after the trailer name costs time linear in its length rather than quadratic, with the same AI identities found, and so does its user.name/user.email context, so a long run of spaces after user.name before a quote that does not close costs time linear in its length too, with the same values found. A command longer than 131,072 characters is not read at all, so the reading ends well inside the 10-second hook timeout, which the platform contract this repository records does not say refuses a call when it runs out (the costliest commands measured took up to about 7.3 microseconds of CPU time per character to read, about 1 s at that length, which holds only while each regex the reader runs on a word, and each one the raw-string scan runs on a command of that length that the tokenizer cannot parse, costs time linear in the length it scans: the co-author trailer regex the reader runs on each word takes each whitespace run whole, as the co-author and user.name/user.email contexts of the raw-string scan do, since giving a run back one character at a time cost time quadratic in its length, about 53 s and 130 s of CPU time at that length for a commit message of a trailer name and a run of newlines and for user.name and a run of spaces before a quote that does not close, against about 0.01 s with each run taken whole, and a commit message of repeated trailer names, each read with its own value, in git rebase -x lines nested seven deep, the innermost ending in a locale quote, took up to about 0.15 s, against 0.41 s with each value searched whole): such a command is denied when an AI name appears anywhere in it once every quote, backslash, $ and newline is removed, with no word boundary needed around the name, and it also holds a word that can record an identity: git as a whole word (its letters with only quotes, backslashes, $ signs or newlines between them, and no letter, digit or underscore directly before or after it, a removed character counting as a word boundary, so a git at the start of a line is found), or a GIT_AUTHOR_ or GIT_COMMITTER_ variable name or user.name or user.email in any case once those characters are removed. Any other command that long that names an AI is judged by the conservative raw-string scan above, as one that cannot be parsed is, so an AI co-author trailer or --author value in it denies even when git runs under another name (gi? or "$G"), and one that names no AI is allowed at once, since that scan cannot find an AI identity in it either. This fallback has no length bound, so its own cost grows with the command length: on the costliest shapes measured, commands made of repeated co-author trailer names, each read with its own value of up to 160 characters, of which the AI identity search reads only the part past the end of the value before it, less 8 characters (the longest AI name the check matches between word boundaries, 9 characters, less one), the highest of three single runs on one host took about 0.26 s of CPU time at 1,048,576 characters, 4.0 s at 16,777,216 and 6.3 s at 25,165,824 (with each value searched whole, 0.59 s, 8.7 s and 14.0 s on the same host), and 7.3 s at 33,554,432, 8.9 s at 41,943,040 and 10.3 s at 50,331,648, so on the measuring host a command of about 40 to 48 MiB or longer can outlast the 10-second hook timeout, and on a slower host a shorter one can; since the platform contract this repository records does not say that a hook stopped at its timeout refuses the call, such a command may run with no deny from this check. The reader finds a git command only by a word that is git or a path ending in /git, reads a run line only under such a git command, and judges an identity assignment only in a word that starts with one of those names, so a name and a word that the reader would find in the command are found by these scans as well; a command that runs git under another name (a variable, a function or an alias) is outside the reader too. The cost is a safe-direction over-deny of such a long command whose text merely names an AI product or holds an AI name inside a longer word (Claudette) and holds git as a word or one of those names, a quoted heredoc body included; a long command that names an AI product and holds none of those words (a heredoc that writes a file and runs no git) is allowed unless the raw-string scan finds an AI co-author trailer, --author value or identity assignment in it, which denies it even when that is only text the heredoc writes, the same safe-direction over-deny as on a parse error. Being a raw-string scan, on a parse error in the command itself it does not see an option name or value that shell quoting or escaping splits or builds (--"auth"=..., --author=C"laude ...", --author=Cl$""aude ..., a backslash-newline before the value); with a run line left unread the scan for an AI identity anywhere, above, covers those forms. It is BEST-EFFORT: it targets the common/accidental case (the assistant own accidental violation), not an adversary determined to evade it. It does NOT defeat deliberate shell escaping (git \commit), obfuscation, an alias or function that renames the tool, a wrapper outside that list (builtin, doas, ionice, chrt, taskset, flock, busybox, watch, script, a wrapper script), a command string a shell or wrapper parses at run time (sh -c, bash -c, eval, env -S or --split-string with a quoted command), an identity a wrapper reads at run time (arguments xargs reads from its input), a git word built at run time (an expansion such as $GIT), a command git runs from somewhere other than the operands above (the exec lines of an interactive rebase todo list, git for-each-repo, an alias that starts with !, a configured editor, a filter-branch filter, or another git option or config value that names a program), a git-named operand of a program off the wrapper list followed by a word spelled as a git command name (sudo chroot /srv/git init ...), or persistent shell/env/config state such as an AI identity persisted in git config in a PRIOR TURN (not the same command), a trailer staged into a message file and committed with -F/-t, a commit made outside the Bash tool or the session, or an AI product name outside the recognized identity set. DEADLINE: main() gives this check 8 seconds (the 10-second hook timeout less 2), counted from before its payload read, and fails closed with exit 2 when it has not decided by then; on the worst shapes the hooks self-test times, up to 1 MB, its slowest call took about 0.72 s in-process on a 24-core host with Python 3.14.4 (one run on 2026-10-18, including the shapes whose comment reading depends on context; a command past the 131,072-character read bound goes straight to the fallback). The deadline also bounds that fallback, whose cost grows with the command length: in one run on the same host (2026-10-16) a command of 48 MiB of repeated co-author trailer names ending in an AI name was denied by the fallback in about 7.6 s, and one of 64 MiB failed closed with exit 2 at the deadline, about 8.2 s after the hook process started, so a command long enough to outlast the hook timeout fails closed instead of running with no deny from this check, except where this paragraph leaves the wait outside the deadline. Interpreter start-up and a wait the interpreter cannot interrupt (a read from a hung mount, a long call into C code) fall outside that deadline, and whether the platform blocks a call whose hook it stops at its own timeout is unverified. Where SIGALRM, setitimer or the main thread is unavailable, or SIGALRM is blocked, the check runs with no deadline; cleanup that runs while the deadline unwinds is outside it.'

[[hook]]
id = "abs-paths"
rules = ["abspth"]  # quali / absolute-paths
platform = "claude-code"
event = "PreToolUse"
matcher = "Read|Write|Edit|MultiEdit|NotebookEdit|Glob|Grep"
handler = "absolute_paths"
default = "block"
class = "b"
residue = "Covers the required-absolute file_path of Read, Write, and Edit and the required-absolute notebook_path of NotebookEdit (absolute by each tool's own contract, so the relative-to-a-named-root carve-out never applies to them), plus the OPTIONAL path search root of Glob and Grep (which should be absolute), and the MultiEdit file_path kept for LEGACY COMPATIBILITY. Each field name is bound to a Claude Code tool schema (Read/Write/Edit -> file_path, NotebookEdit -> notebook_path, Glob/Grep -> optional path); MultiEdit -> file_path is retained as a legacy-compatibility wire (MultiEdit is NOT in the current Claude Code built-in tool index, so its mapping is kept only so an adopter on an older or re-enabled MultiEdit is still covered, never an assertion that MultiEdit is a current tool). This STRUCTURED coverage binds ONLY those enumerated tool schemas: a path carried in any OTHER tool field, tool, or parameter, or in Bash command text, is out of scope here (the sibling abs-paths-bash floor covers only a cd/pushd destination and a redirect target in Bash, nothing else). Absoluteness is judged by the runtime's own path semantics (PurePosixPath/PureWindowsPath.is_absolute), so a drive-RELATIVE 'C:file', a bare 'C:', and a rooted-but-driveless leading-backslash path are correctly NOT absolute, while a POSIX '/x', a drive-absolute 'C:\\x'/'C:/x', and a UNC '\\\\server\\share' are; a '~'-prefixed path is not expanded and is not absolute. Honours the carve-out: the relative search PATTERN of Glob and Grep is legitimately relative to its named root and is never judged, and a rootless call (no path) names the current directory as that root and is allowed. Fails CLOSED: a tool_input that is not a readable mapping, or a required file_path/notebook_path that is absent or not a non-empty string, denies rather than passing (closing the earlier fail-open where a malformed tool_input collapsed to an empty mapping and took the search-root allow branch). Does NOT judge whether an absolute path points at the INTENDED target (absoluteness is not intent), and is platform=claude-code only. DEADLINE: main() gives this check 8 seconds (the 10-second hook timeout less 2), counted from before its payload read, and fails closed with exit 2 when it has not decided by then; on the worst shapes the hooks self-test times, up to 1 MB, its slowest call took under 0.01 s in-process on a 24-core host with Python 3.14.4 (one run on 2026-10-18, including the shapes whose comment reading depends on context). Interpreter start-up and a wait the interpreter cannot interrupt (a read from a hung mount, a long call into C code) fall outside that deadline, and whether the platform blocks a call whose hook it stops at its own timeout is unverified. Where SIGALRM, setitimer or the main thread is unavailable, or SIGALRM is blocked, the check runs with no deadline; cleanup that runs while the deadline unwinds is outside it."

[[hook]]
id = "abs-paths-bash"
rules = ["abspth"]  # quali / absolute-paths (Bash cwd-floor layer)
platform = "claude-code"
event = "PreToolUse"
matcher = "Bash"
handler = "bash_absolute_paths"
default = "block"
class = "b"
residue = "A SEPARATE best-effort Bash layer of abspth, distinct from the structured typed-path guard (abs-paths), whose structured coverage binds only the enumerated tool schemas and never Bash command text. This is a CONSERVATIVE FLOOR that NEVER asks and, with ONE exception, NEVER denies: it ALLOWS-WITH-AN-INFORMATIONAL-NOTE (NO-ASK posture; the user's own permission flow still governs, and every ASK/ASKS below is the retired term for that allow-with-note outcome, since absolute paths are a convention, not a hazard). The ONE DENY exception (a review finding): a DESTRUCTIVE TRUNCATING redirect (a '>'/'>|'/'&>' or a '>&'-to-a-file) whose TARGET is RELATIVE or OPAQUE DENIES-and-educates, because truncation ZEROES its target and a cwd-dependent relative or unverified target could destroy the WRONG file; an append '>>', a read '<'/'<>', and every cd/pushd DESTINATION position never deny (they note). It judges ONLY two positions that silently resolve against the current working directory, a cd/pushd DESTINATION operand and a redirection TARGET, and NEVER an arbitrary command operand (a relative path argument to any other command is deliberately NOT judged, to avoid over-firing). A relative or unresolvable such position is NOTED; an absolute one, an UNQUOTED CURRENT-USER tilde destination ('~' or '~/x', which the shell expands to $HOME so it is cwd-independent), a bare 'cd'/'pushd' and the OLDPWD 'cd -' (both only absent ANY leading inline env-assignment, see below), the real cd/pushd option flags (cd -L/-P/-e/-@, pushd -n, singly or bundled), a pushd stack rotation (+N/-N), and a numeric/'-' descriptor duplication (2>&1) allow. The tilde-ALLOW is NARROWED to the current-user forms and gated on a WHOLE-TILDE-PREFIX-UNQUOTED signal, NOT on the broader token-wide opacity flag: it is True only when the token begins with an unquoted '~' AND the ENTIRE tilde-prefix (from that '~' up to the first UNQUOTED '/', or end of word) is unquoted and unescaped, which is exactly when bash performs tilde-expansion. So a QUOTED leading tilde, EVEN with an unquoted expansion/glob/brace TAIL (the \"~\"/x*, '~'/x?, \"~\"/$V, \"~/repo\"* forms), is NOT tilde-expanded (the '~' is quoted, the word stays RELATIVE) and ASKS, as does a fully-quoted '~'/'~/x', an escaped '\\~/...', and an empty-quote-preceded '\"\"~/x' (bash expands only a '~' at the very start of the word). It ALSO ASKS a leading unquoted '~' whose PREFIX itself carries a quote or escape BEFORE the first unquoted '/' - '~\"/x\"', '~'' (empty single-quote), '~\"\"/x', '~'/x'', '~\"/\"$V', and a '~' followed by an escaped '/' - because any quote or escape in the tilde-prefix disables bash expansion and the word stays RELATIVE, EVEN when the DECODED token is fully literal '~/x' with no opacity. Only a quote or expansion AFTER the prefix-closing unquoted '/' does not block expansion, so the genuine 'cd ~/$VAR' (prefix is the bare '~', the '$VAR' sits after the '/') STAYS ALLOW. A later hardening pass propagates this SAME clean-leading-tilde signal into the redirect-TARGET classification (previously the redirect parser discarded it, so a '> ~/x' target was classed opaque and ASKED, inconsistent with 'cd ~/x'): a redirect target whose whole leading tilde-prefix is clean/unquoted now ALLOWS ('> ~/x', '> ~/\"x\"', '> ~/$V', and the bare '> ~'), while a quoted or complex-prefix tilde target ('> \"~\"/x', '> ~\"/x\"') keeps its opacity and ASKS - exactly matching the cd tilde rule. A '~user'/'~user/x' names another account's home whose EXISTENCE the hook cannot verify (an unresolved login name leaves the word RELATIVE), so it is NOT proven absolute and ASKS (the conservative call; a '~user' cd is rare); the '~-'/'~+'/'~N' directory-stack forms likewise ASK. Only the closed option forms are treated as non-destinations, and '--' ENDS option processing, so a genuine relative directory name that begins '-'/'+' is still the destination and ASKS ('cd -- -rel', 'cd +rel', 'cd -rel'), while a lone '-' AFTER '--' is still the $OLDPWD shortcut in bash and ALLOWS ('cd -- -') and a post-'--' directory literally named '--' stays relative and ASKS ('cd -- --'); an opaque '$VAR' destination cannot be proven absolute and ASKS. ANY leading inline env-assignment PREFIXING a cd/pushd (any variable name, '=' or the append '+=' form) can redirect where the cwd-INDEPENDENT destinations land: an inline OLDPWD=/OLDPWD+= redirects the lone '-' ($OLDPWD) shortcut and an inline HOME=/HOME+= redirects the bare 'cd' ($HOME default), in each case to a value the floor cannot prove absolute (e.g. '..'). CONSERVATIVE CONSOLIDATION: rather than enumerate OLDPWD/HOME by name (which missed the '+=' append form and the bare-cd HOME default entirely - the earlier under-blocks), the floor takes the stance that the mere PRESENCE of ANY leading assignment makes those two otherwise-cwd-independent destinations ASK, so 'OLDPWD=.. cd -- -', 'OLDPWD+=.. cd -', 'HOME=.. cd', 'HOME+=.. cd', and 'HOME=.. pushd' all ASK, while a plain zero-assignment 'cd -'/'cd -- -'/bare 'cd' keeps its ALLOW. This is DELIBERATELY conservative in two disclosed ways: (a) a BENIGN leading assignment on a cwd-independent form ('FOO=x cd -', 'FOO=x cd') also ASKS, the accepted cost of not name-enumerating; and (b) an assignment token whose NAME was quoted or escaped ('\"OLDPWD\"=.. cd -', 'OLD\"PWD\"=.. cd -', 'OLDP\\WD=.. cd -') is a COMMAND to bash (command-not-found; cd never runs), but its DECODED form is assignment-shaped ('OLDPWD=..'), so the floor reads it as a leading assignment and ASKS - an intentional over-fire on an assignment-shaped token bash would reject anyway, NOT chased with assignment-name quote provenance. It reuses the shared quote/redirect-aware lexer (_lex_command), so a redirect anywhere is seen and a quoted metacharacter is not miscounted; but the lexer is NOT a shell interpreter: it cannot resolve an ALIAS, a shell FUNCTION, eval, a command substitution, or a VARIABLE EXPANSION, so a cd or redirect reached through any of those, or whose command word is not literally cd/pushd (a wrapper, a PATH-shadowed name, an absolute /usr/bin/cd is resolved by basename but an aliased 'cd' is not), is not judged. An operand carrying an unexpanded expansion never reads as absolute unless it is literally rooted, so 'cd $DIR' ASKS while 'cd /$X' allows; a redirect target formed from an expansion is classified opaque and ASKS. A bare filename passed to an unknown command is indistinguishable from data and is not judged. Absoluteness is NOT intent: an absolute cd or redirect can still point at the wrong directory. An unparseable construct (a heredoc, here-string, process substitution, '{fd}>' redirect, or an unbalanced quote or escape) is handled by PARTIAL lex: the COMPLETE segments before it AND the positions of the still-open IN-PROGRESS segment that were fully parsed BEFORE it are still inspected, so an earlier resolvable relative cd/redirect - whether in an earlier segment ('cd rel; cat <<EOF...') OR the redirect target of the same in-progress segment parsed before the construct ('cat > out.txt <<EOF...' and 'cat > out.txt <(...)' ASK on out.txt) - still ASKS rather than being discarded; ONLY a cd/redirect position WITHIN or AFTER the unparseable construct is left uninspected and ALLOWED, a disclosed residual rather than an over-ask on every such command. A '#' whose comment reading depends on context (the shared lexer's comment rule: right after a '(', ')' or backquote, or at the start of a word inside an open parenthesis, ${...} or backquote substitution) is judged under both readings, a comment to the end of its line and word text, so a cd or redirect either reading reaches is judged (stricter for some commands). The exception is such a '#' the lexer cannot judge that way (more than four of them, one in or right after a backquote substitution, or a reading that does not lex): the lexer reads nothing past it, so a command carrying one and a '>' anywhere in its text (also read with its backslash-newlines and then its quote characters and backslashes removed) DENIES, since a truncating redirect may sit past it (an over-deny of such a command whose '>' is harmless), and one whose text names cd or pushd or carries a '<' ALLOWS WITH A NOTE, as does one whose text holds quoting that removal does not decode (an ANSI-C $'...' or locale $\"...\" quote, or a quote character or backslash next to a letter), in which a cd may be spelled. This guard lexes such a command twice (the full lex, then the partial one), so it can make twice the thirty-one lexes of one judgement under both readings; that bounds how many lexes it makes, not how long they take, and each lex takes time linear in the command's length. A missing tool_name denies (the shared fail-closed contract); a missing or unreadable command string ASKS rather than silently allowing. It is best-effort against the accidental case, not an adversary, and is platform=claude-code only. DEADLINE: main() gives this check 8 seconds (the 10-second hook timeout less 2), counted from before its payload read, and fails closed with exit 2 when it has not decided by then; on the worst shapes the hooks self-test times, up to 1 MB, its slowest call took about 1.20 s in-process on a 24-core host with Python 3.14.4 (one run on 2026-10-18, including the shapes whose comment reading depends on context). Interpreter start-up and a wait the interpreter cannot interrupt (a read from a hung mount, a long call into C code) fall outside that deadline, and whether the platform blocks a call whose hook it stops at its own timeout is unverified. Where SIGALRM, setitimer or the main thread is unavailable, or SIGALRM is blocked, the check runs with no deadline; cleanup that runs while the deadline unwinds is outside it."

[[hook]]
id = "git-explicit-binding"
rules = ["expbnd"]  # integ / explicit-binding-over-ambient-context
platform = "claude-code"
event = "PreToolUse"
matcher = "Bash"
handler = "git_explicit_binding"
default = "block"
class = "b"
residue = "A best-effort LEXICAL check over the Bash command via the shared quote/redirect-aware tokenizer (_lex_command), ALLOW-WITH-A-NOTE by design (NO-ASK posture: it never returns an ask; read every ASK/ASKS below as that allow-with-informational-note outcome, an ambient-binding convention rather than a hazard; the EN-9 lesson: an open shell grammar has an irreducible undecidable tail), with ONE deny on a finding: a whole-tree breadth stage followed by a git push later in the same command DENIES-and-educates, on the parsed path and on every fallback alike; the shared missing-tool_name contract also denies. SCOPE ALIGNMENT with the rule text: expbnd keeps prefer-the-explicit-binding as a PRINCIPLE and makes the MECHANICAL requirement MANDATORY only in the ambient-target-CONFUSION cases (a directory change PRECEDING a git mutation, a wrapper that redirects git, or a breadth sweep that a relocation PRECEDES or that PRECEDES a publish (push)); this control matches that scope and does NOT and deliberately should NOT ASK on every bare ambient git. It fires on exactly TWO patterns, both ORDER-SENSITIVE (a shift confuses a git mutation OR a breadth op it PRECEDES; a breadth op is ADDITIONALLY a hazard when it PRECEDES a git push): (A) a cd/pushd/popd segment EARLIER in the SAME command feeding a later recognized mutating git subcommand that carries no ABSOLUTE explicit binding (a trailing shift, e.g. 'git commit && cd /x', does not confuse the earlier mutation and ALLOWS), and (B) a whole-tree breadth stage (git add -A/--all/'.'/':/'; git commit -a/--all/-am) that FOLLOWS a cd/pushd/popd shift (the relocate note) OR PRECEDES a git push (the one DENY above; 'git add -A && cd /x' ALLOWS -- staging happened in the correct repo; 'git push && git add -A' ALLOWS -- the push published the pre-breadth state). Both orders are read within ONE reading of any context-dependent '#' at a time (the shared tokenizer's comment rule), the strictest decision across the readings standing, so a before/after sequence no single reading holds never fires. DELIBERATE NON-FIRES, disclosed: a lone bare mutating git command in the session cwd (no cd, no push, no breadth) is ALLOWED, as is a lone 'git commit -am'/'git add -A' with no cd/push; the wrong-session-cwd residual is owned by confirm-execution-target (exetgt) at the reasoning layer and by git-discard (prsunc) for lossy verbs, and the lone-breadth sweep by separate-task-changes (septsk); asking on every bare git mutation would over-fire and train its own bypass. EXPLICIT-BINDING CREDIT: a binding is credited ONLY when it is an ABSOLUTE -C or an ABSOLUTE --git-dir; a RELATIVE -C/--git-dir still resolves against the ambient cwd and a lone --work-tree without --git-dir does not name which repository, so neither is a complete explicit binding and both route to the same ASK a bare ambient mutation would; even a credited absolute binding is NOT verified to point at the intended repository (absoluteness and explicitness are not intent, which stays exetgt's obligation). READ-ONLY EXEMPTIONS: the branch/tag mutation classifier is FAIL-SAFE / DEFAULT-MUTATING -- a git branch/tag command is treated as a MUTATION unless EVERY option token positively resolves to a recognized read-neutral role AND no create/rename/delete target is present (before or after the '--' end-of-options marker); it handles option abbreviations, attached-short values, optional-value flags, clustered shorts, and post-'--' targets, so unknown, ambiguous (non-unique prefix), or malformed forms resolve to mutating (this replaced an enumerate-the-reads design). The read cases are a filtered/verify LISTING ('git branch -l/--list', '--contains/--merged/--points-at', 'git tag -v/--verify') and a bare 'git branch'/'git tag' listing; likewise 'git branch --show-current', 'git tag --points-at', 'git config --get' or a bare 'git config <key>' read, and a bare 'git config' listing, are exempted even under a cd. Option recognition STOPS at a '--' end-of-options marker, so a file literally named '--all'/'-A' after '--' is an operand, not a breadth selector, while a genuine whole-tree pathspec ('.'/':/') still counts. WRAPPER HANDLING: the common BARE wrappers command/exec/builtin/env and a leading sudo ARE peeled, so 'command git ...', 'sudo git ...', and 'command cd ...' are judged like the bare form; a wrapper carrying its own option or assignment ('env -i', 'env FOO=1', 'sudo -u u') is a DISCLOSED residual left unpeeled (its option grammar is not guessed), as is any wrapper outside that set or one that fragments the git/cd command word. A git command that defines a git alias for itself (a -c or --config-env key in the alias, include or includeIf section, or a GIT_CONFIG_PARAMETERS or GIT_CONFIG_KEY_n assignment naming one), its git word read wherever it stands in its segment (the command word, or a word behind a reserved word, a { group, !, time or a wrapper word; not inside the text of another word, such as an sh -c or eval body) runs a subcommand this check cannot see, so it reads as a mutation and as both a possible breadth stage and a possible publish, and so does every git command of a command whose text names GIT_CONFIG_PARAMETERS, GIT_CONFIG_COUNT or GIT_CONFIG_KEY_ anywhere (sought once every quote character, backslash, dollar sign and newline is removed, so a quoted, escaped or continued spelling counts, in any word, a here-string, a comment or an echo), a git command there being any segment with a word that names git as a word wherever it stands (behind a reserved word or a wrapper, or inside an eval or sh -c word), whatever form sets the variable and whatever its value, since a shell sets one in more ways than a reading of forms can list (on git 2.53.0 with bash 5.3 an export, declare -x, typeset -x or local -x word, a bare assignment or a readonly word to a variable already exported, and under set -a also a bare assignment, read, printf -v, a for loop variable, a default-value expansion or a nameref each defined an alias), so a mention that defines no alias (an echo, a comment, an unset, an unrelated value) counts too, a disclosed over-refusal, or that runs under a GIT_CONFIG_PARAMETERS or GIT_CONFIG_KEY_n naming one in the session environment the hook inherits, which counts as such a text does, git wherever it stands (not read: a variable name built at run time, such as an expansion after GIT_CONFIG_, a brace expansion or an escape decoded inside an ANSI-C quote, and a variable set outside the command text, in the startup files of the Bash tool shell or in a sourced file or a script the command runs). NOT CAUGHT (best-effort, not chased): an alias, shell function, eval, or fragmentation that removes a contiguous literal 'git' or cd/pushd command word; a cwd shift made in a PRIOR Bash call or via GIT_DIR=/GIT_WORK_TREE= environment (an inline GIT_DIR= assignment does NOT count as an explicit target, a disclosed conservative over-ask); a mutating subcommand outside the declared verb roster; plain (non-pruning) git fetch, deliberately excluded to hold the noise floor; mutations outside the Bash tool. A dynamic cd operand (cd \"$D\") still trips case A (the pattern, not the resolved dir, is judged). On a tokenizer parse failure a conservative raw scan DENIES on a visible breadth+push pairing (tested before the directory-change note, so a cd in the same text cannot mask that denial), ASKS on a visible cd+mutate pairing (which can over-ask on quoted prose inside the unparseable command), denies a text that names one of those git configuration variables and names git as a word twice or more (as many as a breadth stage and a later publish need), notes one that names such a variable and git beside a cd, and otherwise allows; an unreadable command string ASKS; a missing tool_name denies (shared fail-closed contract). Overlaps by design (defence in depth, consistent ASK, never conflicting): abs-paths-bash also asks on a RELATIVE cd, git-discard also asks on a compound lossy discard, and git-stash-ref also notes on a relocated pop/apply (cd /x && git stash pop double-notes with this hook under the same expbnd rule). DEADLINE: main() gives this check 8 seconds (the 10-second hook timeout less 2), counted from before its payload read, and fails closed with exit 2 when it has not decided by then; on the worst shapes the hooks self-test times, up to 1 MB, its slowest call took about 0.40 s in-process on a 24-core host with Python 3.14.4 (one run on 2026-10-18, including the shapes whose comment reading depends on context). Interpreter start-up and a wait the interpreter cannot interrupt (a read from a hung mount, a long call into C code) fall outside that deadline, and whether the platform blocks a call whose hook it stops at its own timeout is unverified. Where SIGALRM, setitimer or the main thread is unavailable, or SIGALRM is blocked, the check runs with no deadline; cleanup that runs while the deadline unwinds is outside it."

[[hook]]
id = "git-stash-ref"
rules = ["expbnd"]  # integ / explicit-binding-over-ambient-context
platform = "claude-code"
event = "PreToolUse"
matcher = "Bash"
handler = "git_stash_ref"
default = "block"
class = "b"
residue = '''
A best-effort LEXICAL check over Bash commands via the shared quote/redirect-aware tokenizer and the git-explicit-binding wrapper peel. ALLOW-WITH-A-NOTE by design (NO-ASK): a recognized bare git stash pop/apply emits one informational systemMessage per command, with no permissionDecision; any positional operand silently allows. The manifest block default is the fail-closed handler-error class marker, not a blocking verdict on a bare stash operation.

PRESENCE IS NOT IDENTITY: no validation of well-formedness, existence, or intended entry; a SHA-shaped operand is not object validation, and stash@{N} can change referent between listing and execution. Dynamic operands, including "$REF" and command substitutions, count as explicit even if empty at runtime; an empty quoted operand also counts. This is the accepted under-warn direction. No automatic stash@{0} substitution and no recovery snapshot.

NOT RESOLVED: git aliases, shell aliases/functions, eval, unknown wrappers, and wrappers carrying their own options or assignments (env -i, env FOO=x, sudo -u u). The common BARE command/exec/builtin/env/sudo wrappers are peeled exactly as in git-explicit-binding. Simple quote fragments ARE decoded by the shared tokenizer; fragmentation or obfuscation that does not resolve to recognized command/verb tokens remains outside coverage. This targets accidental ambient binding, not an adversary. The shared segmenter splits ordinary separators (;, |, &&, ||, newlines) and (...) subshells but does NOT structurally parse {...} brace groups or shell control-flow constructs, so a bare pop/apply is missed only when an unpeeled brace or shell-keyword token occupies the command-word position of git's segment: for example a { group opener, or a control keyword such as if, elif, else, while, until, then, or do immediately preceding git in the same segment (these examples are illustrative, not exhaustive); a git stash pop that a ; or newline delimits into its own segment IS seen and warns (git_discard's generic fallback may still note the missed same-segment form); extending the shared segmenter to those forms is a family-wide follow-on.

SIBLING NOTES: this note can co-occur with git_discard's raw/pristine fallback note on a wrapped or compound pop/apply, and with git-explicit-binding's note on a relocated form (e.g. cd /x && git stash pop); such sibling notes are consistent, never conflicting.

OPTION-GRAMMAR PIN: the current pop/apply grammar has no value-taking options (-q/--quiet/--index). A future value-taking option can make its value read as an explicit operand and falsely allow; re-validate on git upgrade. Option validity itself is not checked.

STACK-BLIND: no git calls or filesystem probes. Every recognized bare pop/apply warns regardless of actual stack state, including a freshly created single-entry stack; conversely a dangerous stack receives no escalation. This accepted over-warning supports WARN rather than DENY. SURFACE BOUND: Bash PreToolUse only, with no resolution of prior-turn shell state. Other stash verbs, including bare git stash (push), are outside this guard; drop/clear/export belong to git_discard.

FAIL POSTURE: a tokenizer ValueError never passes clean where a bare pop/apply cannot be ruled out. On an ordinary parse failure (an unbalanced quote, a here-string, a process substitution) a command whose text, as written or in a de-quoted reading (quote characters, backslashes and a $ before a quote removed, line continuations joined, each ANSI-C $'...' quote with its escapes decoded), names git and then stash gets the note (so does one naming another stash verb, or an entry the tokenizer could not read: an over-note, never a refusal), and text naming no such pair silently allows. On one raised at a '#' whose comment reading depends on context (the shared tokenizer's comment rule) that the tokenizer cannot judge under both readings (more than four such '#', one in or right after a backquote substitution, or a reading that does not lex; any other such '#' is judged under both readings, a comment to the end of its line and word text, and a bare pop/apply either reading reaches gets the note): the tokenizer reads nothing past that '#', so a command whose text (also with its backslash-newlines and then its quote characters and backslashes removed) names git and then stash gets the note, and so does one whose text holds quoting that removal does not decode (an ANSI-C $'...' or locale $"..." quote, or a quote character or backslash next to a letter), whatever its words, since a bare pop/apply spelled in it cannot be ruled out. An absent/unreadable command emits the sibling's exact binding-convention note. Only the shared missing-tool_name contract returns a structured deny; an unexpected event hard-blocks and dispatcher errors retain the fail-closed manifest default.

DEADLINE: main() gives this check 8 seconds (the 10-second hook timeout less 2), counted from before its payload read, and fails closed with exit 2 when it has not decided by then; on the worst shapes the hooks self-test times, up to 1 MB, its slowest call took about 0.52 s in-process on a 24-core host with Python 3.14.4 (one run on 2026-10-18, including the shapes whose comment reading depends on context). Interpreter start-up and a wait the interpreter cannot interrupt (a read from a hung mount, a long call into C code) fall outside that deadline, and whether the platform blocks a call whose hook it stops at its own timeout is unverified. Where SIGALRM, setitimer or the main thread is unavailable, or SIGALRM is blocked, the check runs with no deadline; cleanup that runs while the deadline unwinds is outside it.
'''

[[hook]]
id = "git-discard"
rules = ["prsunc", "expbnd"]  # integ / preserve-uncommitted-work + explicit binding
platform = "claude-code"
event = "PreToolUse"
matcher = "Bash"
handler = "git_discard"
default = "block"
class = "b"
residue = 'An ULTRA-CONSERVATIVE "recover-then-allow unless PRISTINE and provably clean" guard (EN-6; supersedes the GD-41 coarse cut and the EN-4 fail-open-lexical hook) with THREE outcomes: ALLOW (exit 0 silent), SNAPSHOT-THEN-ALLOW (an inert refs/aiqt-recovery/ snapshot is taken, then the discard is ALLOWED with a recovery note), and DENY (permissionDecision deny, blocks). NO-ASK posture: this guard never returns an ask; read every ASK below as that no-ask resolution, SNAPSHOT-THEN-ALLOW for a recoverable discard and DENY-and-educate when a warranted recovery snapshot cannot be made or the command cannot be classified or resolved. The recoverable SNAPSHOT-THEN-ALLOW is the characteristic behaviour; a confirmed whole-tree loss on a probed-dirty tree DENIES, BUT under a non-cosmetic ambient GIT_* var (an unresolvable repository view) even a whole-tree clobber is SNAPSHOT-THEN-ALLOWED with a best-effort cwd snapshot instead, because the guard cannot prove the target IS the session tree (only WITH a usable session cwd: with none, a destructive form under such an override DENIES, fail closed). It fails open (ALLOW) ONLY at the true boundary - a command with no git command-word, no recognized lossy verb, or an unparseable command (a tokenizer ValueError) that names no lossy verb keyword, whose recovered git segments run under no git alias the command defines, whose text does not name both git and one of the git configuration variables named below, and whose text does not both name git and hold a git alias definition anywhere in its de-quoted words - because that is not a discard it can reason about; a Bash payload whose tool_input.command is missing or not a string is NOT that boundary - it is a cannot-evaluate input and DENIES, fail closed, like the other PreToolUse controls; and a payload with no tool_name is malformed, not another tool, and DENIES under the shared missing-tool_name contract (a present non-Bash tool_name is out of scope). A # whose comment reading depends on context (the shared tokenizer comment rule) is judged under both readings, a comment to the end of its line and word text; a command the tokenizer cannot judge that way (more than four such #, one in or right after a backquote substitution, or a reading that does not lex) is raw-scanned with its backslash-newlines and then its quote characters and backslashes removed as well, so a continued spelling (git, a backslash-newline, then reset --hard) behind such a # is still flagged and DENIED; that removal is no decoder, so one whose text holds an ANSI-C or locale quote (a dollar sign right before a quote character) or a quote character or backslash next to a letter (g"it" re"set" --hard) is read as cannot-evaluate and DENIED whatever its words (an over-deny of every such command that loses no work, such as one that only echoes a quoted word). No such command reaches a recovery snapshot: its parenthesis, backquote or dollar-brace is outside the closed allowlist grammar and its raw text is never pristine. WITHIN scope (a recognized lossy verb: checkout/switch/restore/reset/clean/stash/rm/branch) the outcome is ASK UNLESS the command is a PRISTINE SINGLE BARE `git <verb>` invocation AND (for a lossy form) the whole working tree is PROVABLY CLEAN, or the form is genuinely non-destructive, in which cases ALLOW. PRISTINE SINGLE BARE is judged PURELY LEXICALLY (the bash grammar is NEVER parsed): after optional leading KEY=value assignments the command is exactly `git <args>` as ONE simple command, and the RAW string carries NO shell metacharacter ANYWHERE, EVEN INSIDE QUOTES - none of `;` `|` `&` `<` `>` `(` `)` `{` `}` `$` backtick backslash `!` newline, which by construction also rules out `&&`/`||`/`|&`, EVERY redirection form (`>`, `>>`, `<`, `2>`, `&>`, `>&`, `n>&m`, a leading or interspersed redirect), and EVERY command/process substitution (backtick, `$( )`, `<( )`, `>( )`) - AND no shell reserved word (if/then/elif/else/fi/for/while/until/do/done/case/esac/function/select/`[[`/`]]`/`{`/`}`) AND a command word that is LITERALLY `git` (not a path like /usr/bin/git, and not a wrapper: command/exec/builtin/env/xargs/time/`!`/sudo/nice/timeout/nohup/sh -c/bash -c). ANY shell metacharacter, wrapper, redirect, reserved word, second command, or option the classifier cannot resolve makes the command not-pristine, and it ASKS WITHOUT consulting the probe (a deliberate safe over-ask): treating the mere presence of shell structure in a lossy-verb command as an ASK is how the guard avoids modelling shell semantics it cannot model soundly. Only a metacharacter-free `git <verb> <plain args>` reaches the probe. PROVABLY CLEAN means the ONE read-only probe - `git -c status.showUntrackedFiles=all status --porcelain --untracked-files=all` (config-forced so a repo-local status.showUntrackedFiles=no CANNOT hide an untracked file, 5s timeout, offline) - reports NO tracked change (staged or unstaged, either column) AND NO untracked (`??`) entry; an untracked file is uncommitted work a force-checkout/clean/reset can destroy, so it counts as DIRTY (a `!!` line, never printed without --ignored, reads as malformed: cannot evaluate, never clean). When a pristine bare lossy form is on a provably-clean tree it ALLOWs (nothing the probe can see to lose); a pristine bare WHOLE-TREE-clobbering verb (reset --hard by effective last-wins mode, checkout -f with no pathspec, switch --force/--discard-changes) on a probed-DIRTY tree DENIES (the reason wording covers untracked-only-dirty too); everything else in scope ASKS. There is NO claim that any compound, wrapped, redirected, or non-pristine form the guard RECOGNIZES as in-scope is proven safe: those are never ALLOWED, only ASKED (no in-band override exists); the one exception is a command word `git` or a verb built in a way no raw, joined or de-quoted reading of the text assembles and the git alias reading does not deny (a disclosed residual below), which reads as out-of-scope and is silently ALLOWED, not ASKED. A dirty tree ALONE does not force that outcome on a PRISTINE bare form: a dirty-tree WHOLE-TREE clobber DENIES and other non-pristine or redirected forms ASK, but a genuinely non-destructive form (reset --soft, plain switch, checkout -b, clean -n) can still ALLOW on a dirty tree when no redirect or ambient override applies. Verb forms (each ALLOWs only as a pristine bare command on a provably-clean tree, except the unconditional-allow and unconditional-ask forms noted): checkout - a plain unforced branch-create (-b/--orphan) with NO merge option is an unconditional allow (git carries changes and aborts on conflict), and the NEW-BRANCH NAME argument of -b/-B (attached -bfoo or separated -b foo) is parsed as that name, never char-scanned as clustered force flags, so -bfoo/-bBranch ALLOW and are never mis-read as carrying -f/-B (F-85); -B is a force branch-create/RESET that overwrites an existing branch ref and can orphan committed commits, so it ASKS (including when combined with other flags); a -m/--merge or --conflict[=<style>] merge-switch, WITH or WITHOUT a -b create, does a three-way merge that can overwrite local changes and is worktree-scoped, decided before the branch-create allow (F-88); -p/--patch, any pathspec/bare-operand form, or a forced -f -b branch-create is worktree-scoped; -f with no pathspec is a whole-tree clobber. switch - -f/--force/--discard-changes is a clobber; -C/--force-create is a force branch-create/RESET that overwrites an existing branch ref and can orphan committed commits, so it ASKS; --merge/-m and --conflict[=<style>] are worktree-scoped (a three-way merge can overwrite local changes); a plain switch or an unforced -c create with NO merge option preserves non-conflicting local changes and aborts rather than lose them, so it is an unconditional allow, and the NEW-BRANCH NAME argument of -c/-C (attached -cfoo or separated -c foo) is parsed as that name, never char-scanned as clustered force flags, so -cfeature ALLOWs and is never mis-read as carrying -f/-C (F-85). restore - EVERY form is worktree-scoped, including --staged (it can erase staged-only content). reset - effective --hard clobbers; --soft is an unconditional allow (HEAD-only, index and worktree intact); --merge/--mixed/--keep/path-scoped/no-mode are scoped (index-changing); an ambiguous bare --m is scoped. rm - EVERY form is worktree-scoped, including --cached. clean - ANY non-dry-run clean is an unconditional ASK (untracked files are a different, unrecoverable asset, and the guard does not model whether the clean would fire, closing the clean.requireForce/-q/-i/clustered-flag edges); a -n/--dry-run judged before any `--` allows, BUT when an arg-consuming option -e/--exclude is present the `-n` is not trusted (it may be the exclude pattern) so the clean routes to its ASK. Destructive options are matched by CONSERVATIVE PREFIX (--patc=--patch, --del=--delete, --dis=--discard-changes, --har=--hard, --mer=--merge are unambiguous abbreviations git accepts; an AMBIGUOUS force-prefix like --for, which git itself REJECTS for branch as ambiguous with --format and for switch as ambiguous with --force-create, is treated as force ANYWAY, erring safe rather than recognizing only spellings git would accept); a `--`/`--end-of-options` boundary is respected so an operand after it (git clean -f -- -nasty, git rm -f -- --cached) is a pathspec, never a safe-looking option. stash drop/clear ASK, and stash export ASK for every spelling (F-95: export writes stash state to a ref, and --to-ref overwrites an arbitrary ref unconditionally); branch force forms ASK - -D/--delete --force (force delete), -M/--move --force (force rename), -C/--copy --force (force copy), -f/--force with an operand (force reset), and a delete (-d/-D/--delete) combined with -r/--remotes (F-94: deleting remote-tracking refs, which git force-removes past the merged-branch safeguard) - while a plain create/list, a local non-remotes -d, and an unforced -m/-c stay allow, and an attached -u<upstream> value (-ufoo, -u <upstream>) is parsed as the upstream, never scanned as a clustered force flag. A `git -C <dir> ...` or a GIT_DIR/GIT_WORK_TREE-prefixed form is pristine-lexically but names a worktree the guard cannot resolve to the session cwd, so it ASKS rather than trust a session-dir probe. For a whole-tree clobber that ASK resolves exactly as the bare form does: when the resolved target probes dirty it DENIES with its recovery snapshot, whatever git global option (value-taking, flag-only or unknown) or leading assignment the command carries; an AMBIENT override (below) keeps its best-effort snapshot-then-allow. A git alias the command defines or runs under (below) DENIES before either, with no snapshot taken. A destructive pristine form carrying a path-valued redirect (--git-dir, --work-tree or --bare, or a leading GIT_DIR=/GIT_WORK_TREE= assignment) is resolved by git itself: a read-only `git -C <session dir> <the same -C, --git-dir, --work-tree and --bare options> rev-parse --absolute-git-dir --show-toplevel`, with every ambient GIT_* scrubbed and the leading GIT_DIR/GIT_WORK_TREE re-applied, reports the git dir and worktree the command acts on, each relative value taken after the whole -C chain as git takes it. The discard is snapshotted at that worktree, then allowed (a whole-tree clobber on a dirty target still denies there, as above), only when git discovers the same git dir from it; an index-only form may use the -C directory or the session directory instead when git discovers that git dir there; every other case DENIES (a git dir and worktree split across repositories, a target git cannot resolve read-only, a global option beside the redirect other than -C, --git-dir, --work-tree, --bare and the value-less -P, --no-pager, --literal-pathspecs, --glob-pathspecs, --noglob-pathspecs, --icase-pathspecs, --no-replace-objects and --no-optional-locks, which git is asked with, a leading GIT_* assignment beside the redirect outside the cosmetic allowlist of the ambient check below, or a non-cosmetic ambient GIT_* variable), with a best-effort recovery snapshot of the repository holding that worktree when it lies in one and is not provably clean. Two checks that read the redirect from the session directory stay as a floor under that answer, so resolving through git never allows what they denied. A --git-dir or leading GIT_DIR= or GIT_DIR+= whose value, read from the session directory, is not the git dir of the session repository, and a worktree-content discard whose --work-tree or leading GIT_WORK_TREE= worktree lies outside the repository read from the -C or session directory, each still DENIES where git resolves one repository (git -C <repo> --git-dir=<repo>/.git, git -C <repo> --git-dir=.git --work-tree=.), with that repository snapshotted first when it is not provably clean; a GIT_DIR+= that follows another GIT_DIR assignment on the command builds a value that read does not trust, so it DENIES too, while a leading GIT_WORK_TREE+= is not read by the --work-tree check, so a GIT_WORK_TREE+= worktree that git resolves inside the git dir of its own repository is snapshotted there and allowed where the GIT_WORK_TREE= spelling DENIES (a split across repositories still DENIES). And the -C or session directory such a redirect was read from (the session directory beside a --git-dir or leading GIT_DIR=) is still probed whenever it lies in another repository than the one git resolved, and snapshotted as well when it is not provably clean; a successful snapshot there is named beside the resolved snapshot in the note or reason. A failed one (over the size cap, a temp dir resolving inside it, or any other snapshot failure) is allowed past, with that failure named in the note, only when the repository git resolved, the one the command acts on, was probed and is provably clean or was snapshotted first; when that snapshot fails or that probe does not complete it DENIES with the failure named, folding in the outcome of the resolved repository (a whole-tree clobber on a dirty target still DENIES there, as above, naming the failure). That oracle runs under the hook environment, not the command one, so a leading non-GIT_ assignment on the command (HOME=..., say) is not modelled; and a leading GIT_INDEX_FILE, GIT_COMMON_DIR or other GIT_* assignment with no path-valued redirect keeps the session-directory or -C snapshot, which does not hold an alternate index file. A stash drop/clear carrying a leading GIT_DIR+= assignment denies exactly as its GIT_DIR= spelling does. An AMBIENT GIT_*-prefixed var in the process env also forces ASK unless it is one of a small COSMETIC allowlist (UI/editor/pager/prompt/lock/identity vars that cannot change the discard target, the object/ref view, the index, or dirtiness detection): the probe scrubs every ambient GIT_* and reads the real cwd repo, but the guard cannot scrub them from the ACTUAL command, which still inherits them and may act on a different git dir, work tree, index, or object/ref view, so the guard cannot prove the repository view the ACTUAL command uses IS the session cwd. Under any such non-cosmetic ambient var EVERY in-scope pristine form ASKS - a destructive clobber AND an otherwise-non-destructive allow form (reset --soft, plain switch, clean -n, checkout -b) alike, checked BEFORE the role/allow logic - each DESTRUCTIVE form with a best-effort cwd snapshot WHEN the session cwd is a not-provably-clean snappable tree (a provably-clean cwd takes none, a NON-DESTRUCTIVE allow form takes none, and a stash/branch-only form takes none; NO usable session cwd DENIES a destructive form, fail closed, and takes none; the snapshot may not capture a redirected tree), so no allow form and no clean cwd probe wins a silent ALLOW under such a redirect. A GIT_TRACE* var is NOT cosmetic: an absolute GIT_TRACE value makes the ACTUAL command append trace output to that path (which could be a repo file), so it too forces ASK (the recovery/probe git calls 