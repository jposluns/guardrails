ns any program git's configuration wires to its DEFAULT form (diff.external and textconv for diff, log -p, show and blame, a configured pager) with no option at all, since the rule judges argv, not configuration; a read verb the grammar passes may still write git's on-disk index, since git status and other reads refresh the held worktree's index stat cache in the background, a metadata-only write read as read-only because it changes no tracked content; FILE EDITS inside a held worktree (Write/Edit tools, sed -i, cp) are covered by the rule but not by this hook (extending write-scope is a separate follow-on), a shell redirection (> or >>) is stripped from the one plain git segment before the grammar reads it, so a read verb redirected into a file inside the held worktree writes it outside the grammar's view, the same file-edit residual, and the EXACT remainder of the file-writing class is in that residual too: a file-writing option outside the enumerated tables, or a path-writing POSITIONAL operand (worktree add, the clone and init directory operands, bundle create, pack-objects' base name, merge-file, mailinfo), whose operand is RELATIVE or built by an expansion ($, a backquote, a glob or brace character, a leading ~), since such an operand cannot be told from a ref or pathspec without re-implementing each verb's grammar, while the enumerated file-writing path options are refused whatever their operand, the input-path admissions (apply --unsafe-paths, fast-import --allow-unsafe-features) are refused while any hold the rule can see is live, so a write path carried in patch or stream content cannot escape the target tree where a hold is visible, while from a session outside every held repository whose command text names no held path the content is unread, the hold unseen and the admission not refused, the same residual, and the held-path gate refuses every literal absolute operand that resolves into a held worktree, from a session outside every held repository too, since the operand itself joins the hold set; marker accuracy is the adopter's (a missing marker, an early removal, a wrong workdir, a review outlasting expires_utc); a race between the check and the command running remains; and the marker directory is writable by the assistant, so a determined actor can remove a hold, the same suite-level limit ORCHESTRATION.md already discloses. Implementation residuals: the held BRANCH is pinned against the ref writes named above and against fetch/pull/push/send-pack anywhere in the held repository, and a certain target in ANY worktree of the held repository is withheld for every form outside the read-only grammar, so a 'git switch --ignore-other-worktrees' checkout or a 'git branch -f' from a sibling worktree is withheld too; what can still move the held branch is a push from ANOTHER repository naming this one by URL or relative operand (a URL or relative operand joins no hold set; an absolute path operand joins it, but a hold reached only that way does not withhold a certain unrelated target with no unaccounted directory step, and a push operand naming the held worktree's own path is refused by the held-path gate), surfaced after the fact by the drift note; a held worktree nested under a worktree of a DIFFERENT repository is protected only where the command's hold set names the held repository (the session cwd or a literal operand), since a mutation bound to the enclosing foreign repository alone reads no marker of the nested one; a git too old to answer --no-recurse walks only the terminal of a symbolic-ref chain, and one too old to answer --git-common-dir echoes the option back on exit 0, an unreadable reply that now FAILS CLOSED like every other probe failure (earlier releases read it as inert); only git's specific not-a-git-repository answer, matched at the start of one of the probe's own C-locale stderr lines, reads as an absent repository, and a hold-set candidate is resolved physically first, a missing one consulted at its nearest existing ancestor; HOME is not resolved, so a bare 'cd' contributes no hold-set entry; and the core.worktree expansion chain is bounded, so an absurd or cyclic configuration chain stops expanding at its bound, under-extending only what the chain itself added, never a candidate the command names. DEADLINE: main() gives this check 8 seconds (the 10-second hook timeout less 2), counted from before its payload read, and fails closed with exit 2 when it has not decided by then; its git identity probes are capped and cached per check. Interpreter start-up and a wait the interpreter cannot interrupt fall outside that deadline, and whether the platform blocks a call whose hook it stops at its own timeout is unverified. Where SIGALRM, setitimer or the main thread is unavailable, or SIGALRM is blocked, the check runs with no deadline; cleanup that runs while the deadline unwinds is outside it."

[[hook]]
id = "orch-prompt-stamp"
rules = ["tstamp", "estsep"]
platform = "claude-code"
event = "UserPromptSubmit"
handler = "orch_prompt_stamp"
default = "warn"
class = "c"
residue = "A RECORDING substrate: stamps the clock-read UTC time of each GENUINE human prompt into turn-state (resetting the stop guard's deny counters), classifies a prompt matching a registered wake as timer-originated (not stamping it), and injects a measured-gap context line so any quiet-duration reasoning uses the measured figure. It never blocks, and a lease max_age_hours horizon that cannot be evaluated does not turn this recorder off: the stamp or classification proceeds anyway and the cannot-evaluate is surfaced as a note (armed and surfaced, never a silent skip). Turn-state is saved through the state directory opened once as a directory descriptor (with O_PATH where the platform has it, an open that needs no permission on that directory itself, only search permission on its ancestors, while the later stat, create, rename and cleanup need search permission on it, the last three write permission too; where O_PATH is absent the fallback open also needs read permission on that directory), every later step bound to it, so that directory swapped for a symlink after the open cannot redirect the save or its cleanup (the directory path itself is resolved once, at that open, a directory moved after the open still receives the save under its new name, and the writing uid is not a boundary): the hook creates a temporary file of its own beside turn-state.json (an exclusive create under a random name that never follows a symlink, so nothing already at a temporary-like name is written or removed), giving it the existing file's permission bits (0600 for a new file), writing and fsyncing it, and renaming it onto turn-state.json: a reader sees the previous file or the new one, never a part of either, and a failed save leaves the previous file (or its absence) in place and is named with its error in the note, which also names a temporary file whose removal after the failure failed, by the state directory path as given, which after a swap may no longer lead to it (one left by a process killed mid-save is removed by nothing). Concurrent saves never share a temporary file, but the last rename wins, so two hooks that update turn-state at once can lose one update (the read-modify-write is not serialized) while each reports its save as succeeded. Where turn-state cannot be written, a genuine prompt still proceeds, with a note saying its time was not stamped and the deny counters were not reset, and a timer-originated prompt's context line and a systemMessage say consuming its wake digest failed, so a later prompt with the same text may read as timer-originated or as genuine human input. Classification is digest matching against wake registrations this suite itself recorded: a wake fired through a mechanism the suite never saw is stamped as genuine human input (the safe direction: it only narrows guard autonomy). An unknown prior stamp yields an 'unknown' gap that authorizes nothing."

[[hook]]
id = "orch-resume-audit"
rules = ["sesres", "recncl", "cnclse"]
platform = "claude-code"
event = "SessionStart"
handler = "orch_resume_audit"
default = "warn"
class = "b"
residue = "SessionStart cannot block at the platform (exit 2 shows stderr only, doc-confirmed 2026-08-29), so this layer SURFACES divergence and ARMS the PreToolUse resume barrier; the barrier is the mechanism. Probes, all fail-closed to a finding rather than a silent pass: the declared handoff's Branch line against the real HEAD (scrubbed read-only probe), a handoff gate marker's commit against the real HEAD commit, lease staleness, every declared record surface readable (a declared-but-unreadable surface is a cannot-evaluate FINDING, never nothing-to-check), and merge-pending rows against first-parent merge evidence; with a registry present, also a registry the loader reports bad and the truncation guard's deny at its scope check for a Bash call from the repository root (the same finding list tools/orch_doctor.py --resume-audit writes): a root git resolves but the walk cannot carry out (for example one this process can enter but not read) arms the barrier in EVERY mode (where the session cwd is missing, empty or not a string, or git resolves no root for it, for any reason, such as an unreadable or broken config, a dangling gitfile, a dubious-ownership refusal, no git binary, a timeout, or a cwd this process cannot enter, or git exits 0 but prints output that cannot be decoded, is empty, or is not absolute, the audit returns silently in both modes before it reads the registry, and for a non-empty string cwd whether the truncation guard's scope check denies a Bash call from it depends only on its own ancestor walk of that cwd and the mode; git can still resolve a root this process cannot enter, through core.worktree from a session cwd inside the repository's git directory, and the audit then warns and arms the barrier in both modes where that root exists without search permission or is not a directory, because the registry loader reports it bad (as it does for a regular file named .aiqt at any root), and stays silent where that root does not exist, because the loader reports the registry absent), and an absent or unconfirmable registry scope (a symlinked registry, for example) arms it when AIQT_ORCH_REQUIRE_REGISTRY selects registry-required mode, so this layer is mode-sensitive. The barrier does not record that mode, so the two writers agree only when run with the same value; a doctor run without it can clear a barrier a registry-required SessionStart armed for a scope deny; clearing it does not allow any Bash call, because the barrier only warns and the guard denies on its own scope check. Arming and clearing are BEST-EFFORT and ATOMIC: both writers create a temporary file beside the barrier file, flush and fsync it, then rename it onto the barrier file with os.replace. Where the barrier cannot be written (its state directory cannot be created, the temporary file cannot be created or written, or the rename fails, for example XDG_STATE_HOME naming a regular file, or a full disk), the SessionStart audit removes the temporary file it created and ignores the error so SessionStart never wedges, the previous barrier file (armed or clear) or its absence is left byte-identical, the PreToolUse barrier therefore does not surface this run's findings, and the session still sees the SessionStart warning naming them (where opening the forced-exit log fails other than as not found, because the state directory cannot be searched or is not a directory, as with that regular file, the warning also names the forced-exit log as unreadable), and that warning then also says the barrier was not persisted (this audit did not arm it) and asks for a manual record instead of saying a re-run clears the barrier, naming the remedy (remove a directory at the barrier path, which neither audit can replace; otherwise make the state directory creatable and writable), while a clean audit that cannot clear the barrier adds no warning (a barrier it leaves armed still reads as armed, noted once per arming where its warned flag can be written, otherwise on each mutation outside the record surfaces, so one already warned about stays silent; a directory in its place reads as armed and is noted on each mutation outside the record surfaces); tools/orch_doctor.py --resume-audit does not ignore that error, its run ends with it, and the previous barrier file is left unchanged. The PreToolUse barrier reads the barrier file only where the registry loader reads the registry ok, and reads a barrier file that exists but is unreadable or malformed as armed (see orch-resume-barrier). Registry-scoped: silent where the registry loader reads the root's registry as absent; a root the loader cannot examine reads bad, not absent, and the audit warns. It reads records, git state, and the truncation guard's registry discovery only; it cannot detect a handoff that is stale in ways its declared grammar does not carry (free-text drift). Lease MISMATCH detection at this audit stays bounded to staleness, over the file mtime and, where the registry declares a lease heartbeat block, the declared heartbeat field too (an invalid declaration, an unevaluable heartbeat, and a stale or future heartbeat field are findings): these probes are shared with tools/orch_doctor.py --resume-audit, which runs with no session identity, so the holder field is not compared HERE; where the lease declares holder_is_session_id, each lease-scoped guard proves the payload session identity against the holder field per event, and the orch-lease-heartbeat controls surface a lost or taken lease to the session that last provably held it."

[[hook]]
id = "orch-resume-barrier"
rules = ["sesres", "recncl"]
platform = "claude-code"
event = "PreToolUse"
matcher = "Write|Edit|MultiEdit|NotebookEdit|Bash"
handler = "orch_resume_barrier"
default = "warn"
stage = "bake"
class = "b"
residue = "The mutation barrier behind orch-resume-audit, shipped WARN-FIRST (stage bake, a recorded posture): while the barrier state is armed it surfaces a systemMessage on the first mutation outside the allowlist (the record surfaces, the registry files, and the suite's own state directory stay writable, so the only exit, correcting the record, is never blocked), and it blocks nothing during the bake. The flip to deny is a manifest edit (stage to enforce, default to ask/deny) taken on recorded guard-events evidence after the bake period, per the guardrail-config-integrity discipline. Bash targets are not path-judged (a command's write targets are not lexically resolvable), so Bash mutations pass with the same surfacing only. Clearing the barrier requires re-running the audit (tools/orch_doctor.py --resume-audit) against corrected records; acknowledgement alone does not clear it. An absent barrier file (a dangling symlink included) reads as clear, and a symlink to a regular file reads as that file. The barrier is read with a non-blocking open (a FIFO with no writer does not wait for one), an fstat that refuses anything not a regular file before any read (so a FIFO or a device such as /dev/zero is never read), and a read bounded at 64 KiB. One that exists but is not a regular file (a FIFO, a socket, a device, a directory, or a symlink to any of these), is larger than the bound, cannot be read or parsed for any reason (including a RecursionError from deeply nested JSON), or is not a well-formed barrier (a JSON object whose keys are exactly a boolean active and a list of string findings, both required, plus an optional boolean warned and an optional string ts; a truncated write by an earlier writer is not), reads as ARMED, not absent: every mutation outside the allowlist then surfaces a note naming the file as unreadable or malformed with the reason (not once per arming, since there is no readable warned flag to record), which blocks nothing during the bake, and a mutation on the allowlist is allowed after the same read (a regular file on a filesystem that stalls, such as a hung network mount, can still stall the read until the hook timeout, as any file read can); it clears when the doctor's --resume-audit or the next SessionStart audit replaces the file (the rename replaces a FIFO, a device node or a symlink at the path and leaves a symlink's target intact), or when the user corrects or removes it (the state directory is on the allowlist), and where the state directory cannot be searched the replace fails too, so the note persists until its permissions are restored. Neither audit can replace a directory at the barrier path itself (the rename fails with IsADirectoryError), so for a directory the note says to remove the directory; a symlink to a directory gets the generic note, since the rename replaces the link. A writer removes the temporary file it created when any later step fails (writing, closing or renaming it) and never removes a temporary name it did not create; a process killed between creating and renaming it leaves that temporary file beside the barrier file. Recording the warned flag replaces the file atomically too; a failed replace leaves it unchanged, so the note surfaces again on the next mutation. DEADLINE: main() gives this check 8 seconds (the 10-second hook timeout less 2), counted from before its payload read, and fails closed with exit 2 when it has not decided by then; on the worst shapes the hooks self-test times, up to 1 MB, its slowest call took under 0.01 s in-process on a 24-core host with Python 3.14.4 (one run on 2026-10-18, including the shapes whose comment reading depends on context). Interpreter start-up and a wait the interpreter cannot interrupt (a read from a hung mount, a long call into C code) fall outside that deadline, and whether the platform blocks a call whose hook it stops at its own timeout is unverified. Where SIGALRM, setitimer or the main thread is unavailable, or SIGALRM is blocked, the check runs with no deadline; cleanup that runs while the deadline unwinds is outside it."

[[hook]]
id = "orch-lease-heartbeat-post"
rules = ["cnclse", "recncl"]
platform = "claude-code"
event = "PostToolUse"
matcher = ".*"
handler = "orch_lease_heartbeat_post"
default = "warn"
class = "c"
residue = "REGISTRY- AND DECLARATION-SCOPED keeper, inert by default: it runs only where the orchestration registry's lease declares holder_is_session_id and a valid heartbeat block (the registry is the confinement's trust root, so enabling the keeper, and the wider refresh mode, is an operator act there; an invalid block never writes, never falls back to another mode, and is surfaced as a Stop warning and a resume-audit finding (never a guard-events row or a memory save: no descriptor proof exists before the first open, and a bookkeeping writer with no held descriptor withholds)). It WRITES only in the declared refresh mode, and only when every proof holds: one parsed holder field EXACTLY equals the payload session_id (never a whole-token presence test, which a decoy line such as a previous_holder entry passes), the lease is a single-link regular file owned by the effective uid, reached by a component-wise no-follow descriptor walk (a '..' component is refused and a symlink at ANY component refuses, ancestors included), its declared state (where one is declared) is an active value, its recorded times (the file mtime, and the declared heartbeat field where one is declared, judged on the OLDER of the two) are neither future-dated nor past the refresh ceiling of two clock skews under max_age_hours, and the file's identity is re-checked against the proof before the touch or the exclusive-temporary-file atomic replace; a declared heartbeat field is rewritten with a clock read at the event, never a recalled value, and a lease inside refresh_after_minutes is left alone (idempotent). It NEVER creates, seizes, revives or releases a lease, never renews a LAPSED one (refreshing a live, proven-held lease in the declared refresh mode is the feature), and it never rewrites one that is absent, foreign, released, unreadable, oversized, non-UTF-8, unparsable, duplicate-keyed, git-tracked, hard-linked, foreign-owned, on a protected path (a .git, .aiqt or .claude component, plugin/, anywhere inside the state directory's or another protected directory's subtree, judged by ancestor-identity containment rather than child enumeration, or an inode alias of a registry file; a protection check that cannot be evaluated refuses, and the protected-path and tracking gates cover BOTH refresh forms, the mtime touch included, because there the mtime IS the recorded liveness value), while a lease outside the repository work tree passes the git tracking gate (it cannot be tracked there; outside-ness is decided on resolved paths, never a lexical spelling), or stale or future-dated (those are warned about, never renewed; a future value is left in place as a record of the clock skew or tampering). On this event it is SILENT on stdout (it never exits 2, never blocks and shows no message: its result is exit 0, and only a stop raised inside the core, an interrupt or an exit, propagates and can end the hook with another non-zero status, never 2, because the binding re-raises an exit whose status would be 2 as an exit with status 1; a withheld or failed bookkeeping write, a written-unverified refresh and a written-not-durable refresh ride the result's error text to the dispatcher's stderr): guard-events rows and that report are the only traces (one row per persisting refusal state, never one per call, and the git tracking probe of an unchanged refusal is backed off), the Stop binding owns the warning, and the binding catches the core's own faults (a fault inside the judged table becomes one row ONLY on the branches where the proven descriptor is held, recorded while it is held; on a busy or faulted lock the table runs with no held descriptor, so a fault there records no row and joins the Stop-only deferrals, dropped with a PostToolUse event's holder; a fault outside the table records no row and rides the result of its own event), never a per-tool-call banner. Residuals: a session that makes no tool call and ends no turn produces no heartbeat (staleness is then the correct outcome, and a long foreground tool call delays the refresh by up to its own length); two processes sharing one session_id both refresh and the double run is not detected; the optional declared flock lock is taken BEFORE the lease is read and held across the whole read-prove-write span, so every proof holds inside its critical section and an in-place change by a writer that used the lock is read there and refuses (the lease is RE-OPENED under the held lock, so a cooperating takeover between the first open and the lock reads as taken or lost, never a cannot-evaluate, and a flock fault other than busy is a named refusal surfaced on Stop with the fault named exactly once per turn end (a due refresh's banner names the fault and carries the bookkeeping consequence, with the deferral dropped rather than rendered a second time), never a silent skip or a per-call report; the lock must be a STABLE, SEPARATE coordination file NO writer of this plugin ever replaces, so a lock_path that names, or resolves to the same identity as, the declared lease or ANY file a whole-file writer of this plugin replaces (the past-holder memory, the guard-events log, every _orch_write_json_atomic target such as turn-state.json and backlog-checkpoint.json, and anything else inside the state directory) is refused by one SHARED read-only validation on paths and destinations resolved from the authoritative root, at declaration validation, at the resume audit and at the entry check (resolved path, resolved-path containment in the state directory, parent identity and inode, with a stat fault other than absence the named refusal and nothing created), and again by descriptor identity under the held lock, where every state-directory entry is also swept by fstat identity against the held lock descriptor, because flock attaches to the open file description, so a keeper whose own save or refresh replaced its lock file would leave the next cooperating keeper locking the replacement while this one still holds the orphaned inode, voiding the critical section), while a writer that ignores the lock (or any writer where none is declared) can still race the re-check-to-replace window, where an unlinked lease is revived by the replace or a swapped-in acquire is overwritten, a window the identity re-check narrows but cannot remove, and one the post-replace verification does not report (it reads the replace's own content, which carries this session's refreshed value, so the revived lease or the overwritten acquire reads as a clean refresh; it can report a change that lands between the replace and its own re-read, or a verification fault, where the refreshed lease cannot be re-opened, re-read or re-parsed, and it can undo nothing); Bash can still rewrite the lease or the registry (the standing write-scope residual); the past-holder memory and the guard-events append are best-effort (a lost row or memory only widens silence, never a write), and BOTH destinations are checked distinct from the declared lease at the entry, by resolved path, by inode and by parent identity (a lease path that IS the state directory or an ancestor of it is refused BEFORE that directory would be created, with nothing created; otherwise an absent state directory is created first, idempotently under concurrent creation, so that leg always compares real identities, and a creation fault is the named cannot-evaluate whose remediation names the state-record fault while a faulted lease access names the lease path, each chosen from the fault itself, never from a substring of the detail), and AGAIN AT EVERY WRITE: each append opens its destination by NAME relative to the held state-directory descriptor (dir_fd) with O_WRONLY|O_APPEND|O_CREAT|O_NOFOLLOW|O_NONBLOCK|O_NOCTTY (an absent log is created, so a refused append can still have CREATED an empty destination file, the disclosed O_CREAT side effect, with no row byte landing anywhere; a planted symlink is refused, never followed; a FIFO, with or without a reader, returns promptly and is refused on the descriptor's own stat, never a blocked hook), fstats the very descriptor it writes through and writes only a regular file with exactly one hard link whose identity differs from the held lease descriptor's and from an lstat of the lease name taken relative to the held lease parent-directory descriptor AFTER the destination fstat, the memory and backoff saves create their temporary file exclusively, check the temporary DESCRIPTOR before its first byte (a regular file with exactly one hard link, distinct from the held lease descriptor and from a fresh lstat of the lease name, so a temporary renamed onto the lease name, hard-linked or unlinked before the first write is refused with nothing written through the descriptor) and replace relative to that same held state-directory descriptor on both sides (src_dir_fd and dst_dir_fd) after the same identity checks on the replace target and an identity re-check of the temporary NAME immediately before the replace (a re-pointed temporary name publishes nothing, and the failure cleanup unlinks the temporary name only when one stat just before the unlink finds it still carrying the inode the save created, running from a finally for ANY exception class, the unlink itself by name since POSIX offers no unlink-if-inode; one whose identity was never learned, because the pre-write stat itself faulted, is disclosed in the report and never unlinked, and a cleanup stat fault other than confirmed absence also never unlinks and discloses the name and the fault), and a refused or failed write is withheld and reported through the hook result (the Stop banner, or the result's error text, which the dispatcher writes to stderr), never into a file (the DISCLOSED residual of the bookkeeping is the SAME-USER CONCURRENCY CLASS, stated once and completely: a concurrently running process of the same user can rename, re-point, link or replace ANY entry between ANY check and its use, the state directory, the lease's parent directory, the lease, a bookkeeping destination or a temporary file, so a row can land at a declared path, which the suite keeps a disclosed-residual WITNESS vector for, re-pointing the lease's parent directory at the state directory between the destination open and the identity read and showing the row landing at the declared lease path, or a bookkeeping write can be lost, and the failure cleanup of a field write or a save, unlinking by name after one identity stat, removes an entry swapped onto the temporary name between that stat and the unlink in its place, leaving the moved temporary undisclosed, which the suite keeps a WITNESS vector for too; the checks cover ACCIDENTAL mis-targeting and a stale or replaced lease, and they do not guarantee a boundary against a same-user concurrent actor, which needs OS isolation, distinct users or a state directory and lease directory private to this keeper), with the destinations, the HELD, separation-proven lease descriptor, the lease parent-directory descriptor and the state-directory descriptor (opened once, O_DIRECTORY|O_NOFOLLOW, when the proof passed; the holder is refused outright when the state directory and the lease's parent are the same directory by fstat identity) carried as ONE per-event holder that EVERY bookkeeping writer consumes, the row append, the event append, the memory save, the tracking backoff save and the crash recorder included (none re-reads anything, and none writes without the held descriptor); the holder is emptied by the first open, by taking the declared lock and by the under-lock re-open, filled only by the separation re-proof on the descriptor then in hand, and emptied again BEFORE any descriptor or lock is released (a core fault inside the judged table records its one crash row from within the critical section, before descriptors or lock are released), so the entry path before the first open, an invalid declaration, a failed first open, a failed under-lock re-open, a busy or faulted lock, a crash before the proof or after cleanup, and an unknown or unusable lease path each write and record NOTHING, a disclosed narrowing surfaced through the hook result (the busy- and faulted-lock branches, the no-holder branches that still run the decision table, record their bookkeeping refusal as a deferral surfaced on Stop only, at most once per turn end, the faulted-lock deferral naming the fault and rendered once, a due refresh's banner naming the fault with the deferral dropped, never a report on every PostToolUse call; a deferral made on a PostToolUse event is dropped with that event's holder, so a core fault deferred there surfaces only where the Stop event reproduces it, while every other no-holder refusal rides the result's error text of its own event, PostToolUse included, and a core fault recorded on those branches surfaces as the named fault, never folded into the lock deferral; a refusal never records into the refused lease; while a collision persists the keeper writes and records nothing anywhere and the Stop warning is the only surfacing); the declared lease path and lock_path values are validated on the strings alone BEFORE any path resolution (an embedded NUL, or an empty component from a doubled, leading or trailing separator, is the named refusal on Stop, never a resolution fault or a silent allow) and descriptor ownership is exception-safe from the moment of acquisition (any fault, not only OSError, one inside the first separation proof included, closes each held descriptor exactly once; the holder build owns its freshly opened state-directory descriptor in a try/finally from the open until its transfer to the holder, across both identity fstats and the replacement of a previous holder descriptor); a field write changes only the declared field's value text (in json the value is replaced in place, never re-serialized, and the write is refused unless every other member's value text stays byte-identical and its parsed value exactly equal), refuses a lease carrying a setuid, setgid or sticky bit (the field write only: the mtime touch changes no permission bit and still runs on such a lease) and otherwise carries every permission bit over, gives its temporary the lease's group before the first byte (on Linux a new file starts in the creating process's effective group, or in the directory's group where the directory is setgid or the filesystem is mounted with grpid; a failure to set it is the named no-write refusal, with nothing published, so where it always fails, for example for a process without CAP_CHOWN whose effective and supplementary groups do not include the lease's group, writing where a new file does not start in that group, or on a filesystem that refuses the change, every field refresh is refused: Stop warns of that refusal only while the lease is still eligible for a refresh, and once the lease is past the refresh ceiling Stop warns instead that it is too close to renew, then, once stale, that it has lapsed), and reports a failed directory fsync after the replace as a write that happened but may not be durable, never as plain success (the Stop warning, or on PostToolUse the result's error text, with an attempted guard-events row; a failed append is reported through the withheld-bookkeeping warning instead), and reports a failed post-replace verification the same way on both events, as a write that happened, never claimed clean, while extended attributes and ACLs are not carried over by a field write, and the final parent directory needs read permission for the fsync; a temporary file that may remain after a fault inside the failure cleanup of a field write or a bookkeeping save is named in the withheld report by a record whose fixed part is formatted before the temporary is created, and a stop raised while that record is built, recorded or replaced never displaces a stop already propagating, but only for faults raised inside those guards: a stop raised while a withheld record naming a temporary that may remain (this one, or one the failure cleanup makes for any other cause, such as an identity never learned) is itself appended, before that append has taken effect, propagates without that record, ordered as a stop raised in the cleanup (nothing is recorded, and no preformatted record can be, because recording one needs the very append that stopped), a stop raised while a field write's refusal detail naming that temporary is built propagates with the refusal never returned, memory exhaustion so severe that a fixed-size step fails (a call, the append that records the entry) can lose that record, and a stop delivered as a signal at an instant outside the guards leaves the failure cleanup at that point, unordered; and a fresh heartbeat proves only that the session is alive, never that it is making progress, so it must never count as activity for yield decisions."

[[hook]]
id = "orch-lease-heartbeat-stop"
rules = ["cnclse", "recncl"]
platform = "claude-code"
event = "Stop"
handler = "orch_lease_heartbeat_stop"
default = "warn"
class = "c"
residue = "The Stop binding of the same core as orch-lease-heartbeat-post, with the same scoping, holder proof, write discipline, fault directions and residuals; it covers a turn that made no tool calls, and it is the ONLY binding that surfaces a message (exit 0 systemMessage, at most one per turn end): a declared lease that coincides with the keeper's own bookkeeping destinations, by resolved path, inode or parent identity, whether found at the entry proof, on the first opened descriptor or at the under-lock re-open (nothing written, nothing recorded, and nothing created: a lease path at or above the keeper's own state directory is refused before that directory would be created; a refusal branch holding no proven descriptor, the entry path before the first open, an invalid declaration, a failed open or re-open, a busy or faulted lock, likewise records nothing and surfaces through the hook result (on Stop this banner, or the result's error text, joined by any deferred or withheld bookkeeping report; a no-holder refusal outside the lock branches rides the error text of the event it happened on, PostToolUse included: a busy or faulted declared lock defers its report to Stop at most once per turn end with the fault named and rendered exactly once, a due refresh's banner naming the fault with the deferral dropped, a deferral made on a PostToolUse event is dropped with that event's holder, and a core fault recorded there surfaces as the named fault, never folded into the lock deferral), while every write a proven branch does make goes through a destination opened relative to the held state-directory descriptor and fstat'ed at write time, so a destination aliased onto the lease is refused there too, with the lease-name identity read AFTER that stat, reported in this banner or as the result's error text (the dispatcher's stderr), never into a file); a declared lock_path that names, or resolves to or is aliased by identity to, the lease or ANY file a whole-file writer of this plugin replaces, the bookkeeping targets, every _orch_write_json_atomic target such as turn-state.json and anything else inside the state directory included (refused by one shared read-only validation on paths resolved from the authoritative root, at declaration validation, at the resume audit and at the entry check, by resolved path, state-directory containment, parent identity and inode, and by descriptor identity under the held lock, where every state-directory entry is swept against the held lock descriptor: the lock must stay a stable coordination file no writer of this plugin ever replaces); an invalid heartbeat declaration (an unusable declared path value is refused on the string alone, before any path resolution; no row and no memory save, this warning and the resume audit are the only surfacing); a heartbeat gap past warn_after_minutes (refreshed in refresh mode, named as unrefreshed in warn mode, which never writes the lease, though its bookkeeping rows and saves still run through the held-descriptor discipline and a failed one is reported in this banner); a lapsed, future-dated, too-close-to-staleness or not-active lease; a cannot-evaluate (an unreadable, symlinked, hard-linked, oversized, malformed or ambiguous lease: a named no-write warning, never a write); a lost or taken lease, surfaced only to the session the state-directory memory records as the last proven holder; a refused refresh; a verified replace whose directory fsync failed, reported as a write that HAPPENED but may not be durable, never as plain success (with an attempted guard-events row; a failed append joins this banner as the withheld-bookkeeping report); and a post-replace verification failure, which is reported as a write that HAPPENED, never claimed clean. It never exits 2 (a stop raised inside the core propagates, but an exit whose status would be 2 is re-raised as an exit with status 1), never blocks, never asks, and never alters orch-stop-guard's decision: a refresh only keeps a fresh lease fresh, it never re-arms a lapsed lease and never disarms a live one, so its order against the stop guard on the Stop event does not matter."
