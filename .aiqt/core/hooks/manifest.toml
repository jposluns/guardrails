nment that redirects nothing (any other leading assignment, such as `FOO=1`, counts as a possible redirect), and the migration sentence below, which adds reason text only. BOUNDED EQUIVALENCE: when the same command without the prefix already names a recognized work-losing git verb, and the prefixed command is a pristine single bare git command (the shell lexer parses it and its raw string carries no shell metacharacter), the prefixed command gets the decision and the snapshot of the command without it, because past the pristine gate the guard decides from the token list plus the raw-scan lossy-keyword flag, which the command without the prefix already set. When the command without the prefix names no such verb, it is allowed silently at the true boundary, and a pristine prefixed command can get nothing more permissive than that. Outside that bound the value is ordinary text in the raw command string, which the conservative raw scans of the guard read like any other text, so the decision can differ from the one the command gets without the prefix: (a) a value carrying a shell metacharacter, even quoted (`GUARDRAIL_ALLOW_DISCARD=";" git reset --hard`), makes the command not pristine; (b) a value that leaves a quote unbalanced (`GUARDRAIL_ALLOW_DISCARD="1 git reset --hard`, which bash itself rejects) makes the command unparseable; (c) on an unparseable command every raw-flagged form is denied by the unparseable-command fallback, so the prefixed, the FOO-prefixed and the unprefixed spellings of an unparseable `git reset --hard <<EOF` whose heredoc body holds a lone quote all DENY alike; (d) the scope scan reads a git or work-losing-verb keyword inside the value, so `GUARDRAIL_ALLOW_DISCARD=reset git log -1` is in scope and DENIES as a flagged subcommand outside the recognized set, where `git log -1` is allowed. In case (a) on a dirty session tree the command gets a best-effort snapshot then ALLOW-with-note (DENY if the snapshot fails) where the bare whole-tree clobber DENIES, and with no session cwd a DENY (fail closed: the session-directory snapshot base cannot be resolved, exactly as for `FOO=<the same value>`); in case (b) it gets the unparseable-command fallback, where every raw-flagged unparseable command DENIES, exactly as the bare unparseable form does. No code on the non-pristine path or the unparseable-command fallback reads the name, so there the prefixed command gets exactly what the same command with `FOO=<the same value>` gets. These are existing behaviours of the raw scans and the non-pristine path that any leading assignment, metacharacter or second command reaches, not a property of this prefix. For this release only, a truthy one on a pristine bare command also adds a reason sentence stating that the override was removed and that `git stash` then the discard is the route (an unparseable or non-pristine command gets no such sentence); the next release deletes that sentence, the helper that adds it and its self-test vectors. For an intentional discard on a dirty tree, `git stash` (with `-u` for untracked files) then the discard reaches the provably-clean ALLOW with the work recoverable in the stash. The prefix no longer skips a recovery snapshot: no code path reads its value to skip one, so within the bounded equivalence above a prefixed command takes the snapshot the command takes without it, and on the non-pristine path and the unparseable-command fallback the snapshot `FOO=<the same value>` takes (the forms that take none, such as a ref-level or stash/branch asset and an ignored file, take none with or without it; the no-session-cwd non-pristine path above DENIES and takes none). The operator channel for a standing exemption is the hook configuration (disable or reconfigure the hook). HONEST RESIDUAL: being a LEXICAL hook it does NOT catch a git alias defined in a configuration file, or a shell function, that renames git or expands to a work-losing verb, a discard performed OUTSIDE the Bash tool, or persistent sh