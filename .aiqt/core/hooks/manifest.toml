# .aiqt/core/hooks/manifest.toml: the mechanical-enforcement manifest (GD-24).
#
# One [[hook]] per shipped control. `id` is a stable, unique control identifier (a kebab-case slug);
# `rules` names the corpus-id(s) the control enforces, and every `rules` element must resolve to a real
# corpus-id in .aiqt/core/rules/ (validated by tools/gen_hooks.py against gen_rules.load_corpus, the
# same no-orphan pattern check_mappings uses for standards ids). A rule may back more than one control
# (cnsdif has both a Stop layer and a PreToolUse diff-source layer), so the control key is `id`, not the
# corpus-id, and `rules` carries the corpus linkage. tools/gen_hooks.py renders this manifest into the
# shipped Claude Code plugin surface under plugin/aiqt-guardrails-hooks/ (hooks/hooks.json,
# hooks/scripts/aiqt_hooks.py, .claude-plugin/plugin.json) and drift-gates it in CI; this file and the
# scripts/ tree beside it are the single edit point, the generated surface is never hand-edited.
#
# Fields per [[hook]]:
#   id       a stable, unique control identifier (kebab-case slug)
#   rules    the corpus-id(s) this control enforces (a list: a control may enforce more than one rule,
#            and a rule may back more than one control)
#   platform "claude-code" (the only renderer so far; a neutrality dimension, not an abstraction)
#   event    a known Claude Code hook event (Stop, PreToolUse, ...); whitelisted by the generator
#   matcher  the tool-name pattern for tool events; OMITTED for non-tool events such as Stop
#   handler  the function in scripts/aiqt_hooks.py that implements the control (unique per control)
#   default  "block" (hard deny / exit 2), "ask", or "warn" (a non-blocking surfacing warn, exit 0,
#            legal on a WARN_EVENTS event: PostToolUse, UserPromptSubmit, Stop, SubagentStop,
#            SessionStart, or under an explicit bake stage); most slice-1 controls are lexical and
#            zero-intent, so they ship at block
#   class    the EN-5 enforceability letter (a deterministic-gate, b hook-detectable, c partial,
#            d judgement), carried through so the surface traces to its enforceability claim
#   residue  REQUIRED, never empty: what this control does NOT catch, so the shipped surface stays
#            honest about heuristic coverage

[plugin]
name = "aiqt-guardrails-hooks"
version = "0.4.0"
description = "Mechanical enforcement of AIQT Guardrails rules for Claude Code, generated from the rule corpus."
author-name = "Jeff Posluns"
author-email = "jeff@posluns.ca"
homepage = "https://aiqt.ai"

[[hook]]
id = "diff-wall-stop"
rules = ["cnsdif"]  # trust / no-console-diff-dumps
platform = "claude-code"
event = "Stop"
handler = "diff_wall_stop"
default = "warn"
class = "b"
residue = "This Stop layer is a NON-BLOCKING surfacing WARN (systemMessage, exit 0), not a hard block: by Stop time the wall has already rendered, and with no stop_hook_active field and no documented loop bound a hard block could wedge the session, so hard prevention lives in the PreToolUse diff-source layer instead. It catches only a unified-diff wall in the final assistant message of a turn: diff --git headers, paired @@ hunk headers, fenced diff/patch/udiff blocks (backtick or tilde) of 10 or more lines, and mixed +/- runs of 8 or more lines. It does not catch a diff dumped mid-turn between tool calls, side-by-side or word-diff renderings, or raw log or patch walls that carry none of those markers; a mixed +/- Markdown checklist can rarely trip the +/- run detector (accepted residual)."

[[hook]]
id = "diff-source"
rules = ["cnsdif"]  # trust / no-console-diff-dumps (PreToolUse layer A)
platform = "claude-code"
event = "PreToolUse"
matcher = "Bash"
handler = "diff_source_pretool"
default = "block"
class = "b"
residue = 'AIRTIGHT-NARROW (L11 redesign: the GD-112 philosophy applied to diff-dumps). A best-effort QUOTE/REDIRECT-AWARE LEXICAL check over the Bash command via the shared raw-command tokenizer (_lex_command), which decides quoting and REDIRECTION from raw character positions BEFORE tokenizing, so a redirection ANYWHERE in a command (leading, interspersed, or trailing) is recorded as metadata and REMOVED from the argv, closing the redirect-pollution class shared across the lexical Bash hooks. An unquoted # at a word boundary is a COMMENT (the rest of the line is ignored, so a redirect or pipe that is commented out earns no proof; a mid-word # such as ticket#123 stays literal); a backslash-newline is a LINE CONTINUATION that joins (comment handling is RE-APPLIED at the word boundary a continuation exposes, so git diff <backslash-newline># > out.txt still comments out the redirect, while a continuation that lands MID-word keeps a following # literal) and never injects a synthetic empty argv element (which would have mis-set the subcommand and defeated the sibling guards); and a redirect target is classified CONSERVATIVELY on BOTH its raw and its LEXICALLY-normalized form (os.path.normpath, never touching the filesystem): a target whose RAW form begins with /dev or /proc is treated as a device and DENIED even if a .. in it would normalize elsewhere (git diff > /dev/../tmp/out.txt DENIES, an over-block in the SAFE direction), an ABSOLUTE target that NORMALIZES to under /dev or /proc is an unambiguous console/device target and DENIES (git diff > /tmp/../dev/stdout), a RELATIVE target whose normalized FIRST component is dev or proc (git diff > dev/stdout, > ./dev/stdout, > proc/self/fd/1) is CWD-DEPENDENT - from cwd / or via a dev/proc symlink it IS that device, but from an ordinary working tree it is a plain relative file - so it cannot be proven a plain file and ASKS (opaque), never a silent ALLOW and never a hard DENY of a legitimate write into a dev/ or proc/ subdirectory of the working tree itself, a .. in a target NOT under /dev or /proc yields an OPAQUE target that cannot be proven a plain file and ASKS (git diff > /tmp/../out.txt), and a plain static non-/dev,/proc file target ALLOWS (git diff > /tmp/out.txt); a relative .. escape that normpath cannot resolve (../../../dev/stdout) is likewise opaque rather than a proven real file. Rather than ENUMERATE every dumping form of git (an unbounded shell + git-option grammar, GD-34/F-119), the ALLOW path PROVES the safe form: a git diff-PRODUCER is ALLOWED only when the WHOLE command matches one of FIVE closed proofs. (A) EXACT help: a metacharacter-free git <producer> --help or -h (and the exact git stash show --help/-h). (B) EXACT summary-only: a metacharacter-free single simple command (a conservative character set of letters, digits, space, tab, and _ - . / = : @ , + % and no shell reserved word), whose first resolved words are literally git and a summary-capable producer (diff/show/range-diff/log/diff-tree/diff-index/diff-files, plus the explicit git stash show), carrying at least one EXACT summary selector (--stat/--shortstat/--numstat/--name-only/--name-status) before a --/--end-of-options boundary and no other option-like word before the boundary except an exact --no-patch (bare operands allowed). (C) DIRECT static real-file diversion: a SINGLE simple command whose command word is literally git, a possible producer, with no opaque shell feature, whose FINAL stdout redirect (last-redirect-wins over the raw redirect metadata) is proven to land on a static non-/dev,/proc file - supporting leading, interspersed, and trailing redirects, but never a dynamic target (a variable, command substitution, or tilde), a descriptor duplication (1>&2, or a 3>out 1>&3 fd-graph, classified opaque), or a /dev,/proc target. (D) EXACT terminal pager pipeline: a plain literal unwrapped git producer, an exact | (not |&), then exactly one bare pager word (less/more/most/pager) with no options, operands, or redirection and no later pipe. (E) BENIGN git log listing: a metacharacter-free single simple command whose first words are literally git and log, every option before a --/--end-of-options boundary drawn from an EXACT allowlist of VALUE-FREE, provably-diff-free display/traversal flags (--oneline, --graph, --decorate, --no-decorate, --abbrev-commit, --reverse, --all) with bare revision/pathspec operands allowed - a plain commit listing that provably emits no diff (git log renders a patch ONLY with a patch flag, and a summary --stat form is already proof B). A git log carrying ANY other flag - a patch flag, a pickaxe -G/-S (whose diff output depends on a co-present -p), a summary/file-list flag (--numstat/--shortstat/--name-only/--name-status, which are the proof-B summary escape, allowed there like git diff --name-only), a value-taking option such as --format/-n <count>/--author=/--since=/--grep=, or any unknown flag - is NOT admitted by proof E and routes to the default (ASK, or DENY on a confirmed patch). The ALLOW path DELIBERATELY does NOT parse the full git/shell option grammar. Every OTHER possible producer is ASK or DENY: a producer CONFIRMED to emit a console patch (a default diff/show/range-diff, a patch-flagged listing, a summary token in a NON-option position such as git diff -- --stat, a producer piped into a known console/truncating sink cat/tee/head/tail, or a stdout redirect to /dev,/proc) and fitting no proof DENIES; any other producer-capable-but-unproven form ASKS. A producer that diverts its output with --output/-o writes the diff to THAT target, not stdout, so a shell redirect or a pager is a DECOY: proofs C and D do not apply, a --output to a /dev,/proc console DENIES, and a --output to a file or a dynamic target ASKS. A command word this guard cannot resolve to a literal git (an ANSI-C dollar-single-quote form or a $VAR expansion) beside a producer surface is never proven benign and never a CONFIRMED console dump: it ASKS. Across a compound or multiple producers, DENY outranks ASK, and a multi-command form is NEVER allowed merely because one segment is safe. The possible-producer scope is BROAD (a git word followed by a producer surface in the cleaned argv, robust to quote fragmentation, OR a raw-text probe that over-matches quoted prose), so it OVER-ASKS by design; on a tokenizer parse failure (an unbalanced quote or an unsupported construct such as a heredoc or process substitution) an apparent producer ASKS - never a silent allow, and no summary or redirect regex can earn an ALLOW from an unparseable command. DELIBERATE OVER-ASKS, disclosed: a wrapper (env/sudo/command git diff), a pathed git (/usr/bin/git show), a leading assignment, any quote in a would-be summary command, a git log carrying any extra or unknown flag OUTSIDE the proof-E benign set (git log -5, git log -G/-S, git log --format, git log --author=), git grep diff, an extra summary modifier (git diff -M --stat, git diff -S --stat, git diff --stat=80), a compound, and quoted prose (an echo of the literal text git diff) all ASK rather than risk a false ALLOW. HONEST non-catches (best-effort, not chased): a git alias, a shell function, or a PATH-shadow name that omits a detectable git word; an expansion, eval, base64, or nested-script text that defeats both the cleaned-token scan and the raw fallback marker; a producer subcommand outside the declared roster; a diff produced by a NON-git tool or assembled across commands, or emitted outside the Bash tool; runtime or config behaviour that writes directly to a tty (a pager or GIT_PAGER/config set in a PRIOR turn); a static path target that is itself a symlink, FIFO, or device node, or that resolves to one through a symlinked ANCESTOR directory (a relative first-component dev/proc NAME is now caught lexically and ASKS, but the check never resolves symlinks, so a device reached through ANY symlinked ancestor, whether or not that ancestor is named dev/proc, is not distinguished), or that races after the check; and pager or PATH resolution at runtime. It is BEST-EFFORT: it targets the common/accidental case, not an adversary determined to evade it.'

[[hook]]
id = "commit-identity"
rules = ["cmtidn"]  # integ / commit-identity
platform = "claude-code"
event = "PreToolUse"
matcher = "Bash"
handler = "commit_identity"
default = "block"
class = "b"
residue = 'A best-effort QUOTE-AWARE LEXICAL check over the Bash command string: tokenized with the shared quote/redirect-aware tokenizer (_lex_command), which respects quotes and REMOVES shell redirection from the token stream (so a redirect before or around the subcommand no longer hides a Co-Authored-By trailer, an --author value, or an identity assignment) and grouped into segments on the unquoted shell operators ; | || && & ( ) and newlines, so a subshell-grouped commit (( git commit --author=... )) is judged too, and a trailer hiding inside a quoted -m message (-m "fix; Co-authored-by: Claude", which the old whitespace split broke at the ;) now lives intact in the single message token and is caught by a substring scan on that token. On a git commit-family segment (commit, merge, cherry-pick, am, rebase, revert, commit-tree) it flags a Co-Authored-By trailer inside any token or an --author value (--author=X or --author X) naming an AI; in ANY segment it flags a git-identity env var (GIT_AUTHOR_NAME/GIT_COMMITTER_NAME) or a user.name/user.email value (a -c user.name=X inline or a config user.name X pair) naming an AI, so setting the identity in a prior segment then committing is caught. git global options that take an argument (-C, -c, --git-dir, --work-tree, --namespace, --exec-path, --super-prefix, --config-env), whose value is now its own token, are skipped so the value is not misread as the subcommand. The BARE message body is deliberately NOT matched against the identity set: a legitimate message that merely mentions an AI product name (-m "fix claude adapter") records no AI identity, and denying it would be a false positive; only a trailer or an --author value records identity. On a shell parse error (unbalanced quotes) it fails SAFE: a conservative raw-string scan denies an apparent AI trailer/--author/env/config assignment, never a silent-allow. It is BEST-EFFORT: it targets the common/accidental case (the assistant own accidental violation), not an adversary determined to evade it. It does NOT defeat deliberate shell escaping (git \commit), obfuscation, an alias or function that renames the tool, or persistent shell/env/config state such as an AI identity persisted in git config in a PRIOR TURN (not the same command), a trailer staged into a message file and committed with -F/-t, a commit made outside the Bash tool or the session, or an AI product name outside the recognized identity set.'

[[hook]]
id = "abs-paths"
rules = ["abspth"]  # quali / absolute-paths
platform = "claude-code"
event = "PreToolUse"
matcher = "Read|Write|Edit|MultiEdit|NotebookEdit|Glob|Grep"
handler = "absolute_paths"
default = "block"
class = "b"
residue = "Covers the required-absolute file_path of Read, Write, and Edit and the required-absolute notebook_path of NotebookEdit (absolute by each tool's own contract, so the relative-to-a-named-root carve-out never applies to them), plus the OPTIONAL path search root of Glob and Grep (which should be absolute), and the MultiEdit file_path kept for LEGACY COMPATIBILITY. Each field name is bound to a Claude Code tool schema (Read/Write/Edit -> file_path, NotebookEdit -> notebook_path, Glob/Grep -> optional path); MultiEdit -> file_path is retained as a legacy-compatibility wire (MultiEdit is NOT in the current Claude Code built-in tool index, so its mapping is kept only so an adopter on an older or re-enabled MultiEdit is still covered, never an assertion that MultiEdit is a current tool). This STRUCTURED coverage binds ONLY those enumerated tool schemas: a path carried in any OTHER tool field, tool, or parameter, or in Bash command text, is out of scope here (the sibling abs-paths-bash floor covers only a cd/pushd destination and a redirect target in Bash, nothing else). Absoluteness is judged by the runtime's own path semantics (PurePosixPath/PureWindowsPath.is_absolute), so a drive-RELATIVE 'C:file', a bare 'C:', and a rooted-but-driveless leading-backslash path are correctly NOT absolute, while a POSIX '/x', a drive-absolute 'C:\\x'/'C:/x', and a UNC '\\\\server\\share' are; a '~'-prefixed path is not expanded and is not absolute. Honours the carve-out: the relative search PATTERN of Glob and Grep is legitimately relative to its named root and is never judged, and a rootless call (no path) names the current directory as that root and is allowed. Fails CLOSED: a tool_input that is not a readable mapping, or a required file_path/notebook_path that is absent or not a non-empty string, denies rather than passing (closing the earlier fail-open where a malformed tool_input collapsed to an empty mapping and took the search-root allow branch). Does NOT judge whether an absolute path points at the INTENDED target (absoluteness is not intent), and is platform=claude-code only."

[[hook]]
id = "abs-paths-bash"
rules = ["abspth"]  # quali / absolute-paths (Bash cwd-floor layer)
platform = "claude-code"
event = "PreToolUse"
matcher = "Bash"
handler = "bash_absolute_paths"
default = "ask"
class = "b"
residue = "A SEPARATE best-effort Bash layer of abspth, distinct from the structured typed-path guard (abs-paths), whose structured coverage binds only the enumerated tool schemas and never Bash command text. This is a CONSERVATIVE FLOOR, ASK-defaulting and NEVER denying (the human confirming is the opt-out): it judges ONLY two positions that silently resolve against the current working directory, a cd/pushd DESTINATION operand and a redirection TARGET, and NEVER an arbitrary command operand (a relative path argument to any other command is deliberately NOT judged, to avoid over-firing). A relative or unresolvable such position ASKS; an absolute one, an UNQUOTED CURRENT-USER tilde destination ('~' or '~/x', which the shell expands to $HOME so it is cwd-independent), a bare 'cd'/'pushd' and the OLDPWD 'cd -' (both only absent ANY leading inline env-assignment, see below), the real cd/pushd option flags (cd -L/-P/-e/-@, pushd -n, singly or bundled), a pushd stack rotation (+N/-N), and a numeric/'-' descriptor duplication (2>&1) allow. The tilde-ALLOW is NARROWED to the current-user forms and gated on a WHOLE-TILDE-PREFIX-UNQUOTED signal, NOT on the broader token-wide opacity flag: it is True only when the token begins with an unquoted '~' AND the ENTIRE tilde-prefix (from that '~' up to the first UNQUOTED '/', or end of word) is unquoted and unescaped, which is exactly when bash performs tilde-expansion. So a QUOTED leading tilde, EVEN with an unquoted expansion/glob/brace TAIL (the \"~\"/x*, '~'/x?, \"~\"/$V, \"~/repo\"* forms), is NOT tilde-expanded (the '~' is quoted, the word stays RELATIVE) and ASKS, as does a fully-quoted '~'/'~/x', an escaped '\\~/...', and an empty-quote-preceded '\"\"~/x' (bash expands only a '~' at the very start of the word). It ALSO ASKS a leading unquoted '~' whose PREFIX itself carries a quote or escape BEFORE the first unquoted '/' - '~\"/x\"', '~'' (empty single-quote), '~\"\"/x', '~'/x'', '~\"/\"$V', and a '~' followed by an escaped '/' - because any quote or escape in the tilde-prefix disables bash expansion and the word stays RELATIVE, EVEN when the DECODED token is fully literal '~/x' with no opacity. Only a quote or expansion AFTER the prefix-closing unquoted '/' does not block expansion, so the genuine 'cd ~/$VAR' (prefix is the bare '~', the '$VAR' sits after the '/') STAYS ALLOW. Round-4 propagates this SAME clean-leading-tilde signal into the redirect-TARGET classification (previously the redirect parser discarded it, so a '> ~/x' target was classed opaque and ASKED, inconsistent with 'cd ~/x'): a redirect target whose whole leading tilde-prefix is clean/unquoted now ALLOWS ('> ~/x', '> ~/\"x\"', '> ~/$V', and the bare '> ~'), while a quoted or complex-prefix tilde target ('> \"~\"/x', '> ~\"/x\"') keeps its opacity and ASKS - exactly matching the cd tilde rule. A '~user'/'~user/x' names another account's home whose EXISTENCE the hook cannot verify (an unresolved login name leaves the word RELATIVE), so it is NOT proven absolute and ASKS (the conservative call; a '~user' cd is rare); the '~-'/'~+'/'~N' directory-stack forms likewise ASK. Only the closed option forms are treated as non-destinations, and '--' ENDS option processing, so a genuine relative directory name that begins '-'/'+' is still the destination and ASKS ('cd -- -rel', 'cd +rel', 'cd -rel'), while a lone '-' AFTER '--' is still the $OLDPWD shortcut in bash and ALLOWS ('cd -- -') and a post-'--' directory literally named '--' stays relative and ASKS ('cd -- --'); an opaque '$VAR' destination cannot be proven absolute and ASKS. ANY leading inline env-assignment PREFIXING a cd/pushd (any variable name, '=' or the append '+=' form) can redirect where the cwd-INDEPENDENT destinations land: an inline OLDPWD=/OLDPWD+= redirects the lone '-' ($OLDPWD) shortcut and an inline HOME=/HOME+= redirects the bare 'cd' ($HOME default), in each case to a value the floor cannot prove absolute (e.g. '..'). Round-4 CONSERVATIVE CONSOLIDATION: rather than enumerate OLDPWD/HOME by name (which missed the '+=' append form and the bare-cd HOME default entirely - the round-3 under-blocks), the floor takes the stance that the mere PRESENCE of ANY leading assignment makes those two otherwise-cwd-independent destinations ASK, so 'OLDPWD=.. cd -- -', 'OLDPWD+=.. cd -', 'HOME=.. cd', 'HOME+=.. cd', and 'HOME=.. pushd' all ASK, while a plain zero-assignment 'cd -'/'cd -- -'/bare 'cd' keeps its ALLOW. This is DELIBERATELY conservative in two disclosed ways: (a) a BENIGN leading assignment on a cwd-independent form ('FOO=x cd -', 'FOO=x cd') also ASKS, the accepted cost of not name-enumerating; and (b) an assignment token whose NAME was quoted or escaped ('\"OLDPWD\"=.. cd -', 'OLD\"PWD\"=.. cd -', 'OLDP\\WD=.. cd -') is a COMMAND to bash (command-not-found; cd never runs), but its DECODED form is assignment-shaped ('OLDPWD=..'), so the floor reads it as a leading assignment and ASKS - an intentional over-fire on an assignment-shaped token bash would reject anyway, NOT chased with assignment-name quote provenance. It reuses the shared quote/redirect-aware lexer (_lex_command), so a redirect anywhere is seen and a quoted metacharacter is not miscounted; but the lexer is NOT a shell interpreter: it cannot resolve an ALIAS, a shell FUNCTION, eval, a command substitution, or a VARIABLE EXPANSION, so a cd or redirect reached through any of those, or whose command word is not literally cd/pushd (a wrapper, a PATH-shadowed name, an absolute /usr/bin/cd is resolved by basename but an aliased 'cd' is not), is not judged. An operand carrying an unexpanded expansion never reads as absolute unless it is literally rooted, so 'cd $DIR' ASKS while 'cd /$X' allows; a redirect target formed from an expansion is classified opaque and ASKS. A bare filename passed to an unknown command is indistinguishable from data and is not judged. Absoluteness is NOT intent: an absolute cd or redirect can still point at the wrong directory. An unparseable construct (a heredoc, here-string, process substitution, '{fd}>' redirect, or an unbalanced quote or escape) is handled by PARTIAL lex: the COMPLETE segments before it AND the positions of the still-open IN-PROGRESS segment that were fully parsed BEFORE it are still inspected, so an earlier resolvable relative cd/redirect - whether in an earlier segment ('cd rel; cat <<EOF...') OR the redirect target of the same in-progress segment parsed before the construct ('cat > out.txt <<EOF...' and 'cat > out.txt <(...)' ASK on out.txt) - still ASKS rather than being discarded; ONLY a cd/redirect position WITHIN or AFTER the unparseable construct is left uninspected and ALLOWED, a disclosed residual rather than an over-ask on every such command. A missing tool_name denies (the shared fail-closed contract); a missing or unreadable command string ASKS rather than silently allowing. It is best-effort against the accidental case, not an adversary, and is platform=claude-code only."

[[hook]]
id = "git-discard"
rules = ["prsunc"]  # integ / preserve-uncommitted-work
platform = "claude-code"
event = "PreToolUse"
matcher = "Bash"
handler = "git_discard"
default = "ask"
class = "b"
residue = 'An ULTRA-CONSERVATIVE "ask unless PRISTINE and provably clean" guard (EN-6; supersedes the GD-41 coarse cut and the EN-4 fail-open-lexical hook) with THREE outcomes: ALLOW (exit 0 silent), ASK (permissionDecision ask, prompts the human), and DENY (permissionDecision deny, blocks). The `default` is "ask" because the recoverable ask is the characteristic behaviour; a confirmed whole-tree loss on a probed-dirty tree DENIES (unless the leading opt-out is set), BUT under a non-cosmetic ambient GIT_* var (an unresolvable repository view) even a whole-tree clobber ASKS with a best-effort cwd snapshot instead, because the guard cannot prove the target IS the session tree. It fails open (ALLOW) ONLY at the true boundary - a command with no git command-word, no recognized lossy verb, or an unparseable command (a tokenizer ValueError) that names no lossy verb keyword - because that is not a discard it can reason about. WITHIN scope (a recognized lossy verb: checkout/switch/restore/reset/clean/stash/rm/branch) the outcome is ASK UNLESS the command is a PRISTINE SINGLE BARE `git <verb>` invocation AND (for a lossy form) the whole working tree is PROVABLY CLEAN, or the LEADING opt-out is set, or the form is genuinely non-destructive, in which cases ALLOW. PRISTINE SINGLE BARE is judged PURELY LEXICALLY (the bash grammar is NEVER parsed): after optional leading KEY=value assignments the command is exactly `git <args>` as ONE simple command, and the RAW string carries NO shell metacharacter ANYWHERE, EVEN INSIDE QUOTES - none of `;` `|` `&` `<` `>` `(` `)` `{` `}` `$` backtick backslash `!` newline, which by construction also rules out `&&`/`||`/`|&`, EVERY redirection form (`>`, `>>`, `<`, `2>`, `&>`, `>&`, `n>&m`, a leading or interspersed redirect), and EVERY command/process substitution (backtick, `$( )`, `<( )`, `>( )`) - AND no shell reserved word (if/then/elif/else/fi/for/while/until/do/done/case/esac/function/select/`[[`/`]]`/`{`/`}`) AND a command word that is LITERALLY `git` (not a path like /usr/bin/git, and not a wrapper: command/exec/builtin/env/xargs/time/`!`/sudo/nice/timeout/nohup/sh -c/bash -c). ANY shell metacharacter, wrapper, redirect, reserved word, second command, or option the classifier cannot resolve makes the command not-pristine, and it ASKS WITHOUT consulting the probe (a deliberate safe over-ask): treating the mere presence of shell structure in a lossy-verb command as an ASK is how the guard avoids modelling shell semantics it cannot model soundly. Only a metacharacter-free `git <verb> <plain args>` reaches the probe. PROVABLY CLEAN means the ONE read-only probe - `git -c status.showUntrackedFiles=all status --porcelain --untracked-files=all` (config-forced so a repo-local status.showUntrackedFiles=no CANNOT hide an untracked file, 5s timeout, offline) - reports NO tracked change (staged or unstaged, either column) AND NO untracked (`??`) entry; an untracked file is uncommitted work a force-checkout/clean/reset can destroy, so it counts as DIRTY (only an ignored `!!` entry is treated as clean). When a pristine bare lossy form is on a provably-clean tree it ALLOWs (nothing the probe can see to lose); a pristine bare WHOLE-TREE-clobbering verb (reset --hard by effective last-wins mode, checkout -f with no pathspec, switch --force/--discard-changes) on a probed-DIRTY tree DENIES (unless the leading opt-out is set; the reason wording covers untracked-only-dirty too); everything else in scope ASKS (unless the leading opt-out is set on a pristine bare form). There is NO claim that any compound, wrapped, redirected, or non-pristine form the guard RECOGNIZES as in-scope is proven safe: those are never ALLOWED, only ASKED (a pristine bare form carrying the leading opt-out is the sole override, short-circuiting even the redirect gate); the one exception is a wrapper that fragments the command word `git` or the verb so no recognized lossy verb is seen (a disclosed residual below), which reads as out-of-scope and is silently ALLOWED, not ASKED. A dirty tree ALONE does not force that outcome on a PRISTINE bare form: a dirty-tree WHOLE-TREE clobber DENIES and other non-pristine or redirected forms ASK, but a genuinely non-destructive form (reset --soft, plain switch, checkout -b, clean -n) can still ALLOW on a dirty tree when no redirect, opt-out, or ambient override applies. Verb forms (each ALLOWs only as a pristine bare command on a provably-clean tree, or one carrying the leading opt-out, except the unconditional-allow and unconditional-ask forms noted): checkout - a plain unforced branch-create (-b/--orphan) with NO merge option is an unconditional allow (git carries changes and aborts on conflict), and the NEW-BRANCH NAME argument of -b/-B (attached -bfoo or separated -b foo) is parsed as that name, never char-scanned as clustered force flags, so -bfoo/-bBranch ALLOW and are never mis-read as carrying -f/-B (F-85); -B is a force branch-create/RESET that overwrites an existing branch ref and can orphan committed commits, so it ASKS (including when combined with other flags); a -m/--merge or --conflict[=<style>] merge-switch, WITH or WITHOUT a -b create, does a three-way merge that can overwrite local changes and is worktree-scoped, decided before the branch-create allow (F-88); -p/--patch, any pathspec/bare-operand form, or a forced -f -b branch-create is worktree-scoped; -f with no pathspec is a whole-tree clobber. switch - -f/--force/--discard-changes is a clobber; -C/--force-create is a force branch-create/RESET that overwrites an existing branch ref and can orphan committed commits, so it ASKS; --merge/-m and --conflict[=<style>] are worktree-scoped (a three-way merge can overwrite local changes); a plain switch or an unforced -c create with NO merge option preserves non-conflicting local changes and aborts rather than lose them, so it is an unconditional allow, and the NEW-BRANCH NAME argument of -c/-C (attached -cfoo or separated -c foo) is parsed as that name, never char-scanned as clustered force flags, so -cfeature ALLOWs and is never mis-read as carrying -f/-C (F-85). restore - EVERY form is worktree-scoped, including --staged (it can erase staged-only content). reset - effective --hard clobbers; --soft is an unconditional allow (HEAD-only, index and worktree intact); --merge/--mixed/--keep/path-scoped/no-mode are scoped (index-changing); an ambiguous bare --m is scoped. rm - EVERY form is worktree-scoped, including --cached. clean - ANY non-dry-run clean is an unconditional ASK (untracked files are a different, unrecoverable asset, and the guard does not model whether the clean would fire, closing the clean.requireForce/-q/-i/clustered-flag edges); a -n/--dry-run judged before any `--` allows, BUT when an arg-consuming option -e/--exclude is present the `-n` is not trusted (it may be the exclude pattern) so the clean routes to its ASK. Destructive options are matched by CONSERVATIVE PREFIX (--patc=--patch, --del=--delete, --dis=--discard-changes, --har=--hard, --mer=--merge are unambiguous abbreviations git accepts; an AMBIGUOUS force-prefix like --for, which git itself REJECTS for branch as ambiguous with --format and for switch as ambiguous with --force-create, is treated as force ANYWAY, erring safe rather than recognizing only spellings git would accept); a `--`/`--end-of-options` boundary is respected so an operand after it (git clean -f -- -nasty, git rm -f -- --cached) is a pathspec, never a safe-looking option. stash drop/clear ASK, and stash export ASK for every spelling (F-95: export writes stash state to a ref, and --to-ref overwrites an arbitrary ref unconditionally); branch force forms ASK - -D/--delete --force (force delete), -M/--move --force (force rename), -C/--copy --force (force copy), -f/--force with an operand (force reset), and a delete (-d/-D/--delete) combined with -r/--remotes (F-94: deleting remote-tracking refs, which git force-removes past the merged-branch safeguard) - while a plain create/list, a local non-remotes -d, and an unforced -m/-c stay allow, and an attached -u<upstream> value (-ufoo, -u <upstream>) is parsed as the upstream, never scanned as a clustered force flag. A `git -C <dir> ...` or a GIT_DIR/GIT_WORK_TREE-prefixed form is pristine-lexically but names a worktree the guard cannot resolve to the session cwd, so it ASKS (unless the leading opt-out is set, evaluated before this redirect gate) rather than trust a session-dir probe. An AMBIENT GIT_*-prefixed var in the process env also forces ASK unless it is one of a small COSMETIC allowlist (UI/editor/pager/prompt/lock/identity vars that cannot change the discard target, the object/ref view, the index, or dirtiness detection): the probe scrubs every ambient GIT_* and reads the real cwd repo, but the guard cannot scrub them from the ACTUAL command, which still inherits them and may act on a different git dir, work tree, index, or object/ref view, so the guard cannot prove the repository view the ACTUAL command uses IS the session cwd. Under any such non-cosmetic ambient var EVERY in-scope pristine form ASKS (unless the leading opt-out is set, which is evaluated even earlier and short-circuits this gate) - a destructive clobber AND an otherwise-non-destructive allow form (reset --soft, plain switch, clean -n, checkout -b) alike, checked BEFORE the role/allow logic - each with a best-effort cwd snapshot WHEN the session cwd is a not-provably-clean snappable tree (no usable session cwd, a provably-clean cwd, or a stash/branch-only form, takes none; the snapshot may not capture a redirected tree), so no allow form and no clean cwd probe wins a silent ALLOW under such a redirect. A GIT_TRACE* var is NOT cosmetic: an absolute GIT_TRACE value makes the ACTUAL command append trace output to that path (which could be a repo file), so it too forces ASK, unless the leading opt-out is set (the recovery/probe git calls still scrub the whole GIT_TRACE family per round 6, so THEY write no trace, but the ambient GIT_TRACE on the command itself is not neutralized). This is FAIL-SAFE by construction rather than a fixed enumeration (which kept missing new members - GIT_NO_REPLACE_OBJECTS, GIT_REPLACE_REF_BASE, GIT_REFERENCE_BACKEND - and more will exist): an unknown or new non-cosmetic GIT_* var ASKS rather than winning a silent ALLOW. This control is SIDE-EFFECTING (EN-6 recovery layer): before it ALLOWS or ASKS a snapshottable in-scope discard (checkout/switch/restore/reset/rm/clean) whose worktree it can resolve to the session cwd AND whose tree is NOT provably clean, it takes an INERT recovery snapshot of the uncommitted work and appends one line to an EXTERNAL per-user ledger, so a discard that is asked-then-approved OR wrongly allowed by a mis-parse is still recoverable (the hook fires once, with no post-approval callback). F-D EXPANSION: a NON-PRISTINE in-scope ASK (a compound, wrapped, or redirected snapshottable command) is ALSO snapshot-backed BEST-EFFORT against the SESSION CWD repo, so an asked-then-approved wrapped discard is recoverable too; because the redirected dir of a non-pristine command is NOT parsed, a command that changes into a DIFFERENT repository may be snapshotted at the session repo rather than the target (a same-repo cd is still captured by the whole-tree `git add --all`), and on snapshot fail the decision stays ASK. The snapshot uses a TEMPORARY GIT_INDEX_FILE outside the repo (seeded by copying the real index), `git add --all` (captures tracked-modified + UNTRACKED; ignored excluded), `git write-tree`, `git commit-tree` (parent = HEAD when present), and a CREATE-ONLY `git update-ref refs/aiqt-recovery/<utc-ts>-<pid> <sha>` with an empty expected-old value (a name collision FAILS the snapshot rather than clobbering a prior recovery ref). The snapshot writes only git objects and one private ref (plus a reflog entry for it when core.logAllRefUpdates=always, or when a reflog already exists for the ref) and does NOT itself touch the real index, worktree, HEAD, or any branch; the ref is invisible to plain `git status`, `git branch`, and `git log` but is reachable via `git log --all` / `git for-each-ref refs/aiqt-recovery` / `git show-ref` (a real ref, not hidden). Every real-state git call in this control takes an ALLOWLIST posture, scrubbing EVERY ambient GIT_*-prefixed var rather than enumerating a family (rounds 4-5 kept finding new members: GIT_CONFIG_*, then GIT_TRACE*, then GIT_ATTR_SOURCE), so an ambient decoy repo (GIT_DIR/GIT_WORK_TREE), an ambient `git -c` (GIT_CONFIG_PARAMETERS) config injection, an ambient GIT_ATTR_SOURCE attribute-source redirect, or an ambient GIT_TRACE that would make a read-only call WRITE a trace file cannot reach these calls; the scrub itself re-asserts GIT_NO_LAZY_FETCH=1 and GIT_TERMINAL_PROMPT=0 (so the scrub cannot strip the offline + non-interactive posture: no partial-clone lazy-fetch over the network, no prompting) plus a FIXED INTERNAL recovery identity (GIT_AUTHOR_NAME/GIT_COMMITTER_NAME=aiqt-recovery, GIT_AUTHOR_EMAIL/GIT_COMMITTER_EMAIL=aiqt-recovery@localhost) so the snapshot `git commit-tree` never depends on an ambient or on-disk user.name/user.email the scrub removed - which would make it FAIL where no git identity is configured (a CI runner or fresh install with no global gitconfig), silently disabling the recovery backstop - and a recovery commit is deterministically attributed to the guard, not the user, the callers re-apply only the few vars they set themselves AFTER the scrub (GIT_OPTIONAL_LOCKS for the read-only probe, a temp GIT_INDEX_FILE for a snapshot), and any GIT_* the call genuinely needed but was scrubbed fails SAFE to a probe/snapshot failure (fail-to-ASK, never a silent allow). This closes the whole ambient-env class at once; the residual is NOT limited to on-disk config - it spans the non-GIT_ environment (HOME/XDG_CONFIG_HOME/PATH/TMPDIR), on-disk git configuration AND attributes (repo/global/system .gitconfig and .gitattributes), index and ignore state, submodules and embedded repos, configured hooks and filters, PATH-based git resolution, and partial-clone object availability, all read by git by design. RESIDUAL (the honest bound on "inert"): the inert guarantee is BOUNDED, not categorical, because git may ADDITIONALLY run a git-configured (repo, global, system, or command-scope) program during the snapshot whose effect is outside this guard control - a clean/process filter runs on `git add --all` (the CHECK-IN / clean direction, NOT smudge, which would run only on a restore/checkout), an fsmonitor hook runs on the `git status` probe, and a reference-transaction hook plus a post-index-change hook can run on the temp-index write and on the `git update-ref`; a clean filter can TRANSFORM the captured bytes, so the snapshot is NOT guaranteed byte-exact on a filtered repo; and a single overlaid tree cannot capture dirty content inside a SUBMODULE or an untracked EMBEDDED git repo (it stores only the gitlink) and flattens staged-vs-unstaged into ONE tree. The ledger is `${XDG_STATE_HOME:-$HOME/.local/state}/aiqt-guardrails/recovery.jsonl` (normally outside the repo, so a `git clean` cannot destroy it). The ledger write is BEST-EFFORT: normally one line per snapshot, but skipped when no per-user location resolves (absent HOME/XDG), when that path would resolve inside the repo, or when the directory or write fails. A written line records: utc ts, repo path, the triggering git VERB (never the raw command or file contents), the recovery ref, the snapshot sha, the covered classes (tracked/staged/untracked), and the exact restore command (`git checkout <ref> -- :/`, OVERLAY mode: it brings back modified and new content but does NOT re-apply a recorded file deletion; for an exact, deletion-inclusive restore use an isolated branch via `git switch -c aiqt-recover-<id> <ref>`). The snapshot is decision-INDEPENDENT (it does not trust the form-classifier), so it also fires on a genuinely-safe snapshottable form (reset --soft, plain switch, checkout -b, clean -n) on a dirty tree, an accepted over-snapshot; it is SKIPPED on a provably-clean tree, out of scope, and for stash/branch (a worktree snapshot cannot capture stash entries or branch commits). FAIL POSTURE: when a warranted snapshot cannot be made (probe/write error, an undecodable non-UTF-8 path, over a ~100 MiB changed-content size cap, a bare or broken git dir, or a temp dir resolving inside the repo) it NEVER becomes a silent allow of a not-provably-clean discard - a would-be ALLOW is DOWNGRADED to ASK ("no recovery point could be created"), and an already-ASK/DENY decision is left as-is with the failure surfaced. Retention is NOT handled here (refs accumulate; auto-pruning is a separate maintenance op, never inside PreToolUse). An explicit GUARDRAIL_ALLOW_DISCARD truthy assignment (anything but "", "0", "false", "no", "off"; an empty final assignment `GUARDRAIL_ALLOW_DISCARD=` is falsy by bash last-wins and does NOT opt out) LEADING a pristine bare git command (the documented `GUARDRAIL_ALLOW_DISCARD=1 git ...` prefix, not the same string buried in an argument nor on a non-pristine/compound command) opts out to ALLOW: being an explicit override in which the operator takes full responsibility, it is evaluated FIRST and short-circuits ALL of the gates below for that pristine form - the command-local-redirect/ambient view-uncertainty gate, the dirty-tree DENY, and the recovery layer alike - so an opt-out discard is NOT snapshot-backed, and a non-pristine form is never rescued by it (the opt-out is honoured only on a pristine single bare command). On an UNPARSEABLE command (a tokenizer ValueError) the opt-out is NOT honoured at all: the guard cannot parse the command, so it cannot soundly trust an opt-out-looking prefix inside it, and an unparseable in-scope command ALWAYS ASKS. HONEST RESIDUAL: being a LEXICAL hook it does NOT catch a git alias (config-defined; an inline `-c alias.<name>=...` now ASKS) or shell function that renames git or expands to a work-losing verb, a discard performed OUTSIDE the Bash tool, or persistent shell/config state set in a PRIOR turn. It also does NOT catch a real discard whose VERB is OUTSIDE the recognized set AND unflagged by the raw scan: a `git worktree remove -f` (or `--force`) of a dirty linked worktree discards the uncommitted work in that worktree, but `worktree` matches no lossy keyword, so the command is allowed at the true boundary; that verb is deliberately NOT added this round (disclosure matches the best-effort posture). By contrast (F-97), a command the raw scan DOES flag as in-scope whose resolved subcommand is nonetheless outside the recognized set (`git checkout-index -a -f`, `git read-tree -u --reset HEAD`, flagged by their `checkout`/`reset` substring) is NO LONGER silently allowed - it ASKS, since a flagged sub the classifier cannot resolve to a known verb cannot be proven non-destructive, and its sub is not snapshottable so no recovery point exists. It also does NOT catch deliberate token fragmentation or obfuscation of the COMMAND WORD `git` ITSELF or of the verb: a wrapper whose git command word or verb is SPLIT by shell quoting so neither the token scan nor the raw scan sees a contiguous git+work-losing keyword (a wrapped, quote-fragmented reset such as env git followed by a quote-broken re-set, or a command word quote-broken so it spells git only after the shell strips the quotes (a quote-broken git under a wrapper such as command or env), whose raw string carries no contiguous `git`+`reset`) reads as "no recognized lossy verb" and is silently ALLOWED, so the claim that any wrapper ASKS is NOT categorical: it holds only while the raw scan still sees a contiguous git+verb keyword. This is a disclosed best-effort residual, not chased (the guard targets the accidental case, not an adversary deliberately splitting the command word or the verb). The probe ITSELF can be made to under-report dirtiness by git config or index state: an `assume-unchanged` or `skip-worktree` mark on a tracked file, or a `submodule.<name>.ignore` setting, hides real modifications from `git status`, so the guard can read a genuinely-dirty tree as provably clean and ALLOW a discard of that hidden work; and the recovery snapshot ALSO cannot capture assume-unchanged/skip-worktree content (it is not in what `git add --all` re-stages) nor IGNORED files (git add --all excludes them; an ignored file overwritten by a forced checkout or removed by `clean -x` is unprobed - to avoid asking on every repo carrying build artifacts - and unsnapshotted). Beyond that, being ultra-conservative it OVER-ASKS heavily - every compound, wrapped, redirected, or metacharacter-bearing command that names a lossy verb ASKS even when it would have been safe (a pristine bare form carrying the leading opt-out is the sole override, short-circuiting even the redirect gate), and a command that merely CONTAINS a git token and a lossy verb as TEXT while running no discard (`echo git branch`, `git log | grep branch`) ASKS too, because the raw scan matches the keywords wherever they appear (a safe-direction over-ask, not narrowed: narrowing the raw scan is the whack-a-mole GD-34 rejected), and a pristine whole-tree clobber over-DENIES on a dirty tree even when the specific target would have lost nothing - an accepted, recoverable cost of never silently allowing a real WORKING-TREE-CONTENT discard for a recognized command that is NOT covered by the explicit leading opt-out or a disclosed residual. That no-silent-allow guarantee is bounded to working-tree content: ref-level moves (reset --soft moving HEAD, a merged-branch delete) are reflog-recoverable, and the obfuscation/config residuals above are best-effort, not categorical.'

[[hook]]
id = "protected-line-guard"
rules = ["prtbrn", "artbr1"]  # integ / protected-branch-integrity (the push layer) + branch-and-merge-on-green (the direct-commit layer)
platform = "claude-code"
event = "PreToolUse"
matcher = "Bash"
handler = "protected_line"
default = "block"
class = "b"
residue = 'A best-effort QUOTE-AWARE LEXICAL check over the Bash command string (the shared quote/redirect-aware tokenizer, which REMOVES shell redirection from the token stream, closing the F-122 redirect-pollution class so a redirect before the subcommand, after a refspec-less push, or around --help/-- no longer corrupts the subcommand, operand, or HEAD-probe decision): it judges git push and git commit segments only - the LITERAL commit subcommand; a merge, cherry-pick, revert, am, or rebase that also lands commits on the protected line is out of scope by design, because the accidental case this layer guards is the direct git commit and server-side branch protection remains the real gate. The push layer parses options with a value-skip for the separated value-taking options (--push-option/-o, --repo, --receive-pack/--exec, and --recurse-submodules, whose value is MANDATORY and hence separable - verified against git 2.53.0, which consumes the next token as the value and rejects a bare form) and a --/--end-of-options boundary. Force, delete, sweep, and prune flags are detected VALUE-AWARE inside the token loop, so an option value is never read as a flag (git push -o --force origin main carries a push-option VALUE, not a force flag): every force spelling counts (-f/--force clustered or long, any --force-with-lease spelling - a lease-guarded force still rewrites the remote ref - --force-if-includes, and --mirror, which implies force), plus the ref-sweeping modes: --mirror, a forced --all/--branches, the MATCHING refspec (a bare : pushes every branch existing on both ends and +: is its forced form; either ASKS, a matching-refspec push this guard cannot prove misses the protected branches), and --prune combined with a wildcard or matching refspec (which DELETES every remote branch absent locally with NO force flag - witnessed deleting a remote master - so it ASKS; a --prune whose refspec mapping comes only from configuration falls under the configuration residual below). Operand ROLES follow the grammar git itself uses (git push <repository> <refspec>...): the FIRST bare operand is the repository and is never judged as a destination (a remote literally named main is not a false deny), and only the later, refspec-position operands are judged, by exact case-sensitive DESTINATION name (tolerant of a refs/heads/ or heads/ prefix); a skip-set omission can only shift operands toward over-inclusion, never move a real refspec into the exempt repository slot. A protected DELETION is denied like a force: a --delete or clustered -d flag whose refspec-position operand names a protected branch, and the empty-source :<dst> delete refspec (:main); the deny banner names the actual act, force-push vs branch deletion. When no refspec names a destination (a refspec-less force-push) or the refspec is HEAD/@, the SESSION-CWD current branch is read by a scrubbed read-only symbolic-ref probe (every ambient GIT_* removed, offline, 5s timeout), and a detached or unreadable HEAD reads as UNKNOWN, never as not-protected. Git resolves a pushed or FORCED HEAD/@ to the current branch; a DELETED HEAD or :@ git itself REJECTS as a nonexistent or invalid remote ref, so the probe-backed deny on a deleted HEAD/@ is a harmless safe-direction over-deny kept for uniformity, not a claim that git resolves a deleted HEAD to the current branch. It does NOT catch: a push or commit outside the Bash tool; a git alias or shell function that renames git or expands to a push; a destination supplied by SHELL EXPANSION rather than a literal token (git push --force origin "$BRANCH" with BRANCH holding a protected name, a command substitution, or a glob): a lexical guard judges the literal token and cannot resolve runtime shell state - the same inherent boundary git_discard discloses for its variable and substitution forms; a FRAGMENTED command word or verb (shell quoting that splits the git command word or the push/commit verb so neither the parsed segments nor the raw scan sees a contiguous git-plus-verb keyword; a plain command-word wrapper such as env/sudo/command/xargs IS caught by the raw scan and ASKS); a WRAPPED push in a compound in which ANY other segment, EARLIER OR LATER, parses with git as its command word (git status && sudo git push --force origin main, and equally env git push --force origin main && git status): the benign git segment satisfies the saw-git check, so the wrapped-catch raw scan never runs and the wrapped force-push is silently allowed - an adversarial best-effort residual of the same class as the fragmented command word, disclosed and not chased; a destination supplied by CONFIGURATION rather than the command line (push.default, branch.<name>.pushRemote/merge, remote.<name>.push refspecs, a triangular-push setup), so the bare-push HEAD proxy can diverge from the configured upstream mapping; a protected line under a NON-DEFAULT name (the set ships as main/master); or a rewrite landed on the remote side or by a hosting-provider action (a protected-NAMED force-push or deletion is denied redirect-independently, and a current-branch force-push or deletion under an unresolvable -C/--git-dir/GIT_* redirect ASKS, so none silent-allows). SAFE-DIRECTION OVER-DENIES, accepted and disclosed (re-issue without the contrived flag combination): negation and no-op flags are not modelled, so a --force or --delete cancelled by a later --no-force/--no-delete still denies, --force-if-includes ALONE (a documented no-op without --force-with-lease) denies, and a --dry-run push carrying any force or delete spelling is judged like the real thing and denies. On a shell parse error, OR when a command-word wrapper hides git so no parsed segment resolves to git, it falls back to a conservative raw scan that ASKS (never a hard deny, never a silent allow) on an apparent git force-push (any -f/--force/--for-prefix/--mirror/--all form, or a +refspec anchored to start, whitespace, or either quote character, so a quoted "+main:main" under sudo is caught), an apparent branch deletion (a --de-prefix long flag, or a d carried ANYWHERE in a short - cluster, mirroring the force cluster shape so a wrapped -dv is caught, name-independent like the force spellings; or an empty-source :<protected-name> refspec, judged by its visible name), or an apparent git commit. The raw scan OVER-MATCHES by design (a case-different name, an attached -o value ending in f, an unrelated + or -d token, or prose mentioning the keywords ASKS), so re-issue a wrongly-flagged command as a plain, parseable git command. It is BEST-EFFORT: it targets the accidental case, not an adversary determined to evade it.'

[[hook]]
id = "branch-root-guard"
rules = ["brnrot"]
platform = "claude-code"
event = "PreToolUse"
matcher = "Bash"
handler = "branch_root"
default = "block"
class = "c"
residue = "Lexical trigger over an open command grammar: a branch created through a wrapper, alias, script, or shell indirection is not seen. When a later construct makes the whole command unparseable (a heredoc, a process substitution), the guard still PARTIAL-lexes and judges the creation recovered in the parseable prefix, so a proven orphan creation followed by an unsupported construct still DENIES (DENY outranks the parse error); only a creation lying ENTIRELY within the unparseable syntax stays unseen (the open-grammar residual), and only creation forms are checked, so switching to an existing orphaned branch, continuing work on the current branch, or RENAMING a branch (-m/-M/--move, which reuses an existing branch's commits under a new name and so creates no new orphan-rootable ref) passes to the CI gate. It probes a creation's ancestry (and can DENY an orphaned start) ONLY for a CLEAN canonical creation: a create trigger (checkout -b/-B; switch -c/-C or --create/--force-create; a bare `git branch <name>`; a `git branch -c/-C/--copy` copy whose start is the SOURCE, an explicit <src> else the current HEAD; or `git worktree add -b/-B`), its operands, and NOTHING ELSE except a tiny allowlist of VALUELESS booleans (--quiet/--force, short q/f; git branch additionally exposes --verbose/-v, which checkout/switch/worktree do not). A confidently-recognized non-creation ACTION (git branch -d/-D/--delete, -m/-M/--move rename, -u/--set-upstream-to/--unset-upstream, --edit-description, --show-current) or a LISTING form (--list, -a/-r/--all/--remotes and the unambiguous listing letters) is ALLOWED. EVERY OTHER shape routes to a fail-SAFE ASK, never a silent allow of a possible creation and never a probe-based DENY of a non-creation: any value-taking option (--contains/--merged/--points-at/--recurse-submodules), any unknown option, any abbreviated (--cre, --orp, --tr) or negated form whose meaning is order- or version-dependent (--no-detach, `--list --no-list`, a clustered -l), any tracking/orphan/detach form (--track/-t/--orphan/--guess/--detach/-d), a copy combined with any non-clean option (git branch --format main -c ...), a bare `git worktree add <path> [<commit-ish>]` without -b, and any short cluster carrying a letter outside the clean/listing set. This MAXIMALLY-CONSERVATIVE posture (maintainer-approved 2026-09-02, after the round-7 simplify-to-ASK cap) trades precision for robustness: an exotic or option-laden git command earns an ASK rather than a precise allow or deny, and the authoritative CI branch-root gate judges the actual post-creation ancestry regardless. DISCLOSED residual: the classifier accepts any nonempty operand as a branch name, so a creation carrying a git-INVALID name (spaces, a `..`, a control character - forms git rejects with `check-ref-format` and creates nothing) can still receive a probe-based deny of that orphaned start; this is a safe-direction false-deny of a no-op command (re-issue with a valid name), and full git ref-name validation is out of this lexical classifier's scope (tracked as HYG-2). What it PROVES at creation time is only that the start point is ORPHANED (no merge base with origin/HEAD); a rooted-but-STALE or old start point (for example checkout -b x origin/HEAD~1) still has a merge base and PASSES this hook, and its staleness is caught only by the CI gate's configured --max-lag first-parent-lag threshold, not here. Replace refs are neutralized on the probe (GIT_NO_REPLACE_OBJECTS=1) so a grafted parent cannot make an orphan look rooted; the on-disk .git/info/grafts residual is out of scope (an accidental-case guardrail). A shallow clone cannot distinguish a missing merge base from unfetched history, so a merge-base miss in a shallow repository routes to ASK, never a deny; a FAILURE of the shallow-status probe itself (a non-zero or unreadable result) likewise routes to ASK, matching the CI gate's cannot-evaluate posture, never a false orphaned deny. A cd/pushd in an earlier segment of the compound command, a non-cosmetic ambient GIT_* variable, or a command-local -C/--git-dir/--work-tree redirect all leave the target repository unreconcilable with the session cwd, so the creation routes to ASK. The ancestry answer comes from the clone's remote-tracking state, which can be stale until the next fetch. The hook derives its PROTECTED ref from the clone's origin/HEAD (the local default-branch pointer), which may differ from the actual protected target the CI gate judges against (the PR base branch): where origin/HEAD points at a non-default branch, the hook can ALLOW a creation the CI gate later reports ORPHANED against the true protected line, since the hook has no PR/target context at creation time; the CI branch-root gate is the authoritative check on the actual post-creation ancestry. The hook resolves the `git` executable through the ambient PATH (a trusted-toolchain boundary, as the sibling gate residue discloses): a hostile PATH entry shadowing `git` could spoof the probe, an adversarial execution-environment concern outside this accidental-case hook's threat model, not a bypass it defends against. The env-assignment command form is best-effort, as for the sibling git hooks. The hook catches only EXPLICIT-start creation forms; an IMPLICIT-start (DWIM) form where git auto-creates a branch from a matching remote-tracking ref (a bare git checkout/switch <name> whose name matches a remote branch, or a --guess/--guess-remote guess) has a start git resolves at runtime and not lexically visible here, so it is routed to ASK where a guess flag is present and otherwise passes the hook and is caught by the authoritative CI branch-root gate, which judges the actual post-creation ancestry."

[[hook]]
id = "gate-weakening-guard"
rules = ["gatdis"]  # integ / gate-discipline
platform = "claude-code"
event = "PreToolUse"
matcher = "Bash"
handler = "gate_weakening"
default = "block"
class = "b"
residue = 'A best-effort QUOTE-AWARE LEXICAL check over the Bash command string (the shared quote/redirect-aware tokenizer, which REMOVES shell redirection from the token stream, closing the F1/F2 redirect-pollution slips) with a SPLIT posture: the unambiguous git hook bypass DENIES; the two gate-shaped heuristics ASK, because "what is a gate" is not lexically certain. The DENY core: on a git segment whose subcommand accepts --no-verify (commit, merge, push, pull, rebase, am; the roster and the short-flag semantics verified against the git 2.53.0 man pages, 2026-08-19), a --no-verify spelling denies, matched exact or by CONSERVATIVE LONG PREFIX (an ambiguous abbreviation git itself would reject, such as --no-ver, is treated as the bypass anyway, and a separated option VALUE that itself spells --no-verify is scanned too - both safe-direction over-matches that only deny, never allow), and the SHORT -n denies ONLY on the two verbs where -n IS --no-verify (commit and am), clustered or bare, with the value-taking short and long options skipped so an option value carrying the letter n (an attached -m value, a separated --message value, a post -- pathspec) is never read as the flag; on push -n is --dry-run and on merge and pull it is --no-stat, so -n there is deliberately NOT flagged (flagging it would block safe dry runs), and --no-verify-signatures merely re-asserts a default and is not flagged. The ASK heuristics: a checker-shaped segment - a known checker command word (pytest, tox, nox, mypy, ruff, flake8, pylint, eslint, tsc, jest, mocha, rspec, shellcheck, gitleaks, pre-commit, ctest and kin), a command whose name PARTS (split on non-alphanumerics) contain test/check/lint/verify/validate/audit/selftest/conformance (run_all_checks.sh, selftest_aiqt_hooks.py; exact part match, so a word like "latest" never trips a substring), or a known runner (make, npm, yarn, pnpm, npx, go, cargo, mvn, gradle, python, bash and kin) invoking such an operand - whose failure is swallowed by an immediately following unquoted "|| true" or "|| :", or whose output is piped by an unquoted "|" into a truncating sink (head, tail) that under default pipeline semantics replaces the checker exit status with its own and can cut the failing output, ASKS. It does NOT catch: a gate weakened at its SOURCE (a workflow edited to carry continue-on-error or allow_failure, a deleted test, a lowered threshold - file-edit surfaces, not Bash commands); an environment-variable skip a hook manager honours (SKIP= for the pre-commit framework, HUSKY=0); hooks disabled by CONFIGURATION (core.hooksPath pointed at an empty directory, inline -c or persisted); an alias, wrapper, or shell function that renames git or the checker; a checker outside the lexicon whose name carries no checker-shaped part (an unknown gate roster is the honest bound of a lexical checker notion); a swallow spelled differently (|| exit 0, || echo, ; true, a set +e, a conditional wrapper); a truncating sink beyond head and tail (sed q, awk NR limits, grep -m); a script body inside sh -c quotes or an eval/xargs indirection (one opaque token to the lexer); a swallow separated from its checker by grouping parens (( pytest ) || true reads as adjacent to the paren, not the checker); pipefail state (under set -o pipefail a pipeline does keep the checker failure status, but shell state is invisible here, so a piped checker still ASKS - an accepted over-ask); or any execution outside the Bash tool. A checker probe whose swallow is INTENTIONAL (a discovery run) and a non-gate command whose NAME merely looks checker-shaped (a test.sh that gates nothing) are accepted over-ASKS, the disclosed scoping cost of the heuristic; a gate-shaped command the lexicon does not name is the matching under-coverage, both stated rather than hidden. Two further safe-direction over-blocks are disclosed, both contrived and non-bypassing: a trailing --verify that cancels an earlier --no-verify (git models the pair as a boolean where the last wins, so git commit --no-verify --verify does NOT bypass hooks, yet this presence test is order-insensitive and DENIES it), and a clustered -h help flag (git commit -hn ..., where git prints help and does not commit, but the short scan reads the clustered n as the bypass and DENIES); re-issue without the contrived flag combination. On a shell parse error it fails SAFE with conservative raw probes (git plus a no-verify verb plus a --no-ver spelling DENIES; git commit or am plus a short -n cluster ASKS, since the raw string cannot bind the cluster to its subcommand; a checker keyword plus a raw "|| true", "|| :", "| head", or "| tail" ASKS), which OVER-MATCH by design: prose naming the keywords, a --no-verbose, or an unrelated -n cluster can deny or ask an unparseable command that was safe - re-issue it parseable. Overlap with shipped controls is compatible, not duplicated: a git push --no-verify --force to a protected branch is denied by BOTH this control and protected-line-guard, a git commit --no-verify on a protected HEAD denies here while protected-line-guard asks (deny outranks at the platform), and no other shipped control covers --no-verify, "|| true", or a truncating pipe on a non-diff command (the diff-source truncation reasoning governs diff producers only). It is BEST-EFFORT: it targets the accidental case, not an adversary determined to evade it.'

[[hook]]
id = "commit-msg-subst"
rules = ["sectvl"]  # security / tool-argument-validation
platform = "claude-code"
event = "PreToolUse"
matcher = "Bash"
handler = "commit_msg_subst"
default = "ask"
class = "b"
residue = "A BEST-EFFORT QUOTE-AWARE LEXICAL check via the shared tokenizer (_lex_command); it is ASK-only, so a detected substitution is surfaced for confirmation rather than blocked, and it makes NO soundness or universal-coverage claim. In a parsed simple segment it resolves the effective command word past leading shell assignments and the recognized command modifiers command, exec, builtin, nohup, time, !, and env; for env it skips leading option tokens, the separated operands of common value-taking options, and NAME=VALUE assignments. When that word is literal git and the subcommand after recognized Git-global options is literal commit, it scans EVERY argv token after commit, including tokens after `--` or `--end-of-options`, for a backtick or $( marker in a substituting double-quoted or unquoted context, using the shared lexer's parallel per-token opacity plus the narrow unquoted-$( split form where a final opaque token ending in $ is immediately followed by the ( operator. It deliberately does no Git option binding because the shell expands argv before Git parses it. On an unparseable command, the raw fallback ASKS when coarse git-commit and substitution-marker probes both match; that fallback can over-match quoted prose or literal markers. HONEST RESIDUALS: the option tokens belonging to a recognized command modifier are not skipped (for example command -p git commit, time -p git commit, exec -c git commit, exec -a x git commit, and nohup -- git commit), so resolution advances one word past the modifier, stops on the option, and silently ALLOWs a substitution-bearing commit; command modifiers outside the recognized set (notably sudo, nice, timeout, doas, stdbuf, and ionice) are not resolved, so for example sudo git commit -m \"$(x)\" silently ALLOWs; reserved-word compounds (if/while/until and `{ ...; }`) are not parsed through to their inner git command; shell functions and aliases that rename git; git-config subcommand aliases (for example alias.ci=commit making git ci -m \"$(x)\") cannot be known lexically and silently ALLOW; sh -c or bash -c script bodies; eval or xargs indirection; redirect targets on a recognized commit segment are removed from argv by the lexer and are not scanned, so git commit -m ok > \"$(x)\" and git commit -m ok 2> \"`x`\" silently ALLOW; leading environment-assignment values and Git-global option/value tokens before commit; a pre-subcommand unquoted $( that fragments the lexer segment, letting the whole commit invocation including its message escape inspection; quote-mangled command words such as g''it are outside the claimed command-resolution surface even where the shared lexer happens to normalize a form to git; $VAR indirection, concatenation, PATH-shadowed commands, and any other non-literal command word that does not resolve lexically to git; commands outside the Bash tool; and unparseable commands beyond the raw fallback probes. Deliberate over-ASKs: $((...)) includes $(; a bare $ immediately before an escaped parenthesis (for example git commit -m $\\(x\\)) is marked opaque and the decoded-marker check sees $(, so it ASKS even though Bash passes literal $(x) and runs no substitution; ANSI-C $'...' is treated as an opaque marker-bearing token even though Bash does not substitute inside it; whole-token opacity means an escaped literal backtick or $( sharing a word with an unrelated unquoted expansion or glob prompts; and a post-boundary pathspec produced by substitution (for example git commit -- $(ls)) prompts because the shell still executes it. It targets the accidental case, not an adversary."

[[hook]]
id = "secrets-shift-left"
rules = ["secsec"]  # confidentiality / keep-secrets-out (the shift-left write-time layer)
platform = "claude-code"
event = "PreToolUse"
matcher = "Write|Edit|MultiEdit|Bash"
handler = "secrets_shift_left"
default = "block"
class = "c"
residue = 'A COMPENSATING control, not a replacement: the CI secret-scan and gitleaks gates remain the broader backstop, and this layer moves the same high-signal detection to the moment a secret would be written, so an accidental paste is caught before it lands on disk rather than only at commit or CI time. It SINGLE-SOURCES its shapes from tools/check_secrets.py (the pack source of truth), rendered into the handler by tools/gen_secret_patterns.py and drift-gated so the two can never fork: the recognizable provider-token PREFIX shapes (GitHub, GitHub fine-grained PAT, OpenAI-style, OpenAI project key, Anthropic, AWS access key id, Slack, Slack app-level token, a private key block header, a JWT, and (GD-121) Google API key, Stripe live and test, GitLab personal access token, SendGrid, npm, PyPI upload token, and a Slack incoming-webhook URL), the credential-named ASSIGN shape (a passwd/password/secret/token/api-key/access-key/client-secret/auth-token/private-key/credential variable assigned a literal of real length), and (GD-121) an ENTROPY-GATED generic-assignment shape: a token of 40 or more characters (Shannon entropy at least 3.5 bits per character judged on its first 150 characters, letters and digits required) assigned to a generic credential-like name matched on EXACT components (key/auth/token/secret/passphrase/creds/... so apiKey and client-secret match while monkey and author do not), with placeholders and environment lookups excluded before the entropy test and a metadata-named left-hand side (id/name/version/url/path/public/...) excluded. It EXCLUDES obvious placeholders (the shared PLACEHOLDER shape: your/my/the-prefixed names, change-me, example, sample, dummy, redacted, fake, test, todo, none, null, n/a, an angle-bracket or dollar-brace or dollar-VAR template, and runs of x/dot/star), and for an UNQUOTED assignment value it additionally requires both a letter and a digit, exactly as check_secrets.py does, so ordinary prose does not trip it. It scans the content a Write would write, the new_string an Edit would introduce, the concatenation of the new_string values a MultiEdit would introduce across its edits, or the command string a Bash call would emit, and DENIES on a real match, naming only the pattern label and never echoing the secret value. DISCLOSED non-catches: a KEYWORD-FREE high-entropy value (an opaque = <hex> with no credential keyword near it): both this scanner and gitleaks miss it (R1, the measured residue of 2026-08-08); a generic-keyword value of 12 to 39 characters, below the local 40-character floor, which gitleaks can still flag (R3, a deliberate noise-control choice confirmed against pinned gitleaks 8.30.1); a real secret held under a metadata-named variable such as public_key or key_path, excluded here in the safe direction where the CI scan still catches it (R4); a secret written by a tool other than Write, Edit, MultiEdit, or Bash (other content tools such as NotebookEdit are out of scope, routed to a periodic pattern review); a secret split across tokens or lines or assembled by concatenation, since the scan is per-line and lexical; on the Bash path the command string is scanned as RAW TEXT (it is not shlex-tokenized and is not executed), so a secret assembled by concatenation or supplied through a shell variable or expansion is missed, but a redirect or an embedded # does NOT cause a Bash-path miss; the ASSIGN shape also does not match a JSON-style quoted credential key ("api_key": "...") or a triple-quoted value, a curated-pattern-set format-completeness gap routed to the periodic pattern review (backlog L12); a deferred provider family (a Twilio-class short-prefix-over-hex or a Telegram bot token, left to gitleaks, R2); an unquoted value beginning with an environment-lookup root such as process.env., treated as a reference not a literal (R6); and a base64-encoded or otherwise obfuscated form. gitleaks in CI is a BROADER independent scanner and a stronger net, but it is NOT exhaustive (it too misses the keyword-free entropy class R1), so it is a compensating layer, never a guarantee. It is BEST-EFFORT: it targets the accidental paste or commit, not an adversary deliberately encoding or fragmenting a secret to evade it.'

[[hook]]
id = "gensrc-edit-guard"
rules = ["gensrc"]  # integ / generated-artefact-source-only
platform = "claude-code"
event = "PreToolUse"
matcher = "Write|Edit|MultiEdit"
handler = "gensrc_guard"
default = "ask"
class = "c"
residue = 'A REGISTRY-DRIVEN path guard, not a content judge: it fires only when the Write/Edit/MultiEdit file_path resolves onto a kind=file or kind=tree entry of the per-repo .aiqt/gensrc.json, read at decision time. Coverage is exactly the registry: an unregistered generated artefact is not judged (the gensrc-registry drift gate is the backstop for a stale registry), and a repo with NO registry gets no coverage at all (an ABSENT registry is the inert ALLOW by design; adopters author their own). kind=block entries are EXCLUDED by design: a mixed file carrying a generated block (CLAUDE.md, site/roadmap.html) is allowed whole, because a path guard cannot see which lines an edit touches; the block drift gates backstop those. Bash is EXCLUDED by design: regeneration itself runs through Bash (python3 tools/gen_*.py), so a hand-edit routed through Bash (sed -i, a redirect, a heredoc) is not caught; the drift gates remain the real gate. Other file-writing tools (NotebookEdit) are out of scope. The decision is an ASK, never a deny: the human approving the ask IS the opt-out (no env or magic-text bypass), and where the drift gate is configured an approved hand-edit fails it until source and derivative reconcile. Fail-safe branches never silently allow: an absent registry allows (inert), while a registry that is not a regular file (a symlink, FIFO, directory, ...; rejected by an lstat/S_ISREG probe before the open, which reads a STATIONARY non-regular registry as bad and does not block on a FIFO - a best-effort defence against the accidental case, with a registry concurrently SWAPPED to another type in the lstat-to-open window a disclosed residual, sibling to the hard-link and case/NFC-NFD aliases below), a registry that disappears in that same window (a delete race, which fails safe to ASK rather than reading as absent), an unreadable or malformed registry, an unknown registry version, a malformed entry, an unresolvable repo root (a cwd outside any git work tree, so a non-git session asks on in-scope calls), a target that canonicalizes outside the resolved repo or a containment check that cannot be cleared (it cannot be judged against the registry of this repo), an unresolvable target path, and an unreadable or malformed (empty/list/bool) tool_name or a control-character payload field all ASK; only a MISSING tool_name denies (the shared fail-closed contract). Matching is on canonicalized real paths with component-boundary tree containment, never a raw string prefix, so gen-extra/ never matches gen/ and GEN.md.bak never matches GEN.md; a hard link, a case-insensitive-filesystem alias, or a macOS NFC/NFD Unicode-normalization alias that defeats realpath equality is a disclosed residual. The repo root is the git toplevel of the SESSION cwd via the scrubbed rev-parse primitive (every ambient GIT_* removed), so an ambient decoy repo cannot redirect the registry read; in a linked worktree or a submodule the toplevel is that worktree or submodule, so a registry governs exactly the tree it sits in.'

[[hook]]
id = "write-scope"
rules = ["septsk", "wowo01", "exetgt"]  # integ / separate-task-changes + workers-produce-inert-data; quali / confirm-execution-target (the other-repo denial is its mechanical form for writes)
platform = "claude-code"
event = "PreToolUse"
matcher = "Write|Edit|MultiEdit"
handler = "write_scope_guard"
default = "block"
class = "c"
residue = 'A PATH guard, not a content judge: it decides where a write lands, never what it writes. Covers only PreToolUse Write, Edit, and MultiEdit calls carrying a readable file_path. TWO arming inputs, each fail-open on genuine ABSENCE only: the per-slice declaration write-scope.json, read at the orchestration registry-declared state_dir (resolved from the registry the guard reads EXACTLY ONCE, via the pure _state_dir_from_registry helper, never a second independently-faulting read; out of the slice tree by default but MAY be in-tree when the registry declares an in-tree state_dir), arms SLICE CONFINEMENT; the in-tree committed frozen floor .aiqt/frozen.json (generated by tools/gen_manifest.py from the ownership classification, drift-gated) arms the FROZEN layer. The structural other-repo/nested-repo denial applies to every covered write whose repository root resolves; the frozen-floor denial fires whenever a floor is PRESENT, and an armed session additionally requires one, so neither is unconditionally always-on and only an un-armed session with a genuinely-absent floor leaves the frozen layer inert. Slice confinement is fail-open on a missing declaration. The principled fail-open is genuine ABSENCE (of a declaration or floor: no confinement in effect, the same inert boundary gensrc and the orchestration suite use); a cannot-evaluate FAULT is not absence and denies (see the fail posture below). The registry that LOCATES the declaration is part of the read: a bad or unreadable registry (an lstat fault, a read/parse error, a non-version-1 object, or a present-but-malformed state_dir) is a cannot-evaluate that DENIES rather than silently falling back to XDG and disarming confinement. Out-of-scope is a DENY, never an ASK (an ASK would hand the confined actor the click-through on its own confinement and would wedge an unattended run); the remedy is the harness re-declaring the slice, so scope-widening stays on the harness side, never a guarded-tool call. The declaration is machine-set inert data, never authored by the assistant through a guarded tool; the residual Bash-write path to the state dir remains, so the harness-set integrity is defence in depth, not categorical. Fail posture, by regime: a MISSING tool_name denies (the shared fail-closed contract); a malformed tool_name, an unreadable tool_input, a missing/empty file_path, or a control-character file_path denies as a malformed call in either regime; a covered write whose session repository root cannot be resolved (a missing/unreadable cwd or a non-git session) DENIES fail-closed in both regimes, because the root is resolved FIRST and containment cannot be evaluated without it, so this denial precedes any relative-path handling (a non-git relative-path write DENIES, it does not defer); only WHEN the root resolves does an un-armed relative file_path defer to the sibling absolute_paths hook (which owns the relative case, EN-8 making no cwd-trusting determination) and allow, while an armed relative file_path denies; an un-armed realpath/containment/nested-repo-probe FAULT now DENIES too (a cannot-evaluate: the guard cannot prove the target is in-repo and not nested, so it denies rather than allowing an unverified write), as the same fault does armed; a target proven OUTSIDE the session toplevel, or in a NESTED or FOREIGN git repository under or beside it (resolved via the scrubbed git toplevel of the target nearest existing ancestor, every ambient GIT_* removed so a decoy repo cannot redirect the read), denies in BOTH regimes; a present frozen floor with the target on it denies in both regimes (the floor outranks the allowlist, deny over allow), a present-but-malformed floor denies (cannot-evaluate), and an ABSENT floor is inert un-armed but denies while armed (an armed session must commit a floor, an explicit empty list being valid, so a Bash-deleted floor cannot silently downgrade an armed session); armed, a declaration that is unreadable, malformed, unknown-version, or whose worktree_root does not resolve to this repo (a stale, copied, or moved declaration) denies; an allow entry wholly on the frozen floor makes the declaration malformed and denies (a declaration cannot declare past the floor); a target in repo, not frozen, and in the declared slice scope allows silently, while one not in scope denies. Every deny attempts a BEST-EFFORT guard-events append (the over-fire metric) where the root is resolvable: the append can fail silently (_orch_append_jsonl returns False and the deny ignores it), which neither blocks nor alters the denial and may lose the over-fire metric for that event. Matching is on canonicalized real paths with component-boundary tree containment (the gensrc idiom), never a raw string prefix; the declaration and floor share one entry grammar (a repo-root-relative POSIX path, a trailing / marks a tree, no absolute/backslash/./../control-char/wildcard component). The floor is enforced against the manifest CLASS set {derived, manifest-self, archive}. The RUNTIME value of that floor is un-lowerable by the constrained actor through the guarded tools (a guarded write to .aiqt/frozen.json is itself on the floor and denied); but its DEFINITION (FROZEN_CLASSES in tools/gen_manifest.py) is generator source that lands through pull-request review PLUS the drift gate, which detects an INCONSISTENT floor (a committed frozen.json that does not match a fresh regeneration), NOT an unauthorized-but-internally-consistent redefinition of the class set followed by regeneration; an independent floor-authorization mechanism is out of scope for this hook. The floor proves membership in its declared selector set only, not that the generation-time class mapping is semantically complete. Class c (partial), matching the sibling gensrc_guard: the control fires deterministically inside its Write|Edit|MultiEdit matcher, but the rules it enforces span write paths the matcher cannot see (Bash-mediated writes, NotebookEdit, filesystem MCP tools, any write outside the platform hook path), and its slice-arming state is machine-local, so CI cannot observe the confinement. The committed frozen floor .aiqt/frozen.json is a generated, drift-gated output backstopped at merge by the manifest-gen-drift gate (tools/gen_manifest.py --check), the gensrc-registry-drift gate (tools/gen_gensrc.py --check), and the independent manifest-integrity verifier (tools/check_manifest.py) (defence in depth, each catching the other residual; these CI gates are not removed or softened), but nothing backstops an uncommitted, out-of-scope-mutable, or cross-repository write through the uncovered channels. Realpath closes symlink escapes present at check time but not a post-check swap, hard-link alias, bind-mount change, or case-fold/Unicode alias between the lstat probe and the tool write (TOCTOU); an OS-level write sandbox is the stronger overlapping control where available. It is single-author by design: exactly one declaration, one writer, harness-replaced; it is confinement of the sole writer, not parallel-write collision arbitration.'

[[hook]]
id = "orch-stop-guard"
rules = ["setcmp", "cntdef", "trkasy", "cnclse"]  # completeness-claim + continue-by-default + track-launched-work + lease scope
platform = "claude-code"
event = "Stop"
handler = "orch_stop_guard"
default = "block"
class = "b"
residue = "REGISTRY-SCOPED: entirely inert unless an orchestration registry (.aiqt/orchestration.local.json or .aiqt/orchestration.json) is present AND a declared orchestrator lease or mode record is live, so plain Q&A sessions and bounded workers never inherit the global backlog. FAIL-OPEN on its own I/O errors, none of which wedges the session: an unresolvable cwd or an inactive-or-unreadable lease/mode scope SILENTLY ALLOWS the stop (no warn banner, no guard-event); an unreadable registry ALLOWS with a warn banner but no guard-event; and an unreadable turn-state takes the bounded loop-bound exit. But (FIX 1) an enumerator error or timeout, and any cannot-evaluate (an unreadable proof source), FAIL CLOSED-CONTINUE: the stop is DENIED (ignorance refuses the wind-down), releasable only by the operator-owned escape sentinel and never a clean close, bounded by the guard-owned loop bound past which it becomes a deliberate, recorded forced exit. The deny is BOUNDED: the guard's own persisted counter (turn-state, reset on genuine human input) allows at most two denies per epoch, then ALLOWS WITH FINDINGS, independent of any platform loop field (none is documented on Stop; a loop-ish payload field is honoured opportunistically if one ever appears). The operator escape sentinel yields the clean ALLOW only when it passes enforced acceptance: a regular file (never a symlink), owned by a uid other than the guard's effective uid, and not group- or other-writable; a present sentinel failing any condition is IGNORED with the decision unchanged, recorded to guard-events and escape-spoof.json, and surfaced once by the next resume audit. Uid inequality proves not-self, never operator identity; on a shared-uid host no file either party can create passes, so the clean-ALLOW channel is unavailable there (recovery: a differently-owned sentinel such as a root-owned one, operator registry or mode maintenance, or the bounded marked exit; split-uid deployment is the recommended posture). The platform interrupt is a second, structurally unguardable escape, left uncovered on purpose. Blocker proofs are validated against their declared sources (the dispatch ledger, the pending-decisions surface, evidence freshness, the clock), but that whole substantiation surface (the backlog state/granted fields, a pending-decision row, the dispatch ledger, a not-before value, and free-text external evidence) is largely ACTOR-AUTHORABLE: the guard raises the bar (it rejects an unknown blocker kind and requires a substantiating record in the declared authoritative source) yet cannot categorically enforce that a block is granted by an authority other than the assistant, closed categorically only by operator-owned, assistant-non-writable records at the OS layer (SYSTEM-HARDENING.md entry 2). Plausibly FABRICATED external evidence in particular is not mechanically closable at this layer where no attestation register is declared; where one is declared, an external or foreign-lease blocker classifies blocked only when its ref is covered by a fresh validated attestation whose snapshot is re-anchored to the register authority and whose refs are re-derived from the register content at yield, so a swapped register or a fabricated-refs snapshot substantiates nothing; this raises the bar over free-text evidence but is not categorically forgery-proof, since the register is a separately-declared surface and filesystem write to it, wherever it is declared, forges an attestation by appending a valid approved row (uncommitted; the git or anchor authority checks only the committed or anchored prefix), closed categorically only by an operator-owned, assistant-non-writable register at the OS layer; the remaining residuals are cadence, since tamper misleads until the next audit or gate run, and relevance, since a resolving pointer can still be a misappropriated pretext that triage refutes). The human-decision class proves only that a pending-decision row exists, never that the item genuinely crosses the human-oversight threshold, which stays human judgement. Coverage is the rendered roster (Stop, TeammateIdle, the yield-tool matcher): a yield primitive outside that roster is uncovered, reconciled when the toolchain register changes. The dispatch ledger sees only hooked launch tools, so a task launched through an unhooked tool costs one spurious deny and a dead task read as live permits one idle until staleness catches it, both directions bounded and logged. An open or proposed id that vanishes from the enumeration without a closed receipt, OR (FIX 2) a previously-actionable id DEMOTED to proposed/ungranted without a closed receipt (the checkpoint records each id's eligibility for this), is injected as a cannot-evaluate by the anti-shrinkage checkpoint (backlog-checkpoint.json: the first window has no union to compare, and a drop forced by the checkpoint's id bound is logged, never silent); that eligibility memory is itself in the actor-writable state dir, the same categorical residual. A bound-released ALLOW WITH FINDINGS past ANY non-closed disposition (actionable, cannot-evaluate, waiting, blocked, or proposed) is marked forced_unresolved (a guard-events row plus an append-only row in forced-exit.jsonl, each surfaced exactly once via forced-exit-surfaced.json, a failed record surfacing in the warn banner itself) and is triaged by the next resume audit; no register row, attestation, or escape-adjacent artefact suppresses that record."

[[hook]]
id = "orch-teammate-idle-guard"
rules = ["setcmp", "cntdef", "trkasy"]
platform = "claude-code"
event = "TeammateIdle"
handler = "orch_teammate_idle"
default = "block"
class = "b"
residue = "The TeammateIdle binding of the same decision core as orch-stop-guard, sharing its registry/lease scoping, escape, counter bound, and guard-events logging. A deny (exit 2) prevents the teammate from going idle past enumerated actionable work. On cannot-evaluate (an enumerator error or an unreadable proof source) it takes the STOP branch, which (FIX 1) now DENIES the idle (ignorance refuses the wind-down; a denied TeammateIdle cannot wedge the session, and the operator escape releases a genuine block); an unreadable registry or unresolvable cwd still fails OPEN at the binding. Same disclosed bounds as orch-stop-guard on ledger blind spots, fabricated blocker evidence and its attestation narrowing, escape-sentinel acceptance, the anti-shrinkage checkpoint, and the forced_unresolved marking of bound-released exits. Fires only where the platform emits TeammateIdle (doc-confirmed 2026-08-29); platforms without the event keep only the Stop and yield-tool bindings."

[[hook]]
id = "orch-yield-tool-guard"
rules = ["setcmp", "cntdef", "tstamp", "estsep"]
platform = "claude-code"
event = "PreToolUse"
matcher = "ScheduleWakeup|CronCreate"
handler = "orch_yield_tool"
default = "block"
class = "b"
residue = "The scheduled-yield binding of the decision core: a call that parks the run (schedule_idle) or ends the loop (a ScheduleWakeup with stop=true is classified stop) is judged against a fresh enumeration. Registry-scoped and lease-scoped like orch-stop-guard; a tool the registry's yield_tools list does not name is out of scope even inside the matcher, and a registry yield tool OUTSIDE this fixed matcher is NOT covered (the doctor flags it; a manifest matcher is fixed at generation). On the schedule path a cannot-evaluate DENIES (missing evidence never licenses new autonomy; a denied tool call cannot wedge a session), bounded by a three-denial cap on an unchanged basis, after which it ALLOWS WITH FINDINGS so the guard cannot be farmed into bypass training. That cap needs persistable, readable turn-state; when the state directory is unreadable or unwritable the denial count cannot accumulate, so the schedule path stays fail-closed to DENY (the safe direction: the run keeps working rather than idling) and the cap does not relieve. Wake hygiene: a permitted schedule must name the tracked item or blocker it will recheck in its own text, judged by token containment (a paraphrase that names neither id nor ref denies once, a disclosed over-fire). The quiet-duration check is a best-effort regex: it fires only when the call text carries a parseable minutes claim AND turn-state carries a measured gap, and then the measured figure wins; an unparseable claim or an unknown measured endpoint authorizes nothing and is not invented. A fired timer or an existing cron is never counted as a live task or a blocker. Escape-sentinel acceptance, the attestation narrowing of external and foreign-lease evidence, and the anti-shrinkage checkpoint are shared with orch-stop-guard; cap or bound relief past any non-closed disposition (actionable, cannot-evaluate, waiting, blocked, or proposed) is marked forced_unresolved (a guard-events row plus an append-only row in forced-exit.jsonl, surfaced once via forced-exit-surfaced.json), a failed record surfacing in the returned systemMessage."

[[hook]]
id = "orch-ask-unattended"
rules = ["cntdef", "recfst", "humovs"]
platform = "claude-code"
event = "PreToolUse"
matcher = "AskUserQuestion"
handler = "orch_ask_guard"
default = "block"
class = "b"
residue = "Registry-scoped: inert with no registry or no declared mode record. Blocks a blocking question ONLY when the declared operating-mode record contains 'unattended'; attended modes, an absent mode line, and an unreadable mode record all fail OPEN (this guards one known mistake shape, a blocking prompt idling an unattended run; it is not a security boundary), with the fail-open logged to guard-events. The deny instruction distinguishes record-and-continue for ordinary decisions from record-and-HOLD for anything at the human-oversight threshold; the hook redirects the question and never licenses acting without the answer. Each denied ask appends ONE idempotent machine row keyed on session_id plus tool_use_id, carrying a bounded redacted summary (question count, length, digest), never the question text. Its behaviour is verified by the behaviour self-test. It cannot see a blocking prompt raised outside the AskUserQuestion tool."

[[hook]]
id = "orch-truncation-guard"
rules = ["trkasy", "vrfdlv", "nocncl"]
platform = "claude-code"
event = "PreToolUse"
matcher = "Bash"
handler = "orch_truncation_guard"
default = "block"
class = "b"
residue = "AIRTIGHT-NARROW (round 32, maintainer-directed simplification): this guard does NO shell parsing, so no lexical, quoting, or operator edge can make it credit a capture that does not exist. It governs a background dispatch (run_in_background is true) with the capture-proof test below, and adds ONE narrow foreground branch (L-GS1): a foreground call (run_in_background not true) is out of scope EXCEPT that a bare '&' control operator, which detaches a child into asynchronous work this tool call does not track, is an ASK steering the operator to the tracked background dispatch. That foreground detector is a dedicated quote- and escape-tracking scan (not the shared segmenter, which strips quote and escape provenance and would misread a quoted or escaped ampersand as a separator): it distinguishes the detach '&' from the shell forms that also carry an ampersand but do not detach ('&&', '&>', '&>>', '<&', '>&', '|&', and any single-quoted, double-quoted, or backslash-escaped ampersand, and an '&' inside an unquoted word-start '#' comment, which is dropped). It catches ONLY a bare '&' operator in the OUTER command string, and a scan that ends still inside an unbalanced quote, or inside an ANSI-C dollar-single-quote construct ($'...') this scan does not model, could hide a real trailing '&', so it FAILS TOWARD THE ASK rather than silently allowing. HONEST RESIDUAL (disclose-guard-residuals): detachment achieved WITHOUT a bare '&' in the outer command is NOT caught and is SILENTLY ALLOWED, not over-asked - a runtime detacher that backgrounds with no '&' (setsid, disown, coproc; nohup is normally written with a trailing '&', which IS caught), a nested shell string whose '&' sits inside quotes (bash -c '... &'), and an alias or function that renames a detacher; the grammar cases that OVER-ask instead are NOT a single case: any unquoted '&' this scan does not model as a detach still reaches the scan and reads as an operator, so it asks when no detach is present. Examples are a here-document body carrying a literal '&', and an arithmetic expansion such as $(( a & b )) where '&' is bitwise-AND; any other construct this scan does not model that leaves a non-detach '&' unquoted in the outer string over-asks the same way. The guard roots via the scrubbed rev-parse primitive (git rev-parse --show-toplevel with every ambient GIT_* removed), so it does use git for session rooting; the AIRTIGHT-NARROW claim is about the command-string analysis doing NO shell parsing, not about avoiding git.Approving that ASK does not itself create tracking; only converting to run_in_background=true lets the dispatch ledger record the launch. The foreground branch stays registry-scoped, so a non-orchestrated session acquires no new prompt. A background dispatch is ALLOWED only when the whole command is drawn from a conservative safe character set (letters, digits, space and tab, and the punctuation '_ - . / = : @ , + %'), so it carries NO shell metacharacter (no pipe, redirect, separator, quote, expansion, command or process substitution, grouping, glob, comment, tilde, history, or newline) and is not a shell reserved word (coproc, which backgrounds a coprocess whose output the harness does not capture, or a compound/prefix keyword such as if/for/while/time) and its full stdout reaches the harness capture that run_in_background binds to the TaskOutput completion signal IN THE COMMON CASE - unless the invoked program or wrapper itself detaches, daemonizes, or redirects that output, which is out of view (see the program-behaviour residual below). ANY other command is an ASK: the guard does not parse shell syntax to prove or disprove capture, so it asks the operator to confirm the full output lands in a durable capture (redirect the producer's own stdout to a real file, or make a real-file tee the final stage). DISCLOSED COVERAGE BOUND (deliberate, not a defect): this trades COVERAGE for a guarantee of NO SHELL-SYNTAX FALSE-ALLOW (no quoting or parsing edge in the dispatch string can fabricate a capture). A legitimate captured background dispatch that uses any shell syntax (a real-file redirect, a tee, a glob, an env-assignment prefix carrying a quote) is ASKED rather than proven, and the guard never actively DENIES a parsed command; the operator's confirmation at the ASK, and the vrfdlv delivery-marker discipline, are the compensating layers. What this buys over a lexical capture-proof: the ALLOW rests on a raw-character test that no quoting or parsing can fool, so there is no shell-syntax edge that can silently open a false allow. The residual is RUNTIME behaviour beyond the dispatch string: a plain command can still fail to deliver its full output to durable capture for reasons no pre-execution command-string check can show. Two classes. (a) The invoked program or wrapper's own behaviour - a terminal multiplexer or setsid that detaches, a start-stop-daemon or nohup-style wrapper that backgrounds or redirects the producer's stdout (e.g. --output /dev/null), a program that internally pipes to head/tail, or one that sources a script or resolves a PATH name to a truncating tool. (b) Platform and resource limits - the harness's own TaskOutput capture has a size ceiling (Claude Code terminates a background task whose output exceeds a documented limit), so a very large stream is lost at the harness regardless of the command, and disk-full, a kill signal, or other run-time conditions can likewise cut delivery short. None of this appears in the command string. The guard's ALLOW therefore asserts only that no shell SYNTAX in the dispatch string can defeat capture; whether the output actually and fully reaches durable capture is a run-time property that the post-execution vrfdlv delivery-marker discipline, not this guard, confirms. The only DENY is the fail-closed case of a background dispatch carrying no readable command string."

[[hook]]
id = "orch-dispatch-ledger"
rules = ["trkasy", "recfst"]
platform = "claude-code"
event = "PostToolUse"
matcher = "Bash|TaskOutput"
handler = "orch_dispatch_ledger"
default = "warn"
class = "c"
residue = "A RECORDING substrate, not an enforcement point: it appends launch rows (a Bash call with run_in_background true, or a registry-declared dispatch tool) and completion rows (a TaskOutput read) to the machine-written dispatch ledger the stop guard consumes as its Gap-B oracle. It never blocks; a failed ledger write is surfaced as a non-blocking systemMessage, never swallowed. Coverage is exactly the hooked tools: a launch through an unhooked tool is invisible (costing one spurious stop-guard deny), a completion that never passes through TaskOutput is invisible until the staleness horizon expires the row, and the task-id extraction from tool responses is best-effort field matching. Both blind-spot directions are bounded by staleness plus the resume audit, and disclosed at the stop guard."

[[hook]]
id = "orch-prompt-stamp"
rules = ["tstamp", "estsep"]
platform = "claude-code"
event = "UserPromptSubmit"
handler = "orch_prompt_stamp"
default = "warn"
class = "c"
residue = "A RECORDING substrate: stamps the clock-read UTC time of each GENUINE human prompt into turn-state (resetting the stop guard's deny counters), classifies a prompt matching a registered wake as timer-originated (not stamping it), and injects a measured-gap context line so any quiet-duration reasoning uses the measured figure. It never blocks. Classification is digest matching against wake registrations this suite itself recorded: a wake fired through a mechanism the suite never saw is stamped as genuine human input (the safe direction: it only narrows guard autonomy). An unknown prior stamp yields an 'unknown' gap that authorizes nothing."

[[hook]]
id = "orch-resume-audit"
rules = ["sesres", "recncl", "cnclse"]
platform = "claude-code"
event = "SessionStart"
handler = "orch_resume_audit"
default = "warn"
class = "b"
residue = "SessionStart cannot block at the platform (exit 2 shows stderr only, doc-confirmed 2026-08-29), so this layer SURFACES divergence and ARMS the PreToolUse resume barrier; the barrier is the mechanism. Probes, all fail-closed to a finding rather than a silent pass: the declared handoff's Branch line against the real HEAD (scrubbed read-only probe), a handoff gate marker's commit against the real HEAD commit, lease staleness, every declared record surface readable (a declared-but-unreadable surface is a cannot-evaluate FINDING, never nothing-to-check), and merge-pending rows against first-parent merge evidence. Registry-scoped; with no registry it is silent. It reads records and git state only; it cannot detect a handoff that is stale in ways its declared grammar does not carry (free-text drift), and lease MISMATCH detection is bounded to staleness because a session cannot prove its own identity against the holder field."

[[hook]]
id = "orch-resume-barrier"
rules = ["sesres", "recncl"]
platform = "claude-code"
event = "PreToolUse"
matcher = "Write|Edit|MultiEdit|NotebookEdit|Bash"
handler = "orch_resume_barrier"
default = "warn"
stage = "bake"
class = "b"
residue = "The mutation barrier behind orch-resume-audit, shipped WARN-FIRST (stage bake, a recorded posture): while the barrier state is armed it surfaces a systemMessage on the first mutation outside the allowlist (the record surfaces, the registry files, and the suite's own state directory stay writable, so the only exit, correcting the record, is never blocked), and it blocks nothing during the bake. The flip to deny is a manifest edit (stage to enforce, default to ask/deny) taken on recorded guard-events evidence after the bake period, per the guardrail-config-integrity discipline. Bash targets are not path-judged (a command's write targets are not lexically resolvable), so Bash mutations pass with the same surfacing only. Clearing the barrier requires re-running the audit (tools/orch_doctor.py --resume-audit) against corrected records; acknowledgement alone does not clear it."
