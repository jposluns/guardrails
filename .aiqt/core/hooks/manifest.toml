r a git word another command merely carries); the text past where it stopped is read two ways, and a deny from either stands: a quote-aware re-lex of the text past each construct the reader can measure on the same text (the target word of a here-string, or the balanced parentheses of a process substitution with backslash escapes honoured), each recovered command read through its subcommand word, and the every-git-word reading, which walks the region of each git word in the raw text from the stop, denying where a region cannot be read to its subcommand word or holds a word built at run time. The re-lex alone decides only where its ground is proven: the construct measured with no backslash escape met, no git word inside the text of the measured construct itself (the body of a process substitution and the word of a here-string are run or expanded, so a git region there keeps the raw reading), the resume at a command separator, and every git word of the re-lexed text read as a word of a recovered command (one in a comment or a redirect target is not); there a git word the re-lex proves to be quoted text (an echoed git word past a stop, a pull-request or issue body naming git) allows, while a plain git word any command carries as a word of its own (under a wrapper the guards do not resolve, such as flock or ionice, included) is still walked and denies where its region runs open or holds a word built at run time. At every other point (an unquoted heredoc, a {fd} redirect or an unbalanced quote the reader cannot measure, a resume that is not at a separator, a measure that met a backslash escape, a git word inside the measured construct, one in text the re-lex gives no word for, or a git word beside a $ or backquote inside a re-lexed word) the every-git-word reading decides too, so a quoted or commented git word there still denies, a disclosed over-refusal; a literal region read in full keeps its decision either way. Disclosed over-refusal: a word naming git that is the last word read before such a construct and is its command word (git <<<x log) still denies, while a git word only an operand of the segment the lexer stopped inside (grep -c git <<<x) is not read as a git command, so it allows. Remaining residual of this reading: the every-git-word walk reads the region of a git word on the raw text, so from inside quoted, comment or here-document text it can only over-refuse, never allow a git command the re-lex read; a git command whose git word is itself built at run time (an expansion that expands to git) is outside both readings, as on a parsed command. A word reads as one word to bash only when no part of it can expand to several words: a double-quoted expansion of the positional list or of an array subscripted with @, in any parameter-expansion form, with or without an operator or substring, and an indirect expansion whose reference (a variable, an array element read through a subscript of its own, a positional parameter or $*) can hold a reference to such a list (a double-quoted $@, ${@:1}, ${A[@]}, ${A[@]:0}, ${!A[@]}, ${!R}, ${!A[0]}, ${!1} or ${!prefix@}), expands to one word per element, so it counts there as an unquoted expansion does. A word whose every expansion stands inside double quotes and expands to one word keeps the plain reading on a parsed command: behind a literal key, as another option value or as the subcommand it defines nothing. Disclosed over-refusal (the safe direction): an unquoted variable in a git option or subcommand position now denies (git -C $DIR log, git $SUB, git -c core.pager=$P log), as does one after any other word naming git (grep -r git $DIR) and a git command inside an unquoted backquote substitution whose closing backquote the lexer reads into its subcommand word; quoting the variable restores the plain reading. The deny reason names such a word as one the shell builds at run time, with the fix (quote the expansion, spell a -c key literally, write a list out, put a here-string after the subcommand word), and keeps the alias wording for an actual alias definition. A key that is literal in effect but spelled through an expansion or such a quote reads as an alias, and so does a brace word there that expands to no option. Not read: the git word itself, read by its decoded text alone (an unquoted expansion in it, or a brace word that is the git word, which bash can split into git and a definition), and a word in that region that bash builds by filename expansion (an unquoted star, question mark or opening bracket matching a file name such as -c) or by a brace sequence expression, which holds no comma, and a word whose every expansion stands inside double quotes and expands to one word, which keeps the plain reading by decision, so one that names an option such as -c at run time, before a literal definition, is not read as one. A missing or non-string command DENIES fail-closed, as in the other git guards. It also does NOT catch a real discard whose VERB is OUTSIDE the recognized set AND unflagged by the raw scan: a `git worktree remove -f` (or `--force`) of a dirty linked worktree discards the uncommitted work in that worktree, but `worktree` matches no lossy keyword, so the command is allowed at the true boundary; that verb is deliberately NOT added this round (disclosure matches the best-effort posture). By contrast (F-97), a command the raw scan DOES flag as in-scope whose resolved subcommand is nonetheless outside the recognized set (`git checkout-index -a -f`, `git read-tree -u --reset HEAD`, flagged by their `checkout`/`reset` substring) is NO LONGER silently allowed - it ASKS, since a flagged sub the classifier cannot resolve to a known verb cannot be proven non-destructive, and its sub is not snapshottable so no recovery point exists. It also does NOT catch obfuscation of the COMMAND WORD `git` ITSELF or of the verb that no reading of the text assembles. The scope scan reads the raw text, the text with its line continuations joined, and a copy with quotes, a $ before a quote, and backslashes removed, all unstripped, on a certain and an uncertain reading alike, so a wrapped reset fragmented by quotes or a backslash (env git followed by a quote-broken re-set, alone or after another git command) or a command word quote-broken so it spells git only after the shell strips the quotes (under a wrapper such as command or env) is in scope, where the closed allowlist grammar below DENIES it (no wrapper is an accepted command word). A word built another way (an escape decoded inside an ANSI-C quote, or a parameter expansion or command substitution evaluated at run time) reads as "no recognized lossy verb": as the subcommand word, spelled through an ANSI-C quote or an unquoted expansion, it DENIES as a git alias (below), but a verb built inside double quotes and a command word built at run time are silently ALLOWED, so the claim that any wrapper ASKS is NOT categorical: it holds only while one of those readings sees a contiguous git+verb keyword. This is a disclosed best-effort residual (the guard targets the accidental case, not an adversary deliberately building the command word or the verb at run time). When the shell reading is uncertain (any unquoted #, <<, ( or ), a lone { or } word, any backtick or $(, a line continuation the lexer reads differently once joined, or a form the lexer refuses), the same readings decide the scope, so a quote-fragmented verb in such a command is in scope. The joined reading brings a verb that a continuation splits under a wrapper into scope, and the de-quoted copy makes a quote-broken subcommand outside the recognized set (a fragmented checkout-index) deny like its plain spelling; a command the lexer refuses is flagged from its de-quoted copy too and then denies like every flagged unparseable command, so a split or quote-fragmented -C, --git-dir, --work-tree or cd redirect never reaches a session-directory snapshot. The probe ITSELF can be made to under-report dirtiness by git config or index state: an `assume-unchanged` or `skip-worktree` mark on a tracked file, or a `submodule.<name>.ignore` setting, hides real modifications from `git status`, so the guard can read a genuinely-dirty tree as provably clean and ALLOW a discard of that hidden work; and the recovery snapshot ALSO cannot capture assume-unchanged/skip-worktree content (it is not in what `git add --all` re-stages) nor IGNORED files (git add --all excludes them; an ignored file overwritten by a forced checkout or removed by `clean -x` is unprobed - to avoid asking on every repo carrying build artifacts - and unsnapshotted). Beyond that, being ultra-conservative it OVER-FIRES heavily - every compound or metacharacter-bearing command that names a lossy verb is at best snapshot-then-allowed and at worst denied even when it would have been safe (no in-band override exists); a command that pipes or wraps a plain git segment (`git log | grep branch`) and a NON-GIT segment that contains a git word as TEXT (`echo git branch`) each DENY under the positive grammar when a lossy keyword puts the command in scope, because the raw scan matches the keywords wherever they appear and the grammar refuses every byte and command word outside its closed lists (a safe-direction over-deny, not narrowed: narrowing the raw scan is the whack-a-mole GD-34 rejected); the copy with quotes, a $ before a quote, and backslashes removed is matched the same way, so quoted prose whose words spell git and a lossy verb only once the quotes are removed (an echo or printf of a quote-broken git re-set, such as `echo "git re""set --hard"`) is in scope although the shell runs only echo or printf, and the grammar DENIES that harmless command (echo, printf and a double quote are outside it), while a read-only git subcommand whose quoted argument spells a lossy keyword only once the quotes are removed (`git log --grep="re""set"`) DENIES as an unrecognized flagged subcommand, as its plain spelling already did (kept, not narrowed: quoted text is code under eval, bash -c or sh -c, and this reading is what brings a fragmented verb there into scope); and a pristine whole-tree clobber over-DENIES on a dirty tree even when the specific target would have lost nothing - an accepted, recoverable cost of never silently allowing a real WORKING-TREE-CONTENT discard for a recognized command that is NOT covered by a disclosed residual. That no-silent-allow property is bounded to working-tree content: ref-level moves (reset --soft moving HEAD, a merged-branch delete) are reflog-recoverable, and the obfuscation/config residuals above are best-effort, not categorical. PR #423 replaces the earlier modelling walk with a POSITIVE LITERAL closed allowlist grammar, judged directly on the RAW string of every non-pristine in-scope command, so shell behaviour is never modelled on this path: anything the grammar does not spell out is denied by construction. THE GRAMMAR, exactly: every token is a bare literal word over the character class of letters, digits and _ . / @ : = + , % -, or ONE single-quoted literal containing no quote, standing alone as a whole token; the accepted command words, spelled bare and unquoted, are git, cd (option flags -P and -L only, exactly one operand, an absolute literal path with no parent-directory component whose realpath equals its normpath, so no symlink component), and true or : with no arguments; no assignment word (NAME=value) is accepted in or before a command-word position, and a GIT_* assignment-shaped token ANYWHERE in the command denies; a git segment accepts no global option but -C with an absolute literal path under the same rules, and its bare subcommand must be on the explicit read-only allowlist (status, log, rev-parse, rev-list, ls-files, ls-tree, cat-file, grep, describe, shortlog, name-rev, merge-base, check-ignore, check-attr, count-objects, show-ref, for-each-ref, var, version; ls-remote is DELISTED, because its --upload-pack/-u option runs an arbitrary command string and the subcommand itself opens network access, and help, diff, show and blame are DELISTED, because their ACCEPTED command line can run a configured program through git itself: git help launches a man viewer or browser and a configured man.<tool>.cmd is shell-evaluated, while the patch output of diff, show and blame runs configured textconv and external-diff drivers; -p/--patch is outside every closed option allowlist for the same reason - removed from every read-only option list AND denied on the modelled lossy verbs checkout, restore, reset and stash (the push and save forms included; a digit-led cluster such as -2p and a flag hidden behind a consumed separated option value included, every declared option value consumed by its arity first), on the pristine single-command path and the grammar path alike, because interactive patch mode renders its hunks through the configured interactive.diffFilter program - and for-each-ref --format AND --sort are delisted because the %(...) placeholders and the sort atoms include signature fields that run the configured signature program) AND, for a read-only subcommand, carry ONLY the VETTED option spellings of that subcommand (exact value-less flags plus value-taking options accepted ONLY in the joined --opt=value spelling git itself reads joined - NEVER a separated value word, which git reads as a token in its own right: an earlier revision consumed a following word as an optional value, so git log --pretty --output=<path> passed vetting while git read --output as an option of its own and truncated the path - with no abbreviation even where git accepts an unambiguous prefix, each option value shape-validated, the log --pretty/--format value restricted to EXACTLY the seven named formats oneline, short, medium, full, fuller, reference and raw or to a string carrying the format: or tformat: prefix over an explicit placeholder allowlist that excludes every %G signature placeholder (EVERY other value denies, abbreviations and further built-in names such as email included, because git resolves an unprefixed value as a built-in format name or a pretty.<name> CONFIGURATION alias, and a configured alias can itself carry %G), a -- token ending the option region with every later token a positional operand, and a non-option token passed through as a positional operand - a rev, path, pattern or object name: DATA to the subcommand that receives it, never inert), because a read-only SUBCOMMAND is not a read-only COMMAND LINE: an unvetted option can run a program (git grep --open-files-in-pager/-O runs one per matching file) or write a file (git log --output=<path> truncates that file), so any option outside the vetted set denies naming itself; an explicit git stash list carries NO argument and an explicit git stash show carries AT MOST ONE positional stash reference and nothing else, no option-shaped token and no "--" (git forwards stash list arguments to git log and stash show arguments to git diff, where they would ride around the vetted grammar and the delisted diff class, and a retained "--" makes git stash show itself select patch output), a rule applied on the pristine single-command path and the grammar path alike; or a modelled lossy verb, which is then preserve-then-allowed exactly as the pin does (a resolved stash drop/clear preserves the stash of that repository under durable refs first or denies; a resolved worktree discard is snapshotted at its resolved target or denies; and the session cwd is ALWAYS snapshotted as the catch-all for every in-scope command), carrying ONLY the CLOSED option allowlist of that verb - exact spellings with each value-taking option consuming its value by arity; any other option denies naming itself, and git branch lists no --sort, --format, --edit-description or --list spelling, because the sort atoms and format placeholders include signature fields that run the configured signature program and --edit-description launches the editor (the ACCEPTED -m/--merge and --conflict spellings and the accepted stash pop and apply forms DO run the git-internal content merge, which honours a configured merge.<driver>.driver program on paths whose attributes select that driver - a DISCLOSED residual among the configured programs, bounded like the clean-filter and hook classes above, not a claim that an accepted lossy form runs no configured program) - while a compound that CONSUMES a stash entry (git stash pop, git stash branch) together with another lossy verb denies outright, because a successful pop applies then drops the entry, so the following verb can destroy the just-applied content while the dropped entry is gone and the pre-command snapshot cannot contain it (a bare consuming command alone keeps its handling); a git stash resolves its operation ONLY from its FIRST argument: a bare first word is the explicit operation, while no argument, a leading option of any spelling (-q, -m <msg>, an attached -m<msg>, --message=<msg>) or a leading -- token reads as a bare or implicit push (safe) - git itself refuses an implicit push carrying a stray bare token, and never runs one as a drop or clear - so a message value or a pathspec named drop or clear is never read as the operation; the joins are the && operator, the semicolon and the newline only, with a trailing semicolon and leading or trailing newlines accepted (bash runs the same commands) while a trailing && and any doubled or misplaced operator denies, and a cd is honoured for a later segment only across && joins (across a semicolon or newline the cd may have failed with the next command still running, so the directory becomes unprovable and a later discard-capable segment denies); the redirections accepted are >/dev/null, 2>/dev/null and 2>&1 only, none of which writes a file; an accepted redirect may directly follow a completed bare or quoted word (the word ends at the operator, exactly as bash reads it), an all-digit word standing immediately before the > operator is an IO number of which only 2 is accepted, and repeated accepted redirects are accepted. ANYTHING ELSE DENIES, naming the violation class: every other byte (a dollar sign, a backquote, a double quote, a backslash, a glob or brace character, a tilde, a comment hash, any <, which rules out every heredoc, here-string, process substitution and input or read-write redirect, a parenthesis, a pipe, a stray ampersand, a control byte), every quoting form beyond one standalone single-quoted literal, every other command word (echo, printf, test, [, pwd, pushd, popd, export, eval, source, ., set, unset, alias, every wrapper and interpreter, every quoted, concatenated or pathed spelling), every assignment word, every other git global option (-c, --git-dir, --work-tree, --namespace, --no-pager and the rest), every unlisted subcommand (git commit or git push inside an in-scope compound included, and the delisted ls-remote), every unvetted or abbreviated read-only option (the deny names the offending spelling), every unresolvable or symlinked cd or -C path, every other join or redirect, and a trailing && (a trailing semicolon or newline is accepted, as stated above). THE FALLBACK COST, disclosed: an UNPARSEABLE command (a tokenizer ValueError) whose FULL raw text or its de-quoted copy the scan flags - git plus a work-losing verb keyword; heredoc bodies are NO LONGER stripped anywhere on this guard, because stripping removes text and so can only hide a real discard - is DENIED outright, read-only and prose-only forms included, with NO session snapshot and NO stash preservation; only an unparseable command the scan clears on both readings is allowed at the true boundary. The same no-stripping rule brings a PARSEABLE command whose quoted-heredoc prose merely mentions a lossy keyword in scope, where the grammar denies the heredoc operator itself: a disclosed over-deny in the safe direction. WHAT THE GRAMMAR DOES NOT COVER, disclosed: it proves nothing about a command it accepts beyond the shapes above - the vetted read-only option lists are a point-in-time audit of the named spellings against the program-running and file-writing options git documents (a future or renamed git option outside the vetted set denies rather than runs, an over-deny by design); REPOSITORY, GLOBAL OR SYSTEM CONFIGURATION CAN MAKE EVEN AN ACCEPTED READ-ONLY GIT COMMAND RUN A CONFIGURED PROGRAM - core.fsmonitor runs its monitor on git status, textconv and external-diff drivers run where file content or patches are rendered, a configured pager or viewer can run on any command that pages, a configured signature program runs where signatures are read, and configured clean/smudge/process FILTER DRIVERS (filter.<driver>.clean, .smudge and the long-running .process) run where git checks content in or out - so the grammar bounds the COMMAND LINE, never configuration, and a positional operand is DATA passed to the read-only subcommand that receives it, not inert; an accepted literal path is checked lexically and by realpath only (a mount, bind mount or rename race can still make the directory git uses diverge); acceptance of true and : assumes the shell builtins, which a function defined in a PRIOR turn outside this command could shadow; and the raw-scan scope residual of the pin is unchanged (a real discard whose verb is outside the recognized set AND unflagged, such as git worktree remove -f, is still allowed at the true boundary, and a git or verb spelling fragmented in a way no raw, joined or de-quoted reading assembles reads as out of scope where the git alias reading does not deny it). DEFERRED, tracked as later work: accepting a vetted wrapper form (env/nice/timeout with an inert prefix), a vetted interpreter form (sh -c or bash -c with a single literal body), and a vetted xargs form; each now denies with a re-issue-plainly education. Newly denied legitimate spellings, each with its plain allowed alternative: echo or printf beside a discard in one command denies, run the discard alone or join plain git, cd, true and : segments with &&; a relative or symlinked cd or -C path denies, use a literal absolute physical path; a cosmetic GIT_* assignment or a colour/pager -c key on a non-pristine discard denies, drop the assignment or option (the pristine single-command spelling keeps them); a heredoc in an in-scope command denies, feed data from a file instead; an expansion, substitution or double-quoted token denies, spell the operand as a bare or single-quoted literal. The plain read-only and modelled forms (git stash list, show and apply, git status, git log, an &&-joined literal absolute cd before a plain discard, and a literal git -C <abs> discard, each preserve-then-allowed) still allow. DEADLINE: main() gives this check 8 seconds (the 10-second hook timeout less 2), counted from before its payload read, and fails closed with exit 2 when it has not decided by then; on the worst shapes the hooks self-test times, up to 1 MB, its slowest call took about 0.58 s in-process on a 24-core host with Python 3.14.4 (one run on 2026-10-18, including the shapes whose comment reading depends on context). Interpreter start-up and a wait the interpreter cannot interrupt (a read from a hung mount, a long call into C code) fall outside that deadline, and whether the platform blocks a call whose hook it stops at its own timeout is unverified. Where SIGALRM, setitimer or the main thread is unavailable, or SIGALRM is blocked, the check runs with no deadline; cleanup that runs while the deadline unwinds is outside it.'

[[hook]]
id = "protected-line-guard"
rules = ["prtbrn", "artbr1"]  # integ / protected-branch-integrity (the push layer) + branch-and-merge-on-green (the direct-commit layer)
platform = "claude-code"
event = "PreToolUse"
matcher = "Bash"
handler = "protected_line"
default = "block"
class = "b"
residue = '''
Within the Bash hook's recognized or apparent direct-commit surface, commits deny unless an admitted command shape proves their target worktree and non-protected local branch, or the narrow lone no-remote policy exemption applies. Unknown wrappers, unsupported preceding effects or control flow, accompanying repository/configuration mechanisms, non-cosmetic ambient GIT_* overrides, and failed probes deny. A plain absolute git -C /absolute/repo commit is supported only when its applicable branch is proved non-protected and no accompanying mechanism or unknown preceding effect invalidates that proof. Protected names are exactly main and master, case-sensitive. Unknown and proved-protected states are distinct internally; both deny without an applicable certificate. There is no unproved-commit allow-note and no ASK outcome.

Certificates: A is a plain session commit with an intact absolute cwd binding and validated non-protected local HEAD. B is a commit with exactly one separated, nonempty, absolute literal -C operand, a proved worktree identity, and applicable non-protected branch state. C is a commit gated through an uninterrupted && chain by an admitted switch addressing the same proved worktree. D is a policy exemption, not evidence of a non-protected destination: exactly one plain session commit on a valid protected local HEAD, with remote absence proved by successful configuration and legacy-common-directory checks. Unknown remote state withholds D. Compounds, -C, redirects, wrappers, assignments, and opaque arguments cannot obtain D. A valid unborn symbolic local HEAD can establish a branch name; detached, malformed, missing, or unreadable HEAD cannot.

Every committing shape requires complete admitted syntax and literal arguments, including quoted literal message data. The only Git prefixes are git commit and git -C /absolute/repo commit; arguments after the commit verb remain commit arguments, judged by other guards for their own policies. Compounds admit only &&-connected segments: argument-free :, true, or false; exactly printf %s LITERAL; exactly cd ABSOLUTE_LITERAL_DIRECTORY; git switch EXISTING_LOCAL_BRANCH; git switch -c NEW_LOCAL_BRANCH; git checkout -b NEW_LOCAL_BRANCH; and separately certified commits. Switch forms may use the same exact absolute -C prefix. A preceding admitted cd invalidates session binding; an explicit target can establish B afterward. An admitted trailing cd cannot change an earlier commit destination. Unknown segments before or after a commit deny the whole commit-bearing command. Exactly lone literal git commit --help and git commit -h are non-committing help forms; message values, pathspecs, and global-option values spelling --help do not supply that exemption.

INTENTIONAL OVER-DENY: harmless global options, leading assignments (including the removed discard-override prefix), wrappers even with harmless options, attached/relative/repeated/empty -C, redirects, unsupported switch syntax, complex compounds and non-&& separators, and detached commits are rejected even when a particular execution would be harmless. Absolute -C does not repair protected branch state, unknown prior mutations, ambient overrides, or failed probes. After arbitrary work such as make test, issue the commit as a SEPARATE hook invocation that obtains fresh state; make test && git -C /absolute/repo commit is outside the admitted grammar. Use a plain feature-branch commit or an exact absolute-target commit in that fresh invocation; an admitted switch or literal cd may participate only under the stated grammar.

Worktree identity and terminal full symbolic HEAD are established by scrubbed, bounded read-only probes. Alternate paths to one Git directory share conditional branch state; linked worktrees retain separate HEAD state. Existing switch destinations must be validated local branches, without symbolic-alias or remote-guess ambiguity. Probe failures, malformed output, timeouts, and exhausted input/output/evaluation budgets withhold proof. Literal detection examines decoded and raw unclassified segments independently of ordinary Git segments; admitted literal message/printf data is not executable syntax. A git command that defines a git alias for itself (a -c or --config-env key in the alias, include or includeIf section, or a GIT_CONFIG_PARAMETERS or GIT_CONFIG_KEY_n assignment naming one), its git word read wherever it stands in its segment (the command word, or a word behind a reserved word, a { group, !, time or a wrapper word; not inside the text of another word, such as an sh -c or eval body) runs a subcommand neither the commit nor the push reading can see, so it denies on any branch before either reading, and the literal detector reads it as an apparent commit (on an unparseable command whenever its text names git and holds such a definition anywhere in its de-quoted words, past a here-string, an unquoted heredoc or a {fd} redirect the lexer stops at included, which denies as an unverifiable commit); so does every git command of a command whose text names GIT_CONFIG_PARAMETERS, GIT_CONFIG_COUNT or GIT_CONFIG_KEY_ anywhere (sought once every quote character, backslash, dollar sign and newline is removed, so a quoted, escaped or continued spelling counts, in any word, a here-string, a comment or an echo) and names git as a word anywhere, parsed or unparseable alike (git wherever it stands: behind a reserved word or a wrapper, or inside an eval or sh -c word), whatever form sets the variable and whatever its value, since a shell sets one in more ways than a reading of forms can list (on git 2.53.0 with bash 5.3 an export, declare -x, typeset -x or local -x word, a bare assignment or a readonly word to a variable already exported, and under set -a also a bare assignment, read, printf -v, a for loop variable, a default-value expansion or a nameref each defined an alias), so a mention that defines no alias (an echo, a comment, an unset, an unrelated value) counts too, a disclosed over-refusal, or that runs under a GIT_CONFIG_PARAMETERS or GIT_CONFIG_KEY_n naming one in the session environment the hook inherits, which counts as such a text does, git wherever it stands (not read: a variable name built at run time, such as an expansion after GIT_CONFIG_, a brace expansion or an escape decoded inside an ANSI-C quote, and a variable set outside the command text, in the startup files of the Bash tool shell or in a sourced file or a script the command runs). A definition counts however it is spelled: the lexer records how each word was spelled, and the rule is closed over the whole region after a git word through its subcommand word (every global option word, the value of any option and the word read as the subcommand), where a word that carries an unquoted parameter or command expansion (a dollar sign or backquote outside quotes, one bash reads literally included), which bash may split into several words such as a -c and a definition, or whose text came through an ANSI-C or locale quote (a dollar sign right before a quote character) defines a git alias whatever it decodes to, as does a word there holding an unquoted brace and a comma (bash expands it into several words), other than a -c or --config-env word and its value, and a -c value or a --config-env word whose key part (the text before its first =, or the whole word when it has none) is spelled through a parameter or command expansion, inside double quotes too, such a quote or a brace expansion; on an unparseable command the same rule reads the de-quoted words of each command, past a here-string, a heredoc or a {fd} redirect, where a quoted or escaped dollar sign, backquote or brace counts as an unquoted one would. On such a command a git region the lexer did not read denies, fail closed: where the partial lexer stops before the option region of a git command or inside it (a leading here-string, as in git <<<x -C DIR $X), that region is unread, scoped to a segment that runs git as its own command (its command word is git or a wrapper the guards resolve, never a git word another command merely carries); the text past where it stopped is read two ways, and a deny from either stands: a quote-aware re-lex of the text past each construct the reader can measure on the same text (the target word of a here-string, or the balanced parentheses of a process substitution with backslash escapes honoured), each recovered command read through its subcommand word, and the every-git-word reading, which walks the region of each git word in the raw text from the stop, denying where a region cannot be read to its subcommand word or holds a word built at run time. The re-lex alone decides only where its ground is proven: the construct measured with no backslash escape met, no git word inside the text of the measured construct itself (the body of a process substitution and the word of a here-string are run or expanded, so a git region there keeps the raw reading), the resume at a command separator, and every git word of the re-lexed text read as a word of a recovered command (one in a comment or a redirect target is not); there a git word the re-lex proves to be quoted text (an echoed git word past a stop, a pull-request or issue body naming git) allows, while a plain git word any command carries as a word of its own (under a wrapper the guards do not resolve, such as flock or ionice, included) is still walked and denies where its region runs open or holds a word built at run time. At every other point (an unquoted heredoc, a {fd} redirect or an unbalanced quote the reader cannot measure, a resume that is not at a separator, a measure that met a backslash escape, a git word inside the measured construct, one in text the re-lex gives no word for, or a git word beside a $ or backquote inside a re-lexed word) the every-git-word reading decides too, so a quoted or commented git word there still denies, a disclosed over-refusal; a literal region read in full keeps its decision either way. Disclosed over-refusal: a word naming git that is the last word read before such a construct and is its command word (git <<<x log) still denies, while a git word only an operand of the segment the lexer stopped inside (grep -c git <<<x) is not read as a git command, so it allows. Remaining residual of this reading: the every-git-word walk reads the region of a git word on the raw text, so from inside quoted, comment or here-document text it can only over-refuse, never allow a git command the re-lex read; a git command whose git word is itself built at run time (an expansion that expands to git) is outside both readings, as on a parsed command. A word reads as one word to bash only when no part of it can expand to several words: a double-quoted expansion of the positional list or of an array subscripted with @, in any parameter-expansion form, with or without an operator or substring, and an indirect expansion whose reference (a variable, an array element read through a subscript of its own, a positional parameter or $*) can hold a reference to such a list (a double-quoted $@, ${@:1}, ${A[@]}, ${A[@]:0}, ${!A[@]}, ${!R}, ${!A[0]}, ${!1} or ${!prefix@}), expands to one word per element, so it counts there as an unquoted expansion does. A word whose every expansion stands inside double quotes and expands to one word keeps the plain reading on a parsed command: behind a literal key, as another option value or as the subcommand it defines nothing. Disclosed over-refusal (the safe direction): an unquoted variable in a git option or subcommand position now denies (git -C $DIR log, git $SUB, git -c core.pager=$P log), as does one after any other word naming git (grep -r git $DIR) and a git command inside an unquoted backquote substitution whose closing backquote the lexer reads into its subcommand word; quoting the variable restores the plain reading. The deny reason names such a word as one the shell builds at run time, with the fix (quote the expansion, spell a -c key literally, write a list out, put a here-string after the subcommand word), and keeps the alias wording for an actual alias definition. A key that is literal in effect but spelled through an expansion or such a quote reads as an alias, and so does a brace word there that expands to no option. Not read: the git word itself, read by its decoded text alone (an unquoted expansion in it, or a brace word that is the git word, which bash can split into git and a definition), and a word in that region that bash builds by filename expansion (an unquoted star, question mark or opening bracket matching a file name such as -c) or by a brace sequence expression, which holds no comma, and a word whose every expansion stands inside double quotes and expands to one word, which keeps the plain reading by decision, so one that names an option such as -c at run time, before a literal definition, is not read as one. This finite grammar and literal detector do not discover every commit hidden behind renamed executables, aliases defined in configuration files, functions, opaque scripts, or unparseable fragmentation. Other tools and commit-producing verbs such as merge, cherry-pick, revert, am, and rebase remain outside this direct-commit boundary.

TRUST ASSUMPTIONS: trusted executable/builtin resolution; correspondence between the hook and execution environments; stable paths and configuration; and non-hostile hooks, editors, and helpers. Concurrent changes and probe-to-execution races remain residual risks. Server-side protection is a separate layer and does not validate this local pre-execution proof.

PUSH COVERAGE REMAINS SEPARATE. A raw-text backstop scans every submitted command unstripped, before any parsing, one command segment at a time (backslash-newline continuations are joined first, as bash joins them, then the text is split at newlines and at ;, &, | separators outside provable quoting, a # opening a comment only where bash starts a word; an unterminated construct leaves the remainder one segment), reads each segment as written, with its line continuations joined, and with quotes, a $ before a quote, and backslashes removed, and denies when one segment pairs a git push with a force, delete, mirror or --all/--branches sweep spelling and a protected branch name. Each of those long options is matched at every abbreviation git 2.55 accepts as unambiguous, derived from the long-option set of git push: --force, --force-w for --force-with-lease, --force-i for --force-if-includes, --m for --mirror, --al for --all, --b for --branches, --de for --delete and --pru for --prune (the shorter --for and --forc, which git rejects as ambiguous, match too); push-shaped prose pairing those inside one segment, in a heredoc body line, quoted string, comment or commit message, is denied too, a disclosed over-denial in the safe direction, while a force spelling, deletion flag, protected name or option value that appears only in a different segment (a rebase onto origin/main beside a feature force-push, an rm -rf beside a plain push, a --format or --depth value) does not pair. Commit-free commands retain the existing lexical push classifier: force and protected deletion deny; an unprovable sweep or apparent force/delete denies fail-safe. Force includes short clusters, conservative long prefixes, leases, --force-if-includes, --mirror, and + refspecs. Sweeps include forced --all/--branches, matching :/+:, wildcard force/deletion, and --prune with wildcard/matching refspecs or --all/--branches. Operand roles distinguish the repository from destination refspecs; supported value-taking options and --/--end-of-options are consumed before flags and destinations are judged. Command-local remote.<name>.mirror configuration via separated -c is value-aware and last-value-wins for a direct same-key assignment; --config-env for that key denies regardless of the unread environment value. A refspec-less force or a forced/deleted HEAD/@ uses the separate scrubbed session-HEAD probe; unknown HEAD or an unresolved repository view denies. Deleted HEAD/@ are conservatively denied even though Git can reject those delete spellings. Plain non-force pushes and explicit non-protected destinations can allow.

Push residuals include execution outside Bash; renamed executables, aliases defined in configuration files (an alias the command defines for itself denies, above), functions, and scripts; runtime-expanded destinations; fragmentation beyond parsed, raw and de-quoted detection (such as an escape decoded inside an ANSI-C quote); a wrapped force, delete, mirror or --all/--branches push naming no protected branch when another earlier or later segment parses as ordinary Git and suppresses the broad push fallback (one pairing a protected branch name with a force, delete, mirror or sweep spelling in the same segment is caught by the raw-text backstop, including a spelling fragmented by quotes or a backslash under a command-word wrapper); protected branches under names other than main/master; remote-side or hosting-provider actions; persisted repository/worktree/global/system configuration and includes; command-local remote.<name>.push refspecs; GIT_CONFIG_* protocols from the session environment (a command whose text names GIT_CONFIG_PARAMETERS, GIT_CONFIG_COUNT or GIT_CONFIG_KEY_ denies, above), including the explicit-refspec ambient-override gap; and upstream/triangular mappings that can diverge from the session-HEAD proxy. push.default selects refs rather than forcing or deleting by itself. The raw mirror-config fallback recognizes common quoted spellings but cannot model arbitrary option/key/value fragmentation or cross-mechanism precedence. The abbreviation match follows the recorded git 2.55 push option set: an abbreviation that a later git accepts because it drops or renames a push option is not matched until that recorded set is updated, and --tags and --follow-tags are not matched (they add tags and never update or delete a branch). Negated force/delete flags, standalone --force-if-includes, and dry-run force/delete can over-deny. Parse-error/raw fallback scans and the raw-text backstop can also over-match quoted prose or unrelated option values that share a segment with a push; the push fallback scans the RAW command text with NO heredoc stripping at all (stripping removes text, so any stripping defect can only hide a live push - an earlier stripper still erased a real force-push behind a stacked heredoc and behind a quoted-heredoc lookalike nested in quotes inside a command substitution), so force-push-shaped prose inside ANY heredoc body, quoted bodies included, can over-deny on this fallback path, including prose naming only a feature ref when the command is unparseable or wrapper-hidden; the backstop reads the heredoc body lines, quoted strings and comments inside a segment as text. When the shell reading is uncertain (any unquoted #, <<, ( or ), a lone { or } word, any backtick or $(, a line continuation the lexer reads differently once joined, or a form the lexer refuses), the broad fallback decides even beside an ordinary Git segment and reads the text both as written and with quotes, a $ before a quote, and backslashes removed, so a force, delete or mirror spelling anywhere in such a command denies, including a force-push to a feature branch inside a subshell, inside a { } brace group beside another Git command, beside a command substitution, or carrying a # inside a word: a disclosed over-denial in the safe direction. Push coverage is best-effort and is not widened by the commit certificates.

DEADLINE: main() gives this check 8 seconds (the 10-second hook timeout less 2), counted from before its payload read, and fails closed with exit 2 when it has not decided by then; on the worst shapes the hooks self-test times, up to 1 MB, its slowest call took about 1.01 s in-process on a 24-core host with Python 3.14.4 (one run on 2026-10-18, including the shapes whose comment reading depends on context), because the raw-text push backstop reads the whole command, one segment at a time, before the 65,536-character size cap of the commit reading denies a longer one. Those shapes now include two that were measured separately, on 2026-10-18: a run of quoted '-c' mirror options with no blank, and a run of adjacent '<(' or '>(' process substitutions, each before a force-push to a protected branch. While the backstop read the first with the single mirror-configuration regex, whose cost grew with the square of the run's length, one call of this check on it took 14.0 s of CPU time at 256 KB and reached no decision within the 60-second hang guard of the hooks self-test at 1 MB; with the linear probe that replaced that regex, it took at most 0.47 s of CPU time at 1 MB. On the second, which the backstop's segment split now walks in place instead of copying the rest of the command for each substitution, it took about 0.17 s of CPU time at 1 MB. Each figure was measured in-process on a 24-core host with Python 3.14.4. Interpreter start-up and a wait the interpreter cannot interrupt (a read from a hung mount, a long call into C code) fall outside that deadline, and whether the platform blocks a call whose hook it stops at its own timeout is unverified. Where SIGALRM, setitimer or the main thread is unavailable, or SIGALRM is blocked, the check runs with no deadline; cleanup that runs while the deadline unwinds is outside it.
'''

[[hook]]
id = "branch-root-guard"
rules = ["brnrot"]
platform = "claude-code"
event = "PreToolUse"
matcher = "Bash"
handler = "branch_root"
default = "block"
class = "c"
residue = "Lexical trigger over an open command grammar. NO-ASK posture: this guard never returns an ask; branch rooting is a hazard class, so read every ASK, fail-SAFE ASK, and routes-to-ASK below as a DENY-and-educate fail-safe (a confirmed orphan start and any creation form this guard cannot prove rooted both DENY, naming the reachable correct action; the authoritative CI branch-root gate judges the actual post-creation ancestry). A git command that defines a git alias for itself (a -c or --config-env key in the alias, include or includeIf section, or a GIT_CONFIG_PARAMETERS or GIT_CONFIG_KEY_n assignment naming one), its git word read wherever it stands in its segment (the command word, or a word behind a reserved word, a { group, !, time or a wrapper word; not inside the text of another word, such as an sh -c or eval body) runs a subcommand this guard cannot see, so it is a creation form this guard cannot classify and DENIES (on an unparseable command whenever its text names git and holds such a definition anywhere in its de-quoted words, past a here-string, an unquoted heredoc or a {fd} redirect the lexer stops at included; a -h or --help does not exempt it, since git runs the alias with the flag passed on to it, so git -c alias.c=VALUE c --help, which on git 2.53.0 only printed the alias, is refused too, a disclosed over-refusal), and so does every git command of a command whose text names GIT_CONFIG_PARAMETERS, GIT_CONFIG_COUNT or GIT_CONFIG_KEY_ anywhere (sought once every quote character, backslash, dollar sign and newline is removed, so a quoted, escaped or continued spelling counts, in any word, a here-string, a comment or an echo) and names git as a word anywhere, parsed or unparseable alike (git wherever it stands: behind a reserved word or a wrapper, or inside an eval or sh -c word), whatever form sets the variable and whatever its value, since a shell sets one in more ways than a reading of forms can list (on git 2.53.0 with bash 5.3 an export, declare -x, typeset -x or local -x word, a bare assignment or a readonly word to a variable already exported, and under set -a also a bare assignment, read, printf -v, a for loop variable, a default-value expansion or a nameref each defined an alias), so a mention that defines no alias (an echo, a comment, an unset, an unrelated value) counts too, a disclosed over-refusal, or that runs under a GIT_CONFIG_PARAMETERS or GIT_CONFIG_KEY_n naming one in the session environment the hook inherits, which counts as such a text does, git wherever it stands (not read: a variable name built at run time, such as an expansion after GIT_CONFIG_, a brace expansion or an escape decoded inside an ANSI-C quote, and a variable set outside the command text, in the startup files of the Bash tool shell or in a sourced file or a script the command runs). A definition counts however it is spelled: the lexer records how each word was spelled, and the rule is closed over the whole region after a git word through its subcommand word (every global option word, the value of any option and the word read as the subcommand), where a word that carries an unquoted parameter or command expansion (a dollar sign or backquote outside quotes, one bash reads literally included), which bash may split into several words such as a -c and a definition, or whose text came through an ANSI-C or locale quote (a dollar sign right before a quote character) defines a git alias whatever it decodes to, as does a word there holding an unquoted brace and a comma (bash expands it into several words), other than a -c or --config-env word and its value, and a -c value or a --config-env word whose key part (the text before its first =, or the whole word when it has none) is spelled through a parameter or command expansion, inside double quotes too, such a quote or a brace expansion; on an unparseable command the same rule reads the de-quoted words of each command, past a here-string, a heredoc or a {fd} redirect, where a quoted or escaped dollar sign, backquote or brace counts as an unquoted one would. On such a command a git region the lexer did not read denies, fail closed: where the partial lexer stops before the option region of a git command or inside it (a leading here-string, as in git <<<x -C DIR $X), that region is unread, scoped to a segment that runs git as its own command (its command word is git or a wrapper the guards resolve, never a git word another command merely carries); the text past where it stopped is read two ways, and a deny from either stands: a quote-aware re-lex of the text past each construct the reader can measure on the same text (the target word of a here-string, or the balanced parentheses of a process substitution with backslash escapes honoured), each recovered command read through its subcommand word, and the every-git-word reading, which walks the region of each git word in the raw text from the stop, denying where a region cannot be read to its subcommand word or holds a word built at run time. The re-lex alone decides only where its ground is proven: the construct measured with no backslash escape met, no git word inside the text of the measured construct itself (the body of a process substitution and the word of a here-string are run or expanded, so a git region there keeps the raw reading), the resume at a command separator, and every git word of the re-lexed text read as a word of a recovered command (one in a comment or a redirect target is not); there a git word the re-lex proves to be quoted text (an echoed git word past a stop, a pull-request or issue body naming git) allows, while a plain git word any command carries as a word of its own (under a wrapper the guards do not resolve, such as flock or ionice, included) is still walked and denies where its region runs open or holds a word built at run time. At every other point (an unquoted heredoc, a {fd} redirect or an unbalanced quote the reader cannot measure, a resume that is not at a separator, a measure that met a backslash escape, a git word inside the measured construct, one in text the re-lex gives no word for, or a git word beside a $ or backquote inside a re-lexed word) the every-git-word reading decides too, so a quoted or commented git word there still denies, a disclosed over-refusal; a literal region read in full keeps its decision either way. Disclosed over-refusal: a word naming git that is the last word read before such a construct and is its command word (git <<<x log) still denies, while a git word only an operand of the segment the lexer stopped inside (grep -c git <<<x) is not read as a git command, so it allows. Remaining residual of this reading: the every-git-word walk reads the region of a git word on the raw text, so from inside quoted, comment or here-document text it can only over-refuse, never allow a git command the re-lex read; a git command whose git word is itself built at run time (an expansion that expands to git) is outside both readings, as on a parsed command. A word reads as one word to bash only when no part of it can expand to several words: a double-quoted expansion of the positional list or of an array subscripted with @, in any parameter-expansion form, with or without an operator or substring, and an indirect expansion whose reference (a variable, an array element read through a subscript of its own, a positional parameter or $*) can hold a reference to such a list (a double-quoted $@, ${@:1}, ${A[@]}, ${A[@]:0}, ${!A[@]}, ${!R}, ${!A[0]}, ${!1} or ${!prefix@}), expands to one word per element, so it counts there as an unquoted expansion does. A word whose every expansion stands inside double quotes and expands to one word keeps the plain reading on a parsed command: behind a literal key, as another option value or as the subcommand it defines nothing. Disclosed over-refusal (the safe direction): an unquoted variable in a git option or subcommand position now denies (git -C $DIR log, git $SUB, git -c core.pager=$P log), as does one after any other word naming git (grep -r git $DIR) and a git command inside an unquoted backquote substitution whose closing backquote the lexer reads into its subcommand word; quoting the variable restores the plain reading. The deny reason names such a word as one the shell builds at run time, with the fix (quote the expansion, spell a -c key literally, write a list out, put a here-string after the subcommand word), and keeps the alias wording for an actual alias definition. A key that is literal in effect but spelled through an expansion or such a quote reads as an alias, and so does a brace word there that expands to no option. Not read: the git word itself, read by its decoded text alone (an unquoted expansion in it, or a brace word that is the git word, which bash can split into git and a definition), and a word in that region that bash builds by filename expansion (an unquoted star, question mark or opening bracket matching a file name such as -c) or by a brace sequence expression, which holds no comma, and a word whose every expansion stands inside double quotes and expands to one word, which keeps the plain reading by decision, so one that names an option such as -c at run time, before a literal definition, is not read as one. A branch created through a wrapper, an alias defined in a configuration file, a script, or shell indirection is not seen. When a later construct makes the whole command unparseable (a heredoc, a process substitution), the guard still PARTIAL-lexes and judges the creation recovered in the parseable prefix, so a proven orphan creation followed by an unsupported construct still DENIES (DENY outranks the parse error); only a creation lying ENTIRELY within the unparseable syntax stays unseen (the open-grammar residual). A '#' whose comment reading depends on context (the shared lexer's comment rule) is judged under both readings, a comment to the end of its line and word text, so a creation either reading reaches is judged; one the lexer cannot judge that way (more than four such '#', one in or right after a backquote substitution, or a reading that does not lex) stops the lexer before any text past it, so a command carrying one whose text (also with its backslash-newlines and then its quote characters and backslashes removed) names git and a branch-capable verb (checkout, switch, branch, worktree) DENIES fail-safe instead (an over-deny of such a command that creates no branch), and so does one whose text holds quoting that removal does not decode (an ANSI-C $'...' or locale $\"...\" quote, or a quote character or backslash next to a letter), whatever its words (an over-deny of every such command that creates no branch). Only creation forms are checked, so switching to an existing orphaned branch, continuing work on the current branch, or RENAMING a branch (-m/-M/--move, which reuses an existing branch's commits under a new name and so creates no new orphan-rootable ref) passes to the CI gate. It probes a creation's ancestry (and can DENY an orphaned start) ONLY for a CLEAN canonical creation: a create trigger (checkout -b/-B; switch -c/-C or --create/--force-create; a bare `git branch <name>`; a `git branch -c/-C/--copy` copy whose start is the SOURCE, an explicit <src> else the current HEAD; or `git worktree add -b/-B`), its operands, and NOTHING ELSE except a tiny allowlist of VALUELESS booleans (--quiet/--force, short q/f; git branch additionally exposes --verbose/-v, which checkout/switch/worktree do not). A confidently-recognized non-creation ACTION (git branch -d/-D/--delete, -m/-M/--move rename, -u/--set-upstream-to/--unset-upstream, --edit-description, --show-current) or a LISTING form (--list, -a/-r/--all/--remotes and the unambiguous listing letters) is ALLOWED. EVERY OTHER shape routes to a fail-SAFE ASK, never a silent allow of a possible creation and never a probe-based DENY of a non-creation: any value-taking option (--contains/--merged/--points-at/--recurse-submodules), any unknown option, any abbreviated (--cre, --orp, --tr) or negated form whose meaning is order- or version-dependent (--no-detach, `--list --no-list`, a clustered -l), any tracking/orphan/detach form (--track/-t/--orphan/--guess/--detach/-d), a copy combined with any non-clean option (git branch --format main -c ...), a bare `git worktree add <path> [<commit-ish>]` without -b, and any short cluster carrying a letter outside the clean/listing set. This MAXIMALLY-CONSERVATIVE posture (maintainer-approved 2026-09-02, after the simplify-to-ASK cap) trades precision for robustness: an exotic or option-laden git command earns an ASK rather than a precise allow or deny, and the authoritative CI branch-root gate judges the actual post-creation ancestry regardless. DISCLOSED residual: the classifier accepts any nonempty operand as a branch name, so a creation carrying a git-INVALID name (spaces, a `..`, a control character - forms git rejects with `check-ref-format` and creates nothing) can still receive a probe-based deny of that orphaned start; this is a safe-direction false-deny of a no-op command (re-issue with a valid name), and full git ref-name validation is out of this lexical classifier's scope (tracked as HYG-2). What it PROVES at creation time is only that the start point is ORPHANED (no merge base with origin/HEAD); a rooted-but-STALE or old start point (for example checkout -b x origin/HEAD~1) still has a merge base and PASSES this hook, and its staleness is caught only by the CI gate's configured --max-lag first-parent-lag threshold, not here. Replace refs are neutralized on the probe (GIT_NO_REPLACE_OBJECTS=1) so a grafted parent cannot make an orphan look rooted; the on-disk .git/info/grafts residual is out of scope (an accidental-case guardrail). A shallow clone cannot distinguish a missing merge base from unfetched history, so a merge-base miss in a shallow repository routes to ASK, never a deny; a FAILURE of the shallow-status probe itself (a non-zero