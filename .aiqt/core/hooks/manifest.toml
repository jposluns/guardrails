 (|| exit 0, || echo, ; true, a set +e, a conditional wrapper); for the note tier, a truncating stage that does not follow a pipe after the checker-shaped command; a plain "| grep PATTERN" filter or "| wc", which neither tier counts as a truncating sink (residual R4); a versioned interpreter name (python3.12 -m pytest | head), which neither tier reads as a checker, as on main; a script body inside sh -c or bash -c quotes or an eval/xargs indirection (one opaque token to the lexer; residual R1); a swallow separated from its checker by grouping parens (( pytest ) || true reads as adjacent to the paren, not the checker); pipefail state (under set -o pipefail a failing checker does make the pipeline fail, though not always with its own status, but the output is still cut and shell state is invisible here, so a piped checker still gets the note, or the deny in the deny tier); or any execution outside the Bash tool. A checker probe whose swallow is INTENTIONAL (a discovery run) and a non-gate command whose NAME merely looks checker-shaped (a test.sh that gates nothing) are accepted over-ASKS, the disclosed scoping cost of the heuristic; a gate-shaped command the lexicon does not name is the matching under-coverage, both stated rather than hidden. Two further safe-direction over-blocks are disclosed, both contrived and non-bypassing: a trailing --verify that cancels an earlier --no-verify (git models the pair as a boolean where the last wins, so git commit --no-verify --verify does NOT bypass hooks, yet this presence test is order-insensitive and DENIES it), and a clustered -h help flag (git commit -hn ..., where git prints help and does not commit, but the short scan reads the clustered n as the bypass and DENIES); re-issue without the contrived flag combination. On a shell parse error it fails SAFE with conservative raw probes (git plus a no-verify verb plus a --no-ver spelling DENIES; git commit or am plus a short -n cluster DENIES fail-safe too, since the raw string cannot bind the cluster to its subcommand and so reads it as the bypass, the safe direction; a checker keyword plus a raw "|| true", "|| :", "| head", or "| tail", or a head, tail or cut word beside a process substitution or here-string, ASKS; before that raw probe, the complete segments a partial lex recovers ahead of the unparseable construct are judged for the deny tier, so DENY outranks the parse error; the segment the lexer was still inside when it failed is dropped, since its unseen tokens could change it, so a sink in that segment, as in pytest | tail followed by an unbalanced quote, is not proof and keeps the raw-probe note: the parse-error residual of the deny tier; a recovered git segment, the one the lexer was still inside included, that runs under a git alias the command defines DENIES as on a parsed command, and so does an unparseable command whose text names one of those git configuration variables and git, or names git and holds a git alias definition anywhere in its de-quoted words (split at blanks and shell operators), past a here-string, an unquoted heredoc or a {fd} redirect the lexer stops at included, a definition spelling in any word counting, a disclosed over-refusal), which OVER-MATCH by design: prose naming the keywords, a --no-verbose, or an unrelated -n cluster can deny or ask an unparseable command that was safe - re-issue it parseable. The same parse-error fallback also reads each probe that can deny over de-quoted readings of the text (quote characters, backslashes and a $ before a quote removed, line continuations joined, and each ANSI-C quote with its escapes decoded), so a verification-hook bypass that the raw text hides behind quoting (a commit verb split by quote characters, a --no-verify split by a quoted dash or a line continuation, a -n assembled from quotes, or a --no-verify or commit spelled with ANSI-C hex, octal or Unicode escapes) DENIES as its plain spelling does. Quoting alone is no ground to deny there: an unparseable command whose quoted arguments spell no bypass in any reading (a quoted word in a here-string, quoted paths in process substitutions) keeps the raw-probe decision, and a bypass spelled so that no such reading assembles it (a variable, an alias) is the open-grammar residual; but a roster-verb git segment that carries a here-string or a process substitution DENIES through the closed literal grammar above, which refuses both, quoted message or not (git commit -m "fix bug" <<<x, git commit -m x <<<x, git commit -F <(echo "msg")), the stricter fail-closed reading. Behind a # whose comment reading depends on context (the shared lexer comment rule) that the lexer could not judge under both readings, the fallback is stricter and fail-closed BY CONSTRUCTION, with no spelling list for a new form to escape: text whose quoting the rough quote removal does not decode (an ANSI-C or locale quote, or a quote character or backslash next to a letter) DENIES; a head, tail, grep, egrep, fgrep or rg word in text holding a pipe DENIES, wherever each stands in it; text naming git with a subcommand that accepts --no-verify (commit, merge, push, pull, rebase, am) together with ANY dash-prefixed option token DENIES, because behind such a # nothing can bind an option to the grammar of its subcommand, so no dash-prefixed token can be proven harmless - a deliberate OVER-DENIAL, new with this rule and stated here: a harmless option there (git commit -m x behind that #) is denied too; put a blank before the # outside any grouping or substitution, or drop it. Remaining text holding a checker-shaped word (judged with the same name splitter and lexicon the readable checker heuristic uses, never a re-spelled probe, so a spelling the note tier marks is never quieter here and a non-ASCII letter separates name parts exactly as it does there) beside a pipe, process substitution or here-string allows-with-note. These stricter doubt tests run ONLY behind such an unjudged #: a parseable command and the failed-main-reading floor keep the decisions above, and the plain parse-error fallback keeps them with only the de-quoted bypass deny stated above added. Overlap with shipped controls is compatible, not duplicated: a git push --no-verify --force to a protected branch is denied by BOTH this control and protected-line-guard, a git commit --no-verify on a protected HEAD denies here while protected-line-guard asks (deny outranks at the platform), and no other shipped control covers --no-verify, "|| true", or a foreground truncating pipe on a non-diff command (the diff-source truncation reasoning governs diff producers only, and orch-truncation-guard, which is unchanged, denies only a background dispatch piped into head or tail in an orchestrated session). It is BEST-EFFORT: it targets the accidental case, not an adversary determined to evade it. DEADLINE: main() gives this check 8 seconds (the 10-second hook timeout less 2), counted from before its payload read, and fails closed with exit 2 when it has not decided by then; on the worst shapes the hooks self-test times, up to 1 MB, its slowest call took about 3.29 s in-process on a 24-core host with Python 3.14.4 (one run on 2026-10-18, including the shapes whose comment reading depends on context). Interpreter start-up and a wait the interpreter cannot interrupt (a read from a hung mount, a long call into C code) fall outside that deadline, and whether the platform blocks a call whose hook it stops at its own timeout is unverified. Where SIGALRM, setitimer or the main thread is unavailable, or SIGALRM is blocked, the check runs with no deadline; cleanup that runs while the deadline unwinds is outside it.'

[[hook]]
id = "commit-msg-subst"
rules = ["sectvl"]  # security / tool-argument-validation
platform = "claude-code"
event = "PreToolUse"
matcher = "Bash"
handler = "commit_msg_subst"
default = "block"
class = "b"
residue = "A BEST-EFFORT QUOTE-AWARE LEXICAL check via the shared tokenizer (_lex_command); it is DENY-and-educate (NO-ASK posture: this guard never returns an ask; read every ASK/ASKS/over-ASK below as that DENY-and-educate outcome, which NAMES the safe rewrite), so a detected substitution is denied with the reachable correct action rather than silently allowed, and it makes NO soundness or universal-coverage claim. In a parsed simple segment it resolves the effective command word past leading shell assignments and the recognized command modifiers command, exec, builtin, nohup, time, !, and env; for env it skips leading option tokens, the separated operands of common value-taking options, and NAME=VALUE assignments. When that word is literal git and the subcommand after recognized Git-global options is literal commit, it scans EVERY argv token after commit, including tokens after `--` or `--end-of-options`, for a backtick or $( marker in a substituting double-quoted or unquoted context, using the shared lexer's parallel per-token opacity plus the narrow unquoted-$( split form where a final opaque token ending in $ is immediately followed by the ( operator. It deliberately does no Git option binding because the shell expands argv before Git parses it. On an unparseable command, the raw fallback DENIES when a substitution-marker probe matches together with a coarse git-commit probe or a git alias the command defines (a git segment a partial lex recovers that defines one for itself or runs under one from the session environment, a text naming one of the git configuration variables below and git, or a text naming git that holds a definition anywhere in its de-quoted words, past a here-string, an unquoted heredoc or a {fd} redirect the lexer stops at included); that fallback can over-match quoted prose or literal markers. HONEST RESIDUALS: the option tokens belonging to a recognized command modifier are not skipped (for example command -p git commit, time -p git commit, exec -c git commit, exec -a x git commit, and nohup -- git commit), so resolution advances one word past the modifier, stops on the option, and silently ALLOWs a substitution-bearing commit; command modifiers outside the recognized set (notably sudo, nice, timeout, doas, stdbuf, and ionice) are not resolved, so for example sudo git commit -m \"$(x)\" silently ALLOWs; reserved-word compounds (if/while/until and `{ ...; }`) are not parsed through to their inner git command, except under the git configuration variable reading below, which reads every segment naming git; shell functions and aliases that rename git; git-config subcommand aliases defined in a configuration file (for example alias.ci=commit making git ci -m \"$(x)\") cannot be known lexically and silently ALLOW, while a git command that defines a git alias for itself (a -c or --config-env key in the alias, include or includeIf section, or a GIT_CONFIG_PARAMETERS or GIT_CONFIG_KEY_n assignment naming one), its git word read wherever it stands in its segment (the command word, or a word behind a reserved word, a { group, !, time or a wrapper word; not inside the text of another word, such as an sh -c or eval body) has its arguments read as a commit's, and so does every git command of a command whose text names GIT_CONFIG_PARAMETERS, GIT_CONFIG_COUNT or GIT_CONFIG_KEY_ anywhere (sought once every quote character, backslash, dollar sign and newline is removed, so a quoted, escaped or continued spelling counts, in any word, a here-string, a comment or an echo), a git command there being any segment with a word that names git as a word wherever it stands (behind a reserved word or a wrapper, or inside an eval or sh -c word), every word from that word on read as a commit argument, whatever form sets the variable and whatever its value, since a shell sets one in more ways than a reading of forms can list (on git 2.53.0 with bash 5.3 an export, declare -x, typeset -x or local -x word, a bare assignment or a readonly word to a variable already exported, and under set -a also a bare assignment, read, printf -v, a for loop variable, a default-value expansion or a nameref each defined an alias), so a mention that defines no alias (an echo, a comment, an unset, an unrelated value) counts too, a disclosed over-refusal, or that runs under a GIT_CONFIG_PARAMETERS or GIT_CONFIG_KEY_n naming one in the session environment the hook inherits, which counts as such a text does, git wherever it stands (not read: a variable name built at run time, such as an expansion after GIT_CONFIG_, a brace expansion or an escape decoded inside an ANSI-C quote, and a variable set outside the command text, in the startup files of the Bash tool shell or in a sourced file or a script the command runs); sh -c or bash -c script bodies; eval or xargs indirection; redirect targets on a recognized commit segment are removed from argv by the lexer and are not scanned, so git commit -m ok > \"$(x)\" and git commit -m ok 2> \"`x`\" silently ALLOW; leading environment-assignment values and Git-global option/value tokens before commit; a pre-subcommand unquoted $( that fragments the lexer segment, letting the whole commit invocation including its message escape inspection; quote-mangled command words such as g''it are outside the claimed command-resolution surface even where the shared lexer happens to normalize a form to git; $VAR indirection, concatenation, PATH-shadowed commands, and any other non-literal command word that does not resolve lexically to git; commands outside the Bash tool; and unparseable commands beyond the raw fallback probes. Deliberate over-ASKs: $((...)) includes $(; a bare $ immediately before an escaped parenthesis (for example git commit -m $\\(x\\)) is marked opaque and the decoded-marker check sees $(, so it ASKS even though Bash passes literal $(x) and runs no substitution; ANSI-C $'...' is treated as an opaque marker-bearing token even though Bash does not substitute inside it; whole-token opacity means an escaped literal backtick or $( sharing a word with an unrelated unquoted expansion or glob prompts; and a post-boundary pathspec produced by substitution (for example git commit -- $(ls)) prompts because the shell still executes it. It targets the accidental case, not an adversary. DEADLINE: main() gives this check 8 seconds (the 10-second hook timeout less 2), counted from before its payload read, and fails closed with exit 2 when it has not decided by then; on the worst shapes the hooks self-test times, up to 1 MB, its slowest call took about 0.35 s in-process on a 24-core host with Python 3.14.4 (one run on 2026-10-18, including the shapes whose comment reading depends on context). Interpreter start-up and a wait the interpreter cannot interrupt (a read from a hung mount, a long call into C code) fall outside that deadline, and whether the platform blocks a call whose hook it stops at its own timeout is unverified. Where SIGALRM, setitimer or the main thread is unavailable, or SIGALRM is blocked, the check runs with no deadline; cleanup that runs while the deadline unwinds is outside it."

[[hook]]
id = "secrets-shift-left"
rules = ["secsec"]  # confidentiality / keep-secrets-out (the shift-left write-time layer)
platform = "claude-code"
event = "PreToolUse"
matcher = "Write|Edit|MultiEdit|Bash"
handler = "secrets_shift_left"
default = "block"
class = "c"
residue = 'A COMPENSATING control, not a replacement: the CI secret-scan and gitleaks gates remain the broader backstop, and this layer moves the same high-signal detection to the moment a secret would be written, so an accidental paste is caught before it lands on disk rather than only at commit or CI time. It SINGLE-SOURCES its shapes from tools/check_secrets.py (the pack source of truth), rendered into the handler by tools/gen_secret_patterns.py and drift-gated so the two can never fork: the recognizable provider-token PREFIX shapes (GitHub, GitHub fine-grained PAT, OpenAI-style, OpenAI project key, Anthropic, AWS access key id, Slack, Slack app-level token, a private key block header, a JWT, and (GD-121) Google API key, Stripe live and test, GitLab personal access token, SendGrid, npm, PyPI upload token, and a Slack incoming-webhook URL), the credential-named ASSIGN shape (a passwd/password/secret/token/api-key/access-key/client-secret/auth-token/private-key/credential variable assigned a literal of real length), and (GD-121) an ENTROPY-GATED generic-assignment shape: a token of 40 or more characters (Shannon entropy at least 3.5 bits per character judged on its first 150 characters, letters and digits required) assigned to a generic credential-like name matched on EXACT components (key/auth/token/secret/passphrase/creds/... so apiKey and client-secret match while monkey and author do not), with placeholders and environment lookups excluded before the entropy test and a metadata-named left-hand side (id/name/version/url/path/public/...) excluded. It EXCLUDES obvious placeholders (the shared PLACEHOLDER shape: your/my/the-prefixed names, change-me, example, sample, dummy, redacted, fake, test, todo, none, null, n/a, an angle-bracket or dollar-brace or dollar-VAR template, and runs of x/dot/star), and for an UNQUOTED assignment value it additionally requires both a letter and a digit, exactly as check_secrets.py does, so ordinary prose does not trip it. It scans the content a Write would write, the new_string an Edit would introduce, the concatenation of the new_string values a MultiEdit would introduce across its edits, or the command string a Bash call would emit, and DENIES on a real match, naming only the pattern label and never echoing the secret value. DISCLOSED non-catches: a KEYWORD-FREE high-entropy value (an opaque = <hex> with no credential keyword near it): both this scanner and gitleaks miss it (R1, the measured residue of 2026-08-08); a generic-keyword value of 12 to 39 characters, below the local 40-character floor, which gitleaks can still flag (R3, a deliberate noise-control choice confirmed against pinned gitleaks 8.30.1); a real secret held under a metadata-named variable such as public_key or key_path, excluded here in the safe direction where the CI scan still catches it (R4); a secret written by a tool other than Write, Edit, MultiEdit, or Bash (other content tools such as NotebookEdit are out of scope, routed to a periodic pattern review); a secret split across tokens or lines or assembled by concatenation, since the scan is per-line and lexical; on the Bash path the command string is scanned as RAW TEXT (it is not shlex-tokenized and is not executed), so a secret assembled by concatenation or supplied through a shell variable or expansion is missed, but a redirect or an embedded # does NOT cause a Bash-path miss; the ASSIGN shape also does not match a JSON-style quoted credential key ("api_key": "...") or a triple-quoted value, a curated-pattern-set format-completeness gap routed to the periodic pattern review (backlog L12); a deferred provider family (a Twilio-class short-prefix-over-hex or a Telegram bot token, left to gitleaks, R2); an unquoted value beginning with an environment-lookup root such as process.env., treated as a reference not a literal (R6); and a base64-encoded or otherwise obfuscated form. gitleaks in CI is a BROADER independent scanner and a stronger net, but it is NOT exhaustive (it too misses the keyword-free entropy class R1), so it is a compensating layer, never a guarantee. It is BEST-EFFORT: it targets the accidental paste or commit, not an adversary deliberately encoding or fragmenting a secret to evade it. DEADLINE: main() gives this check 8 seconds (the 10-second hook timeout less 2), counted from before its payload read, and fails closed with exit 2 when it has not decided by then; on the worst shapes the hooks self-test times, up to 1 MB, its slowest call took about 0.29 s in-process on a 24-core host with Python 3.14.4 (one run on 2026-10-18, including the shapes whose comment reading depends on context). Interpreter start-up and a wait the interpreter cannot interrupt (a read from a hung mount, a long call into C code) fall outside that deadline, and whether the platform blocks a call whose hook it stops at its own timeout is unverified. Where SIGALRM, setitimer or the main thread is unavailable, or SIGALRM is blocked, the check runs with no deadline; cleanup that runs while the deadline unwinds is outside it.'

[[hook]]
id = "gensrc-edit-guard"
rules = ["gensrc"]  # integ / generated-artefact-source-only
platform = "claude-code"
event = "PreToolUse"
matcher = "Write|Edit|MultiEdit"
handler = "gensrc_guard"
default = "block"
class = "c"
residue = 'A REGISTRY-DRIVEN path guard, not a content judge: it fires only when the Write/Edit/MultiEdit file_path resolves onto a kind=file or kind=tree entry of the per-repo .aiqt/gensrc.json, read at decision time. Coverage is exactly the registry: an unregistered generated artefact is not judged (the gensrc-registry drift gate is the backstop for a stale registry), and a repo with NO registry gets no coverage at all (an ABSENT registry is the inert ALLOW by design; adopters author their own). kind=block entries are EXCLUDED by design: a mixed file carrying a generated block (CLAUDE.md, site/roadmap.html) is allowed whole, because a path guard cannot see which lines an edit touches; the block drift gates backstop those. Bash is EXCLUDED by design: regeneration itself runs through Bash (python3 tools/gen_*.py), so a hand-edit routed through Bash (sed -i, a redirect, a heredoc) is not caught; the drift gates remain the real gate. A Write, Edit or MultiEdit to a sibling settings file such as .claude/settings.local.json is not judged by this guard either (no generator writes it, so no registry entry names it; that it holds only personal settings is a convention, not enforced), yet it can change hook behaviour for later sessions; the settings precedence Claude Code gives that file is not verified by this pack. Other file-writing tools (NotebookEdit) are out of scope. The decision on a CONFIRMED registry match is a DENY-and-educate that names the source to edit and the regenerate command (NO-ASK posture: this guard never returns an ask; read every ASK below accordingly). A PRESENT registry that cannot be read is also a DENY (fail-closed, below); the other cannot-evaluate branches ALLOW with an informational note rather than block a legitimate edit; where the drift gate is configured a hand-edit fails it until source and derivative reconcile. Among registry states, only a genuinely ABSENT registry (no entry at .aiqt/gensrc.json), or a readable one holding no file or tree entry (or, in a tree without the authoring marker, none but authoring-scoped ones), allows silently whatever the target. A PRESENT registry that cannot be read DENIES fail-closed and names the repair (regenerate or repair .aiqt/gensrc.json through Bash, which this guard does not judge): a registry that is not a regular file (a symlink, FIFO, directory, ...; rejected by an lstat/S_ISREG probe before the open, which reads a STATIONARY non-regular registry as bad and does not block on a FIFO - a best-effort defence against the accidental case, with a registry concurrently SWAPPED to another type in the lstat-to-open window a disclosed residual, sibling to the hard-link and case/NFC-NFD aliases below), a registry that disappears in that same window (a delete race, which fails safe to DENY rather than reading as absent), an unreadable, non-UTF-8, oversized (over 1,000,000 bytes) or malformed registry, an unknown or non-integer registry version, and a malformed entry (including a control character in any entry target, or a scope other than authoring, a kind=block entry included). An entry scoped authoring (tools/gen_gensrc.py marks the tools/gen_hooks.py AUTHORING_ONLY_REL targets, so the shipped registry scopes .claude/settings.json) is honoured only in the pack authoring tree. On its match the guard lstats .aiqt/authoring.toml at the repo root: an ABSENT marker (every adopter tree) skips that entry silently, so an adopter keeps its own .claude/settings.json, and matching goes on with the other entries; a regular file holding exactly format-version = 1 (the integer, never true) and role = "pack-authoring-repository" honours it with the DENY above; any other PRESENT marker (other content, unparseable or non-UTF-8 TOML, a symlink, FIFO or directory, an unreadable file, a file over 1,000,000 bytes, or one gone between the lstat and the open) DENIES fail-closed and names the marker repair, as tools/gen_hooks.py exits 2 on it (the two apply the same size bound). The marker is read only on an authoring-scoped match, so a damaged marker blocks no other edit; a marker swapped to another type in that window is the same disclosed residual as the registry. The field keeps registry version 1: a guard older than it tolerates scope as an unknown key and so honours the entry in every tree, denying an adopter edit of its own .claude/settings.json until that adopter runs this guard. These cannot-evaluate branches ALLOW WITH AN INFORMATIONAL NOTE: an unresolvable repo root (a missing session cwd, or a cwd outside any git work tree, so a non-git session allows-with-a-note on in-scope calls), a target that canonicalizes outside the resolved repo or a containment check that cannot be cleared (it cannot be judged against the registry of this repo), an unresolvable target path or registry entry, a non-object tool_input or a missing or unreadable file_path, and an unreadable or malformed (empty/list/bool) tool_name or a control character in the file_path. Besides a confirmed registry match, a present-but-unreadable registry and a present-but-malformed authoring marker on an authoring-scoped match, only a MISSING tool_name denies (the shared fail-closed contract), and a registration on any event other than PreToolUse hard-blocks (exit 2). Matching is on canonicalized real paths with component-boundary tree containment, never a raw string prefix, so gen-extra/ never matches gen/ and GEN.md.bak never matches GEN.md; a hard link, a case-insensitive-filesystem alias, or a macOS NFC/NFD Unicode-normalization alias that defeats realpath equality is a disclosed residual. The repo root is the git toplevel of the SESSION cwd via the scrubbed rev-parse primitive (every ambient GIT_* removed), so an ambient decoy repo cannot redirect the registry read; in a linked worktree or a submodule the toplevel is that worktree or submodule, so a registry governs exactly the tree it sits in. In this repository the control is registered for project sessions by the generated .claude/settings.json (tools/gen_hooks.py); a session that loads neither that file nor the plugin is not guarded. DEADLINE: main() gives this check 8 seconds (the 10-second hook timeout less 2), counted from before its payload read, and fails closed with exit 2 when it has not decided by then; on the worst shapes the hooks self-test times, up to 1 MB, its slowest call took about 0.06 s in-process on a 24-core host with Python 3.14.4 (2026-10-15). Interpreter start-up and a wait the interpreter cannot interrupt (a read from a hung mount, a long call into C code) fall outside that deadline, and whether the platform blocks a call whose hook it stops at its own timeout is unverified. Where SIGALRM, setitimer or the main thread is unavailable, or SIGALRM is blocked, the check runs with no deadline; cleanup that runs while the deadline unwinds is outside it. A derivation that writes back to a source original, or in-place derivation work outside its copy area, is not judged, because the guard matches only registered generated targets; that obligation is prose-only.'

[[hook]]
id = "write-scope"
rules = ["septsk", "wowo01", "exetgt"]  # integ / separate-task-changes + workers-produce-inert-data; quali / confirm-execution-target (the other-repo denial is its mechanical form for writes)
platform = "claude-code"
event = "PreToolUse"
matcher = "Write|Edit|MultiEdit"
handler = "write_scope_guard"
default = "block"
class = "c"
residue = 'A PATH guard, not a content judge: it decides where a write lands, never what it writes. Covers only PreToolUse Write, Edit, and MultiEdit calls carrying a readable file_path. TWO arming inputs, each fail-open on genuine ABSENCE only: the per-slice declaration write-scope.json, read at the orchestration registry-declared state_dir (resolved from the registry the guard reads EXACTLY ONCE, via the pure _state_dir_from_registry helper, never a second independently-faulting read; out of the slice tree by default but MAY be in-tree when the registry declares an in-tree state_dir), arms SLICE CONFINEMENT; the in-tree committed frozen floor .aiqt/frozen.json (generated by tools/gen_manifest.py from the ownership classification, drift-gated) arms the FROZEN layer. The structural other-repo/nested-repo denial applies to every covered write whose repository root resolves; the frozen-floor denial fires whenever a floor is PRESENT, and an armed session additionally requires one, so neither is unconditionally always-on and only an un-armed session with a genuinely-absent floor leaves the frozen layer inert. Slice confinement is fail-open on a missing declaration. The principled fail-open is genuine ABSENCE (of a declaration or floor: no confinement in effect, the same inert boundary gensrc and, by default, the orchestration suite use, whose truncation guard denies an absent registry in the opt-in registry-required mode); a cannot-evaluate FAULT is not absence and denies (see the fail posture below). The registry that LOCATES the declaration is part of the read: a bad or unreadable registry (an lstat fault, a read/parse error, a non-version-1 object, or a present-but-malformed state_dir) is a cannot-evaluate that DENIES rather than silently falling back to XDG and disarming confinement. Out-of-scope is a DENY, never an ASK (an ASK would hand the confined actor the click-through on its own confinement and would wedge an unattended run); the remedy is the harness re-declaring the slice, so scope-widening stays on the harness side, never a guarded-tool call. The declaration is machine-set inert data, never authored by the assistant through a guarded tool; the residual Bash-write path to the state dir remains, so the harness-set integrity is defence in depth, not categorical. Fail posture, by regime: a MISSING tool_name denies (the shared fail-closed contract); a malformed tool_name, an unreadable tool_input, a missing/empty file_path, or a control-character file_path denies as a malformed call in either regime; a covered write whose session repository root cannot be resolved (a missing/unreadable cwd or a non-git session) DENIES fail-closed in both regimes, because the root is resolved FIRST and containment cannot be evaluated without it, so this denial precedes any relative-path handling (a non-git relative-path write DENIES, it does not defer); only WHEN the root resolves does an un-armed relative file_path defer to the sibling absolute_paths hook (which owns the relative case, EN-8 making no cwd-trusting determination) and allow, while an armed relative file_path denies; an un-armed realpath/containment/nested-repo-probe FAULT now DENIES too (a cannot-evaluate: the guard cannot prove the target is in-repo and not nested, so it denies rather than allowing an unverified write), as the same fault does armed; a target proven OUTSIDE the session toplevel, or in a NESTED or FOREIGN git repository under or beside it (resolved via the scrubbed git toplevel of the target nearest existing ancestor, every ambient GIT_* removed so a decoy repo cannot redirect the read), denies in BOTH regimes UNLESS the target repo is an adopter-DECLARED COMPANION STORE (the sanctioned cross-repo path below); a present frozen floor with the target on it denies in both regimes (the floor outranks the allowlist, deny over allow), a present-but-malformed floor denies (cannot-evaluate), and an ABSENT floor is inert un-armed but denies while armed (an armed session must commit a floor, an explicit empty list being valid, so a Bash-deleted floor cannot silently downgrade an armed session); armed, a declaration that is unreadable, malformed, unknown-version, or whose worktree_root does not resolve to this repo (a stale, copied, or moved declaration) denies; an allow entry wholly on the frozen floor makes the declaration malformed and denies (a declaration cannot declare past the floor); a target in repo, not frozen, and in the declared slice scope allows silently, while one not in scope denies. Every deny appends a guard-events row (the over-fire metric) where the root is resolvable (with no resolvable root no row is attempted); a failed append leaves no row and adds a short recording-failure warning to the deny reason and the banner, never blocking or altering the denial. Matching is on canonicalized real paths with component-boundary tree containment (the gensrc idiom), never a raw string prefix; the declaration and floor share one entry grammar (a repo-root-relative POSIX path, a trailing / marks a tree, no absolute/backslash/./../control-char/wildcard component). The floor is enforced against the manifest CLASS set {derived, manifest-self, archive}. The RUNTIME value of that floor is un-lowerable by the constrained actor through the guarded tools (a guarded write to .aiqt/frozen.json is itself on the floor and denied); but its DEFINITION (FROZEN_CLASSES in tools/gen_manifest.py) is generator source that lands through pull-request review PLUS the drift gate, which detects an INCONSISTENT floor (a committed frozen.json that does not match a fresh regeneration), NOT an unauthorized-but-internally-consistent redefinition of the class set followed by regeneration; an independent floor-authorization mechanism is out of scope for this hook. The floor proves membership in its declared selector set only, not that the generation-time class mapping is semantically complete. Class c (partial), matching the sibling gensrc_guard: the control fires deterministically inside its Write|Edit|MultiEdit matcher, but the rules it enforces span write paths the matcher cannot see (Bash-mediated writes, NotebookEdit, filesystem MCP tools, any write outside the platform hook path), and its slice-arming state is machine-local, so CI cannot observe the confinement. The committed frozen floor .aiqt/frozen.json is a generated, drift-gated output backstopped at merge by the manifest-gen-drift gate (tools/gen_manifest.py --check), the gensrc-registry-drift gate (tools/gen_gensrc.py --check), and the independent manifest-integrity verifier (tools/check_manifest.py) (defence in depth, each catching the other residual; these CI gates are not removed or softened), but nothing backstops an uncommitted, out-of-scope-mutable, or cross-repository write through the uncovered channels. Realpath closes symlink escapes present at check time but not a post-check swap, hard-link alias, bind-mount change, or case-fold/Unicode alias between the lstat probe and the tool write (TOCTOU); an OS-level write sandbox is the stronger overlapping control where available. It is single-author by design: exactly one declaration, one writer, harness-replaced; it is confinement of the sole writer, not parallel-write collision arbitration. SANCTIONED COMPANION-STORE declaration (adopter-controlled config): the orchestration registry MAY declare companion_stores, a list of ABSOLUTE paths to git repo TOPLEVELS beside the session repo (for example the durable store the sole orchestrator owns, which is by design a SECOND git repo next to the code repo). A covered write whose target resolves - by EXACT repo-root match, the resolved git toplevel of the target EQUALLING a declared store root, never a prefix/substring - into a DECLARED companion store is ALLOWED and AUDITED (a guard-event row, kind wrtscp, decision allow, naming the declared store; where that append fails the write is still allowed, with a note saying the row could not be written) rather than denied, so the single most routine legitimate cross-repo write no longer inverts to deny-the-audited-path while the Bash residual stays open. The hook only HONOURS a validly-declared store, it never self-widens: per guard-input-soundness a declaration is honoured only if it is a non-empty absolute string resolving to a REAL git toplevel that IS the declared root itself; a MALFORMED, unresolvable, non-repo, or non-root declaration is fail-closed (silently dropped, the cross-repo write still DENIES), a bad entry can only remove a would-be allow and never open a hole, and the exact-root match means a write into a repo NESTED inside a declared store, or a sibling merely beside it, does NOT match. Declaring a store never defeats the frozen-floor or the nested-in-session denials. Declaring a companion store is a GUARDRAIL-CONFIGURATION change: companion_stores widens where covered writes may land (a cross-repo scope widening), so it is under the SAME human-authorization discipline as any other scope widening (guardrail-config-integrity) - the harness/adopter sets it, never the constrained actor. For that reason the orchestration LOCAL registry (.aiqt/orchestration.local.json) is on the hook-side ALWAYS-FROZEN set: a covered Write/Edit/MultiEdit to it is DENIED in BOTH regimes and INDEPENDENT of the committed frozen floor, so the actor cannot self-declare a companion_stores widening through a guarded tool (the general Bash-write path stays the disclosed residual). The companion_stores declaration is honoured only inside a VERSION-1 registry OBJECT: a registry with a missing or non-1 version reads as bad (a cannot-evaluate), so a declaration lacking "version": 1 yields NO stores and the cross-repo write FAILS CLOSED (denies), never silently taking effect. The declaration lives in the adopter/harness registry surface (exactly as state_dir does); this path guard reads it, it does not police who wrote the registry. DEADLINE: main() gives this check 8 seconds (the 10-second hook timeout less 2), counted from before its payload read, and fails closed with exit 2 when it has not decided by then; on the worst shapes the hooks self-test times, up to 1 MB, its slowest call took about 0.03 s in-process on a 24-core host with Python 3.14.4 (one run on 2026-10-18, including the shapes whose comment reading depends on context). Interpreter start-up and a wait the interpreter cannot interrupt (a read from a hung mount, a long call into C code) fall outside that deadline, and whether the platform blocks a call whose hook it stops at its own timeout is unverified. Where SIGALRM, setitimer or the main thread is unavailable, or SIGALRM is blocked, the check runs with no deadline; cleanup that runs while the deadline unwinds is outside it.'

[[hook]]
id = "orch-stop-guard"
rules = ["setcmp", "cntdef", "trkasy", "cnclse"]  # completeness-claim + continue-by-default + track-launched-work + lease scope
platform = "claude-code"
event = "Stop"
handler = "orch_stop_guard"
default = "block"
class = "b"
residue = "REGISTRY-SCOPED: entirely inert unless an orchestration registry (.aiqt/orchestration.local.json or .aiqt/orchestration.json) is present at the session cwd's git-resolved toplevel (no ancestor walk, unlike orch-truncation-guard; AIQT_ORCH_REQUIRE_REGISTRY is not read here) AND a declared orchestrator lease or mode record is live, so plain Q&A sessions and bounded workers never inherit the global backlog. FAIL-OPEN on its own I/O errors, none of which wedges the session: an unresolvable cwd, or an inactive or unreadable lease with no mode record read as declared, SILENTLY ALLOWS the stop (no warn banner, no guard-event); a DECLARED lease max_age_hours that is not usable (a boolean, zero, negative, NaN, infinite or a non-number) on an otherwise-live lease is a scope cannot-evaluate that DENIES through the same cannot-evaluate path as an unreadable item proof, never a silent guards-off (the loop bound and the operator escape release, a live mode record outranks it, and a session the lease does not name stays a non-holder; a CHANGE for adopters: the scope check previously read zero, a negative number, a non-number such as a string, false or NaN as no horizon, true as a one-hour horizon and infinity as a horizon never reached, so such a registry now denies the stop until the value is corrected to a positive finite number of hours), while a mode record the mode reader fails closed on counts as declared, so scope is live: one that cannot be opened (a socket included) or read, one that is not a regular file, one over its size bound, one whose bytes are not valid UTF-8, one at a path holding a NUL or not strict UTF-8, and one read as text whose declaration or JSON marker is malformed or unrecognized (an empty or unrecognized Operating-mode: value, or a JSON-shaped marker that does not parse or is not exactly a single string mode key); an unreadable registry ALLOWS with a warn banner but no guard-event; and a turn-state.json that cannot be read or does not hold a JSON object, or a stop_denials value in it that validation rejects (anything but a JSON integer from 0 to 9999, so a float such as 1.0, a boolean or a string), in a state directory the hook can search takes the bounded loop-bound exit, while a state directory the hook cannot search (owner modes 0000, 0200, 0400 and 0600; this and every other owner-mode list in this residue hold for a hook that runs without root as the state directory's owner and holds neither CAP_DAC_OVERRIDE, which searches and writes the directory in every mode, nor CAP_DAC_READ_SEARCH, which searches it and reads turn-state.json in every mode, with the state directory on a filesystem mounted read-write and not marked immutable, since a read-only mount or an immutable directory fails every save) reads as a fresh turn-state, so a count already at the bound is not seen there and the stop is judged afresh (a deny there then allows with findings, because its denial counter cannot be saved). A deny whose denial counter cannot be saved fails open with findings. The save needs a state directory the hook can write and search, and read where the platform lacks O_PATH: opening the directory needs read permission on it only without O_PATH; after that open, the stat of turn-state.json, the creation of the save's temporary file, the replacement and, after a failed step, the removal of that temporary file each look a name up in it and so need search permission (the fchmod, write and fsync on the temporary file's descriptor look no name up), and the creation, the replacement and that removal also write to it (a temporary file left by a hook process killed mid-save stays, since no later save removes it). So of the eight owner modes of the state directory, a stop the decision core denies is blocked only in 0300 and 0700 with O_PATH and only in 0700 without it, and allows with findings in every other mode, a writable turn-state.json in a state directory the hook cannot write included (the earlier in-place overwrite let that deny stand). But (FIX 1) an enumerator error or timeout, and any cannot-evaluate (an unreadable proof source), FAIL CLOSED-CONTINUE: the stop is DENIED (ignorance refuses the wind-down), releasable by the operator-owned escape sentinel and never a clean close, bounded by the guard-owned loop bound past which it becomes a deliberate, recorded forced exit. Each deny appends a guard-events row; a failed append leaves no row and adds a short recording-failure warning to the block reason (exit 2 carries no banner) while the deny stands. The row of an ALLOW released by the operator escape is the only record that the override was used, so a failed append there adds a warning to the banner while the ALLOW stands; the row of a clean ALLOW with no escape is the over-fire metric only and best effort, a failed append there not reported. The deny is BOUNDED by two separate triggers, either of which ALLOWS WITH FINDINGS. The first is the guard-owned counter: stop_denials in turn-state.json, which the guard raises by one with each saved deny and which genuine human input resets, allows at most two saved denies per epoch, and works only where the state directory lets the hook read and save it (above). The second is the platform's own loop signal: the Claude Code hooks reference documents a stop_hook_active field in the Stop input, true when Claude Code is already continuing as a result of a stop hook, and a Stop whose payload carries it as the JSON value true takes the same exit whatever the count (a string value is not the signal); the guard only reads this field from the payload and never saves it, so it relieves whatever the mode of the state directory. The operator escape sentinel yields the clean ALLOW only when it passes enforced acceptance: a regular file (never a symlink), owned by a uid other than the guard's effective uid, and not group- or other-writable; a present sentinel failing any condition is IGNORED with the decision unchanged, recorded to guard-events and escape-spoof.json (a failed write is warned about in the hook's banner, or in the block reason of a denied stop, which has no banner; the warning asks for a manual record), and normally raised once by the next resume audit (again while its rename fails; a later sentinel recorded before that audit overwrites escape-spoof.json, leaving the earlier one only its guard-events row, where that append succeeded). Uid inequality proves not-self, never operator identity; on a shared-uid host no file either party can create passes, so the clean-ALLOW channel is unavailable there (recovery: a differently-owned sentinel such as a root-owned one, operator registry or mode maintenance, or the bounded marked exit; split-uid deployment is the recommended posture). The platform interrupt is a second, structurally unguardable escape, left uncovered on purpose. Blocker proofs are validated against their declared sources (the dispatch ledger, the pending-decisions surface, evidence freshness, the clock), but that whole substantiation surface (the backlog state/granted fields, a pending-decision row, the dispatch ledger, a not-before value, and free-text external evidence) is largely ACTOR-AUTHORABLE: the guard raises the bar (it rejects an unknown blocker kind and requires a substantiating record in the declared authoritative source) yet cannot categorically enforce that a block is granted by an authority other than the assistant, closed categorically only by operator-owned, assistant-non-writable records at the OS layer (SYSTEM-HARDENING.md entry 2). Plausibly FABRICATED external evidence in particular is not mechanically closable at this layer where no attestation register is declared; where one is declared, an external or foreign-lease blocker classifies blocked only when its ref is covered by a fresh validated attestation whose snapshot is re-anchored to the register authority and whose refs are re-derived from the register content at yield, so a swapped register or a fabricated-refs snapshot substantiates nothing; this raises the bar over free-text evidence but is not categorically forgery-proof, since the register is a separately-declared surface and filesystem write to it, wherever it is declared, forges an attestation by appending a valid approved row (uncommitted; the git or anchor authority checks only the committed or anchored prefix), closed categorically only by an operator-owned, assistant-non-writable register at the OS layer; the remaining residuals are cadence, since tamper misleads until the next audit or gate run, and relevance, since a resolving pointer can still be a misappropriated pretext that triage refutes). The human-decision class proves only that a pending-decision row exists, never that the item genuinely crosses the human-oversight threshold, which stays human judgement. Coverage is the rendered roster (Stop, TeammateIdle, the yield-tool matcher): a yield primitive outside that roster is uncovered, reconciled when the toolchain register changes. The dispatch ledger sees only hooked launch tools, so a task launched through an unhooked tool costs one spurious deny and a dead task read as live permits one idle until staleness catches it, both directions bounded and logged. An open or proposed id that vanishes from the enumeration without a closed receipt, OR (FIX 2) a previously-actionable id DEMOTED to proposed/ungranted without a closed receipt (the checkpoint records each id's eligibility for this), is injected as a cannot-evaluate by the anti-shrinkage checkpoint (backlog-checkpoint.json: the first window has no union to compare, and a drop forced by the checkpoint's id bound is logged to guard-events, a failed append warned about in the hook's output, so a drop is never silent; a checkpoint or init marker that cannot be written is named in the hook's output whether or not its guard-events row is written, and an unwritten checkpoint does not record that window's items, so one that then vanishes or is demoted before a later checkpoint write succeeds is not held as such unless an earlier checkpoint records it); that eligibility memory is itself in the actor-writable state dir, the same categorical residual. A bound-released ALLOW WITH FINDINGS past ANY non-closed disposition (actionable, cannot-evaluate, waiting, blocked, or proposed) is marked forced_unresolved (a guard-events row plus an append-only row in forced-exit.jsonl, each normally raised once, at least once if recording it in forced-exit-surfaced.json fails, a failed append of either surfacing in the warn banner itself) and is triaged by the next resume audit; no register row, attestation, or escape-adjacent artefact suppresses that record."

[[hook]]
id = "orch-teammate-idle-guard"
rules = ["setcmp", "cntdef", "trkasy"]
platform = "claude-code"
event = "TeammateIdle"
handler = "orch_teammate_idle"
default = "block"
class = "b"
residue = "The TeammateIdle binding of the same decision core as orch-stop-guard, sharing its registry/lease scoping, escape, counter bound, and guard-events logging. A deny (exit 2) prevents the teammate from going idle past enumerated actionable work. On cannot-evaluate (an enumerator error or an unreadable proof source) it takes the STOP branch, which (FIX 1) now DENIES the idle (ignorance refuses the wind-down; a denied TeammateIdle cannot wedge the session, and the operator escape releases a genuine block); an unreadable registry or unresolvable cwd still fails OPEN at the binding. Same disclosed bounds as orch-stop-guard on ledger blind spots, fabricated blocker evidence and its attestation narrowing, escape-sentinel acceptance, the anti-shrinkage checkpoint, and the forced_unresolved marking of bound-released exits. Fires only where the platform emits TeammateIdle (doc-confirmed 2026-08-29); platforms without the event keep only the Stop and yield-tool bindings."

[[hook]]
id = "orch-yield-tool-guard"
rules = ["setcmp", "cntdef", "tstamp", "estsep"]
platform = "claude-code"
event = "PreToolUse"
matcher = "ScheduleWakeup|CronCreate"
handler = "orch_yield_tool"
default = "block"
class = "b"
residue = "The scheduled-yield binding of the decision core: a call that parks the run (schedule_idle) or ends the loop (a ScheduleWakeup with stop=true is classified stop) is judged against a fresh enumeration. Registry-scoped and lease-scoped like orch-stop-guard; a tool the registry's yield_tools list does not name is out of scope even inside the matcher, and a registry yield tool OUTSIDE this fixed matcher is NOT covered (the doctor flags it; a manifest matcher is fixed at generation). On the schedule path a cannot-evaluate DENIES (missing evidence never licenses new autonomy; a denied tool call cannot wedge a session), bounded by a three-denial cap on an unchanged basis, after which it ALLOWS WITH FINDINGS so the guard cannot be farmed into bypass training. Each deny, the quiet-claim deny included, appends a guard-events row; a failed append leaves no row and adds a short recording-failure warning to the deny reason and the banner while the deny stands. The cap, and the loop bound of a stop=true call, are judged on the count the call reads from turn-state.json before any save, and only a saved denial adds to it. A save needs a state directory the hook can write and search, and read where the platform lacks O_PATH. Every owner-mode list in this residue holds for a hook that runs without root as the state directory's owner and holds neither CAP_DAC_OVERRIDE, which searches and writes the directory in every mode, nor CAP_DAC_READ_SEARCH, which searches it and reads turn-state.json in every mode, with the state directory on a filesystem mounted read-write and not marked immutable, since a read-only mount or an immutable directory fails every save: of the eight owner modes of the state directory, 0300 and 0700 save with O_PATH and only 0700 saves without it. A deny whose denial counter cannot be written leaves the count on disk unchanged and says so in its deny reason and banner (it does not count toward the cap, or toward the loop bound for a stop=true call); the deny stands. A state directory the hook cannot search (0000, 0200, 0400 and 0600) reads as a fresh turn-state, with no count and no recorded basis, so a count already earned there is not seen; a turn-state.json that cannot be read or does not hold a JSON object, in a state directory the hook can search, reads as a schedule count of zero with no recorded basis, and as the loop bound reached for a stop=true call, and a deny saved over it starts the count afresh at one. So a schedule call the decision core would deny allows with findings exactly when the count it reads is at or above the cap on an unchanged basis (a schedule_denials value that validation rejects reads as zero, and a stop_hook_active field has no effect on a schedule call), and a stop=true call does so exactly when one of four holds: the count it reads is at or above the loop bound; turn-state.json cannot be read, or does not hold a JSON object, in a state directory the hook can search; its stop_denials value is present but is not a JSON integer from 0 to 9999 (for example a float such as 1.0, a boolean, a string, null, a negative number or a number above 9999), which reads as the loop bound; or the call's payload carries a stop_hook_active field set to the JSON value true, which relieves it whatever the mode of the state directory (the Claude Code hooks reference documents that field in the Stop input and does not list it in the PreToolUse input, so a stop=true call is relieved this way only by a payload that carries it anyway). Relief already earned therefore survives a later save failure only while the state directory stays searchable and turn-state.json readable (0100 and 0500, and 0300 without O_PATH, relieve a schedule call and name its failed wake-digest save in the note), and is lost while the state directory cannot be searched (0000, 0200, 0400 and 0600 deny, the count on disk unchanged). No relief reaches the quiet-duration deny or the unreadable-registry deny: both are decided before the decision core, so both deny a schedule call even with a readable count at or above the cap on an unchanged basis, and the unreadable-registry deny also denies a stop=true call that any of the four loop-bound triggers would relieve, a stop_hook_active field set to true included (the quiet-duration deny judges only schedule calls); the quiet-duration deny needs the measured gap in turn-state.json, so a state directory the hook cannot search never reaches it. An allowed schedule whose wake digest cannot be written to turn-state says so in its note (the returning prompt may then read as genuine human input or as timer-originated, so the note promises neither); neither failure changes the decision. Wake hygiene: a permitted schedule must name the tracked item or blocker it will recheck in its own text, judged by token containment (a paraphrase that names neither id nor ref denies once, a disclosed over-fire). The quiet-duration check is a best-effort regex: it fires only when the call text carries a parseable minutes claim AND turn-state carries a measured gap, and then the measured figure wins; an unparseable claim or an unknown measured endpoint authorizes nothing and is not invented. A fired timer or an existing cron is never counted as a live task or a blocker. Escape-sentinel acceptance, the attestation narrowing of external and foreign-lease evidence, and the anti-shrinkage checkpoint are shared with orch-stop-guard; cap or bound relief past any non-closed disposition (actionable, cannot-evaluate, waiting, blocked, or proposed) is marked forced_unresolved (a guard-events row plus an append-only row in forced-exit.jsonl, normally raised once, at least once if recording it in forced-exit-surfaced.json fails), a failed record surfacing in the returned systemMessage. DEADLINE: main() gives this check 8 seconds (the 10-second hook timeout less 2), counted from before its payload read, and fails closed with exit 2 when it has not decided by then; on the worst shapes the hooks self-test times, up to 1 MB, its slowest call took under 0.01 s in-process on a 24-core host with Python 3.14.4 (one run on 2026-10-18, including the shapes whose comment reading depends on context). Interpreter start-up and a wait the interpreter cannot interrupt (a read from a hung mount, a long call into C code) fall outside that deadline, and whether the platform blocks a call whose hook it stops at its own timeout is unverified. Where SIGALRM, setitimer or the main thread is unavailable, or SIGALRM is blocked, the check runs with no deadline; cleanup that runs while the deadline unwinds is outside it."

[[hook]]
id = "orch-ask-unattended"
rules = ["cntdef", "recfst", "humovs"]
platform = "claude-code"
event = "PreToolUse"
matcher = "AskUserQuestion"
handler = "orch_ask_guard"
default = "block"
class = "b"
residue = "Registry-scoped: inert with no registry at the session cwd's git-resolved toplevel (no ancestor walk, unlike orch-truncation-guard; AIQT_ORCH_REQUIRE_REGISTRY is not read here), and an unreadable registry allows silently with no guard-events row. TWO postures by operating mode. UNATTENDED: blocks a blocking question when the declared operating-mode record reads as unattended (this guards one known mistake shape, a blocking prompt idling an unattended run; it is not a security boundary). The mode record fails CLOSED to that guards-armed (unattended) posture, so the question is denied, for every read of the mode path that ends in neither not found nor a decoded text, the deny naming the reason: a mode path holding a NUL character, or one that is not strict UTF-8 (a lone surrogate, which is also how a surrogate-escaped non-UTF-8 name arrives), refused fail-closed before any open even where the OS could open it; a file that cannot be opened or read (a permission error, a socket, whose non-blocking open itself fails (ENXIO on Linux), or a missing file under a parent path that is a regular file, whose open reports not a directory rather than not found); one that is not a regular file (a directory, a FIFO, or a device such as /dev/zero, refused by an fstat after the non-blocking open and before any read, so a FIFO with no writer does not wait); one larger than 1048576 bytes (the reader reads at most one byte more), or one whose bytes are not valid UTF-8; and, for the text read, in these cases: an Operating-mode: declaration whose value is empty or begins with neither attended nor unattended; or, with no declaration line, content that parses as JSON but is not exactly an object whose one key, mode, holds a string beginning with attended or unattended (a bare JSON scalar such as true, 42, null or a quoted string, an array, an object with other keys, or one whose mode is missing, not a string or unrecognized), or content beginning with {, [ or a double quote that does not parse as JSON (malformed, partial, trailing text, duplicate keys, or nesting too deep to parse). It fails OPEN, allowing the question, in these cases: no declared mode path, a file whose open reports not found, an empty or whitespace-only file, or content with no declaration line that does not parse as JSON and does not begin with {, [ or a double quote (prose, including prose beginning with a number or a word, such as 42 items done or true trailing); that fail-open is logged to guard-events (where that append fails, the call is still allowed, with a note saying the row could not be written). Every input ends in one of these answers or the attended judgement below; only a stall the hook timeout bounds can delay it (a path lookup on a hung mount, a read from a stalled filesystem, or what a device driver's open does). The unattended deny instruction distinguishes record-and-continue for ordinary decisions from record-and-HOLD for anything at the human-oversight threshold; the hook redirects the question and never licenses acting without the answer. Each denied unattended ask appends ONE idempotent machine row keyed on session_id plus tool_use_id, carrying a bounded redacted summary (question count, length, digest), never the question text, and a guard-events row; a failed guard-events append adds a short recording-failure warning to the deny reason and the banner while the deny stands. ATTENDED: an attended-family mode no longer allows unconditionally. Where the registry also declares a backlog enumerator, the question is judged against the same FRESH enumeration the yield guard uses (the shared decision core, ctx kind ask: fail-closed, with NO wake-naming requirement, since a question names no recheck wake), because a blocking question parks the run on its answer exactly as a scheduled idle parks it on a timer. The judgement is session-scoped exactly as the yield guard is: a session outside the live scope (a co-located worker a holder-scoped lease does not name) does not inherit the global backlog, so its question is allowed; under a holder-scoped lease (holder_is_session_id) the judgement is likewise off for EVERY session, the orchestrator included, where no holder can be confirmed, exactly as in the yield guard: a lease file that cannot be stat'ed, and, for a NON-EMPTY lease the session-id and holder-token checks run on (one the age classifier reads as fresh or cannot-evaluate under a declared max_age_hours, or, with no horizon declared, every non-empty lease whatever its mtime), a lease that cannot be read, a call that carries no session id, or a lease that names no session. Every other lease shape skips the holder check and falls through to the live-mode scope source: an empty lease, a lease that declares no path (an absent, empty or non-string path), a lease stale past a declared max_age_hours, and a lease future-dated past the tolerated clock skew under a declared usable max_age_hours (an unusable one reads cannot-evaluate whatever the mtime, so the holder check runs); a live mode record then keeps EVERY session in scope there, the sessions the lease does not name and an id-less caller included, so the judgement stays on (erring toward denying, never toward letting a question through). Within scope the question is DENIED while granted open items are actionable, neither dispatched (waiting on a live tracked task in the dispatch ledger) nor blocked by a human decision recorded at a row-id position in the declared pending-decisions record (fresh external or foreign-lease evidence, its attestation narrowing included, and a not-before time also block, the stop guard's blocker grammar), the deny naming up to ten actionable items and the two ways forward: DISPATCH them, or RECORD each as blocked by this decision (a human-decision blocker on the item plus a matching pending-decisions row), then re-issue the question. That actionable deny is NEVER cap-relieved: the fourth unchanged question is denied exactly as the first, because both named exits stay available however often it is re-asked, and a backlog holding both an actionable item and a cannot-evaluate item keeps that actionable deny, which then also names the held items in the same reason (held work never buys relief past work the enumeration still classifies as actionable). An enumerator error, and any open item whose proof source cannot be read, is a cannot-evaluate that DENIES (missing evidence never licenses parking the run on a question), and ONLY these cannot-evaluate denies, and only while no item is actionable, are bounded by the three-denial cap on an unchanged basis as on the schedule path, past which the question is allowed with findings and marked forced_unresolved when open work remains (a guard that can be farmed trains its own bypass, and a broken enumerator or proof source may be outside the session's power to repair). The actionable narrowing reads the CLASSIFIED sets only: a proof-source failure that holds every otherwise-actionable item (examples: one schema-invalid dispatch-ledger line, a shape the session can append itself; an unreadable or undeclared pending-decisions record; or a declared attestation register whose validated snapshot is absent or stale) or an enumeration failure that hides items (a duplicate item id fails the whole enumeration) leaves no item classified actionable, so three unchanged denials still buy the cap relief past that work; each relief ATTEMPTS a forced_unresolved record and a guard-events row, a failed write is reported in the released message, and the relief still proceeds; the ask denials are counted by their OWN pair (ask_denials and ask_basis in turn-state.json), so ask denials never buy the yield guard premature cap relief and schedule denials never relieve a question; genuine human input (a prompt the stamp recorder does not classify as a registered timer wake) resets the ask pair exactly as it resets the schedule pair; and the counter save needs the same state-directory modes as the yield guard's, a deny whose counter cannot be saved standing uncounted and saying so. A registry that declares NO enumerator key leaves the attended judgement out of scope and allows, while a DECLARED enumerator that is not an object is a configuration error denied as cannot-evaluate with a guard-events row, named as such, exactly as the yield guard denies it (never a silent allow); an absent registry keeps the whole hook inert; the operator-owned escape sentinel releases the deny under the same enforced acceptance as the yield guard, its use recorded; a judged clean allow appends a best-effort guard-events row (the over-fire metric). The fresh enumeration runs the registry-declared enumerator inside the hook deadline, so a slow enumerator fails closed at it. Its behaviour is verified by the behaviour self-test. RESIDUALS this hook cannot see: a mode change AFTER the question was asked (a PreToolUse hook runs once, when the tool is called, and no pack hook can cancel a pending interactive call; that needs host-side handling); work the enumerator does not list (deliveries to read, merges, or scheduled reviews not modelled as backlog items); an orchestrator that wrongly marks independent items as blocked by the question; whether each question is genuine or already has a recorded default; and a blocking prompt raised outside the AskUserQuestion tool, any other question tool included. Whether the platform honours a PreToolUse deny on AskUserQuestion, and whether scheduled wakes fire while a question is pending, is unverified platform behaviour. DEADLINE: main() gives this check 8 seconds (the 10-second hook timeout less 2), counted from before its payload read, and fails closed with exit 2 when it has not decided by then; on the worst shapes the hooks self-test times, up to 1 MB, its slowest call took under 0.01 s in-process on a 24-core host with Python 3.14.4 (one run on 2026-10-18, including the shapes whose comment reading depends on context). Interpreter start-up and a wait the interpreter cannot interrupt (a read from a hung mount, a long call into C code) fall outside that deadline, and whether the platform blocks a call whose hook it stops at its own timeout is unverified. Where SIGALRM, setitimer or the main thread is unavailable, or SIGALRM is blocked, the check runs with no deadline; cleanup that runs while the deadline unwinds is outside it."

[[hook]]
id = "orch-truncation-guard"
rules = ["trkasy", "vrfdlv", "nocncl"]
platform = "claude-code"
event = "PreToolUse"
matcher = "Bash"
handler = "orch_truncation_guard"
default = "block"
class = "b"
residue = "AIRTIGHT-NARROW (maintainer-directed simplification): this guard does NO shell parsing, so no lexical, quoting, or operator edge can make it credit a capture that does not exist. Within the registry scope (the REGISTRY-SCOPE RESIDUAL, OUT-OF-SCOPE NOTE and REGISTRY-REQUIRED MODE below change only the outcome when no registry is found), it governs a background dispatch (run_in_background is true) with the capture-proof test below, and adds ONE narrow foreground branch: a foreground call (run_in_background not true) is out of scope EXCEPT that a bare '&' control operator, which detaches a child into asynchronous work this tool call does not track, is a DENY-and-educate steering the operator to the tracked background dispatch (run_in_background) or to running it in the foreground and waiting. That foreground detector is a dedicated quote- and escape-tracking scan (not the shared segmenter, which strips quote and escape provenance and would misread a quoted or escaped ampersand as a separator): it distinguishes the detach '&' from the shell forms that also carry an ampersand but do not detach ('&&', '&>', '&>>', '<&', '>&', '|&', and any single-quoted, double-quoted, or backslash-escaped ampersand, and an '&' inside an unquoted word-start '#' comment, which is dropped). Where a '#' opens a comment is read under two rules, the historical one (after any Unicode whitespace character) and bash's (only after a space, tab, newline, or one of ; & | < >), and a detach seen under either rule DENIES, so the bash rule only adds denies: a '#' after a carriage return, vertical tab, form feed, no-break space, 0x1c-0x1f separator, NEL, or other Unicode space is not a comment to bash and the '&' after it is caught. Under both rules the shared lexer's comment rule applies: such a word-start '#' is a comment only while no parenthesis, ${...} parameter expansion or backquote substitution is open, and a '#' whose comment reading depends on context (right after a '(', ')' or backquote, or at a word start while one of those is open) ends the scan as an open quote does, so it DENIES (an over-deny of such a command that detaches nothing). A backslash-newline before a '#' changes nothing (bash removes it first), and a '#' that is not right after a word character inside a \"$(...)\" or backquote substitution in a double-quoted string, outside a single-quoted span there, is uncertain too. It looks ONLY for a bare '&' operator at the outer quoting level AS ITS OWN QUOTE TRACKING READS IT; where that reading diverges from bash's, a bare outer '&' is missed (the false-allow residual below, whose list of known cases is not complete). A scan that ENDS still inside an unbalanced quote (including one left open by an ANSI-C dollar-single-quote construct ($'...') this scan does not model, or by an apostrophe in a here-document body) could hide a real trailing '&', so it FAILS TOWARD THE DENY, with a reason naming the open quote rather than a bare '&'; this covers only a quote still open at the end, not one misread in mid-string. KNOWN FALSE-ALLOW RESIDUAL (confirmed against real bash; the scanner docstring lists the same cases): the scan reads only the outer quoting level, and its quote and comment tracking can diverge from bash's in further ways than those listed here, so this list is NOT complete. Known cases include a real detach that is NOT seen and is SILENTLY ALLOWED (1) when its '&' sits inside a command substitution or backtick wrapped in double quotes (echo \"$(job &)\"); (2) inside a string that eval or quote removal re-reads as code (e'v'al 'job &', {eval,} 'job &', \\eval 'job &'); (3) after an ANSI-C $'...' quote with an escaped quote that leaves the scan balanced but misaligned; (4) inside an arithmetic subscript that runs a substitution; (5) QUOTE SHIFT: after a quote character that bash reads as data but the scan reads as a quote, above all an apostrophe or double quote in a here-document body (quoted delimiter or not, including the double-quoted commit-message form), which flips the scan's quote state so that a LATER real bare '&' (between two here-documents, or before a second stray quote that rebalances the scan) reads as quoted text and is allowed; and (6) COMMENT SHIFT: after a '#' that bash reads as quoted text but the scan reads as a comment, where a double-quoted string nested inside a double-quoted \"$(...)\" ends the scan's double quote early, so a '#' inside the nested string reads as a word-start comment and a real bare '&' later on that line is skipped (echo \"$(echo \"a\" \"b # \")\" & job # \"). HONEST RESIDUAL (disclose-guard-residuals): inside registry scope, detachment achieved WITHOUT a bare '&' in the outer command is NOT caught and is SILENTLY ALLOWED, not over-denied (outside registry scope some of it draws the OUT-OF-SCOPE NOTE below) - a runtime detacher that backgrounds with no '&' (setsid, disown, coproc; nohup is normally written with a trailing '&', which IS caught), a nested shell string whose '&' sits inside quotes (bash -c '... &'), and an alias or function that renames a detacher; the grammar cases that OVER-fire instead are NOT a single case: any unquoted '&' this scan does not model as a detach still reaches the scan and reads as an operator, so it DENIES when no detach is present. Examples are a here-document body carrying a literal '&', and an arithmetic expansion such as $(( a & b )) where '&' is bitwise-AND; any other construct this scan does not model that leaves a non-detach '&' unquoted in the outer string over-DENIES the same way. OVER-REFUSAL OF SAFE HERE-DOCUMENTS (disclosed): the scan reads a here-document body as code even under a quoted delimiter (<<'EOF'), so a safe here-document whose body carries an unquoted '&' (Fix A & B) or an unbalanced apostrophe (the user's file) is DENIED although nothing detaches; in the git commit-message form wrapped in double quotes the body is read as double-quoted text and each double quote in the body toggles that reading, so whether a body '&' is denied depends on where it falls relative to those quotes (say \"a & b\" is denied, say \"hi\" & bye is allowed). The remedy is to write the text to a file and pass the file. This misreading is NOT only in the safe direction: the same body quotes cause the quote-shift false-allow (5) above. The guard locates its registry scope by the UNION of two legs: a walk of the session cwd's physical ancestor chain with no-follow, descriptor-anchored lookups, and, where git DOES resolve a toplevel for the cwd (the scrubbed rev-parse primitive the sibling orchestration guards root via), that toplevel's registry too, because core.worktree (set in a repository config or a gitfile's gitdir target) can point the work tree OFF the cwd's ancestor chain, where the walk alone never visits its registry (a review finding: from inside such a repository's metadata directory the walk alone turned the old rev-parse scoping's deny into an allow); BY DEFAULT git success can only ADD a deny, a git failure alone never denies, and the walk alone still decides where git cannot run or answer, while in the opt-in registry-required mode below a git failure where the registry is reachable only through the git toplevel reads as ABSENT and is denied, and git success can then remove that deny; the AIRTIGHT-NARROW claim is about the command-string analysis doing NO shell parsing. Overriding that DENY does not itself create tracking; only converting to run_in_background=true lets the dispatch ledger record the launch. The foreground DENY stays registry-scoped, so BY DEFAULT a non-orchestrated session acquires no bare-'&' deny and no prompt and only the pre-scope denies below (a malformed or control-character tool_name, a malformed cwd, or a registry walk that cannot be carried out) apply in every session; in the opt-in registry-required mode below a session with no registry found is instead denied on every Bash call that passes those checks. OUT-OF-SCOPE NOTE: by default, where no registry is found, a readable foreground command (run_in_background false or omitted, and a string command) that detaches work is ALLOWED WITH A NOTE (a systemMessage with no permissionDecision) naming the tracked background mechanism: use run_in_background and collect its completion, or run it in the foreground and wait, or record a deliberate detach. It notes a bare '&' read as the in-scope scan reads quotes, escapes and '#' comments, by the same shared comment rule, so a '#' whose reading depends on context (one right after a '(', a ')' or a backquote, as in x=$(true)# & job, one at a word start inside an open parenthesis, ${...} or backquote substitution, as in echo ${x:- #} & job, or one not right after a word character inside a double-quoted \"$(...)\" or backquote substitution) draws the note itself, never a deny, where the in-scope scan denies it; a backslash-newline line continuation anywhere outside a single-quoted span draws the note itself, as unreadable, wherever the scan meets it (in live text, in a double-quoted string, on a certain comment's line, in a skipped arithmetic span or in a skipped here-document body): bash removes the pair before it tokenizes, so ANY token can be split across one (a '<' or '>' split from its '(' still opens a process substitution bash counts and this raw scan would not, a split detacher or 'case' keyword is still that word to bash), and the class is closed as a whole rather than shape by shape, as far as the scan's quote reading matches bash's (a continuation in text the scan misreads as quoted, as after the ANSI-C false-allow above, is missed with the rest of that divergence), while a pair inside a single-quoted span (one inside a double-quoted command substitution included, where a backslash is literal data too) is literal data to bash and stays silent, as does a backslash before any character but a newline; with two differences: the body of every here-document opened at the outer quoting level, while no parenthesis, '${...}' or backquote substitution is open, under a PROVABLY SIMPLE delimiter spec (an allow-list: a whole word of letters, digits and '_ . + -' that bash ends where the scan does, at a blank, a newline, the end of the command, one of '; & | )', or a '<' or '>' that opens no process substitution, over a body with no backslash-newline up to its closing line) is skipped as data at its exact delimiter line; and every arithmetic $(( )) or (( )) is skipped, so an '&' or an apostrophe there neither notes nor shifts the quote state; a span the scan would skip but cannot read with certainty draws the note itself instead of a silent skip or a guessed delimiter (never a deny: no command content raises out of the handler): every here-document delimiter that fails that allow-list (a quoted, ANSI-C or escaped fragment, a delimiter continued with a backslash-newline, which bash joins while this raw scan does not, a '$', backquote or brace in the word, since bash keeps a '$(...)', '$((...))', '${...}' or backquoted span in one delimiter word with any blank or metacharacter inside it, as in <<$(true) or <<${x:-a b}, a '(' or a '<(' or '>(' glued to the word, which bash reads as part of it, as in an extglob <<a+(b c), a quote left open, or no delimiter word at all), a here-document opened while a parenthesis, '${...}' or backquote substitution is open (bash 5.3 ends such a body inside a command or process substitution or backquotes at a line that merely starts with the delimiter when a ')' or a backquote follows it on that line, as in x=$(cat <<EOF ... EOF), and reads the rest of that line as commands, so where such a body ends is unknown; whether such a substitution is open is read from the scan's own count of unquoted '$(', '<(' and '>(' openers as well as from its nesting stack, because a bare case pattern's ')' pops the stack's parenthesis, as in x=$(case y in y) :;; esac; cat <<EOF; the count falls only at a ')' that same stack matches against a '(' on top, so a ')' that is text inside a '${...}' expansion or a backquote span, as in x=$(echo ${y%)}; ...), closes nothing and the substitution stays counted open to the end of the command, and once a 'case' keyword has been read in command position no ')' is counted as closing a substitution, so a here-document after a closed one in such a command draws the note too, an over-note; a well-formed one, its delimiter on its own line before the ')', draws the same note, an over-note), a body holding a backslash-newline anywhere up to its closing delimiter line (bash joins a body line ending in a backslash with the next before it matches the closing line, so the raw line match can end the body early or late), a '${...}' redirect target left unclosed, not opened by a name (a bash 5.3 '${ cmd; }' or '${| cmd; }' command substitution, which runs its command even in a redirect target, included) or holding any quote, backslash, '$', backquote, '<' or '>' (a '$(...)' or backtick command substitution and a '<(...)' or '>(...)' process substitution run even in a redirect target, quoting, nested or not, can hide one from a lexical skip, and an escaped '}' does not close the expansion to bash), and any further '${' anywhere in a redirect target operand, double-quoted or not; nothing shows that these excluded forms are every way bash can read further than the scan or run a command there, which is why each rule admits a fixed set rather than refusing a list; a '<<' met inside a double-quoted command or backquote substitution (the commit-message form) draws the note itself at the operator, whatever follows it, as a BEST-EFFORT rule (a '<<<' here-string there included, an over-note; the scan tracks quotes and parentheses inside such a substitution only approximately, so a shape whose quote or parenthesis state it misreads can hide the operator, the known misses listed below): bash reads such a here-document body under its own rules, while this scan read it as double-quoted text whose quote state each body quote toggles, so a stray quote in the body once shifted that state onto a later REAL bare '&' outside the substitution, which read as quoted text and was silently allowed (confirmed against bash; closing that miss is why the operator itself notes); a scan that ends with an opened construct still open draws the note too (an unterminated here-document body, a here-document opener with no body line, an unclosed parenthesis, '${...}' or backquote substitution, or a trailing backslash that escapes nothing): bash would still be reading input there, or rejects the command, so nothing the open construct holds was checked (a substitution whose '(' the scan already read as closed at a ')' that closes nothing to bash, such as a bare case pattern's, is not seen by that end check: its here-documents are still noted through the count above, while with no here-document and no detach after it the scan stays silent, a disclosed miss); and it notes a setsid (without -w, --wait, or a unique prefix of --wait such as --w), nohup or disown in command position (at a command start, after an operator or a reserved word, after a wrapper such as env, nice, sudo or timeout and its options, numbers and assignments, after a case pattern's ')', parenthesised or bare (a word directly after a subshell's ')' is a syntax error to bash, so reading it in command position too can only over-note), or inside a function body the command itself defines, f() { ...; } or function f { ...; }; a redirect operator and its target operand, leading or not, leave that position undisturbed, including a here-string '<<<', whose word is never read as a here-document delimiter, the noclobber '>|', read as one operator rather than a redirect then a pipe, a named descriptor written directly before its operator such as {fd}> (but a number or {fd} before '&>' is a word to bash, never an fd prefix, and is read as one), a '${...}' parameter expansion that is the whole redirect target, read as one word when it is provably simple (a name, then only literal characters up to the first '}') so a blank inside a '${x:-a b}' default does not split the operand (a literal '{' in a default does not nest, as in bash, so the expansion ends at its matching '}' and the command after the target is still read), and a redirect between setsid and its wait option, which bash removes from the argument list so the options past it are still read). Inside registry scope nothing changes: the deny still reads a here-document body and arithmetic as code (the over-refusals below stand) and still does not read setsid, nohup or disown. The note's residual: it does not stop the detached work, and whether the model, and not only the operator, sees a PreToolUse systemMessage is unverified. A scan that ends inside an open quote draws the note itself (unreadable), never a silent allow; a command bash reads as balanced can end this scan inside an open quote where its quote reading diverges from bash's, which notes the same way (the over-note list below). It stays SILENT for a detacher it cannot read in command position (a quoted or backslash-escaped command word, a command word after a backtick, an unquoted expansion as the command word ($SUDO setsid -f job, $(true) nohup job: an empty expansion vanishes to bash, which runs the word after it as the command, while the scan reads that word as an argument), a wrapper option that takes a separate value such as sudo -u name, an alias or a function defined outside the command (a detacher inside a function body the command itself defines, f() { ...; } or function f { ...; }, is read in command position), coproc, a nested bash -c string, eval, a program that daemonizes itself, a detacher after a redirect target written as an arithmetic expansion, which drops the pending command position, a detacher word inside a bash 5.3 '${ cmd; }' or '${| cmd; }' command substitution outside a redirect target (echo ${ setsid -f job; }), which is read char by char and not in command position); for an '&' or a detacher word inside a double-quoted command substitution, inside a command substitution in an unquoted here-document body (a bash 5.3 '${ cmd; }' included; the body under a provably simple delimiter is skipped whole as data, so nothing in it is read, while bash expands a command substitution there and runs what it holds), or inside a command substitution in skipped arithmetic; for the lines after a '<<' inside the old-style $[ ] arithmetic, which this scan reads as a here-document opener although bash does not; for a here-document inside a command or process substitution whose 'case' keyword this scan does not read in command position, such as one after coproc, which is not a recognized command prefix (a spelling hidden by a backslash-newline line continuation, split by one or followed by one, draws the continuation note above instead), where a bare pattern's ')' still reads the substitution as closed on the count exactly as it pops the stack, so the body can be skipped at a wrong line; and for the false-allow cases listed above, whose here-document part of the quote shift in case (5) is narrowed, not closed: the here-document rule inside a double-quoted command or backquote substitution is BEST EFFORT, because this scan tracks quotes and parentheses inside such a substitution only approximately (it reads every unescaped double quote there as the end of the outer string, and a ')' there as closing the innermost open parenthesis, where bash may read the character otherwise), so any shape whose quote or parenthesis state it misreads can leave a real background operator unnoted: such a shape can hide a later '<<' in the substitution from the rule, its body is then read as double-quoted text again, and a stray quote in it can carry a real bare '&' after the substitution into quoted text, or it can shift the quote state onto that '&' directly; known examples, not a complete list, are a nested double-quoted string (: \"$(cat \"-\" <<'EOF' ..., or \"$(x=\"a\"; cat <<'EOF' ...), a single-quoted span holding a double quote (echo \"$(echo 'x\"y')\" & job # '), a case pattern's close paren (: \"$(case a in a) cat <<'EOF' ...) and a close paren inside '${...}' (: \"$(echo ${y%)}; cat <<'EOF' ...); in each the '&' stays SILENT while bash backgrounds the job (confirmed against bash 5.3.9) (the in-scope deny's residual stands unchanged). It OVER-NOTES a nohup run that does not itself return early, a disown with no job to drop, a deliberate and recorded detach it cannot tell from a careless one, a setsid that in fact waits because its wait option sits behind a redirect target that is not a plain word (an expansion or a quoted word), where the scan reads the redirect as the end of the options and still notes the setsid, any command holding a skipped span that is not provably simple (the cannot-read cases above) even where nothing detaches (for example a quoted here-document delimiter such as <<'EOF' over a body of pure data, a plain delimiter holding a character outside the allow-list such as <<END/1, a body holding a backslash-newline, a '${' after the start of a redirect target such as > a${x}, a redirect-target '${...}' default holding a command substitution that does not detach, a quoted or nested default that hides nothing - a single-quoted '$(' inside it is literal to bash, but the quote already makes the span one this scan declines to model - or a here-document the shell would reject as a syntax error), any command holding a '#' whose comment reading depends on context even where nothing detaches (for example (true)# done), a detacher word written directly after a subshell's ')' (a syntax error to bash) or after an empty '$()' (an argument word to bash), each read in command position, a detacher word after a ')' that is text inside a '${...}' expansion (x=$(echo ${y%)setsid -f job}): the text up to the expansion's real '}' is read in command position, while bash reads it as pattern text), a function definition whose name is a detacher (function setsid { :; }), whose name is read in command position though the command only defines it, a command bash reads as balanced that ends the scan inside an open quote (an ANSI-C $'...' word whose escaped quote the scan reads as a close, echo $'don\\'t stop'), a here-document after any closed command or process substitution in a command that also read a 'case' keyword in command position (case a in a) :;; esac; x=$(true); cat <<EOF ...), and a here-document opened inside a double-quoted command substitution (the git commit-message form, git commit -m \"$(cat <<'EOF' ... EOF)\"), noted at its '<<' whatever the body holds wherever the scan reads that '<<' as inside the substitution (a best-effort reading, the known misses above), where a '#' not right after a word character in such a substitution (Fixes #12) reads as uncertain and notes too; an arithmetic expression holding a quoted parenthesis can misalign the arithmetic match either way. Its scan adds two linear passes per out-of-scope Bash call, one per comment word-start rule, each reading the command in place (a glued substitution's ')' once tested the enclosed text for emptiness by slicing it, so nested glued substitutions, x=$(x=$(...)), copied characters growing with the square of the nesting depth; that test now walks a running index and reads each enclosed position at most once) (see DEADLINE). REGISTRY-SCOPE RESIDUAL (disclose-guard-residuals, decided against check-fails-closed-on-unreadable): the orchestration registry is the whole suite's scope declaration, not an input this guard is declared to cover, and the hook is wired by installing the pack in every session, orchestrated or not; so with NO registry entry on the cwd's physical ancestor chain (.aiqt/orchestration.local.json and .aiqt/orchestration.json a clean not-found at every chain directory, judged by a no-follow, descriptor-anchored walk of that chain and its path-anchored recheck) AND none at a git-resolved toplevel (the union leg above) the guard, BY DEFAULT, denies nothing and ALLOWS every Bash call that passes the pre-scope checks below (a readable tool_name and a walkable cwd; in the opt-in registry-required mode below it DENIES them instead), silently except for the OUT-OF-SCOPE NOTE above on a foreground detach: a real bare-'&' detach is allowed with that note, and a truncating-sink background dispatch is allowed silently, while every call whose tool_input is missing, null or not an object, whose command is missing or not a string, or whose run_in_background is present and not a real boolean (a malformed flag such as the string 'true') is allowed WITH A NOTE naming the field the guard could not read: no note scan runs on those shapes, so a detach they carry is still not named, but the allow is no longer silent, and a readable background dispatch (run_in_background exactly the boolean true) stays the silent allow; the same holds in a session whose GIT DISCOVERY FAILS (no git binary on PATH, a dubious-ownership refusal, a broken global config, a bare repository, a cwd inside a .git directory, a discovery timeout or error): BY DEFAULT a git failure alone is out of this guard's scope, never a deny (the earlier lockout, where any such failure denied every Bash call and the denied session could not even run the git or install command that repairs it, is withdrawn); in registry-required mode a git failure where the registry is reachable only through the git toplevel reads as ABSENT and is denied. Failing closed there BY DEFAULT would deny Bash in every non-orchestrated repository. REGISTRY-REQUIRED MODE (opt-in; default unchanged): an adopter who wants exactly that fail-closed posture sets the environment variable AIQT_ORCH_REQUIRE_REGISTRY (any value except an explicit off: '', '0', 'false', 'no', 'off', ASCII case-insensitive and matched exactly with nothing stripped, so an off word padded with a space, tab, newline, or no-break space reads as ON; a garbled value reads as ON, the deny-safe direction for an explicitly configured strict mode), and an ABSENT registry (no chain entry and no git-toplevel entry) then fails closed on every Bash call that passes the pre-scope checks, denying it with a reason naming the mode and its repair (commit the registry, run from inside the orchestrated tree, or unset the variable); a registry discovery that cannot be evaluated (the three-valued discovery below) is denied the same way, with a reason naming the unconfirmable entry and its repair. It is an environment variable rather than a pack config key because every pack config surface is a per-repo file located by the same cwd-anchored lookup whose empty result this mode exists to fail closed on, so a file-based key cannot speak exactly when it is needed; the hook's execution environment is the one channel independent of that lookup. A tree that wants this control commits the registry; the walk finds it from any cwd under the tree, with or without a working git, so the same dubious-ownership, missing-git, or broken-config session INSIDE an orchestrated tree still applies the guard. The walk does not stop at the repository root or a filesystem boundary (git discovery stops at a mount point), so a registry in ANY ancestor directory - above a nested repository, above a mount point, or in a non-git tree - scopes the guard in; it is the UNION with the git-toplevel leg, not the walk alone, that makes this scoping a deny-safe widening over the old rev-parse scoping (the walk alone removed the old scoping's deny where core.worktree points the work tree off the cwd's ancestor chain; with the union, git success can only add coverage, and BY DEFAULT a git failure alone never removes a deny; in registry-required mode added coverage can remove the absent-registry deny, and a git failure that hides a registry reachable only through the git toplevel adds one). CONCURRENT-MOVE DETECTION AND ITS BOUND: descriptor anchoring preserves each opened directory's identity, not its parent relationship, so a mid-walk rename of an ancestor could redirect the walk past a continuously present registry; a walk that finds nothing therefore re-resolves the chain BY PATH and re-probes every chain directory, scoping the session IN when that recheck finds a registry and DENYING (never allowing) when the re-resolved dev/ino chain does not match the chain the walk visited or cannot be re-resolved. The race limit is disclosed, not closed: the walk, the recheck, and the Bash call they gate are not one atomic step, and neither the walk nor the recheck is one atomic read of the chain (each is a sequence of lookups), so two windows are out of view. (1) DURING the walk and the recheck: a concurrent rename of an ancestor directory timed against the walk AND the recheck can hide a registry and the call is then allowed (denied under registry-required mode), for example a registry relocated within the chain so it is never where either pass probes, or a sibling directory swapped in under a textual chain path during the recheck so that it reports the same dev/ino the redirected walk recorded and the two chains agree. (2) AFTER the recheck returns: any change to the chain or a registry - including a registry that appears only then - is out of view, as it is for any pre-execution check. Both windows are outside this guard's threat model: it exists to stop ACCIDENTAL truncation in an orchestrated tree, and a party able to rename this host's ancestor directories concurrently with the hook is not that case; a mid-walk rename that is not also timed against the recheck is caught (a found or a deny), and no further race machinery is added. A directory bind-mounted onto its own child repeats one dev/ino between parent and child without being the filesystem root; the walk steps THROUGH such a repeat rather than misreading it as the root (only the filesystem root's own identity ends the walk, and a walk the root identity cannot bound fails closed at its depth bound), so a registry above the mount point is still reached - verified by simulation, since these hosts cannot create mounts, with the path-anchored recheck as the behavioural backstop (an fd-walk miss at a mount edge surfaces as a found or a deny on the recheck, never an allow). Registry discovery is THREE-VALUED: a chain or toplevel entry is cleanly ABSENT, a CONFIRMED registry (the first registry name present in a real '.aiqt' directory, the local name first, is a regular file under a no-follow stat, whatever its content), or CANNOT-EVALUATE (a '.aiqt' chain entry that is a symlink, a regular file, or a directory this process lacks search (execute) permission on, such as mode 0600 or 0000 for a process those modes bind (mode 0100 evaluates normally for its owner where O_PATH exists and for a process the mode bits do not bind, such as root or one holding CAP_DAC_READ_SEARCH or CAP_DAC_OVERRIDE; it cannot be evaluated by any other process that is not its owner, nor by its owner where the O_RDONLY fallback, which also needs read permission, is in use), a first present registry name that is not a regular file or whose no-follow stat faults, or a git-resolved toplevel that exists but cannot be opened; one that does not exist reads as absent). BY DEFAULT a cannot-evaluate entry reads as PRESENT and keeps the guard ACTIVE, never in the denies-nothing no-registry posture, exactly as a PRESENT registry that cannot be read or validated (a read or parse error, or a non-version-1 object) keeps it ACTIVE; in the opt-in registry-required mode a cannot-evaluate entry is NOT a registry, so a Bash call that passes the pre-scope checks is DENIED there (the walk stops at the nearest non-absent chain entry, so a cannot-evaluate entry there denies in that mode even where a registry sits further up the chain or at the git toplevel; with nothing on the chain, a cannot-evaluate git toplevel denies), so a discovery fault never satisfies that mode, while a confirmed registry satisfies it whether or not it can be read or validated. MALFORMED OR UNWALKABLE INPUT FAILS CLOSED (check-fails-closed-on-unreadable): a tool_name that is missing, null, empty, not a string, or carrying a NUL or any other control character (a control character never appears in a real tool name, so such a name is never read as an ordinary non-Bash tool); a cwd that is missing, null, empty, or not a string; and a string cwd whose registry walk cannot be carried out (it contains a NUL, is not an existing directory this process can read and enter, or has an ancestor directory the walk cannot open or examine) are DENIED with a reason naming the defect and an action that repairs it, before the registry scope is read, so in every session, orchestrated or not, while a plain non-Bash string tool_name is out of scope; within scope, a tool_input that is missing, null, or not a JSON object, a run_in_background that is present but not a real boolean (the string \"true\" is malformed, never read as foreground), and a foreground command that is not a string are each DENIED with a reason naming the defect; an omitted run_in_background is a foreground call. A background dispatch is ALLOWED only when the whole command is drawn from a conservative safe character set (letters, digits, space and tab, and the punctuation '_ - . / = : @ , + %'), so it carries NO shell metacharacter (no pipe, redirect, separator, quote, expansion, command or process substitution, grouping, glob, comment, tilde, history, or newline) and is not a shell reserved word (coproc, which backgrounds a coprocess whose output the harness does not capture, or a compound/prefix keyword such as if/for/while/time) and its full stdout reaches the harness capture that run_in_background binds to the TaskOutput completion signal IN THE COMMON CASE - unless the invoked program or wrapper itself detaches, daemonizes, or redirects that output, which is out of view (see the program-behaviour residual below). ANY other command is ALLOWED WITH AN INFORMATIONAL NOTE: the guard does not parse shell syntax to prove or disprove capture, and an unprovable background dispatch is not a hazard (a dispatch that redirects or pipes its own output is a normal, legitimate form), so it allows and notes that the operator should make sure the full output lands in a durable capture (redirect the producer's own stdout to a real file, or make a real-file tee the final stage). DISCLOSED COVERAGE BOUND (deliberate, not a defect): this trades COVERAGE for an assurance of NO SHELL-SYNTAX FALSE-ALLOW (no quoting or parsing edge in the dispatch string can fabricate a capture). A legitimate captured background dispatch that uses any shell syntax (a real-file redirect, a tee, a glob, an env-assignment prefix carrying a quote) is ALLOWED WITH A NOTE rather than proven; the guard DENIES a background dispatch on capture grounds ONLY when it pipes a producer into a TRUNCATING SINK (head/tail), which discards the producer's full output and exit status (a review finding), or carries a '#' whose comment reading depends on context that the shared lexer cannot judge under both readings (any other such '#' is judged under both, so a sink either reading reaches denies), past which it reads nothing, so such a sink cannot be ruled out; the sink is resolved THROUGH leading shell command-modifier wrappers (command/env/builtin/exec/nice/nohup/stdbuf/time and their own option/assignment args) so a sink hidden behind one (| command head, | env head) is still caught (a review finding), while a wrapper resolving to a non-truncating command still allows-with-note; and otherwise the informational note and the vrfdlv delivery-marker discipline are the compensating layers. What this buys over a lexical capture-proof: the ALLOW rests on a raw-character test that no quoting or parsing can fool, so there is no shell-syntax edge that can silently open a false allow. The residual is RUNTIME behaviour beyond the dispatch string: a plain command can still fail to deliver its full output to durable capture for reasons no pre-execution command-string check can show. Two classes. (a) The invoked program or wrapper's own behaviour - a terminal multiplexer or setsid that detaches, a start-stop-daemon or nohup-style wrapper that backgrounds or redirects the producer's stdout (e.g. --output /dev/null), a program that internally pipes to head/tail, or one that sources a script or resolves a PATH name to a truncating tool. (b) Platform and resource limits - the harness's own TaskOutput capture has a size ceiling (Claude Code terminates a background task whose output exceeds a documented limit), so a very large stream is lost at the harness regardless of the command, and disk-full, a kill signal, or other run-time conditions can likewise cut delivery short. None of this appears in the command string. The guard's ALLOW therefore asserts only that no shell SYNTAX in the dispatch string can defeat capture; whether the output actually and fully reaches durable capture is a run-time property that the post-execution vrfdlv delivery-marker discipline, not this guard, confirms. The guard DENIES exactly these. In every session (pre-scope): a tool_name that is missing, null, empty, not a string, or carrying a NUL or another control character; and a cwd that is missing, null, empty, or not a string, contains a NUL, is not an existing directory this process can read and enter, has an ancestor directory the registry walk cannot open or examine, or has an ancestor chain that changed while the walk read it. Only within the registry scope: a tool_input that is not a JSON object; a run_in_background that is present but not a boolean; a foreground command that is not a string; a FOREGROUND command whose scan ends inside an open quote or meets a '#' whose comment reading depends on context, denied with a reason naming both; a FOREGROUND bare-'&' detach (untracked asynchronous work, steered to a tracked run_in_background dispatch or to a foreground wait), which with the open-quote deny also covers the over-refusals above; a BACKGROUND dispatch whose command is not a string or is empty; a BACKGROUND dispatch that pipes a producer into a TRUNCATING SINK (head/tail), whose completion signal would bind to the sink's truncated output so a failing producer would read as a clean, finished run (a review finding); and a BACKGROUND dispatch carrying a '#' whose comment reading depends on context that the shared lexer cannot judge under both readings, past which such a sink cannot be ruled out. Each malformed-input deny carries a reason naming the defect. Under opt-in registry-required mode only (AIQT_ORCH_REQUIRE_REGISTRY set): every Bash call that passes the pre-scope checks when no orchestration registry is found (including a registry reachable only through the git toplevel when git fails, which reads as not found), and every such call whose registry discovery cannot be evaluated (a '.aiqt' that is a regular file, a symlink, or a directory without search (execute) permission, a first present registry name that is not a regular file or cannot be stat'ed, or a git toplevel that exists but cannot be opened), denied with a reason naming the mode and its repair. DEADLINE: main() gives this check 8 seconds (the 10-second hook timeout less 2), counted from before its payload read, and fails closed with exit 2 when it has not decided by then; on the worst shapes the hooks self-test times, up to 1 MB, its slowest call took about 1.20 s in-process on a 24-core host with Python 3.14.4 (one run on 2026-10-18, including the shapes whose comment reading depends on context). The OUT-OF-SCOPE NOTE's scan, timed from a no-registry cwd on the foreground shapes the hooks self-test adds for it (up to 1 MB), took at most about 0.52 s of wall-clock time for the whole call in-process, growing linearly with size, on a 24-core host with Python 3.14.4 (2026-10-20); the nested glued substitution shape added to those fixtures later measured about 0.04 s of CPU for both scan passes at 64 KB, 0.14 s at 256 KB and 0.49 s at 1 MB on a 24-core host with Python 3.14.4 (2026-10-24, one run), against about 0.05 s, 0.34 s and 3.6 s for the sliced close test it replaces, measured the same way; the slice stayed under the 1 MB CPU bound, so the bounded timed rows are not what pins the running index: the orch-behaviour self-test pins it with a semantics row over the walk and a row that counts the scan's calls into the walk on a nested glued shape and bounds the positions the walk reads by the command's length, so a call site reverted to the slice (no calls) and a walk body reverted to a slice copy (reads quadratic in the nesting depth) each fail that row. Interpreter start-up and a wait the interpreter cannot interrupt (a read from a hung mount, a long call into C code) fall outside that deadline, and whether the platform blocks a call whose hook it stops at its own timeout is unverified. Where SIGALRM, setitimer or the main thread is unavailable, or SIGALRM is blocked, the check runs with no deadline; cleanup that runs while the deadline unwinds is outside it."

[[hook]]
id = "orch-untracked-wait-loop"
rules = ["trkasy"]
platform = "claude-code"
event = "PreToolUse"
matcher = "Bash"
handler = "orch_untracked_wait_loop"
default = "block"
class = "b"
residue = "Registry-scoped deny companion to orch-truncation-guard's bare-& DENY-and-educate (defence in depth on the same PreToolUse Bash event): inert with no orchestration registry at the session cwd's git-resolved toplevel (it roots there only, with no ancestor walk and no union, so it is inert where git resolves no toplevel, or where the truncation guard's walk finds a registry above or beside the toplevel; it never reads AIQT_ORCH_REQUIRE_REGISTRY, so it stays inert on an absent registry in that mode too), and NOT lease-scoped (a bounded worker building a fire-and-forget poll is equally wrong). It DENIES only an UNAMBIGUOUS canonical shape recognized by a best-effort LEXICAL heuristic, a status-polling loop detached with a SINGLE bare '&' that is the command's FINAL operator: exactly ONE for/while/until loop closed by a bare-'&' 'done', whose body carries a 'sleep' command word and whose construct (the loop condition through 'done') carries a status probe. The probe test is a deliberate HEURISTIC, not an enumeration of every status tool: a 'gh' or 'curl' command word, a '--watch' token, or a token with an 'actions/runs' path component; a poll driven by another probe command is a disclosed miss, not a match. Reserved words (for/while/until/do/done) are recognized ONLY as the EXACT raw-unquoted token: because argv is quote-decoded and the command-word helper basenames, a bare '&' closing a command whose name was written quoted, or a path such as '/tmp/done', is NOT read as the loop terminator (it classifies 'none'), and an inner loop header that shares a segment with the outer 'do' is still counted from the raw-unquoted tokens rather than borrowing the outer loop's probe. The classifier is THREE-VALUED over the shared quote/redirect-aware lexer (_lex_command). It is 'none' on a full parse that is simply not the canonical shape: no bare '&'; a bare '&' that does not close a raw-unquoted 'done' terminator (for example 'sleep 30 &', a quoted or path 'done', or a 'done' carrying a redirect such as 'done >log &'); or a clean single loop lacking the sleep or the probe. It is 'indeterminate', emitting nothing and deferring to the truncation guard's generic bare-'&' DENY-and-educate on the same event, whenever the structure cannot be soundly attributed to one canonical loop: an unparseable construct (heredoc, here-string, process substitution, unbalanced quote, NUL, malformed redirect, or a '#' whose comment reading depends on context under the shared lexer's comment rule that the lexer cannot judge under both readings and whose command text lacks a word of the canonical shape, the one over-match stated below; such a '#' the lexer can judge is classified under each reading on its own, keeping the strictest answer, 'match' before 'indeterminate'); any subshell or C-style '(( ))' grouping (a '(' or ')' separator); more than one bare '&'; a command trailing the bare-'&' 'done'; a nested or extra loop keyword (a second for/while/until/do or a second 'done', counted from the raw-unquoted tokens); a conditional reserved word (if/then/elif/else/fi/case/esac or a '!' negation) anywhere in the loop span; or brace grouping ('{' or '}') in the loop span. This conservative posture is deliberate for a BLOCK guard: a false 'match' would strand a session, so every ambiguity but one defers to the truncation guard rather than denying here. The one exception is a DISCLOSED OVER-MATCH: behind a '#' the lexer cannot judge under both readings, a command whose text holds a loop header (for/while/until), 'done', an '&', 'sleep' and a probe gives 'match' and denies here even where those words sit in a comment or in quoted text that bash does not run as such a loop; the probe counts as present wherever that text holds quoting the fallback does not decode, since the classifier reads the --watch and actions/runs probes from decoded tokens. HONEST RESIDUALS (disclose-guard-residuals): detachment with no bare '&' in the outer command (setsid, disown, coproc, an aliased or function-renamed detacher, a nested bash -c '... &'), and a poll loop hidden inside a command substitution (opaque to the segment walk), are NOT caught and are silently allowed here; a nested loop, a conditional or brace-grouped body, a C-style for '(( ))', a multi-detach command, and a subshell-grouped or unparseable detach are 'indeterminate' here and left to the truncation guard's DENY-and-educate, not denied by this hook. Quoting is derived from raw character positions (argv_opaque flags an unquoted expansion/glob/brace/tilde but NOT plain quoting), so the raw-unquoted reserved-word checks read seg.raw directly. A payload with no tool_name is malformed, not another tool, and DENIES in every session (the shared missing-tool_name contract, checked before the registry scope as orch-truncation-guard checks it). Fail-open (silent allow) on a present non-Bash tool, no git toplevel, an absent registry, and an empty command (it runs nothing); in registry scope a missing, non-object or non-string command DENIES, fail closed, never a clean pass; a present-but-malformed registry leaves the guard active (deny-safe direction). The 'trkasy' rule text already carries the untracked-wait-loop clause; this hook enforces it and adds no rule. DEADLINE: main() gives this check 8 seconds (the 10-second hook timeout less 2), counted from before its payload read, and fails closed with exit 2 when it has not decided by then; on the worst shapes the hooks self-test times, up to 1 MB, its slowest call took about 2.08 s in-process on a 24-core host with Python 3.14.4 (one run on 2026-10-18, including the shapes whose comment reading depends on context). Interpreter start-up and a wait the interpreter cannot interrupt (a read from a hung mount, a long call into C code) fall outside that deadline, and whether the platform blocks a call whose hook it stops at its own timeout is unverified. Where SIGALRM, setitimer or the main thread is unavailable, or SIGALRM is blocked, the check runs with no deadline; cleanup that runs while the deadline unwinds is outside it."

[[hook]]
id = "orch-dispatch-ledger"
rules = ["trkasy", "recfst", "expbnd"]
platform = "claude-code"
event = "PostToolUse"
matcher = "Bash|TaskOutput"
handler = "orch_dispatch_ledger"
default = "warn"
class = "c"
residue = "A RECORDING substrate, not an enforcement point: it appends launch rows (a Bash call with run_in_background true, or a registry-declared dispatch tool) and completion rows (a TaskOutput read) to the machine-written dispatch ledger the stop guard consumes as its Gap-B oracle. It never blocks; a failed ledger write is surfaced as a non-blocking systemMessage, never swallowed, and a lease max_age_hours horizon that cannot be evaluated does not turn this recorder off: the row is recorded anyway and the cannot-evaluate is surfaced as a note (armed and surfaced, never a silent skip). Coverage is exactly the hooked tools: a launch through an unhooked tool is invisible (costing one spurious stop-guard deny), a completion that never passes through TaskOutput is invisible until the staleness horizon expires the row, and the task-id extraction from tool responses is best-effort field matching. Both blind-spot directions are bounded by staleness plus the resume audit, and disclosed at the stop guard."

[[hook]]
id = "review-dispatch-pin"
rules = ["vfxcmt"]
platform = "claude-code"
event = "PreToolUse"
matcher = "Bash"
handler = "review_dispatch_pin"
default = "block"
class = "c"
residue = "Registry scoped and inert without a review dispatch binding. It checks only a provably plain dispatch, decided on the raw characters by the shared plain-command specification: printable ASCII only, no shell character outside a single-quoted segment, a double-quoted segment holding none, words separated by spaces, and a bare, unquoted command word that is a declared dispatch command (compared without regard to case), so the dispatch is the only command of the call (no operator, no redirection, not even </dev/null), with the brief given once and last (a short brief option never in its = form). In a session a binding scopes, every Bash call that is not one plain command is withheld as UNVERIFIABLE, whatever it names, since a dispatcher name assembled at run time is not in the raw text, and so is a plain command that names a declared command other than as its command word; this refuses many harmless commands (a pipeline, a redirection, a variable, a glob, a mention such as grep of the command name). A plain command's word is a bare name, or a path whose directory is /usr/bin, /bin, /usr/local/bin or /usr/sbin, of a declared dispatch command or a program on an allowlist (git, opf, and programs that cannot run another, such as ls, cat, grep, cp, mv and rm); every other program (a shell, an interpreter at any version, find, sed, tar, sort, make, cd, an undeclared dispatcher) is withheld as well. A plain command whose program runs an argument or its configuration as shell text (a git alias set before the session, a package script) can still assemble a name the hook does not see. A brief path under /proc or /dev is withheld, since it can name a different file in the hook's process. A dispatch through an undeclared command, an alias, a function, a script that dispatches internally, a nested shell string, or a non-Bash tool is not seen and is allowed. A linked worktree is scoped by its main worktree's registry, located through git or, where git cannot run, through the raw .git and commondir files; a linked worktree whose main worktree cannot be located (a separated git directory, with git running or not) withholds every Bash call. A linked worktree of a bare repository (core.bare true) has no main worktree and is not withheld, and a failed git probe where the .git is a directory is no linked worktree, so a session with no registry anywhere is not withheld; a core.bare of true set in a separated git directory's configuration would end that withholding. A registry without a binding never ends the search: the session's registry, its main worktree's and every ancestor registry are read, nearest first, and the first binding on each way decides; each registry file is read on its own, so a local registry without a binding cannot hide the committed one's. In a bound session a plain command that names a registry file or the .aiqt directory is refused unless its command word only reads (cat, head, tail, wc, ls, stat, grep, cmp, diff); the directory counts as named through a value glued to a short option, a git pathspec after its magic, a quoted glob matching it (so a quoted * is refused too), a .. resolved against the cwd, or a subdirectory of it entered in a command whose words also climb with a .. component. A plain git command carrying an option or subcommand that runs a program, named in it or configured, is refused whatever it names, since that program's shell text can hold a name no word check sees: a global -p or --paginate, --ext-diff, --textconv, cat-file --filters, --show-signature, a %G placeholder (also with a modifier: %+G?, %-GG, % GK) or a %(signature) or %(*signature) atom in a --format or --pretty value or in a shortlog --group value (git reads a group holding % as a pretty format), a signature sort key (signature, -signature, v:*signature:grade, and any key holding the word, such as contents:signature, which is refused too) in a for-each-ref, branch or tag --sort value, grep -O or --open-files-in-pager, rebase -x or --exec, difftool -x or --extcmd, --upload-pack, --receive-pack, --exec (as archive and push take it), clone -u, -c or --config, send-email's --sendmail-cmd, --to-cmd, --cc-cmd, --header-cmd and --smtp-server, a global --exec-path=DIR, bisect run, submodule foreach and filter-branch, each long option abbreviated or not. A plain git command whose subcommand only reads (status, log, diff, show, rev-parse, ls-files, blame, grep, cat-file, or config in a read form), with no -c or --config-env global and no --output option, treats every word as data, so a registry name, a glob or a repository key in it is not refused, unless, for log, show and diff, an option asks for patch output (such as -p, -u, -U, -c, --patch or --cc), to which a textconv filter applies, which gets the full checks; options are read with their operands up to a -- ending them, so -Sconfig, --grep -c and -n 3 ask for none. A plain git command runs only a subcommand on a closed allowlist, matched exactly (status, log, diff, show, rev-parse, ls-files, ls-tree, cat-file, blame, grep, describe, shortlog, merge-base, rev-list, for-each-ref, show-ref, branch, tag, remote, config, add, rm, mv, commit, push, fetch, stash, switch, checkout, restore, reset, merge, rebase, cherry-pick, revert, worktree, clone), or is git alone or with only --version, --exec-path, --html-path, --man-path or --info-path; every other subcommand (instaweb, difftool, mergetool, send-email, filter-branch, bisect, submodule, daemon, web--browse, the credential commands, help, an alias, an external git-NAME program, one behind a global option the hook does not know) is refused, whatever it names. For an allowlisted subcommand, the options of its own that run a program, read from git SUB -h on git 2.53, are refused too: signing and signature verification (--gpg-sign and -S of commit, merge, rebase, cherry-pick and revert, tag -s, -u and -v, merge --verify-signatures, push --signed), a merge strategy (--strategy, merge and rebase -s), patch and interactive modes (-p and --patch of add, commit, checkout, restore, reset and stash, add -i, --interactive), --trailer, a --help after the subcommand, and a TRANSPORT::ADDRESS URL for fetch, push, clone or remote (a remote helper on PATH); options are read with their operands first, attached or the next word, so git log --grep --ext-diff searches for --ext-diff and is allowed; for status, log, diff, show, rev-list, shortlog, ls-files, blame, grep, add, rm, commit, checkout, restore and reset, whose options end at a -- (checked on git 2.53), a -- first after the subcommand or after a word that is no option ends that reading, so git diff -- --ext-diff and git log -- --show-signature name paths and are allowed, while for every other subcommand a word after -- is judged too (git stash show -- --ext-diff is refused). These refusals include harmless forms (git merge -s ours, git merge --verify, git stash show -p). A git command whose operand is spelled like an option after option-value consumption may be falsely denied (git stash push -m --patch, whose message --patch is judged as the patch option), and so may one with a long option, written without =, that the hook does not list as taking no value, since that option is read as possibly taking the next word, which is then judged and cannot end the options as a -- (git log --follow -- --ext-diff); this is a fail-safe refusal of a harmless form, never an allow. The editor (core.editor, sequence.editor), which git runs by default, is not refused, and neither are hooks and configuration written before the session: an allowlisted subcommand still runs a hook (pre-commit, post-checkout, pre-push and the rest, from .git/hooks or core.hooksPath) and configured programs (diff.external, filter and textconv drivers, core.fsmonitor, credential helpers, commit.gpgSign with gpg.program). Since git configuration can make any git command, a read among them, run a program (diff.external, a diff driver's command or textconv, core.pager, core.editor, core.fsmonitor, core.hooksPath, an alias, a filter or merge driver, credential.helper, gpg.program and more), every git config write, whatever the key, and every -c or --config-env global is refused in a bound session; a git config call reads only as --get, --get-all or --get-regexp with their operands, --list or -l, or one key alone, each after modifiers only (--local, --global, --system, --worktree, --file PATH, --blob BLOB, --show-origin, --show-scope, --type and the like), since git config takes a word after the key as its value (git config core.bare --local sets it), so newer git's git config get KEY is refused. A plain command that may write into a .git directory, a global or system configuration file (.gitconfig, gitconfig, git/config) or, as git --template, hooks is refused too, unless its program only reads or prints. Configuration already present when the session starts, set where the hook cannot see it, can still make a read run a program: git diff runs diff.external and textconv filters by default, and git status, diff and blame can run core.fsmonitor, filters, textconv filters and hooks, so a session whose configuration was prepared beforehand can still remove the registry through a read. A configuration file or hook written by a non-Bash tool, through a git directory that is not named .git, or by a git subcommand other than config that writes fixed keys (remote, branch, submodule) is not judged either. Any other git subcommand that names one of those keys or a separated git directory in any word is refused, a commit message naming core.worktree included. A command that changes the registry without naming it (a git command that writes or removes work-tree files, a checkout from a subtree, the removal of a parent directory, a copy of a directory whose contents hold a .aiqt directory, an archive or a patch, a script) is not predicted; instead, when the hook first sees a registry of the session repository or its main worktree bind review dispatch, it records the binding (its digest, the binding and the registry paths) in hook-owned state outside the work tree, GIT_COMMON_DIR/aiqt/review-dispatch-binding/KEY.json (KEY the sha256 of the worktree's identity, its git directory relative to the common git directory, paired with the registry's path relative to that worktree's top level, so a renamed or moved repository keeps its record; written without following a symbolic link, mode 0600), where no allowlisted git subcommand writes, and while a record exists a registry that is missing, unreadable, without a binding or binding differently withholds every dispatch as UNVERIFIABLE, naming the change and the record, until an operator restores the recorded binding or removes the record outside the session (the next check then records the binding in force); a record that cannot be read withholds every Bash call, and a binding that cannot be recorded withholds every dispatch. A process that removes both the registry and the record (an operator, a non-Bash tool, a plain command naming the record through a separated git directory not named .git) is not caught, and neither is a registry changed before the hook first saw it bind: a repository where no check ran while it was bound has no record, and where git cannot resolve the session repository no record is read. Ordinary git commands (add, commit, checkout, restore, reset) are allowed whatever the registry's git state; git clean is off the allowlist and refused. A linked worktree outside its main worktree, with no registry on its ancestors, is unscoped by a plain command that moves or removes its .git file (mv .git x), which is not seen either. Where git cannot resolve the session repository, or resolves one without a binding, the registry is looked for on the cwd's ancestors (so core.worktree cannot unscope a session); those registries are read in every session, and where one binds while the repository git resolves has a different registry that binds too (core.worktree moved onto another bound tree), the cwd's binding governs and every dispatch either binding declares is withheld; and with no resolved repository, or a resolved one that is not the registry's own (a nested repository, a moved top level), a found binding withholds every dispatch; the authority runs from the registry's worktree with every GIT_ variable removed from its environment; a dispatch is withheld while the environment sets a variable that moves the repository, index, object store or history git reads (GIT_DIR, GIT_WORK_TREE and similar), which the dispatch would inherit; an ancestor search that cannot be made withholds every Bash call. It checks the declaration and the repository, not what the worker reads: a brief that pins the right revision while the worker reads the ambient working tree or another path passes. Only a worker bound to a checkout of the pinned revision closes that gap. A brief marked as targeting a working tree, or as not a review, is allowed with a note and a guard-events row (where that append fails, the note says the row could not be written), so a misdeclared target bypasses the check. The authority is adopter code whose own correctness the hook cannot judge. A path the change needs that is missing from both the commit and the declaration (unless the brief names the worker draft that drafts it, below), an undeclared context file, uncommitted changes inside a checked-out submodule whose HEAD is at the pinned commit, a later commit that supersedes the pin, and edits to the brief or the tree between this check and the dispatch running are not caught. Where the binding declares the optional draft and skip labels (both or neither; one alone is a malformed binding), a revision brief may name the worker draft the commit applies, a git diff named by an absolute path and read once by this hook under max_brief_bytes (a path under /proc or /dev is read too, since the census is what the hook reads): the declared review set is then the paths the draft's headers name (diff --git, --- and +++, rename from and rename to, copy to; each hunk consumed by its own line counts, so a content line that reads as a header is content, and by git's exact no-newline marker only after the last line of each side of the file it marks, where its hunk header's count for each such side is met, in the section's last hunk; a section names at most one old and one new path, which its diff --git line names; a rename names both paths, a copy only its destination), less the paths the brief records as skipped, together with any declared path lines, so a drafted path neither committed nor recorded as skipped is refused and named as drafted. The draft is read conservatively, as the diff output git writes by default, so some forms git apply accepts but git does not write are refused (a localized marker, a context marker that only added lines follow, an added-line marker that more added lines follow, and a backslash line other than the exact marker right after a hunk's counted lines or their marker), while others are read (an added-line marker that a removed line follows, an empty line as context); after a hunk's counted lines, git's exact no-newline marker is read as the marker; any other line beginning with a backslash there is refused; a hunk header, a diff --git line or a --- line naming a path goes on to the next hunk or section; a diff --cc or diff --combined line is refused as a combined diff; a line that begins as another diff header is refused as outside a file section; a Content-Transfer-Encoding line naming an encoding other than 7bit or 8bit is refused as a transfer-encoded mailbox part; an inline submodule header (written by --submodule=log or --submodule=diff) is refused as a submodule shown inline; and any other line is read as prose. Whatever line follows it, each hunk is consumed by its header's counts, so no path is hidden. Among a hunk's counted lines, git apply reads a line beginning with a backslash and a space as a no-newline marker when it is at least eleven bytes long (counted in bytes before the line feed, so a short line of non-ASCII text can reach it) and rejects a shorter one as a corrupt patch; right after a hunk's counted lines it accepts any such line, reading one of eleven bytes or more as a marker and passing over a shorter one; the census refuses every such line other than git's exact marker in both places. Outside a file section a line is prose (the mailbox headers and message, the --- separator, the diffstat, the -- signature, a binary patch's encoded lines, blank and indented lines) unless it begins as a diff header or a no-newline marker does, and such a line (a +++ line, a hunk header, an extended header such as index or rename from, a binary marker, a line beginning with a backslash and a space, a diff command line other than diff --git) is never prose, wherever it stands, so a section cut short or mangled is not skipped unseen. A skip naming a path the draft does not name or one the commit changes, and skip lines with no draft, are refused; a second draft line, a relative draft path, an unreadable draft, an empty skip, a draft naming no file in a header, a section the census cannot read (a combined diff, a header path without git's a/ or b/ prefix in its place, as with git diff -R (a diff --git line naming b/ before a/ in a section with no --- line, which is a mode change, a binary change, an empty file, a pure rename or a pure copy, is refused with a reason naming the swap; a section with one is refused by its --- or +++ line's prefix), a --- line naming a path with no +++ line, a context-format section's --- line among them, a +++ line with no hunk, a section that ends with no hunk, binary marker, or creation, deletion, mode, rename or copy header, a rename, copy or mode header without its pair, a diff --git line naming two paths with no rename or copy header, ---, +++, rename or copy headers naming two old or two new paths or other paths than the diff --git line, an unreadable quoted name, a malformed or truncated hunk, a hunk line beginning with a backslash that is not git's exact no-newline marker after a context, removed or added line, a marker before the last line its hunk header counts for a side it marks, a hunk after a marker in its section, any other line beginning with a backslash right after a hunk's counted lines or their marker), a diff header or marker line outside a section, a header or hunk line that ends in a carriage return before its LF (a CRLF draft, or a hunk of a file whose lines end in CRLF, withheld with a reason naming CRLF), a mailbox part transfer-encoded other than 7bit or 8bit, and a submodule shown inline by --submodule=log or --submodule=diff are UNVERIFIABLE, each with a reason naming its cause; a mailbox message line that begins as a diff header or a no-newline marker does, or reads as an inline submodule header or a transfer encoding other than 7bit or 8bit, is refused with them, which can withhold a correct draft. The census reads paths, not content: a draft that names a file only in prose, a section indented from column 0 (prose, as git apply reads it), a partial apply inside one file (a hunk dropped from a file the commit still changes), and an apply whose brief names no draft are not caught. The census reads the draft the brief names, which is not proven to be the draft the commit applied: a trimmed copy, or a draft cut short between two complete sections, reads as a complete draft of fewer files. The working tree is compared by content, so index flags, the stat cache and filters cannot hide an edit, but a declared file whose checkout was converted (line endings or a filter) is refused. The whole check runs in a worker thread bounded by an 8 second budget and withholds the dispatch when it runs out, even when a read is blocked in the kernel. Submodule ignore settings are overridden for the changed set and staged state. A malformed binding or an unreadable registry refuses every Bash call, foreground or background, until an operator repairs it. Delivery acceptance is not checked. DEADLINE: main() gives this check 8 seconds (the 10-second hook timeout less 2), counted from before its payload read, and fails closed with exit 2 when it has not decided by then; on the worst shapes the hooks self-test times, up to 1 MB, its slowest call took about 0.02 s of wall-clock time in-process on a 24-core host with Python 3.14.4 (one run on 2026-10-18, including the shapes whose comment reading depends on context). Interpreter start-up and a wait the interpreter cannot interrupt (a read from a hung mount, a long call into C code) fall outside that deadline, and whether the platform blocks a call whose hook it stops at its own timeout is unverified. Where SIGALRM, setitimer or the main thread is unavailable, or SIGALRM is blocked, the check runs with no deadline; cleanup that runs while the deadline unwinds is outside it."

[[hook]]
id = "review-workdir-hold"
rules = ["rvwpin"]  # integ / review-in-flight-pins-its-artefact
platform = "claude-code"
event = "PreToolUse"
matcher = "Bash"
handler = "review_workdir_hold"
default = "block"
class = "c"
residue = "ADOPTER-ARMED and otherwise INERT: the hold is a marker file the dispatcher writes in GIT_COMMON_DIR/aiqt/review-holds/ before the reviewer starts and removes when the review returns or is abandoned; where no marker directory exists the hook is a silent allow, so adopters who write no markers see nothing, provided the payload's cwd is absolute: a cwd that is missing, relative, carries a NUL byte or names no directory that exists fails closed (UNVERIFIABLE) for every git command outside the read-only grammar and for an absent command, in the standalone preflight as in the composed hook, and so does any consulted directory whose git identity probe cannot answer (git could not be run, timed out, ran past the decision deadline, exited nonzero or on a signal with anything but its specific not-a-git-repository answer, a dubious-ownership fatal included, or exited 0 with a reply that is not EXACTLY the expected two newline-terminated path lines with the first line absolute, empty, one line, carrying extra lines, missing its final newline, an echoed option or a relative first line, which would otherwise build an invented identity whose absent marker directory reads as clean, or answered a core.worktree lookup with neither the set nor the unset reply or with an ambiguous one, an exit-0 reply that is empty or not newline-terminated, a value empty once its final newline is removed, or an exit-1 reply carrying output, each refusal naming the configuration cause rather than the identity probe; a candidate path realpath cannot even process is the same probe error): the probe failure is never read as 'not a repository', which would hide a live hold there (the holds are exactly what cannot be read, so this fires even where no live hold is known), while git's specific not-a-git-repository answer, matched at the start of one of the probe's own C-locale stderr lines (never as a substring a path in the message could echo), stays the inert allow; a hold-set candidate path is resolved PHYSICALLY first (os.path.realpath, so a '..' component and every symlink are applied the way the kernel would apply them, never stripped textually) and one that names no existing directory is consulted at its NEAREST EXISTING ancestor, so a directory the command itself creates first, a '..' spelling through it, and a write operand's file path, still read the markers of the repository each lands in; a candidate whose existence cannot be read at all is probed itself, failing closed; a PROCESS-RELATIVE candidate in any structural position (an operand, an option value, a -C, cd or pushd target, a --git-dir or --work-tree value, a GIT_ assignment, an ln operand: /proc/self/..., /proc/<pid>/..., /dev/fd/..., judged on the LITERAL components with a run of leading slashes collapsed first, so a '//proc' spelling and a '..' spelling a textual collapse would erase are read as the kernel reads them) cannot be resolved by the hook at all, its meaning depending on the process that opens it, so it counts as held and withholds the command outright (the read-only grammar still passes such a read), while one seen only by the raw-text absolute-path widening withholds while a hold is live, naming the process-relative cause; an ln segment carrying any option word other than -s, -r, -sr, -rs, --symbolic or --relative (another cluster such as -sf, -t or --target-directory, -T, -n, or an unknown option) leaves where that link lands or points unmodelled, so it withholds every git-word command in the same Bash call while any hold the rule can see is live, its operands still consulted under the modelled readings at once, for every operand count (every operand at the directory the segment runs from, every operand before the last, a target, also at the last operand and at the last operand's parent, and a two-operand link recorded for the rewrite even over an existing directory, since -n and -T read a link name that points to a directory as the name itself, not as a directory to enter), except that a -t or --target-directory value, the link's directory in that form, is never read as a target base because the option is not paired with its value (an allow residual listed below), and with no live hold in any consulted repository the decision is the inert allow, unchanged for adopters who write no markers; and a marker-directory path that exists but does not lead to a directory (a dangling review-holds or aiqt symlink) is malformed marker state, never absence. There is no host-wide view of holds: the hook reads only the markers of the repositories a command names or sits in. NO-ASK posture: block or note only. The rule is ONE-PLAIN-GIT-or-fail-closed, judged from the RAW command text, so shell grammar is never modelled construct by construct. Every command is judged against its HOLD SET: the repositories of the session cwd, of every literal path the raw text names after -C, --git-dir, --work-tree (the = and the separated form), cd, pushd or a GIT_ assignment, with one level of surrounding quotes stripped (quoted sh -c bodies, heredoc bodies and option values included), of every other literal ABSOLUTE path any segment's tokens carry (a bare operand, the payload after the first = of any token, or an attached short-option value), of every operand of an ln segment (the name of a link the command creates resolved against the directory the segment runs from; a relative TARGET of a plain symbolic link (-s without -r) resolved against the link's own directory, where the kernel resolves it, and that of a hard link or a -r, -sr or --relative link resolved against the directory the segment runs from, where ln itself opens it; the plain two-operand link recorded so a later candidate stepping through it is also consulted where the link will point, one rewrite level in text order, matched on the path's text; an operand no literal text resolves withheld while a hold is live; and any other ln option word withheld while a hold is live, as stated above), and of every literal ABSOLUTE path anywhere in the raw text (a quoted shell body or heredoc body included, a run of leading slashes collapsed to one, and a QUOTED span that is one whole absolute path read whole with its spaces; a path glued to a word is left to the token scan, and an unquoted path containing spaces is truncated at the space, a disclosed residual), every candidate resolved PHYSICALLY first, a missing one consulted at its nearest existing ancestor, the operand widening additive only (a write operand never becomes a resolution base), and each expanded through its configured core.worktree (a lookup that cannot answer or answers ambiguously, and a configured worktree that is process-relative, fail closed naming the configuration cause; a set value is kept byte-exact apart from its final newline, so a configured path carrying whitespace is consulted where git writes) (a repository-file core.worktree adds the configured worktree's repository to the set, reaching a mutation hidden behind a wrapper or override). While ANY repository in that set has a live hold, ANY command whose raw text carries a git word (the word git, the git of a git-<name> executable, the git ending an interpreter path such as /usr/bin/git), anywhere, inside quotes, substitutions, heredoc bodies and option values included, is denied (a git segment carrying a program-running form with a plain reason, see PROGRAM-RUNNING FORMS; anything else with an UNVERIFIABLE: prefix), EXCEPT one plain git segment: exactly one segment, no wrapper or reserved word before git (a bare command/exec/builtin/env/sudo prefix is peeled by the shared peel), the command word the literal word git, and no $(, backquote or heredoc operator anywhere in the raw text. That one plain segment passes only when it is the CLOSED LITERAL READ-ONLY GRAMMAR: no leading assignment of any kind (a GIT_CONFIG_*, GIT_EXTERNAL_DIFF or any other inline override can make a listed read verb run a program or re-point its repository), the literal word git first, no git global option at all except a literal -C directory (-c/--config-env, --git-dir/--work-tree, --exec-path, -P/--no-pager and every other global spelling drop the pass), a subcommand on the ENUMERATED read-only allowlist in a non-mutating form (a verb outside the allowlist, read-tree, checkout-index, bisect or sparse-checkout included, is treated as mutating, and git config edit is a write), and only options from the verb's CLOSED per-verb read-only set, which names nothing that writes a file (--output), runs a program named in the command or in configuration (-O/--open-files-in-pager, --upload-pack, --ext-diff, --textconv, --show-signature, tag -v, the --format/--pretty/--sort families, whose signature placeholders and atoms can run the signing program) or edits configuration; read-only git so judged is never withheld by a hold, everything else is judged against the hold set, and a command also passes when its target is CERTAIN and resolves outside every held worktree: only literal -C moves resolved physically (os.path.realpath), no --git-dir/--work-tree or -c/--config-env override, no GIT_ variable assigned, exported or unset in the command, none of the inherited variables GIT_DIR, GIT_WORK_TREE, GIT_COMMON_DIR, GIT_INDEX_FILE, GIT_OBJECT_DIRECTORY, GIT_ALTERNATE_OBJECT_DIRECTORIES, GIT_QUARANTINE_PATH, GIT_NAMESPACE, GIT_REPLACE_REF_BASE, GIT_GRAFT_FILE or GIT_SHALLOW_FILE set in the hook's own environment (EXACTLY that list: another inherited variable, the GIT_CONFIG_* family included, does not block certainty, a disclosed limit), and the resolved repository's configuration setting no core.worktree. A certain target that IS a held worktree is DENIED; worktree identity is compared by git's absolute git directory on physically resolved paths (never by path string); a certain target whose repository TOP LEVEL (rev-parse --show-toplevel, never the -C directory alone) ENCLOSES a held worktree on disk (a worktree nested under another, as with worktrees kept in a subdirectory of the main checkout) is denied for every command outside the read-only grammar, since a whole-tree mutation of the enclosing tree (git clean -ffdx removes a nested worktree the way the denied worktree-remove would, and run from a subdirectory a :/ or .. pathspec still sweeps the whole tree) can delete or rewrite the held directory, a safe over-deny for the forms that cannot reach it, and a target whose top level git cannot report (a bare repository, an unreadable tree) fails closed as UNVERIFIABLE while a hold is live; 'git fetch', 'git pull', 'git push' and 'git send-pack' whose certain target is any worktree of a repository with a live hold are denied outright (an explicit refspec reaches any ref of that repository, the held branch included, --update-head-ok lifts git's own checked-out-branch refusal, and send-pack is push's plumbing, limited only by the receiving side's own refusal, which configuration can relax); and 'git worktree remove/move' of the held worktree (by git's last-components name shorthand or exact path BEFORE any path resolution, since git prefers the registered name over an ordinary directory of the same name, and by resolved identity after it) and 'git update-ref' or 'git symbolic-ref' writes of its HEAD, its cross-worktree worktrees/<id>/HEAD and main-worktree/HEAD paths, or ANY ref in its symbolic HEAD chain (the checked-out branch included; a delete in any accepted spelling, the --del abbreviation, clustered forms such as -qd and -dm, and clusters whose m consumes a reason, attached or separated, included) are denied from any worktree of the repository, where update-ref's written ref is resolved through its own symbolic chain in the target repository unless --no-deref is given, so a different chain converging on the held branch is denied too; a worktree remove/move operand that resolves to no worktree, an update-ref or symbolic-ref option cluster whose written operand cannot be determined, an update-ref batch, and a written ref whose symbolic chain git cannot be asked about are denied as UNVERIFIABLE while a hold is live. PROGRAM-RUNNING FORMS: while ANY hold the rule can see is live (in the hold set, the session's repository or the target's repository), every git segment carrying a form that runs a program or shell text is DENIED with a plain reason, whatever its target and without resolving where the program runs: any leading assignment, any global option other than a literal -C, the curated program-option model (--upload-pack, --receive-pack, --exec, rebase -x, grep -O, difftool -x, submodule foreach, bisect run, filter-branch, signing options, a TRANSPORT::ADDRESS URL, --help and the rest), the subcommands mergetool, difftool, instaweb, web--browse, hook, shell, daemon, credential, send-email, imap-send, svn, verify-commit and verify-tag, for-each-repo (it runs a git command in every repository a configuration key lists, and an allowed command can write that key first) and maintenance (register and unregister write that very list, start and stop run a platform scheduler over it), the connection services upload-pack, receive-pack, upload-archive and http-backend (each runs in the repository its operand or request names; receive-pack runs that repository's hooks), every config form outside the read-only grammar, clone and init --template, and help --web, --info and --man; and a git segment carrying a FILE-WRITING PATH OPTION is denied the same way, whatever the operand names: checkout-index --prefix (it re-roots the whole checkout under any prefix), the --output of the diff and log families (diff, log, show, whatchanged, stash, the diff-files/diff-index/diff-tree plumbing, range-diff, rev-list, shortlog and reflog), archive -o/--output, format-patch -o/--output-directory, bugreport and diagnose -o/--output-directory, index-pack -o, fast-import --export-marks and --export-pack-edges, fast-export --export-marks, init and clone --separate-git-dir, credential-store --file, and 