# .aiqt/core/hooks/manifest.toml: the mechanical-enforcement manifest (GD-24).
#
# One [[hook]] per shipped control. `id` is a stable, unique control identifier (a kebab-case slug);
# `rules` names the corpus-id(s) the control enforces, and every `rules` element must resolve to a real
# corpus-id in .aiqt/core/rules/ (validated by tools/gen_hooks.py against gen_rules.load_corpus, the
# same no-orphan pattern check_mappings uses for standards ids). A rule may back more than one control
# (cnsdif has both a Stop layer and a PreToolUse diff-source layer), so the control key is `id`, not the
# corpus-id, and `rules` carries the corpus linkage. tools/gen_hooks.py renders this manifest into the
# shipped Claude Code plugin surface under plugin/aiqt-guardrails-hooks/ (hooks/hooks.json,
# hooks/scripts/aiqt_hooks.py, .claude-plugin/plugin.json) and drift-gates it in CI; this file and the
# scripts/ tree beside it are the single edit point, the generated surface is never hand-edited.
#
# Fields per [[hook]]:
#   id       a stable, unique control identifier (kebab-case slug)
#   rules    the corpus-id(s) this control enforces (a list: a control may enforce more than one rule,
#            and a rule may back more than one control)
#   platform "claude-code" (the only renderer so far; a neutrality dimension, not an abstraction)
#   event    a known Claude Code hook event (Stop, PreToolUse, ...); whitelisted by the generator
#   matcher  the tool-name pattern for tool events; OMITTED for non-tool events such as Stop
#   handler  the function in scripts/aiqt_hooks.py that implements the control (unique per control)
#   default  "block" (hard deny / exit 2) or "ask"; slice-1 controls are lexical and zero-intent,
#            so they ship at block
#   class    the EN-5 enforceability letter (a deterministic-gate, b hook-detectable, c partial,
#            d judgement), carried through so the surface traces to its enforceability claim
#   residue  REQUIRED, never empty: what this control does NOT catch, so the shipped surface stays
#            honest about heuristic coverage

[plugin]
name = "aiqt-guardrails-hooks"
version = "0.1.0"
description = "Mechanical enforcement of AIQT Guardrails rules for Claude Code, generated from the rule corpus."
author-name = "Jeff Posluns"
author-email = "jeff@posluns.ca"
homepage = "https://aiqt.ai"

[[hook]]
id = "diff-wall-stop"
rules = ["cnsdif"]  # trust / no-console-diff-dumps
platform = "claude-code"
event = "Stop"
handler = "diff_wall_stop"
default = "block"
class = "b"
residue = "This Stop layer is a NON-BLOCKING surfacing WARN (systemMessage, exit 0), not a hard block: by Stop time the wall has already rendered, and with no stop_hook_active field and no documented loop bound a hard block could wedge the session, so hard prevention lives in the PreToolUse diff-source layer instead. It catches only a unified-diff wall in the final assistant message of a turn: diff --git headers, paired @@ hunk headers, fenced diff/patch/udiff blocks (backtick or tilde) of 10 or more lines, and mixed +/- runs of 8 or more lines. It does not catch a diff dumped mid-turn between tool calls, side-by-side or word-diff renderings, or raw log or patch walls that carry none of those markers; a mixed +/- Markdown checklist can rarely trip the +/- run detector (accepted residual)."

[[hook]]
id = "diff-source"
rules = ["cnsdif"]  # trust / no-console-diff-dumps (PreToolUse layer A)
platform = "claude-code"
event = "PreToolUse"
matcher = "Bash"
handler = "diff_source_pretool"
default = "block"
class = "b"
residue = 'A best-effort QUOTE-AWARE LEXICAL check over the Bash command string: it is tokenized with a shell lexer (shlex, posix, punctuation-aware) that respects quotes and yields the shell operators ; | || && & ( ) as distinct tokens only when unquoted, then grouped into segments on those operators and on newlines, so a bare or subshell-grouped diff (git diff, ( git diff )) is caught even when chained after an allowed segment, and a separator inside a quoted argument no longer mis-splits. On a segment whose command word is git it denies a diff-producing subcommand: diff, show, and range-diff always; log, diff-tree, diff-index, diff-files with a patch flag (-p/-u/--patch); format-patch with --stdout; stash with a show subcommand and a patch flag. git global options that take an argument (-C, -c, --git-dir, --work-tree, --namespace, --exec-path, --super-prefix, --config-env), whose value is now its own token, are skipped so the value is not misread as the subcommand, and a leading inline env-assignment prefix (GIT_PAGER=cat git diff) is skipped so the command word still resolves to git. A diff-producer segment is ALLOWED in FOUR cases, each judged PER DIFF SEGMENT on that segment own tokens: (1) an INFO FLAG on the segment (--help or -h) is a help invocation, not a diff; (2) a SUMMARY flag (--stat, --name-only, --name-status, --numstat, --shortstat) with NO co-present patch flag (-p, -u, --patch, --patch-with-stat, --patch-with-raw), so a listing form escapes but git diff --stat -p (which still dumps the full diff) DENIES; (3) the segment LAST stdout redirect targets a REAL non-console file (a > or >> token whose target is an ordinary path). Last-redirect-wins: a segment may carry more than one stdout redirect and only the last one governs where stdout finally lands, so git diff >/dev/tty >/tmp/x diverts to a real file (allow) while git diff >/tmp/x >/dev/tty ends on the console (deny). (4) a PAGER PIPE, the segment piped by an unquoted | into a known interactive pager (less, more, most, pager), is interactive review, not a console wall. Cases 1 and 4 (--help/-h and the pager pipe) were restored in GD-24 fix round 7 after fix round 6 over-corrected them to DENY; a pipe to cat, tee, or anything else is NOT a pager pipe and still denies. A redirect whose winning target lands on a console/terminal or on stdout/stderr is NOT an escape, because the diff still reaches the console: ANY target under /dev/ (/dev/tty, /dev/pts/N, /dev/console, /dev/stdout, /dev/stderr, any /dev/fd/N) or under /proc/ (/proc/self/fd/1, any /proc/PID/fd/N), and the fd-duplication forms (>&1, >&2, 1>&2, 2>&1, &>, >&), which tokenize as their own >&/&> tokens and are never a stdout-to-file redirect (a stdout fd-dup as the last redirect also keeps the segment a console dump). There is NO comment escape: the fragile # allow-diff quote-parsing was removed in GD-24 fix round 6 and stays removed (an opt-in anti-diff-dump hook blocks console diffs, and the summary and file-redirect escapes cover the legitimate want-the-diff-not-as-a-wall case). On a shell parse error (unbalanced quotes) it fails SAFE: a conservative raw-string scan denies an apparent git diff-producer with no summary or redirect-to-file escape, never a silent-allow. It does NOT defeat deliberate shell escaping (git \diff), obfuscation or indirection (printf, octal, eval, base64), an alias or function that renames the tool, persistent shell/env/config state or a prior-state (a pager or config set in an EARLIER turn), the env VAR=x git ... command form (the literal env command) or the command git ... builtin, a diff produced by a non-git tool or assembled across commands, a file written then dumped with cat, or a diff emitted outside the Bash tool. Two exotic escapes are ACCEPTED, not fixed (neither is reachable by accidental assistant behaviour): a pathspec LITERALLY named --help after a -- separator (git diff -- --help dumps a file named --help, but the info-flag escape matches the --help token without distinguishing option position from pathspec position, so it allows); and a pager whose OWN output is piped onward (the pager-pipe escape confirms the next command word is a pager but does not follow what happens after it, so a pager feeding a further console dump still escapes). It is BEST-EFFORT: it targets the common/accidental case (the assistant own accidental violation), not an adversary determined to evade it.'

[[hook]]
id = "commit-identity"
rules = ["cmtidn"]  # integ / commit-identity
platform = "claude-code"
event = "PreToolUse"
matcher = "Bash"
handler = "commit_identity"
default = "block"
class = "b"
residue = 'A best-effort QUOTE-AWARE LEXICAL check over the Bash command string: tokenized with a shell lexer (shlex, posix, punctuation-aware) that respects quotes and grouped into segments on the unquoted shell operators ; | || && & ( ) and newlines, so a subshell-grouped commit (( git commit --author=... )) is judged too, and a trailer hiding inside a quoted -m message (-m "fix; Co-authored-by: Claude", which the old whitespace split broke at the ;) now lives intact in the single message token and is caught by a substring scan on that token. On a git commit-family segment (commit, merge, cherry-pick, am, rebase, revert, commit-tree) it flags a Co-Authored-By trailer inside any token or an --author value (--author=X or --author X) naming an AI; in ANY segment it flags a git-identity env var (GIT_AUTHOR_NAME/GIT_COMMITTER_NAME) or a user.name/user.email value (a -c user.name=X inline or a config user.name X pair) naming an AI, so setting the identity in a prior segment then committing is caught. git global options that take an argument (-C, -c, --git-dir, --work-tree, --namespace, --exec-path, --super-prefix, --config-env), whose value is now its own token, are skipped so the value is not misread as the subcommand. The BARE message body is deliberately NOT matched against the identity set: a legitimate message that merely mentions an AI product name (-m "fix claude adapter") records no AI identity, and denying it would be a false positive; only a trailer or an --author value records identity. On a shell parse error (unbalanced quotes) it fails SAFE: a conservative raw-string scan denies an apparent AI trailer/--author/env/config assignment, never a silent-allow. It is BEST-EFFORT: it targets the common/accidental case (the assistant own accidental violation), not an adversary determined to evade it. It does NOT defeat deliberate shell escaping (git \commit), obfuscation, an alias or function that renames the tool, or persistent shell/env/config state such as an AI identity persisted in git config in a PRIOR TURN (not the same command), a trailer staged into a message file and committed with -F/-t, a commit made outside the Bash tool or the session, or an AI product name outside the recognized identity set.'

[[hook]]
id = "abs-paths"
rules = ["abspth"]  # quali / absolute-paths
platform = "claude-code"
event = "PreToolUse"
matcher = "Read|Write|Edit|Glob"
handler = "absolute_paths"
default = "block"
class = "b"
residue = "Covers the file_path argument of Read, Write, and Edit (absolute by tool contract, so the relative-to-a-named-root carve-out never applies there) and the optional search-root path of Glob (which should be absolute). Honours the carve-out: a Glob pattern is legitimately relative to its named root and is never judged, and a Glob call with no path (the current directory as the named root) is allowed. Does not judge paths inside Bash command text, other path-bearing tools or parameters, or whether an absolute path points at the intended target."

[[hook]]
id = "git-discard"
rules = ["prsunc"]  # integ / preserve-uncommitted-work
platform = "claude-code"
event = "PreToolUse"
matcher = "Bash"
handler = "git_discard"
default = "ask"
class = "b"
residue = 'An ULTRA-CONSERVATIVE "ask unless PRISTINE and provably clean" guard (EN-6; supersedes the GD-41 coarse cut and the EN-4 fail-open-lexical hook) with THREE outcomes: ALLOW (exit 0 silent), ASK (permissionDecision ask, prompts the human), and DENY (permissionDecision deny, blocks). The `default` is "ask" because the recoverable ask is the characteristic behaviour; a confirmed whole-tree loss still DENIES. It fails open (ALLOW) ONLY at the true boundary - a command with no git command-word, no recognized lossy verb, or an unparseable command (shlex ValueError) that names no lossy verb keyword - because that is not a discard it can reason about. WITHIN scope (a recognized lossy verb: checkout/switch/restore/reset/clean/stash/rm/branch) the outcome is ASK UNLESS the command is a PRISTINE SINGLE BARE `git <verb>` invocation AND (for a lossy form) the whole working tree is PROVABLY CLEAN, or the LEADING opt-out is set, or the form is genuinely non-destructive, in which cases ALLOW. PRISTINE SINGLE BARE is judged PURELY LEXICALLY (the bash grammar is NEVER parsed): after optional leading KEY=value assignments the command is exactly `git <args>` as ONE simple command, and the RAW string carries NO shell metacharacter ANYWHERE, EVEN INSIDE QUOTES - none of `;` `|` `&` `<` `>` `(` `)` `{` `}` `$` backtick backslash `!` newline, which by construction also rules out `&&`/`||`/`|&`, EVERY redirection form (`>`, `>>`, `<`, `2>`, `&>`, `>&`, `n>&m`, a leading or interspersed redirect), and EVERY command/process substitution (backtick, `$( )`, `<( )`, `>( )`) - AND no shell reserved word (if/then/elif/else/fi/for/while/until/do/done/case/esac/function/select/`[[`/`]]`/`{`/`}`) AND a command word that is LITERALLY `git` (not a path like /usr/bin/git, and not a wrapper: command/exec/builtin/env/xargs/time/`!`/sudo/nice/timeout/nohup/sh -c/bash -c). ANY shell metacharacter, wrapper, redirect, reserved word, second command, or option the classifier cannot resolve makes the command not-pristine, and it ASKS WITHOUT consulting the probe (a deliberate safe over-ask): treating the mere presence of shell structure in a lossy-verb command as an ASK is how the guard avoids modelling shell semantics it cannot model soundly. Only a metacharacter-free `git <verb> <plain args>` reaches the probe. PROVABLY CLEAN means the ONE read-only probe - `git -c status.showUntrackedFiles=all status --porcelain --untracked-files=all` (config-forced so a repo-local status.showUntrackedFiles=no CANNOT hide an untracked file, 5s timeout, offline) - reports NO tracked change (staged or unstaged, either column) AND NO untracked (`??`) entry; an untracked file is uncommitted work a force-checkout/clean/reset can destroy, so it counts as DIRTY (only an ignored `!!` entry is treated as clean). When a pristine bare lossy form is on a provably-clean tree it ALLOWs (nothing the probe can see to lose); a pristine bare WHOLE-TREE-clobbering verb (reset --hard by effective last-wins mode, checkout -f with no pathspec, switch --force/--discard-changes) on a probed-DIRTY tree DENIES (the reason wording covers untracked-only-dirty too); everything else in scope ASKS. There is NO claim that any dirty-tree, compound, wrapped, redirected, or non-pristine form is proven safe: those are never ALLOWED, only ASKED. Verb forms (each ALLOWs only as a pristine bare command on a provably-clean tree, except the unconditional-allow and unconditional-ask forms noted): checkout - a branch-create (-b/-B/--orphan) WITHOUT force is an unconditional allow (git carries changes and aborts on conflict); -p/--patch, any pathspec/bare-operand form, or a forced branch-create is worktree-scoped; -f with no pathspec is a whole-tree clobber. switch - -f/--force/--discard-changes is a clobber; --merge/-m and --conflict[=<style>] are worktree-scoped (a three-way merge can overwrite local changes); a plain switch aborts on dirty and is an unconditional allow. restore - EVERY form is worktree-scoped, including --staged (it can erase staged-only content). reset - effective --hard clobbers; --soft is an unconditional allow (HEAD-only, index and worktree intact); --merge/--mixed/--keep/path-scoped/no-mode are scoped (index-changing); an ambiguous bare --m is scoped. rm - EVERY form is worktree-scoped, including --cached. clean - ANY non-dry-run clean is an unconditional ASK (untracked files are a different, unrecoverable asset, and the guard does not model whether the clean would fire, closing the clean.requireForce/-q/-i/clustered-flag edges); a -n/--dry-run judged before any `--` allows, BUT when an arg-consuming option -e/--exclude is present the `-n` is not trusted (it may be the exclude pattern) so the clean routes to its ASK. Destructive options are matched by unambiguous PREFIX (--for=--force, --patc=--patch, --del=--delete, --dis=--discard-changes, --har=--hard, --mer=--merge); a `--`/`--end-of-options` boundary is respected so an operand after it (git clean -f -- -nasty, git rm -f -- --cached) is a pathspec, never a safe-looking option. stash drop/clear ASK; branch -D/--delete --force ASK. A `git -C <dir> ...` or a GIT_DIR/GIT_WORK_TREE-prefixed form is pristine-lexically but names a worktree the guard cannot resolve to the session cwd, so it ASKS rather than trust a session-dir probe. An AMBIENT git target-redirect var in the process env (GIT_DIR, GIT_WORK_TREE, GIT_COMMON_DIR, GIT_INDEX_FILE, GIT_OBJECT_DIRECTORY, GIT_NAMESPACE) also forces ASK: the probe scrubs it and reads the real cwd repo, but the guard cannot scrub it from the ACTUAL command, which still inherits it and may act on a different dir or index, so the guard cannot prove the target IS the session cwd (a clean cwd probe never wins a silent ALLOW under such a redirect). This control is SIDE-EFFECTING (EN-6 recovery layer): before it ALLOWS or ASKS a snapshottable in-scope discard (checkout/switch/restore/reset/rm/clean) whose worktree it can resolve to the session cwd AND whose tree is NOT provably clean, it takes an INERT recovery snapshot of the uncommitted work and appends one line to an EXTERNAL per-user ledger, so a discard that is asked-then-approved OR wrongly allowed by a mis-parse is still recoverable (the hook fires once, with no post-approval callback). F-D EXPANSION: a NON-PRISTINE in-scope ASK (a compound, wrapped, or redirected snapshottable command) is ALSO snapshot-backed BEST-EFFORT against the SESSION CWD repo, so an asked-then-approved wrapped discard is recoverable too; because the redirected dir of a non-pristine command is NOT parsed, a command that changes into a DIFFERENT repository may be snapshotted at the session repo rather than the target (a same-repo cd is still captured by the whole-tree `git add --all`), and on snapshot fail the decision stays ASK. The snapshot uses a TEMPORARY GIT_INDEX_FILE outside the repo (seeded by copying the real index), `git add --all` (captures tracked-modified + UNTRACKED; ignored excluded), `git write-tree`, `git commit-tree` (parent = HEAD when present), and a CREATE-ONLY `git update-ref refs/aiqt-recovery/<utc-ts>-<pid> <sha>` with an empty expected-old value (a name collision FAILS the snapshot rather than clobbering a prior recovery ref). The snapshot writes only git objects and one private ref (plus a reflog entry for it when core.logAllRefUpdates=always, or when a reflog already exists for the ref) and does NOT itself touch the real index, worktree, HEAD, or any branch; the ref is invisible to plain `git status`, `git branch`, and `git log` but is reachable via `git log --all` / `git for-each-ref refs/aiqt-recovery` / `git show-ref` (a real ref, not hidden). Every real-state git call in this control takes an ALLOWLIST posture, scrubbing EVERY ambient GIT_*-prefixed var rather than enumerating a family (rounds 4-5 kept finding new members: GIT_CONFIG_*, then GIT_TRACE*, then GIT_ATTR_SOURCE), so an ambient decoy repo (GIT_DIR/GIT_WORK_TREE), an ambient `git -c` (GIT_CONFIG_PARAMETERS) config injection, an ambient GIT_ATTR_SOURCE attribute-source redirect, or an ambient GIT_TRACE that would make a read-only call WRITE a trace file cannot reach these calls; the scrub itself re-asserts GIT_NO_LAZY_FETCH=1 and GIT_TERMINAL_PROMPT=0 (so the scrub cannot strip the offline + non-interactive posture: no partial-clone lazy-fetch over the network, no prompting), the callers re-apply only the few vars they set themselves AFTER the scrub (GIT_OPTIONAL_LOCKS for the read-only probe, a temp GIT_INDEX_FILE for a snapshot), and any GIT_* the call genuinely needed but was scrubbed fails SAFE to a probe/snapshot failure (fail-to-ASK, never a silent allow). This closes the whole ambient-env class at once; the residual is NOT limited to on-disk config - it spans the non-GIT_ environment (HOME/XDG_CONFIG_HOME/PATH/TMPDIR), on-disk git configuration AND attributes (repo/global/system .gitconfig and .gitattributes), index and ignore state, submodules and embedded repos, configured hooks and filters, PATH-based git resolution, and partial-clone object availability, all read by git by design. RESIDUAL (the honest bound on "inert"): the inert guarantee is BOUNDED, not categorical, because git may ADDITIONALLY run a git-configured (repo, global, system, or command-scope) program during the snapshot whose effect is outside this guard control - a clean/process filter runs on `git add --all` (the CHECK-IN / clean direction, NOT smudge, which would run only on a restore/checkout), an fsmonitor hook runs on the `git status` probe, and a reference-transaction hook plus a post-index-change hook can run on the temp-index write and on the `git update-ref`; a clean filter can TRANSFORM the captured bytes, so the snapshot is NOT guaranteed byte-exact on a filtered repo; and a single overlaid tree cannot capture dirty content inside a SUBMODULE or an untracked EMBEDDED git repo (it stores only the gitlink) and flattens staged-vs-unstaged into ONE tree. The ledger is `${XDG_STATE_HOME:-$HOME/.local/state}/aiqt-guardrails/recovery.jsonl` (normally outside the repo, so a `git clean` cannot destroy it). The ledger write is BEST-EFFORT: normally one line per snapshot, but skipped when no per-user location resolves (absent HOME/XDG), when that path would resolve inside the repo, or when the directory or write fails. A written line records: utc ts, repo path, the triggering git VERB (never the raw command or file contents), the recovery ref, the snapshot sha, the covered classes (tracked/staged/untracked), and the exact restore command (`git checkout <ref> -- :/`, OVERLAY mode: it brings back modified and new content but does NOT re-apply a recorded file deletion; for an exact, deletion-inclusive restore use an isolated branch via `git switch -c aiqt-recover-<id> <ref>`). The snapshot is decision-INDEPENDENT (it does not trust the form-classifier), so it also fires on a genuinely-safe snapshottable form (reset --soft, plain switch, checkout -b, clean -n) on a dirty tree, an accepted over-snapshot; it is SKIPPED on a provably-clean tree, out of scope, and for stash/branch (a worktree snapshot cannot capture stash entries or branch commits). FAIL POSTURE: when a warranted snapshot cannot be made (probe/write error, an undecodable non-UTF-8 path, over a ~100 MiB changed-content size cap, a bare or broken git dir, or a temp dir resolving inside the repo) it NEVER becomes a silent allow of a not-provably-clean discard - a would-be ALLOW is DOWNGRADED to ASK ("no recovery point could be created"), and an already-ASK/DENY decision is left as-is with the failure surfaced. Retention is NOT handled here (refs accumulate; auto-pruning is a separate maintenance op, never inside PreToolUse). An explicit GUARDRAIL_ALLOW_DISCARD truthy assignment (anything but "", "0", "false", "no", "off") LEADING a pristine bare git command (the documented `GUARDRAIL_ALLOW_DISCARD=1 git ...` prefix, not the same string buried in an argument nor on a non-pristine/compound command) opts out to ALLOW (and, being an explicit override, short-circuits BEFORE the recovery layer, so an opt-out discard is NOT snapshot-backed: the operator takes responsibility for having saved the work); on an unparseable command the opt-out is honoured only at the very start of the string. HONEST RESIDUAL: being a LEXICAL hook it does NOT catch a git alias (config-defined; an inline `-c alias.<name>=...` now ASKS) or shell function that renames git or expands to a work-losing verb, a discard performed OUTSIDE the Bash tool, or persistent shell/config state set in a PRIOR turn. The probe ITSELF can be made to under-report dirtiness by git config or index state: an `assume-unchanged` or `skip-worktree` mark on a tracked file, or a `submodule.<name>.ignore` setting, hides real modifications from `git status`, so the guard can read a genuinely-dirty tree as provably clean and ALLOW a discard of that hidden work; and the recovery snapshot ALSO cannot capture assume-unchanged/skip-worktree content (it is not in what `git add --all` re-stages) nor IGNORED files (git add --all excludes them; an ignored file overwritten by a forced checkout or removed by `clean -x` is unprobed - to avoid asking on every repo carrying build artifacts - and unsnapshotted). Beyond that, being ultra-conservative it OVER-ASKS heavily - every compound, wrapped, redirected, or metacharacter-bearing command that names a lossy verb ASKS even when it would have been safe, and a pristine whole-tree clobber over-DENIES on a dirty tree even when the specific target would have lost nothing - an accepted, recoverable cost of never silently allowing a real discard.'
