# .aiqt/core/hooks/preview.toml: the preview-channel hooks manifest (the ledger source for .preview/ hooks).
#
# One [[hook]] per .preview/ hook linked into the enforceability ledger. Not every published preview hook
# that cites a rule has an entry (the three clock hooks, which cite timestamp-from-clock, have none), and
# nothing checks that this list is complete. A preview hook is a standalone
# file an adopter installs by hand (.preview/README.md); it is NOT rendered into the pack's plugin, so it has
# no handler in .aiqt/core/hooks/scripts/aiqt_hooks.py and no row in manifest.toml beside this file.
# tools/gen_enforceability.py reads this manifest, validates it fail-closed, and renders each entry into the
# enforceability ledger .aiqt/enforceability.json as a hook row carrying "channel": "preview" and its "file",
# so the ledger, the enforcement roadmap, and the register name the preview control without a second edit
# point; the register shows a rule linked only to preview hooks as "Preview only", not as enforced. When a preview hook is promoted into the plugin, its entry moves to manifest.toml.
#
# Fields per [[hook]] (all REQUIRED except matcher):
#   id       a stable, unique control identifier (kebab-case), unique across this file AND manifest.toml
#   file     the repo-relative .preview/<name>.py the hook ships as (a readable regular file on disk)
#   rules    the corpus-id(s) the hook cites (non-empty; each must resolve to a real corpus-id)
#   platform "claude-code"
#   event    the event on which the hook enforces (one row per control; other events it uses are named in
#            its residue)
#   matcher  the tool-name pattern, REQUIRED for PreToolUse/PostToolUse, forbidden otherwise
#   default  "block" or "warn" ("warn" on SessionStart, which cannot block, and on PreCompact, by this
#            pack's own choice: a preview hook does not refuse a compaction; never "warn" on PreToolUse)
#   class    "b" (hook-detectable) or "c" (partial); d is never authored on a control
#   residue  REQUIRED, never empty: what the hook does NOT catch, in agreement with the RESIDUAL COVERAGE
#            section of the hook's own docstring

[[hook]]
id = "constraint-reread"
file = ".preview/constraint-reread.py"
rules = ["cnstpr"]  # trust / standing-constraints-persist
platform = "claude-code"
event = "Stop"
default = "block"
class = "b"
residue = "PREVIEW CHANNEL ONLY: a standalone file installed by hand from .preview/, not part of the pack's plugin, and off until AIQT_CONSTRAINT_RECORD names the project's durable record. After a compaction reported by the platform's own markers (SessionStart with source compact, or PreCompact), it reminds the assistant of the record's Constraint lines on every user prompt, and refuses the turn end, while the record holds no Constraints-reread entry dated after the compaction and no more than 60 seconds ahead of the hook's clock (an entry dated up to 60 seconds ahead counts); the refusals are capped at 3 in a row, after which each later stop is allowed with a warning and no entry, unless the host sends stop_hook_active false on a turn end that continues a refusal. A refusal whose count cannot be saved is allowed with a warning, also on a Stop whose stop_hook_active field is explicitly false. The refusal count is kept in the hook's state file, so the cap holds when the platform's stop_hook_active field is absent or true; the count is reset to 0 only by a UserPromptSubmit event, a new compaction, or a Stop whose stop_hook_active field is explicitly false, never by an allowed stop, so without UserPromptSubmit registered and without that field every later stop until the next compaction is allowed with the warning (a missed refusal), and a state file that cannot be parsed (an unknown count) has the same effect from its first Stop. An explicit false is trusted as a new turn, so a host that sends it on a Stop that continues a refusal is refused at every such Stop (the cap does not hold). It proves only that an entry was written, not that the record was read or a constraint honoured; it names only constraints written in the record; a compaction without one of those markers (a host without the events, a hook not registered for them, a new session) is not seen; with no state location or no session key in the payload a compaction is reminded once and then forgotten; if its state location exists but cannot be examined, it keeps reminding with the compaction time unknown (a reminder no entry can clear, which says so) and allows each turn end with a warning; a state file over its size limit is read as a compaction at the file's modification time; a state file deleted after a compaction forgets that compaction, so the reminder and the refusals stop silently; concurrent hook runs are serialized by a lock file beside the state file, and a call saves only while that lock file and the state file are the ones it locked and loaded: a call that cannot take the lock within 2 seconds saves nothing (a compaction not recorded, a count not reset) and allows a turn end it would refuse with a warning that names the lock, and a call whose lock file is deleted or replaced while it holds it (also one moved away and put back after another call saved), or whose state file another call saved meanwhile, saves nothing and allows a turn end it would refuse with a warning that the refusal count cannot be saved (a deletion, replacement or save that lands in the few system calls between its last check and its write can still let one stale save through, and so can a save whose state file matches the loaded one in device, inode, size, modification time and change time, all five fields it compares, as when an inode number is reused within the filesystem's timestamp granularity); while the lock cannot be taken at all (a lock path that is a symbolic link or not a regular file, a lock file it cannot open, a filesystem that refuses flock, a platform without flock), it keeps no state, so a compaction is reminded once and then forgotten and, with no compaction saved before then, every turn end passes silently (a missed reminder and a missed refusal), while a compaction saved before then is still reminded and each turn end is allowed with a warning; a state folder moved away or deleted during a session forgets the compaction silently, like a deleted state file; once a record is declared every call creates the state directory and an empty lock file for its session, and nothing removes the lock or state files; an entry beyond the first MiB of the record is not seen, and a line cut at that limit is dropped; and the host clock is trusted."

[[hook]]
id = "rerun-pass-check"
file = ".preview/rerun-pass-check.py"
rules = ["rerunf"]  # integ / rerun-pass-is-still-failure
platform = "claude-code"
event = "Stop"
default = "block"
class = "b"
residue = "PREVIEW CHANNEL ONLY: a standalone file installed by hand from .preview/, not part of the pack's plugin. After a CI rerun command that succeeds (gh run rerun, glab ci retry: a simple command, in a small closed shell grammar the hook reads exactly, whose words hold gh, run and rerun, or glab, ci and retry, in that order at any positions), or a recognized check command that failed and then passed with the same words, each as written with its quoting (pytest 'a  b' and pytest 'a b' differ; blanks and comments between words do not count), and no recorded change between, it adds a note after the tool call, and at turn end it refuses a final message that presents a pass as conclusive without naming the earlier failure, at most 2 times in a row, after which each later conclusive stop is allowed with a warning and the reruns stay outstanding. The refusal count is kept in the hook's state file, so the cap holds when the platform's stop_hook_active field is absent or true; the count is reset to 0 only by a UserPromptSubmit event, a Stop whose stop_hook_active field is explicitly false, or a final message that names a disclosure word, never by a tool call or an allowed stop, so without UserPromptSubmit registered and without that field, after 2 refusals each later conclusive stop is allowed with the warning until a disclosure (a missed refusal). An explicit false is trusted as a new turn, so a host that sends it on a Stop that continues a refusal is refused at every such Stop (the cap does not hold). A state file that is missing (the first use of a session cannot be told from a lost one), unreadable or malformed gives an unknown refusal count, never a fresh 0; while the state file cannot be read or is malformed, a conclusive turn end, or one with no final message, is allowed with a warning that the state could not be read, and once it is missing, or a tool call has written back a lost or unreadable one, until one of those reset signals a conclusive turn end is allowed with a warning in place of a refusal only while a rerun seen since is outstanding; any other is silent, and a lost record of earlier reruns is silent (a missed refusal); with neither UserPromptSubmit registered nor stop_hook_active explicitly false, every refusal is replaced by that warning until a disclosure (a missed refusal). It recognizes only the listed CI rerun and check commands run through the shell tool. A rerun through a web page, a pushed empty commit, a runner's own retry option, an API call such as gh api .../rerun, a gh alias, or a changed command line is not seen. The shell reading is exact only for the closed grammar described in the hook's docstring, which reads a command of at most 8192 characters. Inside the grammar, a CI rerun is missed only when its words come into existence when the command runs, or bash runs gh under another name: an expansion that has a value ($c run rerun, with c=gh), a tilde expansion (~ run rerun with HOME=/path/to/gh, ~+ run rerun with PWD=/path/to/gh, or ~-; bash tilde-expands a word the hook reads as a plain ~), a pathname expansion (/usr/bin/g? run rerun), an alias, a shell function, a hashed command name (hash -p /path/to/gh x; x run rerun), or a command string handed to another program (sh -c '...', eval '...', ssh, xargs input, a script). The name rule ignores command position, so a simple command that names gh, run and rerun in order without running them is noted anyway: echo gh run rerun, unquoted or with each word quoted alone (echo \"gh\" \"run\" \"rerun\"), command -v gh run rerun, a function body that is defined but never called, false && gh run rerun 7; true (a false note, and a false refusal when the call succeeds). The hook reads an exit status only from an integer exit-code field of the tool response, where one is present, and that status is the whole call's: a later command, || true, a background &, a ! or an if or while condition can hide a gh call the server refused (HTTP 403), with or without pipefail set, and so can a pipe under default bash options, so gh run rerun 7 2>&1 | tail -5, gh run rerun 7 || true, gh run rerun 7; echo done, gh run rerun 7 &, ! gh run rerun 7 and if gh run rerun 7; then :; fi exit 0 and are kept as certain (a false refusal); with pipefail set, the pipe form exits nonzero and gets the uncertain note only, and the other forms still exit 0. The note for a CI rerun call that succeeds says only that the call was not reported as failed and asserts neither a rerun nor an earlier failure, and the refusal asks the assistant to state any earlier failure; neither it nor the warning given when a refusal is capped or its count cannot be saved asserts a CI rerun (each says only that a command naming one was not reported as failed). Every command outside the grammar is a possible CI rerun by construction: the hook could not parse it, so a CI rerun cannot be ruled out, and no search of its text decides otherwise; this includes echo \"$(date)\", a here-document, a line continuation, ${x:-y}, $'...', a redirection spelling not listed, and any command longer than 8192 characters. Each nonblank one gets a note, even when it fails (a blank command gets no note), so an off-grammar command that reruns nothing (a here-document commit, notably) gets a false note. Such a command, and a CI rerun call that fails (the rerun may or may not have started), is an uncertain rerun: its note says that a CI rerun cannot be ruled out and asserts no rerun and no earlier check failure, and it is never kept, so it never brings a turn-end refusal; a real CI rerun written outside the grammar, a failed call that did start a rerun, and an off-grammar check command that fails and then passes each get their note and no refusal (a missed refusal). An off-grammar command also counts as a change unless it fails, so a local rerun across it gets no local-rerun note of its own, and a check command outside the grammar is never compared as a check. Read-only is decided only inside the grammar: env with any argument, an assignment prefix (X=1 ls), a command word holding an expansion, and any output redirection (> >> >| &> &>>) whose target is not the unquoted word /dev/null count as a change; an input redirection (< <<<) and a descriptor duplication or close (>&2, <&0, >&-) write nothing. Also: a failed call is never counted as a change, so a fix made by a command that then failed reads as no change (a false note); a change made outside the tool calls it sees reads as no change (a false note), and a read-only-looking command with a side effect reads as no change; a setup command that is not read-only beside a check (source venv/bin/activate && pytest, an export; cd, pushd, popd, set and tee are not counted) counts as a change, so a later rerun of that check alone is not flagged; pass and fail are read from the event name and a few response fields, not the output; the Stop check reads only the final message against fixed phrase lists, so a claim worded otherwise passes, a claim after an unlisted negation is refused, any disclosure word clears the reruns wherever it stands, even inside a denial such as I did not rerun CI, whether or not the failure is recorded; it does not record or investigate the failure itself; with a state file that cannot be read or is malformed, a final message that presents a pass as conclusive without a disclosure word, or a payload with no final message, is allowed with a warning that the state could not be read, and any other final message is allowed silently; while reruns are outstanding, a payload with no final message is allowed with a warning that says so; with no state location at all (no session key in the payload, or no absolute state directory) nothing is kept and every stop is allowed silently; a refusal whose count cannot be saved is allowed with a warning, also on a Stop whose stop_hook_active field is explicitly false; concurrent hook runs are serialized by a lock file beside the state file, and a run saves only while that lock file and the state file are the ones it locked and loaded: a run that cannot take the lock within 2 seconds saves nothing (a tool call's change or rerun is not recorded, a prompt does not reset the count) and allows a turn end it would refuse with a warning that names the lock, and a run whose lock file is deleted or replaced while it holds it (also one moved away and put back after another run saved), or whose state file another run saved meanwhile, saves nothing and allows a turn end it would refuse with a warning that the refusal count cannot be saved (a deletion, replacement or save that lands in the few system calls between its last check and its write can still let one stale save through, and so can a save whose state file matches the loaded one in device, inode, size, modification time and change time, all five fields it compares, as when an inode number is reused within the filesystem's timestamp granularity); while the lock cannot be taken at all (a lock path that is a symbolic link or not a regular file, a lock file it cannot open, a filesystem that refuses flock, a platform without flock), it keeps no state, so it only notes after each tool call and, with no state saved before then, every turn end passes silently (a missed refusal), while the outstanding reruns of a state saved before then still bring a warning; a state folder moved away or deleted during a session is read as no state, so the next turn end passes silently (a missed refusal); nothing removes its state and lock files, one of each per session; a state file written by an earlier revision of the hook (without the current state version) is discarded and read as no earlier runs, so none of its flags arms a refusal and a local rerun across it is missed; a state file of the current version holding a flag of a kind this version never keeps is malformed, but the state file is trusted: a hand-edited state of the current version whose flags carry a prefix this version keeps still arms a refusal; a check run again with a word quoted another way ('a b', then \"a b\") is a different check (a missed note), and so is one with an operator spelled another way (pytest -q; ls, then pytest -q && ls, or a newline in place of the ;), while leading and trailing newlines and a final ; do not count; a check command whose words hold an expansion (a $ expansion, or an unquoted * ? or ~) is never compared with another run, so its fail-then-pass gets no local-rerun note (a missed note, never a false one); a command holding a tab, a newline or another control character (C0, DEL or C1) is shown in a note as one $'...' string with those characters escaped; and the hook fails open on its own failure (warn-only by design: an advisory hook must not block on its own failure): an internal error exits 0 with no output, an unreadable state file is read as no earlier runs (so a local rerun across it is missed) with an unknown refusal count (a Stop that reads it allows a conclusive stop with a warning that the state could not be read), though the current call's own CI rerun or possible CI rerun note is still given, and a note or refusal that cannot be written to stdout is dropped."
