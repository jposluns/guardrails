# .aiqt/core/core-budget.toml: the caps for the CORE render (tools/gen_rules_core.py, which documents the
# schema and every exit). Hand-maintained; the render reads it to judge its output, never to shape it.
#
# accepted is the log of every accepted budget, oldest first; the LAST entry is the budget in force. Each
# entry holds:
# kind: "seed" (the first entry only; it must equal CAP_SEED and PENDING_SEED in tools/gen_rules_core.py),
#   then "shrink". There is no other kind: the pending list and the caps only shrink.
# note: why the entry was made.
# entry-cap: the largest joined layer one entry may carry (the whole body of an unsplit rule, or the core layer
#   of a split one), in UTF-16 units, title and corpus-id excluded. The apex is never split and is exempt.
# trigger-cap: the longest detail-trigger, in characters.
# file-cap: the largest CORE render, in UTF-16 units; enforced once pending is empty, printed against until then.
# pending: the sorted corpus-ids of the rules over entry-cap that are not split yet.
#
# The gate reads this file as committed at the merge base of HEAD with main (origin/main, else main; read
# only, replacement refs and grafts ignored) and, where that merge base is HEAD itself (a run on main, or a
# HEAD main already contains), also at HEAD's first parent, read from HEAD's raw commit. Every entry
# committed at each commit read must stay here unchanged, every key compared, so deleting or rewriting such
# an entry is a finding. Against the budget in force at each, any id on pending that is not there, or any
# cap above it, is a finding, with no exception and whatever else changes (that comparison reads neither
# the seed nor the pin in the generator). Where a read fails (no git, a shallow clone, no main, no merge
# base, or HEAD on main with no readable first parent, a one-commit repository on main among them) the
# gate cannot evaluate (exit 2). An entry not yet on main is covered by the per-entry rules only. To lower a
# cap or drop a pending id, append a shrink entry; the gate compares each entry with the one before it, and
# every entry after the seed may only lower a cap or drop a pending id, and must change something. ACCEPTED
# in tools/gen_rules_core.py pins one entry (its position here, its caps and its pending), which this log
# must hold unchanged; moving it admits nothing. So a change the gate judges cannot raise a cap or put an id
# on pending above the commits it compares with: on a branch, the merge base with main; on main, HEAD's
# first parent. Each run compares that one step; it does not show the gate ran on every commit of main. An
# id that is split, now within entry-cap or the apex is a finding until a shrink entry drops it.

format-version = 1

[[accepted]]
kind = "seed"
note = "the caps and pending list as the rules-core renderer was added"
entry-cap = 400
trigger-cap = 60
file-cap = 56000
pending = [
    "abspth", "atmclm", "brnrot", "chgchk", "chkfcl", "citint", "clmobs", "cnsdif",
    "cnsprd", "cnstpr", "cntdef", "cntprd", "deccls", "dfdpth", "dscres", "estsep",
    "evgcmp", "exetgt", "expbnd", "gatdis", "gensrc", "goalfd", "grdinp", "kltwat",
    "mindep", "mstreg", "obsbeh", "prsunc", "prtwhl", "recncl", "reqstp", "rmvpth",
    "rvwpin", "secazn", "seccet", "seccry", "secegr", "secfcl", "secgci", "sechau",
    "secout", "secpin", "secprv", "secpsn", "secpth", "secres", "secrst", "secsec",
    "secspr", "secsup", "sectok", "secunt", "secupl", "septsk", "setcmp", "stgprm",
    "tmrrst", "trkasy", "tstamp", "tsthrm", "vfxcmt", "vrfdiv", "vrfdlv", "wowo01",
]
