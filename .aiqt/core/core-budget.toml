# .aiqt/core/core-budget.toml: the caps for the CORE render (tools/gen_rules_core.py, which documents the
# schema and every exit). Hand-maintained; the render reads it to judge its output, never to shape it.
#
# entry-cap: the largest joined layer one entry may carry (the whole body of an unsplit rule, or the core layer
#   of a split one), in UTF-16 units, title and corpus-id excluded. The apex is never split and is exempt.
# trigger-cap: the longest detail-trigger, in characters.
# file-cap: the largest CORE render, in UTF-16 units; enforced once pending is empty, printed against until then.
# pending: the sorted corpus-ids of the rules over entry-cap that are not split yet. It may only shrink: every id
#   must also be in PENDING_SEED in tools/gen_rules_core.py, and an id that is split, now within entry-cap or
#   the apex is a finding until it is removed here.

format-version = 1
entry-cap = 400
trigger-cap = 60
file-cap = 56000
pending = [
    "abspth", "atmclm", "brnrot", "chgchk", "chkfcl", "citint", "clmobs", "cnsdif",
    "cnsprd", "cnstpr", "cntdef", "cntprd", "deccls", "dfdpth", "dscres", "estsep",
    "evgcmp", "exetgt", "expbnd", "gatdis", "gensrc", "goalfd", "grdinp", "kltwat",
    "mindep", "mstreg", "obsbeh", "prsunc", "prtwhl", "recncl", "reqstp", "rmvpth",
    "rvwpin", "secazn", "seccet", "seccry", "secegr", "secfcl", "secgci", "sechau",
    "secout", "secpin", "secprv", "secpsn", "secpth", "secres", "secrst", "secsec",
    "secspr", "secsup", "sectok", "secunt", "secupl", "septsk", "setcmp", "stgprm",
    "tmrrst", "trkasy", "tstamp", "tsthrm", "vfxcmt", "vrfdiv", "vrfdlv", "wowo01",
]
