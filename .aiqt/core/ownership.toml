# --- concern-2: reserved-namespace / adopter-state patterns (ZERO tracked entries; NO-STRAYS exempt) ----

[[namespace-class]]
path = ".aiqt/pin.toml"
class = "adopter-state"

[[namespace-class]]
path = ".aiqt/pin-history.toml"
class = "adopter-state"

[[namespace-class]]
pattern = ".aiqt/migration/**"
class = "adopter-state"
note = "Includes the crosswalk, repoints, and the cutover journal directory (7.4, 9.3)."

[[namespace-class]]
pattern = ".aiqt/archive/**"
class = "archive"
note = "Hash-pinned per 8.2; never manifest-listed."

[[namespace-class]]
pattern = ".claude/rules/external/**"
class = "adopter-state"
note = "The documented adopter vendoring location; reserved, never a pack-immutable set-equality member."

# --- checkout byte stability (3.3): every concern-1 path is `text eol=lf` except these ------------------

[checkout]
binary = ["site/downloads/aiqt-skill.zip", "site/downloads/aiqt-skill-1.0.3.zip"]

# --- concern-3 hook: the adopter-installed extent is defined in the adopter-experience spec -------------

[adopter-extent]
authority = "adopter-experience-spec"
