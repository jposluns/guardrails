# .aiqt/core/instruction-budget.toml: the instruction-budget ratchet, read by tools/check_instruction_budget.py.
#
# PACK is what the pack makes Claude Code load in every session, counted in UTF-16 code units: every
# unconditional .claude/rules/**/*.md file with its frontmatter removed; the imports of every rule file, a
# conditional (paths:-scoped) one included, though a conditional file's own body is not counted; the
# RULES-INDEX managed block of CLAUDE.md and its imports; .claude/CLAUDE.md and its imports when it exists;
# and a modelled header for each loaded file (the loader's "Contents of <path> (project instructions,
# checked into the codebase):" line and blank-line separators, with the file's resolved path relative to the
# repository root, so the machine-specific absolute prefix is not counted). Only a whole-line HTML comment between
# blank lines outside fenced code is removed; every other comment is counted. tools/check_instruction_budget.py
# states the full grammar. The gate fails when PACK exceeds `ratchet`.
#
#   ratchet              the PACK figure enforced today. Lower it as the pack shrinks; raise it only with a
#                        reviewed reason.
#                        Raised 112222 -> 128358 when the counting rule changed, not the content: the gate
#                        began counting the modelled header of each of the 134 loaded files (16136 units;
#                        rule files 111862 and managed block 360 unchanged; no .claude/CLAUDE.md).
#                        Raised 128358 -> 128966 for content, with the maintainer's recorded approval of
#                        2026-10-04: a new second paragraph in security-seci-fail-closed (608 units; rule
#                        files 111862 -> 112470; headers 16136 and managed block 360 unchanged).
#                        Raised 128966 -> 129035 for content, with the maintainer's second recorded approval
#                        of 2026-10-04, for the measured extra: that paragraph reworded so the child-process
#                        route can pass (69 units; rule files 112470 -> 112539; headers and managed block
#                        unchanged).
#   ceiling              the target PACK figure; reported, not enforced. Its value predates header counting,
#                        which added 16136 units to PACK at the 112222 -> 128358 ratchet raise; it was not
#                        raised with it.
#   claude-code-version  the Claude Code build whose loading behaviour the gate models.
#   binary-sha256        the SHA-256 of that build's binary.
ratchet = 129035
ceiling = 90000
claude-code-version = "2.1.287"
binary-sha256 = "3920489a5109cff5786a1a392c25277408ff22bc796d5edb9c16a60e5a1718f0"
