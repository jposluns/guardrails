run without the self-test, and an addition landed together with a matching registry edit,
which review of registry changes catches. Section 9.1 stays untiled and unpinned: its
implementation-class paragraph is retired, since the base defines one implementation model (spec
16.1), so restoring one of its sentences there is red under the default entry, and the rest of 9.1
and additions to it stay unprotected. The quickstart's implementation-model sentences, the
opfiles.ai disclosure page's implementations item, and the adopt page's and adoption guide's
reference-tooling sentences are pinned sentence by sentence over
tag-stripped text, outside the keyword lint, each pin proven unique and deletion-red by the
self-test; each sentence of the disclosure page's retired fresh-only item, and the quickstart's
retired conformance-class sentence, is red there, so
the rest of those files and additions to them stay unprotected. The default entry also runs a
section 2 keyword lint over every pin of those tiled sections and those untiled pins: a pin
without MUST, MUST NOT, SHOULD or MAY is red unless the registry marks it descriptive (_D, red
once a marked pin gains a keyword); the
self-test proves synthetic cases, flips every marker and every keyword pin red, and reverts
the registered keyword rewrites red. The lint reads the registry marker, not the meaning, so a requirement
wrongly marked descriptive stays green, which review of registry changes catches. The
self-test also checks
constructors, discovery reservations and inert writer defaults, plus in-memory boundary fixtures:
legacy (homes 1) behaviour kept for every store until activation (grading, detect rows, messages,
report roster and residuals, and the legacy journal engine's apply and recovery), activation gated
on both homes 2 and spec_version 2.0.0 and, with homes 2 activated only for the fixture, classifier
and detect set equality, unmanaged collisions, staged-run grading, per-bundle evidence inventory
membership (no phase inventory substituting for inventory.toml), size and digest reconciliation,
capability-API journal target refusal, open and terminal recovery ordering, capability refusal and
missing recovery state, and anchored preview exclusions. These fixtures mock filesystem
observations; they do not certify filesystem races, crash recovery, power-loss durability, live
adopter state, or the whole input space. Evidence membership relies on immutable per-bundle
inventories; deleting a whole bundle, inventory and payload together, requires independent
history to detect. Journals are deliberately outside doctor coverage, except that on homes 2 doctor
lists the id reservation home of each kind there and reads each reservation file's bytes, for the
