# --- undeniable secsec link -----------------------------------------------------------------------------

[[gate]]
id = "secrets-scan"
script = "tools/check_secrets.py"
rules = ["secsec"]
platform = "ci"
default = "block"
class = "c"
residue = "A pattern scanner for hardcoded credentials: it catches recognizable provider-token prefixes (now including Google, Stripe, GitLab, SendGrid, npm, PyPI upload, and Slack webhook shapes), assignments of a literal to a credential-named variable, and (GD-121) high-entropy literals of 40 or more characters assigned to a generic credential-like name (Shannon entropy at least 3.5 bits per character judged on the token's first 150 characters, letters and digits required, placeholders and environment lookups excluded, metadata-named variables excluded). It still misses a keyword-free high-entropy string (the opaque-name class, R1, the measured residue of 2026-08-08 shared with gitleaks), a generic-keyword value of 12 to 39 characters that gitleaks can flag below the local 40-character floor (R3, a deliberate noise-control choice, confirmed against pinned gitleaks 8.30.1), a real secret held under a metadata-named variable such as public_key or key_path (excluded by design in the safe direction, where CI still catches it, R4); a deferred provider family (a Twilio-class short-prefix-over-hex or a Telegram bot token, left to gitleaks, R2); a secret split across lines or assembled by concatenation, an encoded secret, or a secret in a binary (R5); and an unquoted value that begins with an environment-lookup root such as process.env., treated as a reference not a literal (R6). Detection here is a compensating control, never a substitute for keeping the secret out of the repository in the first place."

# --- remaining gates: some linkage-arguable (rules = []), some gensrc-cited; class a (total) or c (partial) per the totality test above ---

[[gate]]
id = "leaks"
script = "tools/check_leaks.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "A best-effort denylist scan for known internal host specifics and codenames. It covers a recognizable SUBSET of the leak surface: per its own docstring (tools/check_leaks.py) deliberate obfuscation (mid-word splits, HTML entities, zero-width characters) can evade the hashed codename layer, binary and archive contents are not unpacked, and the structural patterns are scoped to this host's layout, so a novel or obfuscated private string outside those patterns slips it (class c, partial, the check_secrets archetype). Its linkage to a single corpus rule is arguable, so none is claimed here; an empty rules list is an open question, not a coverage statement."

[[gate]]
id = "msg-leaks"
script = "tools/check_msg_leaks.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "A denylist scan for known private strings and host specifics in the commit-message and PR-metadata channels the file leak gate does not reach: the commit messages in a change's range, the PR title and body, and the head ref. On a public repository it is post-publication DETECTION, not prevention, and cannot un-expose already-pushed text. Its coverage depends on the CI event running at all: a commit carrying a CI-skip annotation, or a pull request in an unmergeable state, can suppress the run, and a description edited after the check is re-scanned only where the workflow subscribes to edit events. The post-merge run scans the landed commit messages, not the pull-request description, so a value present only in a description that never enters the final message is outside that path. The hash layer is evadable by deliberate obfuscation; file contents (the file leak gate and gitleaks own those), reviews and comments, and author identity are out of scope. Its linkage to a single corpus rule is arguable, so none is claimed here."

[[gate]]
id = "portability"
script = "tools/check_portability.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "It checks that the shippable surface can land on a stranger's machine unchanged: no operator identity outside its attribution, no repo-operational vocabulary, no exemption markers, no unscannable file classes. It is a best-effort deny-list over an open vocabulary: a novel non-portable term or an unlisted operator-identity form outside the recognized set can slip it, so it covers a recognizable subset of the non-portability surface, not the whole of it (class c, partial). Its linkage to a single corpus rule is arguable, so none is claimed here."

[[gate]]
id = "derived-command-parameters"
script = "tools/check_derived_command_parameters.py"
rules = ["grdinp", "exetgt"]
platform = "ci"
default = "block"
class = "c"
residue = "An adopter-parameterized scan that flags a hardcoded LITERAL value at an adopter-declared command sink (a command word plus an option name in a declared command-surface file), so a reusable command derives its target-specific parameter rather than baking one in (grdinp input-soundness, exetgt templated-target re-verification). It ships NO command, option, repository, or path of its own: with no .aiqt/derived-command-parameters.toml it is NOT APPLICABLE, and a present but unusable configuration fails closed. It covers a recognizable SUBSET (class c, partial): it proves only that the declared sink is NON-LITERAL (a reference to an allowed variable), never that the variable resolves at runtime to the correct target, which is exetgt's runtime confirmation outside any static scanner. Its lexical scanner does not model pipelines and grouping precisely, credits no command substitution as derived, matches a command by basename only (an alias, a function, a wrapper, or a dynamically constructed command word slips it), and reasons only over the option forms and reference-variable names the adopter declared, so an undeclared sink, an obfuscated or constructed literal, and a forge or tool the configuration does not name are outside it."

[[gate]]
id = "dashes"
script = "tools/check_no_dashes.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "It flags literal en and em dash characters in each scanned text file. It is total over the project's own trusted, well-formed UTF-8 content, but covers a recognizable SUBSET of the dash surface (class c, partial): an HTML entity such as &ndash; or &#8211; renders as a dash yet is not decoded, and a file that is not valid UTF-8 is skipped wholesale (a fail-open the sibling check_links.py instead treats as a finding; recorded separately for hardening). Its linkage to a single corpus rule is arguable, so none is claimed here; an empty rules list is an open question, not a coverage statement."

[[gate]]
id = "links"
script = "tools/check_links.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "It checks that internal document links in Markdown files resolve to a real target. It covers a recognizable SUBSET: its matcher recognizes inline-style links [text](target) only, so a broken reference-style link [text][ref] is not resolved (class c, partial). Its linkage to a single corpus rule is arguable, so none is claimed here."

[[gate]]
id = "site"
script = "tools/check_site.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "It checks the published site surface for integrity (dashes, link and anchor resolution, basic HTML validity and tag structure). It covers a recognizable SUBSET: per its own docstring (tools/check_site.py) the subtrees of svg/math and of textarea are not structurally validated and links and ids inside them are not resolved (a self-described deferred coverage gap), so a defect inside such a subtree passes (class c, partial). Its linkage to a single corpus rule is arguable, so none is claimed here."

[[gate]]
id = "overclaim"
script = "tools/check_overclaim.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "A negation- and title-aware best-effort deny-list of marketing (site-only) and release-integrity (all-surface) overclaim vocabulary over site HTML, the hand-authored repo prose roster, and every registry-enumerated textual generated output. A banned release-integrity term flags regardless of tense and is cleared only by a directly-adjacent honest denial or a third-party control-title that wholly contains it. For the enforcement register page the gate proves, BY CONSTRUCTION, that every corpus- or ledger-derived CONTENT string the generator emits verbatim is printable ASCII and marketing-clean: the register generator single-sources that set (its page_content_strings enumerator, sitting beside the render functions and the shared field list they both iterate) and this gate consumes the identical set, so the checked strings cannot fork from what the page renders. The set spans the rule title, the corpus id, each mechanism reference id, the mechanism metadata the page shows verbatim (platform, default, entry point including a hook matcher, class), each mechanism residue, and each pending rule description. Over every such string a shared reject runs the plain marketing patterns AND a printable-ASCII allowlist on the exact raw bytes before any whitespace collapse (permitting only the printable ASCII range plus space, tab, newline, and carriage return), so any non-ASCII codepoint is refused on the bytes the page ships: an invisible or combining laundering character (a zero-width space, a combining grapheme joiner, a variation selector, or a non-ASCII space) and a confusable homoglyph (a Cyrillic or Greek lookalike letter that renders as an ASCII letter but evades the marketing scan) are both rejected. DISCLOSED RESIDUAL: the page CHROME (the shared, hand-authored, version-controlled CSS and JS the shell brings in, which is NOT generated from the ledger) is NOT proven marketing-clean by construction; marketing injected through that chrome rests on code review plus the file-content gates (byte-canon, dash, and leak scans). As an overlapping best-effort layer, NOT a by-construction closure, the gate also scans the register page static asset closure, extracting it with a real HTML parser (so unquoted and HTML-entity-encoded tag attributes are read, not missed by a quoted-only regex): the page inline style and script bodies, every inline style attribute, and the same-origin CSS and JS it links. Over that closure it strips CSS comments, decodes identifier escapes, concatenates the adjacent strings of a content value and decodes their escapes, resolves a content attr(NAME) against the named page attribute, follows the same-origin CSS @import graph bounded by a visited set so a cycle terminates, and decodes and scans a data: stylesheet or a data: script body (base64 or percent-encoded), bounded in encoded UTF-8 bytes and failing closed on a malformed encoding, an oversized payload, or an asset over the pre-read ceiling. This chrome layer is best-effort and does NOT close the CSS or HTML injection surface by construction. Known static vectors it does not catch are disclosed here, not claimed caught: a content value whose interior semicolon or brace truncates the extractor; a content value assembled through a var() custom-property indirection; generated content via content open-quote or content url() of a data image; an escaped close-paren inside an @import url() target; a stylesheet gated only by a css filename rather than the html stylesheet sink; and nested HTML in an iframe srcdoc. Runtime JS DOM construction of text, an encoded payload buried in an arbitrary JS string whose location and encoding are not statically declared (distinct from a data: URL, which is decoded), and a genuinely off-site (cross-origin) asset a static gate does not fetch are out of static reach as well. The deny-list itself is best-effort and cannot catch a novel paraphrase, the third-party title allowlist and the adjacency guard are maintainer-calibrated, and it polices wording, not whether an underlying mechanism works. Its linkage to a single corpus rule is arguable, so none is claimed here."

[[gate]]
id = "license-qualification"
script = "tools/check_license_qualification.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "A best-effort literal matcher over the public-facing surfaces (site and opf/site HTML, docs Markdown, disclosure.toml, DISCLOSURE.md, README.md). It is case-INSENSITIVE, whitespace-collapsed, and VERB-ANCHORED: class 1 flags a whole-project claim only when one of the verbs open source, licensed, published, or released governs 'under the Apache License 2.0', and clears it only when a vendored-third-party qualifier marker sits in the claim's SAME SENTENCE, on either side of it; markdown-linked forms such as 'under the [Apache License 2.0](LICENSE)' are matched too. Class 2 flags an AIQT or AIQT Guardrails mark called registered: the U+00AE registered symbol including spaced and multi-symbol forms, or a subject-anchored 'AIQT is a registered trademark'. It is a calibrated literal matcher, not a paraphrase detector: a reworded whole-project claim, a qualifier marker present but asserting no genuine exception, or an indirect registration misstatement is not caught. Its linkage to a single corpus rule is arguable, so none is claimed here."

[[gate]]
id = "footer"
script = "tools/check_footer.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "It checks that every site/**/*.html outside an explicit allowlist carries a /disclosure link INSIDE its <nav>, failing closed if a non-exempt page lacks it or the allowlist drifts (B-10 repurposed this gate from footer coverage to nav coverage; the filename is retained as its gate identity). It is total over the project's own trusted, well-formed rendered nav markup, but covers a recognizable SUBSET (class c, partial): a /disclosure anchor inside an unrendered <template> or a hidden nav satisfies the structural test without being real navigation, and its attribute reader takes the last of a duplicated href (the first-wins fix applied to check_newtab in task-9 is not yet carried here; recorded separately for hardening). Its linkage to a single corpus rule is arguable, so none is claimed here."

[[gate]]
id = "newtab"
script = "tools/check_newtab.py"
rules = []
platform = "ci"
default = "block"
class = "a"
residue = "It checks that every external site link in site/**/*.html (HTML <a href>, SVG <a xlink:href> when plain href is absent, and <area href>) opens in a new tab with a noopener rel, and flags any <base href> fail-closed. It is total over that hyperlink-element surface: it decodes HTML entity references in attribute values and applies WHATWG URL normalization with fail-closed external classification (first-duplicate-attribute semantics), so an entity-encoded or obfuscated href is still decoded, inspected, and classified. It does not cover navigation outside that http(s)/protocol-relative-href surface: a javascript: or other non-http href, script-driven navigation, and declarative redirects via meta refresh, <form action>, or <button formaction> are not inspected (a surface-boundary declaration, not an in-surface evasion of the hrefs it examines), so class a holds on that honest boundary. It is a site UX and reverse-tabnabbing-safety invariant, not a corpus-rule linkage, so none is claimed here."

[[gate]]
id = "site-versions"
script = "tools/check_site_versions.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "It checks that every `AIQT X.Y.Z` product-version token on the site's HTML pages names a currently-valid version (the released pack version read from changelog.toml, plus a hand-maintained in-development allowlist), so a version left stale after a release bump is caught and the release process is forced to update the site. It covers a recognizable SUBSET (class c, partial): it matches ONLY the `AIQT X.Y.Z` pattern, so it does not catch a stale version in another phrasing - some of which are MATERIALIZED current references that would go stale at the next bump (the dev-track `(1.1.0, in development)` in titles, `1.0.0 chat`/`1.0.0 pack`, `the 1.0.0 release` in the evidence-page meta), a bare number with no AIQT prefix, or a third-party framework version - and it also does not catch a token separated from AIQT by a MARKUP TAG (`AIQT <strong>1.0.0</strong>`) or a SOURCE-LINE WRAP, an HTML entity, a `v` prefix, a different case, or a 4th-segment, pre-release, or build-suffixed form such as `AIQT 1.0.0.0`, `AIQT 1.0.0-rc1`, or `AIQT 1.0.0+build` (unmatched, out of scope; no gate scans the site for those malformed forms), while a leading-zero form like `AIQT 01.0.0` IS matched and flagged as unknown (the safe direction); and it enforces set-membership (is the version currently valid) rather than per-page context correctness. A symlinked page fails closed, but a symlinked directory inside site/ is not descended by the shared walker (a committed symlink anywhere is itself rejected repo-wide by the manifest gate, gen_manifest). The in-development version is a hand-maintained constant until it ships in changelog.toml. Its linkage to a single corpus rule is arguable, so none is claimed here."

[[gate]]
id = "install-page"
script = "tools/check_install_page.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "A static tripwire over site/install.html, site/js/install.js, and site/styles.css. It checks that the five family sections are present and statically visible (no hidden, inert, aria-hidden, visually-hidden class, or inline display:none/visibility:hidden style on a section), the picker links plus the visible #install-picker group, the single hidden reset, and the announcing #family-status region (aria-live polite/assertive, or role=status not overridden by aria-live=off) are present with no pre-set filter state; that install.js is an EXECUTABLE external script (not commented out, no non-JS type attribute) whose src BASENAME equals install.js (a suffixed path like /js/install.js.disabled is rejected) and site/js/install.js is non-empty and carries the real picker logic in CODE (JavaScript // and /* */ comments are stripped before the token test, so a comment-only file does not count), with no inline script or on* handler in the picker or family-section subtrees, scoped by structure (the .platform-actions group, #install-picker, or a data-family-section) rather than by an id being present; and that the guarded html[data-family] hide-all rule plus all five per-family html[data-family=<fam>] reveal rules are present, each targeting a <section> tag specifically (section[data-family-section]; a wrong-tag selector like x[data-family-section] does not count), each guard and its section in the SAME non-negated selector with a real display declaration matched at a property boundary (a --custom property, a :not()-negated guard, or a guard and section split across comma selectors do not count). ENFORCEABILITY (class c, partial): this gate catches ACCIDENTAL regression by a maintainer editing the site; it is NOT adversarial-grade. It is deliberately NOT a CSS engine or a browser, so a determined author can still hide a family section past it by construction, for example via a hidden ANCESTOR or wrapper element around a section, exotic inline or stylesheet CSS hiding a static regex does not model (opacity:0, height:0, transform:scale(0), clip-path, and the like), a custom clip/opacity class, hiding by id, a NEW unguarded stylesheet rule beyond the guarded ones, or a hidden #family-status element; and it does not execute install.js to prove the picker logic is correct, only that the expected tokens are present. That residual class of static-check bypass is unbounded and is DISCLOSED here, not claimed closed; it is left to review and the cross-family QA. Its linkage to a single corpus rule is arguable, so none is claimed here."

[[gate]]
id = "sized-instructions"
script = "tools/check_sized_instructions.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "It checks the three hand-authored sized instruction condensations (aiqt-instructions-8k/5k/1_5k.txt) against their character caps, counted with wc -m semantics from the raw decoded bytes so a CRLF file is not undercounted; that a single well-formed 'Version X.Y.Z' line agrees across the condensations, the authoritative skill version, and the generated full instructions file. A version token is clean ONLY when its three dotted numeric segments are followed by horizontal whitespace, the end of the line, or a single sentence period then whitespace/EOL: a 4th dotted segment (1.2.3.4), a non-numeric 4th segment (1.2.3.foo), a prerelease or build suffix (1.2.3-alpha, 1.2.3+build), and a trailing alphanumeric (1.2.3rc1) are all rejected, and any line that opens a 'Version' declaration but does not parse cleanly is a fail-closed finding even when a valid line sits beside it (so a malformed line cannot hide next to a good one). It also checks they match a recorded SHA-256 of that generated source, failing until a maintainer reconciles them and re-blesses with --update, and fail-closed (exit 2) on a missing, unreadable, invalid-UTF-8, or malformed-version input. ENFORCEABILITY (class c, partial): this gate catches ACCIDENTAL regression by a maintainer editing the site; it is NOT adversarial-grade. Residuals it does NOT catch: because the condensations are hand-authored it cannot judge whether their trimmed prose faithfully preserves the standard's meaning; and the --update reconciliation check is a git-diff heuristic that proves only a condensation 'changed vs HEAD', not that the edit semantically reconciled it (a whitespace-only edit passes), with a fresh bless over a missing or empty baseline requiring an explicit --force rather than being blessed away silently. That git check also assumes a real git context: a git evaluation error (for example --update run outside a git working tree) is treated conservatively (it cannot confirm the reconciliation, so it refuses to bless without --force), but the residual that a maintainer could pass --force in such a state, or that git-diff equivalence is not semantic equivalence, is DISCLOSED here, not claimed closed. Its linkage to a single corpus rule is arguable, so none is claimed here."

