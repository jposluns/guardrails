# --- VER-CORE Section 12 step 7 (VC-7): pin lifecycle and the core doctor ------------------------------

[[gate]]
id = "pin-selftest"
script = "tools/pin.py"
rules = []
platform = "ci"
default = "block"
class = "a"
residue = "An adversarial self-test suite over the ONBOARDING pin lifecycle (10.1/10.3/10.6) over synthetic installs, using real subprocess crash-injection. It covers: an initial onboarding pin (create/mkdir only) with pre-adoption capture and its one-step reverse to the exact pre-adoption state; the doctor catching a direct byte or mode mutation of an installed file against the recorded pin digest, and a directory-mode change; the strict typed pin-history chain rejecting type coercion (quorum=1 vs the string form), unknown keys, and an interior type edit; crash-safe recovery at each tested crash point (pre-intent orphan sweep, a torn payload mid-write, a partial mid-swap, and roll-forward of a complete-but-uncommitted pin) via the CONTAINED reverse swap with NO 9.3 journal; a crash-safe un-adopt via a durable intent that recover completes idempotently; a crashed re-adoption recovering to the prior un-adopted state; open pin-transition and open or symlinked migration-journal state blocking a new pin and never read as NA; a deleted transition record surfacing as MALFORMED (not a clean pass over a tampered file) with recover refusing to sweep a live pin's preimages; a malformed release record and a non-create/mkdir onboarding op each refused fail-closed; and adopter-state reads, writes, and removals fd-bound and no-follow (an open migration journal is DETECTED and blocks a pin, but is NOT reconciled by this tool - that is the deferred migration tool's job; the terminal-state read is a disclosed quiescence-bounded residual). Onboarding is CREATE/MKDIR only, a disclosed SUBSET of the spec's initial pin (which additionally captures and restores prior bytes when it overwrites a pre-existing path). Forward re-pin, rollback, and the corrupt-state carve-out are DEFERRED at this release (their anchored target validators and the adopter-experience quiescence and overlay hooks are not enacted) and REFUSE fail-closed with no marker seam. HONESTY LIMIT (10.2): with no keys the pin-history is a keyless hash chain that catches a CASUAL in-place edit of an interior row ONLY; it does NOT catch truncation of a valid tail (a dropped tail leaves a valid chain) and cannot rule out a splice (a full-access writer inserting a genuine old release row and recomputing the suffix), so the history proves NOTHING and authorizes NOTHING on its own, and the self-test asserts the tail-edit, truncation, and splice cases go uncaught rather than claiming otherwise. It exercises flow invariants on synthetic trees; it does not validate any adopter's live install. Its linkage to a single corpus rule is arguable, so none is claimed here."

[[gate]]
id = "doctor"
script = "tools/doctor.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "The core adopter-side doctor (plan 4.3), READ-ONLY by default: it runs the state-completeness, pin-and-manifest, history-chain, open-journal, repoints, reverse-step, transition, and unadopt-intent assertions and never performs recovery (any state-changing recovery is a separate explicit pin.py invocation with authorization). Its self-test asserts a clean absence is NA, a pin without history is MALFORMED (exit 2, never NA), and a casual in-place edit of a non-tail history row FAILs; its live --root . leg reports NOT APPLICABLE in this repo (the pack is not an adopter install). HONESTY LIMIT (10.2), stated in every chain message: with no keys the pin-history is a keyless hash chain that catches a CASUAL in-place edit of an interior row ONLY; it does NOT catch truncation of a valid tail and cannot rule out a splice, so it proves NOTHING and authorizes NOTHING on its own, and the doctor's messages DISCLOSE this limit rather than implying otherwise. It does not establish the full concern-3 set-equality (owed to the adopter-experience spec), does not judge whether a human authorization is well-founded, and reasons only over the pin-state the install actually carries. Its linkage to a single corpus rule is arguable, so none is claimed here."

[[gate]]
id = "python-launcher-isolation"
script = "tools/check_python_launcher_isolation.py"
rules = ["seccet"]
platform = "ci"
default = "block"
class = "c"
residue = "A deterministic scan over a RECOGNIZABLE SUBSET of the repo's Python launcher configuration: the generated plugin hooks.json, tools/run_all_checks.sh, every regular *.yml/*.yaml under .github/workflows/, and the optional .claude/settings.json files. A direct python3 launcher there is FAILed unless it runs isolated (-I, or the full -P -E -s), so a tool-written sibling cannot shadow a stdlib import and neuter the control; the gate itself refuses to run non-isolated (exit 2) so a sibling cannot neuter the gate first, and it fails closed (exit 2) on a missing, unreadable, non-regular, or malformed input rather than passing it as clean. It does NOT catch: wrapper or indirect launchers (a bash -c string, a .sh re-launcher), $PYTHON or shell aliases and functions, a dynamically assembled argv, the programmatic subprocess children in the tools and the regenerate strings in .aiqt/gensrc.json (a separate follow-up), a script that mutates its own sys.path at runtime (which -I cannot prevent), an unrecognized interpreter name, launcher configuration outside the enumerated surfaces, YAML or shell constructs beyond the supported line grammar, and the PATH provenance of python3 itself; a python3 token embedded in a quoted argument or a heredoc may be miscounted."

[[gate]]
id = "branch-root"
script = "tools/check_branch_root.py"
rules = ["brnrot"]
platform = "ci"
default = "block"
class = "c"
residue = "Judges only the revision under gate against the derived protected ref: it does not scan the repository's other branches, cannot prove where a branch was originally cut (a branch cut from a sibling that itself descends from the protected line still resolves), passes a fork point that survives a partial rewrite unless the configured lag threshold catches it, does not fail on multiple merge bases, and where no threshold is configured the staleness layer reports and never blocks. With multiple merge bases the reported first-parent lag is the MINIMUM (most-lenient) across bases, so a criss-cross history is judged by its nearest fork point. Replace refs are neutralized in the scrubbed env (GIT_NO_REPLACE_OBJECTS=1) so a `git replace --graft` cannot mask an orphan as rooted through merge-base; the on-disk .git/info/grafts residual is out of scope (an accidental-case guardrail; full adversarial-grade parent-rewrite resistance is not this gate's remit). A shallow repository maps a merge-base miss to cannot-evaluate (exit 2) with a `git fetch --unshallow` remediation, never a false ORPHANED, because truncated history cannot be told from a genuinely absent root (the CI gate checks out at fetch-depth:0). When the protected ref is derived from the default origin/HEAD, a stale local origin/HEAD (not refreshed since the last fetch) can skew the derived protected tip, so both the orphaned and the first-parent-lag verdicts are only as current as the clone's remote-tracking state; pass --protected an authoritative ref, or refresh origin/HEAD, when that currency matters. A degenerate invocation naming the SAME ref for --protected and --head is a self-comparison that always resolves (a ref is rooted on itself); the caller supplies distinct refs. The gate scrubs the ambient GIT_* environment before every git call but resolves the `git` executable through the ambient PATH, so it trusts the toolchain's `git`; a hostile PATH entry shadowing `git` is a trusted-toolchain / execution-environment concern outside this gate's threat model, not a branch-root bypass it defends against."

[[gate]]
id = "ci-parity"
script = "tools/check_ci_parity.py"
rules = ["gatdis"]
platform = "ci"
default = "block"
class = "c"
residue = "Token-level set parity between the two named files only (tools/run_all_checks.sh and .github/workflows/quality.yml), read as data and never executed. Identity is the normalized command including all script arguments, with python/shell launcher words and the interpreter-only flags (-I, -B, -E, -s, -P, -u, glued forms included) removed, and the value of a runtime-derived flag (--base, --protected, --head) masked as <ref> only when it carries a shell expansion or GitHub expression, so a literal value stays in identity and two different literals diverge. It does NOT compare environment values, operating systems, tool versions, execution order, multiplicity, step placement across jobs, labels, or whether the shell harness propagates a child failure; interpreter-flag differences are owned by check_python_launcher_isolation.py. Scope is exactly the two files, so gates in other workflows are not enumerated. Argument order is identity-relevant, so a harmless reorder fails loud. Coordinated removal of both of this gate's own invocations is undetectable if nobody runs the remaining file manually (branch protection and review own that case). The extractors implement a disclosed shell and YAML subset; an unknown construct is cannot-evaluate (exit 2), never a clean pass. The shadow scan has one soft edge: exotic quoting outside the supported grammar could hide a tools/ path from comment stripping. It fails closed (cannot-evaluate) on an unknown top-level or job-level workflow key, a top-level unconditional exit that would strand later local gates, unbalanced if/fi nesting in the runner, job content without a job mapping, and a run_gate() body outside its recognized shape; deeper nested non-gate YAML (under on:, env:, with:, strategy:) is structurally recognized but not exhaustively schema-validated, though the shadow scan still blocks a hidden tools/ gate and reachability is outside token-parity scope: a gate counts as declared regardless of an enclosing conditional (a job-level if:, a shell conditional inside a run: block, or an if/fi in the local runner) that could keep it from running, and because a runtime-derived value is masked to <ref> a change among runtime spellings (including one making two masked refs identical, a self-comparison) is not distinguished, so validating a single gate's own argument semantics is that gate's responsibility. Intended local-vs-CI asymmetries are reconciled through a reviewed in-gate allowlist, not silently ignored."
