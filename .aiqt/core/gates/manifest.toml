[[gate]]
id = "opf-pack-manifest-selftest"
script = "opf/tools/_opf_pack_manifest.py"
rules = []
platform = "ci"
default = "block"
class = "a"
residue = "Exercises the shared pack-manifest parser with frozen ROOT/TREE hashes, exact root.txt grammar, generator-shaped and independently authored malformed TOML, exact INVALID/CANNOT_EVALUATE statuses, closed keys and vocabularies, contained paths, ordering, uniqueness, digest consistency, and inclusive resource bounds. Named guard mutations must turn their status discriminators red. Generator recipe parity and consumer refusal translation run in tools/check_manifest.py --self-test; physical standalone execution belongs to the closure gate. Coverage is limited to the enumerated vectors and mutations, not the whole input space. VALID means schema-valid, not authenticated: TREE equality, actual bytes, ownership and set equality remain consumer obligations; managed-block digests cover only their blocks. Input caps are not a process sandbox, and larger releases or changed formats refuse until a reviewed update. The generator remains a separate emitter. The runner-registration leg executes the real standalone dispatcher text with intercepted sibling commands returning zero and this suite reduced to its non-recursive vector leg. It requires the declared vector report, exactly one logged own-call attempt with exact argv, and propagation of injected exits 1, 2 and 7. Arguments containing this script basename count as attempts, including embedded -c source and incidental mentions; dynamically constructed names without that substring are not classified. REDs cover removed registration, duplicate or malformed own argv, embedded calls with swallowed exits, CI-conditional skipping, and swallowed failures including wrappers tolerating exit 1 or 2. Every recorded Python invocation is reconciled with the on-disk run_gate roster, including sibling order and exact argv; missing, extra, reordered or re-argued calls fail /invocations. Intercepted siblings return zero, so their assertions and failure propagation remain outside coverage. This twin retains its existing scratch cwd, so caller-cwd conditions are not exercised. Ordinary caller environment variables are retained except GIT_*, BASH_ENV, ENV, SHELLOPTS, BASHOPTS, PS4, BASH_FUNC_*, PYTHON* and LD_*; PATH, HOME, XDG_*, TMPDIR, locale and fixture variables are pinned. It creates executable private scratch files and launches bash; the interception probe requires dirname on the fixture-plus-os.defpath PATH and executable /bin/sh, otherwise refusing as cannot-evaluate/interception. An executable fixture records argv under a read-only PATH pin in the runner shell; the competing fixture must record no calls with the pin and the exact roster without it (removed-path-pin). Missing or malformed evidence fails. Absolute interpreter paths, command -p, hash -p and PATH replacement in a child process remain outside interception; invocation reconciliation detects skipped registered calls after execution, not before it. PD-SFS-THREAT-BOUND excludes runners written to defeat the check: output-recognising wrappers can swallow real SELF-TEST FAIL, PACK-MANIFEST FAIL or CANNOT diagnostics while propagating the injected exits, and bare alternate interpreter names such as python3.14 bypass interception; no mechanism is added for these. Recursion refusal retains the environment marker and also passes a private marker-file descriptor with pass_fds; both twins inspect inherited readable regular descriptors (read-only or read-write, never O_PATH) through /dev/fd before any launch, skipping non-readable descriptors, so a marker reachable only through a write-only or O_PATH descriptor is not recognized, and refusing as cannot-evaluate/recursion-marker when descriptor enumeration, a non-EBADF fstat, the flag query, or reading a readable candidate fails; inherited write-only and O_PATH regressions confirm a legitimate run is not refused. An env -i PATH=/usr/bin:/bin own-registration RED launching the interpreter under test uses a bounded child entry probe requiring cannot-evaluate/recursion and zero nested Popen attempts; the child does not assert which interpreter ran it, so a revert to a PATH-selected python3 is detected only where /usr/bin and /bin hold no python3 able to run the suite, and never where the interpreter under test is itself /usr/bin/python3. Deliberately closing inherited descriptors while scrubbing the environment is out of scope and can create nested sessions beyond timeout killpg containment. Untested exit statuses and environment combinations are not guaranteed; this is not a process sandbox. No network observation, quarantine, trust quorum, registry activation, or live adoption is exercised. Its linkage to a single corpus rule is not undeniable, so none is claimed here."

[[gate]]
id = "opf-prompt-pack"
script = "opf/tools/check_opf_prompt_pack.py"
rules = []
platform = "ci"
default = "block"
class = "a"
residue = "It runs the OPF prompt-pack manifest and digest drift gate (opf/tools/check_opf_prompt_pack.py, PR7 slice 1). The default entry verifies the shipped pack at opf/prompt-pack/pack.toml against the bytes beside it; the --self-test leg builds synthetic packs and checks exact statuses and guard names, never diagnostic wording. Four manifest/member FIFO/symlink probes run in isolated Python child processes with a five-second timeout each and assert only the exit status and structured guard tag. The manifest schema is closed (format, version, digest and members, each member exactly path and sha256). The version must be a bare MAJOR.MINOR.PATCH token from the shared _semver grammar, so a prefixed, pre-release, build-suffixed, leading-zero, whitespace-padded or non-ASCII-digit token refuses INVALID. A member whose bytes changed without its sha256 row refuses INVALID, and so does a stale pack digest after a member row or version change, because the digest binds the version and every ordered member row. A file in the pack directory that is not a member, a listed member that is absent, an escaping, absolute or self-listing path, and duplicate or unsorted rows refuse INVALID. A symlink or other non-regular entry, an unreadable, unparseable, non-UTF-8 or oversize manifest, and an unknown format marker refuse CANNOT-EVALUATE. The in-process status vectors also check that validation leaves each fixture byte-identical and returns the same result twice; the four child probes do not perform these checks. The unreadable-subdirectory vector is skipped when running as root. Member-size and member-count bounds have refusal vectors, and a separate empty-pack digest check pins the digest definition. Coverage is limited to these enumerated checks: VALID means the manifest agrees with the bytes on disk, not that the pack is authentic, that a content change also bumped the version, or that the documents say anything correct or safe. The shipped pack has no members yet, and nothing consumes it in this slice, so no plan, adoption or import step reads its version or digest. Its linkage to a single corpus rule is not undeniable, so none is claimed here."

[[gate]]
id = "opf-standalone-closure"
script = "tools/check_opf_standalone_closure.py"
rules = []
platform = "ci"
default = "block"
class = "a"
