[[gate]]
id = "opf-doctor"
script = "opf/tools/check_opf_doctor.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "It runs the OPF store-integrity gate (opf/tools/check_opf_doctor.py): the live leg runs opf doctor over the repository root and forwards the child's exit code UNMASKED (doctor's own 0/1/2 IS the verdict: 0 VALID, 1 INVALID, 2 CANNOT-EVALUATE), clamping any non-0/1/2 status (a signal death or an abnormal exit) to a cannot-evaluate 2. The root is not taken from ambient state: it is established by CONFIRMING the repository identity of the gate's own location through a local git probe (git --no-replace-objects -C ... rev-parse --show-toplevel over an allowlist-scrubbed environment that drops every ambient GIT_ variable, git resolved to an absolute path, and a bounded timeout), and a root that cannot be confirmed (git missing, a launch failure, a timeout, an invalid/garbage .git marker, or a toplevel that does not contain the gate) fails closed to 2 rather than a false NOT APPLICABLE. doctor resolves the store, gathers the caller-side git observations (_opf_observe.gather over a hardened git boundary: --no-replace-objects, an explicit -C binding to the store root, an allowlist-scrubbed environment that drops every ambient GIT_ variable, and a bounded per-call timeout, with any git failure or timeout failing SAFE to an omitted observation plus a note rather than a forged value), then runs the U6 validate_store integrity engine and forwards its verdict. A non-adopter root prints doctor's own NOT APPLICABLE and exits 0; the verb is read-only. The --self-test asserts that 0/1/2/0 contract end to end through opf.py over synthetic COMMITTED stores (a clean store built through the OPF helpers' own canonical emitters returns 0, a one-field mutation of an immutable record body against the committed prior returns 1, a broken store with an unparseable manifest returns 2, and a non-adopter root returns 0 NOT APPLICABLE), the enforcement-pack CI floor over the same fixtures (doctor --require-store keeps 0 on the clean store and turns the non-adopter root into 2; the shipped recipe opf/enforcement/ci/opf-ci.sh exits 0 on the clean store and 2 on the non-adopter root, in both the one-operand and the documented no-operand arity, the latter over a controlled working directory), the recipe's own contract through a recording stub tool (exact invocation order and arguments, doctor --require-store then render --check, each launched isolated with -I -B, for the one-operand and the no-operand invocation with stubbed doctor/render failures forwarded; per-step 0/1/2 propagation with a doctor failure stopping before render; any abnormal child status, 3, 126, 127 or 137, or a genuine signal death, normalized to 2 for BOTH steps, a doctor abnormality stopping before render; launch failures normalized to 2 for BOTH steps, a missing or non-executable interpreter failing the doctor step and an interpreter vanishing after a passing doctor failing the render step's own launch; a surplus operand a usage error 2 with no step launched; the recipe run by a relative path under a hostile CDPATH still resolving its own directory and returning the true verdict) plus a committed clean store with one planner-populated declared view that red-flags end to end once the view is edited (render --check 1, doctor 1, recipe 1) while both recipe runs leave a read-only snapshot unchanged that covers EXACTLY: every entry under the root with only the top-level .git directory pruned (a nested .git directory below the root is walked like any other entry) by lstat kind, mode, content digest and symlink target, the directory set, the root directory's and the .git/hooks directory's own lstat records, the ref set, the local git configuration, the .git/hooks tree, the index as git sees it (git ls-files -s -z) and .git/info/exclude, while HEAD itself, the object store (including objects/info/alternates), reflogs and other .git metadata files (e.g. info/attributes) remain uncovered by that snapshot, each covered leg held red by its own per-write mutant fixture (a planted tag for the ref set, a local-config write, a hook-file write, a file content edit, a symlink plant and retarget, a file chmod, the two index writes, the exclude write, a nested .git write, the root and hooks-directory chmods, and an empty mkdir; the directory-set leg is pure defence in depth, every walked directory being already an entry record, so its mkdir fixture is equally held by the entry leg), plus the sig:15 abnormal vectors repeated with SIGTERM inherited as SIG_IGN so that removing the recording stub's SIG_DFL restore reds the ordinary suite, plus the GitHub Actions template BYTE-GATED then held to EXACT TEXT (the file is read as raw bytes and any byte outside printable ASCII plus newline is refused before any comment or blank-line reduction, so a tab, a CR, a BOM and any other control or non-ASCII byte, including a Unicode-whitespace-led 'comment' line that YAML would read as verdict-masking scalar content, reds it; the surviving pure-ASCII text with full-line comment lines and blank lines removed, and nothing else normalized, must equal a canonical constant in the gate verbatim, so any added or changed key at any level, quoted, space-padded or aliased, any run continuation line or trailer, a flow mapping, a second step or a rewritten on: block reds it while full-line ASCII comment lines stay free to change, each reported bypass spelling and each refused byte class held red by its own mutant fixture), plus the located cannot-evaluate paths (a child-launch failure, no discoverable repository root, and an invalid .git marker each return 2). It arguably serves the change-carries-a-check discipline, but the linkage to a single corpus rule is not undeniable, so none is claimed here. Class c: this repository is not an OPFiles adopter, so the live leg reports NOT APPLICABLE and gates no real store integrity here, and its assurance rides the self-test over synthetic committed stores, which asserts representative 0/1/2 scenarios with exact exit-code matches, not the observe-and-validate engine's whole input space; it does not exercise behaviour against a live adopter product repository."

[[gate]]
id = "opf-init"
script = "opf/tools/check_opf_init.py"
