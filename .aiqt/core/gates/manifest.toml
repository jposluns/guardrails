residue = "The core adopter-side doctor (plan 4.3), READ-ONLY by default: it runs the state-completeness, pin-and-manifest, history-chain, open-journal, repoints, reverse-step, transition, and unadopt-intent assertions and never performs recovery (any state-changing recovery is a separate explicit pin.py invocation with authorization). Its self-test asserts a clean absence is NA, a pin without history is MALFORMED (exit 2, never NA), and a casual in-place edit of a non-tail history row FAILs; its live --root . leg reports NOT APPLICABLE in this repo (the pack is not an adopter install). HONESTY LIMIT (10.2), stated in every chain message: with no keys the pin-history is a keyless hash chain that catches a CASUAL in-place edit of an interior row ONLY; it does NOT catch truncation of a valid tail and cannot rule out a splice, so it proves NOTHING and authorizes NOTHING on its own, and the doctor's messages DISCLOSE this limit rather than implying otherwise. It does not establish the full concern-3 set-equality (owed to the adopter-experience spec), does not judge whether a human authorization is well-founded, and reasons only over the pin-state the install actually carries. Its linkage to a single corpus rule is arguable, so none is claimed here."

[[gate]]
id = "python-launcher-isolation"
script = "tools/check_python_launcher_isolation.py"
rules = ["seccet"]
platform = "ci"
default = "block"
class = "c"
residue = "A deterministic scan over a RECOGNIZABLE SUBSET of the repo's Python launcher configuration: the generated plugin hooks.json, tools/run_all_checks.sh, every *.yml/*.yaml candidate under .github/workflows/ (only a regular file is scanned; a symlink of any kind, never followed, a directory, or any other non-regular or unreadable candidate is a named cannot-evaluate, exit 2), and the optional .claude/settings.json files. A direct python3 launcher there is FAILed unless it runs isolated (-I, or the full -P -E -s), so a tool-written sibling cannot shadow a stdlib import and neuter the control; the gate itself refuses to run non-isolated (exit 2) so a sibling cannot neuter the gate first, and it fails closed (exit 2) on a missing, unreadable, non-regular, or malformed input rather than passing it as clean. It does NOT catch: wrapper or indirect launchers (a bash -c string, a .sh re-launcher), $PYTHON or shell aliases and functions, a dynamically assembled argv, the programmatic subprocess children in the tools and the regenerate strings in .aiqt/gensrc.json (a separate follow-up), a script that mutates its own sys.path at runtime (which -I cannot prevent), an unrecognized interpreter name, launcher configuration outside the enumerated surfaces, YAML or shell constructs beyond the supported line grammar (the run: value grammar is CLOSED: a plain unquoted scalar, a LITERAL (|) block scalar read under the full YAML block-header grammar (a FOLDED > header, although inside that header grammar, is cannot-evaluate until folding is implemented: YAML folds the content into one command, so a line-by-line reading can disagree with the decoded value), and a single-quoted scalar with no escape, decoded to its body, are the only accepted value forms, while a double-quoted scalar (its escapes undecoded), a single-quoted scalar with an escape or no closing quote, a quoted scalar followed by anything (a trailing comment included), a flow mapping or flow sequence step, value or line, a run key inside a flow collection, ANY quoted key (an escaped spelling YAML decodes to run included), any line opening with a node property, tag, anchor or alias, an explicit key, and a run key with whitespace before its colon are each cannot-evaluate, exit 2, naming the file and line, each form matched after any number of leading sequence dashes; inside a steps: block (a plain bare steps: key; one with a same-line value is cannot-evaluate) the first entry must be a '- ' item and every line at the item or step-key indentation must be a plain unquoted identifier key from the closed step-key set (name, run, uses, with, env, if, id, shell, working-directory, continue-on-error, timeout-minutes), a plain key outside that set or a line the step model cannot place being cannot-evaluate, a LITERAL block's content bounded by the KEY column so a sibling step key after a dashed '- run: |' block re-enters those rules instead of being consumed as block content, and every shell: value READ under a closed classification (a bare known non-python shell keyword, bash, sh, pwsh, powershell or cmd, is clean; a python template without isolation options is a non-isolated finding, on a step and under defaults.run at the workflow and job level, a bare run: whose deeper next line is a plain key: line being read as that mapping, shell and working-directory keys only; every other shell: value, an isolation-claiming python template included, is cannot-evaluate), while deeper with:/env: input VALUES keep the line-form handling (a shell:-spelled input KEY is read as a shell template, a disclosed over-read) and a plain key other than run: and shell: outside a steps: block remains unscanned (the step tracker is single-level); an empty run: value, a bare run: or one whose only same-line text is a YAML comment (YAML strips it to the same empty value), is read ONLY in the two proven shapes, a next-line plain scalar or a next-line block header whose content is deeper than both the header and the key, and is null only when the next non-blank, non-comment line is not deeper than the key; a comment line before a deeper value, a header with no content deeper than the key (a header at the end of the text included) or with content at or above its own column, a line opening with '#' directly after that header (YAML block content the reader refuses rather than reads), any other run: value starting with | or > on the key line or that deeper line, a node property or alias, or a plain scalar continued onto a further deeper line is cannot-evaluate, exit 2, never skipped, each naming the file and line), and the PATH provenance of python3 itself; a python3 token embedded in a quoted argument or a heredoc may be miscounted."

[[gate]]
id = "python-floor"
script = "tools/check_python_floor.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "Checks that the single source .aiqt/core/python-floor.toml parses and names the decided floor, that every python-version pin in the CI workflows, the adopter CI template and its inline copy equals it (a pin of a patch release of the floor passes only inside the host-patch jobs opf-host-patch, git-fixture-env-core-host-patch, git-fixture-env-config-combined-host-patch, git-fixture-env-config-malformed-host-patch and git-fixture-env-config-system-host-patch of .github/workflows/quality.yml, the job being the nearest job id at indent 2 above the pin under the top-level jobs: key, and only when it equals the python-host-patch that .aiqt/python-host.toml names, a file read only for such a pin, whose absence, unreadability or malformation is cannot-evaluate; every other pin in any workflow must equal the floor exactly), and that each entrypoint listed in guarded-surfaces opens with the canonical guard (AST-matched) and, run in a child with sys.version_info patched below the floor under no flag, -O and -OO, exits 2 with empty stdout, the exact refusal and an untouched working directory. Only the entrypoints listed in guarded-surfaces are checked; the completeness check (every shipped entrypoint, a .py file outside the excluded trees with a module-level __main__ block, listed in guarded-surfaces) exists and is self-tested, and is ON (the source sets completeness-check to true) since every shipped entrypoint is guarded and listed: the core-hook, preview-hook, adopter-tool and OPF enforcement deny-hook units and tools/check_entry_guard.py are listed, so a shipped entrypoint missing from guarded-surfaces is a finding. The documentation check is ON: each declaration file (README.md, docs/development.md, site/development.html, site/install.html, opf/site/adopt.md, opf/site/adopt.html, opf/spec/OPF-QUICKSTART.md and .preview/README.md) must contain the exact phrase Python 3.14 or newer, as many times as the gate's DECLARATION_COPIES says (twice in opf/site/adopt.html and in .preview/README.md, which also quotes it in the hooks' refusal line, once elsewhere), and each wording of Python 3.14 followed by or or and and a word must be that phrase, so changing or removing one of two copies is a finding; a floor statement worded another way (Python 3.14+) is caught only through that count, and the check matches the phrase, not its meaning, so a sentence that negates it passes. The claims check, ON with it, makes each Python version below the floor that a declaration file names a finding (file and line), so an older claim beside the phrase is caught; it reads only the word Python, CPython or Py (each optionally followed by version or versions and by an operator such as >=, the sign U+2265 or their HTML forms) or the name pythonM.N followed by a version M.N, the word followed by a major version alone (Python 3), an operator followed by 3.N, and a bare 3.N followed by a plus sign, by or or and followed by newer, later, above, higher, greater or up, or by onward or onwards, so a version in words, one split from the word by other markup, a bare 3.N with none of those after it, the name python3 with no minor version, a bare version with a major other than 3, or the later end of a range is not read, and a sentence naming an older version only to refuse it is a finding (a disclosed over-rejection). The source must keep documentation-check true: its decided value is held in the gate, so setting it to false is a finding (exit 1), not a silent pass. The patched version is a proxy for a real older interpreter, faithful only for a guard that reads sys.version_info; a file that an older interpreter cannot compile fails before its guard runs, and the dynamic leg sees a compile failure only on the interpreter running it. The completeness scan walks the working tree, not the git index, and skips the named excluded trees and directory names. The pins leg is a conservative line model, not a YAML parser. Every workflow file whose name ends in .yml or .yaml in any case is scanned. Pins are also read in every local action file (each action.yml or action.yaml under the tree, the name in any case, and the target of each uses: ./PATH); a local uses: path with no action file in the tree is cannot-evaluate. Each scanned workflow or action file (not the inline Python copy) is held line by line to an enumerated plain grammar, and any other line is cannot-evaluate (exit 2), naming file and line: a blank line; a comment; a --- that opens the file; a plain key (letters, digits, underscore, dot and hyphen, no quotes, no spaces), a colon, then nothing, a plain scalar, a one-line quoted scalar (single-quoted, or double-quoted with no backslash), a one-line flow sequence or mapping of such scalars, or a block scalar indicator whose body is skipped only by indentation; and a list item holding one of the same. So an explicit key (?) and its value line (:), a quoted key or one with a space in it, a backslash escape, a quoted scalar that does not close on its line, a continued plain scalar (a more indented - line included), an anchor, alias, tag or merge key, a nested sequence, a tab in the indentation and a later document marker are each cannot-evaluate, and so is a key repeated at the same indentation in one block mapping (two with: in one step). Every line that names the python-version key must be the one strict form (the bare key in lower case, optional spaces, a colon, spaces, exactly one plain, single-quoted or double-quoted scalar, then an optional comment); the next non-blank line after a pin, comment lines included, may not be more indented than its key; each is cannot-evaluate otherwise. The key is found without regard to case, since the runner reads an input by its upper-cased name, so a key in any other case is cannot-evaluate, and so is any line, script text included, that names INPUT_PYTHON-VERSION. In every scanned file, a line that still carries a carriage return once its one trailing CR is removed, or carries U+0085, U+2028 or U+2029, is cannot-evaluate. A step that uses actions/setup-python (the name in any case, any version) is a finding unless a strict pin line directly under the step's own with: key sets its python-version input; the step runs from its - marker line to the next non-blank line at the same or lesser indentation, and a comment line never ends it. A uses: line that is not one plain or quoted literal, a line that names setup-python anywhere else, and a setup-python uses: line whose - marker the line model cannot find are cannot-evaluate, and a python-version-file input is already cannot-evaluate as a line that names the key. A literal uses: value that names setup-python in any case, or whose path split on / with empty parts dropped begins actions/setup-python, is cannot-evaluate unless it is exactly actions/setup-python@REF or actions/setup-python/PATH@REF (no empty, . or .. path part, no leading or trailing slash, no .git suffix), and a with: whose body is a block sequence is cannot-evaluate. The leg checks only the python-version input of a setup-python step: an update-environment: false input or an if: condition that skips the step can leave another interpreter in use by later steps, and is not judged. Script text that names the key is judged as written and fails closed, a disclosed over-rejection; a block scalar body is skipped by the YAML indentation rule, and a reader that accepts what the YAML specification rejects is not modelled. What remains: in the inline Python copy, read by the pin rule only and as written, a multi-line flow value around a pin, and a Python string escape that hides a uses: or setup-python spelling (the canonical-copy check in opf/tools/check_opf_doctor.py ties that copy to the shipped github-actions.yml, which the grammar reads); an INPUT_PYTHON-VERSION variable whose name is built at run time; the action run as a fork or copy under a name that does not name setup-python; and a remote action, a remote reusable workflow and a docker:// image, whose content is not in the tree and is not read. Pins are read only in the named files, and declarations only as the exact phrase and the named older-version forms."

[[gate]]
id = "python-host-pin"
