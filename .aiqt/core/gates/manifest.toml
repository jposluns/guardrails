# --- VER-CORE Section 12 step 6 (VC-6): migration engine, crosswalk tooling, archive ------------------

[[gate]]
id = "crosswalk-schema-drift"
script = "tools/gen_crosswalk.py"
rules = ["gensrc"]
platform = "ci"
default = "block"
class = "a"
residue = "A byte-identity drift gate over the shipped adopter-facing schema reference .aiqt/core/migration/crosswalk-schema.toml, regenerated deterministically from the tool's own constants, plus a self-test of the adopter-mode candidate generation (archive-before-annotation ordering, the 8.2 immutability refusal, deterministic output, and the computed unmatched list). The self-test confirms the generator archives the UNANNOTATED legacy bytes verbatim and does NOT consume or derive any pointer from the archived source (8.6-conformant): the Expected-successor:/Coverage: pointer lines are stripped from the lexical-overlap ranking input, so changing only a predecessor's pointer content never changes which successor a candidate row names, and no pointer-hint is lifted from the archived bytes. Candidate mapping rows are produced by ranking against a supplied successor inventory (the --successor-inventory adopter input) and carry EMPTY verdict fields; with no inventory supplied the generator emits predecessor rows and the computed unmatched list and defers candidate-mapping ranking. It proves the shipped schema reference equals a fresh regeneration and that the archive-first candidate flow holds its invariants on synthetic input; it does not validate any adopter's live runtime crosswalk (that is check_crosswalk) and does not judge whether the candidate ranking heuristics chose the semantically right successor, which stays human judgment."

[[gate]]
id = "crosswalk"
script = "tools/check_crosswalk.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "It proves the crosswalk fields are present and well-formed: the archive digest chain is immutable (directory name equals recorded hash equals recomputed payload), every predecessor id is in the 8.3 namespace with a source-digest tying it to the immutable archived bytes, every predecessor is mapped (zero-unmapped computed, never trusted), every successor quote is a verbatim contiguous substring of the pinned inventory clause, and each 8.5 verdict carries the fixed token with a reviewer distinct from the author in both name and declared family. It CANNOT prove the human verdict is correct: an 8.5 semantic-equivalence judgment or an 8.2 completeness attestation that is field-complete and name-and-family-distinct but substantively wrong (a bad-faith or mistaken review) passes. Verdict truth is human judgment; the authenticated result-record upgrade is deferred to the adopter-experience report envelope. It also carries the tool's own disclosed mechanical CLASS-C RESIDUALS D5/D6 (the successor inventory is validated for self-consistency but not resolved against the pinned release, and pin.toml migration mode is not parsed; deferred to Step 7). In this repo the live leg reports NOT APPLICABLE (the pack is not an adopter install); its assurance is the self-test over synthetic trees. Its linkage to a single corpus rule is arguable, so none is claimed here."

[[gate]]
id = "migrate-crashinject"
script = "tools/migrate.py"
rules = []
platform = "ci"
default = "block"
class = "a"
residue = "A crash-injection self-test of the 9.3 journal-first cutover engine: for every kill point in its enumerated matrix (after the lock, after each preimage, after the preimage set, a torn INTENT, after INTENT, after each apply op, a torn payload mid-write, a torn COMPLETE, after COMPLETE, plus mid-rollback, torn rollback markers, and a torn directory-mode restore between the mkdir and the chmod), a real subprocess dies there and a fresh process recovers the synthetic tree from the journal ALONE to exactly the prestate or the verified poststate, terminal and idempotent, in both directions, across flat-file, nested-create, and nested-remove trees; it also exercises the inert 10.6 reverse-replay primitive (build_inverse_ops) directly over a completed cutover's INTENT ops, inverting each op in reverse dependency order (the un-adopt CLI and workflow are Section 12 step 7, not this slice). It proves crash recovery over that enumerated matrix on synthetic trees; it does NOT cover a non-quiescent tree (quiescence of the effective tree, not the prestate check, is what excludes a concurrent final-component swap), an arbitrary external writer mutating the tree during an open cutover is outside the transaction guarantee, and PID reuse on a platform with no readable process start-time cannot be distinguished (it reads as possibly-live, and the lock is never seized). Its linkage to a single corpus rule is arguable, so none is claimed here."

[[gate]]
id = "record-drift"
script = "tools/check_record_drift.py"
rules = ["recncl", "chtrk1"]
platform = "ci"
default = "block"
class = "a"
residue = "Total over the surface it examines: an OPEN merge_pending row carrying a TYPED ref (pr:N, decision:X) whose merge or record evidence exists in the declared truth sources always fails the gate. It reads only typed structured refs; a narrative number in prose, an untyped row, or a register kept outside the declared surface is out of scope by design (D9), and drift the truth sources themselves cannot see (an unpushed local merge, a PR merged under a subject with no (#N) marker) passes. In a checkout with no orchestration registry the live leg is NOT APPLICABLE (the record is machine-local by design) and the self-test carries the assurance; that scope boundary is printed, never silent."

[[gate]]
id = "record-sections"
script = "tools/check_record_sections.py"
rules = ["recncl"]
platform = "ci"
default = "block"
class = "c"
residue = "Partial over a best-effort, adopter-configured surface. It proves preservation only for column-zero H2 headings that the adopter's own regular expressions select and that are newly introduced on the branch (present at the branch tip, absent at the unique merge-base); it catches a clean section-drop but MISSES a section that was reworded, renamed, or moved (a changed heading reads as a new-and-dropped pair, not a preserved one), never compares section bodies, does not cover edits to a heading already present at merge-base, and cannot tell a valid supersession from an opt-out marker an author simply added. Any record path or heading outside the config, and any grammar the pattern does not match, is outside its surface. The config is trusted adopter input to this preservation check: rewriting it so its heading-pattern selects fewer or no headings (semantic narrowing that makes real sections stop matching) is a change to that trusted config, not a dropped section, and defending the config against adversarial narrowing is out of this gate's threat model (it is the config-integrity surface's concern). Missing or ambiguous inputs inside the declared surface (a duplicate selected heading, an unreadable declared record, an unresolvable ref, a config path whose final or any parent component is a symlink, a non-unique merge-base on EITHER the default or the explicit-base path, an explicit --base-ref that is not that unique merge-base, an explicit --branch-ref that disagrees with the observable second parent of a two-parent post-merge commit, a default config the merge itself deleted, an uninferable branch tip) fail closed (exit 2); an explicit --base-ref is accepted only when the merge-base is unique and the ref names it, so it cannot mask a drop by naming one of several merge-bases that disagree on a section, and when the post-merge commit has two parents an explicit --branch-ref must name the observable second parent, so it cannot mask a drop by comparing against the first parent. It also strips the ambient GIT_ environment before every git call so a redirected GIT_DIR or GIT_WORK_TREE cannot swap in a decoy repository, and it does not follow a symlinked config at the final or any parent component. Only with no adopter config present (a genuinely absent, not-a-symlink default) AND none at the pre-merge target is the gate NOT APPLICABLE by design; a config the merge removed, or one whose removal cannot be evaluated because the post-merge ref is unresolvable, fails closed instead. Pack CI exercises only the synthetic self-test while the adopter owns the live post-merge invocation."

