and the confirmed-dead recovery gate, not prevented; the final unlink is by name, so a window remains between the pre-unlink name-stat and the unlink, narrowed by flock exclusivity, never closed; acquirer and recovery identity degrade to bare pid equality where /proc start times are unavailable (non-Linux), where a confirmed-dead recovery rests on os.kill reporting the pid gone rather than on a start time; the machine store directory is validated for OWNERSHIP only, not group- or other-writability, so a group-writable machine store can weaken the lease leg where the control root and the machine store diverge in trust (ownership-only by design, to avoid over-firing on the shared-group adopter stores the machine store legitimately lives in; disclosed, not prevented); a store or common-dir path with a symlinked ancestor is refused by the no-follow walk rather than served; the enclosing-repository walk recognizes a repository only by a .git entry at an ancestor, so an ancestor that is itself a bare repository or git directory carrying no .git entry is not recognized and the store roots at its own root, as before, a store root that is itself a submodule checkout anchors at its own per-superproject-worktree common git dir, as before, so it takes one lock per superproject worktree (only a store nested inside a submodule refuses), git's submodule probe starts a git ls-files child in the parent directory of the enclosing repository's toplevel, so for every nested store git is asked about, that child reads the configuration and the index of whatever repository encloses that directory (the superproject, or any repository whose work tree holds the enclosing one, gitlink or not) and runs any command that repository configures for reading its index (core.fsmonitor) inside the signal-deferred section, a repository the store's owner may not control, whose configuration the module neither validates nor overrides, a nested store moved or renamed inside its repository takes a new, emp