residue = "It runs the OPF coupled-init RESUME SUBSTRATE (opf/tools/_opf_init_substrate.py) via its --self-test: the module persists the durable per-operation resume substrate a coupled D2b init leaves behind, under <control-root>/opf-init/ops/<op_id>/, a SIBLING of the operation lock's opf-oplock control directory beneath the SAME authoritative control root, COMPOSING the merged lock facility (OPF-D2B PR2, #298) rather than reinventing it: the shared control-root resolution (the three-way no-follow .git classification at the store root and, when it has none, at each ancestor, with the git-answered, toplevel-cross-checked common-dir resolution), the parameterized single-component control-home open, the no-follow dir_fd primitives, and the exclusive fsynced O_CREAT|O_EXCL control-file creation with torn-write cleanup are _opf_oplock's own. Per held capability it records plan.json, the frozen opf.init.plan/v1 document persisted CREATE-ONLY in the exact canonical JSON serialization with the frozen closed top-level key set, the scalar identity fields, and an operation_id equal to the held capability's op_id all validated BEFORE any filesystem write, and create-only NNNN-<phase>.json opf.init.phase/v1 records in a strictly contiguous bounded sequence whose on-disk tree is re-verified before every append through a FRESH per-listing descriptor (no lseek rewind of a retained directory fd, so the listing is portable across the macOS EINVAL and btrfs readdir-snapshot behaviours) and per-record sha256 CONTENT DIGESTS, with type and link-count hard refusals from an fstat of the OPENED object, so a foreign entry, a gap, an in-place rewrite, or a different-bytes replacement refuses the append, while a byte-identical replacement is accepted as the same record (harmless; the digest is the authoritative content check, a filesystem may reuse a freed inode, and the retained device-and-inode identity stays a diagnostic naming a rewrite apart from a replacement). Every substrate write requires the LIVE held capability: the recorded acquirer (pid plus canonical /proc start time), unreleased, the retained anchor identity still holding, and the freshly resolved control root carrying the capability's control-directory identity. The plan-aware resume classifier is READ-ONLY: it classifies each ops/ entry against its own plan into INTACT or a named per-entry CANNOT-EVALUATE (unreadable, malformed, non-canonical, gapped, duplicated, foreign, or symlinked, each fail-closed and PRESERVED), it deletes NOTHING, and the journal's blind unlink-to-prestate recovery path is never routed at substrate or init worktree paths; a crashed operation's CONTROL legs are cleared only by the lock module's own confirmed-dead explicit recovery, which the self-test witnesses leaving the substrate tree byte for byte intact. The --self-test builds real git init stores with committed adopted trees, pinned hermetically exactly as the lock module's suite, and asserts the T-s roster: the sibling-home placement with a linked worktree converging on the MAIN common git dir and a non-git store rooting at the store root; a store nested in a repository sharing one substrate home under the enclosing common git dir across worktrees, with a bogus enclosing gitdir pointer refusing the classifier (T-s19); distinct stores nested in one repository keeping distinct substrate homes, so one store's operation is invisible to another's classifier (T-s20); a real signal at every descriptor-opening return of a nested store's control-root resolution and classifier leaking nothing, the resolution and the classifier running with the Python-handled signals deferred (T-s21); a failing descriptor close anywhere in the control-root open leaking no descriptor (T-s22); the live-capability write gate with a released capability, a forked child, and a broken anchor identity each refusing with nothing written; validate-before-write create-only plan persistence with a refused duplicate begin preserving bytes; contiguous content-digest-verified bounded phase records refusing foreign entries, in-place rewrites, and different-bytes replacements while accepting a byte-identical swap as the same record; the classifier defect matrix (tampered canonical bytes, a sequence gap, a duplicate sequence, a foreign entry, a mismatched record operation_id, a symlinked entry, a FIFO planted at the plan, and a malformed entry name) with a metadata (path, inode, size) snapshot proving the classifier changed nothing; the crash-classify-recover composition; a torn plan write stranding no file and rolling back the just-created directory; fail-closed classifier roots (an unresolved store, a symlinked .git, a symlinked substrate home); the read-side classifier bounds and UTC validity (a phase count or sequence past the MAX_PHASES bound is CANNOT-EVALUATE, and a phase utc is validated for the recorded RFC 3339 shape and calendar validity); the lseek-free fresh-descriptor listings; the plan-membership re-check in the same fresh listing the phase scan uses (a plan removed between its read and the listing is CANNOT-EVALUATE, never INTACT on stale bytes); the early whole-directory entry-count bound refusing before any phase record is opened; and mid-read OSError containment to a single CANNOT-EVALUATE entry with the survey continuing; a missing containment primitive or git binary, or a fixture base inside a git repository, makes the self-test itself return non-zero, never a clean skip. OPF-D2B PR3a extends it without changing the ops/<op_id>/ record shape: the init pre-store holder is also a live writer, bound to its explicit product root rather than the store resolver, its control root resolved by the same shared control-root resolution (a NESTED product root records beneath the enclosing repository's keyed store home, the same control root the resolved store's lock uses, and a root no repository answers for refuses); an operation handle is bound to the holder that began or resumed it; resume_operation reopens an existing operation under its ORIGINAL id without rewriting plan.json; the exact staging leftovers a killed publication leaves are swept under the held lock and an operation directory the sweep leaves empty is settled by removal; and two sibling homes hold the init effect journals and the bounded attempt outcomes, witnessed by T-s14 to T-s18 (including a real SIGKILL during plan publication before and after its link). The plan PRODUCER, its deep validation and plan_digest basis, and the mutation phases live in the init operation layer (its own gate). It arguably serves the change-carries-a-check and check-fails-closed-on-unreadable disciplines, but the linkage to a single corpus rule is not undeniable, so none is claimed here. Class c: coverage is representative, so it asserts these enumerated crash and tamper scenarios over synthetic stores rather than the full space of kernel-level interleavings and filesystem faults; the classifier takes no lock, so a survey raced by a live writer can observe a mid-append tree (a resume dispatch runs it only after the lock module's confirmed-dead recovery has succeeded); the pre-append re-verification binds cooperating writers, not adversaries: the digest verify and the append are two steps, so an out-of-band writer with a retained open descriptor can mutate a record after the verify, the type and link-count refusals read a point-in-time fstat that a hard link added afterwards evades, the classifier's plan-membership re-check in the fresh listing is a name check rather than a content re-verification, so a same-name replace of plan.json between its read and that listing is not detected, and a same-bytes-different-inode swap is accepted by design, so adversarial-grade record integrity requires OS-level isolation of the control root (SYSTEM-HARDENING.md), which this layer does not provide; an empty substrate home or ops tree reads as no recorded operation; everything the lock module's own gate discloses (advisory locking, the stat-to-unlink adjacency, non-Linux identity degradation, ownership-only machine-store validation) applies unchanged to the composed legs; foreign-uid and permission-fault vectors are not exercised by the fixtures; discard_reversed_operation (removing ONE operation record whose worktree effects a coupled, preserving journal verifiably reversed, its journals and outcomes kept as evidence) is exercised end to end by the adoption apply gate's reversal and recovery vectors, not by this module's own self-test; and any harness failure fails closed to a non-zero exit rather than a clean skip."

