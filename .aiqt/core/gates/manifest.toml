cted exception in the order raised (pinned with one and with two injections), a commit still reports COMMITTED with the injected exception named and chained as its cause (pinned), and an interrupt raised by compose still propagates as itself with the injected exception named in its note (pinned); the early lock close records the same way, so an exception injected there leaves a commit COMMITTED, a refusal refusing and a compose interrupt propagating as itself, each naming it (pinned); an exception the closing cleanup or observation raises, the closing journal listing's own close-out included, is named beside a refusal in place of any nothing-written claim, and in a compose interrupt's note (pinned), and every exception that listing's close-out records is kept as itself: two injected there are both named beside a refusal in the order raised, and when the later one is an interrupt it propagates as itself, the refusal and the earlier exception named in its note (pinned); each close-out exception is named with what it says of its descriptor, a close error as a close that still released it and any other exception as one that may leave its popped descriptor open (pinned); every close on the closing path records its exception beside one already in flight, never raising past it: with a nested journal entry the closing listing's recursive walk closes its inner then its outer child, and an interrupt then a fault there, or the reverse, propagates the interrupt as itself, the refusal and both exceptions named in order, and two faults there are both named beside the refusal; the closing sweep's parent close does the same beside an exception its rmdir raised, in both orders; a sweep close fault keeps the lock's clause in the refusal; a fault the closing listing's close-out records stops the observation there; a run whose own ordinary exception meets an interrupted listing close-out names that exception in the interrupt's note; and no note ends with a doubled fail-closed suffix (pinned); every close on a lock read and release path records its exception the same way, the release read-back close, the lock read close after an interrupted acquire, and the read-back, held identity and identity read closes after a failed acquire, and the run's own identity read close among them, so an interrupt there propagates as itself with the fault named and a commit still says COMMITTED; a release note that raised keeps the state lock clause through a sweep close fault; and a walk or sweep close fault with nothing in flight stops that walk or sweep (pinned); an ordinary fault inside the lock release followed by an interrupt in its read-back, on a refusal and on a commit, and an ordinary fault inside the lock acquire followed by an interrupt in the read of what it left, propagate that interrupt as itself with the fault named beside it, an interrupt in the release or the acquire followed by another exception in that read keeps the first, and an interrupt at the early lock close propagates ahead of a later closing sweep interrupt (pinned); the lock release's outcome table is pinned one vector per row: what the release raised (nothing, its own error, another exception, an interrupt) against what its read-back raised, with this run's lock identity known or unavailable, on a refusal and on a commit, plus a release that removed the lock before raising, each run naming every injected exception and propagating the one that table selects; an exception a close inside the release's owner read raises (an EIO there, then a journal error at the next close, and that journal error alone) is named beside a commit and a refusal, never dropped as an unreadable lock, the altered lock's clause names what the release raised, a transaction whose state cannot be classified names why, and a journal error a close inside the post-state check raises propagates (pinned); an ordinary fault inside the lock acquire followed by an interrupt in the read of what it left never claims the run hol