# --- VER-CORE Section 12 step 7 (VC-7): pin lifecycle and the core doctor ------------------------------

[[gate]]
id = "pin-selftest"
script = "tools/pin.py"
rules = []
platform = "ci"
default = "block"
class = "a"
residue = "An adversarial self-test suite over the ONBOARDING pin lifecycle (10.1/10.3/10.6) over synthetic installs, using real subprocess crash-injection. It covers: an initial onboarding pin (create/mkdir only) with pre-adoption capture and its one-step reverse to the exact pre-adoption state; the doctor catching a direct byte or mode mutation of an installed file against the recorded pin digest, and a directory-mode change; the strict typed pin-history chain rejecting type coercion (quorum=1 vs the string form), unknown keys, and an interior type edit; crash-safe recovery at each tested crash point (pre-intent orphan sweep, a torn payload mid-write, a partial mid-swap, and roll-forward of a complete-but-uncommitted pin) via the CONTAINED reverse swap with NO 9.3 journal; a crash-safe un-adopt via a durable intent that recover completes idempotently; a crashed re-adoption recovering to the prior un-adopted state; open pin-transition and open or symlinked migration-journal state blocking a new pin and never read as NA; a deleted transition record surfacing as MALFORMED (not a clean pass over a tampered file) with recover refusing to sweep a live pin's preimages; a malformed release record and a non-create/mkdir onboarding op each refused fail-closed; and adopter-state reads, writes, and removals fd-bound and no-follow (an open migration journal is DETECTED and blocks a pin, but is NOT reconciled by this tool - that is the deferred migration tool's job; the terminal-state read is a disclosed quiescence-bounded residual). Onboarding is CREATE/MKDIR only, a disclosed SUBSET of the spec's initial pin (which additionally captures and restores prior bytes when it overwrites a pre-existing path). Forward re-pin, rollback, and the corrupt-state carve-out are DEFERRED at this release (their anchored target validators and the adopter-experience quiescence and overlay hooks are not enacted) and REFUSE fail-closed with no marker seam. HONESTY LIMIT (10.2): with no keys the pin-history is a keyless hash chain that catches a CASUAL in-place edit of an interior row ONLY; it does NOT catch truncation of a valid tail (a dropped tail leaves a valid chain) and cannot rule out a splice (a full-access writer inserting a genuine old release row and recomputing the suffix), so the history proves NOTHING and authorizes NOTHING on its own, and the self-test asserts the tail-edit, truncation, and splice cases go uncaught rather than claiming otherwise. It exercises flow invariants on synthetic trees; it does not validate any adopter's live install. Its linkage to a single corpus rule is arguable, so none is claimed here."

[[gate]]
id = "doctor"
script = "tools/doctor.py"
rules = []
platform = "ci"
default = "block"
