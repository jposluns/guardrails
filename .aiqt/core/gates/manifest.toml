residue = "It exercises the shared render/reconcile driver (tools/opf_render.py) end to end: per-target ordering on a degraded input (an earlier target's drift line and write precede a later target's materialization failure, under both --check and write, for a missing and a markerless block page), a schema error on a later target aborting before an earlier target is reconciled, a one-shot iterator target being reconciled rather than silently skipped, and an empty target set failing closed. It arguably serves the change-carries-a-check discipline, but the linkage to a single corpus rule is not undeniable, so none is claimed here. It asserts representative scenarios with exact stdout/exit-code matches, not the driver's whole input space, and it does not re-verify the healthy byte-identical generation the drift gates own."

[[gate]]
id = "opf-tooling-selftest"
script = "opf/tools/opf.py"
rules = []
platform = "ci"
default = "block"
class = "a"
residue = "It exercises the OPF core-tooling dispatcher (opf/tools/opf.py --self-test) end to end: it runs every registered helper self-test in order (the store, schema, release, and emitter helpers over synthetic stores) and the aggregator's own fail-closed return-vocabulary guard, under which a helper returning a bool, a float, or an out-of-range int fails the aggregate closed rather than reading as clean, and the worst outcome wins so one degraded helper is never masked by a later clean one. It arguably serves the change-carries-a-check discipline, but the linkage to a single corpus rule is not undeniable, so none is claimed here. It asserts representative synthetic scenarios with exact exit-code matches, not each helper's whole input space; it now exercises the render, doctor, and upgrade verbs' dispatch and argument handling and the import verb's dispatch via the opf-cli routing leg (usage errors fail closed; render --check/--write forwards to the U4 engine over synthetic and non-adopter stores; doctor and upgrade resolve and route over synthetic and non-adopter stores; and import's four modes (--scan, --plan, --review in its batch and --interactive forms, and --apply) are retired (spec 14.1), each checked for exit 2 with the retirement refusal text over an adopted synthetic store and over a NOT-ADOPTED root, with no run ever staged or accepted (no import engine remains), the whole fixture tree (both roots and the input files) byte-unchanged, and the --interactive form leaving stdin unread; the import verb's own function parses no argument, and that runtime behaviour, exit 2 with that refusal for every representative argument list, is what the runtime probe below observes, while the structural checks are a tripwire against accidental regression, not a proof: over that function's source as parsed from the file's bytes, decoded as the interpreter decodes them, they flag a coding declaration other than utf-8 on its first two lines, a body other than exactly one print of that refusal to stderr and one exit-2 return (a reference to its argument list or any other call included), a binding form the check models, in any expression evaluated at module scope, that rebinds a name that body uses or binds __builtins__, a module constant or the sys import that body uses not bound by one direct top-level statement ahead of it (bound under a condition or in a try, say), a live code object other than the one compiled from that parsed definition, and a live function whose globals are not its own module's namespace or whose builtins are not the interpreter's real builtins mapping; they do not cover reflective or dynamic changes (stores through globals() or vars(), setattr and attribute stores such as builtins.print or sys.stderr, exec, eval or compile, importlib), source-decoding and loader tricks beyond the coding-declaration check, the dispatcher module's own import-time top-level code (which runs before the CLI entry point on every invocation and which the runtime probe does not cover either, as it calls the entry point on the already-imported module), the guarded helper bootstrap and verb dispatch the CLI entry point runs before calling that function (covered only by the runtime probe), calls through routes the probe does not patch (the posix or _io modules directly, ctypes, already-open file objects or descriptors, sockets), or another module patching this one, a disclosed residual class; and a representative set of argument lists (none, --help, each of the 14 former flags alone, with a separate value, joined and with an empty joined value, unambiguous and ambiguous prefixes, the former review-aid forms, two modes, an unknown flag, and --) each print exactly that refusal, compared with a literal pinned in the test rather than with the constant itself, at exit 2 under a runtime probe that records and refuses a call through the module attributes it patches to its probed filesystem read, write and remove, process-spawn or stdin functions and finds none, which covers those lists only, not every possible argument list, and leaves outside it a route it does not patch (a call through the posix or _io modules directly, a read or write through an already-open file object or descriptor, a socket, or ctypes); the refusal names adoption and the prompt pack in words and no command; the store-free routing-level import rows are judged on exit code alone, not the refusal text; and record refuses its usage errors before any store resolution, including a given '/proposed' qualifier and a non-maintainer done-with-receipt, while the record unit self-test covers the verb's argument grammar, allocation seam, the four planners, the record-carried pre-proposal state (proposed_from written, restored, and removed), the one accepted snapshot cannot-evaluate, and postcondition), while adopt's stage driver is exercised end to end over a planned fixture (approve exit 0 with the approval binding the plan's two digests and exit 2 after a source edit or a revision-only change, over a fixture that is a git repository whose HEAD the worksheet binds, apply exit 2 naming the unlanded ops and exit 2 for an approval of another plan, each writing nothing, plan exit 2 over an interrupted adoption transaction, and the approve and apply flag grammar failing closed), and the remaining store verbs (migrate, sync) stay recognized names that fail closed as not-yet-implemented until their unit lands; and it runs over synthetic stores rather than a real adopter --root, so it does not verify behaviour against a live product repository."

[[gate]]
id = "opf-journal-direct-selftest"
script = "opf/tools/_journal.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "It runs _journal.py --self-test directly: four descriptor-helper checks, ported from the retired import engine's self-test, each driving a helper with a patched os primitive and no store, journal or subprocess. C1-osread asserts that _read_fd returns a readable descriptor's bytes (a positive control) and converts a read-time OSError to a JournalError rather than a raw OSError; N2a asserts that _close_fd_quietly returns cleanly on the close error of an already-closed descriptor; N2d asserts that _close_fd_quietly still returns when both closes fail and its stderr diagnostic write itself raises. It asserts these helper contracts only, not the journal's transaction, crash-recovery or locking behaviour, which other suites exercise. Every patched primitive is restored in a finally; the run returns 0 on pass and 1 on a failed check. No undeniable linkage to a single corpus rule is claimed."

