al /proc start time, session, and stamp); and a mandatory spec 5.7 lease.toml in the RESOLVED machine store, with both control records emitted through the checked TOML encoder (emit_checked round-trip plus closed top-key equality), created only beneath dir_fd no-follow walked parents with O_NONBLOCK on every control open, written by the shared full-write loop, and fsynced (file and parent directory) before the capability returns, the capability retaining descriptors, device and inode identities, exact payload bytes, and the acquirer identity (pid plus canonical /proc start time); a control-record write that fails mid-way unlinks the just-created singly-linked file by verified identity before raising, so no torn record is stranded. Release is identity-bound: it refuses a caller that is not the recorded acquirer before any leg runs, re-checks the retained anchor and control-directory identities, runs the reverse-order legs with error collection so the active-record leg still runs when the lease leg fails, performs each removal as a verified unlink (re-open no-follow, type, link count exactly 1, identity, size, byte equality, and a final pre-unlink name-stat) that preserves any mismatched file, and unlocks the anchor last. A stale record under a free anchor refuses acquisition and is cleared only by explicit recovery (recover=True), which itself proceeds ONLY when the recorded holder is CONFIRMED DEAD on this host by the journal's possibly-live-never-seized liveness model (_journal.owner_confirmed_dead over the persisted owner identity); a possibly-live, cross-host, or malformed holder, or a stale lease with no paired active record, is refused rather than seized, so a live holder whose records are exposed under a split anchor (a fresh anchor minted by an out-of-band unlink or rename of the mutex) is never seized into a two-holder state, and a paired lease is cleared only when its holder matches the confirmed-dead active record; staleness is never inferred from age or t