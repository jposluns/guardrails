residue = "It exercises the OPF adoption completion evaluator, slices 1 and 2 (opf/tools/_opf_adopt_complete.py --self-test, 292 checks): the read-only deterministic checks 1 (authority and freshness), 2 (discovery accounting), 3 (preservation and restore), 4 (operational readiness) and 6 (retirement readiness), and the wiring probe frame of check 5, of the OPF-SPEC 1.3.0 section 14.1 clean-start completion roster, with the homes-1 evidence digest verification those checks carry while C-EVIDENCE-ENUM is inactive (sections 4.2 and 14.1); each check function's docstring quotes the spec sentence it enforces. Over a synthetic post-apply fixture (a retire source frozen live, a migrate source frozen live, a non-occupying move source frozen live whose relocation waits for green, an occupying source at the TODO.md view destination archived with its view rendered, a repointed consumer under a recorded exclusion, a scaffolded store, every enforcement member planted, and the run bundle holding the sealed plan, approval, receipt and inventory) check 4 is never VALID in this release: the shipped CI floor asserts store presence, not the store identity spec 14.1 check 4 also requires of CI (that assertion is the deferred U25), so with the U25 switch (U25_CI_IDENTITY_ASSERTED) off, as shipped, the genuine floor installed unmodified leaves check 4 CANNOT-EVALUATE with the U25 reason alone, checks 1, 2, 3 and 6 green, and check 5 (wiring) CANNOT-EVALUATE with the PR6 reason alone (its deferral below), while an earlier check-4 failure keeps its own reason and never names U25 (a de-adopted store, red; a live recipe edit and a reference recipe off its embedded digest, each CANNOT-EVALUATE). Every other vector runs with the switch on, the state U25 ships, so the check-4 machinery stays tested: there the five checks are green and check 5 (wiring) stays CANNOT-EVALUATE naming PR6, so the roster is never green with the PR6 switch off; roster_green is pinned red for INVALID and for CANNOT-EV