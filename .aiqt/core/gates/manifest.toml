[[gate]]
id = "branch-root"
script = "tools/check_branch_root.py"
rules = ["brnrot"]
platform = "ci"
default = "block"
class = "c"
residue = "Judges only the revision under gate against the derived protected ref: it does not scan the repository's other branches, cannot prove where a branch was originally cut (a branch cut from a sibling that itself descends from the protected line still resolves), passes a fork point that survives a partial rewrite unless the configured lag threshold catches it, does not fail on multiple merge bases, and where no threshold is configured the staleness layer reports and never blocks. With multiple merge bases the reported first-parent lag is the MINIMUM (most-lenient) across bases, so a criss-cross history is judged by its nearest fork point. Replace refs are neutralized in the scrubbed env (GIT_NO_REPLACE_OBJECTS=1) so a `git replace --graft` cannot mask an orphan as rooted through merge-base; the on-disk .git/info/grafts residual is out of scope (an accidental-case guardrail; full adversarial-grade parent-rewrite resistance is not this gate's remit). A shallow repository maps a merge-base miss to cannot-evaluate (exit 2) with a `git fetch --unshallow` remediation, never a false ORPHANED, because truncated history cannot be told from a genuinely absent root (the CI gate checks out at fetch-depth:0). When the protected ref is derived from the default origin/HEAD, a stale local origin/HEAD (not refreshed since the last fetch) can skew the derived protected tip, so both the orphaned and the first-parent-lag verdicts are only as current as the clone's remote-tracking state; pass --protected an authoritative ref, or refresh origin/HEAD, when that currency matters. A degenerate invocation naming the SAME ref for --protected and --head is a self-comparison that always resolves (a ref is rooted on itself); the caller supplies distinct refs. The gate scrubs the ambient GIT_* environment before every git call but resolves the `git` executable through the ambient PATH, so it trusts the toolchain's `git`; a hostile PATH entry shadowing `git` is a trusted-toolchain / execution-environment concern outside this gate's threat model, not a branch-root bypass it defends against."

[[gate]]
id = "ci-parity"
script = "tools/check_ci_parity.py"
rules = ["gatdis"]
platform = "ci"
default = "block"
class = "c"
residue = "Token-level set parity between the three named files only (tools/run_all_checks.sh against the union of the CI workflows .github/workflows/quality.yml and .github/workflows/msg-leaks.yml), read as data and never executed. Identity is the normalized command including all script arguments, with python/shell launcher words and the interpreter-only flags (-I, -B, -E, -s, -P, -u, glued forms included) removed, and the value of a runtime-derived flag (--base, --protected, --head) masked as <ref:expression> (preserving which expression supplied it) only when its de-quoted value is byte-for-byte one of the reviewed shell expansions in MASKED_REF_EXPRESSIONS and its raw workflow spelling, before shell de-quoting, is byte-for-byte that expression's one reviewed spelling, its double-quoted form as quality.yml writes it (any other spelling that de-quotes into a reviewed expression, a backslash-escaped, backslash-split, adjacent-quoted or single-quoted one, is cannot-evaluate (exit 2), never masked, because quote and backslash removal would otherwise collapse spellings bash treats differently into one reviewed identity), so a change among those reviewed runtime spellings including a self-comparison diverges. A runtime-derived flag value is exactly one that carries $ or a backquote: such a value outside that reviewed set is cannot-evaluate (exit 2), never masked, a literal <ref:...> placeholder spelling included (the placeholder is the OUTPUT of the masking, accepted back only from the reviewed in-gate allowlist and its canonical identities, so a quoted placeholder literal in a workflow never collapses into a masked identity); a flag value carrying neither character stays in identity as a kept literal and two different literals diverge; that literal reading applies only to a value that survives the extraction path's YAML screening and shell tokenization (an inline unquoted *name or &name spelling in the space-separated flag form is already refused by the YAML feature screen, exit 2, while the equals form bypasses that screen: --base=*main stays a kept literal that diverges, exit 1, and --base=&main splits on the shell control character into an empty flag value, refused, exit 2; the local runner's gate-word allowlist refuses tilde, glob and brace words outright, exit 2), so a tilde, glob or brace spelling in a workflow flag value is a visible divergence on the CI side (exit 1), not a mask, while the same spelling on the local side is a refusal; and a ${{ }} GitHub expression anywhere in a run: value, a whole-line or trailing shell comment included, is cannot-evaluate (exit 2), never masked, read on the raw block lines before shell-comment stripping, over the scalar extent a conservative subset of the YAML block-scalar rules reads (from the content indentation the first non-empty line sets to the first non-empty line below it: a leading blank line indented past the content indentation is refused, exit 2, as YAML rejects that layout, while a later blank line stays inside the scalar wherever it falls; a dedented YAML comment after the block is outside the scalar; a dedented line that re-enters the step is refused, exit 2; a tab on a scalar line is refused, exit 2, even where YAML accepts one in content; and a folded run: scalar is refused, exit 2, so the subset refuses, never passes, the layouts it does not read). It does NOT compare environment values, operating systems, tool versions, execution order, multiplicity, step placement across jobs, labels, or whether the shell harness propagates a child failure; interpreter-flag differences are owned by check_python_launcher_isolation.py. Scope is exactly the three files, so gates in other workflows (the scheduled currency.yml) are not enumerated, and a named workflow that is missing or unreadable is cannot-evaluate (exit 2), never an empty side. Argument order is identity-relevant, so a harmless reorder fails loud. Coordinated removal of both of this gate's own invocations is undetectable if nobody runs the remaining file manually (branch protection and review own that case). The extractors implement a disclosed shell and YAML subset; an unknown construct is cannot-evaluate (exit 2), never a clean pass. Two disclosed masking/parse edges remain: tokenization does not preserve quote type for kept literals, so a quoted and an unquoted spelling of the same literal collapse into one identity, and a $ inside single quotes is still read as runtime-derived like a double-quoted one, where the raw-spelling screen then refuses every spelling but the reviewed double-quoted one, so quote loss can refuse but never mask or pass a new spelling; and a duplicate run: key within one step is counted as two members although YAML keeps one. The shadow scan has one soft edge: exotic quoting outside the supported grammar could hide a tools/ path from comment stripping. It fails closed (cannot-evaluate) on an unknown top-level or job-level workflow key, a top-level unconditional exit that would strand later local gates, unbalanced if/fi nesting in the runner, job content without a job mapping, a step key before a job's first step item (YAML rejects that shape), and a run_gate() body outside its recognized shape; deeper nested non-gate YAML (under on:, env:, with:, strategy:) is structurally recognized but not exhaustively schema-validated, though the shadow scan still blocks a hidden tools/ gate and reachability is outside token-parity scope: a gate counts as declared regardless of an enclosing conditional (a job-level if:, a shell conditional inside a run: block, or an if/fi in the local runner) that could keep it from running, validating a single gate's own argument semantics beyond the runtime expression is that gate's responsibility. Intended local-vs-CI asymmetries are reconciled through a reviewed in-gate allowlist, not silently ignored. The CI member set is the union over every job, so a gate moved between jobs is still one member and a gate dropped from every job is still a finding. It reads the job set the way YAML does or refuses: a job id is read only from a plain unquoted key at indent 2 that is a valid GitHub job id and not a YAML boolean or null, with its properties at indent 4, and a quoted, spaced, flow or other key at that indent, a line at indent 1 or 3, a deeper job body, or a repeated top-level, job-level or job-id key is cannot-evaluate (exit 2), never skipped. On any job, continue-on-error, uses, defaults or container is a finding (exit 1) whatever its value, because each can let a failed gate leave the job green (derived from the documented job-level keys; the step-level equivalents are cannot-evaluate, except that every run: step must carry exactly one shell: bash line, a finding (exit 1) when absent, because GitHub documents a step shell as overriding the job's default shell and a job default as overriding a workflow default of the same name; that a step shell also overrides a workflow's defaults.run.shell is inferred from those two statements, not documented for that case. Without the line either default could run every run: step under a program that exits 0. The line does not close defaults.run.working-directory at workflow or job level: a step shell does not override it and every gate is invoked by a relative path, so a defaults block can still choose which file each gate runs, this gate's own included, and that route stays refused only where the local runner runs this gate). In a workflow with more than one job it also requires exactly one job named Quality gates (the one required status of that workflow) whose job-level if: is always(), whose needs: lists every other job exactly once, so a job outside that list is a finding (exit 1), and whose content matches a pinned copy line for line (blank and comment lines aside, needs: compared as a slot), so a deleted exit 1 or shell: bash, a changed success filter or an added key or step is a finding; the self-test runs the pinned step under bash and proves it exits 0 only when every needed result is success. A workflow that runs the message/metadata leak scan must list opened, synchronize, reopened and edited in its pull_request types, and a workflow that does not run it must not carry edited on pull_request or pull_request_target (a PR title/body edit would re-run every job there); each departure is a finding (exit 1), and a trigger shape outside the recognized subset under those events is cannot-evaluate (exit 2); the push trigger and branches: filters are not checked. quality.yml must list exactly labeled in its pull_request types (QUALITY_PULL_REQUEST_TYPES) and carry no pull_request_target, because a pull request run of it is scheduled only by the label the merge lane applies to the train pull request, so a member head gets no Quality run; a departure (the former opened, synchronize and reopened types, GitHub's default types for a pull_request event with no types:, or another type beside labeled) is a trigger finding (exit 1), and an on: block with no pull_request event, or no top-level on: line at all, is a trigger finding too (exit 1), because a train head then gets no Quality run either. Lane rule: quality.yml must carry one top-level concurrency: block exactly as pinned (CONCURRENCY_BLOCK, blank and comment lines aside), so a newer run of a pull request cancels its superseded run while a push-to-main run, grouped by its own run id, is never cancelled; every heavy job (HEAVY_JOBS) must be present in quality.yml and must carry the pinned job-level if: (HEAVY_JOB_IF_LINE), whose value is read whole, every continuation line included, so the job runs only on a push and on a merge-train-* pull request of this repository; and each heavy member (HEAVY_COMMANDS, the expensive suites pinned by full identity) may run only in a job whose if: is exactly that pinned line. A missing or departing block, a concurrency: block in msg-leaks.yml, a job-level concurrency: key, a missing heavy job, a heavy job without the if:, a departing or continued if: on a heavy job, a heavy member in a job without the pinned if: and an if: on any other job but the Quality gates job of quality.yml are each a finding (exit 1), so a heavy job removed, or renamed so that it would run without the if:, and a heavy command relocated into an unconditioned job each fail loud. The rule compares text, not GitHub's evaluation of those expressions; heaviness is the pinned HEAVY_COMMANDS enumeration, so a new expensive command outside it can land in an unconditioned job with no lane finding until it is added to the set (the check_byte_canon.py identities are outside it because the registry job also runs them unconditioned, so for byte-canon-matrix only presence, the pinned if: and member parity are held, not a relocation of its commands), and workflows outside the two named files are not read, so a heavy command added there is caught only as a parity difference. It does not check the branch-protection setting (that Quality gates and the msg-leaks job, Message/metadata leaks, are both required checks), a second job that reports the Quality gates name through an expression, GitHub's own evaluation of needs results, always(), cancellation, matrix results or step-shell precedence, or the runner image, runs-on labels, services and environment values (a job or step env: can set a variable such as BASH_ENV)."

