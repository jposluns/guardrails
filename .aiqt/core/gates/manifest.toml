residue = "The trivial reference audit (tools/audit_reference.py) that proves the QA harness end to end; it ships no substantive assurance logic. Its gating leg is --self-test, which asserts the audit returns PASS end to end on a present gate roster (carrying located evidence), UNVERIFIABLE on an absent one (missing evidence never reads as PASS), emits valid result-contract JSON, and runs its --config operand validation, unknown-option rejection, and the loud pinned-source resolution before dispatching --self-test so a malformed operand (for example --config immediately followed by --self-test), an unrecognized option (a misspelled --self-testx or --digestx), or a pinned-but-absent/empty config (an absent --config path, or AIQT_ASSURANCE_CONFIG set to an empty value) is a loud exit 2 rather than a silent self-test or default path that exits 0. Its --digest leg is an ADVISORY report-only surface board that always exits 0 on a finding, so an advisory finding never gates and only a tool crash (unexpected non-zero exit) fails the build. It arguably serves the change-carries-a-check discipline, but the linkage to a single corpus rule is not undeniable, so none is claimed here. It asserts representative scenarios with exact status and exit-code matches, not the whole discovery input space, and it audits only the gate-roster surface's availability, not the semantic correctness of any real assurance property."

[[gate]]
id = "internal-names"
script = "tools/check_internal_names.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "A best-effort scan of the QA-suite shipped surfaces (and, for the internal role name, of every tracked file, and for the maintainer-decision id shape, of the whole working tree) for internal provenance vocabulary, in two layers (per tools/check_internal_names.py): structural SHAPE patterns for generic forms (the leak gate's host-path, private-IP, token, and account shapes plus provenance-id and internal-incident-id shapes, and the capitalized internal role name as a case-sensitive whole word, so architecture vocabulary and longer identifiers never match) and a hashed-codename denylist (tools/internal-name-hashes.txt, SHA-256 only, shipped empty) for names no shape catches. It covers a recognizable SUBSET of the internal-name surface: like the sibling check_leaks.py whose normalization and structural patterns it reuses, deliberate obfuscation (mid-word splits, HTML entities, zero-width characters) can evade the hashed layer, binary and archive contents are not scanned (check_leaks unpacks and scans ZIP members; this gate reads a tracked .zip's members only through the leak gate's archive rule, to verify the archive, and scans none of them), and a novel private string outside the shape patterns and the denylist slips it (class c, partial, the check_leaks archetype). SCOPE and FAIL-CLOSED posture: the QA-suite deliverables plus the shipped gate-runner and CI-workflow files (tools/run_all_checks.sh and .github/workflows/quality.yml, verified clean of provenance shapes) and the public .preview/ channel in SCOPE_RELPATHS are scanned; an absent future surface is skipped, and a present scoped file that cannot be read fails closed (an OSError read failure is exit 2, a non-UTF-8 or otherwise undecodable scoped file is a fail-closed unscannable-surface finding at exit 1), never a silent skip. A BROKEN SYMLINK (a present dentry whose symlink target is missing) is a present-but-unreadable input, not an absent one: at both the hashes-file load and the scoped-file scan it fails closed (re-raised as an OSError, exit 2), never read as absent, so an internal name held behind a dangling link cannot evade by reading clean. SCOPE_RELPATHS is a hand-maintained allowlist with no drift-guard, so a new in-scope surface must be added to it by hand, and mixed-content metadata files that legitimately carry existing provenance tokens (the gates and ownership manifests) are out of scope by design with their QA-relevant content hand-verified. A line carrying an internal-allow marker is exempt from the structural layer. ROLE-NAME RULE SCOPE: the role-name pattern is a separate rule over EVERY tracked file (git ls-files -z --cached of the repository root, read from the working tree as UTF-8), independent of SCOPE_RELPATHS and of the gate's skip-by-name list, so Markdown, site HTML, committed generated outputs and the gate's own source are all scanned; its only exemption is the internal-allow marker on the one line that carries it (the gate's own self-test vectors carry it). Every tracked .zip first goes through the leak gate's archive rule, whether or not its bytes decode as UTF-8 (check_leaks.verify_archive, the predicate built from the same functions the leak gate's scan applies: the archive-size bound on a read that stops one byte past it, the parsed records covering the file exactly, and every member read in full in memory under zipfile's CRC and header checks; nothing is extracted to disk); a .zip the rule refuses fails closed at exit 2 named with the leak gate's reason, and one it accepts is scanned when it decodes as UTF-8 and is otherwise skipped as binary, the only non-UTF-8 tracked file the rule skips (the committed skill .zip archives are skipped this way); any other non-UTF-8 tracked file whatever its suffix (a malformed .csv, say), a tracked path absent from the working tree, or a tracked set git cannot list (no git, not a repository) cannot be evaluated and fails closed at exit 2, and a .gitattributes binary attribute is not a skip. It cannot see untracked or git-ignored files (beyond the scoped surfaces), generated outputs that are not committed and are not handed to it (a built release archive, a site render that is not checked in), staged content that differs from the working-tree copy, or the word split or encoded (an HTML entity, a zero-width character). The same tracked-file rule, under the same exemption and fail-closed exits, also refuses an internal review-round label: a reviewer family name followed by a QA round number, or a QA round number followed by a severity grade or a finding id, with at most one space between the parts, in either case; QA alone, quality, a bare grade word, a family name alone and a round number with neither are not matched, and the grade or finding id must end at a word boundary, so a round number before an ordinary word that starts with a grade (minority, majority) is not matched; a label written in another shape (a family name after the round number, a tab, two spaces or punctuation between the parts, or a grade or finding id run straight into a letter, digit or underscore, say) slips it. A separate tree-wide layer checks the whole working tree for the internal maintainer-decision id shape, untracked and git-ignored files included (everything on disk except the skipped directories and names); it reads a file only when its suffix is one of the leak gate's text suffixes (.md, .mdc, .py, .sh, .yml, .yaml, .toml, .json, .txt, .html, .css, .js, .cfg, .ini, .conf, .svg) or it has no suffix, so a file under any other suffix (a .csv, say) is not read, and it does not follow a symlinked directory. A bare ordinal with no further segment (D-3) is not matched, and an internal-allow line is exempt there too. Unlike the scoped layer, where a file that is not valid UTF-8 fails closed, the tree-wide layer skips such a file, where the whole-tree leak gate decodes it losslessly and scans it. In that layer an unlistable directory, an unreadable file and a non-regular file (a FIFO) each fail closed at exit 2, and a file that vanishes during the walk is a fail-closed finding at exit 1. This gate accepts only --self-test (or no arguments for a real scan), so an unrecognized option (a misspelled --self-testx or a stray flag) is a loud exit 2 rather than a silent default scan that would let it masquerade as --self-test. Its linkage to a single corpus rule is arguable, so none is claimed here; an empty rules list is an open question, not a coverage statement."

