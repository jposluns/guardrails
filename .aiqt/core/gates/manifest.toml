an interrupted adoption transaction, and the approve and apply flag grammar failing closed), and the remaining store verbs (migrate, sync) stay recognized names that fail closed as not-yet-implemented until their unit lands; and it runs over synthetic stores rather than a real adopter --root, so it does not verify behaviour against a live product repository."

