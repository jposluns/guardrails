and the confirmed-dead recovery gate, not prevented; the final unlink is by name, so a window remains between the pre-unlink name-stat and the unlink, narrowed by flock exclusivity, never closed; acquirer and recovery identity degrade to bare pid equality where /proc start times are unavailable (non-Linux), where a confirmed-dead recovery rests on os.kill reporting the pid gone rather than on a start time; the machine store directory is validated for OWNERSHIP only, not group- or other-writability, so a group-writable machine store can weaken the lease leg where the control root and the machine store diverge in trust (ownership-only by design, to avoid over-firing on the shared-group adopter stores the machine store legitimately lives in; disclosed, not prevented); a store or common-dir path with a symlinked ancestor is refused by the no-follow walk rather than served; the enclosing-repository walk recognizes a repository only by a .git entry at an ancestor, so an ancestor that is itself a bare repository or git directory carrying no .git entry is not recognized and the store roots at its own root, as before, a store root that is itself a submodule checkout anchors at its own per-superproject-worktree common git dir, as before, so it takes one lock per superproject worktree (only a store nested inside a submodule refuses), git's submodule probe starts a git ls-files child in the parent directory of the enclosing repository's toplevel, so for every nested store git is asked about, that child reads the configuration and the index of whatever repository encloses that directory (the superproject, or any repository whose work tree holds the enclosing one, gitlink or not) and runs any command that repository configures for reading its index (core.fsmonitor) inside the signal-deferred section, a repository the store's owner may not control, whose configuration the module neither validates nor overrides, a nested store moved or renamed inside its repository takes a new, empty keyed home, and a store nested across a filesystem boundary from its enclosing repository refuses, git's discovery stopping there; a mount-level alias can give one store two lock identities: two keyed homes in one repository's common git dir (an alias at a different relative path in any of its worktrees), the store root and a keyed home (one path outside any repository, the other inside one, in either direction), or another repository's home; two concurrent holders are possible through such an alias, a disclosed residual; the walk trusts every ancestor directory, so a .git entry anyone can create in a shared ancestor such as /tmp makes every store without its own .git beneath it refuse (fail-closed, a denial of service), a store nested in a repository owned by another uid refuses on git's own ownership check, and where git is configured to trust such a repository (safe.directory=*) or a gitdir-pointer file at the store root or an ancestor names another repository's git dir, the control tree is placed in that repository's common git dir, whose own ownership and permissions are not validated; foreign-uid and permission-fault vectors are not exercised by the fixtures; it is the LOCAL in-repository serialization boundary, not a remote-visible lease for dedicated sync targets; and any harness failure fails closed to a non-zero exit rather than a clean skip."

[[gate]]
id = "opf-init-substrate"
script = "opf/tools/_opf_init_substrate.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "It runs the OPF coupled-init RESUME SUBSTRATE (opf/tools/_opf_init_substrate.py) via its --self-test: the module persists the durable per-operation resume substrate a coupled D2b init leaves behind, under <control-root>/opf-init/ops/<op_id>/, a SIBLING of the operation lock's opf-oplock control directory beneath the SAME authoritative control root, COMPOSING the merged lock facility (OPF-D2B PR2, #298) rather than reinventing it: the shared control-root resolution (the three-way no-follow .git classification at the store root and, when it has none, at each ancestor, with the git-answered, toplevel-cross-checked common-dir resolution), the parameterized single-component control-home open, the no-follow dir_fd primitives, and the exclusive fsynced O_CREAT|O_EXCL control-file creation with torn-write cleanup are _opf_oplock's own. Per held capability it records plan.json, the frozen opf.init.plan/v1 document persisted CREATE-ONLY in the exact canonical JSON serialization with the frozen closed top-level key set, the scalar identity fields, and an operation_id equal to the held capability's op_id all validated BEFORE any filesystem write, and create-only NNNN-<phase>.json opf.init.phase/v1 records in a strictly contiguous bounded sequence whose on-disk tree is re-verified before every append through a FRESH per-listing descriptor (no lseek rewind of a retained directory fd, so the listing is portable across the macOS EINVAL and btrfs readdir-snapshot behaviours) and per-record sha256 CONTENT DIGESTS, with type and link-count hard refusals from an fstat of the OPENED object, so a foreign entry, a gap, an in-place rewrite, or a different-bytes replacement refuses the append, while a byte-identical replacement is accepted as the same record (harmless; the digest is the authoritative content check, a filesystem may reuse a freed inode, and the retained device-and-inode identity stays a diagnostic naming a rewrite apart from a replacement). Every substrate write requires the LIVE held capability: the recorded acquirer (pid plus canonical /proc start time), unreleased, the retained anchor identity still holding, and the freshly resolved control root carrying the capability's control-directory identity. The plan-aware resume classifier is READ-ONLY: it classifies each ops/ entry against its own plan into INTACT or a named per-entry CANNOT-EVALUATE (unreadable, malformed, non-canonical, gapped, duplicated, foreign, or symlinked, each fail-closed and PRESERVED), it deletes NOTHING, and the journal's blind unlink-to-prestate recovery path is never routed at substrate or init worktree paths; a crashed operation's CONTROL legs are cleared only by the lock module's own confirmed-dead explicit recovery, which the self-test witnesses leaving the substrate tree byte for byte intact. The --self-test builds real git init stores with committed adopted trees, pinned hermetically exactly as the lock module's suite, and asserts the T-s roster: the sibling-home placement with a linked worktree converging on the MAIN common git dir and a non-git store rooting at the store root; a store nested in a repository sharing one substrate home under the enclosing common git dir across worktrees, with a bogus enclosing gitdir pointer refusing the classifier (T-s19); distinct stores nested in one repository keeping distinct substrate homes, so one store's operation is invisible to another's classifier (T-s20); a real signal at every descriptor-opening return of a nested store's control-root resolution and classifier leaking nothing, the resolution and the classifier running with the Python-handled signals deferred (T-s21); a failing descriptor close anywhere in the control-root open leaking no descriptor (T-s22); the live-capability write gate with a released capability, a forked child, and a broken anchor identity each refusing with nothing written; validate-before-write create-only plan persistence with a refused duplicate begin preserving bytes; contiguous content-digest-verified bounded phase records refusing foreign entries, in-place rewrites, and different-bytes replacements while accepting a byte-identical swap as the same record; the classifier defect matrix (tampered canonical bytes, a sequence gap, a duplicate sequence, a foreign entry, a mismatched record operation_id, a symlinked entry, a FIFO planted at the plan, and a malformed entry name) with a metadata (path, inode, size) snapshot proving the classifier changed nothing; the crash-classify-recover composition; a torn plan write stranding no file and rolling back the just-created directory; fail-closed classifier roots (an unresolved store, a symlinked .git, a symlinked substrate home); the read-side classifier bounds and UTC validity (a phase count or sequence past the MAX_PHASES bound is CANNOT-EVALUATE, and a phase utc is validated for the recorded RFC 3339 shape and calendar validity); the lseek-free fresh-descriptor listings; the plan-membership re-check in the same fresh listing the phase scan uses (a plan removed between its read and the listing is CANNOT-EVALUATE, never INTACT on stale bytes); the early whole-directory entry-count bound refusing before any phase record is opened; and mid-read OSError containment to a single CANNOT-EVALUATE entry with the survey continuing; a missing containment primitive or git binary, or a fixture base inside a git repository, makes the self-test itself return non-zero, never a clean skip. OPF-D2B PR3a extends it without changing the ops/<op_id>/ record shape: the init pre-store holder is also a live writer, bound to its explicit product root rather than the store resolver, its control root resolved by the same shared control-root resolution (a NESTED product root records beneath the enclosing repository's keyed store home, the same control root the resolved store's lock uses, and a root no repository answers for refuses); an operation handle is bound to the holder that began or resumed it; resume_operation reopens an existing operation under its ORIGINAL id without rewriting plan.json; the exact staging leftovers a killed publication leaves are swept under the held lock and an operation directory the sweep leaves empty is settled by removal; and two sibling homes hold the init effect journals and the bounded attempt outcomes, witnessed by T-s14 to T-s18 (including a real SIGKILL during plan publication before and after its link). The plan PRODUCER, its deep validation and plan_digest basis, and the mutation phases live in the init operation layer (its own gate). It arguably serves the change-carries-a-check and check-fails-closed-on-unreadable disciplines, but the linkage to a single corpus rule is not undeniable, so none is claimed here. Class c: coverage is representative, so it asserts these enumerated crash and tamper scenarios over synthetic stores rather than the full space of kernel-level interleavings and filesystem faults; the classifier takes no lock, so a survey raced by a live writer can observe a mid-append tree (a resume dispatch runs it only after the lock module's confirmed-dead recovery has succeeded); the pre-append re-verification binds cooperating writers, not adversaries: the digest verify and the append are two steps, so an out-of-band writer with a retained open descriptor can mutate a record after the verify, the type and link-count refusals read a point-in-time fstat that a hard link added afterwards evades, the classifier's plan-membership re-check in the fresh listing is a name check rather than a content re-verification, so a same-name replace of plan.json between its read and that listing is not detected, and a same-bytes-different-inode swap is accepted by design, so adversarial-grade record integrity requires OS-level isolation of the control root (SYSTEM-HARDENING.md), which this layer does not provide; an empty substrate home or ops tree reads as no recorded operation; everything the lock module's own gate discloses (advisory locking, the stat-to-unlink adjacency, non-Linux identity degradation, ownership-only machine-store validation) applies unchanged to the composed legs; foreign-uid and permission-fault vectors are not exercised by the fixtures; and any harness failure fails closed to a non-zero exit rather than a clean skip."

[[gate]]
id = "opf-init-builders"
script = "opf/tools/_opf_init.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "It runs the OPF init D1 bootstrap builders (opf/tools/_opf_init.py) via its --self-test: the pure, canonical builders of a clean store's manifest, counters, version, worklog, and empty indexes, each emitted through the checked TOML encoder, reparsed, and validated, with independent byte-pinned fixtures for the zero-seeded counters and the empty ledgers and indexes. It also covers the B6 SEEDED counters path the coupled init consumes (OPF-D2B PR3a, PD-D2B-PR3-SCHEMA decision 6): an ancestral seed is copied without mutation into the full namespace roster, and a seed missing ANY roster namespace, baseline or importer, refuses (a missing historical value is unknown, never zero), as do a bool, negative, past-64-bit, or out-of-roster value. Class c: the builders are pure, so the coverage is the enumerated document shapes and seed defects; the SELECTION of an ancestral snapshot is the init operation layer's and PR4's, not this gate's; and any harness failure fails closed to a non-zero exit."

[[gate]]
id = "opf-init-operation"
script = "opf/tools/_opf_init_operation.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "It runs the OPF coupled-init operation layer, slices PR3a and PR3b (opf/tools/_opf_init_operation.py), via its --self-test: the library milestone VIEWS-READY, never coupled-init success (no CLI verb, no git index write; the initial views are rendered through the existing read-only planner and remain unstaged). The pure legs cover the bootstrap provenance (opf.init.bootstrap/v1 TOML through the checked encoder, its source digest over the sorted path and content-digest roster EXCLUDING init.toml, forged and stale provenance rejected), the immutable plan (its self-excluding plan digest, canonical bytes, and a deep validator that refuses a changed init generator or spec version, requires the live view-generator pin for resume/render but accepts a well-formed recorded view identity for completed health, and refuses a tampered payload, digest, mode, staging name, order, roster, set, or plan digest, a view roster that is dropped, reordered, restaged, remoded, re-sourced, or carries the root VERSION, and a binding or HEAD that differs from the live re-observation), and the B6 pinned ancestral counters reader over real git stores (the evidence must lie on the pinned HEAD's first-parent line, so a merged second-parent commit refuses; a missing namespace is unknown and refuses the plan; a nonzero module-tier high-water refuses; malformed, oversized, missing, absent, shallow, replaced, and re-prefixed evidence refuses). The physical legs drive the REAL operation in fresh child interpreters over real git repositories on the filesystem TMPDIR names: a fresh bootstrap under two umasks with exact 0644 and 0755 modes, the index untouched, the store resolving VALID, init.toml a C-CONTAINMENT leaf, the initial views byte-equal to the renderer planner's output with headers binding the plan's source bytes (an independent digest fixture), C-VIEW-DRIFT passing, every view untracked, and no root VERSION; a completed rerun, with and without legitimate later edits or a view identity bump (name, version, transform vocabulary, projection schema), that changes nothing; an empty view roster with an unrelated tracked README that initializes without an empty-pathspec index query; a preserved existing CHANGELOG.md; a SIGKILL at every registered boundary (journal intents and completions, the directory group, the lease attach and detach, individual sources, the source-state milestone, the views journal intent and completion, individual views, before and after a source or view publication link, and after completion) followed by a fresh-process retry that resumes the SAME operation and plan, recreates nothing already present, and reports attempt-local created versus verified paths; destinations planted on resume (wrong bytes, a strict prefix, a wrong mode, a symlink, a dangling link, a hard link, a FIFO, a directory) refused and preserved with nothing else changed; fresh-adoption refusals (an identical colliding destination, foreign .working content, a tracked-but-deleted path, a local pointer, a non-repository, a bare repository, a symlinked root, a contended mutex); a nested product prefix initializing with its substrate under the enclosing repository's keyed control home (the lock module's shared control-root resolution) and a linked worktree initializing under the main common git dir; journal safety (a torn tail truncated and resumed, a rollback frame refused, no rollback path ever invoked, an injected fsync failure preserved and resumed, a milestone the journal contradicts refused); a kill during plan publication leaving no worktree write; a moved HEAD refusing the resume; a replaced destination refusing classification; an end-to-end re-adoption seeding WL so the next allocation follows the ancestral high-water without re-reading history on retry; and view refusals, each preserving the worktree and index: a source swapped between its verification and the render (source/view correspondence), a source changed after the source-state milestone, a changed view generator (the SAME operation resuming once it is restored), a renderer changed after the views intent, a staged view (present, or staged and deleted), a divergent view planted between view creations, an exact-bytes view or foreign single-link staging file planted before the views intent (first refusal and plain retry both leave no intent and preserve the foreign inode and bytes, while an exact view after the intent is a dedupe), directory and source destination/staging collisions before their group intent that also refuse repeated retries without recording intent, a foreign .working entry before the source-state milestone, and a planner yielding the root VERSION. Class c: coverage is the enumerated scenarios over synthetic repositories, not the space of kernel interleavings; process-kill tests establish process-crash behaviour only, so POWER-LOSS durability is not verified; the harness does not identify or select a filesystem type, so tmpfs, btrfs, ext4, and macOS coverage remains unverified without separately identified runs; the adoption observer (PR4), git staging (PR5), Keep adoption (PR6), and activation (PR7) are out of scope; a renderer change that keeps the pinned view-generator identity and lands before the views intent is indistinguishable from the pinned generator; rendered views intentionally share the 1 MiB MAX_SOURCE_BYTES ceiling, so an aggregate view can refuse although each source fits; completed-adoption health excludes C-VIEW-DRIFT and does not require current views, so deleted, edited, or staged views alone do not prevent ALREADY-INITIALIZED, which neither repairs views nor certifies their currency; COMPLETE frames record poststates without per-path outcomes, so a resumed COMPLETE group reports directories, sources, and views as deduplicated/verified-identical even if an earlier attempt created them (attempt-local verification, not cumulative creation accounting); everything the composed lock and substrate gates disclose applies unchanged; and any harness failure fails closed to a non-zero exit."

[[gate]]
id = "opf-init-observe"
script = "opf/tools/check_opf_init_observe.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "It runs representative in-memory raw Git object fixtures and bounded subprocess-capture tests via opf/tools/check_opf_init_observe.py; --self-test --red-on-revert also requires each declared reversal to reach its named assertion and the restored source to pass. Coverage includes all-parent presence, first-parent seed membership, absent evidence resolution, exact object identity, tree framing, selected resource limits, and shared Git launcher policy. Class c: these fixtures do not exercise the full production Git adapter, real repository history, filesystem or graft races, or the full input space. They do not establish adoption qualification, select authoritative adoption evidence, or authorize initialization; production admission and filesystem/operation fixture families remain separate obligations. History observations cannot recover rewritten-away history, undisclosed product moves, unmerged refs, or other product prefixes. Reversal reports bind to measured source content digests, not to a reviewed Git revision."

[[gate]]
id = "opf-init-p0"
script = "opf/tools/check_opf_init_p0.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "It runs the OPF coupled-init P0 ratified-contracts validation self-test (opf/tools/check_opf_init_p0.py): both the default entry and --self-test run the SAME in-memory contract vectors over retained fixtures, with no store or Git effects; runner fixtures use private scratch. The D2a source-only builders' bytes are captured in memory before any P0 guard is exercised, and every case re-verifies the WHOLE fixture body (each file's bytes, not a success marker or merely a path) is byte-unchanged after the call. The suite asserts 65 vector cases with exact status and single-finding codes: plan, outcome, and result version admission through EXACT-EQUALITY version gates (an unknown or older opf.init.plan or opf.init.outcome format, a non-string schema, and each pinned spec_version, generator, provenance_format, and views_generator version each refused, with a recorded historical views-generator accepted only for completed health and refused mid-flight); set membership over the closed {S,V,K,E,C} roster with cross-set disjointness (OVERLAP) and unclassified-entry detection resolved against the AUTHORITATIVE roster and inventory rather than the plan's own declared sets (a foreign S or V path, an added K, a dropped or emptied C or E, and a reordered S each refused), plus the malformed-shape refusals (a changed source mode, a hidden staging key, an injected payload, an extra E field, and a spurious integration_set or recovery_policy key); the coupled-versus-source-only RESULT contract (a coupled InitResult admits only a known status while a bare int refuses, and a source-only result admits only the permitted 0 or 2 exit code while an InitResult refuses, with a missing or wrong status refused); compatibility (a D2a manifest accepted with provenance OPTIONAL, a malformed provenance blob refused, an old manifest needing upgrade refused, the 1.1.0->1.2.0 delta admitting the spec_version bump ALONE with no invented provenance, no counter change, and no other manifest field changed, and the SUPPORTED_HOMES=1 generation fence holding even where a resolver would activate generation 2); the F19 integration and staging boundary (staging_set fixed empty, publication boundaries pinned, and staged-membership admitting only an S-subset so a staged V, K, E, or C entry, a directory, an unclassified path, or a duplicate each refuses); and the input fail-closed cases (a missing input CANNOT-EVALUATE; an empty, non-object, duplicate-key, or truncated body REFUSED). --self-test --red-on-revert additionally applies 43 exact single-guard source reversions, each disabling one admission, refusal, or dispatch guard, and requires each to reach its OWN named assertion (any other exception is a harness failure, not an accepted RED); it also exercises the runner-registration leg by running the REAL standalone run_all_checks.sh dispatcher text with the other gate commands intercepted and this suite reduced to its non-recursive vector leg, requiring the declared assertion identities, exactly one logged own-call attempt with the exact expected argv, and propagation of injected exits 1, 2 and 7. Any logged argument containing this suite's script basename counts as an attempt, including embedded -c source; incidental mentions count conservatively too, while dynamically constructed names without that substring are not classified. The runner uses the caller working directory, with a repository-root conditional-skip RED; fixture files stay in private scratch. Ordinary caller environment variables are retained (with a CI-conditional skip RED); GIT_*, BASH_ENV, ENV, SHELLOPTS, BASHOPTS, PS4, BASH_FUNC_*, PYTHON* and LD_* controls are removed before PATH, HOME, XDG_*, TMPDIR, locale and fixture variables are pinned. The probe requires dirname on its fixture-plus-os.defpath PATH and executable /bin/sh, failing closed as cannot-evaluate/interception if absent. REDs cover removed registration, duplicate or malformed own argv, embedded calls with swallowed exits, and swallowed failures including wrappers tolerating exit 1 or 2. Every recorded Python invocation is reconciled with the on-disk run_gate roster, including sibling order and exact argv; missing, extra, reordered or re-argued calls fail /invocations. Intercepted siblings return zero, so their assertions and failure propagation remain outside coverage. An executable fixture records argv under a read-only PATH pin in the runner shell; the competing fixture must record no calls with the pin and the exact roster without it (removed-path-pin). Missing or malformed evidence fails. Absolute interpreter paths, command -p, hash -p and PATH replacement in a child process remain outside interception; invocation reconciliation detects skipped registered calls after execution, not before it. PD-SFS-THREAT-BOUND excludes runners written to defeat the check: output-recognising wrappers can swallow real SELF-TEST FAIL, PACK-MANIFEST FAIL or CANNOT diagnostics while propagating the injected exits, and bare alternate interpreter names such as python3.14 bypass interception; no mechanism is added for these. Recursion refusal retains the environment marker and also passes a private marker-file descriptor with pass_fds; both twins inspect inherited readable regular descriptors (read-only or read-write, never O_PATH) through /dev/fd before any launch, skipping non-readable descriptors, so a marker reachable only through a write-only or O_PATH descriptor is not recognized, and refusing as cannot-evaluate/recursion-marker when descriptor enumeration, a non-EBADF fstat, the flag query, or reading a readable candidate fails; inherited write-only and O_PATH regressions confirm a legitimate run is not refused. An env -i PATH=/usr/bin:/bin own-registration RED launching the interpreter under test uses a bounded child entry probe requiring cannot-evaluate/recursion and zero nested Popen attempts; the child does not assert which interpreter ran it, so a revert to a PATH-selected python3 is detected only where /usr/bin and /bin hold no python3 able to run the suite, and never where the interpreter under test is itself /usr/bin/python3. Deliberately closing inherited descriptors while scrubbing the environment is out of scope and can create nested sessions beyond timeout killpg containment. Untested exit statuses and environment combinations are not guaranteed; this is not a process sandbox. It arguably serves the change-carries-a-check and check-fails-closed-on-unreadable disciplines, but the linkage to a single corpus rule is not undeniable, so none is claimed here. Class c: coverage is representative, so it asserts these enumerated contract vectors and single-guard reversions over in-memory synthetic fixtures rather than the full input space, and it validates the P0 CONTRACTS only; the later OPF-INIT slices (P1 and beyond) are out of scope and remain separate obligations awaiting Architect design review: target and control binding, the adoption classifier, coordination, Keep-apply, verb wiring, git staging, publication, finalization, the CLI verbs, and Migrate/Move; the contract fixtures drive no live adopter product repository, while runner fixtures create private scratch files; and any harness failure fails closed to a non-zero exit rather than a clean skip."

[[gate]]
id = "opf-upgrade"
script = "opf/tools/check_opf_upgrade.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "It runs the OPF store-schema upgrade gate (opf/tools/check_opf_upgrade.py): both the default entry and --self-test run the SAME fixture suite, and there is no live-adopter mutation leg and no root option, so its whole assurance rides the fixture suite. The suite drives opf upgrade through the isolated dispatcher (python3 -I -B opf/tools/opf.py) over BYTE-PINNED, FROZEN-literal genuine 1.0.0 stores built beneath throwaway temporary git repositories, anchored on the frozen baseline manifest and counters (the store an already-shipped 1.0.0 tool would have written); module-enabled and view-omitting variants are the frozen baseline plus exactly the rows a valid 1.0.0 store of that shape carries, derived by canonical string operations and re-asserted canonical in-gate through the emitter (the precondition upgrade itself enforces, so a future emitter change that would invalidate any frozen fixture is caught here rather than in the field). It asserts the store-schema upgrade to the tooling spec_version with exact exit codes, including the 1.1.0 origin (OPF-D2B PR3a, base spec 1.2.0), whose allowed schema delta is the spec_version bump alone (no other manifest field or counter change, no init.toml provenance fabricated); on a fixture whose declared views are current, every other store byte is unchanged, and the 1.0.0 contract and byte snapshots over an ENUMERATED ADOPTER-SHAPE MATRIX: the pristine baseline upgrade lands doctor-VALID with spec_version bumped to the tooling spec_version (1.2.0), decision_support retired, the three baseline type rows and two view rows added, DECISIONS.md widened to its four 1.1.0 sources, the counters extended, and the empty indexes created; idempotence is a byte no-op keyed on the target being doctor-VALID; governance-enabled, decision_support-enabled, and jointly-enabled 1.0.0 origins with empty AND populated module-tier indexes migrate with the now-baseline rows, indexes, and high-waters preserved byte-for-byte (a governance store keeps maintainer_action module-tier; the populated preference_pattern origin carries a ratified assistant pattern at rest, which fails without the creation-snapshot doctor fix); the optional decision_support module key and the optional DECISIONS.md composed view, present and absent, each migrate correctly; and a representative non-migrated module (delivery_assurance) is preserved value-exact. It asserts the fail-closed REFUSAL FIXTURES: a held lease and a malformed lease each refuse without deleting the lease; a dirty store refuses before any mutation with commit-or-move-aside advice and no restore command (the dirt is the owner's), never a whole-tree restore; a pre-declared contribution and a module-inconsistent maintainer_decision each refuse; and the above-tooling, non-canonical, not-adopted, and partial-1.1.0 triage cases refuse or report NOT APPLICABLE. It calls the pure postcondition (opf._upgrade_postcondition) DIRECTLY with hand-mutated new models, so a flipped retained module boolean, a mutated retained type row, a reordered or duplicated view source, and a raised, lowered, or missing counter each refuse while the genuine planner output passes. It runs a SEEDED, BOUNDED MIGRATION PROPERTY invariant over twelve generated genuine-1.0.0 stores (a module subset with the coupled rows, indexes, and counters, zero to two records per migrated type with matching high-waters, DECISIONS.md declared or omitted, the decision_support key present or absent), each of which must upgrade doctor-VALID at the tooling spec_version with every index, counter, worklog, and version byte-preserved. It arguably serves the change-carries-a-check and preserve-compatibility-or-migration disciplines, but the linkage to a single corpus rule is not undeniable, so none is claimed here. Class c: coverage is representative, not exhaustive, so the named gaps are: no live-adopter mutation leg (synthetic isolated fixtures only); synthetic mid-upgrade fault injection raises OSError immediately after manifest replacement and checks planned-scope recovery and owned-lease release, but does not exercise real process crashes between atomic writes or real filesystem I/O or permission failures; concurrent-writer races are exercised by the never-seize fixtures (a lease REPLACED in the acquisition-failure window and in the release window each LEAVES the peer's replacement and refuses; a compound mid-run-failure-plus-replaced-lease release surfaces BOTH the mid-run recovery advice and the never-seize note; an ABSENT-versus-REPLACED release distinguishes the two fail-closed) and the git-status porcelain status-pair vocabulary sweeps, but the disclosed unlink-by-name TOCTOU residual (a genuine kernel-level interleaving between the ownership read and the unlink) is synthetic and representative-only here, not driven by a real concurrent race; the 1.0.0 fixture fidelity established against the merge-base (commit 1c90fbb) doctor at authoring time and re-asserted at run time only by the canonicity round-trip, with module-tier records schema-deferred at 1.0.0 and validated by the actual upgrade-then-doctor leg here; and the section 5.7 sync and divergence axis having no runtime in this build. Missing git, unusable temporary storage, or any harness failure fails closed to 2 rather than a clean skip."

[[gate]]
id = "opf-record"
script = "opf/tools/check_opf_record.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = """
It runs the OPF record-authoring gate (opf/tools/check_opf_record.py, OPF-RECORD PR1 and PR2, the
decisions PR1 resolution bundle, and the decisions PR2 supersession and register paths) via its
--self-test --red-on-revert: there is no live-adopter leg (this repository is not an OPFiles adopter), so
the whole assurance rides the self-test. Each case copies a doctor-VALID template store built beneath the
gate's own temporary root (opf init, a commit, opf render --write, a commit) and drives opf record
create, transition, done-with-receipt, and worklog-append in-process, plus isolated child processes for
the crash and leftover-lock cases. It asserts that a comment-bearing index, counters, or worklog refuses
with every byte untouched; that create with links and refs publishes canonical bytes that reparse to the
planned record, while the verb's serializer itself refuses a lossy emitter and the whole run then refuses
with every byte untouched; that a plan mutating one extra field of an existing record, or the initial
status or requested title of the new record, or the requested summary of a new worklog entry, refuses;
that two sequential creates claim BI-1 then BI-2, each with its own worklog entry, with monotonic
counters, and that a counters map missing an enabled namespace refuses; that a kill at each journal step
(fifteen over the counters, index, and worklog operands of a create and of an assistant transition, and
eighteen over the counters, backlog index, done index, and worklog operands of a maintainer
done-with-receipt) leaves the killed run's lease, which refuses the next run before any recovery write,
and that once the operator releases it the next run's reconciliation leaves the operands exactly the
prestate or exactly the poststate, the poststate only when the transaction completed, and no killed run
reports an id; that an assistant transition of a backlog item to done lands done/proposed with no
receipt, an assistant done-with-receipt refuses before the store is resolved, a maintainer transition to
done refuses with every byte untouched, and a maintainer done-with-receipt (ratifying done/proposed, or
from active) lands done with exactly one receipt_of receipt and the store doctor-VALID once committed;
that a maintainer rejection without a reason, to a state other than the recorded pre-proposal state, or
of a proposal that does not record its pre-proposal state, and an assistant rejection, refuse with every
byte untouched, while a rejection with a reason returns to the recorded pre-proposal state and records
the reason; that the proposing transition writes the pre-proposal state into the record's own
proposed_from field, a rejection restores exactly that recorded state and removes the field, a forged
proposing worklog line (its FROM state rewritten canonically and committed with its views, doctor VALID)
changes nothing in either direction (the forged target still refuses, the genuine rejection still lands),
a proposal that carries no proposed_from (proposed outside the verb by a canonical hand edit) refuses
with every byte untouched, a reject-and-re-propose cycle merged --no-ff or squash-merged into the
mainline behaves exactly the same, and a current row the schema grades invalid (a proposed_from naming
an illegal predecessor, or a stray proposed_from on an unqualified status, each a doctor finding) is
never trusted or overwritten, the rejection, the ratifying done-with-receipt, and the proposing
transition each refusing with every byte untouched in its own test; that a planner mutation
changing only a value's type (an extension
count to true or 1.0, the index schema marker to true, the receipt counter to true) refuses before
publication with every byte untouched; that two branches creating from the same
committed counters conflict on the store paths and a canonical union resolution carrying a
duplicate BI-1 is doctor INVALID with a C-ID-SPACE finding; that a
held lease refuses and is never seized, success is reported only after the lease release, and a failed
release reports the final gate's recorded outcome (doctor-VALID after a create, the accepted pending
cannot-evaluate after an actor-dependent transition); that a store the final doctor grades not VALID
exits 2 with scoped recovery text, the change left for review and the lease released; that worklog-append
claims the next WL id with no status qualifier while an id inside a released span refuses; that an
interrupted journal refuses with every byte untouched while a live peer holds the shared lease through
the upgrade verb; that an operand edited after the interruption, on the prestate or the poststate side,
refuses naming the path with every byte untouched and reconciles once the edit is undone; that an unknown
or path-like create --type refuses with the enabled-baseline-types message before any operand read; and
that a run whose journal lock release fails after COMPLETE reports the retained lock, and the next run
reconciles it naming the COMPLETE transaction without claiming its render and doctor never ran; and
that a pending_decision's open -> decided carries its resolution bundle (a maintainer lands decided with
