the supersession and register flips (the planner writing no supersedes link, which only the
independent oracle refuses; the parser's record-id check dropped; the landing check, the target-decided
check, the target's validation call alone (applied separately to the invalid and the wrong-type
target), the target lookup together with every check after it (the lookup cannot be dropped alone;
applied separately to the missing and the other-namespace target), and the pre-publication chain rule
