[[gate]]
id = "opf-init-contract-check"
script = "opf/tools/check_opf_init_contract.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "It runs the OPF init CONTRACT and SOURCE consistency gate (opf/tools/check_opf_init_contract.py): it reads the D2b contract surface and its source authorities and fails closed, exiting 2 (cannot-evaluate) when an authority is missing, unreadable, or has changed shape so the contract can no longer be checked, exiting 1 on a concrete drift, and exiting 0 clean. It verifies that the validator's ACTOR_KINDS mirrors _opf_schema.py exactly (the vocabulary-drift tripwire), that the frozen KEEP operation id and schema are present in the validator and named in OPF-INIT-D2B.md, that the _INITIAL_VIEW_NAMES and REQUIRED_CHECKS authorities still exist, that the shipped D2a success wording is unchanged so D2b does not silently retrofit an envelope, that SUPPORTED_SPEC_VERSION is the 1.1.0 base the schema-compatibility obligation targets, that the review register enumerates F01 through F30, and that the validator and this gate are registered in both runners and the standalone-closure subset. Its --self-test is source-free (it confirms the frozen ACTOR line shape and the F01 through F30 range over in-memory strings). It arguably serves the change-carries-a-check and reconcile-record-against-reality disciplines, but the linkage to a single corpus rule is not undeniable, so none is claimed here. Class c: it is a presence-and-equality tripwire over named source anchors, not a semantic proof of the contract; it asserts that the constants and registrations are aligned, not that the validator's logic is correct (its sibling self-test carries that), and a renamed or refactored authority trips a cannot-evaluate for a maintainer to re-verify rather than passing silently."

[[gate]]
id = "opf-oplock"
script = "opf/tools/_opf_oplock.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "It runs the OPF operation-lock facility (opf/tools/_opf_oplock.py) via its --self-test: the module is the shared mutation-serialization primitive the coupled D2b operations will acquire, redesigned (OPF-D2B PR2) as a three-leg lock identity: a persistent POSIX advisory flock anchor (opf-oplock/mutex.lock, created once and never unlinked by release) under the AUTHORITATIVE common git directory (git rev-parse --git-common-dir with an explicit -C binding to the resolved store root over an allowlist-scrubbed environment that drops every ambient GIT_ variable, behind a three-way no-follow .git classification: genuine absence roots the control tree at the store root, a real directory or regular gitdir file asks git, and anything else, a symlink, a FIFO, an unreadable entry, or a failed or missing git on a git store, refuses rather than falling back to the repository root); an exclusive O_CREAT|O_EXCL active.toml operation record beside the anchor that persists the FULL acquirer owner identity (pid, uid, nodename, canonical /proc start time, session, and stamp); and a mandatory spec 5.7 lease.toml in the RESOLVED machine store, with both control records emitted through the checked TOML encoder (emit_checked round-trip plus closed top-key equality), created only beneath dir_fd no-follow walked parents with O_NONBLOCK on every control open, written by the shared full-write loop, and fsynced (file and parent directory) before the capability returns, the capability retaining descriptors, device and inode identities, exact payload bytes, and the acquirer identity (pid plus canonical /proc start time); a control-record write that fails mid-way unlinks the just-created singly-linked file by verified identity before raising, so no torn record is stranded. Release is identity-bound: it refuses a caller that is not the recorded acquirer before any leg runs, re-checks the retained anchor and control-directory identities, runs the reverse-order legs with error collection so the active-record leg still runs when the lease leg fails, performs each removal as a verified unlink (re-open no-follow, type, link count exactly 1, identity, size, byte equality, and a final pre-unlink name-stat) that preserves any mismatched file, and unlocks the anchor last. A stale record under a free anchor refuses acquisition and is cleared only by explicit recovery (recover=True), which itself proceeds ONLY when the recorded holder is CONFIRMED DEAD on this host by the journal's possibly-live-never-seized liveness model (_journal.owner_confirmed_dead over the persisted owner identity); a possibly-live, cross-host, or malformed holder, or a stale lease with no paired active record, is refused rather than seized, so a live holder whose records are exposed under a split anchor (a fresh anchor minted by an out-of-band unlink or rename of the mutex) is never seized into a two-holder state, and a paired lease is cleared only when its holder matches the confirmed-dead active record; staleness is never inferred from age or timeout, and the link-count ceiling applies to regular files only, never directories. The --self-test builds real git init stores with committed adopted trees, pins the git fixtures and the module's own rev-parse hermetically (HOME, XDG_CONFIG_HOME, and the global/system git config bound into a per-run temp dir), and asserts the PR2 regression roster (T-c1 to T-c14 plus T-crit1, T-med6, T-low1) together with the round-3 recovery-liveness witnesses and LOW-item coverage: the linked-worktree common-dir witness with cross-checkout contention, a bogus gitdir pointer refusal with no repo-root fallback, poisoned ambient GIT_DIR inertness, the anchor symlink, hard-link, permission, and unlink-recreate vectors, a group/other-writable control-directory refusal, mandatory-lease and exact-byte fidelity including the persisted owner identity, two product roots companion-pointed at one store contending on one anchor, a double-quoted holder round-tripping intact, stale-refuse with a lone owner-less lease fail-closed even under recovery, a LIVE holder's records under a split anchor refusing recovery (never a second holder), a confirmed-dead reaped-child holder recovering and clearing its paired lease, a foreign-nodename holder refusing recovery (never seizing a remote), mismatch-preserving release with the other leg still running, a same-bytes different-inode lease swap preserved, wrong-acquirer release refused from a forked child, the three-way .git classification including FIFO and missing-git refusals, prompt FIFO refusal at control names, the nested-lock scope-out, the single-sourced control-character field validation, and a forced torn control write that strands no file; a missing containment primitive or git binary makes the self-test itself return non-zero, never a clean skip. DEFERRED TO PR3: nested journal and index lock composition and any cross-lock ordering claim (the former capability methods and the phases subtree are removed, not carried). It arguably serves the change-carries-a-check and check-fails-closed-on-unreadable disciplines, but the linkage to a single corpus rule is not undeniable, so none is claimed here. Class c: coverage is representative, so it asserts these enumerated concurrency scenarios over synthetic stores rather than the full space of kernel-level interleavings, filesystem faults, and multi-host contention; the flock is advisory and binds only cooperating processes, and a same-uid actor who unlinks and recreates the anchor out of band is bounded by the control-directory ownership checks and the confirmed-dead recovery gate, not prevented; the final unlink is by name, so a window remains between the pre-unlink name-stat and the unlink, narrowed by flock exclusivity, never closed; acquirer and recovery identity degrade to bare pid equality where /proc start times are unavailable (non-Linux), where a confirmed-dead recovery rests on os.kill reporting the pid gone rather than on a start time; the machine store directory is validated for OWNERSHIP only, not group- or other-writability, so a group-writable machine store can weaken the lease leg where the control root and the machine store diverge in trust (ownership-only by design, to avoid over-firing on the shared-group adopter stores the machine store legitimately lives in; disclosed, not prevented); a store or common-dir path with a symlinked ancestor is refused by the no-follow walk rather than served; foreign-uid and permission-fault vectors are not exercised by the fixtures; it is the LOCAL in-repository serialization boundary, not a remote-visible lease for dedicated sync targets; and any harness failure fails closed to a non-zero exit rather than a clean skip."

[[gate]]
id = "opf-init-substrate"
script = "opf/tools/_opf_init_substrate.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "It runs the OPF coupled-init RESUME SUBSTRATE (opf/tools/_opf_init_substrate.py) via its --self-test: the module persists the durable per-operation resume substrate a coupled D2b init leaves behind, under <control-root>/opf-init/ops/<op_id>/, a SIBLING of the operation lock's opf-oplock control directory beneath the SAME authoritative control root, COMPOSING the merged lock facility (OPF-D2B PR2, #298) rather than reinventing it: the three-way no-follow .git classification and the git-answered common-dir resolution, the parameterized single-component control-home open, the no-follow dir_fd primitives, and the exclusive fsynced O_CREAT|O_EXCL control-file creation with torn-write cleanup are _opf_oplock's own. Per held capability it records plan.json, the frozen opf.init.plan/v1 document persisted CREATE-ONLY in the exact canonical JSON serialization with the frozen closed top-level key set, the scalar identity fields, and an operation_id equal to the held capability's op_id all validated BEFORE any filesystem write, and create-only NNNN-<phase>.json opf.init.phase/v1 records in a strictly contiguous bounded sequence whose on-disk tree is re-verified before every append through a FRESH per-listing descriptor (no lseek rewind of a retained directory fd, so the listing is portable across the macOS EINVAL and btrfs readdir-snapshot behaviours) and per-record sha256 CONTENT DIGESTS, with type and link-count hard refusals from an fstat of the OPENED object, so a foreign entry, a gap, an in-place rewrite, or a different-bytes replacement refuses the append, while a byte-identical replacement is accepted as the same record (harmless; the digest is the authoritative content check, a filesystem may reuse a freed inode, and the retained device-and-inode identity stays a diagnostic naming a rewrite apart from a replacement). Every substrate write requires the LIVE held capability: the recorded acquirer (pid plus canonical /proc start time), unreleased, the retained anchor identity still holding, and the freshly resolved control root carrying the capability's control-directory identity. The plan-aware resume classifier is READ-ONLY: it classifies each ops/ entry against its own plan into INTACT or a named per-entry CANNOT-EVALUATE (unreadable, malformed, non-canonical, gapped, duplicated, foreign, or symlinked, each fail-closed and PRESERVED), it deletes NOTHING, and the journal's blind unlink-to-prestate recovery path is never routed at substrate or init worktree paths; a crashed operation's CONTROL legs are cleared only by the lock module's own confirmed-dead explicit recovery, which the self-test witnesses leaving the substrate tree byte for byte intact. The --self-test builds real git init stores with committed adopted trees, pinned hermetically exactly as the lock module's suite, and asserts the T-s roster: the sibling-home placement with a linked worktree converging on the MAIN common git dir and a non-git store rooting at the store root; the live-capability write gate with a released capability, a forked child, and a broken anchor identity each refusing with nothing written; validate-before-write create-only plan persistence with a refused duplicate begin preserving bytes; contiguous content-digest-verified bounded phase records refusing foreign entries, in-place rewrites, and different-bytes replacements while accepting a byte-identical swap as the same record; the classifier defect matrix (tampered canonical bytes, a sequence gap, a duplicate sequence, a foreign entry, a mismatched record operation_id, a symlinked entry, a FIFO planted at the plan, and a malformed entry name) with a metadata (path, inode, size) snapshot proving the classifier changed nothing; the crash-classify-recover composition; a torn plan write stranding no file and rolling back the just-created directory; fail-closed classifier roots (an unresolved store, a symlinked .git, a symlinked substrate home); the read-side classifier bounds and UTC validity (a phase count or sequence past the MAX_PHASES bound is CANNOT-EVALUATE, and a phase utc is validated for the recorded RFC 3339 shape and calendar validity); the lseek-free fresh-descriptor listings; the plan-membership re-check in the same fresh listing the phase scan uses (a plan removed between its read and the listing is CANNOT-EVALUATE, never INTACT on stale bytes); the early whole-directory entry-count bound refusing before any phase record is opened; and mid-read OSError containment to a single CANNOT-EVALUATE entry with the survey continuing; a missing containment primitive or git binary makes the self-test itself return non-zero, never a clean skip. DEFERRED TO PR3: the plan PRODUCER (deep per-key validation and the plan_digest basis, validated here for grammar only), the phase-name vocabulary of the mutation phases, the first mutation (source-create, dedupe, provenance, seed-from-ancestral), and the resume DISPATCH that consumes the classifier's survey. It arguably serves the change-carries-a-check and check-fails-closed-on-unreadable disciplines, but the linkage to a single corpus rule is not undeniable, so none is claimed here. Class c: coverage is representative, so it asserts these enumerated crash and tamper scenarios over synthetic stores rather than the full space of kernel-level interleavings and filesystem faults; the classifier takes no lock, so a survey raced by a live writer can observe a mid-append tree (a resume dispatch runs it only after the lock module's confirmed-dead recovery has succeeded); the pre-append re-verification binds cooperating writers, not adversaries: the digest verify and the append are two steps, so an out-of-band writer with a retained open descriptor can mutate a record after the verify, the type and link-count refusals read a point-in-time fstat that a hard link added afterwards evades, the classifier's plan-membership re-check in the fresh listing is a name check rather than a content re-verification, so a same-name replace of plan.json between its read and that listing is not detected, and a same-bytes-different-inode swap is accepted by design, so adversarial-grade record integrity requires OS-level isolation of the control root (SYSTEM-HARDENING.md), which this layer does not provide; an empty substrate home or ops tree reads as no recorded operation; everything the lock module's own gate discloses (advisory locking, the stat-to-unlink adjacency, non-Linux identity degradation, ownership-only machine-store validation) applies unchanged to the composed legs; foreign-uid and permission-fault vectors are not exercised by the fixtures; and any harness failure fails closed to a non-zero exit rather than a clean skip."

[[gate]]
id = "opf-upgrade"
script = "opf/tools/check_opf_upgrade.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "It runs the OPF store-schema upgrade gate (opf/tools/check_opf_upgrade.py): both the default entry and --self-test run the SAME fixture suite, and there is no live-adopter mutation leg and no root option, so its whole assurance rides the fixture suite. The suite drives opf upgrade through the isolated dispatcher (python3 -I -B opf/tools/opf.py) over BYTE-PINNED, FROZEN-literal genuine 1.0.0 stores built beneath throwaway temporary git repositories, anchored on the frozen baseline manifest and counters (the store an already-shipped 1.0.0 tool would have written); module-enabled and view-omitting variants are the frozen baseline plus exactly the rows a valid 1.0.0 store of that shape carries, derived by canonical string operations and re-asserted canonical in-gate through the emitter (the precondition upgrade itself enforces, so a future emitter change that would invalidate any frozen fixture is caught here rather than in the field). It asserts the 1.0.0 to 1.1.0 contract with exact exit codes and byte snapshots over an ENUMERATED ADOPTER-SHAPE MATRIX: the pristine baseline upgrade lands doctor-VALID with spec_version bumped to 1.1.0, decision_support retired, the three baseline type rows and two view rows added, DECISIONS.md widened to its four 1.1.0 sources, the counters extended, and the empty indexes created; idempotence is a byte no-op keyed on the target being doctor-VALID; governance-enabled, decision_support-enabled, and jointly-enabled 1.0.0 origins with empty AND populated module-tier indexes migrate with the now-baseline rows, indexes, and high-waters preserved byte-for-byte (a governance store keeps maintainer_action module-tier; the populated preference_pattern origin carries a ratified assistant pattern at rest, which fails without the creation-snapshot doctor fix); the optional decision_support module key and the optional DECISIONS.md composed view, present and absent, each migrate correctly; and a representative non-migrated module (delivery_assurance) is preserved value-exact. It asserts the fail-closed REFUSAL FIXTURES: a held lease and a malformed lease each refuse without deleting the lease; a dirty store refuses before any mutation with commit-your-changes advice and a store-subtree-scoped recovery, never a whole-tree restore; a pre-declared contribution and a module-inconsistent maintainer_decision each refuse; and the above-tooling, non-canonical, not-adopted, and partial-1.1.0 triage cases refuse or report NOT APPLICABLE. It calls the pure postcondition (opf._upgrade_postcondition) DIRECTLY with hand-mutated new models, so a flipped retained module boolean, a mutated retained type row, a reordered or duplicated view source, and a raised, lowered, or missing counter each refuse while the genuine planner output passes. It runs a SEEDED, BOUNDED MIGRATION PROPERTY invariant over twelve generated genuine-1.0.0 stores (a module subset with the coupled rows, indexes, and counters, zero to two records per migrated type with matching high-waters, DECISIONS.md declared or omitted, the decision_support key present or absent), each of which must upgrade doctor-VALID at 1.1.0 with every index, counter, worklog, and version byte-preserved. It arguably serves the change-carries-a-check and preserve-compatibility-or-migration disciplines, but the linkage to a single corpus rule is not undeniable, so none is claimed here. Class c: coverage is representative, not exhaustive, so the named gaps are: no live-adopter mutation leg (synthetic isolated fixtures only); no mid-upgrade fault injection (a crash between the atomic writes, an I/O or permission fault); concurrent-writer races are exercised by the never-seize fixtures (a lease REPLACED in the acquisition-failure window and in the release window each LEAVES the peer's replacement and refuses; a compound mid-run-failure-plus-replaced-lease release surfaces BOTH the mid-run recovery advice and the never-seize note; an ABSENT-versus-REPLACED release distinguishes the two fail-closed) and the git-status porcelain status-pair vocabulary sweeps, but the disclosed unlink-by-name TOCTOU residual (a genuine kernel-level interleaving between the ownership read and the unlink) is synthetic and representative-only here, not driven by a real concurrent race; the 1.0.0 fixture fidelity established against the merge-base (commit 1c90fbb) doctor at authoring time and re-asserted at run time only by the canonicity round-trip, with module-tier records schema-deferred at 1.0.0 and validated by the actual upgrade-to-1.1.0-doctor leg here; and the section 5.7 sync and divergence axis having no runtime in this build. Missing git, unusable temporary storage, or any harness failure fails closed to 2 rather than a clean skip."

[[gate]]
id = "opf-import"
script = "opf/tools/check_opf_import.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "It runs the OPF import-operation gate (opf/tools/check_opf_import.py): both the default entry and --self-test run over synthetic staged import runs, and there is no live-adopter leg (the `opf import` verb is now wired, but this repository is not an OPFiles adopter and has no staged import run to check live), so the default entry prints NOT APPLICABLE and exits 0 and the whole assurance rides the --self-test leg. The self-test builds a clean staged run through _opf_import.plan_import over throwaway stores and asserts an explicit registry of eighteen staged-run checks (staged-run-structure, with the run-id grammar and every required TOML including plan.toml parseable; report-schema; artifact-digest-integrity; mapping-totality, that per source the spans tile [0,size) exactly; mapping-state-vocab over the eight spec-14.1 states; mapping-origin-vocab over the spec-14.1 provenance origins; lf-bijection as a one-to-one (source_path, span) correspondence between quarantine-state mappings and legacy_fragment records, not a bare count; lf-quad-completeness; source-preservation; inventory-digest recompute; report-binding-digests, that report.toml's plan_digest recomputes over the staged plan.toml bytes and its inventory_digest matches inventory.toml; proposals-artifact, that proposals.toml is present, schema/run-id correct, every row stamped origin=model_proposal, and IMPORT-REPORT.md is byte-reproducible from inventory.toml + proposals.toml + run id; and the four acceptance checks over the conditionally-present acceptance.json (opf.import.acceptance/v1) captured by --review, acceptance-schema, acceptance-binding, acceptance-attribution, and acceptance-completeness; and the two Group C apply-promotion transaction-record checks over the conditionally-present per-run transaction.toml at the store-root .aiqt/import/<run-id>/ (OUTSIDE .working/, so it survives the terminal run-dir deletion), transaction-schema and transaction-consistency) each PASSes on the clean run and FINDINGs on its own single-mutation discriminator (including a present-but-unparseable plan.toml, a count-preserving legacy_fragment swap, a malformed transaction record, and a state-published record with no archived acceptance). The acceptance layer is CONDITIONALLY PRESENT: an absent acceptance.json is a legitimate pre-review state recorded as a PASS (not yet reviewed), a present-but-unparseable one is fail-closed (all four acceptance checks FINDING), and a present-and-valid one runs the independent recompute (the {run_id, plan_digest, inventory_digest} binding plus a per-decision origin/proposed_state echo, a non-empty self-asserted actor.declared, and one-decision-per-fragment completeness with the model_proposal-resting-requires-an-explicit-accept rule), asserted PASS present-and-valid and FINDING on each single mutation (a wrong schema format, a blank actor, a stale plan_digest, a dropped decision, and a model_proposal resting mapping left unaccepted). The emitted check-set is reconciled against the declared registry so an omitted check reads as a FINDING never a silent pass, an all-missing run dir is all-FINDING, the scan layer is determinism- and fail-closed-checked, and it DELEGATES to the operation-layer module self-test (_opf_import.self_test(), which carries the scan/plan/review/apply unit invariants including the apply-promotion behaviour checks over doctor-composable synthetic stores (promoted, idempotent no-op, reject-blocked, acceptance-required, and composition-gate-fail-closed), the review acceptance-capture invariants, and plan-leaves-the-active-store-unchanged) requiring it green. It arguably serves the change-carries-a-check and check-fails-closed-on-unreadable disciplines, but the linkage to a single corpus rule is not undeniable, so none is claimed here. Class c: coverage is representative, so it asserts these staged-run and scan scenarios with exact verdicts over synthetic runs, not the operation layer's whole input space; the apply-promotion live-store cutover's deep crash/journal/restore invariants (journaled preimage rollback, crash-recovery replay, single-writer lock reconcile) are exercised by the _opf_import module suite through apply_import and by _journal's own crash-injection harness rather than by this staged-run gate, which validates the resulting transaction-record shape and state-machine consistency (Group C); and the semantic correctness of a mapping and the AUTHENTICITY of a named acceptance actor (actor impersonation, review-time backdating, or fabrication by any principal with write access to the run dir) are out of gate scope: the gate guards the review-to-promotion binding, not identity authenticity, which the reserved v1 seam is the upgrade path for; any harness failure fails closed to 2 rather than a clean skip; and it runs over synthetic isolated fixtures rather than a live adopter product repository."

[[gate]]
id = "opf-ingest"
script = "opf/tools/check_opf_ingest.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "It runs the OPF root-ingest detection gate (opf/tools/check_opf_ingest.py, OPF-MIGRATE MIG-PR1): both the default entry and --self-test run over synthetic stores, and there is no live-adopter leg (root-ingest wires no verb in this slice and this repository is not an OPFiles adopter, so it has no store to detect live), so the default entry prints NOT APPLICABLE and exits 0 and the whole assurance rides the --self-test leg. The self-test builds synthetic resolved stores through the OPF store layout and asserts a registry of checks over the read-only _opf_ingest.detect worksheet: worksheet-structure (detect over a clean store returns verdict 0 with a worksheet whose closed top-level keyset holds: the opf-ingest-dispositions-v1 format token, the schema marker, the row array, and the recorded worksheet_digest); worksheet-schema-vocab (every row is the closed keyset and its disposition is one of {unresolved, keep, migrate, move}, its origin one of the spec-14.1 provenance origins reused from the import layer, and its scope one of {store, declared}, exactly); worksheet-digest (the recorded worksheet_digest recomputes over the row set, a determinism and integrity anchor); detection-completeness (an INDEPENDENT re-enumeration of the store .working/ scope, by os.walk rather than the detector's contained walk, equals the worksheet's store-scope source_paths, so a planted store-scope file the worksheet omits is caught, the load-bearing coverage guarantee); detect-writes-nothing (the synthetic store is byte-identical after detect, SECI-preview-has-no-side-effects); and managed-path-exclusion (an OPF-managed file, the manifest, a control ledger, a file under .working/imports/, or an already-declared [unmanaged] path, does NOT appear as a detected row, which catches over-detection where completeness alone catches under-detection). Each check PASSes on a clean detection and FINDINGs on its own single-mutation discriminator, and it DELEGATES to the engine's own unit suite (_opf_ingest.self_test(), which carries determinism, store-scope enumerates-each-once, declared-scope --include glob matching with glob-no-match/escape/store-scope each a finding, init-first CANNOT-EVALUATE on an unresolved store, symlink-in-scope fail-closed, per-row sha256 correctness, and the dispatch-deferral pin that `opf adopt` stays unwired) requiring it green. It arguably serves the change-carries-a-check and check-fails-closed-on-unreadable disciplines, but the linkage to a single corpus rule is not undeniable, so none is claimed here. Class c: coverage is representative, so it asserts these detection and worksheet scenarios with exact verdicts over synthetic stores, not detect's whole input space; the SEMANTIC correctness of a disposition (which files should be kept, migrated, or moved) is a human decision and gate-blind (detect defaults every row to unresolved and takes no action); there is no acceptance or actor authenticity in this slice (review is MIG-PR4); the importer layer, plan composition, apply promotion, and verb wiring that later slices add are out of scope; and it runs over synthetic isolated fixtures rather than a live adopter product repository. Any harness failure fails closed to 2 rather than a clean skip."

[[gate]]
id = "opf-adopt-selftest"
script = "opf/tools/_opf_adopt.py"
rules = []
platform = "ci"
default = "block"
class = "a"
residue = "It exercises the OPF adoption schemas and closed twelve-op vocabulary through the existing pure-validator vectors, plus the read-only investigate/plan fixture suite. The planning suite checks canonical observation/inventory/plan digest bindings, deterministic emission, attributed revisions, stale-inventory refusal, unresolved migration without staging, observed move-target absence, preservation of the resolver's foreign-store CANNOT-EVALUATE status, injected read failure, missing sources, symlink/hardlink/FIFO refusal, representative resource bounds, malformed inputs and pointers, unresolved manifests, and recorded machine-store/unmanaged exclusions. It checks fixture byte preservation and denies write-mode opens, subprocess creation and journal transactions during its successful planning case. Outcomes come from returned statuses and unittest results, not grepped prose. Coverage is representative, not exhaustive: it does not prove race freedom against an adversarial writer, complete foreign-file detection inside excluded machine-store subtrees, semantic configuration or pipeline detection, companion-store support, trusted release payloads, valid import acceptance, cross-operation executability, hook activation, live-adopter behavior, or adoption success. The engine returns inert bytes and implements no apply or acceptance operation. Its linkage to a single corpus rule is not undeniable, so none is claimed here."

[[gate]]
id = "opf-standalone-closure"
script = "tools/check_opf_standalone_closure.py"
rules = []
platform = "ci"
default = "block"
class = "a"
residue = "It proves by PHYSICAL ABSENCE that the opf/ subtree is dependency-closed (OPF-SELF-CONTAIN): it materializes opf/ ALONE into a throwaway temporary directory with no AIQT tree reachable, then runs the OPF gate subset there under python3 -I (neither the working directory nor PYTHONPATH is on sys.path, so only the copied opf/tools/ is reachable). Any surviving UPWARD edge into tools/ (a from-check_versions import, an import check_byte_canon, the emitter's pinned sibling-file authority load, or the lazy check_opf_import) fails at import or run time in the isolated copy; the three closure-critical edges are lazy or dynamic, so the subset drives the exact command paths that exercise them (opf.py --self-test runs the render, emitter-authority, and import-dispatch legs; the commonmark selftests exercise the vendored parser and its manifest). Closure is OBSERVED, not grep-inferred. The --self-test carries the change-carries-a-check discriminator: a deliberate flip re-introduces the pre-move upward edge (opf/tools/_opf_store.py importing _parse from check_versions instead of the extracted _semver) into an isolated copy and requires the subset to fail, so the gate cannot pass a tree that is not actually self-contained. It runs the deterministic, git-independent self-test legs (which build their own throwaway fixtures) rather than the live adopter legs, and copies the tracked opf/ tree rather than a stranger's checkout, so it asserts self-containment of the authored subtree, not behaviour against a live product repository; any harness failure (opf/ absent or unreadable, a failed copy, no interpreter) fails closed to 2 rather than a clean skip."

[[gate]]
id = "aiqt-corpus-selftest"
script = "tools/selftest_aiqt_corpus.py"
rules = []
platform = "ci"
default = "block"
class = "a"
residue = "It exercises the generic corpus-tool core (tools/aiqt_corpus.py) end to end: the discovery/targeting helpers (suffix and exempt-dir/exempt-file filtering, dedup-and-order iteration, the scan-root allow-list walker), the text/markdown primitives (table-row splitting, separator detection, multi-backtick code-span stripping, fence detection and non-code-line iteration over fenced/tilde/unterminated blocks), the ISO-date parser and month arithmetic (month-end clamp, leap February, year roll), the field-agnostic metadata parser (head-window bound, first-occurrence-wins, trailing-backslash strip, tolerated annotations), head_version field-name precedence, the whitespace-preserving git helper and git_show present/absent, and the genericity invariants the module exists to hold (the exempt-dir default carries only universal VCS/build directories, the scan-root walker refuses a module-level repo root, and __all__ is pinned to the exact public surface). It arguably serves the change-carries-a-check discipline, but the linkage to a single corpus rule is not undeniable, so none is claimed here. Every fixture is synthetic and assembled in a tempdir and the git helpers run against a throwaway repository; it asserts representative scenarios with exact expected values, not the module's whole input space."

[[gate]]
id = "commonmark-headings-selftest"
script = "opf/tools/selftest_commonmark_headings.py"
rules = []
platform = "ci"
default = "block"
class = "a"
residue = "It exercises the vendored-Marko changelog heading adapter (opf/tools/_commonmark_headings.py) end to end: direct-child H2 heading selection by source span over representative CommonMark inputs, and the fail-closed HeadingScanError cannot-evaluate on a parser fault, a structurally-degenerate parse result (a document with no children list or a heading node with no integer level), a missing or invalid source span, oversized input (over 1 MiB), a submodule or root import origin outside the vendored tree, and a version or provenance mismatch; and the verify_vendor_manifest byte-integrity logic, both over synthetic drift scenarios (a clean manifest verifies, while a mutated file, an extra file, a missing file, and an unreadable tree each fail closed) and against the REAL committed vendored tree under default arguments. It arguably serves the change-carries-a-check discipline, but the linkage to a single corpus rule is not undeniable, so none is claimed here. It asserts representative synthetic scenarios with exact expected values in a tempdir, not the adapter's whole input space; the standing per-push byte gate over the vendored tree is the release manifest (check_manifest against .aiqt/manifest.toml), which this complements rather than replaces. Marko's parse is worst-case superlinear on crafted pathological input within the 1 MiB byte ceiling, so a maliciously-shaped changelog can be slow (an availability residual, never a wrong verdict; the gate step carries no wall-clock timeout, and the changelog is maintainer-authored in-repo content)."

[[gate]]
id = "commonmark-conformance"
script = "opf/tools/selftest_commonmark_conformance.py"
rules = []
platform = "ci"
default = "block"
class = "a"
