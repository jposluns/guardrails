rules = []
platform = "ci"
default = "block"
class = "a"
residue = "It checks that every external site link opens in a new tab with a noopener rel. It is a site UX and reverse-tabnabbing-safety invariant, not a corpus-rule linkage, so none is claimed here."

[[gate]]
id = "install-page"
script = "tools/check_install_page.py"
rules = []
platform = "ci"
default = "block"
class = "a"
residue = "A static tripwire over site/install.html, site/js/install.js, and site/styles.css: it checks that the five family sections are present and statically visible, the picker links and single hidden reset and aria-live status region are present with no pre-set filter state, install.js is an external script with no inline code in the picker or sections, and the guarded html[data-family] collapse rule is present. It is deliberately NOT a CSS engine or a browser: it cannot detect a new stylesheet rule that hides a family section without the guard, a hiding ancestor, or a custom clip/opacity class, which are left to review and the cross-family QA. Its linkage to a single corpus rule is arguable, so none is claimed here."

[[gate]]
id = "sized-instructions"
script = "tools/check_sized_instructions.py"
rules = []
platform = "ci"
default = "block"
class = "a"
residue = "It checks the three hand-authored sized instruction condensations (aiqt-instructions-8k/5k/1_5k.txt) against their character caps, agree on version with the authoritative skill version and the generated full instructions file, and match a recorded SHA-256 of that generated source, failing until a maintainer reconciles them and re-blesses with --update. Because the condensations are hand-authored, it cannot judge whether their trimmed prose faithfully preserves the standard's meaning; the editorial fidelity of a condensation is human judgment the cap-and-version-and-source-hash checks cannot verify. Its linkage to a single corpus rule is arguable, so none is claimed here."

[[gate]]
id = "versions"
script = "tools/check_versions.py"
rules = []
platform = "ci"
default = "block"
class = "a"
residue = "It checks version format and single-sourcing. It arguably serves the change-tracking discipline, but the linkage to a single corpus rule is not undeniable, so none is claimed here."

[[gate]]
id = "version-monotonicity"
script = "tools/check_version_monotonicity.py"
rules = []
platform = "ci"
default = "block"
class = "a"
residue = "It checks the append-only monotonicity of the pack's version history across a change: the changelog release sequence never moves backward and is prefix-preserved, the dormant tag layer arms with the first tagged release, and the release-order record and the id-history register are each an exact full-row prefix of their prior state, so no shipped release row, tag, or identifier row is rewritten, reordered, or removed. It does not judge whether a version bump is semantically justified (the release-delta gate owns the required-bump computation), and its linkage to a single corpus rule is arguable, so none is claimed here."

[[gate]]
id = "release-delta"
script = "tools/check_release_delta.py"
rules = []
platform = "ci"
default = "block"
class = "a"
residue = "It computes the minimum required SemVer bump from machine-readable deltas over the whole governance surface (clause canonical text, the full pack-owned path keyset, ownership classes with the absolute-minimum cap, the declared order record, and the renderer/generator declaration) and fails a claimed bump below it, forcing a public disposition row for every dispositioned change. It forces the disposition row mechanically but cannot judge whether the human classification a row records is correct; the profiles/groups leg is dormant until the adopter-experience artifact ships; dispositions are trusted as authored once schema-valid; and it runs in genesis mode (no delta computed) until the first anchored release exists."

[[gate]]
id = "release-build"
script = "tools/check_release_build.py"
rules = []
platform = "ci"
default = "block"
class = "a"
residue = "It validates the release build order, the annotated release tags and their resolution to the recorded object and commit SHAs, the genesis uniqueness declaration, the release-order ordering gate, and the attestation chronology against the tagger date. The chronology layer is keyless ordering evidence within the anchored history, not cryptographic proof; the QA-store retrieval, success, and family-set layers run maintainer-side only (the private store is unreachable from CI, which validates the anchored chain instead); and every tag- and row-dependent layer is dormant only while the repository carries zero release tags AND zero attestation rows, arming when the first release tag or row exists, with a lightweight release tag disallowed."

[[gate]]
id = "clauses"
script = "tools/check_clauses.py"
rules = []
platform = "ci"
default = "block"
class = "a"
residue = "It checks the frozen clause inventory: every rule corpus-id has a clause row, each clause-id follows the corpus-id.ordinal scheme with an ordinal strictly above the cumulative maximum ever used for that corpus-id, each clause canonical text is a unique byte-exact substring within its source line window with a matching whole-file digest, and no tombstoned or retired id is resurrected. Its linkage to a single corpus rule is arguable, so none is claimed here."

