[[gate]]
id = "selftest-execution"
script = "tools/check_selftest_execution.py"
rules = ["chgchk", "evgcmp"]
platform = "ci"
default = "block"
class = "a"
residue = "Total over its declared surface, in three layers. Layer one, STATIC pre-launch: every check() call site in the registered runner's source is resolved to literal ids and that set must equal the hand-authored expectation manifest tools/selftest_checks.toml exactly before any child is launched; it resolves only direct bare-name check() call sites with string-literal or for-loop-literal ids (the loop attribution is the innermost enclosing for, lexical only: it does not model any intervening dataflow between the loop header and the call site, a rebinding of the loop variable or a nested function boundary, so such a site can mis-attribute its ids, caught, if at all, by the runtime set reconcile), and a non-call reference to the bare name check, a comprehension-bound id Name, any other unresolvable or duplicate source id, and source that does not parse are refused fail-closed, never silently resolved, while two static blind spots remain, bounded the same way: an invocation route the static layer never sees a call site for because it never names check as a bare Name in Load context (getattr, exec, an import that binds a different name and is then called through it, or a globals()['check'] lookup), and a rebinding of the name check the static layer cannot detect (any Store-class or non-Load binding: an assignment, a with-as or except-as target, a nested def check or class check, an import check, a del check, or a global or nonlocal declaration), which leaves the direct call sites visible and counted while they may no longer invoke the instrumented helper; both are caught, if at all, by the runtime set reconcile, a registered id whose only route is invisible (no direct call site at all) is refused by the static layer pre-launch as a registered id with no source check(), and the dead-direct-site decoy (a route that re-executes an already-registered id whose direct call site is dead) passes both set layers and is bounded only by the non-discrimination residual (a constant-true check counts as executed). Layer two, RUNTIME: the executed check-id set recorded at the instrumented check() choke point is emitted as a strict structured report and reconciled exactly against the same manifest, judged with the child's real exit code; missing, extra, or duplicate ids, a missing, malformed, wrong-suite, or non-regular report, a malformed manifest, and every cannot-evaluate fail closed, and a child exit 0 never overrides a missing or mismatched report. Layer three: the child carries its own in-run self-guard, reconciling the same set even on a direct developer run. The child suite's own behavioural assurance (the orchestrator-integrity acceptance vectors over hermetic fixtures, judged on structured verdicts) rides the child's verdict, which this gate requires; the gate launches that child under a git-neutral environment built in two layers (HOME and XDG_CONFIG_HOME pinned to a fresh empty directory, so the per-user global config, ignore, and attributes surfaces are empty for every descendant git call, including one made after a descendant scrubs the GIT_* environment and drops the GIT_* pins, plus, for the immediate child, ambient GIT_* dropped, the global and system config files pinned to os.devnull with GIT_CONFIG_NOSYSTEM, and core.excludesFile and core.attributesFile overridden to os.devnull by injected entries), and drops every ambient PYTHON*-prefixed variable from the child environment, transitively neutralizing PYTHONPATH/sitecustomize module injection into descendant interpreters (nothing downstream re-derives or re-sets a PYTHON* variable, and the runner's own interpreter grandchild launches carry -I -B as defence in depth for a direct developer run), which hardens the GATE-launched child only, the runner's own direct-invocation hermeticity being a separately tracked item; three launch-environment bounds are disclosed: the system-wide git config ($(prefix)/etc/gitconfig) is neutralized only for the immediate child (GIT_CONFIG_NOS