[[gate]]
id = "opf-adopt-hook-selftest"
script = "opf/tools/_opf_adopt_hook.py"
rules = []
platform = "ci"
default = "block"
class = "a"
residue = "It exercises the OPF adoption enable-hook merge core (opf/tools/_opf_adopt_hook.py, PR3 slice 1): the pure, no-write structured-merge library for executable-on-load assistant-platform registration files, built and threat-modelled before any slice can write one (the enable-hook op row stays declared-only in the vocabulary; the op wiring, old_digest/new_digest binding and journal publication are the next slice). The self-test runs synthetic byte vectors through merge_registration and asserts, judged on returned statuses and bytes: the successful merge under a refusing double net whose exact boundary is the audited open event plus every audited os./socket./subprocess./shutil./glob./tempfile. event and mock denials of stat, lstat, access, open, readlink, fstat, statvfs, write and pipe on both os and its posix re-export plus io.open, builtins.open, socket.socket and subprocess.Popen, with every net element canary-guarded (one canary per mocked entry point required to come back refused and recorded by exactly its own deny, one per refused audit namespace plus the bare open event, and one real call per layer) and negative canaries pinning the boundary from outside (entry points the net does not cover are excluded by import review, not by the harness: audited events outside the refused namespaces, such as a ctypes foreign call's audited ctypes.call_function or an fcntl.fcntl call on an already-open descriptor, as well as unaudited, unmocked functions such as an unlisted os function); deterministic canonical emission as a fixed point (merge, emit, reparse, re-emit is byte-stable) and bitwise-identical repeat merges; model preservation (the emitted bytes reparse to exactly the prior model plus the one inserted canonical entry, verified inside the merge and again by the test, so a blind append or regex splice cannot ship); idempotence (merging an already-merged file is a verified no-op returning the file's own bytes with changed False); the foreign-registration flip (an unrecognized top-level key refuses INVALID with no bytes to write, never a best-effort merge; reverting the closed-keyset guard turns exactly this vector red); out-of-vocabulary closed tokens (an unknown hook event or hook-entry type) refusing CANNOT-EVALUATE; injection vectors (a control character, line separator or paragraph separator in the candidate plugin_entry, an existing registered command, or a matcher refuses across the whole code-point space via the single-sourced _opf_adopt token rule); unparseable, duplicate-key, non-finite-constant, non-UTF-8, wrong-container, oversize and non-bytes registrations refusing CANNOT-EVALUATE, and a number lexeme outside the strict ASCII grammar refusing at the parse hooks whichever json scanner ran (a vector patches in a pure-Python scanner whose digit pattern admits non-ASCII digits, with a canary that it does, and pins the refusal on the merge and already-merged paths); one ENTRY GATE per public function (fix 5, replacing per-site, per-dunder hardening: merge_registration accepts old_bytes only as EXACTLY bytes and plugin_entry only as EXACTLY str, both by type identity, with the candidate length-bounded by MAX_REGISTRATION_BYTES before any whole-candidate scan; validate_registration_model walks the model once, iteratively and cycle-safe, refusing any foreign-typed node, keys included (a foreign key inside an opaque subtree pins the key half); canonical_hook_group raises on a candidate that is not exactly str, is longer than the bound, fails the token rule or carries a surrogate code point, each guard pinned by its own direct vector, and merge_registration refuses a surrogate-carrying candidate INVALID at its candidate gate with a pinned candidate finding on the merge and already-merged paths; every gate refusal is one FIXED message that never runs a method of the refused object, no repr, no str, no __bytes__, so a bytearray, a bytes or str subclass, a __bytes__-override carrier and a __class__-spoofing subclass all