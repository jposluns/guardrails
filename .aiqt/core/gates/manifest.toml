[[gate]]
id = "doctor"
script = "tools/doctor.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "The core adopter-side doctor (plan 4.3), READ-ONLY by default: it runs the state-completeness, pin-and-manifest, history-chain, open-journal, repoints, reverse-step, transition, and unadopt-intent assertions and never performs recovery (any state-changing recovery is a separate explicit pin.py invocation with authorization). Its self-test asserts a clean absence is NA, a pin without history is MALFORMED (exit 2, never NA), and a casual in-place edit of a non-tail history row FAILs; its live --root . leg reports NOT APPLICABLE in this repo (the pack is not an adopter install). HONESTY LIMIT (10.2), stated in every chain message: with no keys the pin-history is a keyless hash chain that catches a CASUAL in-place edit of an interior row ONLY; it does NOT catch truncation of a valid tail and cannot rule out a splice, so it proves NOTHING and authorizes NOTHING on its own, and the doctor's messages DISCLOSE this limit rather than implying otherwise. It does not establish the full concern-3 set-equality (owed to the adopter-experience spec), does not judge whether a human authorization is well-founded, and reasons only over the pin-state the install actually carries. Its linkage to a single corpus rule is arguable, so none is claimed here."

[[gate]]
id = "python-launcher-isolation"
script = "tools/check_python_launcher_isolation.py"
rules = ["seccet"]
platform = "ci"
default = "block"
class = "c"
residue = "A deterministic scan over a RECOGNIZABLE SUBSET of the repo's Python launcher configuration: the generated plugin hooks.json, tools/run_all_checks.sh, every regular *.yml/*.yaml under .github/workflows/, and the optional .claude/settings.json files. A direct python3 launcher there is FAILed unless it runs isolated (-I, or the full -P -E -s), so a tool-written sibling cannot shadow a stdlib import and neuter the control; the gate itself refuses to run non-isolated (exit 2) so a sibling cannot neuter the gate first, and it fails closed (exit 2) on a missing, unreadable, non-regular, or malformed input rather than passing it as clean. It does NOT catch: wrapper or indirect launchers (a bash -c string, a .sh re-launcher), $PYTHON or shell aliases and functions, a dynamically assembled argv, the programmatic subprocess children in the tools and the regenerate strings in .aiqt/gensrc.json (a separate follow-up), a script that mutates its own sys.path at runtime (which -I cannot prevent), an unrecognized interpreter name, launcher configuration outside the enumerated surfaces, YAML or shell constructs beyond the supported line grammar, and the PATH provenance of python3 itself; a python3 token embedded in a quoted argument or a heredoc may be miscounted."

[[gate]]
id = "python-floor"
script = "tools/check_python_floor.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "Checks that the single source .aiqt/core/python-floor.toml parses and names the decided floor, that every python-version pin in the CI workflows, the adopter CI template and its inline copy equals it, and that each entrypoint listed in guarded-surfaces opens with the canonical guard (AST-matched) and, run in a child with sys.version_info patched below the floor under no flag, -O and -OO, exits 2 with empty stdout, the exact refusal and an untouched working directory. The guarded-surfaces list is EMPTY in this unit, so no shipped entrypoint is yet checked; the completeness check (every shipped entrypoint listed) and the documentation check (each declaration file states the floor) exist and are self-tested but stay OFF until the source sets completeness-check and documentation-check to true. The patched version is a proxy for a real older interpreter, faithful only for a guard that reads sys.version_info; a file that an older interpreter cannot compile fails before its guard runs, and the dynamic leg sees a compile failure only on the interpreter running it. The completeness scan walks the working tree, not the git index, and skips the named excluded trees and directory names. The pins leg is a conservative line model, not a YAML parser. Every workflow file whose name ends in .yml or .yaml in any case is scanned. Pins are also read in every local action file (each action.yml or action.yaml under the tree, the name in any case, and the target of each uses: ./PATH); a local uses: path with no action file in the tree is cannot-evaluate. Each scanned workflow or action file (not the inline Python copy) is held line by line to an enumerated plain grammar, and any other line is cannot-evaluate (exit 2), naming file and line: a blank line; a comment; a --- that opens the file; a plain key (letters, digits, underscore, dot and hyphen, no quotes, no spaces), a colon, then nothing, a plain scalar, a one-line quoted scalar (single-quoted, or double-quoted with no backslash), a one-line flow sequence or mapping of such scalars, or a block scalar indicator whose body is skipped only by indentation; and a list item holding one of the same. So an explicit key (?) and its value line (:), a quoted key or one with a space in it, a backslash escape, a quoted scalar that does not close on its line, a continued plain scalar (a more indented - line included), an anchor, alias, tag or merge key, a nested sequence, a tab in the indentation and a later document marker are each cannot-evaluate, and so is a key repeated at the same indentation in one block mapping (two with: in one step). Every line that names the python-version key must be the one strict form (the bare key in lower case, optional spaces, a colon, spaces, exactly one plain, single-quoted or double-quoted scalar, then an optional comment); the next non-blank line after a pin, comment lines included, may not be more indented than its key; each is cannot-evaluate otherwise. The key is found without regard to case, since the runner reads an input by its upper-cased name, so a key in any other case is cannot-evaluate, and so is any line, script text included, that names INPUT_PYTHON-VERSION. In every scanned file, a line that still carries a carriage return once its one trailing CR is removed, or carries U+0085, U+2028 or U+2029, is cannot-evaluate. A step that uses actions/setup-python (the name in any case, any version) is a finding unless a strict pin line directly under the step's own with: key sets its python-version input; the step runs from its - marker line to the next non-blank line at the same or lesser indentation, and a comment line never ends it. A uses: line that is not one plain or quoted literal, a line that names setup-python anywhere else, and a setup-python uses: line whose - marker the line model cannot find are cannot-evaluate, and a python-version-file input is already cannot-evaluate as a line that names the key. A literal uses: value that names setup-python in any case, or whose path split on / with empty parts dropped begins actions/setup-python, is cannot-evaluate unless it is exactly actions/setup-python@REF or actions/setup-python/PATH@REF (no empty, . or .. path part, no leading or trailing slash, no .git suffix), and a with: whose body is a block sequence is cannot-evaluate. The leg checks only the python-version input of a setup-python step: an update-environment: false input or an if: condition that skips the step can leave another interpreter in use by later steps, and is not judged. Script text that names the key is judged as written and fails closed, a disclosed over-rejection; a block scalar body is skipped by the YAML indentation rule, and a reader that accepts what the YAML specification rejects is not modelled. What remains: in the inline Python copy, read by the pin rule only and as written, a multi-line flow value around a pin, and a Python string escape that hides a uses: or setup-python spelling (the canonical-copy check in opf/tools/check_opf_doctor.py ties that copy to the shipped github-actions.yml, which the grammar reads); an INPUT_PYTHON-VERSION variable whose name is built at run time; the action run as a fork or copy under a name that does not name setup-python; and a remote action, a remote reusable workflow and a docker:// image, whose content is not in the tree and is not read. Pins are read only in the named files, and declarations only as the exact phrase."

[[gate]]
id = "branch-root"
script = "tools/check_branch_root.py"
rules = ["brnrot"]
platform = "ci"
default = "block"
class = "c"
residue = "Judges only the revision under gate against the derived protected ref: it does not scan the repository's other branches, cannot prove where a branch was originally cut (a branch cut from a sibling that itself descends from the protected line still resolves), passes a fork point that survives a partial rewrite unless the configured lag threshold catches it, does not fail on multiple merge bases, and where no threshold is configured the staleness layer reports and never blocks. With multiple merge bases the reported first-parent lag is the MINIMUM (most-lenient) across bases, so a criss-cross history is judged by its nearest fork point. Replace refs are neutralized in the scrubbed env (GIT_NO_REPLACE_OBJECTS=1) so a `git replace --graft` cannot mask an orphan as rooted through merge-base; the on-disk .git/info/grafts residual is out of scope (an accidental-case guardrail; full adversarial-grade parent-rewrite resistance is not this gate's remit). A shallow repository maps a merge-base miss to cannot-evaluate (exit 2) with a `git fetch --unshallow` remediation, never a false ORPHANED, because truncated history cannot be told from a genuinely absent root (the CI gate checks out at fetch-depth:0). When the protected ref is derived from the default origin/HEAD, a stale local origin/HEAD (not refreshed since the last fetch) can skew the derived protected tip, so both the orphaned and the first-parent-lag verdicts are only as current as the clone's remote-tracking state; pass --protected an authoritative ref, or refresh origin/HEAD, when that currency matters. A degenerate invocation naming the SAME ref for --protected and --head is a self-comparison that always resolves (a ref is rooted on itself); the caller supplies distinct refs. The gate scrubs the ambient GIT_* environment before every git call but resolves the `git` executable through the ambient PATH, so it trusts the toolchain's `git`; a hostile PATH entry shadowing `git` is a trusted-toolchain / execution-environment concern outside this gate's threat model, not a branch-root bypass it defends against."

[[gate]]
id = "ci-parity"
script = "tools/check_ci_parity.py"
rules = ["gatdis"]
platform = "ci"
default = "block"
class = "c"
residue = "Token-level set parity between the two named files only (tools/run_all_checks.sh and .github/workflows/quality.yml), read as data and never executed. Identity is the normalized command including all script arguments, with python/shell launcher words and the interpreter-only flags (-I, -B, -E, -s, -P, -u, glued forms included) removed, and the value of a runtime-derived flag (--base, --protected, --head) masked as <ref:expression> (preserving which expression supplied it) only when it carries a shell expansion or GitHub expression, so a change among runtime spellings including a self-comparison diverges, while a literal value stays in identity and two different literals diverge. It does NOT compare environment values, operating systems, tool versions, execution order, multiplicity, step placement across jobs, labels, or whether the shell harness propagates a child failure; interpreter-flag differences are owned by check_python_launcher_isolation.py. Scope is exactly the two files, so gates in other workflows are not enumerated. Argument order is identity-relevant, so a harmless reorder fails loud. Coordinated removal of both of this gate's own invocations is undetectable if nobody runs the remaining file manually (branch protection and review own that case). The extractors implement a disclosed shell and YAML subset; an unknown construct is cannot-evaluate (exit 2), never a clean pass. Two disclosed masking/parse edges remain: tokenization does not preserve quote type, so a $ inside single quotes is treated as runtime-derived like a double-quoted one, and a duplicate run: key within one step is counted as two members although YAML keeps one. The shadow scan has one soft edge: exotic quoting outside the supported grammar could hide a tools/ path from comment stripping. It fails closed (cannot-evaluate) on an unknown top-level or job-level workflow key, a top-level unconditional exit that would strand later local gates, unbalanced if/fi nesting in the runner, job content without a job mapping, and a run_gate() body outside its recognized shape; deeper nested non-gate YAML (under on:, env:, with:, strategy:) is structurally recognized but not exhaustively schema-validated, though the shadow scan still blocks a hidden tools/ gate and reachability is outside token-parity scope: a gate counts as declared regardless of an enclosing conditional (a job-level if:, a shell conditional inside a run: block, or an if/fi in the local runner) that could keep it from running, validating a single gate's own argument semantics beyond the runtime expression is that gate's responsibility. Intended local-vs-CI asymmetries are reconciled through a reviewed in-gate allowlist, not silently ignored."

# --- QA-suite foundation: the discovery seam, the reference audit that proves the harness end to end, ---
# --- and the internal-name leak gate (each a roster gate script, so each carries one entry here) --------

[[gate]]
id = "qa-adapter-selftest"
script = "tools/_qa_adapter.py"
rules = []
platform = "ci"
default = "block"
class = "a"
residue = "The self-test for the QA discovery seam and result contract (tools/_qa_adapter.py), the module every QA audit reads its surfaces through. It asserts each scenario's status and, where they discriminate the behaviour under test, that scenario's kind and evidence content; exit codes are asserted for the subprocess cases (argument validation and pinned-config resolution), not for every scenario: a present required surface is PASS; a missing required surface is UNVERIFIABLE and never PASS; a file-backed surface whose path is a DIRECTORY, a non-regular file, or a present-but-UNREADABLE regular file (a chmod-000 fixture) resolves available=False to UNVERIFIABLE, so neither existence nor mere regularity is read as a readable-file PASS, and the glob gate roster counts only readable regular files so an unreadable-only roster is UNVERIFIABLE, and a roster carrying a readable AND a present-but-unreadable candidate (a broken symlink or an unreadable/non-regular file) fails CLOSED to UNVERIFIABLE rather than silently dropping the unreadable member with the rest still PASS; a BROKEN SYMLINK (a present dentry whose target is missing) is treated as present-but-unreadable, not absent, at EVERY presence-gating site CLASS-WIDE (the nearest-config walk, the pinned --config/env load, and the gate roster each fail closed, so a dangling nearest .aiqt/assurance.toml raises ConfigError rather than falling through to portable defaults); an optional-disabled surface is SKIP; a disabled required surface is a distinct malformed-UNVERIFIABLE, and a config can never DOWNGRADE a canonically-required surface (an enabled=false or present-but-empty backlog) to an optional SKIP because the canonical PORTABLE_DEFAULTS requirement is carried through, and a config that binds a canonically-recognized surface (backlog/gate_roster/git) to a DIFFERENT adapter type than its canonical one is UNVERIFIABLE/adapter-mismatch, never a PASS on the substituted adapter, so a required surface cannot be rebound to the record-file adapter aimed at any present file; the git surface (exercised with a synthetic temporary repository where a git binary is available) returns PASS only when the configured protected branch exists as an actual BRANCH ref (refs/heads/<branch>), resolved by show-ref --verify without revision interpretation, with the show-ref line required to carry EXACTLY two fields (a three-field line rejected as a malformed line) with the RETURNED ref field required to EXACTLY equal the requested refs/heads/<branch>, so the evidence carries git's own returned sha (its show-ref sha field, compared to the real head sha) together with the ref proven equal to the request: the SHA half is derived from git's output (a self-constructed sha diverges from the real head sha and is caught), while the ref half is the request proven equal to git's returned ref by the equality gate, and is UNVERIFIABLE when the value is a raw sha, a tag, HEAD, or any other non-branch commit-ish, when it carries a revision suffix or other non-branch-name grammar (a ~0, ^{commit}, or @{0}, rejected as an invalid branch name by check-ref-format before resolution) or a leading dash (rejected up front so a value shaped like an option is never handed to git as one), when a decoy git returns a MISMATCHED ref line (a self-consistent-looking line naming a different branch than the one requested), or when the resolved commit id is not a strict 40-hex or 64-hex LOWERCASE sha (a valid 64-hex sha256 accepted; a hex-but-wrong-length, a right-length-but-non-hex, an uppercased-hex, an empty, or a non-string value rejected; a decoy git emitting a non-sha line), so a PASS is never backed by repository-root evidence, a revision expression, a mismatched ref, or a garbage sha alone, and the nonexistent-branch and invalid-value cases each carry exactly the repo-root evidence; and the git probe is bound to the surface root, scrubbing every ambient GIT_* variable and requiring the resolved toplevel to be realpath-equal to root, so an ambient GIT_DIR/GIT_WORK_TREE redirect cannot make a non-repo root (or a subdirectory of an unrelated repo) read PASS for another repository; an unknown adapter type is UNVERIFIABLE; an adapter that RAISES, and an adapter whose RETURN is malformed (a truthy-string available, a non-list provenance, or a wrong-arity tuple), each become UNVERIFIABLE with an adapter-error kind rather than a crash or a pass, and an available return carrying empty located evidence is fail-safe-downgraded at the discover boundary rather than handed back as a false PASS; make_result rejects a non-list (bare-string) evidence at construction, routed through the shared validate_result choke point, rather than list()-coercing a string into single-character evidence, and _surface downgrades a char-split non-list provenance and a wrong-kind PASS instead of returning a false green; the result contract (validate_result) rejects a result whose schema is not the exact RESULT_SCHEMA tag (a substituted or a missing schema, refused for EVERY status before any other check), an out-of-set status, a structurally-incomplete or wrong-typed result (a missing or wrong-typed mandatory identity field: audit and summary non-empty strings, surface a string or None, required a bool) and the SKIP/required cross-field inconsistency (a SKIP can never be marked required), with make_result and emit routed through this same choke point, a non-list evidence, evidence elements that are not non-empty strings for EVERY status uniformly (a FAIL or UNVERIFIABLE carrying a non-string element such as [7] or an empty-string element is refused at make_result and emit, not only a PASS), and a mutually inconsistent result (a PASS without the available kind or without a non-empty list of non-empty evidence strings, and an UNVERIFIABLE or SKIP wearing the available kind) while ACCEPTING a legitimate FAIL on an available surface (a present, probed surface whose audited property was observed violated); load_config rejects a wrong-typed surface schema in all three cases (a non-table surface entry, a non-string adapter, and a non-boolean required/enabled flag) and a wrong-typed adapter-specific field (a list-valued protected-branch or a table-valued remote-landing-provider), and requires schema-version to be a present integer drawn from the supported set so a missing, wrong-typed, boolean, or unknown-version value is a loud ConfigError; config resolution is fail-loud on a pinned config that is absent, unreadable, or malformed and on a malformed --config operand (absent, empty, an =-joined empty value, a next token that is itself an option, or a duplicate --config), with a present-but-empty AIQT_ASSURANCE_CONFIG treated as a loud ConfigError on the SAME pinned-source path as --config so the two cannot diverge, and both the argument validation and the loud pinned-source resolution precede the --self-test dispatch so a malformed operand or a pinned-but-absent/empty config exits 2 even under --self-test, and an UNRECOGNIZED option (a misspelled --self-testx or a stray flag) is a loud exit 2 rather than a silent default path that would let it masquerade as --self-test rather than a silent self-test that exits 0 (a recursion sentinel keeps a regressed build from spawning nested self-test children); the config root is derived consistently across the explicit, env, and nearest steps so an explicit .aiqt/assurance.toml resolves relative surface paths at the tree root rather than one directory too deep; and discover_all enumerates the full expected surface set so a required surface omitted entirely from the config resolves UNVERIFIABLE rather than being silently skipped. RESIDUAL: it asserts these representative scenarios, not the adapter's whole input space; the readable-file probe reads a single byte, so a file that becomes unreadable after the probe or fails only on a later read is outside what it models; the two chmod-000 readability cases are asserted only when the test runs off-root, since a root euid bypasses discretionary read permission and cannot make a file unreadable this way; the git protected-branch cases are asserted only where a git binary is available, and the decoy-git cases (non-sha, mismatched-ref, show-ref-literal, and leading-dash) additionally only where a POSIX /bin/sh is present; the git executable is resolved ONCE via a trusted absolute path where one is discoverable (falling back to a bare PATH lookup only when git is not on PATH at import), which shrinks but does NOT close the PATH surface: a PATH-controlled PRECISE decoy git already first on PATH at process launch, one that emits a fully self-consistent ref-and-sha line for the exact branch requested, is what a which-style lookup itself resolves and so remains a CATEGORICAL residual outside a portable tool's power to fully defend, an OS/adopter-hardening concern (consistent with the pack's SYSTEM-HARDENING adopter-file discipline for protections that need OS-level isolation), not a defence this gate claims; and it does not exercise a live adopter tree (the reference audit and the advisory digest read the real repository). Its linkage to a single corpus rule is not undeniable, so none is claimed here; an empty rules list is an open question, not a coverage statement."

[[gate]]
id = "audit-reference-selftest"
script = "tools/audit_reference.py"
rules = []
platform = "ci"
default = "block"
class = "a"
residue = "The trivial reference audit (tools/audit_reference.py) that proves the QA harness end to end; it ships no substantive assurance logic. Its gating leg is --self-test, which asserts the audit returns PASS end to end on a present gate roster (carrying located evidence), UNVERIFIABLE on an absent one (missing evidence never reads as PASS), emits valid result-contract JSON, and runs its --config operand validation, unknown-option rejection, and the loud pinned-source resolution before dispatching --self-test so a malformed operand (for example --config immediately followed by --self-test), an unrecognized option (a misspelled --self-testx or --digestx), or a pinned-but-absent/empty config (an absent --config path, or AIQT_ASSURANCE_CONFIG set to an empty value) is a loud exit 2 rather than a silent self-test or default path that exits 0. Its --digest leg is an ADVISORY report-only surface board that always exits 0 on a finding, so an advisory finding never gates and only a tool crash (unexpected non-zero exit) fails the build. It arguably serves the change-carries-a-check discipline, but the linkage to a single corpus rule is not undeniable, so none is claimed here. It asserts representative scenarios with exact status and exit-code matches, not the whole discovery input space, and it audits only the gate-roster surface's availability, not the semantic correctness of any real assurance property."

[[gate]]
id = "internal-names"
script = "tools/check_internal_names.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "A best-effort scan of the QA-suite shipped surfaces for internal provenance vocabulary, in two layers (per tools/check_internal_names.py): structural SHAPE patterns for generic forms (the leak gate's host-path, private-IP, token, and account shapes plus provenance-id and internal-incident-id shapes) and a hashed-codename denylist (tools/internal-name-hashes.txt, SHA-256 only, shipped empty) for names no shape catches. It covers a recognizable SUBSET of the internal-name surface: like the sibling check_leaks.py whose normalization and structural patterns it reuses, deliberate obfuscation (mid-word splits, HTML entities, zero-width characters) can evade the hashed layer, binary and archive contents are not unpacked, and a novel private string outside the shape patterns and the denylist slips it (class c, partial, the check_leaks archetype). SCOPE and FAIL-CLOSED posture: the QA-suite deliverables plus the shipped gate-runner and CI-workflow files (tools/run_all_checks.sh and .github/workflows/quality.yml, verified clean of provenance shapes) and the public .preview/ channel in SCOPE_RELPATHS are scanned; an absent future surface is skipped, and a present scoped file that cannot be read fails closed (an OSError read failure is exit 2, a non-UTF-8 or otherwise undecodable scoped file is a fail-closed unscannable-surface finding at exit 1), never a silent skip. A BROKEN SYMLINK (a present dentry whose symlink target is missing) is a present-but-unreadable input, not an absent one: at both the hashes-file load and the scoped-file scan it fails closed (re-raised as an OSError, exit 2), never read as absent, so an internal name held behind a dangling link cannot evade by reading clean. SCOPE_RELPATHS is a hand-maintained allowlist with no drift-guard, so a new in-scope surface must be added to it by hand, and mixed-content metadata files that legitimately carry existing provenance tokens (the gates and ownership manifests) are out of scope by design with their QA-relevant content hand-verified. A line carrying an internal-allow marker is exempt from the structural layer. This gate accepts only --self-test (or no arguments for a real scan), so an unrecognized option (a misspelled --self-testx or a stray flag) is a loud exit 2 rather than a silent default scan that would let it masquerade as --self-test. Its linkage to a single corpus rule is arguable, so none is claimed here; an empty rules list is an open question, not a coverage statement."

[[gate]]
id = "git-option-table"
script = "tools/check_git_option_table.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "Checks installed git branch/tag help-visible spellings against the static hook literal and an independently maintained role catalog. This checks a precondition of expbnd soundness, not its mechanism; linkage arguable, none claimed. Hidden options, unadvertised negations, unchanged-spelling semantic changes, catalog drift, classifier algorithm defects, and post-assignment table mutation remain outside coverage. Help-format drift can undermine enumeration despite fail-closed parsing and a sanity floor. Role verdict profiles cover only the documented operand shapes. Completion runs in a freshly initialized isolated repository; unavailable, empty or malformed helpers are cannot-evaluate. NOCOMPLETE options lack helper value-form coverage. Executable provenance is trusted."
