default = "block"
class = "a"
residue = "It checks that the shippable surface can land on a stranger's machine unchanged: no operator identity outside its attribution, no repo-operational vocabulary, no exemption markers, no unscannable file classes. Its linkage to a single corpus rule is arguable, so none is claimed here."

