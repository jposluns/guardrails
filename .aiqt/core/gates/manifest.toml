rules = []
platform = "ci"
default = "block"
class = "a"
residue = "Exercises the shared pack-manifest parser with frozen ROOT/TREE hashes, exact root.txt grammar, generator-shaped and independently authored malformed TOML, exact INVALID/CANNOT_EVALUATE statuses, closed keys and vocabularies, contained paths, ordering, uniqueness, digest consistency, and inclusive resource bounds. Named guard mutations must turn their status discriminators red. Generator recipe parity and consumer refusal translation run in tools/check_manifest.py --self-test; physical standalone execution belongs to the closure gate. Coverage is limited to the enumerated vectors and mutations, not the whole input space. VALID means schema-valid, not authenticated: TREE equality, actual bytes, ownership and set equality remain consumer obligations; managed-block digests cover only their blocks. Input caps are not a process sandbox, and larger releases or changed formats refuse until a reviewed update. The generator remains a separate emitter. The runner-registration leg executes the real standalone dispatcher text with intercepted sibling commands returning zero and this suite reduced to its non-recursive vector leg. It requires the declared vector report, exactly one logged own-call attempt with exact argv, and propagation of injected exits 1, 2 and 7. Arguments containing this script basename count as attempts, including embedded -c source and incidental mentions; dynamically constructed names without that substring are not classified. REDs cover removed registration, duplicate or malformed own argv, embedded calls with swallowed exits, CI-conditional skipping, and swallowed failures including wrappers tolerating exit 1 or 2. Every recorded Python invocation is reconciled with the on-disk run_gate roster, including sibling order and exact argv; missing, extra, reordered or re-argued calls fail /invocations. Intercepted siblings return zero, so their assertions and failure propagation remain outside coverage. This twin retains its existing scratch cwd, so caller-cwd conditions are not exercised. Ordinary caller environment variables are retained except GIT_*, BASH_ENV, ENV, SHELLOPTS, BASHOPTS, PS4, BASH_FUNC_*, PYTHON* and LD_*; PATH, HOME, XDG_*, TMPDIR, locale and fixture variables are pinned. It creates executable private scratch files and launches bash; the interception probe requires dirname on the fixture-plus-os.defpath PATH and executable /bin/sh, otherwise refusing as cannot-evaluate/interception. An executable fixture records argv under a read-only PATH pin in the runner shell; the competing fixture must record no calls with the pin and the exact roster without it (removed-path-pin). Missing or malformed evidence fails. Absolute interpreter paths, command -p, hash -p and PATH replacement in a child process remain outside interception; invocation reconciliation detects skipped registered calls after execution, not before it. PD-SFS-THREAT-BOUND excludes runners written to defeat the check: output-recognising wrappers can swallow real SELF-TEST FAIL, PACK-MANIFEST FAIL or CANNOT diagnostics while propagating the injected exits, and bare alternate interpreter names such as python3.14 bypass interception; no mechanism is added for these. Recursion refusal retains the environment marker and also passes a private marker-file descriptor with pass_fds; both twins inspect inherited readable regular descriptors (read-only or read-write, never O_PATH) through /dev/fd before any launch, skipping non-readable descriptors, so a marker reachable only through a write-only or O_PATH descriptor is not recognized, and refusing as cannot-evaluate/recursion-marker when descriptor enumeration, a non-EBADF fstat, the flag query, or reading a readable candidate fails; inherited write-only and O_PATH regressions confirm a legitimate run is not refused. An env -i PATH=/usr/bin:/bin own-registration RED launching the interpreter under test uses a bounded child entry probe requiring cannot-evaluate/recursion and zero nested Popen attempts; the child does not assert which interpreter ran it, so a revert to a PATH-selected python3 is detected only where /usr/bin and /bin hold no python3 able to run the suite, and never where the interpreter under test is itself /usr/bin/python3. Deliberately closing inherited descriptors while scrubbing the environment is out of scope and can create nested sessions beyond timeout killpg containment. Untested exit statuses and environment combinations are not guaranteed; this is not a process sandbox. No network observation, quarantine, trust quorum, registry activation, or live adoption is exercised. Its linkage to a single corpus rule is not undeniable, so none is claimed here."

[[gate]]
id = "opf-prompt-pack"
script = "opf/tools/check_opf_prompt_pack.py"
rules = []
platform = "ci"
default = "block"
class = "a"
residue = "It runs the OPF prompt-pack manifest and digest drift gate (opf/tools/check_opf_prompt_pack.py, PR7 slice 1). The default entry verifies the shipped pack at opf/prompt-pack/pack.toml against the bytes beside it; the --self-test leg builds synthetic packs and checks exact statuses and guard names, never diagnostic wording. Four manifest/member FIFO/symlink probes run in isolated Python child processes with a five-second timeout each and assert only the exit status and structured guard tag. The manifest schema is closed (format, version, digest and members, each member exactly path and sha256). The version must be a bare MAJOR.MINOR.PATCH token from the shared _semver grammar, so a prefixed, pre-release, build-suffixed, leading-zero, whitespace-padded or non-ASCII-digit token refuses INVALID. A member whose bytes changed without its sha256 row refuses INVALID, and so does a stale pack digest after a member row or version change, because the digest binds the version and every ordered member row. A file in the pack directory that is not a member, a listed member that is absent, an escaping, absolute or self-listing path, and duplicate or unsorted rows refuse INVALID. A symlink or other non-regular entry, an unreadable, unparseable, non-UTF-8 or oversize manifest, and an unknown format marker refuse CANNOT-EVALUATE. The in-process status vectors also check that validation leaves each fixture byte-identical and returns the same result twice; the four child probes do not perform these checks. The unreadable-subdirectory vector is skipped when running as root. Member-size and member-count bounds have refusal vectors, and a separate empty-pack digest check pins the digest definition. Coverage is limited to these enumerated checks: VALID means the manifest agrees with the bytes on disk, not that the pack is authentic, that a content change also bumped the version, or that the documents say anything correct or safe. The shipped pack holds three members, adopt/SKILL.md, adopt/clean-start.md and flow/SKILL.md, which deployment consumes as pack.toml describes. The adoption planner (opf adopt plan) takes a prompt_pack version and digest from the caller's worksheet, refuses a version that is not bare SemVer or a malformed digest, and binds both into the frozen plan; nothing in this tree reads pack.toml to compare that binding with the shipped pack, and no apply or import step reads it. Its linkage to a single corpus rule is not undeniable, so none is claimed here."

[[gate]]
id = "opf-enforce-platforms"
script = "tools/check_opf_enforce_platforms.py"
rules = []
platform = "ci"
default = "block"
class = "a"
residue = "It runs the OPF enforcement-pack platform coverage gate (tools/check_opf_enforce_platforms.py). The default entry reads opf/enforcement/platforms.toml and requires one row per supported assistant platform (Claude Code, Codex, Gemini CLI and Cursor, the platforms of opf/tools/_opf_adopt.py ENFORCEMENT_MEANS that allow a deny hook), each with a means its platform allows, unique residuals from ENFORCEMENT_RESIDUALS carrying the one its means requires, and an evidence text; an exact-integer format-version = 1 with closed top-level and row keys; a deny-hook row only for a platform in tools/gen_hooks.py PLATFORMS, the repository's only rendered and tested hook platform, so Codex, Gemini CLI and Cursor take the instructions tier, and that row's member must be exactly the canonical hook path (a copy at another path is a finding even when byte-identical, because the hook derives the trees it guards from its own location) with a destination among the hook-registration paths the hook itself protects; each instructions destination at the location the AIQT adapter generator writes for its platform (AGENTS.md from tools/gen_agents.py, GEMINI.md from tools/gen_adapters.py, a .mdc rule under .cursor/rules/ from tools/gen_cursor.py but outside the reserved subtree that generator rewrites and orphan-prunes (OUT_PARTS, compared case-insensitively), read statically from their literals), for the Codex and Gemini CLI members the exact line stating that the AIQT pack regenerates AGENTS.md or GEMINI.md whole, so the OPF instructions cannot coexist there today and coexistence is an unresolved adoption prerequisite, a member file name no platform loads, the exact advisory tier line, no denial, blocking or enforcement word outside that line, inline code spans and the rendered block, the always-apply Cursor frontmatter, and, between marker lines, exactly the protected-path block rendered from the Claude Code deny hook (opf/enforcement/claude/pretooluse_deny.py, loaded through importlib and never launched: its store, archive, evidence, frozen-plan, view, guarded-tree, registration, writer-verb and imported-leaf constants and functions; a registration identity that is not a normalised path inside the probe root refuses rather than dropping or misplacing an entry, and every input is refused when reached through a symlinked parent), so a change to any of those hook constants or to any platform's list turns it red. The gate also calls the loaded hook's own file-tool rule directly, for a Write at one throwaway fixture layout: a Write to one concrete instance of every rendered entry must be denied, and a Write to the two rendered exemption leaves, to a keep-disposed plan source and to an unlisted file must be allowed, so a hook whose file-tool rule stops denying a Write to a probed instance is red even with every rendered constant unchanged; a hook whose constants leave a probe unbuildable, or whose rule raises on a probe, cannot be evaluated, so the probe set never shrinks. The --self-test checks the real rendered block for each protected token and runs fixture copies of every input; every rule above is held red by at least one fixture mutant, and each behavioural probe leg (store, evidence, archive, frozen source, view, pack tree, registration, exemption, keep-disposed source, unlisted file, and the refusal when the rule raises) by a hook rule-logic mutant that leaves every rendered constant unchanged; byte-identical and relocated deny-hook copies are red, and clean vectors cover a code-span mention, a Cursor rule beside the reserved subtree and a deny-hook row the hook renderer names. Residuals: the prose around the derived tokens and the two literals the hook spells inline (the manifest's views table and target key) are fixed text in the gate; the behavioural probes cover only the rendered entries and the rendered exemption, at one fixture layout and through the file-tool rule for a Write alone, so the Edit, MultiEdit and NotebookEdit tools, the hook's main() dispatch and deny output, other layouts and hook behaviour the block does not render (the Bash rules, the command classifiers, the control-subdirectory set, R6/R7 handling) are outside this gate (opf/tools/check_opf_doctor.py launches the hook against its own denial vectors); coexistence of the Codex and Gemini CLI members with the AIQT pack's generated AGENTS.md and GEMINI.md is an unresolved adoption prerequisite, which the gate requires those members to state but neither provides nor verifies; the tier scan is lexical and cannot judge a claim worded without its listed words; gen_hooks PLATFORMS is read as the record of a tested deny mechanism, not as verified platform documentation; inputs are read after a symlinked-parent and regular-file check, a check-to-use race; and the gate checks the pack's text and the probed behaviour, never that a platform follows an instructions member. Class a: a deterministic check over tracked files."

[[gate]]
id = "opf-standalone-closure"
script = "tools/check_opf_standalone_closure.py"
rules = []
platform = "ci"
default = "block"
class = "a"
residue = "It proves by PHYSICAL ABSENCE that the opf/ subtree is dependency-closed (OPF-SELF-CONTAIN): it materializes opf/ ALONE into a throwaway temporary directory with no AIQT tree reachable, then runs the OPF gate subset there under python3 -I (neither the working directory nor PYTHONPATH is on sys.path, so only the copied opf/tools/ is reachable). Any surviving UPWARD edge into tools/ (a from-check_versions import, an import check_byte_canon, or the emitter's pinned sibling-file authority load) fails at import or run time in the isolated copy; the two closure-critical edges are lazy or dynamic, so the subset drives the exact command paths that exercise them (opf.py --self-test runs the render and emitter-authority legs; the commonmark selftests exercise the vendored parser and its manifest). Closure is OBSERVED, not grep-inferred. The --self-test carries the change-carries-a-check discriminator: a deliberate flip re-introduces the pre-move upward edge (opf/tools/_opf_store.py importing _parse from check_versions instead of the extracted _semver) into an isolated copy and requires the subset to fail with exactly the failure that import produces (opf.py's bootstrap exit 2 and, compared byte for byte as raw output, its one cannot-bootstrap line naming check_versions and the newline after it), so the gate cannot pass a tree that is not actually self-contained; the flip passing is a self-test failure (1), and any other outcome of the flip (a bound kill, a signal, a harness failure, a failure that merely mentions check_versions, or that line with another line ending or trailing whitespace) is cannot-evaluate (2), never coverage credit. Each leg runs under its own wall-clock bound, the largest of three times its recorded ceiling, the sum of the literal wait sites its sources declare plus a 60 s launch margin, a 60 s floor, and, where one is recorded (_LEG_BOUND_FLOOR_S), a per-leg floor for a leg whose command the config-injection lanes also run: that command's config-lane deadline (its CONFIG_MEMBER_BOUNDS entry in tools/selftest_git_fixture_env.py, else CONFIG_MEMBER_BOUND_DEFAULT) plus the 60 s launch margin, so the closure never kills such a leg before the lane running the same command would. A floor only raises a bound, and a floor row naming no roster leg, or carrying a value that is not a positive int, refuses the run fail-closed. Every leg bound is a deliberate shorter deadline, not a bound above the leg's end-to-end budget: the lane deadlines the floors copy are themselves deliberate shorter deadlines, and the opf-tooling-selftest bound sits below the 5766 s that opf.py grants its own blocked-isolation leg, because a bound above that would not fit its CI job. Reaching any bound is reported as LEG BOUND EXCEEDED and exits 2, never as a failure the leg reported and never as a pass. The closure work is partitioned between five CI jobs (_CI_JOB_LEGS, opf-closure-a to opf-closure-e), each running the self-test and the live gate over its own legs alone (every leg in exactly one job, fail-closed, with the flip in the job holding opf-tooling-selftest), and the --self-test requires each job's worst case to fit that job's own time limit. The --self-test also reads the lane runner's own roster (its _registered_selftests) and deadlines, and requires every leg whose command is a roster member to reach that command's lane deadline plus the launch margin; a member bound below that, by even one second, is a named failure (1), and so is a roster that matches no leg. That check is cannot-evaluate (2), never a pass, when the lane runner cannot be read or decoded, does not parse, or does not assign CONFIG_MEMBER_BOUND_DEFAULT and CONFIG_MEMBER_BOUNDS exactly once each by a plain statement as a positive int and a dict literal of str-tuple keys, none repeated, to positive ints; when the runner cannot be imported or its roster read; when the deadlines read from its source disagree with what its own _config_member_bound gives; when it does not spell each of those two names on the one line its doctored-source vectors rewrite; and when the roster no longer meets the preconditions of its membership vectors (opf/tools/check_opf_homes.py --self-test in the roster, the bare opf/tools/check_opf_homes.py outside it, and the opf-homes-contract bound below the lane default plus the margin), so a change that breaks one of those makes every closure self-test exit 2 until the vectors are updated. The floors are copies checked against the runner on each --self-test run, not read from it when the gate runs, since the isolated copy holds no lane runner. A leg killed at its bound, or ended by a signal the gate did not send (from outside or from the leg's own process group: a negative status cannot tell them apart), is named and exits 2 (cannot evaluate; a real leg failure beside it still exits 1), never a pass, and a run under load heavier than the recorded ceilings' can exit 2 on a healthy leg. A leg that launched and itself exits non-zero is a finding (1), closure broken, with one exception: an exit 2 is cannot-evaluate (2; a real leg failure beside it still exits 1) only when that launched leg also printed the uppercase CANNOT EVALUATE marker in its captured final lines, its own declaration of a harness error or an expired inner bound. An exit 2 without the marker is a finding (exit 2 also carries real failures: a helper import failure, a self-check that exits 2, the flipped import's bootstrap line with its lowercase (cannot evaluate)), and a marker in the text of a leg that never launched is the harness's failure, never the leg's declaration. In the --self-test, a flip caught as the exact failure must also be reported as closure BROKEN with exit 1, or it is a self-test failure (1). It runs the deterministic, git-independent self-test legs (which build their own throwaway fixtures) rather than the live adopter legs, and copies the tracked opf/ tree rather than a stranger's checkout, so it asserts self-containment of the authored subtree, not behaviour against a live product repository; any harness failure (no opf/tools/ directory, opf/ absent included; an opf/tools/ entry that cannot be checked, such as a directory that cannot be searched; a temporary directory that cannot be created, a failed copy, a symlink anywhere in opf/ that resolves outside the isolated copy (the copy keeps every symlink as the link itself, never its target, and is refused when one leaves it), no interpreter, or any other exception before, around or after the legs, an AssertionError, a SystemExit or a leg result the report cannot read included) fails closed to 2 rather than a clean skip. The closure-roster registration checks run first, before opf/ is copied, any bound is derived or any leg launches, and only their own assertions are a finding (registration drift: exit 1, each check named, never read as the subtree failing to verify or as a bound that cannot be derived). A whole-roster check requires the roster's leg names to be exactly those of the per-leg ceiling table, each once, and the ceiling table's legs to match a leg count and a sha256 of the sorted leg names recorded separately in the same file; every script to be a plain file name (no path separator, never '', '.' or '..', never absolute) and never a name the isolated copy leaves out (*.pyc, __pycache__); and, whenever opf/tools/ exists, every script to be a regular file that is itself there, opf.py included: never a symlink, whatever it points at, and never reached through a symlinked opf/ or opf/tools/ (its resolved path must be that file under the resolved repository root), so no row can name a file outside opf/tools/. So, for any row, each of these is drift: a row removed, added or repeated; a leg renamed; a row removed or added together with its ceiling row; a script that is not a plain file name or that the copy leaves out; and a script opf/tools/ does not hold as a regular file of its own (missing, a symlink, or resolving outside it). A roster change that also records the new count and digest passes: the recorded pin makes such a change a deliberate third edit and does not judge it. The registration checks read opf/tools/ before the copy is made, so a change between the two is not named as drift, though the copy still refuses any symlink in it that resolves outside it. Three rows are also pinned as exact tuples, so a changed argument list, or a script changed to another file that exists, is drift for those three rows only. In the --self-test the exception's type routes it, never its message, and where it is raised decides which type it reaches the routing as. A check's own assertions are failures (1), those about its fixtures included (a readiness file that never appears, a fixture leg of the wrong shape), and so is any exception or SystemExit the code under test lets escape a call a check makes into it, a host fault inside that code included. A check that cannot evaluate what it checks (the CI job limit, or the config lanes' roster or deadlines, cannot be read, or there is no opf/tools/ and the roster itself has no drift) is cannot-evaluate (2), named, as is any other exception or SystemExit: in the fast phase outside such calls (an OSError creating a check's own temporary directory, or an assertion of another type, whatever its message), in running or judging the positive leg (the flip still runs, so a flip not caught beside it is still a failure), in building or running the flipped copy (a source that cannot be decoded included), or escaping the closure legs. No routing catches a KeyboardInterrupt."

[[gate]]
id = "aiqt-corpus-selftest"
script = "tools/selftest_aiqt_corpus.py"
rules = []
platform = "ci"
default = "block"
class = "a"
residue = "It exercises the generic corpus-tool core (tools/aiqt_corpus.py) end to end: the discovery/targeting helpers (suffix and exempt-dir/exempt-file filtering, dedup-and-order iteration, the scan-root allow-list walker), the text/markdown primitives (table-row splitting, separator detection, multi-backtick code-span stripping, fence detection and non-code-line iteration over fenced/tilde/unterminated blocks), the ISO-date parser and month arithmetic (month-end clamp, leap February, year roll), the field-agnostic metadata parser (head-window bound, first-occurrence-wins, trailing-backslash strip, tolerated annotations), head_version field-name precedence, the whitespace-preserving git helper and git_show present/absent, and the genericity invariants the module exists to hold (the exempt-dir default carries only universal VCS/build directories, the scan-root walker refuses a module-level repo root, and __all__ is pinned to the exact public surface). It arguably serves the change-carries-a-check discipline, but the linkage to a single corpus rule is not undeniable, so none is claimed here. Every fixture is synthetic and assembled in a tempdir and the git helpers run against a throwaway repository; it asserts representative scenarios with exact expected values, not the module's whole input space."

[[gate]]
id = "commonmark-headings-selftest"
script = "opf/tools/selftest_commonmark_headings.py"
rules = []
platform = "ci"
default = "block"
class = "a"
residue = "It exercises the vendored-Marko changelog heading adapter (opf/tools/_commonmark_headings.py) end to end: direct-child H2 heading selection by source span over representative CommonMark inputs, and the fail-closed HeadingScanError cannot-evaluate on a parser fault, a structurally-degenerate parse result (a document with no children list or a heading node with no integer level), a missing or invalid source span, oversized input (over 1 MiB), a submodule or root import origin outside the vendored tree, and a version or provenance mismatch; and the verify_vendor_manifest byte-integrity logic, both over synthetic drift scenarios (a clean manifest verifies, while a mutated file, an extra file, a missing file, and an unreadable tree each fail closed) and against the REAL committed vendored tree under default arguments. It arguably serves the change-carries-a-check discipline, but the linkage to a single corpus rule is not undeniable, so none is claimed here. It asserts representative synthetic scenarios with exact expected values in a tempdir, not the adapter's whole input space; the standing per-push byte gate over the vendored tree is the release manifest (check_manifest against .aiqt/manifest.toml), which this complements rather than replaces. Marko's parse is worst-case superlinear on crafted pathological input within the 1 MiB byte ceiling, so a maliciously-shaped changelog can be slow (an availability residual, never a wrong verdict; the gate step carries no wall-clock timeout, and the changelog is maintainer-authored in-repo content)."

[[gate]]
id = "commonmark-conformance"
script = "opf/tools/selftest_commonmark_conformance.py"
rules = []
platform = "ci"
default = "block"
class = "a"
residue = "It replays the CommonMark 0.31.2 example suite (652 examples) through the exact vendored Marko 2.2.4 bytes and asserts the observed render-divergence set equals the recorded per-interpreter baseline (16 known render-only divergences, none heading-related), failing closed if the divergence set differs, if a render raises on ANY example (a crash is never absorbed into the baseline), if the evaluated example identities are not unique and non-null, if the fixture example count is not the pinned 652, or if a required interpreter is absent (a signal-killed matrix leg counts as a failure, not a pass). It arguably serves the change-carries-a-check and trusted-pinned-provenance disciplines, but the linkage to a single corpus rule is not undeniable, so none is claimed here. It exercises the vendored parser and renderer over the spec corpus, not the changelog adapter heading path (which uses the parser only); the baseline is measured and verified on CPython 3.14 only (the host and the quality CI workflow that gates U5 both run it on 3.14; a cross-version matrix was declined by the maintainer), and the replay characterizes render conformance rather than proving byte-integrity, which the release manifest and marko-2.2.4.manifest.sha256 own. Marko's parse is worst-case superlinear on crafted pathological input, so the replay carries no per-example wall-clock timeout (an availability residual over the pinned spec corpus, not adversary input)."

[[gate]]
id = "gensrc-failclose"
script = "tools/check_gensrc_failclose.py"
rules = ["gensrc"]
platform = "ci"
default = "block"
class = "a"
residue = "A registry-driven fail-close gate: for every target the gensrc registry declares, it corrupts a disposable sandbox copy (the real tree is never written) and asserts the generator's --check rejects it - a text target fails closed to exit 2, the one binary target drifts to exit 1, and the floor is that a corrupted target never yields exit 0. It is the durable form of the F-142b sweep and catches an F-154-class generator that does not consult its target. It exercises --check not regeneration, models unreadable as invalid UTF-8, probes every regular-file member of a tree, recognizes only the 'python3 tools/gen_<stem>.py' regenerate grammar, and does not judge the semantic correctness of generated content."

[[gate]]
id = "hooks-preview"
script = "tools/check_hooks_preview.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "A consistency gate over the public .preview/ channel, NOT APPLICABLE when the directory is absent. It runs each preview hook's own --self-test isolated (python -I -S -B, a fresh temporary working directory, AIQT_, ORCH_ and CLAUDE_ variables removed, AIQT_HOOKS_REQUIRE_SIBLINGS=1 set), requires the README.md integrity table and SHA256SUMS to list the same files with the same SHA-256 values and each value to match the working-tree bytes, and requires each table row to link to its own file beside README.md. Class c, partial: it judges a hook self-test by its exit status only, so a weak or empty self-test passes; the link check verifies the target name only, not what a host serves; README, SHA256SUMS and hook bytes share one origin, so it proves the three agree with each other, not that the repository is uncompromised; and only the one integrity table is parsed, found by its header line and not by Markdown context; and the environment scrub changes nothing else, so a hook self-test that reads another ambient input (the clock, the time zone, the locale) must pin it itself. A self-test that outlives the gate's deadline, an unparseable table or SHA256SUMS line, or a missing required file is a cannot-evaluate (exit 2). Its linkage to a single corpus rule is arguable, so none is claimed here; an empty rules list is an open question, not a coverage statement."

[[gate]]
id = "artifact-checksums"
script = "tools/check_artifact_checksums.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "A published-artefact checksum gate, class c (partial): even while DORMANT its active honesty invariant D1 covers only a subset (the M1/M2/M3 evasions below defeat it), and the armed decision procedure is partial too, so dormancy does not make it total; reassess this residue at LA-2 arming. It ships DORMANT: with no [release.artifacts] recorded it prints NOT APPLICABLE, so the release-integrity linkage (secpub) is arguable and deferred until it arms, none claimed here. When armed it hashes only the LATEST artifacts-carrying release against the working tree and checks each digest appears verbatim on the evidence page. Disclosed residuals (the gate docstring carries the full text): disarming the armed release's own artifacts table returns the gate to dormant (B1; the forward ratchet constrains only later releases), an older release's recorded digests are not re-hashed (B2), the recorded artifact SET is not checked for completeness so a release recording an incomplete or unrelated-only set leaves a changed artifact unattested (B3), A1's path check is lexical while hashing follows symlinks so a recorded path symlinked outside the published tree is hashed anyway (B4), and the D1/A5 evidence scan is a lowercase substring test that a digest inside an HTML comment (M1), a bare prefix-less digest (M2), or an uppercase or substring-of-a-longer-run token (M3) can slip. The LA-2 PR-2 arming layer closes B1/B2, with the set-completeness (B3), real-path containment (B4), and evidence-token (M3) hardenings landing at arming too."

[[gate]]
id = "renderers-drift"
script = "tools/gen_renderers.py"
rules = ["gensrc"]
platform = "ci"
default = "block"
class = "a"
residue = "A byte-identity drift gate over the renderer/generator declaration rendered from each adapter generator's statically parsed RENDERER_DECL and GENSRC_OUTPUTS plus its computed pack-local import closure and framed code digest. It proves the declaration matches the code as bytes; it does not judge whether a semantics-revision bump is honest, and the obligation-altering versus byte-only classification of a renderer change remains a human disposition at the release delta gate. The closure is computed from statically parsed imports, so a truly dynamic pack-local import is out of scope and disclosed at the tool."

[[gate]]
id = "manifest-gen-drift"
script = "tools/gen_manifest.py"
rules = ["gensrc"]
platform = "ci"
default = "block"
class = "a"
residue = "A byte-identity drift gate over the five generated outputs (manifest, .gitattributes, ROOT, announce snippet, and the EN-8 frozen floor .aiqt/frozen.json) regenerated from the ownership map and the git-tracked surface. It proves the committed outputs equal a fresh regeneration and that the inversion assertion holds; it does not prove a class ASSIGNMENT is semantically right (a wrong but consistent class survives to review), and it cannot see a file hidden by an existing concrete exclusion pattern (the disclosed bounded residual of 4.2)."

[[gate]]
id = "manifest-integrity"
script = "tools/check_manifest.py"
rules = []
platform = "ci"
default = "block"
class = "a"
residue = "The independent release-side manifest verifier: scope-by-inversion completeness and no-strays, exact SOURCES set equality with raw-byte re-hashing, per-class verification including the CLAUDE.md managed block, TREE and ROOT and snippet recomputation, minimum-class floors, the filesystem-semantics fail-closed walk, and the 6.5 record schemas. It verifies bytes and sets against the anchored map; it does not judge whether a path's declared class matches its true ownership, does not recompute the site/downloads outputs (their own drift gates in this roster do), and detects accidental corruption, not deliberate modification (4.4)."

[[gate]]
id = "byte-canon"
script = "tools/check_byte_canon.py"
rules = []
platform = "ci"
default = "block"
class = "a"
residue = "Enforces the canonical byte format, .gitattributes coverage, and the platform matrix over the release scope at release time. It does not police an adopter's post-checkout local mutation; the checkout-bytes claim is proven only on the two CI matrix platforms; the zero-width/bidi allowance table is maintainer-authored policy whose rationale is reviewed, not proven; and coverage is evaluated against this repository's git attribute state, not any adopter clone's. Its refusal of a literal U+2028 or U+2029 covers this repository's release scope only: the separators stay outside the shared forbidden set, so opf does not refuse a view rendered from a record that carries one in an adopter's store, while opf's record emitter escapes both in the records it writes."

# --- VER-CORE Section 12 step 6 (VC-6): migration engine, crosswalk tooling, archive ------------------

[[gate]]
id = "crosswalk-schema-drift"
script = "tools/gen_crosswalk.py"
rules = ["gensrc"]
platform = "ci"
default = "block"
class = "a"
residue = "A byte-identity drift gate over the shipped adopter-facing schema reference .aiqt/core/migration/crosswalk-schema.toml, regenerated deterministically from the tool's own constants, plus a self-test of the adopter-mode candidate generation (archive-before-annotation ordering, the 8.2 immutability refusal, deterministic output, and the computed unmatched list). The self-test confirms the generator archives the UNANNOTATED legacy bytes verbatim and does NOT consume or derive any pointer from the archived source (8.6-conformant): the Expected-successor:/Coverage: pointer lines are stripped from the lexical-overlap ranking input, so changing only a predecessor's pointer content never changes which successor a candidate row names, and no pointer-hint is lifted from the archived bytes. Candidate mapping rows are produced by ranking against a supplied successor inventory (the --successor-inventory adopter input) and carry EMPTY verdict fields; with no inventory supplied the generator emits predecessor rows and the computed unmatched list and defers candidate-mapping ranking. It proves the shipped schema reference equals a fresh regeneration and that the archive-first candidate flow holds its invariants on synthetic input; it does not validate any adopter's live runtime crosswalk (that is check_crosswalk) and does not judge whether the candidate ranking heuristics chose the semantically right successor, which stays human judgment."

[[gate]]
id = "crosswalk"
script = "tools/check_crosswalk.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "It proves the crosswalk fields are present and well-formed: the archive digest chain is immutable (directory name equals recorded hash equals recomputed payload), every predecessor id is in the 8.3 namespace with a source-digest tying it to the immutable archived bytes, every predecessor is mapped (zero-unmapped computed, never trusted), every successor quote is a verbatim contiguous substring of the pinned inventory clause, and each 8.5 verdict carries the fixed token with a reviewer distinct from the author in both name and declared family. It CANNOT prove the human verdict is correct: an 8.5 semantic-equivalence judgment or an 8.2 completeness attestation that is field-complete and name-and-family-distinct but substantively wrong (a bad-faith or mistaken review) passes. Verdict truth is human judgment; the authenticated result-record upgrade is deferred to the adopter-experience report envelope. It also carries the tool's own disclosed mechanical CLASS-C RESIDUALS D5/D6 (the successor inventory is validated for self-consistency but not resolved against the pinned release, and pin.toml migration mode is not parsed; deferred to Step 7). In this repo the live leg reports NOT APPLICABLE (the pack is not an adopter install); its assurance is the self-test over synthetic trees. Its linkage to a single corpus rule is arguable, so none is claimed here."

[[gate]]
id = "migrate-crashinject"
script = "tools/migrate.py"
rules = []
platform = "ci"
default = "block"
class = "a"
residue = "A crash-injection self-test of the 9.3 journal-first cutover engine: for every kill point in its enumerated matrix (after the lock, after each preimage, after the preimage set, a torn INTENT, after INTENT, after each apply op, a torn payload mid-write, a torn COMPLETE, after COMPLETE, plus mid-rollback, torn rollback markers, and a torn directory-mode restore between the mkdir and the chmod), a real subprocess dies there and a fresh process recovers the synthetic tree from the journal ALONE to exactly the prestate or the verified poststate, terminal and idempotent, in both directions, across flat-file, nested-create, and nested-remove trees; it also exercises the inert 10.6 reverse-replay primitive (build_inverse_ops) directly over a completed cutover's INTENT ops, inverting each op in reverse dependency order (the un-adopt CLI and workflow are Section 12 step 7, not this slice). It proves crash recovery over that enumerated matrix on synthetic trees; it does NOT cover a non-quiescent tree (quiescence of the effective tree, not the prestate check, is what excludes a concurrent final-component swap), an arbitrary external writer mutating the tree during an open cutover is outside the transaction guarantee, and PID reuse on a platform with no readable process start-time cannot be distinguished (it reads as possibly-live, and the lock is never seized). Its linkage to a single corpus rule is arguable, so none is claimed here."

[[gate]]
id = "record-drift"
script = "tools/check_record_drift.py"
rules = ["recncl", "chtrk1"]
platform = "ci"
default = "block"
class = "a"
residue = "Total over the surface it examines: an OPEN merge_pending row carrying a TYPED ref (pr:N, decision:X) whose merge or record evidence exists in the declared truth sources always fails the gate. It reads only typed structured refs; a narrative number in prose, an untyped row, or a register kept outside the declared surface is out of scope by design (D9), and drift the truth sources themselves cannot see (an unpushed local merge, a PR merged under a subject with no (#N) marker) passes. In a checkout with no orchestration registry the live leg is NOT APPLICABLE (the record is machine-local by design) and the self-test carries the assurance; that scope boundary is printed, never silent."

[[gate]]
id = "record-sections"
script = "tools/check_record_sections.py"
rules = ["recncl"]
platform = "ci"
default = "block"
class = "c"
residue = "Partial over a best-effort, adopter-configured surface. It proves preservation only for column-zero H2 headings that the adopter's own regular expressions select and that are newly introduced on the branch (present at the branch tip, absent at the unique merge-base); it catches a clean section-drop but MISSES a section that was reworded, renamed, or moved (a changed heading reads as a new-and-dropped pair, not a preserved one), never compares section bodies, does not cover edits to a heading already present at merge-base, and cannot tell a valid supersession from an opt-out marker an author simply added. Any record path or heading outside the config, and any grammar the pattern does not match, is outside its surface. The config is trusted adopter input to this preservation check: rewriting it so its heading-pattern selects fewer or no headings (semantic narrowing that makes real sections stop matching) is a change to that trusted config, not a dropped section, and defending the config against adversarial narrowing is out of this gate's threat model (it is the config-integrity surface's concern). Missing or ambiguous inputs inside the declared surface (a duplicate selected heading, a heading-pattern that cannot be compiled in the working or the first parent's config, an unreadable declared record, an unresolvable ref, a config path whose final or any parent component is a symlink, a non-unique merge-base on EITHER the default or the explicit-base path, an explicit --base-ref that is not that unique merge-base, an explicit --branch-ref that disagrees with the observable second parent of a two-parent post-merge commit, a default config the merge itself deleted, an uninferable branch tip) fail closed (exit 2); an explicit --base-ref is accepted only when the merge-base is unique and the ref names it, so it cannot mask a drop by naming one of several merge-bases that disagree on a section, and when the post-merge commit has two parents an explicit --branch-ref must name the observable second parent, so it cannot mask a drop by comparing against the first parent. It also strips the ambient GIT_ environment before every git call so a redirected GIT_DIR or GIT_WORK_TREE cannot swap in a decoy repository, and it does not follow a symlinked config at the final or any parent component. Only with no adopter config present (a genuinely absent, not-a-symlink default) AND none at the pre-merge target is the gate NOT APPLICABLE by design; a config the merge removed, or one whose removal cannot be evaluated because the post-merge ref is unresolvable, fails closed instead. The schema-version-2 table leg (row preservation for declared append-only tables, keyed on declared columns, against the post-merge commit's first parent and the branch tip) carries its own residue: key-stable mode lets a row's content be gutted while its key survives; only declared tables and the stated grammar are covered (HTML tables and lists are not), each row line must start with a pipe and END with an unescaped pipe (a GFM-style row without the trailing pipe is refused, and so is a line directly after the rows that carries a pipe without starting with one, an indented row or a row without its leading pipe; a pipe-less non-blank line directly after the rows ends the table although GFM renders it as a further row, so a row placed after such a line is not tracked, and a heading or block quote carrying a pipe directly after the rows is refused, an over-deny whose in-band fix is a blank line after the table), and the grammar is textual, so a table that still parses inside an HTML comment or other non-rendering wrapper is counted even though it is not rendered; frozen rows compare by parsed value with type-aware equality (an integer never equals a boolean or a float; floats and datetimes compare by exact repr and floats by sign too, so a signed-zero substitution, a NaN sign flip, or an instant rewritten in another UTC offset is an edit while an unchanged NaN is not), and Markdown cells are trimmed of ASCII spaces and tabs only, so a cell edited in other Unicode whitespace is an edit; each config declares at most one table per file, and a second table in the same file whose header carries the same cells as the declared header (padding aside) is refused as a duplicate header, so while such a file sits on the target every gated merge is refused, an over-deny; when a key absent at the merge-base is added by both sides of a frozen table with different content, every resolution is refused (keeping either side's row trips R3 against the other), an over-deny whose in-band exit is a fresh key; archive rotation of rows to another file reads as disappearance, an over-deny, since no archive path list exists; changing a declared table's header line beyond re-padding is refused while the first parent's declaration is in force, an over-deny for column renames or additions; a carriage return in a header-matching line of any compared snapshot fails closed (the CR-stripped candidate is formed before the leading-pipe test, so a CR-prefixed header line is caught too), an over-deny when the blocked change would have been benign line-ending normalization; a declared table that cannot be located in an existing file at the first parent or the branch tip fails closed when that snapshot's own config declared that same table (same path, format, and header cells or array name, so a declaration of another table at the same path does not count; at the branch tip a declaration in the merge-base's config counts too, so a branch that renamed or removed a table both sides had declared fails closed rather than shedding the branch's own row obligations, while a branch forked before the table was declared still reads as not-yet unless a declaration at the same path was withdrawn on the pre-merge target's first-parent history between the merge-base (judged against its own first parent, so a withdrawal commit the branch synced into itself, making it the merge-base, is included) and the target, whatever the withdrawn locator (the checked declaration's own, later re-declared verbatim, and one the target's config declares again both included), so a branch whose merge-base is the withdrawal step or predates it cannot shed rows it left at the old path (a stub, a copy, or a row added in place under the old locator), while a merge-base strictly after the withdrawal step leaves the withdrawal outside that span and such a leftover still reads as not-yet, its rows outside the gate like rows added while the declaration was withdrawn, and a merge-base unreachable along the target's first parents leaves the span unevaluable, exit 2; only an absent file the absent-file refusal that follows does not catch, or an existing file whose applicable configs had not yet declared the table and whose path carries no withdrawal in that evaluable span, reads as the table not existing yet), an over-deny when the unlocatable form was benign, the leftover carried no rows the branch added, the target's config declares the identical table again, or no withdrawal in fact happened where the span could not be evaluated; a declared table's file absent at the branch tip while it existed at the merge-base fails closed too when the merge-base's or the pre-merge target's config declares a table at that path, a decision keyed on the path alone whatever header cells, TOML array name or format the declarations carry, reading no history, so while either of those configs declares a table at the path, a withdrawal and a later re-declaration under a changed locator, however each step landed (directly on the target or through gated merges), does not make the absence read as the table not yet existing, and a branch forked before those steps that moved the declared file cannot shed the rows it added under the new path by deleting the old file, while when neither config declares a table at the path (the re-declaration arriving only in the merge's own working config while the branch's merge-base sits inside the withdrawal window) the absence still reads as the file genuinely absent, a disclosed asymmetry against the leftover forms, bounded because rows re-added under another path are invisible to this declaration either way; the path-keyed absent-file decision and that withdrawn-locator span rule together over-refuse these sequences, each exit 2: a branch that moved or deleted the declared file, or left any file at its path, and merges in after the declaration at that path was withdrawn and re-declared (under a changed header, TOML array name or format, or verbatim under the identical locator), when its merge-base is the withdrawal step or predates it (the deleted-file form also needing the merge-base's or the pre-merge target's config to declare a table at the path); a branch that moved or deleted the file while no table was declared at its path (before any was, or during a withdrawal window), merging in after the pre-merge target declared or re-declared one there; a merge whose working config re-declares a table at a path the merge-base's config declared, or at a path whose declaration was withdrawn in that span, while integrating a branch that moved, deleted or left any file at the old path (its exit: merge that branch while the declaration at the path is withdrawn, then re-declare in a later commit); and a gated merge whose merge-base is not reachable along the pre-merge target's first parents while a declared table is unlocatable at the branch tip with no applicable snapshot declaration; it is an over-deny too for a branch-side deletion of the declared file with no replacement or a move the branch added no rows to (a deletion cannot be told from a move whose branch rows would be shed); the in-band exit is to withdraw or narrow the declaration at that path in an earlier, separate commit, land that withdrawal on the target (directly or through its own gated merge) before the commit or merge that moves or removes the file, and then move or remove the file, directly or through a gated merge, or to restore the declared table at the path on the branch tip (merging the target in or rebasing) before the gated merge (a branch that carries both the withdrawal and the removal into one gated merge is still refused, because the pre-merge target's config still declares the table, which keeps the absent-file check running for that path, and the merge-base's config declares a table there), never a single commit on the target removing the file and its declaration together (the first parent's declaration is still in force there and fails the removal), and while the declaration is withdrawn, rows that in-flight branches add to the old path are outside the gate; a branch forked before the file existed, or a deleted file at a path neither the merge-base's nor the pre-merge target's config declares a table at (as when the declaration is adopted by the very merge under gate), still passes; the config stays trusted input, and reading the first parent's config closes declaration narrowing within the same merge (a schema downgrade included, with the first-parent config validated by the same parser and shape checks as the working config, so any invalid first-parent config fails closed) but not narrowing landed in an earlier, separate commit; declarations come from the working config and the first parent's config only (the branch tip's config, the merge-base's, and the configs along the pre-merge target's first-parent span are read solely to bound the unlocatable-table and absent-file refusals, never to add obligations, the absent-file bound also counting the first parent's own declarations by path, and an invalid config read for any of those purposes fails closed), so a resolver can drop a table declaration added only on the branch together with that table's rows; with a --config outside the repository root there is no in-repo config at any commit, so the first-parent declaration read and both branch-tip refusals never apply there and declarations come from the working config alone, a state only a direct run() caller can reach, since the command line refuses an out-of-root --config; a single-parent post-merge commit is compared only against its first parent, which checks a squash endpoint to endpoint but checks a multi-commit rebase or fast-forward integration only across its final commit, so a drop in an earlier commit of such an integration passes unless the gate runs per commit or on the two-parent merge; a pull-request check evaluates the test merge, so if the target moves afterwards the live run on the target is still needed; the gate detects drops, it does not prevent the resolver from running; and it does not prove that a row's claim is true, which stays the semantic burden of the completeness rules the records serve. Pack CI exercises only the synthetic self-test while the adopter owns the live post-merge invocation."

[[gate]]
id = "mistakes-register"
script = "tools/check_mistakes_register.py"
rules = ["mstreg", "secaud"]
platform = "ci"
default = "block"
class = "a"
residue = "Total over the declared register: a broken digest chain or sequence, a reused id, an illegal status transition, a rewrite of anchored or merge-base rows, and an unverifiable landed row always fail; a declared-but-unreadable register, a malformed or unreadable anchor, an anchor entry that exists but is not a usable regular file (a dangling symlink or a directory; presence is an explicit lstat whose only absence answer is ENOENT, so such an entry, or an anchor lstat failure such as EIO, never takes the missing-anchor allowance), a present registry that is not a JSON object, a git failure, launch error or timeout deciding whether the register is tracked or reading its merge-base authority, and a launch error or timeout reading whether a landed row's commit exists, are exit 2. The anchor write (--update-anchor, tracked and untracked registers alike) never opens an existing entry: a non-regular anchor entry (a symlink, dangling or live, included) is refused with its target neither created nor rewritten, and a green advance lands by atomic replace of an exclusively created temporary. A same-authority local file offers no protection against an actor who rewrites the WHOLE chain and the anchor together, which defeats the untracked mode (the tracked mode is bounded by merge-base history instead), so rewrites are DETECTABLE within those bounds, never prevented; adopters needing real separation bind the same interface to a server-side append store. The landed-row check proves the cited commit and check path exist, not that the check semantically guards the mistake. In a checkout with no registry the live leg is NOT APPLICABLE with the self-test as assurance."

[[gate]]
id = "mistakes-register-append-selftest"
script = "tools/orch_register.py"
rules = ["mstreg"]
platform = "ci"
default = "block"
class = "a"
residue = "A synthetic self-test of the appender's write-time validation, not a live gate. On hermetic fixture registers it shows that an append whose resulting register fails the register gate's own verify_lines or verify_append_only (an illegal status transition, an unknown status, a landed row without an existing commit or repo-relative check_ref, a row that would fuse onto an unterminated last line, an anchored row rewritten in place, a wrong-family id in either direction) is refused with exit 1; that the appender validates in the gate's own context (the validation root is the nearest enclosing git repository of the appender's own installed location, exercised in subprocess vectors, unpatched for an appender installed inside a repository and, for one installed outside any, through a test-only search ceiling at the fixture's temporary directory (a .git entry above that directory reads as absent, so a git checkout around TMPDIR cannot decide the verdict, and a control appends through the same ceiling from inside a repository below it), so a register inside a nested repository validates under the declaring outer root, never under the repository that merely contains it and never under a root derived from the invocation directory; the id family comes from that root's registry declaration naming the register path, a --prefix that disagrees with it is refused, and a path no declaration names, a root with no registry, an appender installed outside any git repository, a gate root that is not a git repository, and two declarations resolving to the same path, hard links to one inode included, are cannot-evaluate with exit 2); that an authority it cannot evaluate (a tracked register with no computable merge-base, a git failure deciding whether the register is tracked, a malformed or unreadable anchor, an anchor entry that exists but is unusable, a dangling symlink, a directory or an anchor lstat failure that is not ENOENT included, an unreadable register or register descriptor, a symlinked register path, a landed row's commit read that git cannot launch or that times out, a register directory that cannot be created) is exit 2; that an ordinary append to an untracked register with no anchor is exit 2 naming the anchor, as a first row and on unanchored rows; that every refusal leaves the rows other appenders wrote byte-identical (a refusal before the first-row creation leaves an absent register and its directory absent; a refusal under the acquired lock after the exclusive creation removes the created file and the directory components the call itself made, naming the removal, only while that file is still the call's own empty file; a lock that cannot be acquired on the created file leaves that empty file in place and names it; anything else is left in place and named); that the commit is all or nothing, a failure injected at each commit step (the exclusive creation of a temporary file in the register's own directory, its lock, a failed or short write, its permission bits, its fsync, the under-lock re-check, the rename) leaving the register's bytes unchanged and no temporary file, with a temporary that cannot be removed named by its path; that a file or symlink swapped in at the temporary's name before the name check, or a temporary removed from its name, is refused by that name with exit 2 and the register byte-identical, a swapped-in entry left in place and named; that --bootstrap lands a register's first row and establishes the anchor --update-anchor would write, after which the ordinary gate passes, before and after a following ordinary append; and that clean appends, an AT- attestation row included, still land, each re-read with its last row and a clean verify_lines asserted. It binds only appends made through tools/orch_register.py: cooperating appenders are serialized by an exclusive flock held across the read, the validation and the commit of an existing register (one that took its lock on a file another appender's commit has since replaced starts over on the file the path names), a first row is created exclusively and re-checked under the acquired lock (the path still names the created file and it is still empty, so an appender landing between the creation and the lock forces a refusal, never an interleaved row), and the commit is bound to the validated file (opened once with O_NOFOLLOW and never written; the temporary, locked and fsynced, is renamed over it only while the path still names its device and inode, it has no other hard link and it still holds exactly the validated bytes, and only while the temporary's name still names the temporary, its lstat a regular file with the open temporary's device and inode), but a writer that does not take the lock (a hand edit, any other tool) is outside that serialization: the re-check catches one landing between the validation and the re-check, one landing between the re-check and the rename is overwritten by the rename, and any other is caught later by the mistakes-register gate, not here. At the temporary's name, an entry such a writer swaps in before the name check is refused, but one swapped in between the name check and the rename (two system calls) is renamed over the register unvalidated and the append reports success; the name check does not re-read the temporary's bytes, so a writer that opens the temporary by name and rewrites it is not caught here either; and the removal of the temporary after a refusal checks its identity and unlinks it in two calls, so an entry put at its name in between is unlinked instead. Not covered by the all-or-nothing commit: a crash after the rename and before the directory sync completes (the rename may then not be durable), a directory sync or --bootstrap anchor write that fails after the rename (exit 2, saying the row is in the register), a temporary a crash before the rename leaves beside an unchanged register, and the replaced file's owner, group, ACLs and extended attributes (its permission bits are kept). Validation runs on the decoded UTF-8 text with the gate's own line splitting, not on raw bytes. An ordinary append requires the anchor exactly as the gate without --update-anchor does; only --bootstrap, which appends a register's first row, takes the gate's --update-anchor allowance for an untracked register with no anchor, and an untracked register that already holds rows but has no anchor is anchored by the gate's --update-anchor, not by the appender."

[[gate]]
id = "selftest-execution"
script = "tools/check_selftest_execution.py"
rules = ["chgchk", "evgcmp"]
platform = "ci"
default = "block"
class = "a"
residue = "Total over its declared surface, in three layers. Layer one, STATIC pre-launch: every check() call site in the registered runner's source is resolved to literal ids and that set must equal the hand-authored expectation manifest tools/selftest_checks.toml exactly before any child is launched; it resolves only direct bare-name check() call sites with string-literal or for-loop-literal ids (the loop attribution is the innermost enclosing for, lexical only: it does not model any intervening dataflow between the loop header and the call site, a rebinding of the loop variable or a nested function boundary, so such a site can mis-attribute its ids, caught, if at all, by the runtime set reconcile), and a non-call reference to the bare name check, a comprehension-bound id Name, any other unresolvable or duplicate source id, and source that does not parse are refused fail-closed, never silently resolved, while two static blind spots remain, bounded the same way: an invocation route the static layer never sees a call site for because it never names check as a bare Name in Load context (getattr, exec, an import that binds a different name and is then called through it, or a globals()['check'] lookup), and a rebinding of the name check the static layer cannot detect (any Store-class or non-Load binding: an assignment, a with-as or except-as target, a nested def check or class check, an import check, a del check, or a global or nonlocal declaration), which leaves the direct call sites visible and counted while they may no longer invoke the instrumented helper; both are caught, if at all, by the runtime set reconcile, a registered id whose only route is invisible (no direct call site at all) is refused by the static layer pre-launch as a registered id with no source check(), and the dead-direct-site decoy (a route that re-executes an already-registered id whose direct call site is dead) passes both set layers and is bounded only by the non-discrimination residual (a constant-true check counts as executed). Layer two, RUNTIME: the executed check-id set recorded at the instrumented check() choke point is emitted as a strict structured report and reconciled exactly against the same manifest, judged with the child's real exit code; missing, extra, or duplicate ids, a missing, malformed, wrong-suite, or non-regular report, a malformed manifest, and every cannot-evaluate fail closed, and a child exit 0 never overrides a missing or mismatched report. Layer three: the child carries its own in-run self-guard, reconciling the same set even on a direct developer run of an intact runner; the self-guard sits behind the runner's module entry, so it cannot fire once that entry is gone (the runner then exits 0 with no output and no report on a direct run, which this gate reports as cannot-evaluate only when it launches the runner itself), and the entry-guard gate holds that entry in place for every registered runner. The child suite's own behavioural assurance (the orchestrator-integrity acceptance vectors over hermetic fixtures, judged on structured verdicts) rides the child's verdict, which this gate requires; the gate launches that child under a git-neutral environment built in two layers (HOME and XDG_CONFIG_HOME pinned to a fresh empty directory, so the per-user global config, ignore, and attributes surfaces are empty for every descendant git call, including one made after a descendant scrubs the GIT_* environment and drops the GIT_* pins, plus, for the immediate child, ambient GIT_* dropped, the global and system config files pinned to os.devnull with GIT_CONFIG_NOSYSTEM, and core.excludesFile and core.attributesFile overridden to os.devnull by injected entries), and drops every ambient PYTHON*-prefixed variable from the child environment, transitively neutralizing PYTHONPATH/sitecustomize module injection into descendant interpreters (nothing downstream re-derives or re-sets a PYTHON* variable, and the runner's own interpreter grandchild launches carry -I -B as defence in depth for a direct developer run), which hardens the GATE-launched child only, the runner's own direct-invocation hermeticity being a separately tracked item; three launch-environment bounds are disclosed: the system-wide git config ($(prefix)/etc/gitconfig) is neutralized only for the immediate child (GIT_CONFIG_NOSYSTEM and the GIT_CONFIG_SYSTEM pin are themselves GIT_-prefixed, so a scrubbing descendant drops them) and the system-wide attributes file ($(prefix)/etc/gitattributes) is not neutralized at all (no GIT_ATTR_NOSYSTEM is injected, and a scrubbing descendant would drop it the same way), a hostile system-wide file being root-owned, the same trust tier as the git binary itself and so at the threat-model boundary, outside what this gate defends, and git is resolved through the ambient PATH, a trusted-toolchain concern outside this gate's threat model, and the environment drop neutralizes the PYTHON*-prefixed family only, a loader-level injection control such as LD_PRELOAD and the interpreter binary itself sitting at the same trusted-toolchain tier, outside this gate's threat model. It proves SET IDENTITY AND EXECUTION only: it does not prove an invoked assertion is discriminating (a constant-true check counts as executed), carries no mutation sensitivity, sees nothing outside the instrumented check() helper (an assertion made by a direct FAILURES.append outside the choke point, whose non-execution is invisible to the execution set, a direct EXECUTED.append or _EXECUTED_SET.add that manufactures execution evidence for a check that never really ran, or a suite not registered), and cannot distinguish a legitimate from an illegitimate coordinated deletion of a check and its manifest row in one reviewed change. The static scan and the launch read the runner's source at two moments, so a concurrent same-user writer between them is outside this repo's sole-orchestrator threat model (the runtime layer still reconciles what actually ran); repo-root confirmation is a .git-existence proxy anchored to the gate's own file, not a full git-identity check; and the expectation manifest is trusted hand-authored input whose schema is machine-validated but whose completeness rests on source review. A row may carry an optional args list of literal arguments, forwarded to the runner ahead of the gate's own --execution-report pair; each must be a string of at most 200 characters from a closed printable-ASCII set (a letter or digit first, or one or two dashes and then one), and an argument that names, abbreviates, or attaches a value to --execution-report is refused, while any other shape is refused too. The filter is lexical: no row can redirect the report through the named option, and nothing more is claimed about what an accepted argument means to a given runner; a runner that writes no report (one that stops parsing, exits early, or takes the rest of its argv as data) is a missing report, cannot-evaluate, never a pass. Rows whose runners resolve to one path form a group: before any launch, every row of the requested suite's group must carry args no other row of the group carries, the rows' expected sets must be pairwise disjoint, and their union must equal the runner's static check() set exactly; a gap, an overlap, an extra id, or a missing or repeated args list is cannot-evaluate, and a single-row runner is held to the whole set exactly as before. Membership resolves every row's runner strictly, so a missing path, a non-directory component, a symlink loop or a permission error in any row's runner is cannot-evaluate before any report directory is allocated or any runner launched, never an assumed non-member, a runner path carrying a control or format character (C0, DEL, C1, the bidi controls, U+2028 and U+2029) is refused by the schema, and a suite id outside the closed suite-id grammar (a letter or digit first, then letters, digits, '.', '_' and '-' only) is refused by name, so a space-joined launch identity can never stand for a registered suite. Before any launch, every registered row must also have its launch line (check_selftest_execution.py --suite <id>) in both tools/run_all_checks.sh and .github/workflows/quality.yml, each read as a regular file through the parity gate's validated loader; a missing, non-regular, unreadable or loader-rejected roster, or a row whose launch line is missing from at least one of the two, is cannot-evaluate; a roster member counts as a launch line only when it is exactly check_selftest_execution.py --suite <id>, the one argv shape the gate's command line accepts, so a member carrying any further argument, or a near-miss id, launches nothing. That check is lexical: it proves each launch line is present, not that it runs or passes. The group rule is checked for the requested suite's group only, once per invocation, and launches that one row, so that every other row is launched rests on the lexical launch-line check; nor does the group rule prove that the runner's handling of its args selects the declared subset other than through the runtime reconcile of the row actually launched; a runner reached through a hard link or a byte copy under another path forms its own group, held alone to the whole static set, so an undetected group member can only be refused, never pass with a subset. Registered surface at this release: the orch-behaviour-selftest, ci-status-behaviour-selftest, git-fixture-env-core, git-fixture-env-config-combined, git-fixture-env-config-malformed, git-fixture-env-config-system, instruction-budget-selftest, python-floor-selftest, entry-guard-selftest, brief-capability-selftest, and hook-latency-selftest suites."

[[gate]]
id = "entry-guard"
script = "tools/check_entry_guard.py"
rules = ["chgchk"]
platform = "ci"
default = "block"
class = "a"
residue = "Total over its declared surface: every Python script the local check roster launches and every runner the self-test execution manifest registers. Each must parse from its raw bytes and carry exactly one top-level test of the bare name __name__ against the exact string \"__main__\", as its last top-level statement, with no else, whose body ends in a call statement (an expression statement whose value is a call, or raise SystemExit of a call) with no raise anywhere before it in that body (at any depth, and conservatively inside a definition too); a deleted, duplicated, displaced, nested, misnamed, misspelled, or empty entry, and one whose only call is dormant (inside a definition, a lambda, a nested branch, or a try) or follows a raise, always fails. Every control input (the roster, the manifest, and each script) is opened non-blocking without following a final symlink and must be a regular file: a missing, unreadable, or unparsable script, a symlink, FIFO, directory, or other non-regular path, an unreadable, malformed, or schema-invalid roster or manifest (the manifest is held to the execution gate's own schema validator), and a roster that launches no Python script cannot be evaluated (exit 2). No gate can hold its own entry (with its guard lost, both of its steps exit 0 silently), so its self-test is registered as the suite entry-guard-selftest and both rosters launch it only through the execution gate, which reads the missing execution report of a child that ran nothing as cannot-evaluate (exit 2); the self-test reproduces this on a scratch copy with its own guard deleted, and launches its own live step as a child and requires its PASS line. That holds only while its registry row and both suite roster lines stay; a coordinated removal of them is outside it. It proves only that the entry exists in that form. A static check cannot see a neutralization that keeps that form: the final call running something that does not reach the checks or exiting with a constant status (sys.exit(0), print(), a bare main() whose failure status is dropped); an earlier statement in the guard body that exits or raises through a call, rebinds the called name (main = lambda: 0), or replaces the exit function (sys.exit = print); a top-level statement before the guard that exits, raises, or never returns (raise SystemExit(0), sys.exit, os._exit, an endless loop), rebinds __name__, rebinds or shadows the called name, or registers a hook that overrides the exit status (atexit.register(os._exit, 0), a signal handler, sys.excepthook); an import whose side effect exits or replaces sys.exit or a builtin; a dispatch or check deleted inside a function the entry calls, which is caught for a registered suite only by the execution gate; and any other statement that changes control flow or the exit status before or during the final call. A symlinked parent directory is followed. It does not read the CI workflow (the parity gate holds the two rosters equal), does not see a script the roster never launches, and cannot tell a legitimate from an illegitimate coordinated removal of an entry and its roster line in one reviewed change. Its self-test proves each vector discriminating against its own table of single-check removal mutants, not against every possible regression, and the execution gate accounts for its checks by family (every vector, every mutant, each launch leg), not per vector."

