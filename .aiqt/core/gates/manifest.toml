ash written on any other line each named), and no job that carries a counted or judge-shaped step, nor any step of such a job, carries env: (an env: on a step after the judge does not reach it and is refused as policy, so the judge's job stays env-free; each env: and judge-step-key diagnostic names the recorded line of its key and whether the carrying step is the counted judge or an unresolved judge-shaped step), so moving that step into a host-patch job, removing it, doubling it in any spelling whose tokens equal the judge command's in any outside job (a quote-spliced path or flag and a one-command literal block scalar among them), running any other judge-shaped command outside the host-patch jobs, demoting the judge to a value that is not a step's own run: property, a key beyond name, run and shell on the judge step, a judge step without the exact line shell: bash, or an env: on a job that carries a counted or judge-shaped step or on any of that job's steps is a finding (outside-judge); and that the interpreter running the gate is that release, a final build. A difference is a finding (exit 1); a missing, unreadable, non-regular, symlinked or malformed source or workflow, a version component that does not convert, a workflow line that still carries a carriage return once its one trailing CR is removed or carries U+0085, U+2028 or U+2029, a line of a host-patch job or of any job outside them, their accepted job headers included, carrying a form feed or a vertical tab, a top-level line that is not a plain key, a repeated top-level key, a line under jobs: that the job line model cannot place, a host-job line outside its block-mapping grammar (a block scalar, flow, anchor, alias or tag, a repeated key, a line nested deeper than a step input), a line of any job outside the host-patch jobs that the extended job model cannot read (a job property at an unexpected indent, a quoted or explicit key, a block opener carrying an indentation indicator, a flow mapping, an anchor or an alias among them), a job or step key of such a job carrying an upper-case letter, a run: of such a job whose value is not one string, that shlex cannot tokenize or that carries a ${{ }} expression, a non-comment line of such a job, its header and block-scalar bodies included, carrying a backslash or opening a YAML anchor, alias or tag, and a line in a host-patch job that names the key outside the strict pin form are cannot-evaluate (exit 2), never a pass. Run locally, the interpreter leg FAILS on any other patch release, so tools/run_all_checks.sh fails there until the source and every host-job pin change together; in CI it runs only in the host-patch jobs, where it fails when the job did not run the pinned release. The source and jobs legs also run in CI outside the host-patch jobs, as the --jobs-only step of the registry job, mirrored as a run_all_checks.sh member and reconciled by ci-parity, so an edit inside the host-patch jobs alone cannot silence every CI run of the jobs leg. The judge's job carries no if:, so the jobs leg runs outside the host-patch jobs on every event. CI cost, accepted: the five jobs carry the pinned heavy-job if:, so in every run on a push or on a merge-train-* pull request of this repository they run the OPF tooling self-test and the four git-fixture-env suites a second time, each of those five suites running twice per such run, the four git-fixture-env suites as four parallel jobs (so the host leg takes about as long as its longest job, not the sum of the four), and an edit to a pull request's title or body starts no Quality run. It does not catch: another step in a host-patch job beyond its env:, a non-comment line naming --jobs-only and the reads of its run: lines (a run: line naming the flag's stem once every quote, backslash and dollar character is deleted is a finding, and one carrying a ${{ }} expression, one shlex cannot tokenize, one carrying a character outside the closed safe set a host-patch run: line is held to and one whose first word is a shell assignment are cannot-evaluate), such as one whose run: command starts another interpreter, appends to GITHUB_PATH or GITHUB_ENV, changes the checked-out tree or uses a local or composite action, a step that runs a suite runner as a module (python3 -m tools.check_selftest_execution among them), which names no suite runner's file name and so is not a suite step, or one carrying a working-directory:, an if: or a shell: other than bash (tools/check_ci_parity.py is the second holder there: it binds the line shell: bash on every step with a run: key, read once a trailing comment and trailing whitespace are removed, and its step grammar accepts only name:, uses:, run:, env:, with: and that shell line as step keys, so a working-directory:, an if: or any shell: other than shell: bash is cannot-evaluate for it, measured at this commit on an extra host-patch-job step carrying each of the three, and in every job it refuses a uses: of an action other than actions/checkout and actions/setup-python and a run: command outside its parity grammar), or a runner image that ignores the pin for another step; a judge built at run time by a shell expansion from parts that are not the literal names (a variable spliced into the path or the flag among them), whose tokens are not the judge's and spell neither literal name (tools/check_ci_parity.py is the holder there, measured at this commit on a full tree copy: a run: splicing a variable into this gate's path is cannot-evaluate, exit 2, there, dynamic-target, and a run: of ${{ matrix.command }} is cannot-evaluate here and exit 2 there too, workflow-expression); in CI, an edit that leaves no CI run of the jobs leg at all, which is what stays CI-blind once the outside-judge rule holds the --jobs-only judge step's placement: a top-level defaults: or env: (a run: shell: true {0} default among them) silences every run step of every job, the judge step included, and is refused only where this gate and check_ci_parity run outside that workflow, in tools/run_all_checks.sh, while an edit that pairs a job-level env: (a BASH_ENV value) in every host-patch job with a silencer or removal of the judge (a job-level env: on the registry job, which sits inside check_ci_parity's disclosed environment-value residual, which that gate owns; an env: on any step of the registry job, the judge step itself or an earlier step whose GITHUB_ENV write reaches it; or removing the judge step together with its run_all_checks.sh member, which keeps ci-parity's set parity) is refused only by this gate's jobs leg in tools/run_all_checks.sh, as a finding or, for a spelling that job model cannot read (a re-indented registry body or a quoted env key among them), as cannot-evaluate (a job-level defaults:, container:, continue-on-error: or uses: there is a check_ci_parity finding, reported in tools/run_all_checks.sh when CI is silenced); a job outside the host-patch jobs (every other quality.yml job that sets up Python pins 3.14, which setup-python may resolve to a 3.14 already on the runner with check-latest off, and the python-floor gate holds each such pin to 3.14 exactly; the Quality gates job sets up none); GitHub's runtime (a retired ubuntu-24.04, or a host patch with no build for the runner image, fails the jobs closed, never on another release; on 2026-10-12 the setup-python versions manifest listed Linux x64 builds of 3.14.4 for Ubuntu 22.04 and 24.04 only); differences between equal patch releases, such as a distribution build's downstream patches and the system libraries the interpreter links (OpenSSL, SQLite, expat, zlib and others); and whether the committed patch release is what the host runs, which rests on the maintainer updating the source when the host interpreter changes. The workflow grammar, the setup-python uses: shape and every other pin belong to the python-floor gate, which accepts a pin of a patch release only inside the host-patch jobs of quality.yml and only when it equals this source. 