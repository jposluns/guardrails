residue = "It checks that hand-authored copies of manifest-derived facts (the publisher-family parentheticals, the standards-README schema enum table, the closed-set parity of the programmatic kind/status dicts, the deferred-frameworks negative check, the subset-denominator invariant, the landing-page counts of rules, gates, hooks, frameworks, and enforced rules recomputed from the rule corpus, the gate and hook manifests, the standards manifests, and the enforcement register summary, the disclosure's shipped-path declaration checked against every path the release manifest lists, and the public instruction-budget section, whose PACK figure is checked against the committed ratchet and whose session target, pinned Claude Code build, and loader character check are each checked against one authoritative value) agree with the manifests. The positive fact-copy legs are roster-bounded and fail closed on a missing copy, but two of its legs are NEGATIVE text scans of the rendered pages that an entity-encoded or reworded form renders past: the subset-denominator leg (an 'N of M' regex with a literal space, evaded by 3&#32;of&#32;3) and the deferred-frameworks leg (every occurrence of the phrase in the standards README, matched case-insensitively with its words joined by any mix of whitespace, line wraps, hyphens, inline emphasis or strikethrough markers, or blockquote markers, reading the WHOLE SECTION around the phrase: from the nearest preceding ATX heading, or the top of the file, to the next heading of the same or a higher level, with headings found fence-aware so a '#' line inside a line-start fenced code block does not end a section early, a heading accepted only with exactly U+0020 or the line end after its '#' run (a Unicode-whitespace separator such as U+00A0 is not a heading there), an unterminated fence failing closed (exit 2, naming the file and the fence's opening line), and the WHOLE TEXT from its top to the section's end boundary REFUSED outright (exit 2, naming the file and line) when it holds an arrangement the line reader cannot prove it reads, validating the structure BEFORE a boundary may exclude text: a run of fence characters anywhere but a line-start fence (a list-item, indented or inline fence, whose '#' content could read as a false heading and truncate or mis-start the section), a list item opening with '<' (list-item HTML), a line starting with '<' other than a single-line HTML comment (its closing marker on the same line), or a '#' line that is not a heading in that grammar, no CommonMark container model being attempted, with a fence OPENED only where CommonMark opens one (a backtick fence whose info string holds a backtick is not an opener) and CLOSED only by a line holding nothing after the fence run but U+0020 or tab (never str.strip's Unicode whitespace); and the deferred span itself, from the phrase's line to the section's end boundary, read ONLY through a POSITIVE grammar on the raw lines (blank lines, plain column-0 paragraph lines, flat column-0 list items at most four spaces after their marker whose text starts with none of '<', '>', '#', a fence character or another list marker, column-0 ATX headings, and indented continuations that directly continue a non-blank, non-heading line and are plain text), every other line there (any blockquote, any fence, any HTML-led or nested container, indented code or an indented line after a blank line or a heading, a list-held heading or code, or a line of only '-', '=', '_' or '*' runs, a setext underline or thematic break) being cannot-evaluate (exit 2, naming the file and line); ATX headings computed TWICE, from the blockquote-stripped lines (which bound the section) and from the raw lines, each with its own fence state, any disagreement between the two readings from the top of the text to the section's end boundary (the boundary line included) being cannot-evaluate, so a blockquoted heading, a decoy heading manufactured by stripping, or a blockquoted fence inverting one reading's fence state is refused, never a silent boundary (the agreement is a necessary condition, not a proof of CommonMark equivalence; a divergence affecting only lines beyond the section end is not examined); a table with pipe-free rows and an emphasis-split phrase are inside the section by construction, at the disclosed cost of OVER-REFUSAL: a vendored name mentioned anywhere in the same section, even unrelated to the phrase, is a finding, and a refused arrangement anywhere above the section exits 2 even when it could not have affected it, and a blockquoted or nested-list spelling of the phrase or a name, which earlier revisions read, is refused rather than read; still unread: a setext heading is not a section boundary this reader models (a setext underline or thematic-break line inside the deferred span is refused, cannot-evaluate, but a setext heading ABOVE the phrase can still re-scope the rendered section against this reader's, which may stop at an ATX heading the setext-opened section continues past), and an entity-encoded or otherwise reworded framework name or phrase is not matched; the PHRASE match is claimed only for its enumerated joiners -- whitespace, line wraps, hyphens, the inline marker characters *, _ and ~, and blockquote markers -- and the NAME match only for whitespace, line wraps and blockquote markers, so a phrase or name interrupted by any other inline markup (a backtick code span, link brackets; for the name also hyphens or emphasis/strikethrough markers) is not matched: the claim is narrowed to those joiners rather than the match extended), so the gate covers a recognizable SUBSET (class c, partial); the gen_mappings render branch is the primary control and these legs are defence in depth. It checks only the enumerated fact copies, not arbitrary prose; the landing-page count leg anchors on README.md's exact wordings, bound to their designated lines (the proof line is the first bold-digit line and its wording must open it) and failing loud when one is absent, and it requires every run of Unicode numeric characters on a designated line (every character with a Unicode numeric value: decimal digits in any script, superscripts, subscripts, circled and Roman numeral characters, vulgar fractions and CJK numerals) to sit inside an anchored wording match, but a count stated outside those lines is not reached, and a number written with characters that carry no Unicode numeric value is not read (a number spelled out in words, a Roman numeral typed with Latin letters, or a symbol with no numeric value such as keycap ten or a die face); the shipped-path declaration leg requires every release path to fall under a declared prefix and backs the code/non-code split with a closed detector (the executable suffixes it names, a script-holding HTML page, an extensionless shebang file) that refuses a detected code path under a non-code prefix, but executable content of another kind is not detected and a row's plain-language label is a reviewed description it cannot semantically verify; the instruction-budget note is pinned to the committed ratchet, not a fresh measurement, so the pages state only the ratchet; and it trusts each manifest's catalogue declaration rather than proving edition-completeness offline. Its linkage to a single corpus rule is arguable, so none is claimed here."

