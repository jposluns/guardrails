ref set, a local-config write, a hook-file write, a file content edit, a symlink plant and retarget, a file chmod, the two index writes, the exclude write, a nested .git write, the root and hooks-directory chmods, and an empty mkdir; the directory-set leg is pure defence in depth, every walked directory being already an entry record, so its mkdir fixture is equally held by the entry leg), plus the sig:15 abnormal vectors repeated with SIGTERM inherited as SIG_IGN so that removing the recording stub's SIG_DFL restore reds the ordinary suite, plus the GitHub Actions template BYTE-GATED then held to EXACT TEXT (the file is read as raw bytes and any byte outside printable ASCII plus newline is refused before any comment or blank-line reduction, so a tab, a CR, a BOM and any other control or non-ASCII byte, including a Unicode-whitespace-led 'comment' line that YAML would read as verdict-masking scalar content, reds it; the surviving pure-ASCII text with full-line comment lines and blank lines removed, and nothing else normalized, must equal a canonical constant in the gate verbatim, so any added or changed key at any level, quoted, space-padded or aliased, any run continuation line or trailer, a flow mapping, a second step or a rewritten on: block reds it while full-line ASCII comment lines stay free to change, each reported bypass spelling and each refused byte class held red by its own mutant fixture), plus the located cannot-evaluate paths (a child-launch failure, no discoverable repository root, and an invalid .git marker each return 2), plus the enforcement-pack pre-commit floor (opf/enforcement/precommit: a staged-snapshot hook that writes the staged index as a tree, checks it out in a throwaway repository borrowing the clone's objects, HEAD and remote push URLs, and runs doctor --require-store then render --check over it, and a per-clone installer that writes a pre-commit stub into the clone's untracked hooks directory, the common one for a linked worktree, and never sets core.hooksPath): the installer writes the stub, reruns as a no-op, keeps other hooks, and refuses with nothing changed any core.hooksPath (the tracked pack directory included), an existing pre-commit hook, a hooks directory it cannot read (an unprivileged-user vector, as is the unreadable pack hook it refuses) or that is not a directory, and a git below 2.32; it fails closed (2, nothing written in either repository) without dirname, drops inherited GIT_ variables allowlist-style so an ambient GIT_DIR does not redirect it, a core.hooksPath supplied only by the environment does not read as configuration and a GIT_TRACE or GIT_TRACE2 destination in another repository is left byte for byte, rolls back the stub (and a hooks directory it created) when the read-back fails, installs from a linked worktree under a path with spaces, and a post-checkout or post-merge a branch commits in the pack directory does not run on checkout or merge; real git commit runs over installed fixtures refuse a staged immutable-body tamper by doctor's own finding with HEAD unmoved (the same commit without the hook succeeding), check the staged snapshot rather than the working tree in both directions, check the temporary index git names in GIT_INDEX_FILE for commit PATH and commit -a, commit a clean store on an unborn branch and keep a remote sync target VALID; a recording stub pins the hook's step order, arguments, isolated launch, read-only behaviour over the snapshot above, per-step propagation, status normalization, usage guard and snapshot removal, and holds it closed (2 with no step run) on a git below 2.32 and on an environment whose GIT_ variable names cannot be read, and 2 on a snapshot removal that fails, holds the hook closed without dirname and its git calls free of an inherited trace destination, refuses through the stub a commit whose working tree lacks the pack hook, and checks commits in a linked worktree. The pre-commit floor needs git 2.32 or later. Its residuals are disclosed in the shipped files, not closed: the stub is per-clone and not cloned; git commit --no-verify, a core.hooksPath set later and same-user edits bypass it; cherry-pick, revert, rebase, am and a merge that commits without stopping record commits without any pre-commit hook (a self-test vector holds the cherry-pick case); the hook and the opf.py it runs are the checked-out working-tree code, so checked-out changes to them run at the next commit; the snapshot applies no filter configuration; and a store in another repository is not snapshotted. CI catches a bypassed commit only for findings in the checked-out revision alone: the history checks (C-HISTORY-RESURRECTION, C-HISTORY-APPEND-ONLY, C-HISTORY-COUNTERS) compare with a prior committed snapshot that in CI is the checked-out commit itself, so a history violation committed with --no-verify passes the CI recipe, which a self-test vector holds along with the shipped files' disclosure of it. It arguably serves the change-carries-a-check discipline, but the linkage to a single corpus rule is not undeniable, so none is claimed here. Class c: this repository is not an OPFiles adopter, so the live leg reports NOT APPLICABLE and gates no real store integrity here, and its assurance rides the self-test over synthetic committed stores, which asserts representative 0/1/2 scenarios with exact exit-code matches, not the observe-and-validate engine's whole input space; it does not exercise behaviour against a live adopter product repository."

[[gate]]
