default = "block"
class = "a"
residue = "Total over the surface it examines: an OPEN merge_pending row carrying a TYPED ref (pr:N, decision:X) whose merge or record evidence exists in the declared truth sources always fails the gate. It reads only typed structured refs; a narrative number in prose, an untyped row, or a register kept outside the declared surface is out of scope by design (D9), and drift the truth sources themselves cannot see (an unpushed local merge, a PR merged under a subject with no (#N) marker) passes. In a checkout with no orchestration registry the live leg is NOT APPLICABLE (the record is machine-local by design) and the self-test carries the assurance; that scope boundary is printed, never silent."

[[gate]]
id = "record-sections"
script = "tools/check_record_sections.py"
rules = ["recncl"]
platform = "ci"
default = "block"
class = "c"
residue = "Partial over a best-effort, adopter-configured surface. It proves preservation only for column-zero H2 headings that the adopter's own regular expressions select and that are newly introduced on the branch (present at the branch tip, absent at the unique merge-base); it catches a clean section-drop but MISSES a section that was reworded, renamed, or moved (a changed heading reads as a new-and-dropped pair, not a preserved one), never compares section bodies, does not cover edits to a heading already present at merge-base, and cannot tell a valid supersession from an opt-out marker an author simply added. Any record path or heading outside the config, and any grammar the pattern does not match, is outside its surface. The config is trusted adopter input to this preservation check: rewriting it so its heading-pattern selects fewer or no headings (semantic narrowing that makes real sections stop matching) is a change to that trusted config, not a dropped section, and defending the config against adversarial narrowing is out of this gate's threat model (it is the config-integrity surface's concern). Missing or ambiguous inputs inside the declared surface (a duplicate selected heading, an unreadable declared record, an unresolvable ref, a config path whose final or any parent component is a symlink, a non-unique merge-base on EITHER the default or the explicit-base path, an explicit --base-ref that is not that unique merge-base, an explicit --branch-ref that disagrees with the observable second parent of a two-parent post-merge commit, a default config the merge itself deleted, an uninferable branch tip) fail closed (exit 2); an explicit --base-ref is accepted only when the merge-base is unique and the ref names it, so it cannot mask a drop by naming one of several merge-bases that disagree on a section, and when the post-merge commit has two parents an explicit --branch-ref must name the observable second parent, so it cannot mask a drop by comparing against the first parent. It also strips the ambient GIT_ environment before every git call so a redirected GIT_DIR or GIT_WORK_TREE cannot swap in a decoy repository, and it does not follow a symlinked config at the final or any parent component. Only with no adopter config present (a genuinely absent, not-a-symlink default) AND none at the pre-merge target is the gate NOT APPLICABLE by design; a config the merge removed, or one whose removal cannot be evaluated because the post-merge ref is unresolvable, fails closed instead. Pack CI exercises only the synthetic self-test while the adopter owns the live post-merge invocation."

[[gate]]
id = "mistakes-register"
