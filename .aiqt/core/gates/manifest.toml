# --- undeniable secsec link -----------------------------------------------------------------------------

[[gate]]
id = "secrets-scan"
script = "tools/check_secrets.py"
rules = ["secsec"]
platform = "ci"
default = "block"
class = "c"
residue = "A pattern scanner for hardcoded credentials: it catches recognizable provider-token prefixes (now including Google, Stripe, GitLab, SendGrid, npm, PyPI upload, and Slack webhook shapes), assignments of a literal to a credential-named variable, and high-entropy literals of 40 or more characters assigned to a generic credential-like name (Shannon entropy at least 3.5 bits per character judged on the token's first 150 characters, letters and digits required, placeholders and environment lookups excluded, metadata-named variables excluded). It still misses a keyword-free high-entropy string (the opaque-name class, R1, the measured residue of 2026-08-08 shared with gitleaks), a generic-keyword value of 12 to 39 characters that gitleaks can flag below the local 40-character floor (R3, a deliberate noise-control choice, confirmed against pinned gitleaks 8.30.1), a real secret held under a metadata-named variable such as public_key or key_path (excluded by design in the safe direction, where CI still catches it, R4); a deferred provider family (a Twilio-class short-prefix-over-hex or a Telegram bot token, left to gitleaks, R2); a secret split across lines or assembled by concatenation, an encoded secret, or a secret in a binary (R5); and an unquoted value that begins with an environment-lookup root such as process.env., treated as a reference not a literal (R6). What it reads: a file is scanned only when its name is a dotenv name (.env, or starting .env., in any case), its suffix is on the curated text allow-list, or it has no suffix, and only outside the .git, node_modules, __pycache__ and .working directories and other than the scanner source itself; any other file (an image, a binary key store, a text format off the allow-list) is never read. A dotenv or allow-listed file that is not valid UTF-8 is still scanned, decoded losslessly with each undecodable byte kept as a placeholder that is neither a word character nor a line break, so an ASCII secret beside a single stray byte is still caught; two or more stray non-ASCII bytes that together form a valid UTF-8 letter decode as that letter, so beside a token they break its word boundary and can hide it (the same word-boundary behaviour as in valid UTF-8 text). A scanned file that starts with a UTF-32 byte-order mark is ALSO scanned through a UTF-32 wide view beside the lossless byte view (the decode keeps an unpaired surrogate via surrogatepass; a scalar above U+10FFFF or a truncated final unit falls back to a replace decode whose U+FFFD placeholders are neither word characters nor line breaks, so a token before or after a four-byte-aligned bad unit is still matched), and a file that starts with a UTF-16 byte-order mark and has even length is ALSO scanned as UTF-16 (surrogatepass; a file whose first four bytes form the little-endian UTF-32 mark, which begins with the UTF-16-LE mark, keeps the UTF-16 reading as a further view beside the UTF-32 and byte views when its UTF-32 surrogatepass decode fails and its length is even), the views merged, so a byte-order-mark-prefixed file that actually holds 8-bit or ASCII text (almost any even-length byte string decodes as UTF-16, so a successful decode alone proves little) keeps the lossless-view coverage it had before the wide views. The merge drops duplicates per reported line and label, never per secret: two DIFFERENT tokens that share a path, view-relative line number and label (one per view) are reported as ONE finding, so the FAIL total counts reported findings, not an inventory of distinct credentials. UTF-16 or UTF-32 without a byte-order mark and other non-UTF-8 encodings are not decoded as such, so a secret in them can be missed; a byte-order mark in the middle of a file selects no wide view; mixed-width content behind one leading mark is decoded at that mark width only (the overlapping little-endian UTF-32/UTF-16 mark case is the one kept mixed reading); a declared-text odd-length UTF-16-marked file keeps only the lossless byte view, where the NULs of a real UTF-16 secret defeat the patterns; an odd-length file that begins with the overlapping little-endian UTF-32 mark keeps no UTF-16 reading at all (its wide view is the UTF-32 replace decode), so a UTF-16 secret in it can be missed, and a suffixless one of that shape is still decoded and scanned rather than named on a SKIP line; and stray bytes in the middle of a UTF-32 file misalign every later unit, so only a truncated final unit is recovered. Otherwise only a suffixless file that is not valid UTF-8 and took no wide view (no UTF-32 mark; a UTF-16 mark with odd length) is treated as binary and skipped, named on a SKIP line, so an extensionless key file carrying one stray byte and no byte-order mark is skipped too. Detection here is a compensating control, never a substitute for keeping the secret out of the repository in the first place."

# --- remaining gates: some linkage-arguable (rules = []), some gensrc-cited; class a (total) or c (partial) per the totality test above ---

[[gate]]
id = "leaks"
script = "tools/check_leaks.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "A best-effort denylist scan for known internal host specifics and codenames. It covers a recognizable SUBSET of the leak surface: per its own docstring (tools/check_leaks.py) deliberate obfuscation (mid-word splits, HTML entities, zero-width characters) can evade the hashed codename layer, a compressed format other than ZIP (a gzip, bzip2 or 7z file), a ZIP that begins after leading bytes (a self-extracting ZIP) inside a walked file not named .zip or inside an archive member, and an archive's bytes outside its members' data are only byte-scanned, so text compressed inside them is not seen: the archive comment and each extra field (up to 65535 bytes each), each member name (refused unless it is printable text, yet printable bytes can still hold a deflate stream) and every fixed-width record field, where the gate and zipfile check only the signatures and the lengths, sizes, CRCs, offsets, methods and flag bits that place and read the records (the end record's directory offset only as a shift common to every member's header offset), so any other fixed field holds any value and the longest run of contiguous bytes no check fixes is 28, a ZIP64 end record's versions, disk numbers and entry counts (its offsets 12 to 39), room for a short compressed text (a raw deflate stream of a private IP takes under 10 bytes; shorter runs include a local header's version, flags, method, timestamp, CRC and sizes, 22 bytes, and, behind a ZIP64 locator, the end record's disk numbers, entry counts and the directory size and offset that the ZIP64 record replaces, 16 bytes); and the structural patterns are scoped to this host's layout, so a novel or obfuscated private string outside those patterns slips it (class c, partial, the check_secrets archetype). Each walked path is first classified by a stat metadata probe (which follows a file symlink, so a symlink to a regular file is scanned as its target, while a dangling one is a read error, exit 2), and only then is its content read: a file that decodes as UTF-8 is scanned whatever its suffix, a file with a UTF-16 or UTF-32 byte-order mark has its declared encoding decided by a successful decode (UTF-32 first, then UTF-16 where its 2-byte mark is embedded), never by the 4-byte prefix alone; a stream decoding as neither candidate is a read error (exit 2, naming the file, never an ineffective clean scan), and a decodable one is scanned in every wide view (UTF-16 LE and BE at byte offsets 0 and 1, UTF-32 LE and BE each at byte offsets 0 to 3, undecodable units replaced) and in the lossless byte view, so a mismatched-endian or misaligned mark cannot hide UTF-16 or UTF-32 text from every view at once (each unit size is covered at every byte phase); and any other file holding a non-UTF-8 byte is decoded losslessly and scanned whatever its suffix or that suffix's case; a wide encoding without a byte-order mark byte-decodes and is scanned ineffectively (the patterns cannot match across its wide characters). A ZIP archive (a name ending in .zip in any case, or content opening with a ZIP signature) is read through one descriptor in a read that stops one byte past an archive-size bound, and one whose bytes read are over that bound is cannot-evaluate, the rest never read (the bound is checked on the bytes actually read, never on the stat size, so a file that grows or is replaced after the stat probe cannot pass it); otherwise it is scanned in its own byte view and unpacked in memory with the standard-library zipfile module, nothing extracted to disk, each member decoded by the same rules and scanned, a finding named archive!member:line; its central directory is checked against a member-count bound and a total-uncompressed-size bound, each member against a name that is not printable text (a control, format or separator character other than the space, a NUL included), encryption, a compression method other than stored or deflated, a nested-archive name and a non-empty member comment, and the byte spans of its parsed records (each local header with its name and extra field, each member's data and any data descriptor, the central directory, any ZIP64 end record and locator, and the end record with its comment) must be disjoint and cover the file exactly, each data descriptor must hold exactly its member's central-directory CRC and compressed and uncompressed sizes (8 bytes each where the local header carries a ZIP64 extra field), and a ZIP64 end record must carry no extensible data, all before any member is read. An archive over any bound, a corrupt or encrypted archive, an archive with leading, gap or trailing bytes or overlapping records (a local entry the directory does not list, or a second archive in the same file) or a record running past its end, a data descriptor that does not repeat its member's directory CRC and sizes, ZIP64 extensible data, a member comment, a member name that is not printable text, a member that cannot be read or decoded, a stored member whose stored bytes are not exactly its declared size and content, a deflated member whose declared compressed bytes are not consumed by exactly one complete deflate stream of exactly its declared size (re-inflated independently, so a directory misstating a size or a second stream after the first cannot hide text), a nested archive member, a non-regular file (whose content is never opened) and a symlinked directory (never followed) are each cannot-evaluate: named on a CANNOT EVALUATE line with exit 2, never a skip, so PASS is printed only when every walked input was read. An archive's scan stops at its first refusal, so when several of its members fail, only the first is named. Its self-test plants a private IP in a .csv and a Latin-1 .tsv, a host path in a Latin-1 .md, a Latin-1 README.MD, a UTF-16 file, a UTF-32 file, a fake-BOM file, big-endian and misaligned text behind a UTF-16 LE mark, UTF-32 text behind a mismatched or misaligned mark (with the wide-view enumeration itself asserted directly and the views read_scan_text returns asserted by position: count, order and decoder per view), a UTF-16 stream starting with U+0000 (scanned as UTF-16, never misread as UTF-32) and a suffixless Latin-1 file, proves a malformed BOM-declared stream fails closed naming the file, plants a private IP or host path in deflated, Latin-1 and UTF-16 ZIP members, in a ZIP under another name and in an archive comment, checks each archive bound just inside, exactly at and just outside it, proves a corrupt archive, an archive with an unlisted local entry, a second archive, a gap, trailing bytes, overlapping records, a comment past the end, a directory record with no local header or an unparsable record, a data descriptor hiding a deflated private IP or misstating one field, ZIP64 extensible data or a member comment hiding a deflated private IP, a member name that is a deflated private IP or holds a control character, a NUL or a no-break space, a member name that does not decode as UTF-8 under its UTF-8 flag, an archive whose bytes read exceed the size bound while its stat size is within it, and an encrypted, unsupported-method, nested, CRC-failing, undecodable, size-misstated, two-stream or never-ending-stream member are each cannot-evaluate naming it, passes archives whose records tile (data descriptors, ZIP64 sizes and end records, local extra fields) and printable non-ASCII member names, and exercises the non-regular and unreadable paths by deterministic fault injection rather than a skippable probe, with the non-regular file's read seam raising so a read-before-classification regression fails the case. Its linkage to a single corpus rule is arguable, so none is claimed here; an empty rules list is an open question, not a coverage statement."

[[gate]]
id = "msg-leaks"
script = "tools/check_msg_leaks.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "A denylist scan for known private strings and host specifics in the commit-message and PR-metadata channels the file leak gate does not reach: the commit messages in a change's range, the PR title and body, and the head ref. On a public repository it is post-publication DETECTION, not prevention, and cannot un-expose already-pushed text. Its coverage depends on the CI event running at all: a commit carrying a CI-skip annotation, or a pull request in an unmergeable state, can suppress the run, and a description edited after the check is re-scanned only where the workflow subscribes to edit events. The post-merge run scans the landed commit messages, not the pull-request description, so a value present only in a description that never enters the final message is outside that path. The hash layer is evadable by deliberate obfuscation; file contents (the file leak gate and gitleaks own those), reviews and comments, and author identity are out of scope. Its linkage to a single corpus rule is arguable, so none is claimed here."

[[gate]]
id = "portability"
script = "tools/check_portability.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "It checks that the shippable surface can land on a stranger's machine unchanged: no operator identity outside its attribution, no repo-operational vocabulary, no exemption markers, no unscannable file classes. It is a best-effort deny-list over an open vocabulary: a novel non-portable term or an unlisted operator-identity form outside the recognized set can slip it, so it covers a recognizable subset of the non-portability surface, not the whole of it (class c, partial). Its linkage to a single corpus rule is arguable, so none is claimed here."

[[gate]]
id = "derived-command-parameters"
script = "tools/check_derived_command_parameters.py"
rules = ["grdinp", "exetgt"]
platform = "ci"
default = "block"
class = "c"
residue = "An adopter-parameterized scan that flags a hardcoded LITERAL value at an adopter-declared command sink (a command word plus an option name in a declared command-surface file), so a reusable command derives its target-specific parameter rather than baking one in (grdinp input-soundness, exetgt templated-target re-verification). It ships NO command, option, repository, or path of its own: with no .aiqt/derived-command-parameters.toml it is NOT APPLICABLE, and a present but unusable configuration fails closed. It covers a recognizable SUBSET (class c, partial): it proves only that the declared sink is NON-LITERAL (a reference to an allowed variable), never that the variable resolves at runtime to the correct target, which is exetgt's runtime confirmation outside any static scanner. Its lexical scanner does not model pipelines and grouping precisely, credits no command substitution as derived, matches a command by basename only (an alias, a function, a wrapper, or a dynamically constructed command word slips it), and reasons only over the option forms and reference-variable names the adopter declared, so an undeclared sink, an obfuscated or constructed literal, and a forge or tool the configuration does not name are outside it."

[[gate]]
id = "relied-exit-pipes"
script = "tools/check_relied_exit_pipes.py"
rules = ["gatdis"]
platform = "ci"
default = "block"
class = "c"
residue = "An adopter-parameterized scan that flags an adopter-declared RELIED-ON command (a producer whose own termination status is the evidence later steps rest on) sitting in a NON-FINAL stage of a shell pipeline, at top level or inside a $( ) or backquote substitution body, in a declared script surface: the pipe reports the last stage's status, so the relied-on exit is discarded (gatdis: a verdict-bearing exit is taken only from a construct that faithfully propagates it). It ships NO command, subcommand or path of its own: with no .aiqt/relied-exit-pipes.toml it is NOT APPLICABLE (only a CONFIRMED absence: a configuration path that cannot be inspected, such as one under an unreadable parent directory, fails closed instead), and a present but unusable or non-regular configuration (a FIFO is refused before open, never read) fails closed (exit 2), as does a declared selector matching nothing in its surface, a selector with an empty, dot or dot-dot component or containing a NUL character (named as malformed, never a traceback), a symlink anywhere in a selector's resolution (the surface file, an ancestor directory, or any directory or file met during a directory walk, refused rather than silently skipped), a .git or __pycache__ entry met during a directory walk, whether a directory, a symlink or a regular file (a declared subtree is scanned whole, never pruned), a non-regular or non-UTF-8 surface, a declared command inside or after shell it cannot parse (an unquoted heredoc, a here-string, a process substitution, an unterminated construct; the refusal covers the file's remainder), a lexed segment whose offset in the file cannot be proven (never guessed; no known input reaches this through the shared lexer, so it guards against a lexer change), a declared command, plain, path-qualified or quote-split, inside the raw text of an sh -c, bash -c, dash -c, zsh -c, ksh -c or eval argument (clustered options such as -ec included), among the argument words of xargs, flock or find (so a find -name operand spelling the declared name refuses too, an over-refusal, disclosed), beside a coproc, possibly hidden behind a wrapper's option words (ANY option word after env, nice, ionice, timeout, time, command, exec, nohup, stdbuf or sudo, attached or separate, so command -v, time -p and ionice -c are refused too, an over-refusal, disclosed), a declared command whose subcommand sits behind option words, a declared NAME inside a subshell, brace group, while/until/for/select loop or function body, including a one-line function NAME { ... } definition and a non-brace body such as f() if ...; fi; a function definition whose body is not a compound form the gate models (a conditional or arithmetic command body) refuses in any file that mentions a declared command, and a subshell body is consumed at the definition and judged by the subshell rule, so the pending definition never leaks onto a later block (identity is read from the shell-dequoted words and, QUOTE-TOLERANTLY, from the unmasked raw text, so a quoted, split (to\"\"ol) or escaped spelling and a command visible only inside $( ) still refuse; the name counts even where it is only another command's argument data, an over-refusal, disclosed; and a quoted reserved word such as a quoted select or if is read PER TOKEN as a command name, never as syntax, so a plain same-spelled argument elsewhere in the segment changes nothing; a token the per-token walk cannot align, past a redirection or an undecoded construct, is read as a command name too, never resolved through another same-spelled word, while a FIRST token the walk cannot decode at a command start refuses instead, exit 2, for an executing segment with a declared command in reach (an over-refusal, disclosed: bash reads a genuinely quoted first token as an ordinary command name); and a backslash-newline is removed before reading, exactly as bash removes it before word splitting, inside double quotes included, so a continued keyword is still that keyword and a continued quoted word is still one command name), and a grouped or compound pipeline producer (a subshell, brace group or loop piped onward) in a file that mentions a declared command, even when the group itself holds none (an over-refusal, disclosed). One exemption clears a flagged pipeline, credited only for a closed form read with certainty. Pipefail is credited only through a closed whole-file LINE GRAMMAR: every line of the file must be blank, a comment, a standalone column-1 enabling set command spelled entirely from bash's own option-letter and set -o name vocabularies (an unknown letter or name, as in set -Zo pipefail or set -o nonexistent -o pipefail, makes bash reject the set command and run on with pipefail OFF, so it earns nothing, and a posix name earns nothing either: posix mode turns alias expansion on, state the grammar does not model), a plain assignment (never to a variable that is a view of the shell's own bindings or startup hooks, or that turns posix mode and with it alias expansion on: BASH_ALIASES, BASH_CMDS, BASH_ENV, SHELLOPTS, BASHOPTS, POSIXLY_CORRECT), or a plain simple-command line whose every command word is a literal name spelled plain in its own token (a quoted or escaped command word withdraws) that is neither in a refused set (set, eval, source, the dot command, builtin, command, exec, alias, unalias, enable, trap, function, sh/bash/dash/zsh/ksh, time, coproc and every reserved word, judged on the shell-DEQUOTED words, so sour''ce, \"set\" and e\\val still withdraw) nor ANY bash builtin outside a small modelled allowlist (true, false, echo, pwd, test, times, type: every other builtin, printf, read, declare, mapfile and readarray among them, can write options, aliases, bindings or variables, or run callback text the gate never parses; shopt is admitted only as shopt -s with every name from a closed roster of glob-steering options, so expand_aliases and lastpipe withdraw; a builtin a future bash adds would read as external, the disclosed bound of the roster), carrying no '$', backquote, escape, parenthesis, brace, redirection or trailing comment; every mention of pipefail must itself sit on an enable line; ANY line outside the grammar withdraws the credit for the WHOLE file, so files that keep control flow (if/case/loops), redirections, expansions or trailing comments beside their enable are refused toward a finding (an over-refusal, disclosed); the enable must additionally be a top-level statement before the pipeline, never a pipeline stage, backgrounded, or an arm of && or || (a left-arm enable such as set -o pipefail && cmd is refused too: the line is not standalone). RESIDUAL, stated exactly: the gate reads only the file, so inherited environment the file does not show, BASH_ENV, an exported shell function shadowing a command word, and a parent shell's options such as SHELLOPTS or BASHOPTS, which can arrive with alias expansion already on, is not modelled. A PIPESTATUS read is NEVER credited: a relied-on command whose exit a pipe discards is flagged whatever the file reads from PIPESTATUS afterwards, a save such as rc=${PIPESTATUS[0]} on the very next line included, because bash can skip that save or change what runs before it (a DEBUG trap under extdebug, an aliased or redefined word, text sourced from a file the gate never reads), and modelling which files may keep the read kept meeting new spellings that skip it. The remedies the finding names are set -o pipefail in effect for that pipeline, or running the relied-on command outside the pipeline with its own status saved (its output redirected to a file, rc=$? on its own line, and the former sink reading that file afterwards). This over-refuses, disclosed: an ordinary script that saves PIPESTATUS correctly right after the pipeline is flagged until it adopts one of those remedies, and under the pipefail remedy the save line has to go too, because its $ takes the line outside the closed pipefail grammar and withdraws the pipefail credit for the whole file. VERIFIED PREMISES: bash 5.3 was observed propagating an enabled pipefail into $( ) and backquote command substitutions, so the pipefail exemption extends into substitution bodies; dash lists pipefail in its option table only from release 0.5.12 (observed in that release's binary; POSIX Issue 8 adds pipefail), and an older dash rejects the set line itself as an illegal option, failing the script there rather than running on with pipefail silently off. It covers a recognizable SUBSET (class c, partial), residuals disclosed, not chased: which shell actually runs a file is not proven; pipefail inherited from BASH_ENV, SHELLOPTS, a sourced file, the caller's bash -o pipefail or shopt -so is not credited, so the gate can over-fire there (the fix is a spelled-out top-level set -o pipefail); a conditional enable, including the portable (set -o pipefail) 2>/dev/null && set -o pipefail idiom, is likewise not credited and over-fires; a function, alias or variable that renames the tool, an executor or wrapper this gate does not list, and a relied-on command the adopter did not declare, slip it; status masking that is not a pipe (|| true, ; true, set +e, a backgrounded command, a local x=$(...) assignment) belongs to gatdis and its hook, not here; contexts where set -e is suppressed (conditions, AND/OR lists) are not modelled; a tool that refuses work but exits 0 is invisible to any exit reader; and non-shell surfaces (Python shell=True, Makefiles, YAML run blocks) are outside it."

[[gate]]
id = "dashes"
script = "tools/check_no_dashes.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "It flags each literal character the repository's character policy forbids (.aiqt/char-policy.json; when that file is absent, a built-in default identical to this repository's file, which its --default-parity mode checks in this repository's CI: en and em dashes in Markdown, the standards manifests, the shipped hook files and the NOTICE pair) in each file the policy scopes. A policy file that is present but malformed, unreadable or a symbolic link is exit 2, never a fallback to the default; a policy character that str.splitlines treats as a line boundary (U+2028 or U+2029; the others are control characters, already rejected) makes the policy malformed, because the line-by-line scan would drop it unseen, and so does a lone surrogate in any policy string, which it could not print. It is total over the project's own trusted, well-formed UTF-8 content for every policy character its validator accepts, but covers a recognizable SUBSET of the character surface (class c, partial): an HTML entity such as &ndash; or &#8211; renders as the character yet is not decoded, and a file that is not valid UTF-8 is skipped wholesale (a fail-open the sibling check_links.py instead treats as a finding; recorded separately for hardening). A reviewed edit to the policy file narrows this gate (and the char-policy-write preview hook, which reads the same file) with no other control than diff review, and the repository's other character checks keep their own fixed sets and scopes. The preview hook only moves some findings earlier, for Write, Edit and MultiEdit calls in sessions that install it; shell writes, generators, other tools and other harnesses reach only this gate. Once armed, the hook allows a call it cannot evaluate (a payload not read in full within 2 seconds as strict UTF-8 JSON without a key repeated in one object, a malformed or unreadable policy, an unresolvable path such as a symbolic link loop, a root that is relative, does not exist or is not a directory, an unknown command-line argument or an argument list that is not a non-empty list of strings, an internal error) with a note naming the reason; it checks the form of a call's file_path, then the fields the tool needs, and only then resolves the path, compares it with the root and reads the policy file, so a malformed call gets a note wherever it points, and it is silent only for another tool and for a well-formed call that is clean, out of scope, or under a root without a policy file. Its copy of the policy validator is generated from this gate's by tools/gen_char_policy.py, whose --check fails on any byte difference. The hook's self-test H12 walks both files' module-level statements, compound statements' bodies included, and fails when one outside the copied region binds a name the region binds or reads, or __builtins__, at module scope, or a def or class body outside it declares one global; or when one makes an attribute or item store (an assignment, an augmented or annotated assignment, a for, with or comprehension target) or deletion, at module scope, in a class body or in a def's or lambda's decorators or defaults, whose target chain starts from such a name, json, builtins, sys.modules, this module or an alias of one of them. Conservatively, whatever the stored value, it also fails on a store whose chain starts from anything but a name (a call such as __import__(\"json\"), globals() or logging.getLogger(\"app\"), a conditional expression) or has a link (an attribute or a constant string key) named sys, json, builtins or modules. An alias is a name bound by one of these forms: an import of json, builtins or sys, of a submodule of one or of a name from one (from sys import modules binds an alias of sys.modules); an import of this module (import __main__, or the gate's module check_no_dashes imported under any name); a from-import from this module, whose name is an alias of the name it imports; and a for, with, comprehension or match target whose source is such a name or alias, sys.modules (sys or an alias of sys, then .modules), or an item of sys.modules, which counts as this module. The source is the iterable, the context expression or the subject and, recursively, each element of a tuple, list or set display, the element of a comprehension and each positional argument of a call but a bare name of a builtin function or class that the file does not bind (map(list, _rows)), never the function called or a keyword argument. Scope follows Python's rules: a binding is module-level only at module scope or in a def or class body whose own scope declares the name global (an enclosing def's declaration does not count); any other binding is local to its def or class body, a comprehension target to its comprehension and a nonlocal name to the enclosing def, and none aliases the module-level name of the same spelling. A name in a source or a store's chain counts as the binding its scope reads: its own; for a name its scope does not bind, the nearest enclosing def's that binds it (class bodies skipped) or else the module's; and in a class body that binds the name, which can read it before binding it, conservatively both its own and the module's, never an enclosing def's. Every other aliasing form is out of scope; diff review is the control. Ordinary stores are not flagged: sys.path[0] = ..., an item of os.environ or of a module-level dict under a key not named sys, json, builtins or modules, a store to an attribute not so named of any other name (_Options.verbose = True), and a store whose chain has no link so named and starts from a target whose source is none of those (for _row in sorted(_rows, key=len): _row[0] = 2). That walk catches accidental drift between the two copies; it is not a defence against a deliberate edit that replaces behaviour through a path the walk does not model. Examples, not a complete list: an alias made by plain assignment or a walrus (m = sys.modules[__name__], then m.validate_policy = ...) or by a target over a call's result (for m in (importlib.import_module(\"__main__\"),): ...); an item key that is not a constant string; a call such as setattr or exec; an in-place method call such as globals().update, sys.modules.update or json.__dict__.update; a store in a function or lambda body; reflective access through an object the walk cannot name; another module patching the file; and a module that shadows a standard library module, such as a json.py. The gate keeps a tools/json.py out only under python3 -I, as CI runs it. Diff review is the control for a deliberate edit; the hashes recorded in .preview/SHA256SUMS and the release manifest .aiqt/manifest.toml let an installer or a release check detect a shipped copy that differs from the reviewed one. Not verified: whether Claude Code's Edit can rewrite straight quotes in the new text to curly ones, which the hook would not see, and whether Claude Code writes a lone surrogate in the new text through a UTF-8 encoder that replaces it with U+FFFD, which the hook would not count for a policy that forbids U+FFFD; this gate scans the written file either way. Its linkage to a single corpus rule is arguable, so none is claimed here; an empty rules list is an open question, not a coverage statement."

[[gate]]
id = "links"
script = "tools/check_links.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "It checks that internal document links in Markdown files resolve to a real target. It covers a recognizable SUBSET: its matcher recognizes inline-style links [text](target) only, so a broken reference-style link [text][ref] is not resolved (class c, partial). Its linkage to a single corpus rule is arguable, so none is claimed here."

[[gate]]
id = "site"
script = "tools/check_site.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "It checks the published site surface for integrity (dashes, link and anchor resolution, basic HTML validity and tag structure). It covers a recognizable SUBSET: per its own docstring (tools/check_site.py) the subtrees of svg/math and of textarea are not structurally validated and links and ids inside them are not resolved (a self-described deferred coverage gap), so a defect inside such a subtree passes (class c, partial). Its linkage to a single corpus rule is arguable, so none is claimed here."

[[gate]]
id = "overclaim"
script = "tools/check_overclaim.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "A negation- and title-aware best-effort deny-list of marketing (site-only) and release-integrity (all-surface) overclaim vocabulary over site HTML, the hand-authored repo prose roster, and every registry-enumerated textual generated output. A banned release-integrity term flags regardless of tense and is cleared only by a directly-adjacent honest denial or a third-party control-title that wholly contains it. For the enforcement register page the gate proves, BY CONSTRUCTION, that every corpus- or ledger-derived CONTENT string the generator emits verbatim is printable ASCII and marketing-clean: the register generator single-sources that set (its page_content_strings enumerator, sitting beside the render functions and the shared field list they both iterate) and this gate consumes the identical set, so the checked strings cannot fork from what the page renders. The set spans the rule title, the corpus id, each mechanism reference id, the mechanism metadata the page shows verbatim (platform, default, entry point including a hook matcher, class), each mechanism residue, and each pending rule description. Over every such string a shared reject runs the plain marketing patterns AND a printable-ASCII allowlist on the exact raw bytes before any whitespace collapse (permitting only the printable ASCII range plus space, tab, newline, and carriage return), so any non-ASCII codepoint is refused on the bytes the page ships: an invisible or combining laundering character (a zero-width space, a combining grapheme joiner, a variation selector, or a non-ASCII space) and a confusable homoglyph (a Cyrillic or Greek lookalike letter that renders as an ASCII letter but evades the marketing scan) are both rejected. DISCLOSED RESIDUAL: the page CHROME (the shared, hand-authored, version-controlled CSS and JS the shell brings in, which is NOT generated from the ledger) is NOT proven marketing-clean by construction; marketing injected through that chrome rests on code review plus the file-content gates (byte-canon, dash, and leak scans). As an overlapping best-effort layer, NOT a by-construction closure, the gate also scans the register page static asset closure, extracting it with a real HTML parser (so unquoted and HTML-entity-encoded tag attributes are read, not missed by a quoted-only regex): the page inline style and script bodies, every inline style attribute, and the same-origin CSS and JS it links. Over that closure it strips CSS comments, decodes identifier escapes, concatenates the adjacent strings of a content value and decodes their escapes, resolves a content attr(NAME) against the named page attribute, follows the same-origin CSS @import graph bounded by a visited set so a cycle terminates, and decodes and scans a data: stylesheet or a data: script body (base64 or percent-encoded), bounded in encoded UTF-8 bytes and failing closed on a malformed encoding, an oversized payload, or an asset over the pre-read ceiling. This chrome layer is best-effort and does NOT close the CSS or HTML injection surface by construction. Known static vectors it does not catch are disclosed here, not claimed caught: a content value whose interior semicolon or brace truncates the extractor; a content value assembled through a var() custom-property indirection; generated content via content open-quote or content url() of a data image; an escaped close-paren inside an @import url() target; a stylesheet gated only by a css filename rather than the html stylesheet sink; and nested HTML in an iframe srcdoc. Runtime JS DOM construction of text, an encoded payload buried in an arbitrary JS string whose location and encoding are not statically declared (distinct from a data: URL, which is decoded), and a genuinely off-site (cross-origin) asset a static gate does not fetch are out of static reach as well. The deny-list itself is best-effort and cannot catch a novel paraphrase, the third-party title allowlist and the adjacency guard are maintainer-calibrated, and it polices wording, not whether an underlying mechanism works. Its linkage to a single corpus rule is arguable, so none is claimed here."

[[gate]]
id = "license-qualification"
script = "tools/check_license_qualification.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "A best-effort literal matcher over the public-facing surfaces (site and opf/site HTML, docs Markdown, disclosure.toml, DISCLOSURE.md, README.md). It is case-INSENSITIVE, whitespace-collapsed, and VERB-ANCHORED: class 1 flags a whole-project claim only when one of the verbs open source, licensed, published, or released governs 'under the Apache License 2.0', and clears it only when a vendored-third-party qualifier marker sits in the claim's SAME SENTENCE, on either side of it; markdown-linked forms such as 'under the [Apache License 2.0](LICENSE)' are matched too. Class 2 flags an AIQT or AIQT Guardrails mark called registered: the U+00AE registered symbol including spaced and multi-symbol forms, or a subject-anchored 'AIQT is a registered trademark'. It is a calibrated literal matcher, not a paraphrase detector: a reworded whole-project claim, a qualifier marker present but asserting no genuine exception, or an indirect registration misstatement is not caught. Class 3 flags a LICENCE-WAIVER CONTRADICTION: a closed waiver-phrase list (no rights reserved, all rights waived, dedicated to the public domain, copyright waiver, cc0), matched case-insensitively on the same surfaces with tokens joined across whitespace and markdown blockquote markers, whenever the project licence reserves rights. The licence identity is declared in .aiqt/license-qualification.toml (licence = '<identity>' from a closed table) and verified against the licence file (exactly one of LICENSE, LICENSE.md, LICENSE.txt, COPYING; one leading U+FEFF byte-order mark is dropped before it is read), whose LEADING non-blank text must be that identity's canonical opening (ending on a complete token boundary) with no other identity's opening anywhere in the file (markdown emphasis, heading, list, and blockquote markers are read as spaces; HTML tags and entities are not), and a declared rights-waiving identity (CC0-1.0, Unlicense) must be the WHOLE canonical text of that licence, token for token and case-insensitively, with only whitespace tolerated, so a waiving heading over other terms never switches class 3 off; with no declaration only a rights-RESERVING identity whose opening leads the file is inferred, a rights-waiving identity (CC0-1.0, Unlicense) is never inferred, and an incidental mention never decides an identity (it refuses the file, fail closed). There is no quoted-text exemption: the only exemption is an [[exception]] row (path, phrase, reason, and one binder, the exact line text or the 1-based occurrence index), each excusing exactly one occurrence. A stale row (under a rights-waiving licence too), a malformed or unreadable configuration, or an unknown, ambiguous, duplicated, absent, or unreadable licence file is cannot-evaluate (exit 2), never a clean pass (presence is decided by lstat, so a permission-denied candidate or configuration is a named error, never read as absent, and a stat error on a present one is named too, never reported as not a regular file), with class-1 and class-2 findings still reported, and flushed, first. A paraphrased waiver, a waiver phrase split by inline markup or an entity, a #cc0 that is the whole value token of a CSS declaration inside an HTML style element or a quoted style attribute (found syntactically: such markup written as text in a code span, fence, or comment still counts, any name of the admitted property-name shape (up to two hyphens, an ASCII letter, then ASCII letters, digits and hyphens) is a property name, and a nested selector that opens like a declaration inside a block reads as one; #cc0 anywhere else, in prose, a heading, or a CSS-looking line outside that markup, is caught, as are #CC0-1.0, ##cc0, x#cc0, #cc0.5em, and every other waiver phrase after a leading number sign), or a licence outside the closed identity table is not caught. Its linkage to a single corpus rule is arguable, so none is claimed here."

[[gate]]
id = "footer"
script = "tools/check_footer.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "It checks that every site/**/*.html outside an explicit allowlist carries a /disclosure link INSIDE its <nav>, failing closed if a non-exempt page lacks it or the allowlist drifts (B-10 repurposed this gate from footer coverage to nav coverage; the filename is retained as its gate identity). It is total over the project's own trusted, well-formed rendered nav markup, but covers a recognizable SUBSET (class c, partial): a /disclosure anchor inside an unrendered <template> or a hidden nav satisfies the structural test without being real navigation, and its attribute reader takes the last of a duplicated href (the first-wins fix applied to check_newtab in task-9 is not yet carried here; recorded separately for hardening). Its linkage to a single corpus rule is arguable, so none is claimed here."

[[gate]]
id = "newtab"
script = "tools/check_newtab.py"
rules = []
platform = "ci"
default = "block"
class = "a"
residue = "It recursively checks that every external site link in the configured roots (HTML <a href>, SVG <a xlink:href> when plain href is absent, and <area href>) opens in a new tab with a noopener rel, and flags any <base href> fail-closed. Coverage precedence is AIQT_NEWTAB_ROOTS (an os.pathsep-separated list), then the repository-local .aiqt/newtab.toml declaration, then the present conventional roots site/ and opf/site/. AIQT_NEWTAB_ROOTS outranks the checked-in declaration and can narrow this repository's required coverage, including omitting either declared root. Discovery cannot detect removal of an undeclared root or discover arbitrary custom roots; declare them to make their presence required. Invalid configuration and missing, unreadable, or page-less selected roots fail closed. The declaration is tracked here but excluded from the shipped pack; adopters own their root configuration. It is total over that hyperlink-element surface: it decodes HTML entity references in attribute values and applies WHATWG URL normalization with fail-closed external classification (first-duplicate-attribute semantics), so an entity-encoded or obfuscated href is still decoded, inspected, and classified. It does not cover navigation outside that http(s)/protocol-relative-href surface: a javascript: or other non-http href, script-driven navigation, and declarative redirects via meta refresh, <form action>, or <button formaction> are not inspected (a surface-boundary declaration, not an in-surface evasion of the hrefs it examines), so class a holds on that honest boundary. It is a site UX and reverse-tabnabbing-safety invariant, not a corpus-rule linkage, so none is claimed here."

[[gate]]
id = "site-versions"
script = "tools/check_site_versions.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "It checks that every `AIQT X.Y.Z` product-version token on the site's HTML pages names a currently-valid version (the released pack version read from changelog.toml, plus a hand-maintained in-development allowlist), so a version left stale after a release bump is caught and the release process is forced to update the site. It covers a recognizable SUBSET (class c, partial): it matches ONLY the `AIQT X.Y.Z` pattern, so it does not catch a stale version in another phrasing - some of which are MATERIALIZED current references that would go stale at the next bump (the dev-track `(1.1.0, in development)` in titles, `1.0.0 chat`/`1.0.0 pack`, `the 1.0.0 release` in the evidence-page meta), a bare number with no AIQT prefix, or a third-party framework version - and it also does not catch a token separated from AIQT by a MARKUP TAG (`AIQT <strong>1.0.0</strong>`) or a SOURCE-LINE WRAP, an HTML entity, a `v` prefix, a different case, or a 4th-segment, pre-release, or build-suffixed form such as `AIQT 1.0.0.0`, `AIQT 1.0.0-rc1`, or `AIQT 1.0.0+build` (unmatched, out of scope; no gate scans the site for those malformed forms), while a leading-zero form like `AIQT 01.0.0` IS matched and flagged as unknown (the safe direction); and it enforces set-membership (is the version currently valid) rather than per-page context correctness. A symlinked page fails closed, but a symlinked directory inside site/ is not descended by the shared walker (a committed symlink anywhere is itself rejected repo-wide by the manifest gate, gen_manifest). The in-development version is a hand-maintained constant until it ships in changelog.toml. Its linkage to a single corpus rule is arguable, so none is claimed here."

[[gate]]
id = "install-page"
script = "tools/check_install_page.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "A static tripwire over site/install.html, site/js/install.js, and site/styles.css. It checks that the five family sections are present and statically visible (no hidden, inert, aria-hidden, visually-hidden class, or inline display:none/visibility:hidden style on a section), the picker links plus the visible #install-picker group, the single hidden reset, and the announcing #family-status region (aria-live polite/assertive, or role=status not overridden by aria-live=off) are present with no pre-set filter state; that install.js is an EXECUTABLE external script (not commented out, no non-JS type attribute) whose src BASENAME equals install.js (a suffixed path like /js/install.js.disabled is rejected) and site/js/install.js is non-empty and carries the real picker logic in CODE (JavaScript // and /* */ comments are stripped before the token test, so a comment-only file does not count), with no inline script or on* handler in the picker or family-section subtrees, scoped by structure (the .platform-actions group, #install-picker, or a data-family-section) rather than by an id being present; and that the guarded html[data-family] hide-all rule plus all five per-family html[data-family=<fam>] reveal rules are present, each targeting a <section> tag specifically (section[data-family-section]; a wrong-tag selector like x[data-family-section] does not count), each guard and its section in the SAME non-negated selector with a real display declaration matched at a property boundary (a --custom property, a :not()-negated guard, or a guard and section split across comma selectors do not count). ENFORCEABILITY (class c, partial): this gate catches ACCIDENTAL regression by a maintainer editing the site; it is NOT adversarial-grade. It is deliberately NOT a CSS engine or a browser, so a determined author can still hide a family section past it by construction, for example via a hidden ANCESTOR or wrapper element around a section, exotic inline or stylesheet CSS hiding a static regex does not model (opacity:0, height:0, transform:scale(0), clip-path, and the like), a custom clip/opacity class, hiding by id, a NEW unguarded stylesheet rule beyond the guarded ones, or a hidden #family-status element; and it does not execute install.js to prove the picker logic is correct, only that the expected tokens are present. That residual class of static-check bypass is unbounded and is DISCLOSED here, not claimed closed; it is left to review and the cross-family QA. Its linkage to a single corpus rule is arguable, so none is claimed here."

[[gate]]
id = "sized-instructions"
script = "tools/check_sized_instructions.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "It checks the three hand-authored sized instruction condensations (aiqt-instructions-8k/5k/1_5k.txt) against their character caps, counted with wc -m semantics from the raw decoded bytes so a CRLF file is not undercounted; that a single well-formed 'Version X.Y.Z' line agrees across the condensations, the authoritative skill version, and the generated full instructions file. A version token is clean ONLY when its three dotted numeric segments are followed by horizontal whitespace, the end of the line, or a single sentence period then whitespace/EOL: a 4th dotted segment (1.2.3.4), a non-numeric 4th segment (1.2.3.foo), a prerelease or build suffix (1.2.3-alpha, 1.2.3+build), and a trailing alphanumeric (1.2.3rc1) are all rejected, and any line that opens a 'Version' declaration but does not parse cleanly is a fail-closed finding even when a valid line sits beside it (so a malformed line cannot hide next to a good one). It also checks they match a recorded SHA-256 of that generated source, failing until a maintainer reconciles them and re-blesses with --update, and fail-closed (exit 2) on a missing, unreadable, invalid-UTF-8, or malformed-version input. ENFORCEABILITY (class c, partial): this gate catches ACCIDENTAL regression by a maintainer editing the site; it is NOT adversarial-grade. Residuals it does NOT catch: because the condensations are hand-authored it cannot judge whether their trimmed prose faithfully preserves the standard's meaning; and the --update reconciliation check is a git-diff heuristic that proves only a condensation 'changed vs HEAD', not that the edit semantically reconciled it (a whitespace-only edit passes), with a fresh bless over a missing or empty baseline requiring an explicit --force rather than being blessed away silently. That git check also assumes a real git context: a git evaluation error (for example --update run outside a git working tree) is treated conservatively (it cannot confirm the reconciliation, so it refuses to bless without --force), but the residual that a maintainer could pass --force in such a state, or that git-diff equivalence is not semantic equivalence, is DISCLOSED here, not claimed closed. Its linkage to a single corpus rule is arguable, so none is claimed here."

[[gate]]
id = "versions"
script = "tools/check_versions.py"
rules = []
platform = "ci"
default = "block"
class = "a"
residue = "It checks version format and single-sourcing. It arguably serves the change-tracking discipline, but the linkage to a single corpus rule is not undeniable, so none is claimed here."

[[gate]]
id = "instruction-budget"
script = "tools/check_instruction_budget.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "It measures, in UTF-16 code units, what Claude Code loads unconditionally from this repository and fails when the pack's share grows. It reads only the enumerated grammar its docstring states and fails closed (exit 2, naming the file and line) on anything outside it, preferring to refuse a construct over modelling it. PACK is every .claude/rules/**/*.md file with no paths: scope, or a paths: scope whose every glob normalizes to **, with a leading frontmatter block removed and only a whole-line HTML comment between blank lines removed (every other comment is counted); plus the imports of every rule file, a paths:-scoped one included, because Claude Code loads those in every session though the scoped file's own body is not counted; plus the pack-managed RULES-INDEX block of CLAUDE.md and its imports; plus .claude/CLAUDE.md, which Claude Code reads beside CLAUDE.md in every session, measured whole, wherever its path resolves, under the same grammar, with its imports; plus a modelled header for each loaded file (the fixed Contents of text, the type suffix the pinned loader writes for a project file, the colon and blank-line separators, and the file's resolved path relative to the resolved repository root, as the loader writes it for a symlinked rule file or rule directory, or for CLAUDE.md and .claude/CLAUDE.md the longer of that path and the fixed name; the machine-specific absolute root prefix and the loader's constant once-per-session preamble are not counted, so the figure is portable). Every @ candidate is followed recursively whatever Markdown surrounds it (a code span, fenced code, or comment included), and each target is counted once. SESSION, reported but not enforced because the bytes outside the managed block belong to the adopter, is the same rule files plus the whole CLAUDE.md, .claude/CLAUDE.md, every file any of them imports, and their headers. It fails (exit 1) when PACK exceeds the ratchet in .aiqt/core/instruction-budget.toml or when a rule file, .claude/CLAUDE.md, or the managed block imports RULES-INDEX.md or AGENTS.md. It fails closed (exit 2) on a missing or unreadable file; invalid UTF-8; a control, format, or Unicode whitespace character other than tab and a line ending; frontmatter outside its one-line string grammar or a paths: value that is not a string glob (a plain value with no /, *, ?, [, { or letter-dot-letter run, such as src, exits 2, a disclosed over-refusal that quoting avoids), in a rule file or an imported file alike; missing or duplicated RULES-INDEX markers; an @ that begins an import token (at a line start, after whitespace, or after a comment closer) on the same line as an HTML comment opener or closer or followed by a comment (Claude Code removes the comment and can join an import path across it), while an @ inside a word, such as an email address in a comment, is not refused; an import that is not printable ASCII, is home relative or absolute, holds a .. component, passes through a symlink, holds a Windows 8.3 short name component (such as PAYLOA~1.MD, also right after an inline Markdown token; prose such as @~1 or HEAD@{1}~1, whose run the loader's own path filter drops, passes), or names a directory, an unreadable entry, or an entry that is not a regular file, or any component of which matches two or more entries case-insensitively (two files or directories that differ only in case, whether or not one of them matches exactly), a pair of directories that differ only in case on a resolved path exiting 2 even when only one of them holds the next component (a disclosed over-refusal); a symlink under .claude/rules/, the rules base, CLAUDE.md, or .claude/CLAUDE.md that, resolved hop by hop with every link read, leaves the repository, loops, or meets a component or link spelling that collides in case with another entry on the way; a symlink under .claude/rules/ that reaches a directory twice; CLAUDE.md or .claude/CLAUDE.md that is not a regular file, checked before it is opened; a rule file that is not a regular file (a FIFO, socket, or device), every measured file being opened non-blocking and read only when regular; two directories or .md entries of a directory under .claude/rules/ that differ only in case; a case variant of CLAUDE.md, .claude, .claude/CLAUDE.md, or .claude/rules (such as .claude/claude.md or .claude/Rules), which Claude Code opens on a case-insensitive file system; and a malformed budget source. An @ path that names no file, such as a mention or an email address, adds 0. ENFORCEABILITY (class c, partial): it models the loading rules of the Claude Code build pinned in the budget source from the repository's own files and does not run Claude Code; its model is not a proof that the loader agrees on every input inside the grammar. It does not measure user-level files (~/.claude/CLAUDE.md and ~/.claude/rules/), which load in every session too; an AGENTS.md or any other file loaded through the instructionFiles setting rather than an @ import; CLAUDE.md files, .claude/CLAUDE.md files or .claude/rules/ directories in other directories, or a personal local memory file; the absolute root prefix of the path in the header Claude Code writes before each loaded file; skills, hooks, tool definitions, or the system prompt; or loading by a Claude Code version other than the one pinned, whose behaviour may differ (its header model was verified against the pinned build only). Case is folded on two keys (Unicode NFD then casefold, and upper), so a file system whose folding matches neither can still merge names the gate reads as distinct. Some inputs count higher than what Claude Code loads, by design: a comment the loader may remove, an @ in a code span or fenced code, a file reached under two names. A symlinked directory under .claude/rules/ that resolves inside the repository is followed (a committed symlink is rejected repo-wide by the manifest gate), and the count is UTF-16 code units, not tokens. Its linkage to a single corpus rule is arguable, so none is claimed here."

[[gate]]
id = "must-deliver"
script = "tools/check_must_deliver.py"
rules = []
platform = "ci"
default = "block"
class = "a"
residue = "It holds every rule listed in .aiqt/core/must-deliver.toml whole inside the first check_release_build.CAP_BYTES bytes of AGENTS.md, recomputing the spans with gen_first_pin_demo.measure (AGENTS.md must be byte-identical to a fresh composition first, offsets are absolute UTF-8 bytes, and the cap is read from the consumer at call time), and fails closed (exit 2) on an absent, unreadable, symlinked, non-UTF-8, malformed or empty list, a listed id with no measured span, or a prefix it cannot measure. Within that surface a listed rule ending past the cap is always caught. It does not catch a rule removed from the list itself, which only review can judge; it does not judge a listed rule's content, so a rule cut down to a stub still passes; it measures the repository file against the configured cap, not any platform's actual truncation behaviour or an instruction budget other files may share; and it assumes the checked-out AGENTS.md keeps the LF line endings .gitattributes pins, so a client that rewrites them to CRLF inflates what a reader there receives unseen."

[[gate]]
id = "brief-capability"
script = "tools/check_brief_capability.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "It reads one brief, the text sent to one worker family, and refuses it (exit 1) only on a structural execution request when the family's row in .aiqt/core/worker-capabilities.toml says it cannot execute: an executable fence, tagged as a shell or console session, tagged python over a run prompt, or untagged or plain text whose first line is `$ ` or a listed command (S1, reported as INFO when the sentence just before it says it is not to be run and names no exception); or a command line (git with any number of global options and a git subcommand, python with any number of options and a .py path, -c or -m, a .py or .sh path with a flag, ./x.sh, bash -c, pytest with an argument, or a code span opening with make, tox, npm, cargo, go, uv, pip or docker and an argument) in a numbered item (S2) or outside the numbered items (S3, which catches a preamble telling the family to read through git show). A command line is INFO only in two closed shapes, each a whole sentence with nothing after the command line but the stop: a prohibition (Do not run <command line>. or Never run <command line>.) or a past report (CI failed on, The check failed on or The job failed on <command line>.), where the command line is one code span or a prose command line followed only by argument tokens, read by splitting the tail on whitespace once with no regular expression. Another sentence of the same void group (the top-level numbered item with its lazy continuation lines, nested list items whatever their numbers, indented paragraphs, indented headings at any level and fence contents; outside the numbered items, the same section up to the next unindented heading or numbered item) that holds a listed request word (confirm, check, verify, see, try, retry, report, show, run, rerun, perform, do, paste and the like, or test or fix at a clause start), ends as a question, or has an R1, R5, R6 or R7 hit voids the demotion, and the command line is HARD. Quoted source text is not a data context: Quote the README command `make test` and Quote the scope_rows entry for FOO=1 ./x.sh with its expected exit refuse, an accepted false positive; the REFUSE line for a command line (S2 or S3) tells the sender how to rewrite: name the function, row or entry instead of embedding the command (quote the def line of X, not the line that runs git push). The prose rules (R1 execution verbs at a clause start, R5 requests for results, R6 test-outcome questions, R7 git-only facts) are ADVISORY: they print their hits and never refuse. Format characters such as a byte order mark are removed first, every list item starts its own clause, and linearity rests on two kinds of evidence, not on a proof: a self-test audit that covers the module-level compiled patterns and COMMAND_FORMS, never listed by hand, and fails on any construct in them it cannot read (without claiming completeness it also reads container and class-attribute globals and the literal re calls of the production source, and fails on a re call or use there that it cannot read), and fails on two quantifiers over overlapping classes that can share one run (\\s*,?\\s+, \\s*\\s+, \\w+\\w*), a repeated group whose quantifiers overlap or whose body can match empty, an unbounded repeat that is not possessive over a body holding an alternation or a quantifier ((?:a|ab)*c), or a construct it does not read, unless an exemption records a proof (none is recorded), each guard pinned by its own canary and flip; and 24 repeated shapes timed at 1 MiB against 128 KiB in a child capped by RLIMIT_AS that must exit 0, three of them a failing argument tail that the previous revision did not finish within 60 s. The audit does not flag a failed match retried at every offset by a search, a bounded repeat, two adjacent repeats of multi-character groups that can match the same text ((?:ab)*(?:ab)*$), or work outside the regular expressions, compares classes over a character sample, and does not see a pattern held as a dict key or in an object it does not enter, a module-level name compiled twice (only its last value), or re reached by reflection (re.__dict__, getattr on anything but re, re's private modules, __import__, importlib); scans are one pass per sentence over positions found once, option and markup runs are walked once and remembered, an argument tail is split once and its tokens classified by a plain predicate, and a shape is evidence only for the text it repeats. The two whitespace-run shapes were added when an earlier revision did not finish 128 KiB within a 60 s timeout (measured to 60 s, not to completion); ten older shapes were added when an earlier revision exceeded the bound, also measured only to 60 s. It exits 2 on a missing, non-regular, oversized, non-UTF-8, or blank brief, a backwards item range, an unknown family, or a malformed table (format-version must be the integer 1). ENFORCEABILITY (class c, partial): a request with no fence and no command line never refuses (run the self-test and report its exit code is ADVISORY only); a command outside the listed forms (a git alias, a capitalised Git, an unlisted value-taking option), a shell command in a fence tagged with another language and no run prompt, and an unlisted command in an indented code block do not refuse (a listed command line in an indented block is read as prose and refuses); a closed shape stays INFO when the request after it is in another numbered item or section, in a lead-in before the list, or in an unindented paragraph or bullet after the item ends, or uses no listed request word, no question and no advisory hit (test and fix void only at a clause start); and a prose mention of a git subcommand outside the two closed shapes (the git log shows the fix), any command line in quoted source text, a closed shape with any other wording or anything after the command line, a closed shape whose item also holds a listed request word, and a shell-tagged fence shown as an example refuse. Scope is lexical: only a line-start `<family> leg:` marker, a `## <family> leg` heading, or a tail marker at the start or end of a numbered item's line assigns text to another family (a marker in a code span, in quotes, or mid-line assigns nothing); such a marker hides the rest of its paragraph up to the next marker or a sentence that addresses another family or every leg, a family addressed without the leg marker is linted as the linted family, and item numbers are matched across every numbered list in the brief. The repository holds no brief, so CI runs only the self-test; the lint blocks only where the sender runs it on the final bytes it sends and withholds a brief on exit 1 or 2. Its linkage to a single corpus rule is arguable, so none is claimed here."

[[gate]]
id = "release-cut"
script = "tools/check_release_cut.py"
rules = ["actbef"]
platform = "ci"
default = "block"
class = "c"
residue = "Checks declared root-changelog release transitions, evaluating HEAD, index and working-file snapshots separately. For pull_request events or when GITHUB_BASE_REF is set, requires that variable to name a resolvable origin tracking branch and a merge HEAD whose raw first parent equals that tracking tip; comparison uses that first parent with object substitution disabled. Missing bindings, non-merge HEADs and mismatched tips fail closed (exit 2). In GitHub Actions only pull_request and push events are supported; push requires --protected equal to refs/remotes/origin/GITHUB_REF_NAME (origin/BRANCH is normalized) and --base equal to the workflow-supplied PUSH_BEFORE value, with the event naming a branch and HEAD equal to its protected tracking tip. The full before OID must precede HEAD on its raw first-parent chain; every transition in that range is evaluated separately, including its declaration. Empty ranges and non-first-parent bases fail closed. An all-zero before is accepted only for a proven root HEAD; new branches with pre-existing history are refused. Every local path requires --protected (a full ref or origin/BRANCH) to resolve to the same commit as origin/HEAD's target, and omitting it selects that target; a local --base must equal the unique merge base of HEAD and that protected tip and then enables the same first-parent range check. A merge base equal to HEAD with a different target is refused; without --base the local tip path checks only the last first-parent transition, and a local --base at the tip is an empty range that fails closed; local runs off the tip without --base, and PR runs, compare endpoints only, so intermediate commits between the base and HEAD are not evaluated. Explicit refs must pass check-ref-format and resolve; origin/HEAD itself is refused as ambiguous. PR runs reject both overrides. Full event-payload authentication, the authority of the workflow environment and of local origin/HEAD configuration, and remote freshness remain outside coverage. Execution-report emission and tools/selftest_checks.toml registration remain deferred; wrapper coverage is not claimed. A matching declaration is author-controlled and does not prove authorization, readiness or semantic release scope. Other version sources, intermediate transitions inside a squash, atomicity of intermediate commits and freshness of unfetched remote refs remain outside coverage. Snapshots are sampled separately, so callers must exclude concurrent writers. Committed and index reads bypass checkout filters; transformed working files can cause refusal. Input-path submodules and symlinks are refused rather than traversed. Safe working-file traversal requires POSIX descriptor-relative no-follow operations. An optional .aiqt/pending-fixes.toml record is sampled the same way and refuses the cut (exit 1) while any item it lists is open, naming each open item; a cut that removes a record still listing open items is refused the same way (exit 1), naming them. A present record that is malformed or a symlink fails closed (exit 2) on every transition, so a malformed base record also blocks the very change that repairs it; the record's release binding is checked only on a cut, where a record bound to another release fails closed (exit 2), and a change that cuts nothing does not read the binding at all. Each id, rationale and target must hold a non-whitespace character; a blank or whitespace-only value fails closed (exit 2). The list is hand-kept and author-controlled, so it shows currency for the items it names, never completeness of what is wrong; when neither snapshot holds a record there is no pending-fix check at all, editing an item to done passes, and a deferred item passes on its recorded rationale and target, whose adequacy is not judged; apart from open items in a record the cut removes and a base record that cannot be parsed, the base record's contents do not affect the verdict. This repository holds no pending-fixes record today, so the pending-fix refusal can fire only after one is committed. Enforcement depends on trusted executable provenance, gate code, repository configuration and protected-branch review."

[[gate]]
id = "version-monotonicity"
script = "tools/check_version_monotonicity.py"
rules = []
platform = "ci"
default = "block"
class = "a"
residue = "It checks the append-only monotonicity of the pack's version history across a change: the changelog release sequence never moves backward and is prefix-preserved, the dormant tag layer arms with the first tagged release, and the release-order record and the id-history register are each an exact full-row prefix of their prior state, so no shipped release row, tag, or identifier row is rewritten, reordered, or removed. The id-history layer carries one disclosed, self-expiring exception: before the first recorded release (the release-order record present with zero rows at base and at head), and only against a base changelog that already records a tagged release (which keeps the changelog append-only in every later gated transition, so the version cut here stays recorded and the relabel cannot recur), every [[born]] row may change its born-release once, all moving from one shared never-released version (recorded as no base or head changelog release or tag version) to the version being cut (the newly appended head changelog version, strictly above the base latest), accompanied by a present release-cut declaration that the release-cut gate's transition evaluator accepts for this exact base-to-head changelog transition (the declaration is a required matching input and author-controlled intent, not proof of authorization, readiness or review), with the id, every other field, every other row, and the tombstone and successor sections unchanged, and with no [[born]] row, an appended one included, carrying the never-released version at head; every condition is read from the single-source files, never from git tags, a condition that cannot be read fails closed, and the exception ends permanently once releases.toml records a row. The gate reads each working-tree input it accesses (the changelog, the release-order record, the id-history register and, only when it evaluates an otherwise eligible relabel, the release-cut declaration) at most once, through the release-cut gate's own reader, and later checks use the captured bytes. Its self-test checks this within the gate's own process: it records each read through that reader and requires exactly one per input; it takes each input's device and inode before the run and, for the whole run outside that reader, wraps exactly six calls (the built-in open, io.open, os.open, os.stat, os.lstat and os.access; Path reads go through io.open and Path existence checks through os.stat) and records each call made through one of them on those files, before or after the input's capture, whatever the call returns or raises; as soon as an input is captured it overwrites the file in place with bytes no parser accepts and records a change of the file's identity at that point, and it requires no recorded call and the same output as an unwatched run. The check covers only calls made through those six wrapped names on those identities; any other route to an input is outside it, for example an access from another process, through io.FileIO, _io.open, os.scandir, os.listdir or the posix module's functions directly, through a function bound before the self-test wraps it, through a descriptor opened before the run, or to a file put in an input's place after its capture. That reader refuses a symlink at any path component and a final component that is not a regular file (a FIFO is refused before any read). An accessed input that the reader refuses, that cannot be read, or whose read runs out of memory fails closed, and a refused input is never followed; an input the gate does not access is never read or refused. It does not judge whether a version bump is semantically justified (the release-delta gate owns the required-bump computation), and its linkage to a single corpus rule is arguable, so none is claimed here."

[[gate]]
id = "release-delta"
script = "tools/check_release_delta.py"
rules = []
platform = "ci"
default = "block"
class = "a"
residue = "It computes the minimum required SemVer bump from machine-readable deltas over the whole governance surface (clause canonical text, the full pack-owned path keyset, ownership classes with the absolute-minimum cap, the declared order record, and the renderer/generator declaration) and fails a claimed bump below it, forcing a public disposition row for every dispositioned change. It forces the disposition row mechanically but cannot judge whether the human classification a row records is correct; the profiles/groups leg is dormant until the adopter-experience artifact ships; dispositions are trusted as authored once schema-valid; and it runs in genesis mode (no delta computed) until the first anchored release exists."

[[gate]]
id = "release-build"
script = "tools/check_release_build.py"
rules = []
platform = "ci"
default = "block"
class = "a"
residue = "It validates the release build order, the annotated release tags and their resolution to the recorded object and commit SHAs, the genesis uniqueness declaration, the release-order ordering gate, and the attestation chronology against the tagger date. The chronology layer is keyless ordering evidence within the anchored history, not cryptographic proof; the QA-store retrieval, success, and family-set layers run maintainer-side only (the private store is unreachable from CI, which validates the anchored chain instead); and every tag- and row-dependent layer is dormant only while the repository carries zero release tags AND zero attestation rows, arming when the first release tag or row exists, with a lightweight release tag disallowed."

[[gate]]
id = "clauses"
script = "tools/check_clauses.py"
rules = []
platform = "ci"
default = "block"
class = "a"
residue = "It checks the frozen clause inventory: every rule corpus-id has a clause row, each clause-id follows the corpus-id.ordinal scheme with an ordinal strictly above the cumulative maximum ever used for that corpus-id, each clause canonical text is a unique byte-exact substring within its source line window with a matching whole-file digest, no tombstoned or retired id is resurrected, and every sentence or clause of every corpus rule body (the rule sources under .aiqt/core/rules/; the body is the text after the frontmatter and after the first-line title heading, which is never checked, so an obligation written only as the title passes) lies inside a clause row's canonical text or is named, with a reason, in .aiqt/core/clause-exemptions.toml, a required file whose absence, or a missing exempt key, is a cannot-evaluate. Coverage is positional, not semantic: a row covers a sentence whatever obligation it names, and a reviewer, not the gate, judges an exemption's reason. Its linkage to a single corpus rule is arguable, so none is claimed here."

[[gate]]
id = "placement"
script = "tools/check_rule_placement.py"
rules = []
platform = "ci"
default = "block"
class = "a"
residue = "It checks that every rule source sits at its taxonomy-derived path. Its linkage to a single corpus rule is arguable, so none is claimed here."

[[gate]]
id = "applies"
script = "tools/check_applies.py"
rules = []
platform = "ci"
default = "block"
class = "a"
residue = "It enforces applicability coverage BIDIRECTIONALLY against the live corpus: every rule corpus-id has exactly one .aiqt/core/applies.toml assignment (no untagged rule), no assignment names a corpus-id absent from the corpus (no orphan), and every assignment is a non-empty list of distinct conditions drawn from .aiqt/core/applicability.toml (a rule tagged always must list ONLY always, the floor-subsumption invariant); a missing or malformed vocabulary or assignment file, or an unreadable/empty corpus, fails closed. It validates that a tag is PRESENT and drawn from the controlled vocabulary, not that the chosen conditions are the semantically correct set for the rule (a valid-but-wrong condition still passes); semantic correctness rests on the tri-family authoring review, not this gate. Its linkage to a single corpus rule is arguable, so none is claimed here."

[[gate]]
id = "mappings"
script = "tools/check_mappings.py"
rules = []
platform = "ci"
default = "block"
class = "a"
residue = "It validates every standards-mapping id against its pinned framework manifest. Its linkage to a single corpus rule is arguable, so none is claimed here."

[[gate]]
id = "cited-standards"
script = "tools/check_cited_standards.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "It discovers numbered standard designators in the spellings its grammar lists (ISO joined by a slash, a dash or whitespace to any of IEC, IEEE, a deliverable type TR, TS or PAS, or a project-stage abbreviation AWI, WD, CD, DIS, FDIS, DTR or DTS; NIST SP or NIST Special Publication with a number; SP or Special Publication with an n-n number; NIST 800-n; NIST AI; NIST IR or NISTIR; FIPS, NIST FIPS or FIPS PUB; RFC; each followed by its number, with NIST joined to its series and FIPS to PUB by whitespace, a dash or a dot, a body joined to its number by whitespace, a dash, a dot or nothing, and a joining dash or dot allowed to end a line) in its corpus and fails on one that resolves to no manifest and no recorded exclusion. Its built-in default corpus, the one it applies without --config, is the rule files alone; this repository's CI and tools/run_all_checks.sh pass --config .aiqt/cited-standards.toml (tracked, not shipped, so the shipped runner's gate exits 2 in a tree without it), whose corpus is the rule files plus the OPF prompt-pack Markdown members (opf/prompt-pack/**/*.md), with no exclusion recorded; the repository-only .github/check_cited_standards_contract.py (not shipped either: in a tree without it its two contract gate lines, the live run and its self-test, exit 2 and the shipped runner ends RESULT: FAIL) fails when that corpus stops naming the rule files or covering a member opf/prompt-pack/pack.toml lists (the pack manifest is validated by its owning validator, opf/tools/check_opf_prompt_pack.py, imported and never re-implemented), or when either runner's gate line, other than the exact self-test line, is not exactly tools/check_cited_standards.py --config .aiqt/cited-standards.toml with nothing added, so an appended --root or any other extra argument is a finding even when both runners carry the same drifted line. The gate's own self-test vectors carry their own corpus and do not read that config or either runner. A designator run on into lett