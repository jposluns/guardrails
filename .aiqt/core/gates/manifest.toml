class = "c"
residue = "Checks that the repository-local source .aiqt/python-host.toml parses and names one exact CPython patch release (MAJOR.MINOR.PATCH, at most four digits in each component); that .github/workflows/quality.yml carries no top-level key but name, on, permissions, concurrency and jobs (a top-level defaults: or env: changes how every run step of every job executes, so it is a finding), and a concurrency: block only as the pinned block (another group or cancel-in-progress can cancel a push-to-main run); that each host-patch job in it (opf-host-patch, git-fixture-env-core-host-patch, git-fixture-env-config-combined-host-patch, git-fixture-env-config-malformed-host-patch and git-fixture-env-config-system-host-patch) is whole: it carries no key but name, runs-on and steps, and the one pinned heavy-job if: line exactly as written (so any other job-level if:, a continue-on-error:, env:, defaults: or container: is a finding), runs on ubuntu-24.04, starts with its checkout step as written (actions/checkout@v4 with only fetch-depth: 0 and fetch-tags: true, so a ref:, repository: or path: input or a second checkout step is a finding), carries env: on none of its steps (a step env: such as BASH_ENV changes what an otherwise accepted run: command does and can write to GITHUB_PATH or GITHUB_ENV, so env: on any step is a finding), has exactly one setup-python step whose with: holds only a python-version pin equal to the source (the job's only python-version line; a job-level env: never counts), runs this gate as the step right after it, and runs exactly its suites as later steps, in order, none omitted, repeated or added (the OPF tooling self-test, or the one git-fixture-env suite of the job's lane, core, config-combined, config-malformed or config-system, so the four suites run as four parallel jobs), a step counting as a suite step when its run: is one of those suites or one of its tokens has a suite runner's file name as its normpath base name; the gate step and each suite