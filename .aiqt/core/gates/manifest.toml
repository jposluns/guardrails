residue = "It runs the OPF source-only init gate (opf/tools/check_opf_init.py): both the default entry and --self-test run the SAME fixture suite, and there is no live-adopter mutation leg and no root option, so unlike the doctor and drift gates it carries no NOT APPLICABLE path over this repository and its whole assurance rides the fixture suite. The suite drives opf init through the isolated dispatcher (python3 -I -B opf/tools/opf.py) over fresh git fixtures created beneath a throwaway temporary directory whose parent is first CONFIRMED to be a non-git location, and asserts each vector with an exact exit code and a full byte snapshot of the fixture tree (files, hidden entries, symlinks, and empty directories): the parser refusals (an unrecognized argument, a bare --root, an empty --root value, --root swallowing the next flag, a repeated --root, and a repeated --recover) each fail closed to 2 while the parser fixture is preserved byte for byte; an empty git root succeeds 0 and creates .working sources that re-parse and validate through the OPF helpers' own loaders (a valid manifest, counters at zero over the baseline namespaces, a valid version and worklog, every per-type index empty, and the pointer resolving to dir:.), emits a source-only completion report that enumerates the created paths and states the sources are NOT yet git-tracked, writes nothing under .git but the operation-lock home (the init mutex's anchor, with no active record left), writes no root VERSION, and leaves a heading-only CHANGELOG; a second init over an initialized root names the existing pointer and refuses 2 while preserving source and git bytes; foreign .working content (a hidden file, nested empty directories, and a symlink to an outside victim) is refused 2 with a complete surfaced inventory and the tree and link target preserved; a non-git root and a bare repository are each refused 2 at the git preflight and left untouched; a malformed committed pointer and a malformed local pointer are each refused 2 naming the pointer and preserved; an empty partial .working store is refused 2 (store resolution refused) and preserved; a pre-existing root CHANGELOG.md (a plain file, one holding a ## entry heading, a symlink to an outside file, and a dangling symlink) and a pre-existing root VERSION (a plain file and a dangling symlink) are each refused 2 at preflight naming the file and opf adopt, with the fixture tree preserved byte for byte and no symlink followed; a held init mutex refuses 2 at its acquisition with the fixture tree and the lock's .git control area preserved; the spec 5.7 lease and its active record are present at every source create and gone after success, with the anchor free again; a VERSION, CHANGELOG.md, planned destination or local pointer landing between the preflight and the mutex, a destination turning git-tracked or git-ignored in that window, or a prior store committed there, is refused under the mutex in the preflight's words, with nothing published and nothing held; a create failing mid-publication leaves no lease, no active record and a free anchor; a release failure while a refusal unwinds is reported beside that refusal, and a failed final release exits 2; a dead run's leftover active record refuses 2 until --recover clears it, and --recover refuses a live holder's record, which is preserved; and a symlinked root is refused 2 at preflight with the link target preserved. It arguably serves the change-carries-a-check discipline, but the linkage to a single corpus rule is not undeniable, so none is claimed here. Class c: coverage is representative, so it asserts these fixture scenarios with exact exit-code and byte-snapshot matches, not the init verb's whole input space, and the mid-init races and failures it exercises are driven in-process by injected stand-ins (a planted file, a driven create or release failure), never by a real concurrent writer or an induced kernel-level permission or I/O fault; missing git, unusable temporary storage, or any harness failure fails closed to 2 rather than a clean skip; and it runs over synthetic isolated fixtures rather than a live adopter product repository."

[[gate]]
id = "opf-init-contract"
script = "opf/tools/_opf_init_contract.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "It runs the OPF init Keep-acceptance CONTRACT validator (opf/tools/_opf_init_contract.py) via its --self-test: the module is the pure, closed-schema validator for the D2b --decisions Keep-only adoption model, performing no filesystem, subprocess, clock, random, or network access and taking no filename, path-to-inspect, already-locked, or approved input, so a parser result is never a capability. The self-test drives validate_keep over in-memory acceptance bytes and synthetic observation contexts and asserts an enumerated matrix: three positive cases (an empty-decision store, a single foreign-file Keep, and a directory-group covering a tree) return VALID, and twenty-four negative or fail-closed cases each return the expected INVALID or CANNOT-EVALUATE (duplicate keys, extra or missing root keys, a bad schema or operation, a boolean-as-integer, a float, a nesting-limit evasion, invalid UTF-8, a backslash or absolute or dot-dot or not-below-.working path, a decision-order violation, a reserved view or machine-store path, a ghost decision, an uncovered foreign file, binding and inventory-digest and head mismatches as CANNOT-EVALUATE, and a duplicate observed-inventory path as CANNOT-EVALUATE). Its frozen constants (ACTOR_KINDS, the reserved managed set, the canonical-JSON and digest rules, the v1 limits) mirror _opf_schema.py, _opf_store.py, _opf_check.py, and _opf_init.py at authoring time; the sibling check_opf_init_contract gate re-verifies that alignment against source. It arguably serves the change-carries-a-check and check-fails-closed-on-unreadable disciplines, but the linkage to a single corpus rule is not undeniable, so none is claimed here. Class c: coverage is representative, so it asserts these enumerated cases rather than the acceptance grammar's whole input space; it validates a supplied observation context by equality and does not itself perform the observation (PR3 establishes it), it does not exercise the operation-layer application (PR4 through PR7) or physical filesystem behaviour, and any harness failure fails closed to a non-zero exit rather than a clean skip."

[[gate]]
id = "opf-homes"
