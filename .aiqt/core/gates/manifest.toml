es with json.dumps never run, red on any undercount; the never-serialized vectors, a two-byte UTF-8 candidate among them, turn red on a lower-bound revert; a candidate longer than the registration bound refuses at the entry gate before any scan; the merged-output bound refusal's own message is pinned exactly, red if its handler is disabled or reordered; the wide-and-deep discriminator is DETERMINISTIC, counting the emission bytes actually built through _emit_piece, at most the budget plus 4096 bytes of slack, so its verdict depends on neither interpreter build nor allocator nor ambient tracemalloc state, and a build-then-length-check revert turns exactly it red); bounded diagnostics (every finding bounds what it repeats through _shown, which bounds an exact str or _Number on the VALUE at every length, a long one truncated on the value before repr and reporting the value's own length, a short one returned whole with its repr never cut, so no cut splits an escape sequence and no genuine value is counted in repr characters, while an exact float shows its repr and true, false and null show their JSON spelling (a few dozen characters at most), and a code-built _Number that is not a grammatical number lexeme, an int, a table, an array or any foreign type is never formatted and gets a fixed descriptor instead (int-to-text conversion raises past the interpreter's digit limit and a deep container's repr exhausts the stack, the second reachable from exact bytes nested in the entry type field), and any formatting failure returns a fixed placeholder, so no finding path raises and validate_registration_model never raises on a model its gate admits; vectors pin the descriptors (two code-built _Number values carrying a quote and control characters among them, one ending in a grammatical tail so an unanchored-match regression turns red, on the validator and emitter paths), the JSON spelling of a parsed true in a finding, the bare lexeme in the out-of-range number finding, the place