residue = "It runs the OPF init D1 bootstrap builders (opf/tools/_opf_init.py) via its --self-test: the pure, canonical builders of a clean store's manifest, counters, version, worklog, and empty indexes, each emitted through the checked TOML encoder, reparsed, and validated, with independent byte-pinned fixtures for the zero-seeded counters and the empty ledgers and indexes. It also covers the B6 SEEDED counters path the coupled init consumes (OPF-D2B PR3a, PD-D2B-PR3-SCHEMA decision 6): an ancestral seed is copied without mutation into the full namespace roster, and a seed missing ANY roster namespace, baseline or importer, refuses (a missing historical value is unknown, never zero), as do a bool, negative, past-64-bit, or out-of-roster value. Class c: the builders are pure, so the coverage is the enumerated document shapes and seed defects; the SELECTION of an ancestral snapshot is the init operation layer's and PR4's, not this gate's; and any harness failure fails closed to a non-zero exit."

[[gate]]
id = "opf-init-operation"
script = "opf/tools/_opf_init_operation.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "It runs the OPF coupled-init operation layer, slices PR3a and PR3b (opf/tools/_opf_init_operation.py), via its --self-test: the library milestone VIEWS-READY, never coupled-init success (no CLI verb, no git index write; the initial views are rendered through the existing read-only planner and remain unstaged). The pure legs cover the bootstrap provenance (opf.init.bootstrap/v1 TOML through the checked encoder, its source digest over the sorted path and content-digest roster EXCLUDING init.toml, forged and stale provenance rejected), the immutable plan (its self-excluding plan digest, canonical bytes, and a deep validator that refuses a changed init generator or spec version, requires the live view-generator pin for resume/render but accepts a well-formed recorded view identity for completed health, and refuses a tampered payload, digest, mode, staging name, order, roster, set, or plan digest, a view roster that is dropped, reordered, restaged, remoded, re-sourced, or carries the root VERSION, and a binding or HEAD that differs from the live re-observation), and the B6 pinned ancestral counters reader over real git stores (the evidence must lie on the pinned HEAD's first-parent line, so a merged second-parent commit refuses; a missing namespace is unknown and refuses the plan; a nonzero module-tier high-water refuses; malformed, oversized, missing, absent, shallow, replaced, and re-prefixed evidence refuses). The physical legs drive the REAL operation in fresh child interpreters over real git repositories on the filesystem TMPDIR names: a fresh bootstrap under two umasks with exact 0644 and 0755 modes, the index untouched, the store resolving VALID, init.toml a C-CONTAINMENT leaf, the initial views byte-equal to the renderer planner's output with headers binding the plan's source bytes (an independent digest fixture), C-VIEW-DRIFT passing, every view untracked, and no root VERSION; a completed rerun, with and without legitimate later edits or a view identity bump (name, version, transform vocabulary, projection schema), that changes nothing; an empty view roster with an unrelated tracked README that initializes without an empty-pathspec index query; a preserved existing CHANGELOG.md; the coupled-adoption seam (an admitted, plan-enumerated .working inventory accepted EXACTLY: each file's mode, size and digest re-verified under the operation mutex, preserved byte-exact through the whole publication, recorded in the immutable plan's E set and re-verified by every later check and resume, while one byte of drift, an extra or a missing file, and an admitted path at a machine-home or planned destination each refuse with nothing written, and the PLAIN default is pinned UNWEAKENED: any existing .working, however populated, still refuses a fresh init exactly as before); resume BINDINGS (a partial operation resumes only under the SAME adoption kind, ancestral evidence commit, admitted inventory and, when the caller names one, operation id: a seeded partial refuses a first-adoption or differently-pinned resume, an unseeded partial refuses a re-adoption resume, and a matching resume completes, each refusal leaving the tree and the recorded history unchanged); a SIGKILL at every registered boundary (journal intents and completions, the directory group, the lease attach and detach, individual sources, the source-state milestone, the views journal intent and completion, individual views, before and after a source or view publication link, and after completion) followed by a fresh-process retry that resumes the SAME operation and plan, recreates nothing already present, and reports attempt-local created versus verified paths; destinations planted on resume (wrong bytes, a strict prefix, a wrong mode, a symlink, a dangling link, a hard link, a FIFO, a directory) refused and preserved with nothing else changed; fresh-adoption refusals (an identical colliding destination, foreign .working content, a tracked-but-deleted path, a local pointer, a non-repository, a bare repository, a symlinked root, a contended mutex); a nested product prefix initializing with its substrate under the enclosing repository's keyed control home (the lock module's shared control-root resolution) and a linked worktree initializing under the main common git dir; journal safety (a torn tail truncated and resumed, a rollback frame refused, no rollback path ever invoked, an injected fsync failure preserved and resumed, a milestone the journal contradicts refused); a kill during plan publication leaving no worktree write; a moved HEAD refusing the resume; a replaced destination refusing classification; an end-to-end re-adoption seeding WL so the next allocation follows the ancestral high-water without re-reading history on retry; and view refusals, each preserving the worktree and index: a source swapped between its verification and the render (source/view correspondence), a source changed after the source-state milestone, a changed view generator (the SAME operation resuming once it is restored), a renderer changed after the views intent, a staged view (present, or staged and deleted), a divergent view planted between view creations, an exact-bytes view or foreign single-link staging file planted before the views intent (first refusal and plain retry both leave no intent and preserve the foreign inode and bytes, while an exact view after the intent is a dedupe), directory and source destination/staging collisions before their group intent that also refuse repeated retries without recording intent, a foreign .working entry before the source-state milestone, and a planner yielding the root VERSION. Class c: coverage is the enumerated scenarios over synthetic repositories, not the space of kernel interleavings; process-kill tests establish process-crash behaviour only, so POWER-LOSS durability is not verified; the harness does not identify or select a filesystem type, so tmpfs, btrfs, ext4, and macOS coverage remains unverified without separately identified runs; the adoption observer (PR4), git staging (PR5), Keep adoption (PR6), and activation (PR7) are out of scope; a renderer change that keeps the pinned view-generator identity and lands before the views intent is indistinguishable from the pinned generator; rendered views intentionally share the 1 MiB MAX_SOURCE_BYTES ceiling, so an aggregate view can refuse although each source fits; completed-adoption health excludes C-VIEW-DRIFT and does not require current views, so deleted, edited, or staged views alone do not prevent ALREADY-INITIALIZED, which neither repairs views nor certifies their currency; COMPLETE frames record poststates without per-path outcomes, so a resumed COMPLETE group reports directories, sources, and views as deduplicated/verified-identical even if an earlier attempt created them (attempt-local verification, not cumulative creation accounting); everything the composed lock and substrate gates disclose applies unchanged; and any harness failure fails closed to a non-zero exit."

[[gate]]
id = "opf-init-observe"
script = "opf/tools/check_opf_init_observe.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "It runs representative in-memory raw Git object fixtures and bounded subprocess-capture tests via opf/tools/check_opf_init_observe.py; --self-test --red-on-revert also requires each declared reversal to reach its named assertion and the restored source to pass. Coverage includes all-parent presence, first-parent seed membership, absent evidence resolution, exact object identity, tree framing, selected resource limits, and shared Git launcher policy. Class c: these fixtures do not exercise the full production Git adapter, real repository history, filesystem or graft races, or the full input space. They do not establish adoption qualification, select authoritative adoption evidence, or authorize initialization; production admission and filesystem/operation fixture families remain separate obligations. History observations cannot recover rewritten-away history, undisclosed product moves, unmerged refs, or other product prefixes. Reversal reports bind to measured source content digests, not to a reviewed Git revision."

[[gate]]
id = "opf-init-p0"
script = "opf/tools/check_opf_init_p0.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "It runs the OPF coupled-init P0 ratified-contracts validation self-test (opf/tools/check_opf_init_p0.py): both the default entry and --self-test run the SAME in-memory contract vectors over retained fixtures, with no store or Git effects; runner fixtures use private scratch. The D2a source-only builders' bytes are captured in memory before any P0 guard is exercised, and every case re-verifies the WHOLE fixture body (each file's bytes, not a success marker or merely a path) is byte-unchanged after the call. The suite asserts 66 vector cases with exact status and single-finding codes: plan, outcome, and result version admission through EXACT-EQUALITY version gates (an unknown or older opf.init.plan or opf.init.outcome format, a non-string schema, and each pinned spec_version, generator, provenance_format, and views_generator version each refused, with a recorded historical views-generator accepted only for completed health and refused mid-flight); set membership over the closed {S,V,K,E,C} roster with cross-set disjointness (OVERLAP) and unclassified-entry detection resolved against the AUTHORITATIVE roster and inventory rather than the plan's own declared sets (a foreign S or V path, an added K, a dropped or emptied C or E, and a reordered S each refused), plus the malformed-shape refusals (a changed source mode, a hidden staging key, an injected payload, an extra E field, and a spurious integration_set or recovery_policy key); the coupled-versus-source-only RESULT contract (a coupled InitResult admits only a known status while a bare int refuses, and a source-only result admits only the permitted 0 or 2 exit code while an InitResult refuses, with a missing or wrong status refused); compatibility (a D2a manifest accepted with provenance OPTIONAL, a malformed provenance blob refused, a manifest declaring an older spec_version refused with its whole refusal pinned (no store upgrade reaches spec_version 2.0.0, and the hand step moves the manifest aside before a first adoption), a declaration between 1.2.0 and 2.0.0 given the same hand step, a newer, a malformed and a missing spec_version and a missing [opf] table each refused with its own pinned refusal offering no hand step, and the SUPPORTED_HOMES=1 generation fence holding even where a resolver would activate generation 2); the F19 integration and staging boundary (staging_set fixed empty, publication boundaries pinned, and staged-membership admitting only an S-subset so a staged V, K, E, or C entry, a directory, an unclassified path, or a duplicate each refuses); and the input fail-closed cases (a missing input CANNOT-EVALUATE; an empty, non-object, duplicate-key, or truncated body REFUSED). --self-test --red-on-revert additionally applies 38 exact single-guard source reversions, each disabling one admission, refusal, or dispatch guard, and requires each to reach its OWN named assertion (any other exception is a harness failure, not an accepted RED); it also exercises the runner-registration leg by running the REAL standalone run_all_checks.sh dispatcher text with the other gate commands intercepted and this suite reduced to its non-recursive vector leg, requiring the declared assertion identities, exactly one logged own-call attempt with the exact expected argv, and propagation of injected exits 1, 2 and 7. Any logged argument containing this suite's script basename counts as an attempt, including embedded -c source; incidental mentions count conservatively too, while dynamically constructed names without that substring are not classified. The runner uses the caller working directory, with a repository-root conditional-skip RED; fixture files stay in private scratch. Ordinary caller environment variables are retained (with a CI-conditional skip RED); GIT_*, BASH_ENV, ENV, SHELLOPTS, BASHOPTS, PS4, BASH_FUNC_*, PYTHON* and LD_* controls are removed before PATH, HOME, XDG_*, TMPDIR, locale and fixture variables are pinned. The probe requires dirname on its fixture-plus-os.defpath PATH and executable /bin/sh, failing closed as cannot-evaluate/interception if absent. REDs cover removed registration, duplicate or malformed own argv, embedded calls with swallowed exits, and swallowed failures including wrappers tolerating exit 1 or 2. Every recorded Python invocation is reconciled with the on-disk run_gate roster, including sibling order and exact argv; missing, extra, reordered or re-argued calls fail /invocations. Intercepted siblings return zero, so their assertions and failure propagation remain outside coverage. An executable fixture records argv under a read-only PATH pin in the runner shell; the competing fixture must record no calls with the pin and the exact roster without it (removed-path-pin). Missing or malformed evidence fails. Absolute interpreter paths, command -p, hash -p and PATH replacement in a child process remain outside interception; invocation reconciliation detects skipped registered calls after execution, not before it. PD-SFS-THREAT-BOUND excludes runners written to defeat the check: output-recognising wrappers can swallow real SELF-TEST FAIL, PACK-MANIFEST FAIL or CANNOT diagnostics while propagating the injected exits, and bare alternate interpreter names such as python3.14 bypass interception; no mechanism is added for these. Recursion refusal retains the environment marker and also passes a private marker-file descriptor with pass_fds; both twins inspect inherited readable regular descriptors (read-only or read-write, never O_PATH) through /dev/fd before any launch, skipping non-readable descriptors, so a marker reachable only through a write-only or O_PATH descriptor is not recognized, and refusing as cannot-evaluate/recursion-marker when descriptor enumeration, a non-EBADF fstat, the flag query, or reading a readable candidate fails; inherited write-only and O_PATH regressions confirm a legitimate run is not refused. An env -i PATH=/usr/bin:/bin own-registration RED launching the interpreter under test uses a bounded child entry probe requiring cannot-evaluate/recursion and zero nested Popen attempts; the child does not assert which interpreter ran it, so a revert to a PATH-selected python3 is detected only where /usr/bin and /bin hold no python3 able to run the suite, and never where the interpreter under test is itself /usr/bin/python3. Deliberately closing inherited descriptors while scrubbing the environment is out of scope and can create nested sessions beyond timeout killpg containment. Untested exit statuses and environment combinations are not guaranteed; this is not a process sandbox. It arguably serves the change-carries-a-check and check-fails-closed-on-unreadable disciplines, but the linkage to a single corpus rule is not undeniable, so none is claimed here. Class c: coverage is representative, so it asserts these enumerated contract vectors and single-guard reversions over in-memory synthetic fixtures rather than the full input space, and it validates the P0 CONTRACTS only; the later OPF-INIT slices (P1 and beyond) are out of scope and remain separate obligations awaiting maintainer design review: target and control binding, the adoption classifier, coordination, Keep-apply, verb wiring, git staging, publication, finalization, the CLI verbs, and Migrate/Move; the contract fixtures drive no live adopter product repository, while runner fixtures create private scratch files; and any harness failure fails closed to a non-zero exit rather than a clean skip."

[[gate]]
