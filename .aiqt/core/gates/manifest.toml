residue = "It runs the OPF store-integrity gate (opf/tools/check_opf_doctor.py): the live leg runs opf doctor over the repository root and forwards the child's exit code UNMASKED (doctor's own 0/1/2 IS the verdict: 0 VALID, 1 INVALID, 2 CANNOT-EVALUATE), clamping any non-0/1/2 status (a signal death or an abnormal exit) to a cannot-evaluate 2. The root is not taken from ambient state: it is established by CONFIRMING the repository identity of the gate's own location through a local git probe (git --no-replace-objects -C ... rev-parse --show-toplevel over an allowlist-scrubbed environment that drops every ambient GIT_ variable, git resolved to an absolute path, and a bounded timeout), and a root that cannot be confirmed (git missing, a launch failure, a timeout, an invalid/garbage .git marker, or a toplevel that does not contain the gate) fails closed to 2 rather than a false NOT APPLICABLE. doctor resolves the store, gathers the caller-side git observations (_opf_observe.gather over a hardened git boundary: --no-replace-objects, an explicit -C binding to the store root, an allowlist-scrubbed environment that drops every ambient GIT_ variable, and a bounded per-call timeout, with any git failure or timeout failing SAFE to an omitted observation plus a note rather than a forged value), then runs the U6 validate_store integrity engine and forwards its verdict. A non-adopter root prints doctor's own NOT APPLICABLE and exits 0; the verb is read-only. The --self-test asserts that 0/1/2/0 contract end to end through opf.py over synthetic COMMITTED stores (a clean store built through the OPF helpers' own canonical emitters returns 0, a one-field mutation of an immutable record body against the committed prior returns 1, a broken store with an unparseable manifest returns 2, and a non-adopter root returns 0 NOT APPLICABLE), plus the located cannot-evaluate paths (a child-launch failure, no discoverable repository root, and an invalid .git marker each return 2). It arguably serves the change-carries-a-check discipline, but the linkage to a single corpus rule is not undeniable, so none is claimed here. Class c: this repository is not an OPFiles adopter, so the live leg reports NOT APPLICABLE and gates no real store integrity here, and its assurance rides the self-test over synthetic committed stores, which asserts representative 0/1/2 scenarios with exact exit-code matches, not the observe-and-validate engine's whole input space; it does not exercise behaviour against a live adopter product repository."

[[gate]]
id = "opf-init"
script = "opf/tools/check_opf_init.py"
