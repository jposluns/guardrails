so the rest of those files and additions to them stay unprotected. The default entry also runs a
section 2 keyword lint over every pin of those tiled sections and those untiled pins: a pin
without MUST, MUST NOT, SHOULD or MAY is red unless the registry marks it descriptive (_D, red
once a marked pin gains a keyword); the
self-test proves synthetic cases, flips every marker and every keyword pin red, and reverts
named QA5 rewrites red. The lint reads the registry marker, not the meaning, so a requirement
wrongly marked descriptive stays green, which review of registry changes catches. The
self-test also checks
constructors, discovery reservations and inert writer defaults, plus in-memory boundary fixtures:
legacy (homes 1) behaviour kept for every store until activation (grading, detect rows, messages,
report roster and residuals, and the legacy journal engine's apply and recovery), activation gated
on both homes 2 and spec_version 2.0.0 and, with homes 2 activated only for the fixture, classifier
and detect set equality, unmanaged collisions, staged-run grading, per-bundle evidence inventory
membership (no phase inventory substituting for inventory.toml), size and digest reconciliation,
