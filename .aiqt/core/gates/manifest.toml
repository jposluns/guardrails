residue = "It exercises the homes-1 adoption state reader (opf/tools/_opf_adopt_state.py --self-test, 134 checks) against OPF-SPEC sections 4.2, 11, 14.2 and 17, through the C-CONTAINMENT check the doctor runs. Over temporary product trees whose adoption bundles carry plans the real planner froze and approvals the real capture produced, a store without .working/imported/adoption costs one lstat and no bundle read and keeps its legacy findings and residuals exactly; an admitted run is registered at file level only, each path its committed inventories list, and its recorded Move destinations only once its retirement is recorded (a vector fails when they are registered before), and its frozen retire, move and migrate sources (the non-occupying rows of its plan) are reported as migration_incomplete rather than failed, at a clean start and under a substantiated partial alike. Admission is decided from the COMMITTED evidence alone, the bundle and the run archive that travel with every clone: a VALID, sealed inventory whose listed bundle, archive and Move-root rows each hold the live bytes at their recorded size and digest (a listed member that is absent or differs, and a Move-root row that no move row of the run's own plan records, refuse admission as findings), a plan re-proved as frozen plan/v2, a canonical approval binding it, a plan run id equal to the bundle name and a plan store identity equal to this in-repo store. The machine-local journal is NEVER read, pinned by recorded contained reads and by removal vectors (a clone without the journal grades identically, at contain() and through the real validate_store end to end), so admission is accident detection, not forgery resistance: the proof detects an interrupted apply, a non-canonical hand edit or one that changes listed bytes, and a misplaced or stale record, while a hand edit that re-emits a canonical, self-consistent record is forgery and is ADMITTED, outside the accident-detection model. The base inventory an apply-stage ApplyOps shell derives from its own create ops over the fixture's listed paths (the plan, the approval and the preserved archive copies; never a Move-root path) is byte-identical to the fixture's and admits unchanged. Every other path under the control area stays an unregistered finding: a stray beside the registered files in the bundle, the adoption archive or the Move root, another kind, a non-run name, and an unadmitted archive run alike, and in an adopting store a substantiated partial never downgrades an unenumerated path to triage (the triage posture is legacy-only). A drifted or vanished source is a finding that also stays reported as migration_incomplete (the approved source is unresolved); a symlinked or hard-linked one cannot be evaluated. A retirement counts only when a live, VALID, sealed retirement inventory holds the shape the retirement-phase transaction derives from its own create ops: one row per move row of the plan, occupying or not, whose move-file destination lies beneath .working/archive/moved/, naming that destination at the moved source's plan digest, and nothing else (the record of a plan without such a move row lists no files), each listed destination holding its recorded bytes live. Each retired fixture's record is the one a retirement-phase ApplyOps shell seals over its own creates of those destinations, which check_apply_ops accepts; this includes a plan the real planner froze with an occupying move (a view target, whose preservation names its adoption archive copy) and a non-occupying move, whose record lists both destinations, at the committed archive copy and at the frozen source bytes, and reads as retired, and a plan the real planner froze with an explicit destination beneath .working/archive/moved/ beside a default move, whose record lists both destinations and reads as retired, the explicit one registered at file level with a stray beside it still graded. A recorded retirement ends the bounded state of the retire and mo