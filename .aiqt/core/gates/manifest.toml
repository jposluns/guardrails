# --- undeniable secsec link -----------------------------------------------------------------------------

[[gate]]
id = "secrets-scan"
script = "tools/check_secrets.py"
rules = ["secsec"]
platform = "ci"
default = "block"
class = "c"
residue = "A pattern scanner for hardcoded credentials: it catches recognizable provider-token prefixes and assignments of a literal to a credential-named variable. It misses a high-entropy string with no telltale name or prefix, an encoded secret, and a secret in a binary (the measured residue of 2026-08-08, shared with gitleaks). Detection here is a compensating control, never a substitute for keeping the secret out of the repository in the first place."

