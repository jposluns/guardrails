[[gate]]
id = "opf-oplock"
script = "opf/tools/_opf_oplock.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "It runs the OPF operation-lock facility (opf/tools/_opf_oplock.py) via its --self-test: the module is the shared mutation-serialization primitive the coupled D2b operations will acquire, redesigned (OPF-D2B PR2) as a three-leg lock identity: a persistent POSIX advisory flock anchor (opf-oplock/mutex.lock, created once and never unlinked by release) under the AUTHORITATIVE common git directory (git rev-parse --git-common-dir with an explicit -C binding to the resolved store root over an allowlist-scrubbed environment that drops every ambient GIT_ variable, behind a three-way no-follow .git classification at the store root and, when it is genuinely absent there, at each ancestor nearest first (so that a lock is shared across the worktrees of one store: a store root that is its own repository anchors at its own common git dir once git's own --show-toplevel there names the store root itself by path and identity, and a store nested inside a repository anchors at that enclosing repository's common git dir once git's own --show-toplevel at the store root names the same directory by path and identity, in a home keyed by the store's path relative to that toplevel (validated against git's own --show-prefix) beneath that common git dir, so the same nested store in two worktrees shares one lock while distinct stores nested in one repository share no anchor, active record, or resume substrate, and a store nested inside a git submodule, whose common git dir is per superproject worktree, refuses): genuine absence everywhere roots the control tree at the store root, a real directory or regular gitdir file asks git, and anything else, a symlink, a FIFO, an unreadable entry, a failed or missing git on a git store, or a toplevel git names differently, refuses rather than falling back to the repository root or the store root); an exclusive O_CREAT|O_EXCL active.toml operation record beside the anchor that persists the FULL acquirer owner identity (pid, uid, nodename, canonical /proc start time, session, and stamp); and a mandatory spec 5.7 lease.toml in the RESOLVED machine store, with both control records emitted through the checked TOML encoder (emit_checked round-trip plus closed top-key equality), created only beneath dir_fd no-follow walked parents with O_NONBLOCK on every control open, written by the shared full-write loop, and fsynced (file and parent directory) before the capability returns, the capability retaining descriptors, device and inode identities, exact payload bytes, and the acquirer identity (pid plus canonical /proc start time); a control-record write that fails mid-way unlinks the just-created singly-linked file by verified identity before raising, so no torn record is stranded. Release is identity-bound: it refuses a caller that is not the recorded acquirer before any leg runs, re-checks the retained anchor and control-directory identities, runs the reverse-order legs with error collection so the active-record leg still runs when the lease leg fails, performs each removal as a verified unlink (re-open no-follow, type, link count exactly 1, identity, size, byte equality, and a final pre-unlink name-stat) that preserves any mismatched file, and unlocks the anchor last. A stale record under a free anchor refuses acquisition and is cleared only by explicit recovery (recover=True), which itself proceeds ONLY when the recorded holder is CONFIRMED DEAD on this host by the journal's possibly-live-never-seized liveness model (_journal.owner_confirmed_dead over the persisted owner identity); a possibly-live, cross-host, or malformed holder, or a stale lease with no paired active record, is refused rather than seized, so a live holder whose records are exposed under a split anchor (a fresh anchor minted by an out-of-band unlink or rename of the mutex) is never seized into a two-holder state, and a paired lease is cleared only when its holder matches the confirmed-dead active record; staleness is never inferred from age or timeout, and the link-count ceiling applies to regular files only, never directories. The --self-test builds real git init stores with committed adopted trees, pins the git fixtures and the module's own rev-parse hermetically (HOME, XDG_CONFIG_HOME, and the global/system git config bound into a per-run temp dir), and asserts the resolving-roster check T-named and the PR2 regression roster (T-c1 to T-c14 plus T-crit1, T-med6, T-low1) together with the round-3 recovery-liveness witnesses and LOW-item coverage: the linked-worktree common-dir witness with cross-checkout contention, a bogus gitdir pointer refusal with no repo-root fallback, poisoned ambient GIT_DIR inertness, the anchor symlink, hard-link, permission, and unlink-recreate vectors, a group/other-writable control-directory refusal, mandatory-lease and exact-byte fidelity including the persisted owner identity, two product roots companion-pointed at one store contending on one anchor, a double-quoted holder round-tripping intact, stale-refuse with a lone owner-less lease fail-closed even under recovery, a LIVE holder's records under a split anchor refusing recovery (never a second holder), a confirmed-dead reaped-child holder recovering and clearing its paired lease, a foreign-nodename holder refusing recovery (never seizing a remote), mismatch-preserving release with the other leg still running, a same-bytes different-inode lease swap preserved, wrong-acquirer release refused from a forked child, the three-way .git classification including FIFO and missing-git refusals, the nested-store witnesses (a store nested in two worktrees of one repository contending on one anchor in the enclosing common git dir with its own lease each, a store that is its own repository keeping its own lock, the D2 literal witnesses T-e9 and T-e10 (an own-repository store configured with core.bare=true or core.worktree redirected to a sibling refusing with no lock or lease created, and each same fixture acquiring after its setting is