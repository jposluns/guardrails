residue = "It runs the OPF source-only init gate (opf/tools/check_opf_init.py): both the default entry and --self-test run the SAME fixture suite, and there is no live-adopter mutation leg and no root option, so unlike the doctor and drift gates it carries no NOT APPLICABLE path over this repository and its whole assurance rides the fixture suite. The suite drives opf init through the isolated dispatcher (python3 -I -B opf/tools/opf.py) over fresh git fixtures created beneath a throwaway temporary directory whose parent is first CONFIRMED to be a non-git location, and asserts each vector with an exact exit code and a full byte snapshot of the fixture tree (files, hidden entries, symlinks, and empty directories): the parser refusals (an unrecognized argument, a bare --root, an empty --root value, --root swallowing the next flag, and a repeated --root) each fail closed to 2 while the parser fixture is preserved byte for byte; an empty git root succeeds 0 and creates .working sources that re-parse and validate through the OPF helpers' own loaders (a valid manifest, counters at zero over the baseline namespaces, a valid version and worklog, every per-type index empty, and the pointer resolving to dir:.), emits a source-only completion report that enumerates the created paths and states the sources are NOT yet git-tracked, mutates no .git bytes, writes no root VERSION, and leaves a heading-only CHANGELOG; a second init over an initialized root names the existing pointer and refuses 2 while preserving source and git bytes; foreign .working content (a hidden file, nested empty directories, and a symlink to an outside victim) is refused 2 with a complete surfaced inventory and the tree and link target preserved; a non-git root and a bare repository are each refused 2 at the git preflight and left untouched; a malformed committed pointer and a malformed local pointer are each refused 2 naming the pointer and preserved; an empty partial .working store is refused 2 (store resolution refused) and preserved; a pre-existing hand-authored CHANGELOG permits source initialization 0 and is preserved byte for byte; and a symlinked root is refused 2 at preflight with the link target preserved. It arguably serves the change-carries-a-check discipline, but the linkage to a single corpus rule is not undeniable, so none is claimed here. Class c: coverage is representative, so it asserts these fixture scenarios with exact exit-code and byte-snapshot matches, not the init verb's whole input space, and it does not exercise concurrent namespace changes or filesystem failures (races, permission or I/O faults) mid-init; missing git, unusable temporary storage, or any harness failure fails closed to 2 rather than a clean skip; and it runs over synthetic isolated fixtures rather than a live adopter product repository."

[[gate]]
id = "opf-init-contract"
