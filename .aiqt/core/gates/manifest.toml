[[gate]]
id = "gitleaks-pin"
script = "tools/check_gitleaks_pin.py"
rules = []
platform = "ci"
default = "block"
class = "c"
residue = "Makes the gitleaks scan required whenever the full local runner, tools/run_all_checks.sh, runs. .github/workflows/quality.yml runs on a pull request only for the labeled type, and the merge lane labels only the train pull request, so member heads get no Quality run at all: a member head's evidence is its named suites plus every generated-file --check and the manifest check, run locally before its push (a process rule, not enforced per head), and the train pull request's Quality run on the identical tree is the standing full evidence. tools/run_all_checks.sh runs this gate right after its gitleaks block (so the ~/.local/bin fallback that block appends to PATH applies), and it fails the run (exit 1), never lets it pass with the scan not run, when no gitleaks is on PATH and when the first gitleaks on PATH reports, through gitleaks version, a version other than the one quality.yml pins (read as X.Y.Z with an optional leading v, compared for equality). The pin is the GITLEAKS_VERSION entry of the env: of the one step named Secrets (gitleaks), a bare X.Y.Z. The whole workflow is read only inside a closed subset of YAML: block mappings and block sequences (each key or item at its collection's column, each nested collection indented past the key or item that holds it); scalars on their key's or item's line, either plain (holding no ': ' and not ending in a colon), single- or double-quoted and closed on that line, or a flow sequence of plain words ([a, b]) opened and closed on that line; block scalars introduced by | or > with their indicators, whose text lines sit past that key or item and at least as far as the text's indentation; comments and blank lines; every key a plain identifier written exactly as name: with a space or the line's end after the colon, and no tab before a line's first ' #'. Every line outside that subset (a flow mapping, any other flow sequence, a quoted scalar left open at the end of its line, a tag, an anchor, an alias, a document marker or directive, a merge key, a key spelled any other way) is cannot-evaluate (exit 2), naming the line, and so is a key repeated within any mapping, named with both lines (a YAML reader keeps at most one copy of it). Inside the subset every line sits where a YAML reader places it, so the step is read only as an item of a job's steps: list under the top-level jobs: mapping whose name: reads Secrets (gitleaks), plain or quoted, and only its env: entry decides. Also cannot-evaluate: a step name: given as a block scalar or holding an escape YAML does not define, no such step item or more than one, a step with no env: or no run:, an env: that is not a block mapping, no GITLEAKS_VERSION entry, a value that is not a bare X.Y.Z, any other line of the workflow naming GITLEAKS_VERSION (another step's or job's env:, a script assigning it) outside a comment and the step's ${GITLEAKS_VERSION} expansions, a workflow line that still carries a carriage return once its one trailing CR is removed or carries U+0085, U+2028 or U+2029 (a YAML reader may break a line there and read a key this LF line reader would not see), a workflow line that carries any other character outside YAML's printable set (tab, LF, CR, U+0020-U+007E, U+0085, U+00A0-U+D7FF, U+E000-U+FFFD and U+10000-U+10FFFF), that is a C0 control other than tab, LF and CR, DEL, a C1 control other than U+0085, a surrogate, U+FFFE or U+FFFF (a YAML reader refuses the whole file there; both character screens run over every line before any line is parsed), a gitleaks version that fails, times out or prints anything but one version, and an unrecognized argument. Its live leg is local-only, a reviewed ci-parity exception, because the CI secrets job downloads the pinned binary and verifies its checksum before it scans; CI runs only its self-test, whose vectors use stub binaries and also launch the gate itself over this checkout's quality.yml with no gitleaks, another version and the pinned version on PATH. It does NOT check the local binary's checksum or provenance (a binary that reports the pinned version passes whatever it is), the scan's own result (the gitleaks block runs it), a gitleaks reached other than through PATH, a version the workflow reaches without naming GITLEAKS_VERSION literally (a hard-coded download URL, or a name built at run time), or two keys a YAML 1.1 reader resolves to the same boolean or null (on and ON, say), which it compares as written; nothing enforces when the full local runner runs, and the member-head evidence above rests on a process rule, not enforced per head. Its keep-secrets-out linkage is arguable, so none is claimed here; an empty rules list is an open question, not a coverage statement."

