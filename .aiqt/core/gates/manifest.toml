residue = "It exercises the OPF core-tooling dispatcher (opf/tools/opf.py --self-test) end to end: it runs every registered helper self-test in order (the store, schema, release, and emitter helpers over synthetic stores) and the aggregator's own fail-closed return-vocabulary guard, under which a helper returning a bool, a float, or an out-of-range int fails the aggregate closed rather than reading as clean, and the worst outcome wins so one degraded helper is never masked by a later clean one. The registry is also split into named groups (SELF_TEST_GROUPS), each run alone by opf.py --self-test-group NAME as one CI shard and one local runner line, and the selector runs nothing unless the groups hold every registered self-test exactly once (a leg left out, doubled or unknown is named, and the aggregator leg flips each case); that each group runs on exactly one quality.yml line and one local runner line is the ci-parity self-test's check, not this one's, and which shard job runs which group is checked nowhere. It arguably serves the change-carries-a-check discipline, but the linkage to a single corpus rule is not undeniable, so none is claimed here. It asserts representative synthetic scenarios with exact exit-code matches, not each helper's whole input space; it now exercises the render and doctor verbs' dispatch and argument handling and the import and upgrade verbs' dispatch via the opf-cli routing leg (usage errors fail closed; render --check/--write forwards to the U4 engine over synthetic and non-adopter stores; doctor resolves and routes over synthetic and non-adopter stores; upgrade, for which this tooling defines no store upgrade, prints exactly its refusal on stderr, nothing on stdout, and exits 2 for nine representative argument lists over a NOT-ADOPTED root and a root holding a store manifest, both fixture trees byte-unchanged; and import's four modes (--scan, --plan, --review in its batch and --interactive forms, and --apply) are retired (spec 14.1), each