# .aiqt/core/gates/byte-canon.toml: the byte-canon platform policy and control-character allowances
# (VER-CORE 3.1/3.6). check_byte_canon.py carries the same platform sets as constants and fails closed
# on any disagreement, so this shipped artifact and the enforcing gate cannot drift apart.
format-version = 1

[platforms]
supported = ["linux", "macos"]   # both expose the race-free containment primitive (3.6, S13-4)
roadmap = ["windows"]            # not supported at this release

# Allowances for the forbidden code spans (3.1 "per-file allowlisted code spans"). The enforced sets
# are the zero-width characters U+200B, U+200C, U+200D, U+2060, U+FEFF and the complete Unicode
# Bidi_Control set U+061C, U+200E, U+200F, U+202A..U+202E, U+2066..U+2069. EMPTY at genesis: no shipped
# file legitimately carries these characters today. Each future row must bind: the exact repo-relative
# path, the file's current raw-byte sha256 (stale digest = fail-closed), the byte start/end of the
# span, the exact permitted codepoints ("U+200B" form), and a rationale. Narrow, non-overlapping,
# each used at least once; never a glob or whole-file allowance.
# [[allowance]]
# path = "..."
# sha256 = "..."
# start = 0
# end = 0
# codepoints = ["U+200B"]
# rationale = "..."

# Two-space hard-break allowances (markdownlint MD009 br_spaces=2). The trailing-whitespace leg forbids
# ALL trailing whitespace; a path listed here may carry EXACTLY two trailing spaces after non-space
# content, the CommonMark hard break, and nothing else. One space, three or more, a tab, or a blank line
# still fails, here and everywhere. This is the sole, disclosed residual of that leg. The shipped chat
# skill SKILL.md renders its five-line identity header (Version, Author, Website, GitHub, Licence) with
# these hard breaks, so it displays as five lines in sanitizing markdown viewers that honour neither a
# trailing-backslash break nor an inline <br> (matching the cleanlanguage skill). Each row binds an
# in-scope release path and a rationale; an unused row (no such break in the file) is fail-closed.
[[hardbreak]]
path = "site/downloads/aiqt/SKILL.md"
rationale = "Chat-skill identity header: five-line Version/Author/Website/GitHub/Licence render via two-space hard breaks; sanitizing viewers drop backslash and <br> breaks."
