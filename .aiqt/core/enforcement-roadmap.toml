# .aiqt/core/enforcement-roadmap.toml: the human enforcement DECISION for every rule (GER-1).
#
# One [[rule]] per corpus-id, in ascending corpus-id order. `status` is enforced, partial, none, or
# pending. enforced: the enforceability ledger links at least one shipped control to the rule;
#   `mechanisms` RESTATES that linkage (namespaced gate:/hook: refs, unique and sorted) so this file is
#   reviewable standalone, and tools/gen_enforcement_register.py CROSS-VALIDATES it against the ledger, so
#   the two can never fork. A rule whose only linked controls are preview-channel hooks (the [[hook]] rows of
#   .aiqt/core/hooks/preview.toml: standalone .preview/ files installed by hand, not in the plugin) is still
#   enforced or partial here, by that linkage, and the register shows it as "Preview only". partial: the
#   same linkage invariant as enforced, and the linked mechanisms are
#   known to cover only part of the rule (their residues name what each does not catch, not every
#   uncovered clause of every linked rule). none: enforcement is
#   not built yet. pending: not built yet, and `description` states the intended build. This file records
#   the DECISION only; the linkage itself is authored in the gate and hook manifests and rendered into
#   .aiqt/enforceability.json, never re-authored here.
# Verified by tools/gen_enforcement_register.py (schema and ledger contradictions are fail-closed exit 2).

