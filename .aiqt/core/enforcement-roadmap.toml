status = "partial"
mechanisms = ["hook:orch-resume-audit", "hook:orch-resume-barrier"]
coverage = "hook:orch-resume-audit reconciles the durable record against observed reality at SessionStart (an event the platform cannot block) and arms a barrier on divergence, and hook:orch-resume-barrier is warn-first and blocks nothing yet, surfacing the first mutation outside its allowlist while the barrier is armed. Both channels only warn, so sesres.1 and sesres.2 are covered only by those warnings: no linked mechanism refuses a session that starts cold instead of resuming from the durable handoff, and none of them checks that the session works under a single named operating mode."

[[rule]]
corpus-id = "setcmp"
status = "partial"
mechanisms = ["hook:orch-stop-guard", "hook:orch-teammate-idle-guard", "hook:orch-yield-tool-guard"]
coverage = "hook:orch-stop-guard, hook:orch-teammate-idle-guard and hook:orch-yield-tool-guard refuse ending a turn, going idle or scheduling a wake past a fresh enumeration of the backlog, which covers setcmp.7, and the stop-shaped cases of setcmp.4 and setcmp.5, at those boundaries. No linked mechanism reads a completion-class claim made in prose, so setcmp.1, setcmp.2 and setcmp.3 are uncovered outside those boundaries, and none covers setcmp.9 or setcmp.10 (retiring, splitting, merging or removing items from a record that names more than one item)."

