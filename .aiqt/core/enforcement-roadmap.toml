coverage = "hook:orch-yield-tool-guard covers one case of estsep.1's concern that a claimed figure never stands in for a measured one: a scheduling call whose text claims more quiet minutes than the clock-measured gap since the last genuine human input, by more than one minute, is refused, so the measured figure wins over the unmeasured claim on that call. The check needs a readable registry, a live scope, a tool the registry's yield_tools roster names and a recorded last-human-input stamp, and it reads the claim with a best-effort regex (the first minutes figure anywhere in the call's text, with the word quiet anywhere in it), so a claim worded past that regex is missed and an unrelated minutes figure can be the one judged; it never looks for a figure blended from measured and estimated inputs, the act estsep.1 literally forbids. hook:orch-prompt-stamp only labels the measured gap in its own context line on a timer prompt. Neither reads a figure the assistant reports, so no linked mechanism covers estsep.1 beyond that overstated-claim case, estsep.2 (measured and estimated figures are reported in labelled separation), estsep.3 (an unknown quantity is reported as unknown, never zero) or estsep.4 (a figure derived from an estimate is labelled as one)."

