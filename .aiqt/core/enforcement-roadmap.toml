coverage = "gate:selftest-execution emits its PASS only from an observation that ran the exact registered set (the executed check-id report reconciled against the expectation manifest), one mechanical instance of evgcmp.8 for registered self-test suites. It sees no other completion claim, so no linked mechanism covers evgcmp.1 through evgcmp.7 (no completion claim without evidence: re-read the files in scope, quote the supporting lines, search for contradictions, state every unverified item, and a marker is evidence only with its payload present), evgcmp.8 outside the registered suites, evgcmp.9 through evgcmp.15 (a class-scoped fix claim carries a validated completeness probe, and an applied edit is proven by re-reading the result), evgcmp.16 (review transfers only to a byte-identical replayed diff) or evgcmp.17 (the consuming tool's own parser accepts the edited file)."

