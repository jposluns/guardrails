coverage = "hook:constraint-reread (a preview hook) fires only on a platform-reported compaction: it reminds the assistant of the constraints the declared record lists and refuses the turn end until a re-read entry is recorded, capped at a fixed number of refusals, and it does nothing at all when no record is declared. So cnstpr.1 and cnstpr.2 are covered only for that compaction case, and no linked mechanism covers cnstpr.3, cnstpr.4 or cnstpr.5 (only the authority that set a constraint can lift it, never context loss alone, and when the assistant cannot confirm a constraint still applies it holds and checks rather than proceeds)."

