coverage = "hook:diff-source denies a git command confirmed to dump a console patch and allows every other producer form with a note, and hook:diff-wall-stop surfaces a raw diff wall in the final message as a non-blocking warning (the wall has already rendered). A dump from a source other than a recognized git producer, and a wall emitted mid-turn, are not judged, so cnsdif.1 is covered only for that git-command shape, and no linked mechanism covers cnsdif.2 or cnsdif.3 (the change is reported as a concise summary and the full detail surfaced through the channel the environment expects)."

