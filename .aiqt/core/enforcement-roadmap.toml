# tstamp is partial. hook:orch-prompt-stamp writes a clock-read time into turn-state for each genuine human
# prompt (the hook writes that stamp, not the assistant), and hook:orch-yield-tool-guard refuses a scheduling
# call that claims more quiet minutes than the gap measured from that stamp. Neither reads a time the
# assistant writes into a record, a file or a message, so no mechanism covers tstamp.1 (a time the assistant
# records is read from the clock), tstamp.2 or tstamp.3 (an external or earlier time comes from an
# authoritative source, identified as such) or tstamp.4 (an unavailable time is recorded as unknown).
[[rule]]
corpus-id = "tstamp"
status = "partial"
mechanisms = ["hook:orch-prompt-stamp", "hook:orch-yield-tool-guard"]

