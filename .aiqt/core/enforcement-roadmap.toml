# estsep is partial. hook:orch-yield-tool-guard covers one case of estsep.1: a scheduling call that claims
# more quiet minutes than the gap measured since the last genuine human input (by more than one minute) is
# refused. hook:orch-prompt-stamp only labels the measured gap in its own context line on a timer prompt.
# Neither reads a figure the assistant reports, so no mechanism covers estsep.1 outside that one claim,
# estsep.2 (measured and estimated figures are reported in labelled separation), estsep.3 (an unknown
# quantity is reported as unknown, never zero) or estsep.4 (a figure derived from an estimate is labelled
# as one).
[[rule]]
corpus-id = "estsep"
status = "partial"
mechanisms = ["hook:orch-prompt-stamp", "hook:orch-yield-tool-guard"]

