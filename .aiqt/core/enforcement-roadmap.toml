# .aiqt/core/enforcement-roadmap.toml: the human enforcement DECISION for every rule (GER-1).
#
# One [[rule]] per corpus-id, in ascending corpus-id order. `status` is enforced, none, or pending.
# enforced: the enforceability ledger links at least one shipped control to the rule; `mechanisms`
#   RESTATES that linkage (namespaced gate:/hook: refs, unique and sorted) so this file is reviewable
#   standalone, and tools/gen_enforcement_register.py CROSS-VALIDATES it against the ledger, so the two
#   can never fork. none: enforcement is not built yet. pending: not built yet, and `description` states
#   the intended build. This file records the DECISION only; the linkage itself is authored in the gate
#   and hook manifests and rendered into .aiqt/enforceability.json, never re-authored here.
# Verified by tools/gen_enforcement_register.py (schema and ledger contradictions are fail-closed exit 2).

