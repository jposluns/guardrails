# humovs is partial. hook:orch-ask-unattended sees only AskUserQuestion calls: it denies a blocking question
# in unattended mode (and judges one in attended mode against the backlog), and its deny reason tells the
# assistant to record and HOLD an item at the oversight threshold. It never sees the high-consequence,
# irreversible or outward-facing action itself, so no mechanism covers humovs.1 or humovs.2 (such an action
# needs proportionate human authorization and holds when in doubt), humovs.3 (a timeout or ambiguous state
# never selects the risky path) or humovs.4 (the threshold is set by consequence and reversibility).
[[rule]]
corpus-id = "humovs"
status = "partial"
mechanisms = ["hook:orch-ask-unattended"]

