[[rule]]
corpus-id = "tstamp"
status = "partial"
mechanisms = ["hook:orch-prompt-stamp", "hook:orch-yield-tool-guard"]
coverage = "hook:orch-yield-tool-guard covers one case of tstamp.1, and its deny cites tstamp: an elapsed-time figure the assistant writes into a scheduling call (a claim of quiet minutes since the last genuine human input) is judged against the clock-measured gap and refused when it overstates that gap by more than one minute, so on that call the inferred figure cannot displace the clock. The check needs a readable orchestration registry, a live scope, a tool the registry's yield_tools roster names and a recorded last-human-input stamp, and it reads the claim with a best-effort regex (the first minutes figure anywhere in the call's text, with the word quiet anywhere in it), so a claim worded past that regex is missed. hook:orch-prompt-stamp supplies the clock-read stamp that gap is measured from, writing it into turn-state for each genuine human prompt (the hook writes that stamp, not the assistant; it needs a readable registry and a live holder session, and a stamp save can fail). Neither linked hook reads a time the assistant writes into a record, a file or a message, so no linked mechanism covers tstamp.1 beyond that scheduling-call case (a time the assistant records is read from the clock), tstamp.2 or tstamp.3 (an external or earlier time comes from an authoritative source, identified as such) or tstamp.4 (an unavailable time is recorded as unknown); the declared preview hooks future-stamp-write and stamp-truth-stop (standalone .preview/ files listed in the ledger's previews, not linked controls) each check part of tstamp.1 there, the first denying a future-dated observed-time literal written into a store, the second blocking a turn whose timestamp claims disagree with the clock."

