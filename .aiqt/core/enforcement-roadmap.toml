coverage = "The drift gates regenerate each registered surface and fail on a byte difference, so a hand-edited target or a stale source landing apart from its derivative fails, covering gensrc.1 through gensrc.4; gate:gensrc-failclose proves each generator's --check consults its target (a corrupted copy never yields a clean exit); and hook:gensrc-edit-guard denies a write onto a registered file or tree target at edit time (kind=block entries are excluded from the hook by design and backstopped by their drift gates). All of them judge the generated target only: none compares the source originals before and after a regeneration, and the hook matches no source path, so no linked mechanism covers gensrc.5 (deriving leaves the source originals byte-for-byte unchanged and writes separate outputs; in-place derivation uses copies and refuses any path or alias writing back to an original)."

