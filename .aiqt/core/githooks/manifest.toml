# Git-side hooks (rule-linked controls that git runs, installed per clone; not Claude Code hooks and not in
# the plugin's hooks.json). Each [[githook]] names the git hook events it is installed on, its entry point
# and its install command. Read by tools/gen_enforceability.py into .aiqt/enforceability.json.
version = 1

[[githook]]
id = "gate-record"
rules = ["gatdis"]
events = ["pre-commit", "pre-merge-commit", "pre-push"]
entry = "python3 -I -B .aiqt/core/hooks/scripts/aiqt_hooks.py gate-record verify-commit (pre-commit, pre-merge-commit) or verify-push (pre-push), run from HEAD's committed copy"
install = "python3 -I -B .aiqt/core/hooks/scripts/aiqt_hooks.py gate-record install"
default = "block"
class = "c"
residue = "Installed per clone (gate-record install writes stubs into the common git directory's hooks directory and never sets core.hooksPath); a clone that never ran it runs no hook. git commit or push --no-verify, a client that runs no hooks, git plumbing that runs no hook (git commit-tree with git update-ref makes a commit, git send-pack pushes one), a core.hooksPath set later or on the command line, and a removed stub skip it. A same-user process, the checked command itself included, can append or rewrite a record line or edit a stub. cherry-pick, revert, rebase and am commit without a pre-commit hook (pre-push still checks the pushed tip); pre-push checks tips only. The record binds the tree, not the environment, the parent commit or ignored files, and the check runs the code of the tree under test, so a change to the check's own code is judged by that changed code. The log is per worktree: a push from another worktree finds no record and refuses, and removing a linked worktree drops its records. The stubs write their temporary verifier copy under TMPDIR (or /tmp). On an unborn (orphan) branch the pre-commit stub reads the verifier and the configuration from the index, and pre-push reads a root commit's own configuration, so an orphan branch sets its own check set. An earlier failure older than the 64 KiB log tail the verifier reads is not seen. The closure for all of these is the required Quality gates check, which re-runs every gate on the merged tree."
