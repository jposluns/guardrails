# Git-side hooks (rule-linked controls that git runs, installed per clone; not Claude Code hooks and not in
# the plugin's hooks.json). Each [[githook]] names the git hook events it is installed on, its entry point
# and its install command. Read by tools/gen_enforceability.py into .aiqt/enforceability.json.
version = 1

[[githook]]
id = "gate-record"
rules = ["gatdis"]
events = ["pre-commit", "pre-merge-commit", "pre-push"]
entry = "python3 -I -B .aiqt/core/hooks/scripts/aiqt_hooks.py gate-record verify-commit (pre-commit, pre-merge-commit) or verify-push (pre-push), run from HEAD's committed copy"
install = "python3 -I -B .aiqt/core/hooks/scripts/aiqt_hooks.py gate-record install"
default = "block"
class = "c"
residue = "Installed per clone (gate-record install writes stubs into the common git directory's hooks directory and never sets core.hooksPath); a clone that never ran it runs no hook. git commit or push --no-verify, a client that runs no hooks, git plumbing that runs no hook, a core.hooksPath set later or on the command line, and a removed stub skip it; the text guard denies git commit-tree, git send-pack and git http-push, but other plumbing spellings (git hash-object -t commit or git fast-import with git update-ref, a transport helper) stay open. A same-user process can append or rewrite a record line or edit a stub, the checked command included when it leaves its own session and process group (the recorder kills that group before it writes) and writes after the recorder's line. cherry-pick, revert, rebase and am commit without a pre-commit hook (pre-push still checks the pushed tip and its parent); pre-push checks tips only. The record binds the tree and the first parent it ran on, not the environment, a merge's other parents or ignored files, and the check runs the code of the tree under test, so a change to the check's own code is judged by that changed code. git commit --amend runs pre-commit with HEAD still the replaced commit, so that pre-commit judges the replaced commit's configuration and parent; pre-push refuses the amended commit until its tree is recorded on its real parent. Removing a linked worktree drops its records. A change with no parent in a repository that has commits (an orphan branch, a root commit off the default branch) must keep the default branch's configuration and verifier (the first of origin/HEAD, main and master that exists); with none of them, it cannot be evaluated. The stubs bound their own git and python3 calls only where a timeout command exists. An earlier failure older than the 64 KiB log tail the verifier reads is not seen. The closure for all of these is the required Quality gates check, which re-runs every gate on the merged tree."
