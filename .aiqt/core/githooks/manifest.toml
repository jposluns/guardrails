# Git-side hooks (rule-linked controls that git runs, installed per clone; not Claude Code hooks and not in
# the plugin's hooks.json). Each [[githook]] names the git hook events it is installed on, its entry point
# and its install command. Read by tools/gen_enforceability.py into .aiqt/enforceability.json.
version = 1

[[githook]]
id = "gate-record"
rules = ["gatdis"]
events = ["pre-commit", "pre-merge-commit", "pre-push"]
entry = "python3 -I -B .aiqt/core/hooks/scripts/aiqt_hooks.py gate-record verify-commit (pre-commit, pre-merge-commit) or verify-push (pre-push), run from HEAD's committed copy"
install = "python3 -I -B .aiqt/core/hooks/scripts/aiqt_hooks.py gate-record install"
default = "block"
class = "c"
residue = "Installed per clone (gate-record install writes stubs into the common git directory's hooks directory and never sets core.hooksPath); a clone that never ran it runs no hook. git commit or push --no-verify, a client that runs no hooks, git plumbing that runs no hook, a core.hooksPath set later, on the command line (git -c, git --config-env) or in a configuration file the command names (GIT_CONFIG_GLOBAL, GIT_CONFIG_SYSTEM, HOME, XDG_CONFIG_HOME), and a removed stub skip it; the text guard denies git commit-tree, git send-pack and git http-push, but other plumbing spellings (git hash-object -t commit or git fast-import with git update-ref, a transport helper) stay open. A same-user process can append or rewrite a record line or edit a stub, the checked command included when it leaves its own session and process group (the recorder kills that group before it writes) and writes after the recorder's line. cherry-pick, revert, rebase and am commit without a pre-commit hook (pre-push still checks the pushed tip and its parent); pre-push checks tips only. The record binds the tree and the first parent it ran on, not the environment, a merge's other parents or ignored files, and the check runs the code of the tree under test, so a change to the check's own code is judged by that changed code. git commit --amend runs pre-commit with HEAD still the replaced commit, so that pre-commit judges the replaced commit's configuration and parent; pre-push refuses the amended commit until its tree is recorded on its real parent. Removing a linked worktree drops its records. A change with no parent in a repository that has commits (an orphan branch, a root commit off the default branch) must keep the default branch's configuration and verifier (the first of origin/HEAD, main and master that exists); with none of them, it cannot be evaluated. The stubs run git, python3, mktemp and timeout by the absolute paths install recorded, with PATH set to those programs' directories and /usr/bin and /bin, and a recorded program that is missing cannot be evaluated; the verifiers run the recorded git. The stubs bound their own git and python3 calls only where install found a timeout command. An earlier failure older than the 64 KiB log tail the verifier reads is not seen. Replace objects, the grafts file and the commit-graph are off for every git read of the recorder, the verifiers and the stubs; in a shallow repository a pushed commit with no parent git can read cannot be evaluated, a real root commit included, unless the remote at the push URL already has it. A pushed tip with no passing record in this clone is accepted only when the remote at the push URL already has it (read with git ls-remote of that URL and the transport variables git pushed with, not from this clone's remote-tracking refs, and reachable from one of its branches or tags; pull-request refs and every other advertised ref are not read); a remote that cannot be read, a URL git ls-remote would rewrite (url.<base>.insteadOf, or a remote named like the URL), or a push a program or setting it chose could deliver to another repository than that read reaches (remote.<name>.receivepack, GIT_EXEC_PATH, an ssh or git:// proxy program, a transport helper or remote.<name>.vcs), cannot be evaluated, and the read trusts that remote to hold every ancestor of what its branches and tags name and trusts whoever can write them there. The read takes the remote's symbolic refs in protocol v2 and drops a branch or tag that names a ref outside refs/heads and refs/tags; a server that answers in protocol v0 (as over an ssh transport whose ssh.variant or GIT_SSH_VARIANT is simple, which sends no protocol request) names no symbolic ref but HEAD, so there such a ref counts as the branch it names. GIT_NAMESPACE or git --namespace on a push to a local path puts the push and the read in the same namespace of the remote, so a commit the remote holds under refs/namespaces/<name>/refs/heads or tags counts for a push into that namespace, which writes only there. An http.proxy the push names is trusted to reach the URL's host. Every input of the push and its stubs that can change what runs or where the push goes is read and refused, denied by the text guard, or one of two counted residuals with these exact forms. X4: git push --receive-pack or --exec on the command line reaches no hook and can deliver a push to another repository than its URL, which the read then reads; the text guard denies the spellings it reads (--rece through --receive-pack, --e through --exec, raw, quoted or ANSI-C), so the open forms are an option built at run time, a git alias or include.path in a configuration file, a script or program that runs git push, and help.autocorrect running a misspelt push verb with --exec. X5: the git the shell runs for git push is found on the caller's PATH, or named by a shell alias, a shell function or a hash -p entry, or given as a path, and a planted git runs no hook, and LD_PRELOAD, LD_AUDIT or LD_LIBRARY_PATH load code into git and the stubs' programs; the text guard denies a git push whose command assigns PATH, GIT_EXEC_PATH or one of those loader variables (NAME=, NAME+=, env, export or declare) or names git --exec-path=, so the open forms are a variable name or assignment built at run time (env, export or declare $(...), with the assignment read back from a git commit, tag or merge message the same command writes, whose quoted literal the text guard reads as data, included), a push the command line does not name as push (a git alias in a configuration file, PATH=/x git p), a shell alias, function or hash -p entry naming git, a git given as a path, a PATH or loader variable set by the session, a profile, a sourced file or an earlier command (such a PATH also picks the ssh program git push runs for an ssh URL, while the read runs the ssh on the stubs' PATH, so another ssh first on it can carry the push to another repository than the read reaches), a git commit under such an override, a program written into a directory the stubs' PATH or a recorded path names, and git -C, --git-dir, GIT_DIR or GIT_COMMON_DIR naming a repository whose hooks hold no stub. The default branch refs (refs/remotes/origin/HEAD, a symbolic ref, and main and master) are local refs a same-user process can repoint with git symbolic-ref or git update-ref, and a commit that changes the configuration or the verifier is judged by the old ones but sets the bar for the commit after it. The object store (alternates included) can hold an object whose content does not match its name, which git, the hooks and the push read alike; the GIT_ variables git sets for a hook and the configuration it passes on are read as git reads them. The closure for all of these is the required Quality gates check, which re-runs every gate on the merged tree."

[[githook]]
id = "handback-staged"
rules = ["vfxcmt"]
events = ["pre-commit", "pre-merge-commit"]
entry = "python3 -I -B .aiqt/core/hooks/scripts/aiqt_hooks.py gate-record verify-commit (the gate-record stub, unchanged), run from HEAD's committed copy, in the mode HEAD's .aiqt/gate-record.toml sets with handback-staged (off, recorded or required; off when absent); the record is written by gate-record handback apply PATCH"
install = "python3 -I -B .aiqt/core/hooks/scripts/aiqt_hooks.py gate-record install"
default = "block"
class = "c"
residue = "Runs only where gate-record is installed and only on a commit whose HEAD holds the verifier with this check. A commit that runs no pre-commit hook (git commit --no-verify, a clone with no stub, core.hooksPath, plumbing, cherry-pick, revert, rebase or am) is not checked; its record stays, and the next checked commit on top of it refuses unless it stages every recorded path, which also lets a fix-up commit on top of a deficient one pass as an amend would. While HEAD is the hand-back's commit, the next commit (an amend of it or a commit on top of it, which the hook cannot tell apart) is judged against the record's head and keeps the record; the record is retired by the first checked commit whose HEAD is a commit on top of the hand-back's commit and stages every recorded path, and after that a commit made by resetting back to the hand-back's commit (git reset, then git commit --amend or a new commit) is not checked. The last commit before a push, and a record cleared or deleted after such a commit, are never checked; pre-push and CI cannot see the local record. The check compares paths, not content, so git add -p partial staging, a hunk reverted after the apply or a trimmed patch is not caught. An apply made without gate-record handback apply (git apply, git am, an editor) writes no record: recorded mode prints a note and makes no claim, and required mode cannot evaluate. In recorded mode a record that is unreadable, malformed, still applying or stale prints a note and makes no claim; in required mode each is a cannot-evaluate, and so is a commit made while HEAD is the hand-back's commit that already stages every recorded path (an amend of it included), since it has no hand-back of its own. With the key absent the mode is off and nothing is checked. Nothing proves the applied patch is the worker's (only the sha256 and size of the file's bytes as read are recorded), any same-user process can rewrite or delete the record, and a hand-back committed from another worktree is not seen. Inside a session bound for review dispatch the apply command cannot run (the interpreter is withheld and git apply is off the allowlist), so the operator applies outside it."
