# .aiqt/core/python-floor.toml
#
# The SINGLE SOURCE for the Python floor of the pack's executable tooling (PYTHON-FLOOR): the oldest
# Python minor version every shipped entrypoint supports. Hand-authored SOURCE; tools/check_python_floor.py
# reads it and checks that every other statement of the floor (the CI and template interpreter pins, each
# entrypoint's refusal guard and, once switched on, the declarations) agrees with it.
#
# python-floor        "MAJOR.MINOR". The gate asserts it names the decided floor, so a change here is a
#                     reviewed change to that gate too, never a silent edit.
# guarded-surfaces    the repo-relative entrypoints that carry the canonical refusal guard, sorted and
#                     unique. Each is checked statically (the guard leads the file) and dynamically (run
#                     in a child with a patched sys.version_info below the floor, it refuses with the exact
#                     message and exit code). It starts EMPTY and grows unit by unit.
# nonblocking-surfaces the guarded-surfaces entries whose guard exits 1 instead of 2, sorted, unique and each
#                     also listed above: a hook whose event reads exit 2 as a block (a Stop hook's exit 2
#                     blocks the stop, and the guard runs before the hook's own block cap).
# completeness-check  false until every shipped entrypoint is listed above; true then makes an unlisted
#                     shipped entrypoint a finding.
# documentation-check false until the declarations land; true then requires each declaration file to state
#                     the floor.

format-version = 1
python-floor = "3.14"
guarded-surfaces = [
    ".preview/clock-inject.py",
    ".preview/future-stamp-write.py",
    ".preview/record-remove-check.py",
    ".preview/stamp-truth-stop.py",
    ".preview/unbounded-wait.py",
    ".preview/ungated-record.py",
    "opf/tools/_journal.py",
    "opf/tools/_opf_absorb.py",
    "opf/tools/_opf_adopt.py",
    "opf/tools/_opf_adopt_apply.py",
    "opf/tools/_opf_adopt_hook.py",
    "opf/tools/_opf_adopt_observe.py",
    "opf/tools/_opf_adopt_plan.py",
    "opf/tools/_opf_changelog.py",
    "opf/tools/_opf_check.py",
    "opf/tools/_opf_emit.py",
    "opf/tools/_opf_fuzz.py",
    "opf/tools/_opf_init.py",
    "opf/tools/_opf_init_contract.py",
    "opf/tools/_opf_init_operation.py",
    "opf/tools/_opf_init_substrate.py",
    "opf/tools/_opf_observe.py",
    "opf/tools/_opf_oplock.py",
    "opf/tools/_opf_pack_manifest.py",
    "opf/tools/_opf_record.py",
    "opf/tools/_opf_release.py",
    "opf/tools/_opf_schema.py",
    "opf/tools/_opf_store.py",
    "opf/tools/_opf_views.py",
    "opf/tools/_opf_worklog.py",
    "opf/tools/_opf_worklog_regressions.py",
    "opf/tools/check_opf_doctor.py",
    "opf/tools/check_opf_drift.py",
    "opf/tools/check_opf_homes.py",
    "opf/tools/check_opf_init.py",
    "opf/tools/check_opf_init_contract.py",
    "opf/tools/check_opf_init_observe.py",
    "opf/tools/check_opf_init_p0.py",
    "opf/tools/check_opf_init_qa.py",
    "opf/tools/check_opf_prompt_pack.py",
    "opf/tools/check_opf_record.py",
    "opf/tools/check_opf_upgrade.py",
    "opf/tools/opf.py",
    "opf/tools/selftest_commonmark_conformance.py",
    "opf/tools/selftest_commonmark_headings.py",
]
