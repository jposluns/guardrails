# .aiqt/core/python-floor.toml
#
# The SINGLE SOURCE for the Python floor of the pack's executable tooling (PYTHON-FLOOR): the oldest
# Python minor version every shipped entrypoint supports. Hand-authored SOURCE; tools/check_python_floor.py
# reads it and checks that every other statement of the floor (the CI and template interpreter pins, each
# entrypoint's refusal guard and the declarations) agrees with it.
#
# python-floor        "MAJOR.MINOR". The gate asserts it names the decided floor, so a change here is a
#                     reviewed change to that gate too, never a silent edit.
# guarded-surfaces    the repo-relative entrypoints that carry the canonical refusal guard, sorted and
#                     unique. Each is checked statically (the guard leads the file) and dynamically (run
#                     in a child with a patched sys.version_info below the floor, it refuses with the exact
#                     message and exit code). It grew unit by unit; the core-hook, preview-hook,
#                     adopter-tool and OPF enforcement deny-hook entrypoints and
#                     tools/check_entry_guard.py are listed, so every shipped entrypoint carries the
#                     guard. The deny hook (opf/enforcement/claude/pretooluse_deny.py, PreToolUse only)
#                     carries the CLI form with exit 2, so a sub-floor interpreter blocks the call. The
#                     core hook and its plugin copy carry the guard's hook form (HOOK_SURFACES in the
#                     gate): a fail-open event's mode warns on exit 0 instead of refusing. The pack's
#                     clock-inject.py and future-stamp-write.py (core sources and plugin copies) carry
#                     the CLI form with exit 2, which the plugin's launcher reports as exit 1.
# nonblocking-surfaces the guarded-surfaces entries whose guard exits 1 instead of 2, sorted, unique and each
#                     also listed above: a hook whose event reads exit 2 as a block (a Stop hook's exit 2
#                     blocks the stop, and the guard runs before the hook's own block cap). Never a
#                     HOOK_SURFACES entry (cannot-evaluate): its hook form denies with exit 2, fixed.
# completeness-check  true since tools/check_entry_guard.py, the last shipped entrypoint, was guarded
#                     and listed: an unlisted shipped entrypoint is a finding.
# documentation-check true since the declarations landed: each declaration file must state the floor and
#                     name no older version. The gate holds it at its decided value, so setting it to
#                     false is a finding, never a silent pass.

