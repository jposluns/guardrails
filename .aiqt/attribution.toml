# The AIQT pack is published under CC BY-SA 4.0 (see the repository LICENSE file). The pack's crosswalk
# mappings reproduce third-party framework control/clause IDENTIFIERS and TITLES as navigational
# pointers only. NO specification prose, requirement text, control or clause bodies, figures, or tables
# are reproduced. tools/gen_notice.py renders the root NOTICE from this file plus the live set of id
# manifests under .aiqt/standards/.
#
# Fail-closed contract: every publisher whose manifest is vendored MUST have a block here with
# verified = true and a verified-date, or gen_notice.py exits 2 and refuses to render. An unverified
# licence can never ship. Blocks are keyed by the exact manifest `publisher` string. A single manifest
# whose licence or attribution differs from its publisher default carries a [manifest."<map-stem>"]
# block (e.g. owasp-mcp is NonCommercial; the two CSA matrices carry version-specific attribution).
#
# Licence facts and verbatim strings are corroborated in the private licence-verification report
# (private/seeds/CW-2-mappings-page/licence-verification.md), verified 2026-08-17.

