# .aiqt/license-waiver.toml: the class-3 (licence-waiver contradiction) exception list read by
# tools/check_license_qualification.py.
#
# Each [[exception]] row excuses ONE waiver-phrase occurrence on ONE scanned surface and MUST carry
# exactly these keys:
#   path    the repo-relative POSIX path of the surface the occurrence sits on
#   phrase  the excused phrase, a member of the closed WAIVER_PHRASES list in the gate
#   reason  a nonempty explanation of why this occurrence is not a rights-waiver claim
#
# An absent file means no exceptions (adopters own their exceptions, like .aiqt/newtab.toml); a present
# but malformed file is cannot-evaluate (exit 2), never a clean pass. This repository currently needs no
# exceptions, so this file documents the schema and declares none.
