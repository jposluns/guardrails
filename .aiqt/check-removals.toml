# decide/opf-tree-boundary kept its id in the opf/site/ removal while its body changed from the opf/site/ tree's
# boundary ([True, False, False, False]) to four False values; it is renamed to the id that says what it now
# asserts, decide/opf-site-paths-false. The boundary it asserted (a path in a second site tree is site work) is
# held by decide/second-tree-boundary, which is its covering row.
[[removal]]
