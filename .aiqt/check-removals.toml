schema = 1

# Accounting record read by tools/check_selftest_removal.py: one [[removal]] entry for each registered self-test
# check id a change removes from tools/selftest_checks.toml, written in the change that removes it.

[[removal]]
suite = "selftest-removal-selftest"
id = "refuse/moved-suite-counts"
state = "unreachable"
capability-removed = "the move rule of tools/check_selftest_removal.py, introduced in the change series that also adds this record: a check id newly registered in another suite with the same launch (runner path and args) and the same check() body, not generic, is reported as moved, not removed, so the refusal of a move that this row asserted no longer exists"
observed = "pass/moved-between-suites runs the same fixture (check id c moved from suite s to suite t, one runner) and asserts exit 0; refuse/move-target-held-at-base, refuse/move-absorbs-one-removal, refuse/move-other-body, refuse/move-other-runner, refuse/move-other-args, refuse/move-body-generic and refuse/move-live-generic-twin assert the refusals that remain"

# The round-gate reader now refuses a complete leg with a null report_sha256 (complete means a usable report
# exists). The case this id accepted is the bad side of fc/complete-leg-null-report; a null digest on a
# degraded or empty leg stays valid (accept/null-report-on-degraded-or-empty-leg).
[[removal]]
suite = "round-gate-selftest"
id = "accept/null-report-on-complete-leg"
state = "covered"
covered-by-suite = "round-gate-selftest"
covered-by-id = "fc/complete-leg-null-report"

# The round-gate reader no longer refuses one report digest on two dispatches: two runs can return the same
# bytes (empty output, a repeated degraded report, a repeated clean report), so the one-owner rule refused
# faithful records. The cases these ids refused are now the flips that validate (the same digest on two
# legs of one line, and on a new dispatch of a later round); each flip's fc twin keeps the digest repeat
# and also reuses a dispatch_id, which stays refused, since a dispatch_id names one leg.
[[removal]]
suite = "round-gate-selftest"
id = "fc/report-digest-shared-on-one-line"
state = "covered"
covered-by-suite = "round-gate-selftest"
covered-by-id = "flip/report-digest-repeats-on-one-line"

[[removal]]
suite = "round-gate-selftest"
id = "flip/report-digest-shared-on-one-line"
state = "covered"
covered-by-suite = "round-gate-selftest"
covered-by-id = "fc/report-digest-repeat-with-shared-dispatch"

[[removal]]
suite = "round-gate-selftest"
id = "fc/report-digest-replayed-across-rounds"
state = "covered"
covered-by-suite = "round-gate-selftest"
covered-by-id = "flip/report-digest-repeats-next-round"

[[removal]]
suite = "round-gate-selftest"
id = "flip/report-digest-replayed-across-rounds"
state = "covered"
