locator = "MCP07:2025 Insufficient Authentication and Authorization, prevention guidance and attack scenarios 3 and 4"
text-location = "lines 675 to 764; prevention guidance at lines 713 to 748; scenarios 3 and 4 at lines 760 to 764"
edition-check = "match"
boundary = "messages and authority passed between orchestrator, peer and sub-agents"
core = "Agents, tools and servers act without verified identity or proper authorization, so a caller can act with authority it was never given."
covers = [
  "agent identity is verified rather than assumed, which stops a spoofed agent (scenario 3)",
  "a sub-agent inherits no authority and gets only the least tools it needs (scenario 4, guidance 4)",
  "an agent cannot grant privileges to itself or another agent",
]
omits = [
  "token lifecycle: expiry, rotation, revocation and replay detection (guidance 3)",
  "server side validation of every token and per request authorization (guidance 1 and 2)",
  "central identity management (guidance 5)",
  "logging of authentication and authorization decisions (guidance 6)",
]
label-a = "tight"
label-b = "broad"
adopted = "pending-definition"
proposed = "pending-definition"
review-state = "assessed"
conventions = []
rationale = "Verified identity and no inherited authority directly stop the spoofed agent and inherited token scenarios. Token lifecycle, server side checks and logging are left out, so it is broad under B."
assumptions = []
assessor = "first-pass review"
date = "2026-11-18"
