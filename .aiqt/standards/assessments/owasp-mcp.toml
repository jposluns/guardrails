# Fit assessment records for the OWASP MCP Top 10. Schema and definitions: RUBRIC.md in this folder.
# Own words only; no entry text is reproduced.

[[row]]
rule-path = ".aiqt/core/rules/security-seci-guardrail-config-integrity.md"
rule-slug = "guardrail-config-integrity"
rule-blob = "08319037e55beb0931ade9d1477035a63839922a"
framework = "owasp-mcp"
id = "MCP02"
current-fit = "tight"
edition = "2025"
source = "OWASP-MCP-Top-10-2025--full-text.md"
source-sha256 = "f2f1c386d75ecef3d0eee2fcd931676bb6ef9dc4eaa050f40db2e3eee65e395b"
locator = "MCP02:2025 Privilege Escalation via Scope Creep, description, remediations 1 to 8 and example attack scenarios A to C"
text-location = "entry from its start to its end at lines 178 to 259; description at lines 187 to 190; remediations at lines 213 to 238, with 3, 5 and 8 at lines 221 to 223, 227 to 229 and 236 to 238; attack scenarios at lines 241 to 250; the impact list and the exposure checklist at lines 194 to 210 and the references at lines 253 to 259 add no elements"
edition-check = "match"
boundary = "the configuration that constrains the assistant, and the scope the assistant has been granted"
core = "Narrow or temporary permissions of an agent or tool grow over time, through convenience or drift, until the agent holds broad privileges it can use without human review."
covers = [
  "a widening of scope the human did not ask for is surfaced for renewed approval, not used (the approval part of remediation 5)",
  "a weakening change is never self applied and needs explicit human authorization, which separates the authority to grant from the actor (remediation 8)",
  "the approval gate for elevation (the approval part of remediation 3)",
  "scopes an attacker adds to the agent through an exposed internal interface, which the human the assistant works for did not ask for, are surfaced for renewed approval rather than used by the agent (part of attack scenario B)",
  "an admin scope written into the agent's manifest by someone else, which the human the assistant works for did not ask for, is surfaced for renewed approval rather than used (part of attack scenario C)",
]
omits = [
  "expiry of scopes and tokens and just in time elevation (the rest of remediation 3); at another layer: only whoever issues the agent's scopes and tokens can carry it out, so it is not essential under B",
  "entitlement audits run on a schedule and on each change to find scope that has grown, and a written justification for each increase (the rest of remediation 5, most of it)",
  "per agent identity and credential binding (remediation 4); at another layer: only the identity provider can carry it out, so it is not essential under B",
  "least privilege design of each agent's permissions before deployment, and policy as code enforced in the pipeline (remediations 1 and 2); at another layer: only whoever deploys the agent and grants its permissions, and whoever runs the pipeline, can carry them out, so they are not essential under B",
  "runtime policy enforcement through a policy decision point (the first part of remediation 6); at another layer: only whoever runs the infrastructure can carry it out, so it is not essential under B",
  "action allowlists, safe execution sandboxes and multi step confirmation for high impact operations, beyond protecting the allowlists and approval requirements that constrain the assistant (the rest of remediation 6)",
  "change records and tamper evident audit trails (remediation 7)",
  "a temporary grant a person asked for that is never withdrawn, which the agent later uses to merge a crafted change that is then deployed automatically (attack scenario A); the rule surfaces only a widening the human did not ask for",
  "a long lived token exposed in logs, the exposed internal interface that lets its holder add scopes, and the attacker's own use of that token (the rest of attack scenario B)",
  "control over who may change agent manifests through internal tooling, including access gained by social engineering (the rest of attack scenario C)",
]
label-a = "tight"
label-b = "broad"
adopted = "pending-definition"
proposed = "pending-definition"
review-state = "assessed"
conventions = [4]
rationale = "Surfacing an unrequested widening for renewed approval, and keeping the assistant from granting itself scope, directly interrupt scope creep. Broad under B rests on attack scenario A, a main variant the rule leaves out, on scenarios B and C, met only in part, and on listed mitigations at the rule's layer it leaves out (the rest of remediation 5, the rest of remediation 6 and remediation 7). The expiry, identity, least privilege design, pipeline policy and runtime policy items in omits sit at another layer and are not essential under B."
assumptions = [
  "a rule on the assistant's own guardrail configuration and granted scope can be tight to an entry whose main remediations act in the identity, policy and pipeline layers that grant and enforce MCP agent and tool permissions (convention 4); if it cannot, label-a is broad",
  "convention 3 is not engaged, and question (a) of its ordered test is the one that answers: the entry's object is an MCP agent or tool, and the assistant is itself one",
]
assessor = "first-pass review"
date = "2026-11-18"

[[row]]
rule-path = ".aiqt/core/rules/security-seci-inter-agent-trust.md"
rule-slug = "inter-agent-trust"
rule-blob = "4e3a51c611a2682ab65c15217f45c16faecca164"
framework = "owasp-mcp"
id = "MCP07"
current-fit = "tight"
edition = "2025"
source = "OWASP-MCP-Top-10-2025--full-text.md"
source-sha256 = "f2f1c386d75ecef3d0eee2fcd931676bb6ef9dc4eaa050f40db2e3eee65e395b"
locator = "MCP07:2025 Insufficient Authentication and Authorization, description, prevention guidance 1 to 7, attack scenarios 1 to 4, detection and immediate remediation"
text-location = "entry from its start to its end at lines 666 to 791; description at lines 675 to 689; prevention guidance at lines 713 to 748; scenarios at lines 752 to 764, with 3 and 4 at lines 760 to 764; detection at lines 766 to 771; immediate remediation at lines 774 to 780; the impact list and the exposure checklist at lines 691 to 710 and the references and edit link at lines 782 to 791 add no elements"
edition-check = "match"
boundary = "messages and authority passed between orchestrator, peer and sub-agents"
core = "Agents, tools and servers act without verified identity or proper authorization, so a caller can act with authority it was never given."
covers = [
  "agent identity is verified rather than assumed, which stops a spoofed agent (scenario 3) and keeps the assistant from trusting unverified caller identity (the third authorization flaw of the description, for the assistant as the trusting party)",
  "a sub-agent inherits no authority and gets only the least tools it needs (scenario 4, and the first point of guidance 4)",
  "an agent cannot grant privileges to itself or another agent, which keeps agents from acting beyond their intended privileges in that way (part of the first authorization flaw of the description)",
]
omits = [
  "mutual TLS between clients, agents and servers, short lived scoped tokens tied to a session, and binding tokens to agent identity (the rest of guidance 1)",
  "role based or attribute based access control, and blocking any unrecognised agent or scope by default (the rest of guidance 2)",
  "splitting high privilege operations into separate workflows with human review, and keeping admin or system tokens out of development and shared contexts (the second and third points of guidance 4)",
  "missing or optional token validation, shared hard coded secrets, static credentials in configuration or logs, and weakly issued tokens (the insecure authentication variants of the description)",
  "users acting beyond their intended privileges, and agents doing so by any means other than granting privileges or inheriting authority, such as using a scope no one checked (the rest of the first authorization flaw of the description)",
  "access checks enforced only on the client side (the second authorization flaw of the description)",
  "MCP servers and tools that are not the assistant trusting caller identity metadata no one verified (the rest of the third authorization flaw of the description)",
  "tool endpoints that do not check permission scopes for each user or agent (the fourth authorization flaw of the description)",
  "a stolen static token replayed against another server (scenario 1)",
  "a test agent holding the same scope as production (scenario 2)",
  "token lifecycle: expiry, rotation, revocation, secure storage and replay detection (guidance 3)",
  "server side validation of every token and per request authorization (guidance 1 and 2); at another layer: only the servers the assistant calls can carry it out, so it is not essential under B",
  "central identity management (guidance 5); at another layer: only the organisation's identity provider can carry it out, so it is not essential under B",
  "logging of authentication and authorization decisions (guidance 6)",
  "secure defaults on MCP endpoints: no guest or anonymous access, no public exposure of local test servers, and separate credentials per environment (guidance 7); at another layer: only whoever runs those endpoints can carry them out, so they are not essential under B",
  "watching for tokens reused across agents or addresses, failed authentication followed by a privileged action that succeeds, a sudden rise in refused requests, and tokens used after they expire (detection points 1, 2, 4 and 5); at another layer: only whoever runs the servers and holds their logs can carry it out, so it is not essential under B",
  "watching for actions by unknown or unregistered agent identities (detection point 3); the rule refuses to trust an agent whose identity is not verified, but does not detect or report such actions",
  "revoking compromised or static tokens, rotating service credentials and giving each agent its own identity (immediate remediation points 1 and 2); at another layer: only whoever issues the tokens, credentials and identities can carry it out, so it is not essential under B",
  "turning on mutual TLS and strict binding of API keys (immediate remediation point 3); at another layer: only whoever runs the servers and issues the keys can carry it out, so it is not essential under B",
  "auditing the agents, tools and connectors already in place for excessive privileges, beyond giving a new sub-agent only the least tools it needs (immediate remediation point 4)",
  "reviewing and patching authorization middleware so that it validates scopes (immediate remediation point 5); at another layer: only whoever runs the servers that hold that middleware can carry it out, so it is not essential under B",
  "temporary compensating controls: address restrictions and manual approval of sensitive actions (immediate remediation point 6)",
]
label-a = "tight"
label-b = "broad"
adopted = "pending-definition"
proposed = "pending-definition"
review-state = "assessed"
conventions = [4]
rationale = "Verified identity and no inherited authority directly stop the spoofed agent and inherited token scenarios, on the reading of convention 4 stated below. Broad under B rests on main variants the rule leaves out (scenarios 1 and 2, the insecure authentication variants and most of the authorization flaws the description names) and on listed mitigations at the rule's layer it leaves out (the rest of guidance 1, 2 and 4, guidance 3 and 6, detection point 3 and immediate remediation points 4 and 6). The server side validation, central identity, endpoint defaults, log monitoring and credential and middleware remediation items in omits sit at another layer and are not essential under B."
assumptions = [
  "a rule acting on the messages and authority passed between agents can be tight to an entry whose main listed mitigations are checks on the server side and at the identity provider (convention 4); if it cannot, label-a is broad",
  "convention 3 is not engaged, and question (a) of its ordered test is the one that answers: the entry's object is MCP agents, tools and servers, and the assistant is itself an MCP client and agent",
]
assessor = "first-pass review"
date = "2026-11-18"
