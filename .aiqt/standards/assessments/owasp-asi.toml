core = "A single fault spreads across agents, tools and workflows and grows into harm across the whole system; the entry is about the spread and amplification, not the first fault."
covers = [
  "budgets on tool call depth, recursion, tokens and cost, and limits and timeouts on loops, which are the quotas and progress caps of guideline 7",
  "a cap on the assistant's own request rate and a fail safe stop when a bound is reached, which limit how fast a runaway loop can spread work (the throttling part of guideline 6, for the assistant's own output only)",
  "a circuit breaker that stops calls to a failing downstream dependency, which keeps one degraded component from becoming a wider outage (part of the fault tolerance of guideline 1)",
]
omits = [
  "design of the whole application to tolerate the loss of model, agent and external components, beyond the breaker on a failing dependency (the rest of guideline 1)",
  "isolation and trust boundaries between agents (guideline 2)",
  "short lived, task scoped access and independent policy enforcement (guidelines 3 and 4)",
  "output validation and human gates before output moves downstream (guideline 5)",
  "detection of commands that spread fast, and throttling or pausing on such anomalies (the rest of guideline 6)",
  "circuit breakers placed between the planner and the executor (the rest of guideline 7); the rule's breaker sits on a failing dependency, not on that link",
  "behaviour and governance drift detection (guideline 8)",
  "replaying recorded agent actions in an isolated copy of production and gating policy changes on the result (guideline 9)",
  "tamper evident logs of messages, decisions and outcomes bound to agent identity, with lineage for every propagated action (guideline 10)",
]
