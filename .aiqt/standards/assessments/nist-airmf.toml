[[row]]
rule-path = ".aiqt/core/rules/quali-high-assurance-verification.md"
rule-slug = "high-assurance-verification"
rule-blob = "4a151205dd11a83bf13b477cf001b2843429e0fd"
framework = "nist-airmf"
id = "MEASURE 1.3"
current-fit = "tight"
edition = "1.0 (NIST AI 100-1)"
source = "NIST-AI-100-1--AI-Risk-Management-Framework-1.0--full-text.md"
source-sha256 = "6fb8de85e764bfc8f60065baa47697adc93b39d780fa3cc6d431378f332e7a3b"
locator = "MEASURE function, subcategory MEASURE 1.3"
text-location = "lines 1340 to 1345"
edition-check = "match"
boundary = "each substantive change before it integrates"
core = "The system is evaluated, and its evaluations revised, at set intervals with people who stand apart from its building: staff experts who were not its front line builders, or outside assessors. Where the organisation's appetite for risk calls for it, those evaluations also draw on specialists, users, AI actors from outside the building team, and the communities the system affects."
covers = [
  "an independent pass, briefed to refute rather than confirm, checks every substantive change; the rule does not say whether a person or another AI model runs that pass",
]
omits = [
  "people in the independent role: the entry asks for staff experts or outside assessors, and the rule's pass may be run by a model (see convention 7)",
  "evaluation of the system as a whole at set intervals, rather than of single changes",
  "input from specialists, users, outside AI actors and affected communities, which the entry makes conditional",
]
label-a = "tight"
label-b = "broad"
adopted = "pending-definition"
proposed = "pending-definition"
review-state = "assessed"
conventions = [3, 5, 7]
rationale = "Independent review is the core of the entry, and the rule requires an independent pass, read here as able to fill the entry's role for people (convention 7). Under B the rule checks single changes, not the system at set intervals, so it is broad. The consultation element is conditional in the entry, so it does not by itself decide B."
assumptions = [
  "the work product the assistant changes counts as the AI system (convention 3); if the AI system means only an AI product, both labels are broad",
  "an element the entry makes conditional is not essential under B (convention 5)",
  "an independent pass that another AI model may run can fill the entry's role for staff experts or outside assessors (convention 7); if the role needs a person, both labels are broad",
]
assessor = "first-pass review"
date = "2026-11-18"
