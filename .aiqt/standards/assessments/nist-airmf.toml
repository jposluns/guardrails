[[row]]
rule-path = ".aiqt/core/rules/quali-high-assurance-verification.md"
rule-slug = "high-assurance-verification"
rule-blob = "4a151205dd11a83bf13b477cf001b2843429e0fd"
framework = "nist-airmf"
id = "MEASURE 1.3"
current-fit = "tight"
edition = "1.0 (NIST AI 100-1)"
source = "NIST-AI-100-1--AI-Risk-Management-Framework-1.0--full-text.md"
source-sha256 = "6fb8de85e764bfc8f60065baa47697adc93b39d780fa3cc6d431378f332e7a3b"
locator = "MEASURE function, subcategory MEASURE 1.3"
text-location = "lines 1340 to 1345"
edition-check = "match"
boundary = "each substantive change before it integrates"
core = "The system is evaluated, and its evaluations revised, at set intervals with people who stand apart from its building: staff experts who were not its front line builders, or outside assessors. Where the organisation's appetite for risk calls for it, those evaluations also draw on specialists, users, AI actors from outside the building team, and the communities the system affects."
covers = [
  "an independent pass, briefed to refute rather than confirm, checks every substantive change; the rule does not say whether a person or another AI model runs that pass",
]
omits = [
  "people in the independent role: the entry asks for staff experts or outside assessors, and the rule's pass may be run by a model (see convention 7)",
  "evaluation of the system as a whole at set intervals, rather than of single changes (the regular part of the entry's assessments)",
  "updating the assessments themselves over time, beyond checking each change once",
  "input from specialists, users, outside AI actors and affected communities, which the entry makes conditional (see convention 5)",
]
label-a = "tight"
label-b = "broad"
adopted = "B"
proposed = "broad"
review-state = "assessed"
conventions = [7, 9]
rationale = "Independent review is the core of the entry, and the rule requires an independent pass on the work product, read here as acting on the AI system when the product is one (convention 9) and as able to fill the entry's role for people (convention 7). Under B the rule checks single changes, not the system at set intervals, so it is broad whatever the reading of convention 5, which is therefore not named."
assumptions = [
  "a rule whose independent pass checks every product the assistant changes, AI or not, acts on the AI system the entry is about, because AI products are among those it checks (convention 9); if an entry about an AI system is met only by a rule aimed at what makes a system AI, both labels are broad",
  "an independent pass that another AI model may run can fill the entry's role for staff experts or outside assessors (convention 7); if the role needs a person, both labels are broad",
  "convention 3 is not engaged, and question (d) of its ordered test is the one that answers: the entry's object, an AI system, is a class that takes in AI software of every kind, so question (a) does not answer; question (b) does not answer; and the rule's boundary is the change to the work product, not the assistant or its tools, so question (c) does not answer",
  "convention 5 does not decide this row: the consultation element is conditional, but label-b is broad on the regular whole system assessment alone, so either reading of convention 5 gives the same labels",
]
assessor = "first-pass review"
date = "2026-11-18"
