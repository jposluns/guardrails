assumptions = [
  "a pack rule counts as one of the policies and procedures the entry asks for (convention 2); if it does not, both labels are broad",
  "the AI in the entry's human and AI configurations includes the assistant the rule governs (convention 3); if it means only the product being built, both labels are broad",
  "convention 3 is engaged at question (c) of its ordered test: the entry names AI and AI systems in general terms, a class that takes in AI software of every kind, so question (a) does not answer; question (b) does not answer; and the rule's boundary is the assistant's own decision rights",
]
assessor = "first-pass review"
date = "2026-11-18"

