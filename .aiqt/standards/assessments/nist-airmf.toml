locator = "MAP function, subcategory MAP 3.5"
text-location = "lines 1240 to 1242"
edition-check = "match"
boundary = "decisions the assistant could enact, and which of them go to a human"
core = "The organisation has a way for people to oversee the AI system; that way is set out, written down and checked for whether it works, consistently with the policies the governance function issues."
covers = [
  "defines an oversight process: each decision is classified as the assistant's, the maintainer's, or blocked",
  "the classification is recorded before acting",
  "the rule text itself documents the process",
]
omits = [
  "assessment of whether the oversight process works",
  "a link to organisational policies set by the governance function",
  "processes for human oversight of AI systems other than the assistant, such as an AI product the organisation builds or runs: the entry's object is human oversight of the AI system, and the rule sets a process for the assistant alone (the whole of the object, met for one AI system only)",
]
label-a = "tight"
label-b = "broad"
adopted = "B"
proposed = "broad"
review-state = "assessed"
conventions = [2, 3]
rationale = "Reading a pack rule as a process (convention 2) and the AI system as including the assistant (convention 3), the rule defines and documents an oversight process, which carries out the core. Nothing in it assesses the process or ties it to governance policy, and it sets oversight for the assistant alone, not for every AI system the organisation has, so it is broad under B."
assumptions = [
  "a pack rule counts as a defined and documented process (convention 2); if it does not, both labels are broad",
  "the AI system to be overseen includes the assistant whose decisions the rule classifies (convention 3); if it means only the product being built, both labels are broad",
  "convention 3 is engaged at question (c) of its ordered test: the entry's object, an AI system, is a class that takes in AI software of every kind, so question (a) does not answer; the entry does not act only where the assistant would not be, so question (b) does not answer; and the rule's boundary is the assistant's own decisions",
]
assessor = "first-pass review"
date = "2026-11-18"

