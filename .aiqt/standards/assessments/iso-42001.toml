boundary = "AI tools, models and servers used for project work"
core = "When it identifies its resources, the organisation records the tooling used for the AI system. The control has one verb, documenting, and one object, the tooling resources used for the AI system, which is all of that tooling, not only its AI part; the Annex B guidance gives examples of what the tooling can include."
covers = [
  "every AI tool, model and server in use is entered in a register before it is relied on, which documents the AI part of the tooling",
  "each entry names what it is, why it is authorized and who approved it",
  "the register is reconciled with what is actually in use",
]
omits = [
  "the rest of the control's object: tooling used for the AI system that is not an AI tool, model or server, such as the other software and the hardware the work uses; the statement names the tooling resources without limiting them to AI tooling, so this omission stands on the statement alone, and the Annex B examples listed below agree with it",
  "guidance only, not an element under B because the source does not present it as a requirement (convention 6, third question, as settled): algorithm types and models other than the AI models in use (the first Annex B item, beyond the register's models)",
  "guidance only: tools or processes that condition data (the second Annex B item)",
  "guidance only: optimization methods and evaluation methods (the third and fourth Annex B items)",
  "guidance only: tools that provision resources (the fifth Annex B item)",
  "guidance only: tools that aid model development but are not AI tools, models or servers (the sixth Annex B item, beyond the register's AI tools)",
  "guidance only: software that is not an AI tool, model or server, and all hardware, used to design, develop and deploy the AI system (the seventh Annex B item)",
]
label-a = "tight"
label-b = "broad"
adopted = "B"
proposed = "broad"
review-state = "assessed"
conventions = [3, 6, 9]
rationale = "The control has one verb, documenting, and the register carries it out for the AI tools the assistant relies on, which count as tooling for an AI system on the reading of convention 3 stated below and, on its product reading, as tooling used to build one under the tooling exception of convention 3, which here rests on conventions 6 and 9; that is tight under A. Under B, read over the whole control, the object is all the tooling used for the AI system, and the register documents only its AI part, so the row is broad. This B label stands on the statement, not on the Annex B items, and holds on every reading of every open convention."
assumptions = [
  "the assistant and its tools are part of the AI system, so the tools are tooling for it (convention 3); on the product reading they are instead tooling used to build the product, and because the control's object takes in such tooling, the tooling exception of convention 3 applies, so the product reading alone does not make the labels broad",
  "convention 3 is engaged at question (c) of its ordered test: the entry's object, the tooling for an AI system, belongs to a class that takes in AI software of every kind, so question (a) does not answer; question (b) does not answer; and the rule's boundary is the assistant's own tools",
  "a register kept for whatever product is built, AI or not, documents tooling for an AI system whenever the product is one (convention 9)",
  "on the product reading of convention 3, only the Annex B guidance shows that the control's tooling takes in tools that aid model development and software for design, development and deployment; the control's statement alone is not read as showing it, so on that reading the tooling exception, and with it label-a, rests on guidance showing what the control's object takes in (convention 6)",
  "label-a changes only when convention 3 is read the other way together with convention 9 or with convention 6: if the AI system means only the product being built, and either an entry about an AI system is met only by a rule aimed at what makes a system AI or guidance cannot show the match under A, label-a is broad; label-b is broad on every reading",
  "the normative heading of Annex B was weighed against its general clause and clause 6.1.3: the annex is normative, but B.1 presents its guidance as support the organisation can extend, modify or replace and need not justify leaving out, 6.1.3 asks only that it be considered, and B.4.4 gives its list as examples; so its items are not requirements of A.4.4 and not essential elements under B, as the rubric's convention 6 now settles; were they essential, label-b would be broad as it is",
  "on the recorded reading of convention 3 the tooling for the AI system takes in the assistant's tools that are not AI tools, models or servers, and on the product reading it takes in the non AI tooling used to build the product; either way the register leaves part of the object out, which is why label-b holds on both readings",
  "the reference copy's Annex A table is extracted out of order, so the control text was read where it actually sits, not under the printed heading",
]
assessor = "first-pass review"
