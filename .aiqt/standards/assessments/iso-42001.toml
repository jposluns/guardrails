assumptions = [
  "the assistant and its tools are part of the AI system, so the tools are tooling for it (convention 3); on the product reading they are instead tooling used to build the product, and because the control's object takes in such tooling, convention 3 gives way to convention 9 as the rubric states, so the product reading alone does not make the labels broad",
  "a register kept for whatever product is built, AI or not, documents tooling for an AI system whenever the product is one (convention 9)",
  "on the product reading of convention 3, only the Annex B guidance shows that the tooling takes in tools that aid model development and software for design, development and deployment; the control's statement alone is not read as showing it, so on that reading label-a also rests on guidance showing the match under A (convention 6)",
  "label-a and label-b change only when convention 3 is read the other way together with convention 9 or with convention 6: if the AI system means only the product being built, and either an entry about an AI system is met only by a rule aimed at what makes a system AI or guidance cannot show the match under A, both labels are broad",
  "the items of the Annex B implementation guidance are not essential elements under B (convention 6); if they are, label-b is broad",
