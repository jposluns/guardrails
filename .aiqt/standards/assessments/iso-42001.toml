core = "When it identifies its resources, the organisation records the tooling used for the AI system. The control has one verb, documenting, and one object, the tooling resources used for the AI system, which is all of that tooling, not only its AI part; the Annex B guidance gives examples of what the tooling can include."
covers = [
  "every AI tool, model and server in use is entered in a register before it is relied on, which documents the AI part of the tooling",
  "each entry names what it is, why it is authorized and who approved it",
  "the register is reconciled with what is actually in use",
]
omits = [
  "the rest of the control's object, a statement element: tooling used for the AI system that is not an AI tool, model or server, such as the other software and the hardware the work uses; the statement names the tooling resources used for the AI system without limiting them to AI tooling; on the recorded reading of convention 3 the statement alone shows that this takes in the non AI software and hardware the assistant's work uses, and on its product reading the statement names all the product's tooling, and the Annex B guidance, read only for what that object takes in (convention 6, second question), shows that it takes in the software and hardware used to design, develop and deploy the product; on either reading this is an omission from the statement's object, not an omission of a guidance item",
  "guidance only, not an element under B on the assessor's proposed reading of convention 6's third question, which stays open (the source does not present the item as a requirement): algorithm types and models other than the AI models in use (the first Annex B item, beyond the register's models)",
  "tools or processes that condition data (the second Annex B item): its tools that are not AI tools, models or servers are software used for the AI system, so they fall inside the statement element first in this list and add no element beyond it; its processes are guidance only, not an element under B on the assessor's proposed reading of convention 6's third question",
  "guidance only: optimization methods and evaluation methods (the third and fourth Annex B items)",
  "guidance only, adding no element beyond the statement element first in this list: tools that provision resources (the fifth Annex B item); those that are not AI tools, models or servers are software used for the AI system, counted once as part of the statement's object, and the item is listed here only to show it adds nothing further",
  "guidance only, adding no element beyond the statement element first in this list: tools that aid model development but are not AI tools, models or servers (the sixth Annex B item, beyond the register's AI tools); they are software used for the AI system, counted once as part of the statement's object, and the item is listed here only to show it adds nothing further",
  "guidance only, adding no element beyond the statement element first in this list: the seventh Annex B item names software that is not an AI tool, model or server, and all hardware, used to design, develop and deploy the AI system; that software and hardware is counted once, as part of the statement's object, and the item is listed here only to show it adds nothing further",
]
