text-location = "line 63 of the techniques file, the whole sub-technique row, which has no part that adds no elements; and, in the release's YAML copy ATLAS-2026.06.yaml (SHA-256 b771de8b1489564b2838a709c7429849a9575dbd94073928817fe1a21661e70a), the sub-technique at lines 1985 to 2008, its specializes relation to the parent technique AML.T0034 at lines 15135 to 15138, the parent at lines 1946 to 1984, and the parent's two mitigates relations, from AML.M0004 at lines 13577 to 13581 and AML.M0019 at lines 14106 to 14109, with those mitigations' own entries, their created-date and modified-date lines included, at lines 4859 to 4864 and 5155 to 5164; no mitigates relation in the release targets AML.T0034.000 itself, and the parent's other sub-techniques at lines 2009 to 2071 are read for the core only"
edition-check = "match"
