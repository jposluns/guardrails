framework = "atlas"
id = "AML.T0077"
current-fit = "tight"
edition = "2026.06"
source = "ATLAS-2026.06--techniques.csv"
source-sha256 = "ba5bd12107a5ebf95a701b2d0447e0a27eebd5d7fed0c1a4e248651eb19872d3"
locator = "technique AML.T0077 LLM Response Rendering"
text-location = "line 124 of the techniques file, the whole technique row, which has no part that adds no elements; and, in the release's YAML copy ATLAS-2026.06.yaml (SHA-256 b771de8b1489564b2838a709c7429849a9575dbd94073928817fe1a21661e70a), the technique at lines 3531 to 3556 and every relation whose target is AML.T0077: the five at lines 9317 to 9319, 10119 to 10121, 10615 to 10617, 13038 to 13040 and 13158 to 13160 are case studies that employ the technique, none is a mitigates relation, and the technique specializes no parent (its relations at lines 15538 to 15542 are an achieves relation only), so the release links no mitigations to it; the case studies are separate entries of the release, not part of the technique, and add no elements"
edition-check = "match"
boundary = "model output passed to a rendering sink such as HTML"
core = "The adversary gets the model to emit content that the user's client renders automatically, such as an image whose address carries private data to a server the adversary controls; variants use HTML tags or markdown."
covers = [
  "output encoded for an HTML sink renders a tag as inert text, which stops the HTML tag variant",
]
omits = [
  "the markdown image variant, where the client renders markdown it is meant to render",
]
label-a = "tight"
label-b = "broad"
adopted = "B"
proposed = "broad"
review-state = "assessed"
conventions = [4]
rationale = "The entry names HTML tags as a variant, and encoding for the HTML sink breaks that variant, so the rule interrupts the core mechanism for one main variant. The markdown variant is left out, which makes it broad under B on every reading of every open convention. The release links no mitigations to the technique, in its techniques file or through a mitigates relation in its YAML, and the technique has no parent whose mitigations it would take in, so omits holds only the variant the rule leaves out; mitigations an assessor might add from outside the entry, such as limiting where the client may fetch from, are not listed mitigations and are not counted."
assumptions = [
  "breaking one named variant at the sink counts as interrupting the core mechanism (test 5)",
  "a rule at the producing side can be tight to a technique completed by the rendering client (convention 4); if it cannot, label-a is broad",
  "convention 3 is not engaged, and question (a) of its ordered test is the one that answers: the technique's object is the LLM whose response carries the private data, a kind of software the assistant itself is, so the technique reaches the assistant's own output directly; the client application that renders the response is the user's, not the assistant, and the layer it acts at is the question of convention 4",
]
assessor = "first-pass review"
date = "2026-11-18"

[[row]]
