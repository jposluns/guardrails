[[row]]
rule-path = ".aiqt/core/rules/security-seci-output-encoding.md"
rule-slug = "output-encoding"
rule-blob = "476ba2c8e39b7c280b0344dd55225747e8357f09"
framework = "atlas"
id = "AML.T0077"
current-fit = "tight"
edition = "2026.06"
source = "ATLAS-2026.06--techniques.csv"
source-sha256 = "ba5bd12107a5ebf95a701b2d0447e0a27eebd5d7fed0c1a4e248651eb19872d3"
locator = "technique AML.T0077 LLM Response Rendering"
text-location = "line 124"
edition-check = "match"
boundary = "model output passed to a rendering sink such as HTML"
core = "The adversary gets the model to emit content that the user's client renders automatically, such as an image whose address carries private data to a server the adversary controls; variants use HTML tags or markdown."
covers = [
  "output encoded for an HTML sink renders a tag as inert text, which stops the HTML tag variant",
]
omits = [
  "the markdown image variant, where the client renders markdown it is meant to render",
  "control of which destinations the client may fetch from",
  "detection of private data placed in output",
]
label-a = "tight"
label-b = "broad"
adopted = "pending-definition"
proposed = "pending-definition"
review-state = "assessed"
conventions = [4]
rationale = "The entry names HTML tags as a variant, and encoding for the HTML sink breaks that variant, so the rule interrupts the core mechanism for one main variant. The markdown variant is left out, which alone makes it broad under B; destination control and detection of private data in output are left out as well."
assumptions = [
  "breaking one named variant at the sink counts as interrupting the core mechanism (test 5)",
  "a rule at the producing side can be tight to a technique completed by the rendering client (convention 4); if it cannot, label-a is broad",
  "convention 3 is not engaged: the technique's object is the LLM whose response carries the private data, a kind of software the assistant itself is, so the technique reaches the assistant's own output directly; the client application that renders the response is the user's, not the assistant, and the layer it acts at is the question of convention 4",
]
assessor = "first-pass review"
date = "2026-11-18"

[[row]]
rule-path = ".aiqt/core/rules/security-seca-resource-bounds.md"
rule-slug = "resource-bounds"
rule-blob = "3f8e9e338135afe8eb97422619e92ef3191a55bf"
framework = "atlas"
id = "AML.T0029"
current-fit = "tight"
edition = "2026.06"
source = "ATLAS-2026.06--techniques.csv"
source-sha256 = "ba5bd12107a5ebf95a701b2d0447e0a27eebd5d7fed0c1a4e248651eb19872d3"
locator = "technique AML.T0029 Denial of AI Service"
text-location = "line 60"
edition-check = "match"
boundary = "the assistant's own tool calls, recursion, token and cost budgets and request rate"
core = "An adversary floods an AI service with requests, or with inputs that need heavy compute, to degrade or shut it down."
covers = [
  "bounds and fail safe behaviour on the assistant's own consumption",
  "a circuit breaker that relieves a degraded dependency",
]
omits = [
  "admission control or rate limits on requests coming into the AI service",
  "limits on the compute cost of a single crafted input to the service",
]
label-a = "broad"
label-b = "broad"
adopted = "pending-definition"
proposed = "pending-definition"
review-state = "assessed"
conventions = [8]
rationale = "Read as binding only the assistant's own consumption (convention 8), the rule does not act on requests coming into the AI service the technique floods, so it shares the theme but not the object and both labels are broad. Read as also binding the services of the product the assistant builds, it would limit inbound load and be tight under A."
assumptions = [
  "the rule binds only the assistant's own consumption, not the services of the product it builds (convention 8); the other reading gives label-a tight, and it is the reading the rule's tight mappings to SC-5, API4, CWE-400 and CWE-770, all about inbound limits, rely on",
  "convention 3 is not engaged: the technique acts on the inbound edge of the AI service it floods, and the rule's bounds sit on what the assistant sends out, so counting the assistant as part of the system would not put the rule on that edge",
  "convention 4 is not what decides this row: under the recorded reading the rule and the technique act on different objects, not on the same object at different layers",
]
assessor = "first-pass review"
date = "2026-11-18"

