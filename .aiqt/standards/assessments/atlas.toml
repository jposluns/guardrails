covers = [
  "bounds and fail safe behaviour on the assistant's own consumption and cost",
]
omits = [
  "rate limits and quotas on queries coming into the AI system, including a limit on how many queries each user may make in a period (listed mitigation AML.M0004, which the release links to the parent technique; its relation there, at lines 13580 to 13581, gives hindering computationally expensive inputs as the purpose of the limit, which is the mechanism of the sibling sub-technique AML.T0034.001 Resource-Intensive Queries rather than of excessive queries; the record reads the mitigation by the act that relation names, a limit on the queries users can make in an interval, which bounds excessive queries as well, and does not narrow it to that purpose)",
  "autoscaling and billing limits on the service side",
  "access control on the model's API: users verify their identity before they reach the model, and its queries are monitored against usage policy (listed mitigation AML.M0019, which the release links to the parent technique)",
]
label-a = "broad"
label-b = "broad"
adopted = "B pending conventions 8 and 10"
proposed = "pending-convention"
review-state = "assessed"
conventions = [8, 10]
rationale = "Same reading of convention 8 as the Denial of AI Service row: the technique acts on the service's inbound edge and the rule, read as binding only the assistant, bounds the assistant's own outbound use, so both labels are broad. Read as also binding the product's services, it would be tight under A; on the recorded reading of convention 10 the sub-technique takes in the two mitigations the release links to its parent, and on neither reading of convention 8 does the rule control access to the model's API (AML.M0019), so label-b is broad. The release does not say which reading of convention 10 it intends; the assessor infers from its linking pattern evidence against the recorded reading, and from the creation dates of its entries evidence both for it and against it. If both conventions are read the other way label-b is tight, so the B label is pending conventions 8 and 10 together."
assumptions = [
  "the rule binds only the assistant's own consumption, not the services of the product it builds (convention 8); the other reading gives label-a tight, and it is the reading the rule's tight mappings to SC-5, API4, CWE-400 and CWE-770, all about inbound limits, rely on",
  "on the other reading of convention 8, with convention 10 read as recorded, label-b stays broad: the bound on request rate meets the limit on queries in a period (AML.M0004) at most in part, since it is not a limit on each user, and the cost budget caps what autoscaling and billing can run up, but nothing in the rule controls access to the model's API (AML.M0019); this is the assessor's reading of the rule applied to the product's services, not a reading the rule's text states",
  "the sub-technique takes in the mitigations the release links to its parent (convention 10, read as the rubric states it in this pass): the release records it as specializing AML.T0034 and links no mitigation to it directly; this reading is the assessor's proposal, the release does not say which reading it intends, and the assessor infers evidence both ways from it: against the reading, the release repeats some of a parent's links on each sub-technique and not others (AML.M0004 and AML.M0024 on AML.T0024 and all three of its sub-techniques, while AML.M0019 is linked to AML.T0024 and none of them; 15 of the 45 links from a mitigation to a parent that has sub-techniques are repeated on every sub-technique, 18 on some and 12 on none; of the 40 sub-techniques with no direct mitigation, the 13 whose parent has a linked mitigation bear on the question), so the missing links on AML.T0034.000 can be read as deliberate; for the reading, counted by each sub-technique's created-date, those created in 2021 repeat 48 of their parents' 92 links, those created in 2023 repeat 6 of 14, in 2024 0 of 3, in 2025 17 of 26 and in 2026 2 of 22, a mixed pattern rather than a steady fall from older sub-techniques to newer ones (the 2026 figure includes the three AML.T0034 sub-techniques themselves, and without them it is 2 of 16), and those three were created on 2026-03-30, after the modified-date of 2025-12-23 that AML.M0004 and AML.M0019 both carry, so the missing links fit a gap in a new entry's links as well as a deliberate choice, though a modified-date says little about when an entry was last looked at, since 26 of the 35 mitigations carry 2025-12-23 and 170 of the 173 techniques carry 2026-05-27; against the reading on the same dates, AML.M0019 was created on 2024-01-12, after the 11 sub-techniques created in 2021 of the parents it is linked to, so if that date is when it entered the release its links to those parents were added while those sub-techniques existed, yet it is repeated on 1 of those 11 (and on 1 of the 17 sub-techniques of the five parent techniques with sub-techniques that it is linked to, AML.T0005, AML.T0024, AML.T0034, AML.T0043 and AML.T0051, 1 of 14 without the three AML.T0034 sub-techniques), while AML.M0004, created on 2023-04-12, is repeated on 6 of the same 11, so AML.M0019's absence from AML.T0034.000 fits the way AML.M0019 is linked across the release as well as it fits the sub-technique being new; the relations themselves carry no dates, so when any one link was added cannot be told; on the other reading of convention 10 the row has no listed mitigations, and label-b is still broad while convention 8 is read as recorded, since the rule then does not act on the service's inbound edge; label-b is tight only when both convention 8 and convention 10 are read the other way",
  "convention 3 is not engaged, and question (b) of its ordered test is the one that answers: the technique's object, an AI system, is a class that takes in AI software of every kind, so question (a) does not answer; the technique acts on the inbound edge of the AI system it overwhelms, and the rule's bounds sit on what the assistant sends out, so counting the assistant as part of the system would not put the rule on that edge",
  "convention 4 is not what decides this row: under the recorded reading the rule and the technique act on different objects, not on the same object at different layers",
]
