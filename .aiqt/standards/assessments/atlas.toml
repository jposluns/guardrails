framework = "atlas"
id = "AML.T0029"
current-fit = "tight"
edition = "2026.06"
source = "ATLAS-2026.06--techniques.csv"
source-sha256 = "ba5bd12107a5ebf95a701b2d0447e0a27eebd5d7fed0c1a4e248651eb19872d3"
locator = "technique AML.T0029 Denial of AI Service"
text-location = "line 60 of the techniques file, the whole technique row, which has no part that adds no elements; and, in the release's YAML copy ATLAS-2026.06.yaml (SHA-256 b771de8b1489564b2838a709c7429849a9575dbd94073928817fe1a21661e70a), the technique at lines 1907 to 1927 and its three mitigates relations, from AML.M0004 at lines 13572 to 13576, AML.M0015 at lines 13963 to 13967 and AML.M0019 at lines 14101 to 14105, with those mitigations' own entries at lines 4859 to 4861, 5058 to 5065 and 5155 to 5161; the other relations whose target is AML.T0029 (lines 8885 to 8887, 10657 to 10659 and 10667 to 10669) are case studies that employ the technique and add no elements, and the technique specializes no parent (its relations at lines 15115 to 15119 are an achieves relation only)"
edition-check = "match"
boundary = "the assistant's own tool calls, recursion, token and cost budgets and request rate"
core = "An adversary floods an AI service with requests, or with inputs that need heavy compute, to degrade or shut it down."
covers = [
  "bounds and fail safe behaviour on the assistant's own consumption",
  "a circuit breaker that relieves a degraded dependency",
]
omits = [
  "admission control or rate limits on requests coming into the AI service, including a limit on how many queries each user may make in a period (listed mitigation AML.M0004)",
  "a check on the queries coming into the AI service: either assessing them before inference, to detect and block adversarial or atypical ones, or enforcing a timeout on queries that use too much compute (listed mitigation AML.M0015, whose relation to this technique offers the two acts as alternatives, so meeting either one meets it; read as binding only the assistant, the rule meets neither at the AI service)",
  "access control on the model's API: users verify their identity before they reach the model, and its queries are monitored against usage policy (listed mitigation AML.M0019)",
]
label-a = "broad"
label-b = "broad"
adopted = "B"
proposed = "broad"
review-state = "assessed"
conventions = [8]
rationale = "Read as binding only the assistant's own consumption (convention 8), the rule does not act on requests coming into the AI service the technique floods, so it shares the theme but not the object and both labels are broad. Read as also binding the services of the product the assistant builds, it would limit inbound load, which makes label-a tight; but read over the whole control, the release links three mitigations to the technique, and on neither reading does the rule control access to the model's API (AML.M0019), so label-b is broad on every reading of every open convention and convention 8 decides only label-a."
assumptions = [
  "the rule binds only the assistant's own consumption, not the services of the product it builds (convention 8); the other reading gives label-a tight, and it is the reading the rule's tight mappings to SC-5, API4, CWE-400 and CWE-770, all about inbound limits, rely on",
  "on the other reading of convention 8 label-b stays broad: the bound on request rate meets the limit on queries in a period (AML.M0004) at most in part, since it is not a limit on each user, and the limits, timeouts and budgets meet AML.M0015 through its timeout alternative, but nothing in the rule controls access to the model's API (AML.M0019); this is the assessor's reading of the rule applied to the product's services, not a reading the rule's text states",
  "the listed mitigations are read from the whole technique as the pinned release presents it: its techniques file row carries none, and the release links them to the technique through the mitigates relations in its YAML copy of the same edition, so both copies are read and the control is not narrowed to the row",
  "each listed mitigation is read as broadly as the text of the relation that links it to this technique: AML.M0015's own entry describes only detecting and blocking adversarial or atypical queries, but its relation here (lines 13966 to 13967) offers enforcing a timeout on queries that use too much as an alternative to assessing queries before inference, so either act meets it and the timeout alone is not counted as only part of it; AML.M0004's relation here (lines 13575 to 13576) asks for a limit on the queries users can make in an interval, as its entry does",
  "convention 3 is not engaged, and question (b) of its ordered test is the one that answers: the technique's object, an AI service, is a class that takes in AI software of every kind, so question (a) does not answer; the technique acts on the inbound edge of the AI service it floods, and the rule's bounds sit on what the assistant sends out, so counting the assistant as part of the system would not put the rule on that edge",
  "convention 4 is not what decides this row: under the recorded reading the rule and the technique act on different objects, not on the same object at different layers; under B the layer at which access control on the model's API sits would not change label-b either, since B reads every listed mitigation whatever its layer",
]
assessor = "first-pass review"
date = "2026-11-18"

