assumptions = [
  "an informative annex entry that lists a risk source can be tight (convention 1); if it cannot, both labels are broad",
  "the AI system whose level of automation the entry discusses includes the assistant whose actions the rule governs (convention 3); if it means only the product being built, both labels are broad",
]
