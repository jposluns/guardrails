source = "OWASP-Top-10-for-LLM-Applications-2026--full-text.md"
source-sha256 = "960f68a87fb9cede9c0ef9a497d6736f5e445cce2f8be3ea83fe2411d170e605"
locator = "LLM07:2026 Misinformation, common examples 1 to 7, prevention and mitigation strategies 1 to 10 and example attack scenarios 1 to 7"
text-location = "entry from its heading to its end at lines 1355 to 1442; examples at lines 1377 to 1396; strategies at lines 1398 to 1414, with 1 and 2 at lines 1398 to 1402; attack scenarios at lines 1421 to 1442"
edition-check = "match"
boundary = "claims about external facts that the assistant relies on or presents"
core = "Model output that is false, unsupported or misleading is relied on for decisions or actions; the entry asks that claims be grounded in authoritative sources and checked before anything acts on them."
covers = [
  "grounding claims about external facts in a source before they are relied on (strategy 1, for its authoritative part)",
  "checking a claim before acting on it (the verification part of strategy 2)",
  "more corroboration for a weaker source",
  "an external claim not yet corroborated is not presented as settled (part of strategy 9)",
  "decision support that rests on an external fact is corroborated first (the external fact part of example 1)",
  "a claim that a package, library or other dependency exists is an external fact, so it is checked before use (the dependency part of example 3)",
  "a false external claim induced by an attacker, or passed on by another agent, is corroborated against a source like any other (the false claim parts of examples 5 and 6)",
  "a weak or doubtful source needs more corroboration, which makes forged evidence harder to rely on (part of example 7)",
  "a claim that a recommended package exists is an external fact, so it is checked against a source before it is presented (the dependency claim in attack scenario 1)",
  "remediation steps planted on a public forum are a weak source, so they need more corroboration before they are repeated as a trusted recommendation (attack scenario 4)",
  "a state another agent reports, such as a customer being verified, is corroborated before it is relied on, where the assistant is the agent that relies on it (the relying side of attack scenario 6)",
]
omits = [
  "unsupported decision support that does not rest on an external fact, such as the assistant's own reasoning (the rest of example 1)",
  "incorrect inference that a workflow condition has been met (example 2)",
  "incorrect code recommendations (the rest of example 3)",
  "misleading summaries and critical omissions (example 4)",
  "omission of critical facts induced by an attacker (the rest of example 5)",
  "incorrect outputs that spread across agents and workflows other than as external claims (the rest of example 6)",
  "detecting fabricated or manipulated evidence as such, beyond asking more corroboration of a weak source (the rest of example 7)",
  "requiring the sources to be current (the rest of strategy 1)",
  "separating generation from execution (the rest of strategy 2)",
  "tool call validation and verification signals (strategies 3 and 4)",
  "approval workflows and system checks at run time for high impact actions (strategy 5)",
  "structured output with required fields to catch omissions (strategy 6)",
  "least privilege, sandboxing and rate limits to contain the blast radius (strategy 7)",
  "logging of claims, evidence and outcomes, and tests of adversarial scenarios (strategy 8)",
  "telling verified facts apart from assumptions across the whole output, beyond holding back an uncorroborated external claim from being presented as settled (strategy 9)",
  "regular adversarial testing of workflows against misleading inputs (strategy 10)",
  "an attacker registering the hallucinated package name in advance, so that the package does exist and a check that it exists passes (the rest of attack scenario 1)",
  "an agent misreading a policy it already holds and acting on its own reading (attack scenario 2)",
  "a summary that leaves out a critical fact (attack scenario 3)",
  "an agent misclassifying what it observes and acting on its own conclusion (attack scenario 5)",
  "the reporting agent's own false account of a state it inferred (the rest of attack scenario 6)",
  "an agent reporting its own task as done when it never ran (attack scenario 7)",
]
label-a = "tight"
label-b = "broad"
