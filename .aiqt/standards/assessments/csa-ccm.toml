rationale = "Read as binding the assistant's own context, with the assistant counted as one of the applications the control is about (convention 3), keeping each tenant's context apart is tenant segregation inside an application, which carries out the core in the case the rule addresses, an assistant holding context for more than one tenant. Monitoring, restriction, infrastructure segmentation and the design, development, deployment and configuration work the control's verbs name are left out, so it is broad under B."
assumptions = [
  "convention 3 is engaged, not set aside: the control's object, applications and infrastructures, is a class that takes in software of every kind, not a kind of software the assistant is by its nature, so the rubric's question (a) does not answer; the control does not act only where the assistant would not be, so question (b) does not answer; and question (c) does, because the rule's boundary is the context the assistant itself holds",
  "the rule binds the assistant's own tasks, sessions and responses, not the services of the product it builds, which is the plain reading of its text and the reading the resource bounds rows take (convention 8); the other reading puts the rule on tenant context inside the product's application, which also gives label-a tight while convention 3 is read as recorded, so convention 8 does not decide this row and is not listed in conventions",
  "the assistant is one of the applications whose tenant access the control asks to be segregated (convention 3); if the applications mean only the product being built, the rule, read as binding only the assistant, does not act on the control's object and both labels are broad",
  "on the product reading of convention 3 the labels turn on convention 8: read as also binding the product's services, the rule acts on the product's tenant context and label-a stays tight",
  "the row is assessed for the case the rule's own text addresses, an assistant holding context for more than one user, tenant or authorization (test 9); where the assistant serves only one tenant, keeping that tenant's tasks apart is not tenant segregation, and both labels are broad",
  "convention 4 is not engaged: the control names applications as well as infrastructures, so a rule acting inside an application meets it at a layer the control itself names, and infrastructure segmentation is a difference of scope, which Definition A treats as secondary",
]
