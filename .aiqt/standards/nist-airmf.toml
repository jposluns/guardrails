# NIST AI Risk Management Framework (AI RMF) 1.0: id manifest for the AIQT standards crosswalk.
# Citation unit is the Core subcategory (GOVERN 1.1). US Government public domain. See README.md.
map-key = "map-nist-airmf"
name = "NIST AI Risk Management Framework"
publisher = "NIST"
edition = "1.0 (NIST AI 100-1)"
kind = "guidance"
status = "stable"
citation-unit = "subcategory"
id-pattern = "^(GOVERN|MAP|MEASURE|MANAGE) \\d+\\.\\d+$"
source-artefact = "NIST AI 100-1, AI Risk Management Framework 1.0"
retrieved = "2026-08-16"
[[id]]
code = "GOVERN 1.1"
title = "Legal and regulatory requirements involving AI are understood, managed, and documented."
[[id]]
code = "GOVERN 1.2"
title = "The characteristics of trustworthy AI are integrated into organizational policies, processes, procedures, and practices."
[[id]]
code = "GOVERN 1.3"
title = "Processes, procedures, and practices are in place to determine the needed level of risk management activities."
[[id]]
code = "GOVERN 1.4"
title = "The risk management process and its outcomes are established through transparent policies, procedures, and other controls."
[[id]]
code = "GOVERN 1.5"
title = "Ongoing monitoring and periodic review of the risk management process and its outcomes are planned."
[[id]]
code = "GOVERN 1.6"
title = "Mechanisms are in place to inventory AI systems and are resourced according to organizational risk priorities."
[[id]]
code = "GOVERN 1.7"
title = "Processes and procedures are in place for decommissioning and phasing out AI systems safely."
[[id]]
code = "GOVERN 2.1"
title = "Roles and responsibilities and lines of communication related to mapping, measuring, and managing AI risks are documented."
[[id]]
code = "GOVERN 2.2"
title = "The organization's personnel and partners receive AI risk management training."
[[id]]
code = "GOVERN 2.3"
title = "Executive leadership of the organization takes responsibility for decisions about risks associated with AI system development and deployment."
[[id]]
code = "GOVERN 3.1"
title = "Decision-making related to mapping, measuring, and managing AI risks throughout the lifecycle is informed by a diverse team."
[[id]]
code = "GOVERN 3.2"
title = "Policies and procedures are in place to define and differentiate roles and responsibilities for human-AI configurations and oversight."
[[id]]
code = "GOVERN 4.1"
title = "Organizational policies and practices are in place to foster a critical thinking and safety-first mindset."
[[id]]
code = "GOVERN 4.2"
title = "Organizational teams document the risks and potential impacts of the AI technology they design, develop, deploy, evaluate, and use."
[[id]]
code = "GOVERN 4.3"
title = "Organizational practices are in place to enable AI testing, identification of incidents, and information sharing."
[[id]]
code = "GOVERN 5.1"
title = "Organizational policies and practices are in place to collect, consider, prioritize, and integrate feedback from those external to the team."
[[id]]
code = "GOVERN 5.2"
title = "Mechanisms are established to enable the team to regularly incorporate adjudicated feedback from relevant AI actors."
[[id]]
code = "GOVERN 6.1"
title = "Policies and procedures are in place that address AI risks associated with third-party entities."
[[id]]
code = "GOVERN 6.2"
title = "Contingency processes are in place to handle failures or incidents in third-party data or AI systems deemed to be high-risk."
[[id]]
code = "MANAGE 1.1"
title = "A determination is made as to whether the AI system achieves its intended purposes and stated objectives and whether its development or deployment should proceed."
[[id]]
code = "MANAGE 1.2"
title = "Treatment of documented AI risks is prioritized based on impact, likelihood, and available resources or methods."
[[id]]
code = "MANAGE 1.3"
title = "Responses to the AI risks deemed high priority, as identified by the MAP function, are developed, planned, and documented."
[[id]]
code = "MANAGE 1.4"
title = "Negative residual risks (defined as the sum of all unmitigated risks) to both downstream acquirers of AI systems and end users are documented."
[[id]]
code = "MANAGE 2.1"
title = "Resources required to manage AI risks are taken into account, along with viable non-AI alternative systems, approaches, or methods."
[[id]]
code = "MANAGE 2.2"
title = "Mechanisms are in place and applied to sustain the value of deployed AI systems."
[[id]]
code = "MANAGE 2.3"
title = "Procedures are followed to respond to and recover from a previously unknown risk when it is identified."
[[id]]
code = "MANAGE 2.4"
title = "Mechanisms are in place and applied, and responsibilities are assigned and understood, to supersede, disengage, or deactivate AI systems that demonstrate performance or outcomes inconsistent with intended use."
[[id]]
code = "MANAGE 3.1"
title = "AI risks and benefits from third-party resources are regularly monitored, and risk controls are applied and documented."
[[id]]
code = "MANAGE 3.2"
title = "Pre-trained models which are used for development are monitored as part of AI system regular monitoring and maintenance."
[[id]]
code = "MANAGE 4.1"
title = "Post-deployment AI system monitoring plans are implemented, including mechanisms for capturing and evaluating input from users and other relevant AI actors, appeal and override, decommissioning, incident response, recovery, and change management."
[[id]]
code = "MANAGE 4.2"
title = "Measurable activities for continual improvements are integrated into AI system updates and include regular engagement with interested parties, including relevant AI actors."
[[id]]
code = "MANAGE 4.3"
title = "Incidents and errors are communicated to relevant AI actors, including affected communities. Processes for tracking, responding to, and recovering from incidents and errors are followed and documented."
[[id]]
code = "MAP 1.1"
title = "Intended purposes, potentially beneficial uses, context-specific laws, norms and expectations, and prospective settings in which the AI system will be deployed are understood and documented."
[[id]]
code = "MAP 1.2"
title = "Interdisciplinary AI actors, competencies, skills, and capacities for establishing context reflect demographic diversity and broad domain and user experience expertise."
[[id]]
code = "MAP 1.3"
title = "The organization's mission and relevant goals for AI technology are understood and documented."
[[id]]
code = "MAP 1.4"
title = "The business value or context of business use has been clearly defined or re-evaluated."
[[id]]
code = "MAP 1.5"
title = "Organizational risk tolerances are determined and documented."
[[id]]
code = "MAP 1.6"
title = "System requirements (e.g., \"the system shall respect the privacy of its users\") are elicited from and understood by relevant AI actors."
[[id]]
code = "MAP 2.1"
title = "The specific tasks and methods used to implement the tasks that the AI system will support are defined."
[[id]]
code = "MAP 2.2"
title = "Information about the AI system's knowledge limits and how system output may be utilized and overseen by humans is documented."
[[id]]
code = "MAP 2.3"
title = "Scientific integrity and TEVV considerations are identified and documented, including those related to experimental design, data collection and selection, and construct validation."
[[id]]
code = "MAP 3.1"
title = "Potential benefits of intended AI system functionality and performance are examined and documented."
[[id]]
code = "MAP 3.2"
title = "Potential costs, including non-monetary costs, which result from expected or realized AI errors or system functionality and trustworthiness are examined and documented."
[[id]]
code = "MAP 3.3"
title = "Targeted application scope is specified and documented based on the system's capability, established context, and AI system categorization."
[[id]]
code = "MAP 3.4"
title = "Processes for operator and practitioner proficiency with AI system performance and trustworthiness are defined, assessed, and documented."
[[id]]
code = "MAP 3.5"
title = "Processes for human oversight are defined, assessed, and documented in accordance with organizational policies."
[[id]]
code = "MAP 4.1"
title = "Approaches for mapping AI technology and legal risks of its components are in place."
[[id]]
code = "MAP 4.2"
title = "Internal risk controls for components of the AI system, including third-party AI technologies, are identified and documented."
[[id]]
code = "MAP 5.1"
title = "Likelihood and magnitude of each identified impact based on expected use, past uses of AI systems in similar contexts, public incident reports, feedback, or other data are identified and documented."
[[id]]
code = "MAP 5.2"
title = "Practices and personnel for supporting regular engagement with relevant AI actors and integrating feedback about positive, negative, and unanticipated impacts are in place and documented."
[[id]]
code = "MEASURE 1.1"
title = "Approaches and metrics for measurement of AI risks enumerated during the MAP function are selected for implementation."
[[id]]
code = "MEASURE 1.2"
title = "Appropriateness of AI metrics and effectiveness of existing controls are regularly assessed and updated."
[[id]]
code = "MEASURE 1.3"
title = "Internal experts who did not serve as front-line developers for the system and/or independent assessors are involved in regular assessments and updates."
[[id]]
code = "MEASURE 2.1"
title = "Test sets, metrics, and details about the tools used during TEVV are documented."
[[id]]
code = "MEASURE 2.2"
title = "Evaluations involving human subjects meet applicable requirements and are representative of the relevant population."
[[id]]
code = "MEASURE 2.3"
title = "AI system performance or assurance criteria are measured qualitatively or quantitatively and demonstrated for conditions similar to deployment settings."
[[id]]
code = "MEASURE 2.4"
title = "The functionality and behavior of the AI system and its components - as identified in the MAP function - are monitored when in production."
[[id]]
code = "MEASURE 2.5"
title = "The AI system to be deployed is demonstrated to be valid and reliable."
[[id]]
code = "MEASURE 2.6"
title = "The AI system is evaluated regularly for safety risks."
[[id]]
code = "MEASURE 2.7"
title = "AI system security and resilience - as identified in the MAP function - are evaluated and documented."
[[id]]
code = "MEASURE 2.8"
title = "Risks associated with transparency and accountability - as identified in the MAP function - are examined and documented."
[[id]]
code = "MEASURE 2.9"
title = "The AI model is explained, validated, and documented, and AI system output is interpreted within its context."
[[id]]
code = "MEASURE 2.10"
title = "Privacy risk of the AI system - as identified in the MAP function - is examined and documented."
[[id]]
code = "MEASURE 2.11"
title = "Fairness and bias - as identified in the MAP function - are evaluated and results are documented."
[[id]]
code = "MEASURE 2.12"
title = "Environmental impact and sustainability of AI model training and management activities - as identified in the MAP function - are assessed and documented."
[[id]]
code = "MEASURE 2.13"
title = "Effectiveness of the employed TEVV metrics and processes in the MEASURE function are evaluated and documented."
[[id]]
code = "MEASURE 3.1"
title = "Approaches, personnel, and documentation are in place to regularly identify and track existing, unanticipated, and emergent AI risks."
[[id]]
code = "MEASURE 3.2"
title = "Risk tracking approaches are considered for settings where AI risks are difficult to assess using currently available measurement techniques."
[[id]]
code = "MEASURE 3.3"
title = "Feedback processes for end users and impacted communities to report problems and appeal system outcomes are established and integrated."
[[id]]
code = "MEASURE 4.1"
title = "Measurement approaches for identifying AI risks are connected to deployment context(s) and informed through consultation with domain experts and relevant AI actors."
[[id]]
code = "MEASURE 4.2"
title = "Measurement results regarding AI system trustworthiness in deployment context(s) and across the AI lifecycle are informed by input from domain experts and relevant AI actors."
[[id]]
code = "MEASURE 4.3"
title = "Measurable performance improvements or declines based on consultations with relevant AI actors are identified and documented."
