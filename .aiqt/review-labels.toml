# Review and work label shapes that tools/check_review_labels.py refuses on added lines.
#
# Each [[shape]] is one Python regular expression, compiled with re.ASCII (and re.IGNORECASE when
# ignore-case is true) and searched in every line added relative to the merge base with the
# protected branch. A comment, docstring, test name or message says what the code guards and why,
# never which review cycle, finding or tracker item asked for it. A line that has to quote such a
# label on purpose carries the allow-marker below, which exempts that one line and no other.
#
# Keys: format-version (1), allow-marker (a word of letters, digits and hyphens), an optional
# exclude-paths array, and one or more [[shape]] tables with id (lower-case words joined by hyphens,
# unique), description, regex and an optional ignore-case (a boolean, false when absent). Any other
# key, a regex that does not compile and a regex that matches an empty line are refused, and the gate
# then cannot evaluate (exit 2).
format-version = 1
allow-marker = "review-label-allow"

# exclude-paths: the closed, reviewed list of files whose added lines are not judged at all. Each entry
# is a normalized relative path that must name a regular file in the working tree (a missing path, a
# directory or a symlink is refused, exit 2). Every entry carries its justification on the line above
# it; a new entry needs the same review, because a label added anywhere in a listed file is not caught.
exclude-paths = [
    # The sibling internal-names gate refuses review-cycle vocabulary, so its source, messages and
    # self-test vectors have to name it; its own gate covers that file.
    "tools/check_internal_names.py",
    # That gate's ratchet baseline: its canonical render writes one count key per shape, the review
    # and round key among them, and refuses any other spelling, so lowering a count on the normal
    # label-cleanup path rewrites such a line; the sibling gate holds the file to its closed schema.
    ".aiqt/tracker-label-baseline.toml",
    # The gates manifest: the sibling gate's residue is one physical line that has to name the same
    # vocabulary, so any edit to it rewrites that line. The whole file is excluded, every other gate
    # residue in it included; this is a disclosed limit of the gate.
    ".aiqt/core/gates/manifest.toml",
]

# The test name may start after an underscore and is matched in any case.
[[shape]]
id = "review-test-name"
description = "a test name numbered after a review cycle"
regex = '(?<![A-Za-z0-9])test_r[0-9]+[a-z]?_'
ignore-case = true

# The r is lower case only: an upper-case R and a digit in parentheses is a rule number in this pack's
# prose ("(R1 execution verbs ...)"), not a review cycle. Square brackets are matched like parentheses.
[[shape]]
id = "review-tag"
description = "a parenthesised or bracketed review or QA cycle tag"
regex = '[(\[](?:r|[Qq][Aa])[0-9]+[a-z]?:?[ \t]+(?!(?:and|or|not|in|is|if|else|for)\b)[A-Za-z]'

# The word may follow an underscore and be joined to its number by one (a snake_case name).
[[shape]]
id = "round-number"
description = "a numbered round (a retry round and a count of rounds are not one)"
regex = '(?<!retry )(?<![A-Za-z0-9])round[ \t_-]?#?[0-9]+\b(?!\s+of\b)'
ignore-case = true

[[shape]]
id = "review-cycle-words"
description = "the words review and round side by side"
regex = '\breview[ \t-]round\b'
ignore-case = true

[[shape]]
id = "finding-number"
description = "a numbered review finding"
regex = '\bfinding[ -]?#?[0-9]+\b'
ignore-case = true

# A fix-round id (the backlog id, a hyphen, an R and the round) is matched by the backlog id it starts with.
[[shape]]
id = "backlog-id"
description = "a tracker backlog id"
regex = '\bFIX-[0-9]+(?:-R[0-9]+)?\b'

# Upper-case QA joined to its number directly, by a hyphen, an underscore or by one space, alone or after
# a reviewer family name, and optionally followed by one lower-case letter or an F and a number; a hyphen
# or an underscore before it is allowed, so a QA tag inside a longer id or a snake_case name is caught
# too. The word QA alone and a lower-case token (a path or a process-search pattern) pass.
[[shape]]
id = "qa-round"
description = "a QA round number"
regex = '(?<![A-Za-z0-9])QA[ \t_-]?[0-9]+(?:[a-z]|F[0-9]+)?(?![0-9A-Za-z])'

# A reviewer family name (any case) and an upper-case severity grade side by side, in either order: the
# family first may be one of several joined by a slash, may carry a possessive and a numbered round
# before the grade, and may be joined to it by one comma, colon, semicolon, parenthesis, square bracket,
# backtick or hyphen; the grade first may carry its number and be joined to the family by spaces, a
# parenthesis, a square bracket, a backtick, a slash or a hyphen only, so rule text that lists the grades
# and then the families after a comma or a semicolon passes. A grade word alone, a family name alone and
# a lower-case grade (ordinary prose) pass, and so does a family name that opens a file name (a dot and a
# letter after it) or a product name (the word code after it, as in a release note's "MINOR Claude Code
# changes").
[[shape]]
id = "reviewer-grade"
description = "a reviewer family name beside a severity grade"
regex = '(?<![A-Za-z0-9_])(?i:codex|claude|gemini|fable)(?:\x27s)?(?:[ \t]*/[ \t]*(?i:codex|claude|gemini|fable))*(?:[ \t,-]+(?i:round|r)[ \t-]?[0-9]+)?[ \t]*[,:;(\[\x60-]?[ \t]*(?:BLOCKER|MAJOR|MEDIUM|MINOR)(?![A-Za-z_])|(?<![A-Za-z0-9_])(?:BLOCKER|MAJOR|MEDIUM|MINOR)(?:[ \t-]?[0-9]+)?(?:[ \t]*[(/\[\x60][ \t]*|[ \t]+|-)(?i:codex|claude|gemini|fable)(?![A-Za-z0-9_]|\.[A-Za-z]|[ \t-]+(?i:code)(?![A-Za-z0-9_]))'
