# The OPF consumer-switch list: every tool under tools/ that the static scan in
# tools/check_record_readers.py detects as reading this project's records, each with the disposition it
# takes when the project's records move into the OPF store. A detected reader that is not listed fails, and
# a listed file that is gone or no longer detected fails. The scan sees only the forms its docstring names;
# a read it cannot see (its docstring lists them) is not established by this list. A later switch flips one
# entry's disposition.
#
# [detect] declares what the scan looks for (see the gate's docstring for each rule):
#   names    record file names, matched as a whole string constant or as its end after "/", ":" or "}"
#   keys     orchestration-registry keys that name a record, matched as subscript or .get reads or as an
#            element of a literal collection a loop iterates; together with [detect.non-record-keys] it
#            must hold every key the hook library (.aiqt/core/hooks/scripts/aiqt_hooks.py) derives: every
#            registry access there must be an accepted read form (R.get(K), R.get(K, default), R[K],
#            (R or {}).get(K) or (R or {})[K], K a string constant or a literal-loop variable) yielding
#            its key, or be excused by a [[detect.registry-use]] entry below (a line-anchor of one or
#            more whole source lines that matches the hook library exactly once, a reason, and the
#            keys-read the author asserts for that use, which join the derived set); any other registry
#            use fails the gate. [detect.non-record-keys] excludes, with a reason, each derived key
#            that names no record path.
#   flags    command-line flags that take a record path
#   modules  record-reading modules; importing one (import, import_module or __import__), or naming its
#            .py file, makes the file an indirect reader
#
# Each [[reader]] has path, records, disposition and reason. Dispositions:
#   switch               reads records that move into the store; switched in a later step
#   stays-outside-store  reads records that stay outside the store for the reason given
#   fixture-only         only writes or names record fixtures in its own self-test
#   not-a-reader         detected by a rule but reads no project record (the reason says why)
#   indirect-via:<path>  reads only through another listed entry

format-version = 1

[detect]
names = ["TODO.md", "changelog.toml", "roadmap.toml", "pending-fixes.toml", "orchestration.json", "orchestration.local.json"]
keys = ["mistakes_register", "attestations", "pending_decisions", "handoff", "findings", "mode", "state_dir", "lease", "record"]
flags = ["--backlog"]
modules = ["aiqt_hooks", "check_mistakes_register"]

[detect.non-record-keys]
ts = "Read at the escape-spoof sentinel surface, where rec is the parsed sentinel object sharing a receiver name; a timestamp, not a record path."
detail = "Read at the escape-spoof sentinel surface, where rec is the parsed sentinel object sharing a receiver name; a detail string, not a record path."
escape = "The operator escape declaration block; its nested path names an escape sentinel the hooks probe, not a project record the switch would flip."
enumerator = "The backlog enumerator declaration (an argv array), not a record path."
staleness = "The staleness policy object (hour bounds), not a record path."
yield_tools = "A list of tool names the yield guard scopes to, not a record path."
dispatch_tools = "A list of tool names the dispatch ledger guard scopes to, not a record path."
review_dispatch = "The review dispatch binding object, not a record path."
companion_stores = "The declared companion store roots the write guard admits, not a project record the switch would flip."

