    "tools/_opf_adopt_plan.py",
    "tools/_opf_adopt_state.py",
    "tools/_opf_changelog.py",
    "tools/_opf_check.py",
    "tools/_opf_declaration.py",
    "tools/_opf_emit.py",
    "tools/_opf_fuzz.py",
    "tools/_opf_import_batch.py",
    "tools/_opf_import_complete.py",
    "tools/_opf_init.py",
    "tools/_opf_init_contract.py",
    "tools/_opf_init_operation.py",
    "tools/_opf_init_substrate.py",
    "tools/_opf_observe.py",
    "tools/_opf_oplock.py",
    "tools/_opf_pack_manifest.py",
    "tools/_opf_record.py",
    "tools/_opf_release.py",
    "tools/_opf_release_history.py",
    "tools/_opf_schema.py",
    "tools/_opf_store.py",
    "tools/_opf_views.py",
    "tools/_opf_worklog.py",
    "tools/_opf_worklog_regressions.py",
    "tools/_opf_write_guard.py",
    "tools/check_opf_doctor.py",
    "tools/check_opf_drift.py",
    "tools/check_opf_homes.py",
    "tools/check_opf_host_pin.py",
    "tools/check_opf_init.py",
    "tools/check_opf_init_contract.py",
    "tools/check_opf_init_observe.py",
    "tools/check_opf_init_p0.py",
    "tools/check_opf_init_qa.py",
    "tools/check_opf_prompt_pack.py",
    "tools/check_opf_python_floor_policy.py",
    "tools/check_opf_record.py",
    "tools/check_opf_selftest_execution.py",
    "tools/check_python_floor.py",
    "tools/opf.py",
    "tools/selftest_commonmark_conformance.py",
    "tools/selftest_commonmark_headings.py",
]
nonblocking-surfaces = []
completeness-check = true
documentation-check = true
workflow-dir = ".github/workflows"
workflow-files = [
    ".github/workflows/quality.yml",
]
host-patch-workflow = ".github/workflows/quality.yml"
host-patch-jobs = [
    "opf-host-patch",
]
adopter-templates = [
    "enforcement/ci/github-actions.yml",
]
doctor-templates = [
    "tools/check_opf_doctor.py",
]
declaration-files = [
    "README.md",
    "prompt-pack/adopt/SKILL.md",
    "prompt-pack/import/SKILL.md",
    "site/adopt.md",
    "site/adopt/index.html",
    "site/draft-src/adopt.toml",
    "spec/OPF-QUICKSTART.md",
]
declaration-copies = {}
excluded-trees = [
    "tools/_vendor/",
]
tomllib-table = "tools/tomllib_parse_sites.toml"
