[[body]]
component = "section"
lbl = "In the box"
heading = "What is in the box"

[[body]]
component = "figures"

[[body.items]]
num = "12"
cap = "baseline record types"

[[body.items]]
num = "13"
cap = "generated views"

[[body.items]]
num = "10"
cap = "command verbs"

[[body]]
component = "prose"
html = "<p>The specification defines 12 baseline record types and 10 command verbs; the reference scaffold declares 13 generated views. The record types are 11 typed indexes plus the worklog ledger, each with a closed schema that refuses what does not fit. The scaffold declares 12 Markdown views and 1 TOML projection. The verbs: init, adopt, import, doctor, render, migrate, sync, upgrade, absorb, record.</p>"

[[body]]
component = "section"
lbl = "Limits"
heading = "What the checks establish"

[[body]]
component = "prose"
html = "<p>Schema validation and drift checks are intended to catch structural defects; they do not establish that a record's claims are true. Review recorded claims against their evidence.</p>"

[[body]]
component = "next"
html = "Next, read the manifest that declares every pair and the 4 files beside it."
text = "The 5 core store files"
href = "core-files/"
