# The opfiles.ai draft model page: Figure 1 (the source, the view and the drift gate), 1 record beside its
# generated view, what is in the box, and what the checks establish (template reference/document.html;
# specification 7.5 to 7.11 and 7.18).
path = "model/index.html"
title = "The model"
kind = "document"
label = "The model"
heading = "Source, view, and drift gate"
meta = "The source leads to the view: every view is regenerated from its declared sources, never edited by hand. Configured as a required commit or CI check, the gate re-renders and compares the bytes; if the source and the view disagree, the build fails."

[[body]]
component = "label"
text = "Model"

[[body]]
component = "figure"
id = "fig-1"
caption = "Figure 1. The source is what your tools and assistants write; the view is what your people read. When configured as a required check, a gate compares the view with a fresh render of its sources."
under = "the gate re-renders the view from its declared sources and compares the bytes"

[[body.items]]
t = "Source"
m = "backlog_item.index.toml"
s = "machine-written TOML"
edge = "generate"

[[body.items]]
t = "View"
m = "BACKLOG.md"
s = "generated, human-readable"
edge = "compare"

[[body.items]]
t = "Drift gate"
m = "opf render --check"
s = "regenerate and diff"

[[body]]
component = "section"
lbl = "In 1 file"
heading = "Edit the source. Run the renderer. Check the view."

[[body]]
component = "srcview"
id = "backlog-source"
source_label = ".working/toml/backlog_item.index.toml"
view_label = ".working/BACKLOG.md"
gen = "Generated by <code>opf render --write</code> from <code>backlog_item.index.toml</code> and <code>block.index.toml</code>. Do not edit; edit the store and regenerate."
heading = "BACKLOG"
text = '''schema = 1
[[record]]
id = "BI-1"
type = "backlog_item"
status = "active"
title = "Add the drift gate to CI"
created_at = "2026-09-01T14:02:11Z"
updated_at = "2026-09-04T09:37:48Z"
actor = { kind = "assistant" }'''
note = "Illustrative excerpt. You edit the TOML. The Markdown is generated. When configured as a required check, the gate compares the view with a fresh render of its sources."

[[body.items]]
