# The opfiles.ai draft standard page: the scope, the links to the canonical specification and
# quickstart, what the specification defines, the conformance keywords and the draft status
# (template reference/document.html; specification sections 7.5, 7.9, 7.10, 7.13 and 7.14).
path = "standard/index.html"
title = "The standard"
kind = "document"
label = "The standard"
heading = "The specification, and how to read it"
meta = "OPFiles is defined by a written specification. The canonical specification and quickstart are the Markdown source in the repository, linked here directly."

[[body]]
component = "scope"
html = "The standard requires a tracked git store and a review flow. Schema and drift checks are intended to catch structural defects; review recorded claims against their evidence. <code>migrate</code> and <code>sync</code> are specified, not yet implemented; <code>upgrade</code> and <code>import</code> refuse with exit 2. <code>opf adopt</code> cannot finish yet: <code>apply</code> refuses every plan and <code>complete</code> refuses with exit 2. The reference tooling does not yet implement the full specification base: it initializes stores at the earlier base version stated in the release line below."

[[body]]
component = "release"

[[body]]
component = "prose"
html = '''<p><a href="https://github.com/jposluns/guardrails/blob/main/opf/spec/OPF-SPEC.md" target="_blank" rel="noopener noreferrer">Read OPF-SPEC.md<span class="vh"> (opens in a new tab)</span></a>; <a href="https://github.com/jposluns/guardrails/blob/main/opf/spec/OPF-QUICKSTART.md" target="_blank" rel="noopener noreferrer">read the quickstart<span class="vh"> (opens in a new tab)</span></a>.</p>'''

