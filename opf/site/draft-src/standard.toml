[[body]]
component = "section"
lbl = "Conformance"
heading = "Conformance language"

[[body]]
component = "prose"
html = "<p>Conformance language follows common standards practice; statements without these keywords are descriptive.</p>"

[[body]]
component = "table"
caption = "Conformance language"
head = ["Keyword", "Meaning"]
rows = [
    ["MUST", "An absolute requirement."],
    ["MUST NOT", "An absolute prohibition."],
    ["SHOULD", "A strong recommendation, departed from only for a recorded reason."],
    ["MAY", "Genuinely optional."],
]

[[body]]
component = "section"
lbl = "Draft status"
heading = "Draft status and self-asserted conformance"

[[body]]
component = "callout"
label = "Rule"
rule = true
html = "<p>The specification is a working draft and the reference tooling lands verb by verb. Until the validation tooling covers a given claim, conformance to that claim is self-asserted, and a report says so: an unqualified \"conformant\" claim is never emitted, by tooling or by prose.</p>"

[[body]]
component = "prose"
html = "<p>The specification is dated 2026-10-24.</p>"

