title = "Know the core store files"
n = "5 files"
d = "The manifest, the ID counters, the version ledger, the worklog, and the lease."

[[body.items]]
href = "adopt/"
title = "Adopt it"
n = "10 verbs"
d = "Ask your assistant for a plan, review it, then authorize; the 10 command verbs and their status."

[[body]]
component = "value"
html = "OPFiles keeps each record in a fixed, machine-written form and generates the readable version from it; a check, set as a required step, fails the moment the 2 disagree. The standard forbids reusing a record's number or deleting a record. It is <a href=\"$BASE/license/\">open source under the Apache License 2.0</a>. The specification is a working draft; 2 of its 10 commands are not yet implemented, and adoption cannot finish yet."

[[body]]
component = "about"
