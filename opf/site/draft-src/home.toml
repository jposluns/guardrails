# (template specification sections 7.2 to 7.4 and 7.24).
path = "index.html"
title = "Home"
kind = "landing"

[[body]]
component = "hero"
kicker = "Record, render, check, commit."
statement = "Operational records, <em>governed like code.</em>"
intro = "Project records kept in chat logs and hand-edited Markdown drift from what the tools did, so nobody can cite them in a review, an audit, or a handover. OPFiles pairs machine-written TOML records with generated human-readable views. A drift gate, configured as a required check, re-renders the declared views and fails the build when a view and its sources disagree."
start_text = "See how it holds together"
start_href = "model/"

[[body]]
component = "entries"

[[body.items]]
href = "model/"
title = "See the model"
n = "3 parts"
d = "Source, view, and drift gate in 1 diagram, with a TOML record beside the Markdown it generates."

[[body.items]]
