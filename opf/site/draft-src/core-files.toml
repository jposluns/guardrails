# The opfiles.ai draft core files page (template reference/reference.html): the 5 core store files in
# full, then the record indexes and the files around them, 1 line each. The section and heading ids are
# the 20 short-link anchors of opf/site/_redirects, so every kept anchor resolves on this page.
path = "core-files/index.html"
title = "Technical details"
kind = "document"
label = "Reference"
heading = "Technical details: the store and the tooling"
meta = "The store's control and ledger files: the manifest that declares the store, the ID counters, the version ledger, the worklog (appended per change, correctable until released, then frozen), and the concurrency lease. The record indexes and the files around them follow, 1 line each, then the reference tooling: its commands, what it checks, and how to verify it."

[[body]]
component = "section"
lbl = "manifest.toml"
id = "manifest"
heading = "The store manifest"
rail = "The store manifest"

[[body]]
component = "lead"
html = '''The store's control document and discovery marker: declarations for its schema, types, views, modules, and enforcement posture. Closed keysets throughout: an unknown key in any base section is a validation finding. The base <code>[opf]</code> table carries the exact discovery token <code>standard = "opf"</code>, the spec version the store conforms to, and the homes generation. The base of a spec 2.0.0 store:'''

[[body]]
component = "code"
id = "manifest-toml"
file = ".working/toml/manifest.toml"
text = '''[opf]
standard = "opf"
spec_version = "2.0.0"
homes = 2
layout = "inline"
posture = "required"
import_status = "none"

[modules]
governance = false'''

[[body]]
component = "callout"
label = "Note"
html = '''<p>The reference tooling does not yet implement spec 2.0.0: its scaffold still writes <code>spec_version = "1.2.0"</code> with no <code>homes</code> key.</p>'''

[[body]]
component = "subhead"
heading = "The top-level tables"

[[body]]
component = "label"
text = "11 tables"

[[body]]
component = "table"
caption = "The top-level tables of the store manifest"
head = ["Table", "Holds"]
rows = [
  # The trailing space in this first cell is deliberate: with the tags stripped, it keeps "[opf]" and
  # "standard" apart, so the row reads as the pinned text check_opf_homes.py holds this page to.
  ["<code>[opf]</code> ","standard, spec_version, homes (2), layout (inline | per-record), posture (off | warn | required), import_status (none | partial | complete)"],
  ["<code>[store]</code>", "sync_target (empty under the in-repo default)"],
  ["<code>[modules]</code>", "governance, delivery_assurance, operational_policy, concurrent_operation"],
  ["<code>[profiles.*]</code>", "additive requirement bundles; may only add requirements"],
  ["<code>[types.*]</code>", "1 table per enabled type, carrying its normative namespace"],
  ["<code>[providers.*]</code>", "handler and roles (create, auth, sync); local-directory and generic-git-remote ship as universal fallbacks"],
  ["<code>[views.*]</code>", "kind (deterministic, composed or projection), sources, target"],
  ["<code>[deliverables.*]</code>", "the curated CHANGELOG.md declaration"],
  ["<code>[archive]</code>", "period (\"year\")"],
  ["<code>[unmanaged]</code>", "pre-existing files kept in place, enumerated"],
  ["<code>[vendors]</code>", "registered x-&lt;vendor&gt; extension namespaces"],
]

[[body]]
component = "pullquote"
html = "Declare the store contract so tools need not infer it."

[[body]]
component = "prose"
html = "<p>A tool validates the base before operating, enforces only what is declared, and records a profile it does not support as present-but-unevaluated rather than failing over it. Tooling locates the machine store by finding exactly 1 immediate subdirectory of <code>.working/</code> whose manifest declares the token. 0 matches or more than 1 stops the tool, never guesses.</p>"

