[[body]]
component = "section"
lbl = "Tooling"
heading = "The reference tooling"
id = "tooling"
rail = "Tooling"

[[body]]
component = "prose"
html = '''<p>The <code>opf</code> reference CLI is 1 implementation of the standard's 10 command verbs. It implements 5 in full (init, render, doctor, absorb, and record) and adopt in part; upgrade and the ordinary import modes refuse with exit 2, and migrate and sync are planned. A base adopter can use their own tooling instead, or adopt by hand.</p>'''

[[body]]
component = "table"
caption = "The command verbs"
head = ["Verb", "What it does"]
rows = [
  ["<code>init</code>", "Scaffolds validated store sources and the committed pointer; surfaces, never absorbs, anything already at the store location."],
  ["<code>render</code>", "Regenerates the declared views. <code>--check</code> compares bytes read-only and exits 1 on drift."],
  ["<code>doctor</code>", "Runs the whole-store integrity layer read-only: exit 0 valid, 1 on a finding, 2 when it cannot evaluate."],
  ["<code>absorb</code>", "Drafts changelog entries for human curation, or computes a curated entry's freeze digest; writes no files."],
  ["<code>record</code>", "Authors 1 record change at a time and leaves it uncommitted for your review."],
  ["<code>adopt</code>", "Plan, approve, reconcile, and status run; apply and complete refuse, so adoption cannot finish yet."],
  ["<code>upgrade</code>", "Refuses with exit 2 and writes nothing: the reference tooling defines no store upgrade."],
  ["<code>import</code>", "The ordinary modes are retired and refuse with exit 2; clean-start adoption is the intake."],
  ["<code>migrate</code>", "Planned: relocate the whole store, keeping git history and the worklog."],
  ["<code>sync</code>", "Planned: the pull and push step of the store consistency contract."],
]

[[body]]
component = "section"
lbl = "Coverage"
heading = "What doctor checks"
id = "doctor-checks"

[[body]]
component = "prose"
html = '''<p>Schema validity; ID uniqueness and counter monotonicity; bidirectional index reconciliation; transition legality where observations suffice; byte drift for the declared baseline views; the root release-version file; worklog span tiling and frozen digests; changelog coverage and freeze; archive integrity; the tracked-store requirement; pointer and sync-target agreement; and path containment. At the strictest posture, an unreadable, unparseable, or unresolvable declared input is a failure, never an empty or clean result.</p>'''

[[body]]
component = "section"
lbl = "Integrity"
heading = "Verify what you install"
id = "integrity"

[[body]]
component = "prose"
html = '''<p>Before applying a downloaded pack, compare its digest with the reference published for that release at <a href="https://posluns.dev/hashes.txt" target="_blank" rel="noopener noreferrer">posluns.dev/hashes.txt<span class="vh"> (opens in a new tab)</span></a>, and refuse on a mismatch. The tooling also checks its own declaration file, <code>opf/tools/opf-declaration.toml</code>, against a shipped digest before it touches a store, and refuses with exit 2 if the file is missing or altered. <code>python3 -I -B opf/tools/opf.py --declaration</code> runs that check alone.</p>'''

[[body]]
component = "code"
id = "declaration"
file = "opf/tools/opf-declaration.toml"
text = '''release = "1.0.5"
spec_version = "1.2.0"
homes = 1
worklog = 1'''

