# The opfiles.ai draft adopt page (template reference/document.html): the assistant-led path in 3 steps,
# then the 10 command verbs and their status as the reference CLI dispatches them.
path = "adopt/index.html"
title = "Adopt"
kind = "document"
label = "Adopt"
heading = "Ask your assistant for a plan. Review it, then authorize."
meta = "Ask your AI development assistant to read the standard, inspect your project, and propose an adoption plan naming what it would create, import, or retire. Review that plan before authorizing changes, then inspect the scaffolded store and validation results. In this build the reference tooling stops after approval."

[[body]]
component = "label"
text = "Copy this prompt"

[[body]]
component = "code"
id = "adopt-prompt"
variant = "prompt-block"
text = "Read https://opfiles.ai/llms.txt and https://opfiles.ai/adopt.md, then inspect this project and propose a plan to adopt OPFiles (OPF). The plan should name every file you would create, import, or retire, and why. Do not change any files until I have reviewed and approved the plan."
note = "Paste it into your AI development assistant. It proposes a plan and waits for your approval before changing anything."

[[body]]
component = "label"
text = "How"

[[body]]
component = "steps"
items = [
  '''Give your assistant this site's machine-readable entry point, <a href="/llms.txt"><code>/llms.txt</code></a>, and the adoption guide, <a href="/adopt.md"><code>/adopt.md</code></a>, as the starting material.''',
  "Review the plan it proposes: what it would create, import, or retire.",
  "Authorize, then inspect the scaffolded store and the validation results (the reference tooling cannot apply a plan yet).",
]

[[body]]
component = "prose"
html = "<p>Adopting by hand is the fallback for when you cannot use an assistant; both paths target the same store format.</p>"

[[body]]
component = "section"
lbl = "By hand"
id = "byhand"
heading = "The manual path"

[[body]]
component = "prose"
html = '''<p>The shape of the manual path is short: create the store (write the files from the specification and schemas), commit it, generate the views with <code>opf render --write</code> for a supported store or your own renderer, and then work records-first. The standard requires no particular tool. The reference tooling requires Python 3.14 or newer. It validates spec 2.0.0 stores in either layout, with limits: it does not render or drift-check per-record views, and the baseline validator reports module-tier and importer record content schemas as cannot-evaluate. For a store with module-tier or importer records, or a per-record store that declares views, doctor's overall verdict is cannot-evaluate (exit 2).</p>
<p>The reference tooling's <code>opf init</code> scaffolds this store: base 2.0.0 with <code>homes = 2</code>. Conformance you assert by hand is self-asserted, and you should say so wherever you claim it, because no validator has checked it for you yet.</p>'''

[[body]]
component = "record"

[[body.items]]
term = "manifest.toml"
html = '''The control document. It declares <code>standard = "opf"</code> (the exact discovery token) in its <code>[opf]</code> table, along with the base <code>spec_version</code> you conform to (<code>"2.0.0"</code>), the homes generation <code>homes = 2</code>, the storage layout, the enforcement posture, and <code>import_status</code>.'''

[[body.items]]
term = "counters.toml"
html = '''The ID high-water marks. It holds the clean row and the imported counter row (the quoted key <code>"imported:&lt;NS&gt;"</code>, at zero to start) of every enabled type.'''

[[body.items]]
term = "version.toml"
html = '''The version and release ledger: numbers, dates, spans, and digests, never release prose.'''

[[body.items]]
term = "worklog.toml"
html = '''The durable operational record: one entry per change, correctable in place until a release freezes its span, never deleted. It is a ledger kept as a single file in either layout, not a typed index.'''

[[body.items]]
term = "Typed indexes"
html = '''The eleven baseline typed indexes, each a <code>.index.toml</code> file that starts with no records, in the canonical form the reference tooling writes, never as a zero-byte file.'''

[[body]]
component = "prose"
html = '''<p>The imported leaves: one <code>&lt;type&gt;.imported.index.toml</code> beside each of those eleven indexes, plus <code>worklog.imported.toml</code> for the worklog, each starting with no records in the same canonical form, never as a zero-byte file. The standard requires them in every store (OPF-SPEC.md sections 4.2 and 8.2). The "Hand-start file contents" section of OPF-QUICKSTART.md gives the exact starting bytes of these files.</p>
<p>Then write the committed pointer <code>.opf.toml</code> at your product repository root, so the store resolves from a stable location (specification section 4.3). In the manifest, a <code>[profiles.aiqt]</code> table is optional and is ignored by base-only tooling; a base adopter need not add it.</p>
<p>The illustrative base <code>[opf]</code> table of a manifest, not a complete manifest: also set <code>layout</code>, <code>posture</code> and <code>import_status</code>, register each enabled type in <code>[types]</code>, and declare views and the other settings (see <a href="$BASE/standard/">the standard</a> for the normative shape, and <a href="$BASE/core-files/">the core store files</a> for every table it can carry):</p>'''

[[body]]
component = "code"
id = "manifest-opf"
file = ".working/toml/manifest.toml"
text = '''[opf]
standard = "opf"         # the exact discovery token
spec_version = "2.0.0"   # the base spec version this store conforms to
homes = 2                # the homes generation; required, and 2 is the only value'''

[[body]]
component = "section"
lbl = "Reference tooling"
id = "tooling"
heading = "Where the reference tooling stands"

[[body]]
component = "prose"
html = '''<p>The reference tooling's <code>opf init</code> scaffolds a 2.0.0 store with <code>homes = 2</code>. The reference tooling initializes and validates spec 2.0.0 stores with <code>homes = 2</code>, the only base version the standard defines, as described above. The reference tooling defines no store upgrade: <code>opf upgrade</code> refuses every invocation with exit 2, reading and writing nothing.</p>
<p>The reference CLI runs investigation and planning today, and prints the approval without recording it; recording the approval, apply and completion are not executable yet, so the assistant stops there and reports. At base 2.0.0, <code>opf adopt plan</code>, <code>approve</code> and <code>status</code> run without reading the adoption journal, and <code>status</code> says the journal is not read. <code>opf adopt apply</code> and <code>reconcile</code> refuse with exit 2 at base 2.0.0, and <code>complete</code> refuses with exit 2, so no approval is recorded, nothing is applied, and nothing is retired.</p>'''

[[body]]
component = "prose"
html = "<p>The <code>opf</code> reference CLI, its 10 command verbs, and what each does today are on <a href=\"$BASE/core-files/#tooling\">the technical details page</a>.</p>"

[[body]]
component = "next"
html = "Back to the source, the view, and the gate."
text = "See the model"
href = "model/"
