# opf/prompt-pack/pack.toml: the OPF prompt-pack manifest, verified by opf/tools/check_opf_prompt_pack.py.
# Every file in this directory other than this manifest must be a [[members]] row (path relative to this
# directory, sha256 of its exact bytes, rows in ascending path order). The digest binds the version and
# every member row. Maintainers must update the row, version and digest when a member changes.
# The gate checks byte and digest agreement; it does not enforce the version-bump obligation.
# Member documents are consumed by deployment (an adopter or deployer copies a member beside its digest
# into the assistant harness, for example flow/SKILL.md into a skills directory), by a deployer that
# renders a member with a per-project overlay into a per-account command (the member doubles as the
# render template; its overlay slots and the drift check are specified inside the member) and, once
# the adoption stage driver lands, by a plan's prompt_pack {version, digest} binding.
format = "opf.prompt-pack/v1"
version = "0.3.0"
digest = "sha256:1d6f1a682ed025d37a531a071562a0be3f51fd49c316736000b495ffb1669865"

[[members]]
path = "flow/SKILL.md"
sha256 = "7dac45e6cc06dcce49f9e897b1e9cb5da0c6c6c0979f22efc277743bcd88a649"
