# opf/prompt-pack/pack.toml: the OPF prompt-pack manifest, verified by opf/tools/check_opf_prompt_pack.py.
# Every file in this directory other than this manifest must be a [[members]] row (path relative to this
# directory, sha256 of its exact bytes, rows in ascending path order). The digest binds the version and
# every member row. Maintainers must update the row, version and digest when a member changes.
# The gate checks byte and digest agreement; it does not enforce the version-bump obligation.
# Member documents are consumed by deployment (an adopter or deployer copies a member beside its digest
# into the assistant harness, for example flow/SKILL.md, or adopt/SKILL.md with adopt/clean-start.md,
# into a skills directory; adopt/SKILL.md asks the assistant for this manifest's version and digest, and
# names this file at the pack root, or in the reference repository when a deployment copied the member
# without it), by a deployer that renders a member with a per-project overlay into a
# per-account command (the member doubles as the render template; its overlay slots and the drift check
# are specified inside the member) and by an adoption plan's prompt_pack {version, digest} binding,
# which `opf adopt plan` takes as caller input and checks for shape only; nothing verifies that binding
# against this manifest yet.
format = "opf.prompt-pack/v1"
version = "0.5.2"
digest = "sha256:aa4ed2224a58331ae6bd9d99c6ff040af8792b71f75548674407fbf3909a8fd3"

