  # The host-patch legs. Every other job of this workflow that sets up Python pins '3.14' (Quality gates
  # sets up none); with check-latest off, the Python setup action may resolve that pin to a 3.14 already on
  # the runner rather than the newest patch release. Those jobs stay required. These five run the suites a
  # newer patch release most often breaks on the exact patch release the maintainer host runs, which
  # .aiqt/python-host.toml names, so a passing local suite predicts a required CI leg. opf-host-patch runs
  # the OPF tooling self-test, and each git-fixture-env-*-host-patch job runs one git-fixture-env suite,
  # so the four suites run as parallel jobs and the host leg takes about as long as its longest suite
  # rather than the sum of the four. These jobs are the only CI run of the OPF tooling self-test and of
  # the combined, malformed and system git-fixture-env suites: no '3.14' job runs them. Only the
  # git-fixture-env-core suite also runs on '3.14', in the git-fixture-env-core job above, the canary
  # for a newer patch release; a failure there alone is diagnostic evidence of a patch-release
  # difference, not proof that the change is innocent.
  # tools/check_python_host_pin.py holds this workflow's top-level keys (name, on, permissions,
  # jobs, and concurrency only as the pinned block) and each job whole: no job key but name, runs-on,
  # steps and the pinned heavy-job if: line, runs-on ubuntu-24.04 (on 2026-10-12 the Python versions
  # manifest listed Linux x64 builds of 3.14.4 for Ubuntu 22.04 and 24.04 only, so ubuntu-latest would
  # fail these jobs on an image without one), this checkout step as written, no env: on the job or any
  # step, one Python setup step pinning that release, the gate itself as the next step (it fails when the
  # job does not run that release) and the job's one suite, each held step with exactly name, run
  # and shell: bash; its jobs leg also runs outside these jobs, in the registry job (--jobs-only), which
  # carries no if:, so an edit here cannot silence every CI run of it.
  # The child-status probe step right after the gate is the child-status coverage gate's rule, not this
  # gate's: tools/check_child_status_coverage.py accepts the host pin step between the Python setup step
  # and the probe in these five jobs of this workflow only, and requires the probe step, named for that
  # placement, right after it.
  # All five are required through Quality gates. They are heavy jobs, so they run on a push and on a
  # merge-train-* pull request of this repository, and in no other pull request run; an edit to a pull
  # request's title or body starts no Quality run.
