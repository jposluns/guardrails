name: Quality

on:
  pull_request:
    branches: [main]
    # include `edited` so a PR title/body change re-runs the message/metadata leak scan (check_msg_leaks);
    # the default types (opened, synchronize, reopened) miss a post-check description edit.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 gives the version-monotonicity gate the changelog.toml history it compares
      # base-vs-head; fetch-tags: true is explicit (depth-0 already fetches tags) so the tag layer, once
      # a release records a tag, sees real tag objects rather than an unfetched-but-present ambiguity.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Each gate runs as its own step so a failure names itself in the UI.
      # No step carries continue-on-error: a gate that cannot fail is decorative.
      - name: Secrets (project scanner)
        run: python3 tools/check_secrets.py

      - name: Secret scan self-test
        run: python3 tools/check_secrets.py --self-test

      # gitleaks is invoked as the MIT-licensed BINARY, pinned by version and verified
      # by checksum, rather than through gitleaks/gitleaks-action. The action reports
      # its licence as NOASSERTION and has required a licence key for organization
      # repositories; the binary avoids both that and a third-party action in the
      # supply chain. Bump GITLEAKS_VERSION and GITLEAKS_SHA256 together.
      - name: Secrets (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -o gitleaks.tar.gz "$url"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks dir . --no-banner --redact --exit-code 1

      - name: Leak denylist
        run: python3 tools/check_leaks.py

      # check_leaks owns the FILE channel; check_msg_leaks (F-144) owns the channels files never touch:
      # commit messages (base..head on a PR; before..after on a push to main), PR title/body, and head
      # ref. It reads the event via $GITHUB_EVENT_NAME/$GITHUB_EVENT_PATH and fails closed on missing input.
      - name: Message/metadata leak self-test
        run: python3 tools/check_msg_leaks.py --self-test
      - name: Message/metadata leak scan
        run: python3 tools/check_msg_leaks.py

      # Portability is DISTINCT from the leak gate: the leak gate answers a confidentiality question
      # repo-wide, this answers whether the shippable surface can land on a stranger's machine unchanged
      # (no operator identity outside its attribution, no repo-operational vocabulary, no exemption
      # markers, no unscannable file classes off the allow-list). See the gate header.
      - name: Portability self-test
        run: python3 tools/check_portability.py --self-test
      - name: Portability
        run: python3 tools/check_portability.py

      - name: Dashes
        run: python3 tools/check_no_dashes.py

      - name: Internal links
        run: python3 tools/check_links.py

      - name: Site integrity
        run: python3 tools/check_site.py

      - name: Overclaim lint self-test
        run: python3 tools/check_overclaim.py --self-test

      - name: Overclaim lint
        run: python3 tools/check_overclaim.py

      - name: Footer coverage self-test
        run: python3 tools/check_footer.py --self-test

      - name: Footer coverage
        run: python3 tools/check_footer.py

      - name: Roadmap drift
        run: python3 tools/gen_roadmap.py --check

      - name: Changelog drift
        run: python3 tools/gen_changelog.py --check

      - name: Version format and single-source
        run: python3 tools/check_versions.py

      - name: Version monotonicity self-test
        run: python3 tools/check_version_monotonicity.py --self-test

      # The baseline differs by trigger: a pull_request compares against its target branch
      # (origin/$GITHUB_BASE_REF, the auto-set trusted branch name); a push probes HEAD^ first and
      # passes it as --base when it resolves, otherwise invokes the gate with no --base so the gate's
      # own root detection decides (a genuine root: NOT APPLICABLE; a shallow or broken-parent
      # history: fail-closed). The rev-parse probe is an if-guard, so its nonzero exit on a first
      # push (no HEAD^) does not abort the step under set -e.
      - name: Version monotonicity
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python3 tools/check_version_monotonicity.py --base "origin/${GITHUB_BASE_REF}"
          elif git rev-parse --verify --quiet "HEAD^" >/dev/null; then
            python3 tools/check_version_monotonicity.py --base "HEAD^"
          else
            python3 tools/check_version_monotonicity.py
          fi

      - name: Release delta self-test
        run: python3 tools/check_release_delta.py --self-test
      - name: Release delta
        run: python3 tools/check_release_delta.py
      - name: Release build self-test
        run: python3 tools/check_release_build.py --self-test
      - name: Release build
        run: python3 tools/check_release_build.py

      - name: Clause inventory self-test
        run: python3 tools/check_clauses.py --self-test
      - name: Clause inventory
        run: python3 tools/check_clauses.py --genesis

      # VER-CORE Section 12 step 6 (VC-6): migration engine, crosswalk tooling, archive. The crash-
      # injection self-test is the mandatory 9.3 gate; the live check_crosswalk leg reports NOT
      # APPLICABLE in this repo (the pack is not an adopter install), self-tested first over synthetic
      # trees. Mirrors the same legs in tools/run_all_checks.sh (roster symmetry).
      - name: Crosswalk generator self-test
        run: python3 tools/gen_crosswalk.py --self-test
      - name: Crosswalk schema drift
        run: python3 tools/gen_crosswalk.py --check
      - name: Crosswalk gate self-test
        run: python3 tools/check_crosswalk.py --self-test
      - name: Crosswalk gate
        run: python3 tools/check_crosswalk.py
      - name: Migration engine crash-injection self-test
        run: python3 tools/migrate.py --self-test

      - name: Rules self-test
        run: python3 tools/gen_rules.py --self-test
      # Ships DORMANT: no release records a [release.artifacts] table today, so the gate prints NOT
      # APPLICABLE and passes. It arms fail-closed once the content freeze records the first digests.
      - name: Artifact checksums self-test
        run: python3 tools/check_artifact_checksums.py --self-test
      - name: Artifact checksums
        run: python3 tools/check_artifact_checksums.py

      - name: Rules drift
        run: python3 tools/gen_rules.py --check

      - name: Agents drift
        run: python3 tools/gen_agents.py --check

      - name: Mappings page drift
        run: python3 tools/gen_mappings.py --check

      - name: Reference roster self-test
        run: python3 tools/gen_reference_facts.py --self-test
      - name: Reference roster drift
        run: python3 tools/gen_reference_facts.py --check

      - name: Reference facts self-test
        run: python3 tools/check_reference_facts.py --self-test
      - name: Reference facts
        run: python3 tools/check_reference_facts.py

      - name: Disclosure generator self-test
        run: python3 tools/gen_disclosure.py --self-test

      - name: Disclosure drift
        run: python3 tools/gen_disclosure.py --check

      - name: NOTICE drift
        run: python3 tools/gen_notice.py --check

      - name: CLAUDE.md drift
        run: python3 tools/gen_claude.py --check

      - name: Adapters drift
        run: python3 tools/gen_adapters.py --check
      - name: Cursor self-test
        run: python3 tools/gen_cursor.py --self-test
      - name: Cursor drift
        run: python3 tools/gen_cursor.py --check

      - name: Hooks generator self-test
        run: python3 tools/gen_hooks.py --self-test

      # gen_secret_patterns.py --check runs BEFORE the byte-copy drift gate below: a drifted generated
      # secret-pattern region in the source aiqt_hooks.py is caught here, before gen_hooks.py copies that
      # file into the plugin surface.
      - name: Secret-patterns drift
        run: python3 tools/gen_secret_patterns.py --check

      - name: Hooks drift
        run: python3 tools/gen_hooks.py --check

      - name: Hooks behaviour self-test
        run: PYTHONDONTWRITEBYTECODE=1 python3 tools/selftest_aiqt_hooks.py

      - name: Skill self-test
        run: python3 tools/gen_skill.py --self-test
      - name: Skill drift
        run: python3 tools/gen_skill.py --check

      - name: Gensrc registry self-test
        run: python3 tools/gen_gensrc.py --self-test
      - name: Gensrc registry drift
        run: python3 tools/gen_gensrc.py --check

      - name: Gensrc fail-close self-test
        run: python3 tools/check_gensrc_failclose.py --self-test
      - name: Gensrc fail-close sweep
        run: python3 tools/check_gensrc_failclose.py

      - name: Enforceability ledger self-test
        run: python3 tools/gen_enforceability.py --self-test
      - name: Enforceability ledger drift
        run: python3 tools/gen_enforceability.py --check

      - name: Renderer declaration self-test
        run: python3 tools/gen_renderers.py --self-test
      - name: Renderer declaration drift
        run: python3 tools/gen_renderers.py --check
      - name: Manifest generator self-test
        run: python3 tools/gen_manifest.py --self-test
      - name: Manifest generation drift
        run: python3 tools/gen_manifest.py --check
      - name: Manifest integrity self-test
        run: python3 tools/check_manifest.py --self-test
      - name: Manifest integrity
        run: python3 tools/check_manifest.py
      - name: Byte canon self-test
        run: python3 tools/check_byte_canon.py --self-test
      - name: Byte canon
        run: python3 tools/check_byte_canon.py
      - name: Clause inventory (manifest-SOURCES leg, armed)
        run: python3 tools/check_clauses.py --genesis --with-manifest

      - name: Rule placement
        run: python3 tools/check_rule_placement.py

      - name: Standards mappings
        run: python3 tools/check_mappings.py

      - name: Conformance suite self-test
        run: python3 tools/conformance.py --self-test

      - name: Conformance suite (reference install)
        run: python3 tools/conformance.py --root .

      # Only the deterministic self-test runs here; the real time-dependent staleness audit lives in
      # the scheduled currency.yml, never on the PR path (see that workflow's header).
      - name: Standards currency self-test
        run: python3 tools/check_standards_currency.py --self-test

  # The 3.6 checkout-byte-stability matrix: prove the .gitattributes eol=lf pinning defeats the worst
  # adopter setting on each supported platform. core.autocrlf true is set BEFORE the checkout, so the
  # fresh working tree below is materialized under the hostile setting; the byte-canon gate then runs
  # its own scan (LF only, no BOM, one trailing newline) over that tree. A CRLF conversion on checkout
  # would surface as a carriage-return finding, failing the job.
  byte-canon-matrix:
    name: Byte canon vectors (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Hostile checkout line-ending setting (before checkout)
        run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Byte canon self-test (vectors)
        run: python3 tools/check_byte_canon.py --self-test
      - name: Byte canon (full gate on this platform)
        run: python3 tools/check_byte_canon.py
