        run: python3 -I -B tools/check_byte_canon.py --self-test
      - name: Byte canon
        shell: bash
        run: python3 -I -B tools/check_byte_canon.py
      - name: Clause inventory (manifest-SOURCES leg, armed)
        shell: bash
        run: python3 -I -B tools/check_clauses.py --genesis --with-manifest

      - name: Rule placement self-test (execution-reconciled)
        shell: bash
        run: python3 -I -B tools/check_selftest_execution.py --suite rule-placement-selftest
      - name: Rule placement
        shell: bash
        run: python3 -I -B tools/check_rule_placement.py
      - name: Applicability tags self-test
        shell: bash
        run: python3 -I -B tools/check_applies.py --self-test
      - name: Applicability tags
        shell: bash
        run: python3 -I -B tools/check_applies.py

      - name: Standards mappings
        shell: bash
        run: python3 -I -B tools/check_mappings.py
      - name: Cited standards repository corpus contract self-test
        shell: bash
        run: python3 -I -B .github/check_cited_standards_contract.py --self-test
      - name: Cited standards repository corpus contract
        shell: bash
        run: python3 -I -B .github/check_cited_standards_contract.py
      - name: Cited standards self-test
        shell: bash
        run: python3 -I -B tools/check_cited_standards.py --self-test
      # This repository only: the reviewed corpus adds the OPF prompt-pack members to the rule corpus; the gate
      # run without --config keeps the built-in default (the rule files alone). The config and the two .github
      # contract scripts are not shipped, so in a tree without them this gate, the newtab contract and the
      # cited-standards contract gate lines all exit 2 (cannot evaluate), and the shipped tools/run_all_checks.sh
      # there ends RESULT: FAIL. The repository contract above pins the whole invocation of this gate line
      # (--config .aiqt/cited-standards.toml and nothing else, so an appended --root or any other extra
      # argument is a finding even when both runners carry the same drifted line) and validates pack.toml
      # with its owning validator, opf/tools/check_opf_prompt_pack.py, imported and never re-implemented.
      - name: Cited standards
        shell: bash
        run: python3 -I -B tools/check_cited_standards.py --config .aiqt/cited-standards.toml

      - name: Conformance suite self-test
        shell: bash
        run: python3 -I -B tools/conformance.py --self-test

      - name: Conformance suite (reference install)
        shell: bash
        run: python3 -I -B tools/conformance.py --root .

      - name: CommonMark heading adapter self-test
        shell: bash
        run: python3 -I -B opf/tools/selftest_commonmark_headings.py

      - name: CommonMark conformance replay
        shell: bash
        run: python3 -I -B opf/tools/selftest_commonmark_conformance.py

      # Only the deterministic self-test runs here; the real time-dependent staleness audit lives in
      # the scheduled currency.yml, never on the PR path (see that workflow's header).
      - name: Standards currency self-test
        shell: bash
        run: python3 -I -B tools/check_standards_currency.py --self-test

      # The CWE importer's offline fixture self-test, with its #378 close vectors; never the network.
      - name: CWE importer self-test
        shell: bash
        run: python3 -I -B tools/import_cwe.py --self-test

      - name: CI parity self-test
        shell: bash
        run: python3 -I -B tools/check_ci_parity.py --self-test

      - name: CI parity
        shell: bash
        run: python3 -I -B tools/check_ci_parity.py

      - name: Git option table self-test
        shell: bash
        run: python3 -I -B tools/check_git_option_table.py --self-test

      - name: Git option table
        shell: bash
        run: python3 -I -B tools/check_git_option_table.py

      - name: Dangerous-API lint self-test
        shell: bash
        run: python3 -I -B tools/check_dangerous_api.py --self-test

      - name: Dangerous-API lint
        shell: bash
        run: python3 -I -B tools/check_dangerous_api.py

      # QA-suite foundation: the discovery-seam / result-contract adapter, the trivial reference audit
      # that proves the harness end to end, and the internal-name leak gate. Mirrors the same legs in
      # tools/run_all_checks.sh (roster symmetry). The advisory digest runs last: audit_reference.py
      # --digest always exits 0 on a finding, so an advisory finding never gates; only a tool crash fails.
      - name: QA adapter self-test
        shell: bash
        run: python3 -I -B tools/_qa_adapter.py --self-test
      - name: Reference audit self-test
        shell: bash
        run: python3 -I -B tools/audit_reference.py --self-test
      - name: Internal-name leak self-test
        shell: bash
        run: python3 -I -B tools/check_internal_names.py --self-test
      - name: Internal-name leak scan
        shell: bash
        run: python3 -I -B tools/check_internal_names.py
      - name: QA advisory digest (non-gating finding)
        shell: bash
        run: python3 -I -B tools/audit_reference.py --digest

  # The 3.6 checkout-byte-stability matrix: prove the .gitattributes eol=lf pinning defeats the worst
  # adopter setting on each supported platform. core.autocrlf true is set BEFORE the checkout, so the
  # fresh working tree below is materialized under the hostile setting; the byte-canon gate then runs
  # its own scan (LF only, no BOM, one trailing newline) over that tree. A CRLF conversion on checkout
  # would surface as a carriage-return finding, failing the job.
  byte-canon-matrix:
    name: Byte canon vectors (${{ matrix.os }})
    if: github.event_name == 'push' || (startsWith(github.head_ref, 'merge-train-') && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Hostile checkout line-ending setting (before checkout)
        shell: bash
        run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Child exit status observable (before any gate)
        shell: bash
        run: python3 -I -B opf/tools/_child_status.py

      - name: Byte canon self-test (vectors)
        shell: bash
        run: python3 -I -B tools/check_byte_canon.py --self-test
      - name: Byte canon (full gate on this platform)
        shell: bash
        run: python3 -I -B tools/check_byte_canon.py

  # The one required status of this workflow. GitHub reads a SKIPPED required job as passing, so
  # a plain needs: dependency is not enough: when a needed job fails or is cancelled, a job without
  # if: always() is skipped and the required status would read green. if: always() makes this job
  # run whatever the needed jobs concluded, also when the run is cancelled, and its step passes
  # only when every needed job concluded success; failure, cancelled, skipped, or any other
  # result fails it. needs: must list every other job in this workflow;
  # tools/check_ci_parity.py holds that coverage and the if: always() guard.
  quality:
    name: Quality gates
    if: always()
    needs:
      - secrets
      - site
      - opf-tooling
      - opf-closure-a
      - opf-closure-b
      - opf-closure-c
      - opf-closure-d
      - opf-closure-e
      - release
      - generated
      - selftest-execution
      - git-fixture-env-core
      - opf-host-patch
      - git-fixture-env-core-host-patch
      - git-fixture-env-config-combined-host-patch
      - git-fixture-env-config-malformed-host-patch
      - git-fixture-env-config-system-host-patch
      - registry
      - byte-canon-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Every quality job succeeded
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Needed job results: ${RESULTS}"
          rest="${RESULTS:-none}"
          rest="${rest//success/}"
          rest="${rest// /}"
          if [ -n "$rest" ]; then
            echo "Quality gates: FAILED, every needed job must conclude success"
            exit 1
          fi
          echo "Quality gates: PASS, every needed job concluded success"
