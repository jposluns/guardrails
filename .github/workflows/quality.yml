name: Quality

on:
  pull_request:
    branches: [main]
    # Only the labeled type schedules a pull request run. The merge lane applies the merge-train label
    # to the train pull request after each push it makes there; adding a label the pull request
    # already carries fires no labeled event (GitHub's behaviour, not verified live here), so to run
    # on the same head again it removes the label and adds it back. An open, a push, a reopen, a
    # retarget and a title/body edit schedule nothing, so a member head gets no Quality run at all:
    # its evidence is its named suites plus every generated-file --check and the manifest check, run
    # locally before its push (a process rule, not enforced per head), and the train pull request's
    # Quality run on the identical tree is the standing full evidence. Whenever the full
    # tools/run_all_checks.sh runs, it fails when gitleaks is not on PATH or reports another version
    # than the Secrets (gitleaks) step below pins. A label added to any other pull request into main
    # starts a run whose heavy jobs are skipped (the job-level if: below, the second layer), so its
    # Quality gates fails. A head with no run of this workflow reads as missing, never as passing:
    # ci-status.sh requires a completed successful run of this workflow FILE on every read.
    # tools/check_ci_parity.py holds these types to exactly [labeled].
    # no `edited`: it fires on a PR title/body edit AND on a base-branch retarget, and would re-run
    # every job here. The title/body side matters only to the message/metadata leak scan
    # (check_msg_leaks), which runs in msg-leaks.yml on every pull request into main, triggered on
    # `edited` too. A retarget alone therefore schedules no fresh Quality run; ci-status.sh
    # --require-base closes that gap. That invocation is the merge lane's own tooling: no
    # production caller in this repository passes the option (its behaviour self-test exercises
    # it). It refuses a run whose recorded
    # pull_request base is not the merge target AND requires a conforming run of this workflow
    # FILE (matched by the run's recorded path, never its display name), so a pre-retarget run is
    # never trusted and a lone msg-leaks run cannot stand in. Recovery: only a RETAINED
    # pre-retarget run forces a refresh push (a NEW head SHA), labelled again after it; a merely
    # missing Quality run is satisfied by a qualifying run on this same head, which removing and
    # re-adding the merge-train label schedules, and under --wait the check keeps polling for one
    # within its settle window before refusing.
    types: [labeled]
  push:
    branches: [main]

permissions:
  contents: read

# A newer run of the same pull request cancels its superseded run, which then reads red (Quality gates
# fails on a cancelled job), never green. A push run gets a group of its own (its run id), so a
# push-to-main run is never cancelled and never queued behind another run. A cancelled run stays on its
# commit and tools/ci-status.sh refuses a commit with any non-success run, so a cancelled run on a live
# head (a label added while its run is in progress, the merge-train label re-applied included, or a
# push back to an earlier head) needs a new head commit, labelled again. tools/check_ci_parity.py and
# tools/check_python_host_pin.py accept exactly this block.
concurrency:
  group: quality-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The gates run as parallel jobs, so the run takes about as long as its longest single step
  # rather than the sum of all of them. Every job repeats the same pinned checkout and setup:
  # fetch-depth: 0 gives the version-monotonicity gate the changelog.toml history it compares
  # base-vs-head; fetch-tags: true is explicit (depth-0 already fetches tags) so the tag layer, once
  # a release records a tag, sees real tag objects rather than an unfetched-but-present ambiguity.
  # Each gate runs as its own step so a failure names itself in the UI.
  # No step carries continue-on-error: a gate that cannot fail is decorative.
  # Every run: step binds shell: bash. GitHub documents a step-level shell as overriding the job's
  # default shell, and a job default as overriding a workflow default of the same name; that a step
  # shell overrides a workflow defaults.run.shell is inferred from the two. So neither default picks
  # the shell a gate runs under (a custom shell such as true {0} would exit 0 without running it).
  # The CI parity gate holds the line on every run: step, the Quality gates step included. The pin
  # does not close defaults.run.working-directory (workflow or job level): a step shell does not
  # override it and every gate is invoked by a relative path, so that route stays refused only where
  # the local runner runs check_ci_parity.
  # Within a job the steps keep their original relative order. The Quality gates job at the end
  # is the one required status of this workflow and aggregates every job (msg-leaks.yml is a second).
  # The heavy jobs (opf-tooling, selftest-execution, the git-fixture-env-core canary, the five host-patch
  # jobs and byte-canon-matrix) carry one pinned job-level if:,
  # so they run only on a push and on a pull request whose head is a merge-train-* branch of this
  # repository; every other job runs in every run. That if: is the second layer behind the labeled
  # trigger above, which already keeps a member head from running at all. In any other pull request
  # run (a label added to a pull request that is not a train) the heavy jobs are skipped
  # and Quality gates fails by design (skipped is not success): such a change merges only by riding a
  # train. tools/check_ci_parity.py accepts that if: line exactly, and only on those jobs.
  secrets:
    name: Secrets and leaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Child exit status observable (before any gate)
        shell: bash
        run: python3 -I -B opf/tools/_child_status.py

      - name: Secrets (project scanner)
        shell: bash
        run: python3 -I -B tools/check_secrets.py

      - name: Secret scan self-test
        shell: bash
        run: python3 -I -B tools/check_secrets.py --self-test

      # gitleaks is invoked as the MIT-licensed BINARY, pinned by version and verified
      # by checksum, rather than through gitleaks/gitleaks-action. The action reports
      # its licence as NOASSERTION and has required a licence key for organization
      # repositories; the binary avoids both that and a third-party action in the
      # supply chain. Bump GITLEAKS_VERSION and GITLEAKS_SHA256 together.
      - name: Secrets (gitleaks)
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -o gitleaks.tar.gz "$url"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks dir . --no-banner --redact --exit-code 1

      # The local runner requires this same gitleaks version on PATH (its live leg is local-only: the
      # step above downloads and verifies the pinned binary here); CI runs the gate's vectors. The gate
      # reads the pin only from the env: of the step above and refuses GITLEAKS_VERSION named anywhere
      # else in this file, outside a comment and that step's expansions of it.
      - name: Gitleaks pin self-test
        shell: bash
        run: python3 -I -B tools/check_gitleaks_pin.py --self-test

      - name: Leak denylist self-test
        shell: bash
        run: python3 -I -B tools/check_leaks.py --self-test
      - name: Leak denylist
        shell: bash
        run: python3 -I -B tools/check_leaks.py

      # check_leaks owns the FILE channel; check_msg_leaks (F-144) owns commit messages, PR title/body
      # and head ref, and runs in msg-leaks.yml so a title/body edit re-runs it alone.

      # Portability is DISTINCT from the leak gate: the leak gate answers a confidentiality question
      # repo-wide, this answers whether the shippable surface can land on a stranger's machine unchanged
      # (no operator identity outside its attribution, no repo-operational vocabulary, no exemption
      # markers, no unscannable file classes off the allow-list). See the gate header.
      - name: Portability self-test
        shell: bash
        run: python3 -I -B tools/check_portability.py --self-test
      - name: Portability
        shell: bash
        run: python3 -I -B tools/check_portability.py

      # Derive-don't-hardcode: an adopter-parameterized scan flagging a hardcoded target-specific literal
      # at an adopter-declared command sink (grdinp/exetgt). Adopter-declared: NOT APPLICABLE in this repo,
      # which ships no .aiqt/derived-command-parameters.toml.
      - name: Derived command parameters self-test
        shell: bash
        run: python3 -I -B tools/check_derived_command_parameters.py --self-test
      - name: Derived command parameters
        shell: bash
        run: python3 -I -B tools/check_derived_command_parameters.py

      # Relied exit pipes: an adopter-parameterized scan flagging an adopter-declared relied-on command
      # in a non-final pipeline stage of a declared script, where the pipe discards its exit (gatdis).
      # Adopter-declared: NOT APPLICABLE in this repo, which ships no .aiqt/relied-exit-pipes.toml.
      - name: Relied exit pipes self-test
        shell: bash
        run: python3 -I -B tools/check_relied_exit_pipes.py --self-test
      - name: Relied exit pipes
        shell: bash
        run: python3 -I -B tools/check_relied_exit_pipes.py

  site:
    name: Text and site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Child exit status observable (before any gate)
        shell: bash
        run: python3 -I -B opf/tools/_child_status.py

      - name: Dashes
        shell: bash
        run: python3 -I -B tools/check_no_dashes.py

      - name: Dashes self-test
        shell: bash
        run: python3 -I -B tools/check_no_dashes.py --self-test

      # This repository only: the gate's built-in default policy equals .aiqt/char-policy.json.
      - name: Dashes default parity
        shell: bash
        run: python3 -I -B tools/check_no_dashes.py --default-parity

      - name: Internal links
        shell: bash
        run: python3 -I -B tools/check_links.py

      - name: Site logo-consistency self-test
        shell: bash
        run: python3 -I -B tools/check_site.py --self-test

      - name: Site integrity
        shell: bash
        run: python3 -I -B tools/check_site.py

      - name: Overclaim lint self-test
        shell: bash
        run: python3 -I -B tools/check_overclaim.py --self-test

      - name: Overclaim lint
        shell: bash
        run: python3 -I -B tools/check_overclaim.py

      - name: License-qualification self-test
        shell: bash
        run: python3 -I -B tools/check_license_qualification.py --self-test

      - name: License-qualification lint
        shell: bash
        run: python3 -I -B tools/check_license_qualification.py

      - name: Footer coverage self-test
        shell: bash
        run: python3 -I -B tools/check_footer.py --self-test

      - name: Footer coverage
        shell: bash
        run: python3 -I -B tools/check_footer.py

      - name: New-tab repository coverage contract
        shell: bash
        run: python3 -I -B .github/check_newtab_contract.py

      - name: New-tab external links self-test
        shell: bash
        run: python3 -I -B tools/check_newtab.py --self-test

      - name: New-tab external links
        shell: bash
        run: python3 -I -B tools/check_newtab.py

      - name: Site version currency self-test
        shell: bash
        run: python3 -I -B tools/check_site_versions.py --self-test

      - name: Site version currency
        shell: bash
        run: python3 -I -B tools/check_site_versions.py

      - name: Render driver behaviour self-test
        shell: bash
        run: python3 -I -B tools/selftest_opf_render.py

  # The OPF tooling gates and direct self-tests run in this one '3.14' job, each step in its original
  # relative order. The opf.py self-test itself runs in CI once, whole, in the opf-host-patch job below;
  # no '3.14' job runs it or any opf.py --self-test-group step. The local runner runs it as its named
  # groups (SELF_TEST_GROUPS in opf/tools/opf.py; the selector runs nothing unless they hold every
  # registered self-test exactly once). tools/check_ci_parity.py holds, in its self-test, each group to
  # exactly one line of tools/run_all_checks.sh and no line here, and the whole self-test to exactly one
  # line here, in a heavy job.
  opf-tooling:
    name: OPF tooling gates (3.14)
    if: github.event_name == 'push' || (startsWith(github.head_ref, 'merge-train-') && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Child exit status observable (before any gate)
        shell: bash
        run: python3 -I -B opf/tools/_child_status.py

      - name: OPF homes contract self-test
        shell: bash
        run: python3 -I -B opf/tools/check_opf_homes.py --self-test

      - name: OPF homes contract drift gate
        shell: bash
        run: python3 -I -B opf/tools/check_opf_homes.py

      - name: OPF journal direct self-test
        shell: bash
        run: python3 -I -B opf/tools/_journal.py --self-test

      - name: OPF observe direct self-test
        shell: bash
        run: python3 -I -B opf/tools/_opf_observe.py --self-test

      - name: OPF render-drift gate self-test
        shell: bash
        run: python3 -I -B opf/tools/check_opf_drift.py --self-test

      - name: OPF render-drift gate
        shell: bash
        run: python3 -I -B opf/tools/check_opf_drift.py

      - name: OPF store-integrity gate self-test
        shell: bash
        run: python3 -I -B opf/tools/check_opf_doctor.py --self-test

      - name: OPF store-integrity gate
        shell: bash
        run: python3 -I -B opf/tools/check_opf_doctor.py

      - name: OPF record-authoring gate self-test
        shell: bash
        run: python3 -I -B opf/tools/check_opf_record.py --self-test --red-on-revert

      - name: OPF prompt-pack manifest drift gate self-test (PR7 slice 1)
        shell: bash
        run: python3 -I -B opf/tools/check_opf_prompt_pack.py --self-test

      - name: OPF prompt-pack manifest drift gate
        shell: bash
        run: python3 -I -B opf/tools/check_opf_prompt_pack.py

      - name: OPF enforcement-pack platform coverage gate self-test
        shell: bash
        run: python3 -I -B tools/check_opf_enforce_platforms.py --self-test

      - name: OPF enforcement-pack platform coverage gate
        shell: bash
        run: python3 -I -B tools/check_opf_enforce_platforms.py

      - name: OPF adoption schema and read-only planning self-test
        shell: bash
        run: python3 -I -B opf/tools/_opf_adopt.py --self-test

      - name: OPF adoption apply-shell self-test (clean-start adoption U1)
        shell: bash
        run: python3 -I -B opf/tools/_opf_adopt_apply.py --self-test

      - name: OPF adoption state self-test (homes-1 adoption control area and bounded adoption state)
        shell: bash
        run: python3 -I -B opf/tools/_opf_adopt_state.py --self-test

      - name: OPF adoption enable-hook merge-core self-test (PR3 slice 1)
        shell: bash
        run: python3 -I -B opf/tools/_opf_adopt_hook.py --self-test

      - name: OPF adoption completion evaluator self-test, checks 1 to 4 and 6 (PR5 slice 1)
        shell: bash
        run: python3 -I -B opf/tools/_opf_adopt_complete.py --self-test

      - name: OPF import batch parser self-test (inert until the import write mode lands)
        shell: bash
        run: python3 -I -B opf/tools/_opf_import_batch.py --self-test

      - name: OPF import completion per-source evaluator self-test
        shell: bash
        run: python3 -I -B opf/tools/_opf_import_complete.py --self-test

      - name: OPF pack manifest parser self-test
        shell: bash
        run: python3 -I -B opf/tools/_opf_pack_manifest.py --self-test

      - name: OPF adoption HTTPS observer and quarantine self-test
        shell: bash
        run: python3 -I -B opf/tools/_opf_adopt_observe.py --self-test

      - name: OPF adoption source-discovery self-test
        shell: bash
        run: python3 -I -B opf/tools/_opf_adopt_discover.py --self-test

      - name: OPF source-only init gate self-test
        shell: bash
        run: python3 -I -B opf/tools/check_opf_init.py --self-test

      - name: OPF source-only init gate
        shell: bash
        run: python3 -I -B opf/tools/check_opf_init.py

      - name: OPF init Keep-contract validator self-test
        shell: bash
        run: python3 -I -B opf/tools/_opf_init_contract.py --self-test

      - name: OPF init contract consistency gate self-test
        shell: bash
        run: python3 -I -B opf/tools/check_opf_init_contract.py --self-test

      - name: OPF init contract consistency gate
        shell: bash
        run: python3 -I -B opf/tools/check_opf_init_contract.py

      - name: OPF operation-lock self-test
        shell: bash
        run: python3 -I -B opf/tools/_opf_oplock.py --self-test

      - name: OPF init resume-substrate self-test
        shell: bash
        run: python3 -I -B opf/tools/_opf_init_substrate.py --self-test

      - name: OPF init builders self-test
        shell: bash
        run: python3 -I -B opf/tools/_opf_init.py --self-test

      - name: OPF init operation-layer self-test
        shell: bash
        run: python3 -I -B opf/tools/_opf_init_operation.py --self-test

      - name: OPF init P0 ratified-contracts self-test
        shell: bash
        run: python3 -I -B opf/tools/check_opf_init_p0.py --self-test --red-on-revert

      - name: OPF init raw-history reader self-test
        shell: bash
        run: python3 -I -B opf/tools/check_opf_init_observe.py --self-test --red-on-revert

  # The closure work is split between five jobs because the whole roster's worst case does not fit
  # one job's time limit, nor four once every leg whose command the config lanes also run is bounded
  # at or above the deadline those lanes give that command plus the launch margin (each leg bound
  # is a deliberate shorter deadline, its expiry reported as LEG BOUND EXCEEDED, exit 2); the gate's
  # own self-test checks the partition (every leg in exactly one job) and each job's worst case
  # against that job's limit, and the flip (negative leg) runs in the job whose legs hold
  # opf-tooling-selftest.
  opf-closure-a:
    name: OPF standalone closure A
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Child exit status observable (before any gate)
        shell: bash
        run: python3 -I -B opf/tools/_child_status.py

      - name: OPF standalone-closure gate self-test
        shell: bash
        run: python3 -I -B tools/check_opf_standalone_closure.py --self-test --ci-job opf-closure-a

      - name: OPF standalone-closure gate
        shell: bash
        run: python3 -I -B tools/check_opf_standalone_closure.py --ci-job opf-closure-a

  opf-closure-b:
    name: OPF standalone closure B
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Child exit status observable (before any gate)
        shell: bash
        run: python3 -I -B opf/tools/_child_status.py

      - name: OPF standalone-closure gate self-test
        shell: bash
        run: python3 -I -B tools/check_opf_standalone_closure.py --self-test --ci-job opf-closure-b

      - name: OPF standalone-closure gate
        shell: bash
        run: python3 -I -B tools/check_opf_standalone_closure.py --ci-job opf-closure-b

  opf-closure-c:
    name: OPF standalone closure C
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Child exit status observable (before any gate)
        shell: bash
        run: python3 -I -B opf/tools/_child_status.py

      - name: OPF standalone-closure gate self-test
        shell: bash
        run: python3 -I -B tools/check_opf_standalone_closure.py --self-test --ci-job opf-closure-c

      - name: OPF standalone-closure gate
        shell: bash
        run: python3 -I -B tools/check_opf_standalone_closure.py --ci-job opf-closure-c

  opf-closure-d:
    name: OPF standalone closure D
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Child exit status observable (before any gate)
        shell: bash
        run: python3 -I -B opf/tools/_child_status.py

      - name: OPF standalone-closure gate self-test
        shell: bash
        run: python3 -I -B tools/check_opf_standalone_closure.py --self-test --ci-job opf-closure-d

      - name: OPF standalone-closure gate
        shell: bash
        run: python3 -I -B tools/check_opf_standalone_closure.py --ci-job opf-closure-d

  opf-closure-e:
    name: OPF standalone closure E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Child exit status observable (before any gate)
        shell: bash
        run: python3 -I -B opf/tools/_child_status.py

      - name: OPF standalone-closure gate self-test
        shell: bash
        run: python3 -I -B tools/check_opf_standalone_closure.py --self-test --ci-job opf-closure-e

      - name: OPF standalone-closure gate
        shell: bash
        run: python3 -I -B tools/check_opf_standalone_closure.py --ci-job opf-closure-e

  release:
    name: Corpus, release and versioning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Child exit status observable (before any gate)
        shell: bash
        run: python3 -I -B opf/tools/_child_status.py

      - name: Corpus-core library self-test
        shell: bash
        run: python3 -I -B tools/selftest_aiqt_corpus.py

      - name: Roadmap drift
        shell: bash
        run: python3 -I -B tools/gen_roadmap.py --check

      - name: Changelog drift
        shell: bash
        run: python3 -I -B tools/gen_changelog.py --check

      - name: Version format and single-source
        shell: bash
        run: python3 -I -B tools/check_versions.py

      - name: Release cut self-test
        shell: bash
        run: python3 -I -B tools/check_release_cut.py --self-test --red-on-revert

      - name: Release cut
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python3 -I -B tools/check_release_cut.py
          else
            # Check every first-parent transition in the pushed range.
            python3 -I -B tools/check_release_cut.py --protected "origin/${GITHUB_REF_NAME}" --base "$PUSH_BEFORE"
          fi

      - name: Version monotonicity self-test
        shell: bash
        run: python3 -I -B tools/check_version_monotonicity.py --self-test

      # The baseline differs by trigger: a pull_request compares against its target branch
      # (origin/$GITHUB_BASE_REF, the auto-set trusted branch name); a push probes HEAD^ first and
      # passes it as --base when it resolves, otherwise invokes the gate with no --base so the gate's
      # own root detection decides (a genuine root: NOT APPLICABLE; a shallow or broken-parent
      # history: fail-closed). The rev-parse probe is an if-guard, so its nonzero exit on a first
      # push (no HEAD^) does not abort the step under set -e.
      - name: Version monotonicity
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python3 -I -B tools/check_version_monotonicity.py --base "origin/${GITHUB_BASE_REF}"
          elif git rev-parse --verify --quiet "HEAD^" >/dev/null; then
            python3 -I -B tools/check_version_monotonicity.py --base "HEAD^"
          else
            python3 -I -B tools/check_version_monotonicity.py
          fi

      - name: Branch root self-test
        shell: bash
        run: python3 -I -B tools/check_branch_root.py --self-test

      - name: Branch root
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python3 -I -B tools/check_branch_root.py --protected "origin/${GITHUB_BASE_REF}" --head "$PR_HEAD_SHA" --max-lag 200
          else
            # On push to main, HEAD is the protected line itself, so this branch is a SELF-CHECK (main vs
            # origin/main resolves to main with zero lag). The pull_request job above, which compares the
            # PR head against its target branch, is the effective branch-root gate; this push job only
            # keeps the gate wired and green on the protected line.
            python3 -I -B tools/check_branch_root.py --protected "origin/${GITHUB_REF_NAME}" --max-lag 200
          fi

      - name: Release delta self-test
        shell: bash
        run: python3 -I -B tools/check_release_delta.py --self-test
      - name: Release delta
        shell: bash
        run: python3 -I -B tools/check_release_delta.py
      - name: Release build self-test
        shell: bash
        run: python3 -I -B tools/check_release_build.py --self-test
      - name: Release build
        shell: bash
        run: python3 -I -B tools/check_release_build.py

      - name: Clause inventory self-test
        shell: bash
        run: python3 -I -B tools/check_clauses.py --self-test
      - name: Clause inventory
        shell: bash
        run: python3 -I -B tools/check_clauses.py --genesis

      # VER-CORE Section 12 step 6 (VC-6): migration engine, crosswalk tooling, archive. The crash-
      # injection self-test is the mandatory 9.3 gate; the live check_crosswalk leg reports NOT
      # APPLICABLE in this repo (the pack is not an adopter install), self-tested first over synthetic
      # trees. Mirrors the same legs in tools/run_all_checks.sh (roster symmetry).
      - name: Crosswalk generator self-test
        shell: bash
        run: python3 -I -B tools/gen_crosswalk.py --self-test
      - name: Crosswalk schema drift
        shell: bash
        run: python3 -I -B tools/gen_crosswalk.py --check
      - name: Crosswalk gate self-test
        shell: bash
        run: python3 -I -B tools/check_crosswalk.py --self-test
      - name: Crosswalk gate
        shell: bash
        run: python3 -I -B tools/check_crosswalk.py
      - name: Migration engine crash-injection self-test
        shell: bash
        run: python3 -I -B tools/migrate.py --self-test
      # VER-CORE Section 12 step 7 (VC-7): pin lifecycle (pin.py) and the core doctor (doctor.py). The
      # self-tests cover the plan-4.5 scenarios over synthetic installs; the live doctor leg reports NOT
      # APPLICABLE in this repo (the pack is not an adopter install). The doctor is READ-ONLY by default.
      - name: Pin lifecycle self-test
        shell: bash
        run: python3 -I -B tools/pin.py --self-test
      - name: Doctor self-test
        shell: bash
        run: python3 -I -B tools/doctor.py --self-test
      - name: Doctor (read-only, NA in this repo)
        shell: bash
        run: python3 -I -B tools/doctor.py --root .

