name: Weekly self-tests

# A scheduled run of the full self-test suites on main, deliberately SEPARATE from the Quality workflow.
# quality.yml runs only on a labelled merge-train pull request and on a push to main, so a week with no
# merge runs no self-test at all, while the runner image, its git and the newest 3.14 patch release can
# still move under an unchanged tree. This workflow runs every self-test command tools/run_all_checks.sh
# and quality.yml run, weekly and on manual dispatch, so such drift turns this scheduled run red in the
# Actions tab without ever blocking a pull request. It is not a required status and gates nothing.
#
# Two live legs run here because their verdict depends on the runner, not only on the tree: the git
# option table gate (the installed git's help against the hook's option table) and the byte-canon
# gate over a checkout made under core.autocrlf true, each as quality.yml runs it. The other live
# gates and drift checks judge the tree itself, which quality.yml judged on the push that made it,
# so they are not repeated. The local runner's three opf.py --self-test-group lines are not repeated
# either: the one whole opf.py --self-test below runs the same registered self-tests. Every command
# of tools/run_all_checks.sh and quality.yml not run here is listed with its reason in
# WEEKLY_EXCLUSIONS in tools/check_ci_parity.py, which fails on a command in neither place.
# Each job keeps the checkout and Python setup of its quality.yml counterpart except these:
# opf-selftest runs on ubuntu-latest with '3.14' where quality.yml's opf-host-patch uses ubuntu-24.04
# with the host patch release, and the four git-fixture-env jobs pin '3.14' on ubuntu-24.04 where
# quality.yml runs git-fixture-env-core on ubuntu-latest and its host-patch jobs, the three config
# lanes among them, pin the host patch release. The child-status probe stays the step right after the
# Python setup step of every job.

on:
  schedule:
    # 07:23 UTC every Tuesday. Off Monday and off the top of the hour to avoid the scheduler herd, and
    # away from the monthly currency.yml slot.
    - cron: '23 7 * * 2'
  workflow_dispatch:

permissions:
  contents: read

