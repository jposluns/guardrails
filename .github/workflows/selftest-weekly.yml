  registry:
    name: Records, manifest and parity self-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Child exit status observable (before any gate)
        shell: bash
        run: python3 -I -B opf/tools/_child_status.py

      - name: Record-drift self-test
        shell: bash
        run: python3 -I -B tools/check_record_drift.py --self-test

      - name: Record-section preservation self-test
        shell: bash
        run: python3 -I -B tools/check_record_sections.py --self-test

      - name: Mistakes-register self-test
        shell: bash
        run: python3 -I -B tools/check_mistakes_register.py --self-test

      - name: Mistakes-register append self-test
        shell: bash
        run: python3 -I -B tools/orch_register.py --self-test

      - name: AEI enumerator self-test
        shell: bash
        run: python3 -I -B tools/aei_backlog_md.py --self-test

      - name: Skill self-test
        shell: bash
        run: python3 -I -B tools/gen_skill.py --self-test

      - name: Gensrc registry self-test
        shell: bash
        run: python3 -I -B tools/gen_gensrc.py --self-test

      - name: Gensrc fail-close self-test
        shell: bash
        run: python3 -I -B tools/check_gensrc_failclose.py --self-test

      - name: Enforceability ledger self-test
        shell: bash
        run: python3 -I -B tools/gen_enforceability.py --self-test

      - name: Enforcement register self-test
        shell: bash
        run: python3 -I -B tools/gen_enforcement_register.py --self-test

      - name: Launcher isolation self-test
        shell: bash
        run: python3 -I -B tools/check_python_launcher_isolation.py --self-test

      - name: Python floor self-test (execution-reconciled)
        shell: bash
        run: python3 -I -B tools/check_selftest_execution.py --suite python-floor-selftest

      # Only the self-test: its vectors run main() against a stand-in interpreter version, while the
      # live leg fails on any release but the host patch, which this file cannot pin.
      - name: Python host pin self-test
        shell: bash
        run: python3 -I -B tools/check_python_host_pin.py --self-test

      - name: Renderer declaration self-test
        shell: bash
        run: python3 -I -B tools/gen_renderers.py --self-test

      - name: Manifest generator self-test
        shell: bash
        run: python3 -I -B tools/gen_manifest.py --self-test

      - name: Manifest integrity self-test
        shell: bash
        run: python3 -I -B tools/check_manifest.py --self-test

      - name: Byte canon self-test
        shell: bash
        run: python3 -I -B tools/check_byte_canon.py --self-test

      - name: Rule placement self-test (execution-reconciled)
        shell: bash
        run: python3 -I -B tools/check_selftest_execution.py --suite rule-placement-selftest

      - name: Applicability tags self-test
        shell: bash
        run: python3 -I -B tools/check_applies.py --self-test

      - name: Cited standards repository corpus contract self-test
        shell: bash
        run: python3 -I -B .github/check_cited_standards_contract.py --self-test

      - name: Cited standards self-test
        shell: bash
        run: python3 -I -B tools/check_cited_standards.py --self-test

      - name: Conformance suite self-test
        shell: bash
        run: python3 -I -B tools/conformance.py --self-test

      - name: CommonMark heading adapter self-test
        shell: bash
        run: python3 -I -B opf/tools/selftest_commonmark_headings.py

      - name: CommonMark conformance replay
        shell: bash
        run: python3 -I -B opf/tools/selftest_commonmark_conformance.py

      - name: Standards currency self-test
        shell: bash
        run: python3 -I -B tools/check_standards_currency.py --self-test

      - name: CWE importer self-test
        shell: bash
        run: python3 -I -B tools/import_cwe.py --self-test

      - name: CI parity self-test
        shell: bash
        run: python3 -I -B tools/check_ci_parity.py --self-test

      - name: Git option table self-test
        shell: bash
        run: python3 -I -B tools/check_git_option_table.py --self-test

      # Live: compares the runner's installed git help with the hook's option table.
      - name: Git option table
        shell: bash
        run: python3 -I -B tools/check_git_option_table.py

      - name: Dangerous-API lint self-test
        shell: bash
        run: python3 -I -B tools/check_dangerous_api.py --self-test

      - name: QA adapter self-test
        shell: bash
        run: python3 -I -B tools/_qa_adapter.py --self-test

      - name: Reference audit self-test
        shell: bash
        run: python3 -I -B tools/audit_reference.py --self-test

      - name: Internal-name leak self-test (execution-reconciled)
        shell: bash
        run: python3 -I -B tools/check_selftest_execution.py --suite internal-names-selftest

  # The byte-canon vectors and live gate on both platforms quality.yml covers. As there,
  # core.autocrlf true is set BEFORE the checkout, so the working tree is materialized by the runner's
  # git under the hostile setting and a CRLF conversion surfaces as a carriage-return finding.
  byte-canon-matrix:
    name: Byte canon vectors (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Hostile checkout line-ending setting (before checkout)
        shell: bash
        run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Child exit status observable (before any gate)
        shell: bash
        run: python3 -I -B opf/tools/_child_status.py

      - name: Byte canon self-test (vectors)
        shell: bash
        run: python3 -I -B tools/check_byte_canon.py --self-test
      - name: Byte canon (full gate on this platform)
        shell: bash
        run: python3 -I -B tools/check_byte_canon.py
