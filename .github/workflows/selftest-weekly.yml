  secrets-site:
    name: Secrets, leaks and site self-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Child exit status observable (before any gate)
        shell: bash
        run: python3 -I -B opf/tools/_child_status.py

      - name: Secret scan self-test
        shell: bash
        run: python3 -I -B tools/check_secrets.py --self-test

      - name: Gitleaks pin self-test
        shell: bash
        run: python3 -I -B tools/check_gitleaks_pin.py --self-test

      - name: Leak denylist self-test
        shell: bash
        run: python3 -I -B tools/check_leaks.py --self-test

      # quality.yml does not run this one; its live scan needs pull request event context and lives in
      # msg-leaks.yml. The local runner runs the self-test, so it runs here too.
      - name: Message leak scan self-test
        shell: bash
        run: python3 -I -B tools/check_msg_leaks.py --self-test

      - name: Portability self-test
        shell: bash
        run: python3 -I -B tools/check_portability.py --self-test

      - name: Derived command parameters self-test
        shell: bash
        run: python3 -I -B tools/check_derived_command_parameters.py --self-test

      - name: Relied exit pipes self-test
        shell: bash
        run: python3 -I -B tools/check_relied_exit_pipes.py --self-test

      - name: Dashes self-test
        shell: bash
        run: python3 -I -B tools/check_no_dashes.py --self-test

      - name: Site logo-consistency self-test
        shell: bash
        run: python3 -I -B tools/check_site.py --self-test

      - name: Overclaim lint self-test
        shell: bash
        run: python3 -I -B tools/check_overclaim.py --self-test

      - name: License-qualification self-test
        shell: bash
        run: python3 -I -B tools/check_license_qualification.py --self-test

      - name: Footer coverage self-test
        shell: bash
        run: python3 -I -B tools/check_footer.py --self-test

      - name: New-tab external links self-test
        shell: bash
        run: python3 -I -B tools/check_newtab.py --self-test

      - name: Site version currency self-test
        shell: bash
        run: python3 -I -B tools/check_site_versions.py --self-test

