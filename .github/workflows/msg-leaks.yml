name: Message leaks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  msg-leaks:
    name: Message/metadata leaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # The special-file precheck runs first here as in every job of every workflow
      # (check_ci_parity holds every job to that order); the first job of quality.yml states what
      # it refuses and why the shell test on its first run line comes before the interpreter.
      - name: Special-file precheck
        shell: bash
        run: |
          [ -f tools/_gen_common.py ] && ! [ -h tools/_gen_common.py ] || { echo "error: tools/_gen_common.py: not a regular non-symlink file; cannot run the special-file precheck; fail-closed" >&2; exit 2; }
          python3 -I -B tools/_gen_common.py --precheck

      - name: Message/metadata leak self-test
        shell: bash
        run: python3 -I -B tools/check_msg_leaks.py --self-test
      - name: Message/metadata leak scan
        shell: bash
        run: python3 -I -B tools/check_msg_leaks.py
