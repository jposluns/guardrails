name: Message leaks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  msg-leaks:
    name: Message/metadata leaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'

      - name: Child exit status observable (before any gate)
        shell: bash
        run: python3 -I -B opf/tools/_child_status.py

      - name: Message/metadata leak self-test
        shell: bash
        run: python3 -I -B tools/check_msg_leaks.py --self-test
      - name: Message/metadata leak scan
        shell: bash
        run: python3 -I -B tools/check_msg_leaks.py
