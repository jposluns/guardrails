# The link-preview card data of aiqt.ai for .baseline/build_card.js (baseline 1.11.1), in the shape of
# the template's tools/site-card.example.toml. Not served. The served card, site/assets/aiqt-og.png, is the
# owner-approved image from pull request #973 and changes only on the owner's instruction. Neither this
# builder nor tools/render_og_cards.py reproduces it, so neither is run over it without that instruction. Here
# the copy is the owner's approved card text, and the colours are the family card colours with the site's dark --brand (#4495ea). Change the copy, colours or illustration only on the owner's instruction.

site = "aiqt"
name = "AIQT"
tld = ".ai"
line1 = "Rules your AI follows."
line2 = "Controls that catch what slips."
sub = "You cannot tell from the tone whether an assistant knows or is guessing."
art = "../site/draft/assets/baseline/logos/aiqt-card.svg"
word_colour = "#4495ea"
background = "radial-gradient(900px 620px at 1040px 560px,rgba(68,149,234,.4),rgba(68,149,234,0) 60%),radial-gradient(700px 500px at 120px 60px,rgba(41,64,102,.7),rgba(41,64,102,0) 60%),#0b1730"
layout = "centre"
